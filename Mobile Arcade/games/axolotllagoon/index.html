<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bdeeed">
<title>Axolotl Lagoon</title>
<style>
/* =====================================================================
   AXOLOTL LAGOON — styles
   Soft pastel aqua + pink. Change the colors here to restyle the game.
===================================================================== */
:root{
  --aqua:#c9f1f0; --aqua2:#3fc1b8; --pink:#ffd9e4; --pink2:#ff8fb1;
  --lav:#e6dcff; --lav2:#a58cff; --lemon:#fff3b8; --lemon2:#ffd34d;
  --sky:#d6efff; --sky2:#5fb2f0; --coral:#ff8a7a;
  --ink:#30506a; --ink2:#6b8296; --card:#fffefb; --line:#d7eeee;
  --gold:#ffc83d; --good:#3fbf8f; --bad:#ff6b81;
  --r:18px; --font:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#eafaf9;color:var(--ink);font-family:var(--font);font-size:calc(15px * var(--fs))}
body.easy{--font:Verdana,"Segoe UI",Tahoma,sans-serif;letter-spacing:.04em;word-spacing:.12em;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font-family:inherit;font-size:16px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* pearl icon (drawn with CSS, no image) */
.pl{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:-.13em;
  background:radial-gradient(circle at 35% 30%,#fff 0 16%,#fff6fb 28%,#ecdcea 68%,#c9b6d2);box-shadow:0 1px 0 #0002,inset 0 0 0 1px #fff8}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:linear-gradient(#f4fffe,#d9f5f3);border-bottom:2px solid #b9e6e3;z-index:20}
.pill{display:flex;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:5px 10px 5px 7px;font-weight:900;box-shadow:0 2px 0 #b9e2e0;white-space:nowrap;min-width:0;font-size:1em}
.pill .ic{font-size:18px;line-height:1}
.pill .pl{width:18px;height:18px}
.pill.lv{flex:1;max-width:200px;min-width:70px}
.xpbar{flex:1;height:9px;background:#e4f3f2;border-radius:9px;overflow:hidden;min-width:30px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua2),var(--pink2));border-radius:9px;transition:width .4s}
#boosts{display:flex;gap:3px;overflow:hidden;flex-wrap:nowrap}
.bst{font-size:11px;font-weight:900;background:var(--lemon);border-radius:99px;padding:3px 7px;white-space:nowrap}
.roundBtn{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 0 #b9e2e0;display:grid;place-items:center;flex:none;font-size:20px;overflow:hidden}
#muteBtn{margin-left:auto}
#profBtn svg{width:40px;height:34px}
@media (max-width:420px){#boosts .bst:nth-child(n+2){display:none}.pill{padding:4px 8px 4px 5px}}
/* ---------- body / nav ---------- */
#body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#main{flex:1;position:relative;min-width:0;overflow:hidden}
#nav{display:flex;justify-content:space-around;background:#fff;border-top:2px solid #b9e6e3;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:14px;font-size:12px;font-weight:900;color:var(--ink2);position:relative;min-height:54px}
#nav button .e{font-size:25px;line-height:1.1}
#nav button.on{background:var(--aqua);color:var(--ink)}
.dot{position:absolute;top:3px;right:24%;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid #fff;display:none}
.dot.show{display:block}
@media (min-width:820px){
  #body{flex-direction:row-reverse}
  #nav{flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:2px solid #b9e6e3;padding:10px 8px;width:96px}
  #nav button{flex:none;padding:10px 0}
  .view .inner{max-width:760px;margin:0 auto}
}
/* ---------- views ---------- */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding:12px 12px 30px;-webkit-overflow-scrolling:touch;background:#f0fbfa}
.view.on{display:block}
#vLagoon{padding:0;overflow:hidden;background:#9fdcec}
h2{margin:4px 0 10px;font-size:1.35em}
h3{margin:14px 0 8px;font-size:1.08em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:9px 14px;border-radius:99px;background:#fff;font-weight:900;box-shadow:0 2px 0 var(--line)}
.tabs button.on{background:var(--pink);box-shadow:0 2px 0 #f5b8c9}
.card{background:var(--card);border-radius:var(--r);padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:8px;box-shadow:0 3px 0 var(--line);position:relative}
.card .art{width:62px;height:62px;flex:none;border-radius:14px;background:var(--aqua);display:grid;place-items:center;font-size:32px;overflow:hidden}
.card .art svg{width:60px;height:46px}
.card .info{flex:1;min-width:0}
.nm{font-weight:900}
.sub{font-size:.86em;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{background:var(--card);border-radius:16px;padding:8px 4px 6px;text-align:center;box-shadow:0 3px 0 var(--line);position:relative;font-size:.84em;font-weight:900}
.tile svg{width:84px;height:62px;display:block;margin:0 auto}
.tile .big{font-size:38px;line-height:62px;height:62px}
.tile.lock{background:#eef4f4}
.tile.lock svg{filter:brightness(0) opacity(.18)}
.btn{background:var(--pink2);color:#fff;font-weight:900;padding:10px 15px;border-radius:14px;box-shadow:0 3px 0 #dd6f92;white-space:nowrap;min-height:42px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #dd6f92}
.btn.mint{background:var(--aqua2);box-shadow:0 3px 0 #2a9790}
.btn.lav{background:var(--lav2);box-shadow:0 3px 0 #7c62dd}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 3px 0 #d79d12}
.btn.sky{background:var(--sky2);box-shadow:0 3px 0 #3f8ad6}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.wide{display:block;width:100%;margin-top:8px;padding:13px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.btn.sm{padding:7px 11px;font-size:.88em;min-height:38px}
.tag{display:inline-block;font-size:.74em;font-weight:900;padding:2px 7px;border-radius:99px;background:var(--lemon);vertical-align:middle}
.r0{background:#e9f1f1}.r1{background:#d6ecff}.r2{background:linear-gradient(90deg,#ffd3e4,#d4f7ff,#fff3b0)}.r3{background:linear-gradient(90deg,#ffe4f1,#e7dcff)}
.bar{height:11px;border-radius:9px;background:#e6f2f2;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:9px}
.mood{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:.92em;font-weight:900}
.mood span{width:26px;text-align:center}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--ink2);font-size:.86em}
.center{text-align:center}
.hearts{letter-spacing:-1px}
.swatch{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-3px;border:2px solid #fff;box-shadow:0 1px 0 #0002}
.seg{display:flex;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.seg button{flex:1;padding:9px 6px;font-weight:900}
.seg button.on{background:var(--aqua)}
/* ---------- lagoon scene ---------- */
#scene{position:absolute;inset:0;overflow:hidden;touch-action:none}
#sceneBg{position:absolute;inset:0;width:100%;height:100%}
#props,#glowL{position:absolute;inset:0;pointer-events:none}
.prop{position:absolute;transform:translate(-50%,-100%)}
.prop svg{width:100%;height:100%;display:block;overflow:visible}
.prop.glowp svg{filter:drop-shadow(0 0 4px var(--gc)) drop-shadow(0 0 10px var(--gc))}
.halo{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,var(--gc) 0,transparent 68%);opacity:.35;mix-blend-mode:screen;animation:halo 3s ease-in-out infinite alternate}
@keyframes halo{from{opacity:.25}to{opacity:.45}}
.ray{animation:ray 6s ease-in-out infinite alternate}
@keyframes ray{from{opacity:.25}to{opacity:.6}}
.speck{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gc);box-shadow:0 0 8px var(--gc);animation:speck 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes speck{from{transform:translate(0,0);opacity:.2}to{transform:translate(14px,-30px);opacity:.9}}
.petal{position:absolute;top:-20px;font-size:14px;pointer-events:none;animation:petal linear infinite}
@keyframes petal{to{transform:translate(40px,110vh) rotate(360deg)}}
#dark{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,#1d2a5a,#0b1030);opacity:0;transition:opacity 1.2s}
#axos,#fxL{position:absolute;inset:0}
#fxL{pointer-events:none;z-index:9}
.axo{position:absolute;width:90px;height:63px;margin:-40px 0 0 -45px;will-change:left,top,transform;touch-action:none;z-index:3}
.axo .flip{width:100%;height:100%;transition:transform .35s}
.axo svg{width:100%;height:100%;overflow:visible;display:block}
.axo .bob{transform-origin:50% 60%;animation:float 2.6s ease-in-out infinite}
.axo.swim .bob{animation:swimA .9s ease-in-out infinite}
.axo.nap .bob{animation:breathe 3.6s ease-in-out infinite}
.axo.pop .bob{animation:pop .4s ease}
.axo .gills{transform-box:fill-box;transform-origin:85% 85%;animation:gill 2.4s ease-in-out infinite}
.axo.happy .gills{animation:gillFast .18s ease-in-out 8 alternate}
.axo .tail{transform-box:fill-box;transform-origin:100% 50%;animation:tail 1.8s ease-in-out infinite}
.axo.swim .tail{animation-duration:.6s}
.axo .zz{position:absolute;top:-8px;right:4px;font-size:15px;font-weight:900;color:#7a6ac9;animation:zz 2s infinite}
.axo .bub{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:18px;background:#fff;border-radius:12px;padding:0 5px;box-shadow:0 2px 0 #0002;white-space:nowrap}
.axo.sel::after{content:"";position:absolute;left:15%;right:15%;bottom:-6px;height:8px;border-radius:50%;background:#fff8;box-shadow:0 0 10px #fff}
.axo.baby{width:62px;height:44px;margin:-28px 0 0 -31px}
.axo.visitor .bob{filter:drop-shadow(0 0 6px #fff)}
.axo .bob svg{filter:brightness(var(--dim,1))}
.glowOn .axo.glowy .bob svg{filter:drop-shadow(0 0 7px var(--gc)) drop-shadow(0 0 14px var(--gc))}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5px) rotate(1.5deg)}}
@keyframes swimA{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(3px) rotate(3deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.96)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22,.82)}70%{transform:scale(.92,1.12)}100%{transform:scale(1)}}
@keyframes gill{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes gillFast{from{transform:rotate(-12deg) scale(1)}to{transform:rotate(12deg) scale(1.08)}}
@keyframes tail{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
.fx{position:absolute;pointer-events:none;font-size:21px;font-weight:900;z-index:9;animation:fxup 1.1s ease-out forwards;white-space:nowrap;text-shadow:0 2px 0 #fff}
@keyframes fxup{from{opacity:1;transform:translate(-50%,0) scale(.7)}30%{transform:translate(-50%,-14px) scale(1.15)}to{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.bbl{position:absolute;bottom:-20px;border-radius:50%;border:2px solid #ffffffaa;background:radial-gradient(circle at 30% 30%,#fff9 0 20%,#fff2 50%,transparent 70%);pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translate(var(--dx),-110vh)}}
#areaName{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fffd;border-radius:99px;padding:3px 6px;font-weight:900;z-index:10;white-space:nowrap;display:flex;gap:4px;align-items:center;box-shadow:0 2px 0 #0001}
#areaName button{font-size:20px;width:38px;height:38px;border-radius:50%}
#areaName button[disabled]{opacity:.25}
#eggs{position:absolute;top:58px;left:8px;display:flex;flex-direction:column;gap:7px;z-index:10}
.eggslot{width:58px;height:66px;background:#fffd;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:900;position:relative;box-shadow:0 3px 0 #0002}
.eggslot svg{width:36px;height:42px}
.eggslot.ready{animation:wob .6s ease-in-out infinite alternate;background:var(--lemon)}
@keyframes wob{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.eggslot .pb{position:absolute;bottom:4px;left:6px;right:6px;height:5px;background:#e8eef0;border-radius:4px;overflow:hidden}
.eggslot .pb i{display:block;height:100%;background:var(--aqua2)}
#sideR{position:absolute;top:58px;right:8px;display:flex;flex-direction:column;gap:8px;z-index:10}
.fab{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #0002;font-size:26px;display:grid;place-items:center;position:relative}
.fab small{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;background:#fff;border-radius:6px;padding:0 4px;white-space:nowrap}
.fab .bdg{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;font-size:11px;font-weight:900;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 4px}
.fab.on{background:#2b2e66;color:#fff}
.fab.on small{color:var(--ink)}
.fab.glow{animation:wob .6s ease-in-out infinite alternate}
#careBar{position:absolute;left:8px;right:8px;bottom:10px;z-index:10;display:flex;justify-content:center}
#careBar .cb{background:#fffe;border-radius:20px;padding:8px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 #0002;max-width:520px;width:100%}
#careBar .cb .who{flex:1;min-width:0;font-weight:900;line-height:1.2}
#careBar .cb .who small{display:block;font-weight:700;color:var(--ink2);font-size:.8em}
#careBar .cbtn{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:900;background:var(--aqua);border-radius:14px;padding:5px 6px;min-width:56px;min-height:52px;justify-content:center}
#careBar .cbtn b{font-size:22px;line-height:1}
#careBar .hint{background:#fffd;border-radius:99px;padding:8px 14px;font-weight:900;box-shadow:0 3px 0 #0002}
/* ---------- modal ---------- */
#modalBg{position:fixed;inset:0;background:#1d3a4a66;display:none;z-index:50;align-items:center;justify-content:center;padding:14px}
#modalBg.on{display:flex}
#modal{background:#fff;border-radius:24px;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;padding:16px;box-shadow:0 10px 40px #0003;animation:mIn .25s ease;position:relative}
@keyframes mIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#modal h2{text-align:center;margin-top:0;padding:0 30px}
#mClose{position:absolute;top:8px;right:10px;font-size:22px;width:40px;height:40px;border-radius:50%;background:#eef7f7}
.reward{text-align:center}
.reward .big{font-size:60px;line-height:1.1}
.reward .big svg{width:180px;height:126px}
.reward .amt{font-size:1.5em;font-weight:900;margin:6px 0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.tst{background:#fff;border-radius:14px;padding:10px 15px;font-weight:900;box-shadow:0 4px 14px #0002;animation:tIn .3s ease;max-width:100%;text-align:center}
.tst.gold{background:var(--lemon)}.tst.err{background:#ffe0e5}
@keyframes tIn{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.pickGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:44vh;overflow-y:auto;padding:2px}
.pickGrid button{background:#f2fbfb;border-radius:14px;padding:4px;font-weight:900;font-size:.8em;border:3px solid transparent}
.pickGrid button svg{width:80px;height:56px;display:block;margin:0 auto}
.pickGrid button.on{border-color:var(--pink2);background:var(--pink)}
.pickGrid button[disabled]{opacity:.35}
/* ---------- mini games ---------- */
#game{position:fixed;inset:0;z-index:60;background:#9fdcec;display:none;touch-action:none}
#game.on{display:block}
#gCanvas{position:absolute;inset:0;width:100%;height:100%}
#gHud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:2;font-weight:900;font-size:1.1em;gap:6px}
#gOver{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#1d3a4a55;z-index:3;padding:16px}
#gOver.on{display:flex}
#gOver .box{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:360px;text-align:center}
#gIntro{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:3;padding:16px;background:#1d3a4a44}
#gIntro.on{display:flex}
#gIntro .box{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:360px;text-align:center}
/* ---------- loading ---------- */
#load{position:fixed;inset:0;z-index:100;background:linear-gradient(#dff8f6,#ffe3ec);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .6s}
#load .logo{font-size:2.3em;font-weight:900;color:#ff7fa6;text-shadow:0 3px 0 #fff;text-align:center;line-height:1.05}
#load .wd{width:150px;height:105px;animation:float 1.2s ease-in-out infinite}
#load .wd svg{width:100%;height:100%}
#load .tip{max-width:300px;text-align:center;font-weight:800;color:var(--ink2);padding:0 20px}
#load .lbar{width:200px;height:11px;background:#fff;border-radius:9px;overflow:hidden}
#load .lbar i{display:block;height:100%;width:0;background:var(--pink2);transition:width .3s}
/* ---------- tutorial ---------- */
#tut{position:fixed;left:8px;right:8px;z-index:45;display:none;pointer-events:none}
#tut.on{display:flex;justify-content:center}
#tut .box{pointer-events:auto;background:#fff;border-radius:20px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px #0003;max-width:460px;width:100%;border:3px solid var(--lemon2)}
#tut #tutCap svg{width:64px;height:45px;flex:none}
#tut .tx{flex:1;font-weight:900;font-size:.95em}
.hl{outline:4px solid var(--lemon2)!important;outline-offset:2px;animation:hlp 1s infinite alternate;z-index:44}
@keyframes hlp{from{outline-color:var(--lemon2)}to{outline-color:var(--pink2)}}
</style>
</head>
<body>
<div id="load">
  <div class="logo">Axolotl<br>Lagoon</div>
  <div class="wd" id="loadAxo"></div>
  <div class="lbar"><i id="loadBar"></i></div>
  <div class="tip" id="loadTip"></div>
</div>
<div id="app">
  <div id="top">
    <button class="pill" id="pPearl"><i class="pl"></i><span id="vPearl">0</span></button>
    <button class="pill" id="pCrys"><span class="ic">💎</span><span id="vCrys">0</span></button>
    <button class="pill lv" id="pLevel"><span class="ic">⭐</span><span id="vLevel">1</span><span class="xpbar"><i id="vXp"></i></span></button>
    <div id="boosts"></div>
    <button class="roundBtn" id="muteBtn" aria-label="Sound">🔊</button>
    <button class="roundBtn" id="profBtn" aria-label="Profile"></button>
  </div>
  <div id="body">
    <div id="main">
      <div class="view on" id="vLagoon">
        <div id="scene">
          <svg id="sceneBg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
          <div id="props"></div>
          <div id="dark"></div>
          <div id="glowL"></div>
          <div id="axos"></div>
          <div id="fxL"></div>
        </div>
        <div id="areaName"></div>
        <div id="eggs"></div>
        <div id="sideR"></div>
        <div id="careBar"></div>
      </div>
      <div class="view" id="vAxolotls"><div class="inner" id="iAxos"></div></div>
      <div class="view" id="vShop"><div class="inner" id="iShop"></div></div>
      <div class="view" id="vGames"><div class="inner" id="iGames"></div></div>
      <div class="view" id="vMore"><div class="inner" id="iMore"></div></div>
    </div>
    <div id="nav"></div>
  </div>
</div>

const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PL = '<i class="pl"></i>';
function weighted(odds){ let s = odds.reduce((a, b) => a + b, 0), r = Math.random() * s; for(let i=0;i<odds.length;i++){ r -= odds[i]; if(r < 0) return i; } return odds.length - 1; }
function fmt(n){
  n = Math.floor(n || 0); if(n < 1000) return String(n);
  const u = ['K','M','B','T','Qa','Qi','Sx','Sp']; let i = -1;
  while(n >= 1000 && i < u.length - 1){ n /= 1000; i++; }
  return (n >= 100 ? Math.floor(n) : n >= 10 ? (Math.floor(n * 10) / 10) : (Math.floor(n * 100) / 100)) + u[i];
}
function fmtTime(sec){
  sec = Math.max(0, Math.ceil(sec));
  if(sec < 60) return sec + 's';
  const m = Math.floor(sec / 60), s = sec % 60;
  if(m < 60) return m + 'm' + (s ? ' ' + s + 's' : '');
  const h = Math.floor(m / 60); if(h < 48) return h + 'h ' + (m % 60) + 'm';
  return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}
function dayNum(t){ const d = new Date(t); return Math.floor((t - d.getTimezoneOffset() * 60000) / 86400000); }
function isNight(t){ const h = new Date(t || now()).getHours(); return h >= CONFIG.NIGHT_START || h < CONFIG.NIGHT_END; }

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){ const o = JSON.parse(raw); if(o && o.v) return fixState(o); }
  }catch(e){}
  return null;
}
/* fills in anything missing from an older save */
function fixState(o){
  const d = newState();
  for(const k in d) if(o[k] === undefined) o[k] = d[k];
  for(const k in d.stats) if(o.stats[k] === undefined) o.stats[k] = d.stats[k];
  for(const k in d.inv) if(o.inv[k] === undefined) o.inv[k] = 0;
  for(const k in d.up) if(o.up[k] === undefined) o.up[k] = 0;
  o.open.forEach(id => { if(!o.ar[id]) o.ar[id] = newArea(); });
  return o;
}
function saveNow(){
  if(!S) return;
  S.lastSeen = now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}

/* =====================================================================
   3. LANGUAGE — tr('English text') gives French when French is chosen.
   To fix a French word, change it in FR (near the end of the file).
===================================================================== */
function L(o){ if(!o) return ''; return (S && S.lang === 'fr' && o.fr) ? o.fr : (o.en || ''); }
function tr(s, vars){
  let out = (S && S.lang === 'fr' && FR[s]) ? FR[s] : s;
  if(vars) for(const k in vars) out = out.split('{' + k + '}').join(vars[k]);
  return out;
}

/* =====================================================================
   5. ECONOMY — pearls, crystals, levels, eggs, colors
===================================================================== */
const MOOD_RATE = () => 100 / (CONFIG.MOOD_EMPTY_HOURS * 3600);
const axoById = id => S.axos.find(x => x.id === id);
const axosIn = a => S.axos.filter(x => x.a === a);
const isAdult = x => x.grow >= CONFIG.GROW_SEC;
const moodAvg = x => (x.m.food + x.m.fun) / 2;
const tierOf = a => AREA_IDS.indexOf(a);
const roomIn = a => CONFIG.SPOTS_START + CONFIG.SPOTS_PER_PLANT * (S.ar[a] ? S.ar[a].plants : 0);
const hasRoom = a => axosIn(a).length < roomIn(a);
const decorCount = a => S.ar[a] ? Object.keys(S.ar[a].decor).length : 0;
const lightOf = a => S.ar[a] ? DECOR_IDS.filter(k => DECOR[k].glow && S.ar[a].decor[k]).length : 0;
function caveDark(a){ return AREA(a).cave ? Math.max(0.1, CONFIG.CAVE_DARK - CONFIG.GLOW_LIGHT * lightOf(a)) : 0; }
function caveFactor(a){ return AREA(a).cave ? 1 - CONFIG.CAVE_DARK_PENALTY * (1 - lightOf(a) / 3) : 1; }
function areaMult(a){ return Math.pow(CONFIG.AREA_MULT, tierOf(a)) * (1 + CONFIG.DECOR_BONUS * decorCount(a)) * caveFactor(a); }
function hearts(x){ let h = 0; CONFIG.FRIEND_LEVELS.forEach(v => { if(x.f >= v) h++; }); return h; }
function nextHeartAt(x){ return CONFIG.FRIEND_LEVELS.find(v => v > x.f); }
function globalMult(t){ return (1 + CONFIG.FOOD_UP_BONUS * S.up.food) * (S.ad2x > (t || now()) ? 2 : 1); }
function axoRate(x, t){
  const C = COLORS[x.c] || COLORS.pink, h = hearts(x);
  const mood = CONFIG.SAD_MIN + (1 - CONFIG.SAD_MIN) * moodAvg(x) / 100;
  const friend = 1 + h * (CONFIG.FRIEND_BONUS + (x.t === 'shy' ? 0.03 : 0));
  return CONFIG.BASE_RATE * CONFIG.RARITY_MULT[C.r] * areaMult(x.a) * (isAdult(x) ? 1 : CONFIG.BABY_EARN) * mood * friend * (x.t === 'greedy' ? 1.2 : 1) * globalMult(t);
}
function incomePerSec(){ return S.axos.reduce((s, x) => s + axoRate(x), 0); }
function areaIncome(a){ return axosIn(a).reduce((s, x) => s + axoRate(x), 0); }
const incomeFloor = () => Math.max(2, incomePerSec());
const priceScale = () => Math.pow(3, S.open.length - 1);

function addP(n){ S.p += n; if(n > 0) S.stats.pearls += n; }
function canPay(cur, n){ return cur === 'c' ? S.c >= n : S.p >= n; }
function pay(cur, n){
  if(!canPay(cur, n)){ toast((cur === 'c' ? '💎 ' + tr('Not enough crystals') : PL + ' ' + tr('Not enough pearls')), 'err'); sfx('err'); return false; }
  if(cur === 'c') S.c -= n; else S.p -= n;
  return true;
}

function randName(){ const used = new Set(S.axos.map(x => x.n)); const free = NAMES.filter(n => !used.has(n)); return pick(free.length ? free : NAMES); }

/* first time a color is seen = discovery reward */
function addToBook(c){
  if(S.book[c]) return false;

/* which color will a baby be? */
function babyColor(pa, pb, area){
  const cave = AREA(area).cave;
  const rec = RECIPES.find(r => (r[0] === pa && r[1] === pb) || (r[0] === pb && r[1] === pa));
  if(rec && (!COLORS[rec[2]].cave || cave) && Math.random() < CONFIG.RECIPE_CHANCE) return rec[2];
  if(Math.random() < CONFIG.MUTATION_CHANCE){
    const pool = COLOR_IDS.filter(k => COLORS[k].r === 1);
    return pick(pool);
  }
  return Math.random() < 0.5 ? pa : pb;
}
/* is a new color possible from this pair, here? (shown as a hint) */
function pairHint(pa, pb, area){

  if(!rec) return 0;
  if(COLORS[rec[2]].cave && !AREA(area).cave) return 2;   // right pair, wrong place
  return 1;
}

/* ---------- visitors ---------- */
function rollVisitorColor(kind, area){
  const cave = AREA(area).cave, lit = lightOf(area);
  const odds = kind === 'rare' ? [0, 60, 40] : kind === 'daily' ? [50, 40, 10] : [70, 25, 5];
  const r = weighted(odds);
  let pool = COLOR_IDS.filter(k => COLORS[k].r === r && !COLORS[k].paid && (!COLORS[k].cave || (cave && lit >= 1)));
  if(r === 2 && cave && lit >= 1 && Math.random() < 0.5) pool = ['glowing'];   // caves are home to glowing ones
  if(!pool.length) pool = COLOR_IDS.filter(k => COLORS[k].r === 1);
  return pick(pool);
}
function spawnVisitor(kind){
  const a = S.cur, c = rollVisitorColor(kind, a);
  const cost = kind === 'random' ? Math.round(Math.max(250, incomeFloor() * 150) * (1 + COLORS[c].r)) : 0;
  S.visitor = {c, t: pick(PERS_IDS), s: pick(SPOT_IDS), a, kind, cost, n: randName(), until: now() + (kind === 'random' ? CONFIG.VISITOR_STAY_MIN : 30) * 60000};

function adoptVisitor(){
  const v = S.visitor; if(!v) return;
  const area = hasRoom(v.a) ? v.a : S.open.find(a => hasRoom(a));
  if(!area){ toast('🌿 ' + tr('No room! Buy more plants & hiding spots in the Shop.'), 'err'); return; }

}

/* =====================================================================
   6. ART — every axolotl and every lagoon thing is drawn in code (SVG).
   No image files needed.
===================================================================== */
function shade(hex, amt){ // amt -1..1 (darker..lighter)
  let c = hex.replace('#', ''); if(c.length === 3) c = c.split('').map(x => x + x).join('');
  let r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  const f = v => Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt);
  return '#' + [f(r), f(g), f(b)].map(v => clamp(v, 0, 255).toString(16).padStart(2, '0')).join('');
}
let svgUid = 0;
/* stable pseudo-random numbers, so patterns look the same every time */
function seeded(n){ const out = []; let s = n * 9301 + 49297; for(let i=0;i<60;i++){ s = (s * 9301 + 49297) % 233280; out.push(s / 233280); } return out; }

/* one gill frond: a soft curved stalk with little feathery bumps */
function frond(x0, y0, x1, y1, col, w){
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len, cx = mx + nx * 3, cy = my + ny * 3;
  const P = t => [(1-t)*(1-t)*x0 + 2*(1-t)*t*cx + t*t*x1, (1-t)*(1-t)*y0 + 2*(1-t)*t*cy + t*t*y1];
  let s = '<path d="M' + x0 + ' ' + y0 + ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + x1 + ' ' + y1 + '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round" fill="none"/>';
  const fc = shade(col, 0.18);
  [0.32, 0.5, 0.68, 0.84].forEach((t, i) => {
    const [px, py] = P(t), sd = i % 2 ? 1 : -1;
    s += '<circle cx="' + (px + nx * sd * w * 0.62).toFixed(1) + '" cy="' + (py + ny * sd * w * 0.62).toFixed(1) + '" r="' + (w * 0.48).toFixed(1) + '" fill="' + fc + '"/>';
    s += '<circle cx="' + (px - nx * sd * w * 0.62).toFixed(1) + '" cy="' + (py - ny * sd * w * 0.62).toFixed(1) + '" r="' + (w * 0.4).toFixed(1) + '" fill="' + fc + '"/>';
  });
  s += '<circle cx="' + x1 + '" cy="' + y1 + '" r="' + (w * 0.62).toFixed(1) + '" fill="' + fc + '"/>';
  return s;
}

/* the axolotl. c = color id. opt: baby, sleep, size (px, optional) */
function axoSVG(c, opt){
  opt = opt || {};
  const C = COLORS[c] || COLORS.pink, b = !!opt.baby, u = 'ax' + (++svgUid);
  const hx = b ? 86 : 88, hy = 40, hrx = b ? 24 : 21, hry = b ? 19.5 : 17;
  const bx = b ? 64 : 59, by = 50, brx = b ? 19 : 25, bry = b ? 11 : 12.5;
  const body = C.pat === 'rainbow' ? 'url(#' + u + 'rb)' : C.body;
  const dark = shade(C.body, -0.18), gw = b ? 4.6 : 4.2;
  const sz = opt.size ? ' width="' + opt.size + '" height="' + Math.round(opt.size * 0.7) + '"' : '';
  const glowSt = opt.halo && C.glow ? ' style="filter:drop-shadow(0 0 5px ' + C.glow + ')"' : '';
  let s = '<svg viewBox="0 0 120 84"' + sz + glowSt + ' xmlns="http://www.w3.org/2000/svg"><defs>';
  if(C.pat === 'rainbow') s += '<linearGradient id="' + u + 'rb" x1="0" x2="1" y1="0" y2="0.4"><stop offset="0" stop-color="#ffa0b4"/><stop offset=".25" stop-color="#ffd27a"/><stop offset=".45" stop-color="#fff28c"/><stop offset=".62" stop-color="#9ef0b4"/><stop offset=".8" stop-color="#8fd2ff"/><stop offset="1" stop-color="#cba6ff"/></linearGradient>';
  const x0 = bx - brx + 4;
  const tailD = 'M' + x0 + ' ' + (by - 7) + ' C' + (x0 - 14) + ' ' + (by - 14) + ' ' + (x0 - 29) + ' ' + (by - 11) + ' ' + (x0 - (b ? 28 : 36)) + ' ' + (by - 2) + ' C' + (x0 - 27) + ' ' + (by + 6) + ' ' + (x0 - 14) + ' ' + (by + 9) + ' ' + x0 + ' ' + (by + 6) + ' Z';
  s += '<clipPath id="' + u + 'c"><path d="' + tailD + '"/><ellipse cx="' + bx + '" cy="' + by + '" rx="' + brx + '" ry="' + bry + '"/><ellipse cx="' + hx + '" cy="' + hy + '" rx="' + hrx + '" ry="' + hry + '"/></clipPath></defs>';
  // far legs
  s += '<ellipse cx="' + (bx - 9) + '" cy="' + (by + 9) + '" rx="3.2" ry="6" fill="' + dark + '" transform="rotate(20 ' + (bx - 9) + ' ' + (by + 9) + ')"/>';
  s += '<ellipse cx="' + (bx + 15) + '" cy="' + (by + 9) + '" rx="3.2" ry="6" fill="' + dark + '" transform="rotate(-15 ' + (bx + 15) + ' ' + (by + 9) + ')"/>';
  // tail
  s += '<g class="tail"><path d="' + tailD + '" fill="' + body + '"/><path d="' + tailD + '" fill="none" stroke="' + C.belly + '" stroke-width="1.6" opacity=".7"/></g>';
  // body
  s += '<ellipse cx="' + bx + '" cy="' + by + '" rx="' + brx + '" ry="' + bry + '" fill="' + body + '"/>';
  // gills (far side first, then near side)
  const gx = hx - hrx * 0.62, gy = hy - hry * 0.2, far = shade(C.gill, -0.2), L = b ? 0.85 : 1;
  s += '<g class="gills">';
  s += frond(gx + 9, gy - 9, gx + 9 - 4 * L, gy - 9 - 19 * L, far, gw * 0.85);
  s += frond(gx + 13, gy - 10, gx + 17 + 2 * L, gy - 10 - 17 * L, far, gw * 0.8);
  s += frond(gx + 2, gy - 6, gx + 2 - 8 * L, gy - 6 - 20 * L, C.gill, gw);
  s += frond(gx - 1, gy - 1, gx - 1 - 17 * L, gy - 1 - 13 * L, C.gill, gw);
  s += frond(gx - 1, gy + 5, gx - 1 - 20 * L, gy + 5 - 3 * L, C.gill, gw);
  s += '</g>';
  // head
  s += '<ellipse cx="' + hx + '" cy="' + hy + '" rx="' + hrx + '" ry="' + hry + '" fill="' + body + '"/>';
  // pattern (clipped to the body)
  s += '<g clip-path="url(#' + u + 'c)">' + patternSVG(C, c) + '</g>';
  // belly + chin + shine
  s += '<ellipse cx="' + (bx + 2) + '" cy="' + (by + 6) + '" rx="' + (brx * 0.74) + '" ry="' + (bry * 0.42) + '" fill="' + C.belly + '" opacity=".8"/>';
  s += '<ellipse cx="' + (hx + 4) + '" cy="' + (hy + hry * 0.55) + '" rx="' + (hrx * 0.68) + '" ry="' + (hry * 0.32) + '" fill="' + C.belly + '" opacity=".55"/>';
  s += '<ellipse cx="' + (hx - 5) + '" cy="' + (hy - hry * 0.58) + '" rx="7" ry="3.2" fill="#fff" opacity=".35"/>';
  // face
  const ex = hx + (b ? 7 : 8), ey = hy - 2, ex2 = hx + (b ? 17 : 17.5), er = b ? 4 : 3.3;
  if(opt.sleep){
    s += '<path d="M' + (ex - er) + ' ' + ey + ' Q' + ex + ' ' + (ey + er) + ' ' + (ex + er) + ' ' + ey + '" stroke="' + C.eye + '" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
    s += '<path d="M' + (ex2 - er * 0.8) + ' ' + (ey - 1) + ' Q' + ex2 + ' ' + (ey - 1 + er * 0.8) + ' ' + (ex2 + er * 0.8) + ' ' + (ey - 1) + '" stroke="' + C.eye + '" stroke-width="1.4" fill="none" stroke-linecap="round"/>';
  } else {
    s += '<circle cx="' + ex + '" cy="' + ey + '" r="' + er + '" fill="' + C.eye + '"/><circle cx="' + (ex + er * 0.35) + '" cy="' + (ey - er * 0.4) + '" r="' + (er * 0.36) + '" fill="#fff"/>';
    s += '<circle cx="' + ex2 + '" cy="' + (ey - 1) + '" r="' + (er * 0.8) + '" fill="' + C.eye + '"/><circle cx="' + (ex2 + er * 0.3) + '" cy="' + (ey - 1 - er * 0.35) + '" r="' + (er * 0.3) + '" fill="#fff"/>';
  }
  const mc = C.hi && C.r < 3 && c !== 'galaxy' ? '#ffd0dc' : shade(C.eye, 0.1);
  s += '<path d="M' + (hx + 9) + ' ' + (hy + 7) + ' Q' + (hx + 13.5) + ' ' + (hy + 11.5) + ' ' + (hx + 18) + ' ' + (hy + 6.5) + '" stroke="' + mc + '" stroke-width="1.7" fill="none" stroke-linecap="round"/>';
  s += '<ellipse cx="' + (hx + 4) + '" cy="' + (hy + 6) + '" rx="3.6" ry="2" fill="#ff6f96" opacity=".35"/>';
  // near legs with little toes
  [[bx - 11, by + 10, 18], [bx + 13, by + 10, -12]].forEach(([lx, ly, rot]) => {
    s += '<g transform="rotate(' + rot + ' ' + lx + ' ' + ly + ')"><ellipse cx="' + lx + '" cy="' + (ly + 2) + '" rx="3.4" ry="6.2" fill="' + C.body + '"/>' +
      '<circle cx="' + (lx - 2.6) + '" cy="' + (ly + 7.6) + '" r="1.5" fill="' + C.body + '"/><circle cx="' + lx + '" cy="' + (ly + 8.4) + '" r="1.5" fill="' + C.body + '"/><circle cx="' + (lx + 2.6) + '" cy="' + (ly + 7.6) + '" r="1.5" fill="' + C.body + '"/></g>';
  });
  return s + '</svg>';
}
/* patterns: spots, freckles, mosaic, galaxy, petals, stars */
function patternSVG(C, c){
  const R = seeded(c.length * 7 + c.charCodeAt(0)), pc = C.pc || '#000';
  let s = '';
  if(C.pat === 'spots'){ for(let i=0;i<16;i++) s += '<circle cx="' + (24 + R[i] * 80).toFixed(1) + '" cy="' + (26 + R[i + 20] * 34).toFixed(1) + '" r="' + (1.4 + R[i + 40] * 1.6).toFixed(1) + '" fill="' + pc + '" opacity=".6"/>'; }
  if(C.pat === 'freckles'){ for(let i=0;i<34;i++) s += '<circle cx="' + (22 + R[i % 60] * 84).toFixed(1) + '" cy="' + (24 + R[(i * 7 + 11) % 60] * 36).toFixed(1) + '" r="' + (0.7 + R[(i + 30) % 60] * 0.8).toFixed(1) + '" fill="' + pc + '" opacity=".75"/>'; }
  if(C.pat === 'mosaic'){
    s += '<ellipse cx="46" cy="47" rx="11" ry="9" fill="' + pc + '"/><ellipse cx="90" cy="30" rx="11" ry="8" fill="' + pc + '"/><ellipse cx="70" cy="56" rx="7" ry="5" fill="' + pc + '"/><ellipse cx="20" cy="44" rx="8" ry="6" fill="' + pc + '"/><ellipse cx="98" cy="48" rx="5" ry="4" fill="' + pc + '"/>';
  }
  if(C.pat === 'galaxy'){
    s += '<ellipse cx="50" cy="48" rx="16" ry="7" fill="#7a5cff" opacity=".45"/><ellipse cx="86" cy="34" rx="10" ry="6" fill="#ff7ad9" opacity=".3"/>';
    for(let i=0;i<26;i++) s += '<circle cx="' + (18 + R[i] * 90).toFixed(1) + '" cy="' + (24 + R[i + 26] * 38).toFixed(1) + '" r="' + (0.5 + R[(i + 13) % 60] * 0.9).toFixed(1) + '" fill="#fff"/>';
  }
  if(C.pat === 'petals'){
    [[44, 46], [64, 52], [88, 30], [26, 44], [98, 46]].forEach(([x, y], i) => {
      for(let k=0;k<5;k++){ const a = k * 1.2566 + i; s += '<circle cx="' + (x + Math.cos(a) * 2.2).toFixed(1) + '" cy="' + (y + Math.sin(a) * 2.2).toFixed(1) + '" r="1.8" fill="' + pc + '"/>'; }
      s += '<circle cx="' + x + '" cy="' + y + '" r="1.1" fill="#ffe27a"/>';
    });
  }

/* =====================================================================
   7. SOUND — bubbles, chirps and soft underwater music (WebAudio, no files)
===================================================================== */
let AC = null, musGain = null, sfxGain = null, musTimer = null, musArea = null, musStep = 0;
function audio(){
  if(AC) return AC;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(AC.destination);
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500; lp.connect(AC.destination);  // "under water" sound
    musGain = AC.createGain(); musGain.gain.value = 0.16; musGain.connect(lp);
  }catch(e){ AC = null; }
  return AC;
}
function tone(f, dur, type, vol, when, dest, slide){
  const A = audio(); if(!A) return;
  const t = (when || A.currentTime);
  const o = A.createOscillator(), g = A.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxGain); o.start(t); o.stop(t + dur + 0.05);
}
function bubbleSnd(p){ if(!S || !S.snd || !audio()) return; const t = AC.currentTime, f = rnd(320, 520) * (p || 1); tone(f, 0.09, 'sine', 0.22, t, null, f * 2.6); }
function sfx(k){
  if(!S || !S.snd || !audio()) return;
  const t = AC.currentTime;
  switch(k){
    case 'tap': tone(700, 0.05, 'triangle', 0.12); break;
    case 'pop': bubbleSnd(1.3); break;
    case 'bubble': bubbleSnd(); break;
    case 'pet': tone(880, 0.09, 'sine', 0.22, t, null, 1320); tone(1180, 0.1, 'sine', 0.18, t + 0.1, null, 1560); break;
    case 'eat': [0, 0.11, 0.22].forEach(d => tone(260, 0.07, 'triangle', 0.2, t + d, null, 180)); break;
    case 'boing': tone(220, 0.25, 'sine', 0.25, t, null, 660); break;
    case 'coin': tone(1400, 0.07, 'sine', 0.18); tone(2100, 0.12, 'sine', 0.14, t + 0.06); break;
    case 'err': tone(240, 0.14, 'triangle', 0.15); tone(190, 0.18, 'triangle', 0.15, t + 0.1); break;
    case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.22, t + i * 0.09)); break;
    case 'hatch': [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.16, 'sine', 0.2, t + i * 0.07)); setTimeout(() => bubbleSnd(1.4), 320); break;
    case 'new': [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.3, 'triangle', 0.18, t + i * 0.1)); break;
    case 'chime': tone(1319, 0.4, 'sine', 0.14); tone(1760, 0.5, 'sine', 0.1, t + 0.12); break;
    case 'win': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.15, t + i * 0.1)); break;
    case 'whoosh': tone(200, 0.35, 'sine', 0.15, t, null, 700); break;
  }
}
/* soft generative music: each area has its own scale and speed */
function musicStart(){
  if(!S || !S.mus || !audio()){ musicStop(); return; }
  if(musTimer && musArea === S.cur) return;
  musicStop();
  musArea = S.cur;
  const A = AREA(S.cur) || AREAS[0];
  const [scale, bpm, wave] = A.music;
  const step = 60 / bpm / 2;
  const root = 262 * Math.pow(2, (AREAS.indexOf(A) * -2) / 12);
  const prog = [0, 3, 4, 2];
  musStep = 0;
  musTimer = setInterval(() => {
    if(!AC || AC.state !== 'running') return;
    const t = AC.currentTime + 0.05;
    const bar = Math.floor(musStep / 8) % 4, beat = musStep % 8, chord = prog[bar];
    if(beat === 0) [0, 2, 4].forEach(o => tone(root / 2 * Math.pow(2, scale[(chord + o) % scale.length] / 12), step * 7.5, 'sine', 0.22, t, musGain));
    if(Math.random() < 0.55){
      const deg = chord + [0, 2, 4, 2, 1, 3, 4, 2][beat];
      const f = root * Math.pow(2, (scale[deg % scale.length] + 12 * Math.floor(deg / scale.length)) / 12);
      tone(f, step * 2.2, wave, 0.3, t, musGain);
    }
    if(Math.random() < 0.08){ const f = rnd(400, 700); tone(f, 0.08, 'sine', 0.12, t + 0.1, musGain, f * 2.4); }   // little bubble
    musStep++;
  }, step * 1000);
}
function musicStop(){ if(musTimer) clearInterval(musTimer); musTimer = null; musArea = null; }
function audioUnlock(){ const A = audio(); if(A && A.state === 'suspended') A.resume(); musicStart(); }

    if(x.vis) bub = '👋';
    else if(a.st !== 'nap'){ if(x.m.food < 25) bub = '🪱'; else if(x.m.fun < 25) bub = '💭'; }
    let be = a.el.querySelector('.bub');
    if(bub && !be){ be = document.createElement('div'); be.className = 'bub'; a.el.appendChild(be); }
    if(be){ if(bub) be.textContent = bub; else be.remove(); }
    let zz = a.el.querySelector('.zz');
    if(a.st === 'nap' && !zz){ zz = document.createElement('div'); zz.className = 'zz'; zz.textContent = 'z'; a.el.appendChild(zz); }
    if(a.st !== 'nap' && zz) zz.remove();
    a.el.classList.toggle('sel', sel === x.id);
    placeActor(a);
  });
  for(const id in actors) if(!seen[id]){ actors[id].el.remove(); delete actors[id]; }
}
function placeActor(a){
  a.el.style.left = a.x + '%'; a.el.style.top = a.y + '%'; a.el.style.zIndex = 3 + Math.round(a.y);
  a.el.firstChild.style.transform = a.face < 0 ? 'scaleX(-1)' : '';
  a.el.classList.toggle('swim', a.st === 'swim' || a.st === 'go');
  a.el.classList.toggle('nap', a.st === 'nap');
}
/* what does an axolotl do next? depends on its personality and the time */
function decide(a, x){
  const t = now(), night = isNight(t);
  let nap = 0.14 + (x.t === 'sleepy' ? 0.3 : 0) + (night ? 0.25 : 0) + (x.m.fun < 30 ? 0.1 : 0);
  if(x.vis) nap = 0;
  if(a.st === 'nap'){ a.st = 'float'; a.until = t + rnd(1500, 3000); a.key = ''; return; }
  if(Math.random() < nap){
    const sp = SPOTS[x.s] || SPOTS.rock;
    a.tx = clamp(sp.x + rnd(-4, 4), 6, 94); a.ty = sp.y - 8 + rnd(-1, 1); a.st = 'go'; a.goNap = true; a.until = t + 20000;
  } else if(Math.random() < (x.t === 'curious' ? 0.8 : 0.6)){
    a.tx = rnd(SWIM.x0, SWIM.x1); a.ty = rnd(SWIM.y0, SWIM.y1); a.st = 'swim'; a.goNap = false; a.until = t + 20000;
  } else {
    a.st = 'float'; a.until = t + rnd(2000, 5000);
    if(x.t === 'silly' && Math.random() < 0.5){ a.face = -a.face; a.el.classList.remove('pop'); void a.el.offsetWidth; a.el.classList.add('pop'); }
  }
}
function stepActors(dt){
  const t = now(), list = sceneList();
  list.forEach(x => {
    const a = actors[x.id]; if(!a) return;
    if(t > a.until) decide(a, x);
    if(a.st === 'swim' || a.st === 'go'){
      const sp = (isAdult(x) ? 9 : 7) * (x.t === 'sleepy' ? 0.75 : 1);
      const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy);
      if(d < 0.8){
        if(a.goNap){ a.st = 'nap'; a.goNap = false; a.until = t + rnd(15000, 40000) * (x.t === 'sleepy' ? 1.6 : 1); a.key = ''; renderAxos(); }
        else { a.st = 'float'; a.until = t + rnd(1500, 5000); }
      } else {
        a.x += dx / d * sp * dt; a.y += dy / d * sp * dt * 0.8;
        if(Math.abs(dx) > 1) a.face = dx > 0 ? 1 : -1;
      }
    } else if(a.st === 'float'){
      a.x += Math.sin(t / 900 + x.id) * 0.4 * dt;
    }
    placeActor(a);
  });
}

function eggsHtml(){
  let h = '<p class="muted">' + tr('Pair two grown-ups to make an egg. Babies can mix colors and become a NEW color!') + '</p>';
  h += '<button class="btn wide" id="pairBtn"' + (nestFree() ? '' : ' disabled') + '>💞 ' + tr('Make an egg') + ' (' + S.eggs.length + '/' + CONFIG.NEST_SLOTS + ')</button><h3>🥚 ' + tr('Nests') + '</h3>';
  if(!S.eggs.length) h += '<p class="muted center">' + tr('No eggs right now.') + '</p>';
  S.eggs.forEach(e => {
    const left = eggLeft(e);
    h += '<div class="card" data-egg="' + e.id + '"><div class="art" style="background:var(--sky)">' + eggSVG(e.pa, left <= 0) + '</div><div class="info"><div class="nm">' + (left <= 0 ? '🐣 ' + tr('Ready to hatch!') : '⏳ ' + fmtTime(left)) + '</div>' +
      '<div class="sub"><span class="swatch" style="background:' + COLORS[e.pa].body + '"></span> ' + L(COLORS[e.pa]) + ' + <span class="swatch" style="background:' + COLORS[e.pb].body + '"></span> ' + L(COLORS[e.pb]) + ' · ' + AREA(e.a).e + '</div></div>' +

}
function bookHtml(){
  const n = COLOR_IDS.filter(k => S.book[k]).length;
  let h = '<h2>📖 ' + tr('Color book') + ' <span class="muted">' + n + '/' + COLOR_IDS.length + '</span></h2><div class="grid">';
  COLOR_IDS.forEach(k => {
    const C = COLORS[k], got = S.book[k];
    let hint = '';
    if(!got){
      const r = recipeFor(k);
      if(C.paid) hint = '🛍️ ' + tr('Lagoon Pack');
      else if(r && (S.book[r[0]] || S.book[r[1]])) hint = '<span class="swatch" style="background:' + (S.book[r[0]] ? COLORS[r[0]].body : '#ccc') + '"></span>+<span class="swatch" style="background:' + (S.book[r[1]] ? COLORS[r[1]].body : '#ccc') + '"></span>' + (C.cave ? ' 🌙' : '');
      else if(C.cave) hint = '🌙 ' + tr('Caves');
    }
    h += '<div class="tile ' + (got ? 'r' + C.r : 'lock') + '">' + axoSVG(k, {halo: !!got}) + (got ? L(C) : '???') + '<div class="muted" style="font-size:.85em">' + (got ? '<span style="color:' + RARITY[C.r].c + '">' + L(RARITY[C.r]) + '</span>' : hint) + '</div></div>';
  });
  h += '</div><p class="muted">💡 ' + tr('Colored dots show which pair can make a missing color. 🌙 = only in the caves.') + '</p>';
  return h;
}
/* pick two parents */
function openPair(){
  if(!nestFree()){ toast('🥚 ' + tr('All nests are full'), 'err'); return; }
  const list = S.axos.filter(isAdult);
  let picked = [];
  const draw = () => {
    let h = '<p class="center muted">' + tr('Pick two grown-ups.') + '</p><div class="pickGrid">';
    list.forEach(x => {
      const ok = canPair(x), on = picked.includes(x.id);
      h += '<button data-pk="' + x.id + '" class="' + (on ? 'on' : '') + '"' + (ok ? '' : ' disabled') + '>' + axoSVG(x.c) + esc(x.n) + '<br><span class="muted">' + (ok ? AREA(x.a).e + ' ' + L(COLORS[x.c]) : '⏳ ' + fmtTime((x.pc - now()) / 1000)) + '</span></button>';
    });
    h += '</div>';
    if(picked.length === 2){
      const a = axoById(picked[0]), b = axoById(picked[1]), hint = pairHint(a.c, b.c, a.a);
      const res = (RECIPES.find(r => (r[0] === a.c && r[1] === b.c) || (r[0] === b.c && r[1] === a.c)) || [])[2];
      h += '<p class="center"><b>' + (hint === 1 && S.book[res] ? '🎨 ' + tr('They can make: {c}', {c: L(COLORS[res])}) : hint === 1 ? '✨ ' + tr('A NEW color is possible!') : hint === 2 ? '🌙 ' + tr('A new color is possible, but only in the caves!') : tr('Babies will look like their parents.')) + '</b></p>';
    }
    h += '<button class="btn wide" id="pkGo"' + (picked.length === 2 ? '' : ' disabled') + '>💞 ' + tr('Make an egg') + '</button>';
    openModal('💞 ' + tr('Make an egg'), h);
    $('mBody').querySelectorAll('[data-pk]').forEach(b => b.onclick = () => {
      sfx('tap'); const id = +b.dataset.pk;
      if(picked.includes(id)) picked = picked.filter(q => q !== id); else { picked.push(id); if(picked.length > 2) picked.shift(); }
      draw();
    });
    $('pkGo').onclick = () => { const a = axoById(picked[0]), b = axoById(picked[1]); if(pairUp(a, b)){ closeModal(); renderEggs(); if(curView === 'Axolotls') renderAxosView(); } };
  };
  draw();
}
/* one axolotl, up close */
function openAxo(id){
  const x = axoById(id); if(!x) return;
  sfx('tap');
  const C = COLORS[x.c], P = PERSONALITIES[x.t], sp = SPOTS[x.s], nh = nextHeartAt(x);
  let h = '<div class="center">' + axoSVG(x.c, {size: 200, baby: !isAdult(x), halo: true}) + '</div>';
  h += '<div class="center" style="font-size:1.3em;font-weight:900">' + esc(x.n) + ' <button class="btn ghost sm" id="axRen">✏️</button></div>';
  h += '<p class="center"><b style="color:' + RARITY[C.r].c + '">' + L(C) + ' · ' + L(RARITY[C.r]) + '</b></p>';
  h += '<div class="card" style="display:block"><div><b>' + P.e + ' ' + L(P) + '</b> — ' + L(P.d) + '</div><div style="margin-top:6px">' + tr('Favorite spot:') + ' <b>' + sp.e + ' ' + L(sp) + '</b></div>' +
    '<div style="margin-top:6px">' + tr('Friendship') + ': ' + heartsHtml(x) + (nh ? ' <span class="muted">(' + Math.floor(x.f) + '/' + nh + ')</span>' : '') + '</div>' +
    moodBars(x) + (isAdult(x) ? '' : '<div class="mood"><span>🍼</span><span style="width:auto;min-width:46px;text-align:left">' + tr('Growing') + '</span><div class="bar"><i style="width:' + (x.grow / CONFIG.GROW_SEC * 100) + '%;background:var(--lav2)"></i></div></div>') +
    '<div class="muted" style="margin-top:6px">' + PL + ' ' + fmt(axoRate(x) * 60) + ' / ' + tr('min') + ' · ' + AREA(x.a).e + ' ' + L(AREA(x.a)) + '</div></div>';
  h += '<div class="row" style="flex-wrap:wrap;gap:6px"><button class="btn mint" id="axFeed" style="flex:1">🪱 ' + tr('Feed') + '</button><button class="btn mint" id="axToy" style="flex:1">🏐 ' + tr('Toy') + '</button></div>';
  h += '<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px"><button class="btn ghost" id="axMove" style="flex:1">🧭 ' + tr('Move') + '</button><button class="btn ghost" id="axAv" style="flex:1">🖼️ ' + tr('Profile picture') + '</button></div>';
  if(S.axos.length > 2) h += '<button class="btn wide ghost" id="axBye" style="color:var(--bad)">👋 ' + tr('Let it go home') + '</button>';
  openModal('', h);
  $('axRen').onclick = () => renameAxo(x);
  $('axFeed').onclick = () => openFeed(x);
  $('axToy').onclick = () => openToy(x);
  $('axAv').onclick = () => { S.avatar = x.id; saveNow(); refreshTop(); toast('🖼️ ' + tr('New profile picture!')); };
  $('axMove').onclick = () => openMove(x);
  if($('axBye')) $('axBye').onclick = () => {
    const gift = Math.round(Math.max(100, axoRate(x) * 600));
    confirmBox('👋 ' + tr('Say goodbye to {n}?', {n: esc(x.n)}), tr('It goes back to the wild lake. It leaves you {p} pearls as a thank-you.', {p: fmt(gift)}), tr('Say goodbye'), () => {
      S.axos = S.axos.filter(q => q !== x); if(S.avatar === x.id) S.avatar = S.axos[0].id; if(sel === x.id) sel = null;
      addP(gift); saveNow(); renderLagoon(); if(curView === 'Axolotls') renderAxosView(); toast('💗 ' + tr('Bye bye, {n}!', {n: esc(x.n)}));
    });
  };
}
function renameAxo(x){
  openModal(tr('New name'), '<input id="rnIn" maxlength="14" value="' + esc(x.n) + '" style="width:100%;padding:12px;border-radius:12px;border:2px solid #dde;font-size:18px"><button class="btn wide" id="rnOk">' + tr('Save') + '</button>');

function openMove(x){
  let h = '';

let shopTab = 'food';

    h += card('🫙', tr('Pearl jars') + ' <span class="tag">' + S.up.jar + '/4</span>', tr('Keep earning longer while away') + ' (' + offlineCapH() + 'h)', S.up.jar >= 4 ? '<span class="tag">MAX</span>' : priceBtn('id="upJar"', 'p', jarCost()));
  }

    const A = AREA(S.cur);

    if(A.cave) h += '<p><b>💡 ' + tr('Light') + ': ' + '🟡'.repeat(lightOf(S.cur)) + '⚫'.repeat(3 - lightOf(S.cur)) + '</b></p>';

      const btn = own ? '<span class="tag" style="background:var(--aqua)">✔ ' + tr('Placed') + '</span>' :

      h += card(art, D.e + ' ' + L(D), (D.glow ? '✨ ' + tr('Glows in the dark') + ' · ' : '') + '+10% ' + PL, btn);

  I.querySelectorAll('[data-toy]').forEach(b => b.onclick = () => { const k = b.dataset.toy; if(pay('p', toyPrice(k))){ S.toys[k] = 1; toast(TOYS[k].e + ' ' + L(TOYS[k]) + '!'); bought(); } });

  if($('upJar')) $('upJar').onclick = () => { if(pay('p', jarCost())){ S.up.jar++; toast('🫙 ' + offlineCapH() + 'h'); bought(); } };
  I.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => {
    const k = b.dataset.dec, D = DECOR[k], pr = decorCost(k, S.cur);
    if(D.c && S.c < D.c){ toast('💎 ' + tr('Not enough crystals'), 'err'); sfx('err'); return; }
    if(!pay('p', pr)) return;
    if(D.c) S.c -= D.c;
    S.ar[S.cur].decor[k] = 1; addXP(8); toast(D.e + ' ' + L(D) + ' ' + tr('placed!'), 'gold'); bgKey = ''; bought();
  });
  I.querySelectorAll('[data-area]').forEach(b => b.onclick = () => openArea(+b.dataset.area));
  I.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { goArea(b.dataset.go); showView('Lagoon'); });
  if(shopTab === 'paid') bindPaidShop();
}
function openArea(i){
  const A = AREAS[i];
  if(!canOpenArea(i) || !pay('p', areaCost(i))) return;
  S.open.push(A.id); S.ar[A.id] = newArea(); addXP(30); sfx('new');
  // a friend moves in to welcome you
  const c = A.cave ? (i === 3 ? 'glowing' : pick(['lavender', 'blue'])) : pick(['golden', 'copper']);
  const x = makeAxo({c, a: A.id, adult: true});
  saveNow();
  showReward(A.e, tr('{a} is open!', {a: L(A)}), tr('{n} was waiting for you there!', {n: esc(x.n)}) + '<br>' + axoSVG(c, {size: 140, halo: true}), () => { goArea(A.id); showView('Lagoon'); });
}

/* ---------- daily gift ---------- */
function openGift(){
  const t = now(), today = dayNum(t), ready = S.daily.last !== today;
  const streak = ready ? (S.daily.last === today - 1 ? S.daily.streak + 1 : 1) : S.daily.streak;
  const day = ((streak - 1) % 7 + 7) % 7, G = GIFT_DAYS[day];
  const pr = Math.round(Math.max(150, incomeFloor() * 60 * G.p));
  let h = '<div class="row" style="justify-content:center;gap:4px;flex-wrap:wrap;margin-bottom:8px">';
  GIFT_DAYS.forEach((g, i) => h += '<span class="tag" style="font-size:.9em;padding:5px 8px;' + (i === day ? 'background:var(--pink2);color:#fff' : i < day ? 'background:var(--aqua)' : '') + '">' + tr('Day') + ' ' + (i + 1) + (g.c ? ' 💎' : '') + '</span>');
  h += '</div><div class="reward"><div class="big">🎁</div><div class="amt">+' + fmt(pr) + ' ' + PL + (G.c ? ' +' + G.c + ' 💎' : '') + FOOD_IDS.filter(k => G[k]).map(k => ' +' + G[k] + ' ' + FOODS[k].e).join('') + '</div>';
  h += '<p class="muted">🔥 ' + tr('Streak') + ': ' + streak + '</p></div>';
  h += ready ? '<button class="btn wide gold" id="gfGo">' + tr('Open my gift!') + '</button>' : '<p class="center"><b>' + tr('Come back tomorrow for the next gift!') + '</b></p>';
  openModal('🎁 ' + tr('Daily gift'), h);
  if($('gfGo')) $('gfGo').onclick = () => {
    S.daily = {streak, last: today}; addP(pr); if(G.c) S.c += G.c; FOOD_IDS.forEach(k => { if(G[k]) S.inv[k] += G[k]; });
    sfx('win'); closeModal(); toast('🎁 +' + fmt(pr) + ' ' + PL, 'gold'); saveNow(); renderSide(); refreshTop();
    if(S.dvDay !== today && !S.visitor){ S.dvDay = today; setTimeout(() => spawnVisitor('daily'), 900); }
  };
}

/* =====================================================================
   10. MINI GAMES — Worm Catch, Hide & Seek, Bubble Pop
   Each game: intro → loop (update + draw) → gameOver(score)
   update(dt) moves things, draw(ctx) paints the screen, every frame.
===================================================================== */
const GAMES = [
  {id:'catch', e:'🪱', en:'Worm Catch', fr:'Attrape les vers', d:{en:'Slide your finger to catch the falling worms. Dodge the pebbles!', fr:'Glisse ton doigt pour attraper les vers qui tombent. Évite les cailloux!'}},
  {id:'seek',  e:'🔦', en:'Hide & Seek', fr:'Cache-cache', d:{en:'The cave is dark! Move your light and tap the hidden axolotl.', fr:'La grotte est sombre! Bouge ta lumière et touche l’axolotl caché.'}},
  {id:'pop',   e:'🫧', en:'Bubble Pop', fr:'Éclate les bulles', d:{en:'Tap bubbles fast! Pearl bubbles give more. Don’t pop the pufferfish!', fr:'Touche les bulles vite! Les bulles à perle valent plus. N’éclate pas le poisson-globe!'}},
];
function renderGames(){
  const t = now(), next = S.tickets < CONFIG.TICKETS_MAX ? fmtTime((S.tkT + CONFIG.TICKET_MIN * 60000 - t) / 1000) : '';
  let h = '<div class="card"><div class="art">🎟️</div><div class="info"><div class="nm">' + tr('Tickets') + ': ' + S.tickets + '/' + CONFIG.TICKETS_MAX + '</div><div class="sub">' + (next ? tr('+1 in') + ' ' + next : tr('Full!')) + '</div></div>' +
    '<button class="btn mint sm" id="tkAd">' + adIcon() + ' +' + CONFIG.AD_TICKETS + '</button></div>';
  GAMES.forEach(g => {
    h += '<div class="card"><div class="art" style="font-size:36px">' + g.e + '</div><div class="info"><div class="nm">' + L(g) + '</div><div class="sub">' + L(g.d) + '</div><div class="sub">🏆 ' + tr('Best') + ': ' + (S.stats.best[g.id] || 0) + '</div></div>' +
      '<button class="btn sm" data-g="' + g.id + '"' + (S.tickets < 1 ? ' disabled' : '') + '>▶ ' + tr('Play') + '</button></div>';
  });
  $('iGames').innerHTML = '<h2>🎮 ' + tr('Mini games') + '</h2>' + h;
  $('iGames').querySelectorAll('[data-g]').forEach(b => b.onclick = () => startGame(b.dataset.g, true));
  $('tkAd').onclick = async () => { if(await rewardAd()){ S.tickets += CONFIG.AD_TICKETS; saveNow(); toast('+' + CONFIG.AD_TICKETS + ' 🎟️', 'gold'); renderGames(); } };
}

let G = null;   // the running game
const cv = () => $('gCanvas');
function svgImg(svg){ const i = new Image(); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); return i; }
function playerAxo(){ return (S.avatar && axoById(S.avatar)) || S.axos[0] || {c: 'pink', grow: 99999}; }
function startGame(id, intro){
  if(S.tickets < 1){ toast('🎟️ ' + tr('No tickets left. Watch an ad or wait.'), 'err'); sfx('err'); showView('Games'); return; }
  audioUnlock();
  $('game').classList.add('on'); $('gOver').classList.remove('on'); $('gHud').innerHTML = '';
  const c = cv(), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  G = {id, ctx, W: innerWidth, H: innerHeight, t: 0, score: 0, shownScore: 0, shake: 0, parts: [], texts: [], over: false, started: false, last: performance.now(), img: svgImg(axoSVG(playerAxo().c))};
  ({catch: catchInit, seek: seekInit, pop: popInit})[id]();
  const go = () => {
    if(S.tickets < 1) return;
    if(S.tickets >= CONFIG.TICKETS_MAX) S.tkT = now();
    S.tickets--; S.stats.games++; saveNow();
    $('gIntro').classList.remove('on'); G.started = true; G.last = performance.now();
    tutEvent('game');
  };
  if(intro){
    const g = GAMES.find(q => q.id === id);
    $('gIntroBox').innerHTML = '<div style="font-size:56px">' + g.e + '</div><h2 style="margin:6px 0">' + L(g) + '</h2><p style="font-weight:800">' + L(g.d) + '</p>' +
      '<button class="btn wide" id="giGo">▶ ' + tr('Start') + ' · 🎟️ 1</button><button class="btn wide ghost" id="giBack">' + tr('Back') + '</button>';
    $('gIntro').classList.add('on');
    $('giGo').onclick = go; $('giBack').onclick = closeGame;
  } else go();
  requestAnimationFrame(gameLoop);
}
function gameLoop(ts){
  if(!G || G.over) return;
  const dt = Math.min(0.05, (ts - G.last) / 1000); G.last = ts;
  if(G.started){ G.t += dt; G.update(dt); }
  G.shownScore += (G.score - G.shownScore) * Math.min(1, dt * 10);   // score ticks up
  const ctx = G.ctx; ctx.save();
  if(G.shake > 0){ G.shake -= dt; ctx.translate(rnd(-6, 6) * G.shake * 3, rnd(-6, 6) * G.shake * 3); }
  G.draw(ctx);
  G.parts = G.parts.filter(p => (p.life -= dt) > 0);
  G.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
  G.texts = G.texts.filter(q => (q.life -= dt) > 0);
  G.texts.forEach(q => { q.y -= 40 * dt; ctx.globalAlpha = Math.min(1, q.life * 2); ctx.font = '900 ' + (q.size || 24) + 'px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(q.s, q.x, q.y); ctx.fillStyle = q.c || '#30506a'; ctx.fillText(q.s, q.x, q.y); });
  ctx.globalAlpha = 1; ctx.restore();
  requestAnimationFrame(gameLoop);
}
function burst(x, y, c, n){ for(let i=0;i<(n || 10);i++){ const a = Math.random() * 7, s = rnd(60, 200); G.parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, r: rnd(2, 5), c: c || '#fff', life: 0.7, max: 0.7}); } }
function floatText(x, y, s, c, size){ G.texts.push({x, y, s, c, size, life: 0.9}); }
function hud(html){ $('gHud').innerHTML = html + '<button class="pill" id="gQuit" style="padding:8px 14px">✕</button>'; $('gQuit').onclick = () => G.started ? gameOver(true) : closeGame(); }
function emoji(ctx, e, x, y, size){ ctx.font = size + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y); }
function pearlDot(ctx, x, y, r){ const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r); g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#f6e9f3'); g.addColorStop(1, '#c9b2d6'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function waterBg(ctx, top, bot){
  const g = ctx.createLinearGradient(0, 0, 0, G.H); g.addColorStop(0, top || '#c6f6f2'); g.addColorStop(1, bot || '#6fc6db');
  ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
  ctx.fillStyle = '#ffffff22';
  for(let i=0;i<4;i++){ const x = (i * 0.27 + 0.05) * G.W + Math.sin(G.t * 0.4 + i) * 20; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 60, 0); ctx.lineTo(x + 140, G.H); ctx.lineTo(x + 40, G.H); ctx.fill(); }
}
function drawAxo(ctx, x, y, w, face, sx, sy){
  if(!G.img.complete) return;
  ctx.save(); ctx.translate(x, y); ctx.scale((face || 1) * (sx || 1), sy || 1); ctx.drawImage(G.img, -w / 2, -w * 0.35, w, w * 0.7); ctx.restore();
}

/* ---------- WORM CATCH ---------- */
function catchInit(){
  Object.assign(G, {x: G.W / 2, tx: G.W / 2, face: 1, items: [], spawn: 0, lives: 3, pop: 0, speed: CONFIG.CATCH_SPEED});
  const c = cv();
  c.onpointerdown = c.onpointermove = e => { G.tx = e.clientX; };
  G.update = dt => {
    const old = G.x; G.x += (G.tx - G.x) * Math.min(1, dt * 12);
    if(Math.abs(G.x - old) > 0.5) G.face = G.x > old ? 1 : -1;
    G.speed += CONFIG.CATCH_RAMP * dt;
    G.spawn -= dt;
    if(G.spawn <= 0){
      G.spawn = Math.max(0.33, 0.95 - G.t * 0.012);
      const r = Math.random();
      G.items.push({x: rnd(30, G.W - 30), y: -30, k: r < 0.07 ? 'shrimp' : r < 0.14 ? 'pearl' : r < 0.36 + Math.min(0.18, G.t * 0.004) ? 'rock' : 'worm', vy: G.speed * rnd(0.85, 1.2), rot: rnd(-2, 2)});
    }
    const py = G.H - 110;
    G.items = G.items.filter(it => {
      it.y += it.vy * dt; it.rot += dt;
      if(Math.abs(it.y - py) < 36 && Math.abs(it.x - G.x) < 50){
        if(it.k === 'rock'){ G.lives--; G.shake = 0.35; sfx('err'); burst(it.x, it.y, '#8a8a99', 12); if(G.lives <= 0) setTimeout(() => gameOver(), 300); }
        else { const v = it.k === 'shrimp' ? 3 : it.k === 'pearl' ? 2 : 1; G.score += v; G.pop = 0.18; sfx(it.k === 'pearl' ? 'coin' : 'eat'); burst(it.x, it.y, it.k === 'pearl' ? '#fff' : '#ff9fb6', 10); floatText(it.x, it.y - 20, '+' + v); }
        return false;
      }
      return it.y < G.H + 40;
    });
    if(G.pop > 0) G.pop -= dt;
    hud('<span class="pill">🪱 ' + Math.round(G.shownScore) + '</span><span class="pill">' + '❤️'.repeat(Math.max(0, G.lives)) + '🤍'.repeat(Math.max(0, 3 - G.lives)) + '</span>');
  };
  G.draw = ctx => {
    waterBg(ctx);
    ctx.fillStyle = '#f2dcab'; ctx.fillRect(0, G.H - 50, G.W, 50);
    G.items.forEach(it => { ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot * 0.5);
      if(it.k === 'pearl'){ ctx.shadowColor = '#fff'; ctx.shadowBlur = 14; pearlDot(ctx, 0, 0, 15); } else emoji(ctx, it.k === 'rock' ? '🪨' : it.k === 'shrimp' ? '🦐' : '🪱', 0, 0, 40);
      ctx.restore(); });
    const s = 1 + (G.pop > 0 ? G.pop * 1.4 : 0);
    drawAxo(ctx, G.x, G.H - 110, 130, G.face, s, 2 - s);
  };
  hud('<span class="pill">🪱 0</span>');
}

/* ---------- HIDE & SEEK (in a dark cave) ---------- */
function seekInit(){
  Object.assign(G, {lx: G.W / 2, ly: G.H / 2, left: CONFIG.SEEK_TIME, round: 0});
  const c = cv();
  const R = () => Math.min(G.W, G.H) * 0.27;
  const newRound = () => {
    G.round++; G.rt = 0;
    G.ax = {x: rnd(70, G.W - 70), y: rnd(130, G.H - 110), face: Math.random() < 0.5 ? 1 : -1, w: Math.max(80, 110 - G.round * 2)};
    G.cover = {x: G.ax.x + rnd(-14, 14) + G.ax.face * 22, y: G.ax.y + 18, w: rnd(70, 95)};
    G.rocks = []; for(let i=0;i<9;i++) G.rocks.push({x: rnd(20, G.W - 20), y: rnd(110, G.H - 40), w: rnd(50, 110)});
    G.shrooms = []; for(let i=0;i<6;i++) G.shrooms.push({x: rnd(20, G.W - 20), y: rnd(110, G.H - 30), c: pick(['#ff8fe0', '#7dffd0', '#8fd8ff'])});
  };
  newRound();
  c.onpointermove = e => { G.lx = e.clientX; G.ly = e.clientY; };
  c.onpointerdown = e => {
    if(!G.started) return;
    G.lx = e.clientX; G.ly = e.clientY;
    if(Math.hypot(e.clientX - G.ax.x, e.clientY - G.ax.y) < G.ax.w * 0.55){
      G.score++; G.left = Math.min(CONFIG.SEEK_TIME, G.left + 3); sfx('pet'); burst(G.ax.x, G.ax.y, '#ffd0e0', 18); floatText(G.ax.x, G.ax.y - 40, tr('Found!') + ' +3s', '#ff5f8f');
      G.flash = 0.25; newRound();
    } else { sfx('bubble'); }
  };
  G.update = dt => {
    G.left -= dt; G.rt += dt; if(G.flash > 0) G.flash -= dt;
    if(G.left <= 0){ G.left = 0; gameOver(); }
    hud('<span class="pill">🔦 ' + G.score + '</span><span class="pill">⏱️ ' + Math.ceil(G.left) + '</span>');
  };
  const rock = (ctx, x, y, w, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, w / 2, w * 0.34, 0, Math.PI, 0); ctx.lineTo(x + w / 2, y + 6); ctx.lineTo(x - w / 2, y + 6); ctx.fill(); };
  G.draw = ctx => {
    const g = ctx.createLinearGradient(0, 0, 0, G.H); g.addColorStop(0, '#7468c4'); g.addColorStop(1, '#3a3478'); ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
    G.rocks.forEach(r => rock(ctx, r.x, r.y, r.w, '#8a7fd0'));
    drawAxo(ctx, G.ax.x, G.ax.y, G.ax.w, G.ax.face, 1 + Math.sin(G.t * 3) * 0.02, 1);
    rock(ctx, G.cover.x, G.cover.y, G.cover.w, '#968bdc');
    G.shrooms.forEach(m => { ctx.fillStyle = '#ffe6f5'; ctx.fillRect(m.x - 3, m.y - 14, 6, 14); ctx.fillStyle = m.c; ctx.beginPath(); ctx.ellipse(m.x, m.y - 14, 13, 9, 0, Math.PI, 0); ctx.fill(); });
    // darkness with a flashlight hole
    const r = R(), dg = ctx.createRadialGradient(G.lx, G.ly, r * 0.5, G.lx, G.ly, r);
    dg.addColorStop(0, 'rgba(6,8,26,0)'); dg.addColorStop(1, 'rgba(6,8,26,0.96)');
    ctx.fillStyle = dg; ctx.fillRect(0, 0, G.W, G.H);
    // glowing mushrooms shine through the dark (they are not the axolotl!)
    G.shrooms.forEach(m => { ctx.save(); ctx.shadowColor = m.c; ctx.shadowBlur = 16; ctx.globalAlpha = 0.6; ctx.fillStyle = m.c; ctx.beginPath(); ctx.ellipse(m.x, m.y - 14, 13, 9, 0, Math.PI, 0); ctx.fill(); ctx.restore(); });
    if(G.rt > 8){ ctx.globalAlpha = 0.5 + Math.sin(G.t * 6) * 0.3; emoji(ctx, '✨', G.ax.x - G.ax.face * 30, G.ax.y - 30, 22); ctx.globalAlpha = 1; }   // a little hint
    if(G.flash > 0){ ctx.fillStyle = 'rgba(255,255,255,' + (G.flash * 1.6) + ')'; ctx.fillRect(0, 0, G.W, G.H); }
  };
  hud('<span class="pill">🔦 0</span>');
}

/* ---------- BUBBLE POP ---------- */
function popInit(){
  Object.assign(G, {bubs: [], spawn: 0, left: CONFIG.POP_TIME, combo: 1, lastPop: -9});
  const c = cv();
  c.onpointerdown = e => {
    if(!G.started) return;
    const x = e.clientX, y = e.clientY;
    for(let i = G.bubs.length - 1; i >= 0; i--){
      const b = G.bubs[i];
      if(Math.hypot(x - b.x, y - b.y) < b.r + 8){
        G.bubs.splice(i, 1);
        if(b.k === 'puffer'){ G.score = Math.max(0, G.score - 2); G.combo = 1; G.shake = 0.3; sfx('err'); burst(b.x, b.y, '#ffb36b', 14); floatText(b.x, b.y, '-2', '#ff5f6f'); return; }
        G.combo = G.t - G.lastPop < 0.7 ? Math.min(5, G.combo + 1) : 1; G.lastPop = G.t;
        const v = (b.k === 'pearl' ? 3 : 1) * G.combo;
        G.score += v; bubbleSnd(1 + G.combo * 0.12); if(b.k === 'pearl') sfx('coin');
        burst(b.x, b.y, b.k === 'pearl' ? '#ffffff' : '#bff3ff', 12); floatText(b.x, b.y, '+' + v + (G.combo > 1 ? ' ×' + G.combo : ''), G.combo > 2 ? '#ff5f8f' : '#30506a', 20 + G.combo * 3);
        return;
      }
    }
  };
  G.update = dt => {
    G.left -= dt;
    if(G.left <= 0){ G.left = 0; gameOver(); return; }
    G.spawn -= dt;
    if(G.spawn <= 0){
      G.spawn = Math.max(0.22, 0.6 - G.t * 0.012);
      const r = Math.random();
      G.bubs.push({x: rnd(40, G.W - 40), y: G.H + 40, r: rnd(24, 40), vy: rnd(70, 120) + G.t * 3, w: rnd(0, 6), k: r < 0.12 ? 'pearl' : r < 0.24 ? 'puffer' : 'b'});
    }
    G.bubs = G.bubs.filter(b => { b.y -= b.vy * dt; b.x += Math.sin(G.t * 2 + b.w) * 20 * dt; return b.y > -50; });
    hud('<span class="pill">🫧 ' + Math.round(G.shownScore) + '</span>' + (G.combo > 1 && G.t - G.lastPop < 0.7 ? '<span class="pill">🔥 ×' + G.combo + '</span>' : '') + '<span class="pill">⏱️ ' + Math.ceil(G.left) + '</span>');
  };
  G.draw = ctx => {
    waterBg(ctx, '#d5f7f5', '#7fcfe0');
    G.bubs.forEach(b => {
      if(b.k === 'puffer') emoji(ctx, '🐡', b.x, b.y, b.r * 1.3);
      if(b.k === 'pearl') pearlDot(ctx, b.x, b.y, b.r * 0.42);
      const g = ctx.createRadialGradient(b.x - b.r * 0.4, b.y - b.r * 0.4, b.r * 0.1, b.x, b.y, b.r);
      g.addColorStop(0, 'rgba(255,255,255,.7)'); g.addColorStop(0.6, 'rgba(255,255,255,.08)'); g.addColorStop(1, b.k === 'puffer' ? 'rgba(255,170,110,.5)' : 'rgba(255,255,255,.45)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.stroke();
    });
    drawAxo(ctx, G.W / 2, G.H - 70, 120, 1, 1, 1);
  };
  hud('<span class="pill">🫧 0</span>');
}

/* ---------- game over + prizes ---------- */
function gameOver(quit){
  if(!G || G.over) return;
  G.over = true;
  const id = G.id, sc = G.score, inc = incomeFloor();
  let p = sc * inc * ({catch: 6, seek: 25, pop: 4}[id]), cr = 0, best = false;
  if(sc > (S.stats.best[id] || 0)){ S.stats.best[id] = sc; best = sc > 0; }
  if(quit) p *= 0.5;
  p = Math.round(Math.max(sc > 0 ? 25 : 0, p));
  if(sc >= 8 && Math.random() < 0.15) cr = 1 + Math.floor(sc / 20);
  addP(p); S.c += cr; addXP(Math.min(25, 6 + Math.floor(sc / 2)));
  const food = sc >= 10 ? pick(FOOD_IDS) : null; if(food) S.inv[food] += 2;
  saveNow();
  if(best) sfx('win');
  const g = GAMES.find(q => q.id === id);
  $('gOverBox').innerHTML = '<div style="font-size:50px">' + (best ? '🏆' : g.e) + '</div><h2 style="margin:6px 0">' + (best ? tr('New best!') : tr('Nice try!')) + '</h2>' +
    '<div style="font-size:1.4em;font-weight:900">' + g.e + ' ' + sc + ' <span class="muted">· 🏆 ' + S.stats.best[id] + '</span></div>' +
    '<div class="reward"><div class="amt">+' + fmt(p) + ' ' + PL + (cr ? ' +' + cr + ' 💎' : '') + (food ? ' +2 ' + FOODS[food].e : '') + '</div></div>' +
    '<button class="btn wide" id="goAgain"' + (S.tickets < 1 ? ' disabled' : '') + '>🔁 ' + tr('Play again') + ' · 🎟️ ' + S.tickets + '</button>' +
    (S.tickets < 1 ? '<button class="btn wide mint" id="goTk">' + adIcon() + ' +' + CONFIG.AD_TICKETS + ' 🎟️</button>' : '') +
    '<button class="btn wide ghost" id="goBack">' + tr('Back') + '</button>';

/* the one function the game calls. Resolves true if the player earned the reward. */
async function rewardAd(){
  if(S.noAds){ toast('✨ ' + tr('Lagoon Pack: reward given!'), 'gold'); return true; }
  if(adBusy) return false;

function nativeAd(){
  const A = AdMobP();
  return new Promise(async res => {
    let earned = false, finished = false, hs = [];
    const finish = () => { if(finished) return; finished = true; hs.forEach(h => { try{ h.remove(); }catch(e){} }); res(earned); };
    try{
      hs.push(await A.addListener('onRewardedVideoAdReward', () => { earned = true; }));
      hs.push(await A.addListener('onRewardedVideoAdDismissed', () => setTimeout(finish, 250)));
      hs.push(await A.addListener('onRewardedVideoAdFailedToShow', finish));
      await A.prepareRewardVideoAd({adId: MONEY.REWARDED_ID, isTesting: MONEY.TESTING});
      const item = await A.showRewardVideoAd();
      if(item && item.amount !== undefined) earned = true;
      setTimeout(finish, 600);
    }catch(e){ finish(); }
  });
}

/* =====================================================================
   12. MAIN LOOP — game ticks, away time, tutorial, start-up
   tick(): once a second — moods, pearls, eggs, timers
   frame(): every screen frame — axolotls swim
===================================================================== */
function stepWorld(dt, t, offline){
  const rate = MOOD_RATE();
  let earned = 0, found = 0;
  S.axos.forEach(x => {
    x.m.food = Math.max(0, x.m.food - rate * dt * (x.t === 'greedy' ? 1.5 : 1) * (x.t === 'sleepy' ? 0.8 : 1));
    x.m.fun = Math.max(0, x.m.fun - rate * dt * (x.t === 'sleepy' ? 0.6 : 1));
    if(!isAdult(x)){
      x.grow += dt * (0.5 + moodAvg(x) / 100);
      if(isAdult(x) && !offline){ toast('🌟 ' + esc(x.n) + ' ' + tr('is all grown up!'), 'gold'); addXP(10); if(x.a === S.cur && actors[x.id]) actors[x.id].key = ''; }
    }
    earned += axoRate(x, t) * dt;
    if(isAdult(x) && Math.random() < CONFIG.CRYSTAL_CHANCE * dt / 60 * (x.t === 'curious' ? 2.5 : 1)){
      S.c++; S.stats.crystals++; found++;
      if(!offline && x.a === S.cur && curView === 'Lagoon'){ fxAtAxo(x, '💎'); sfx('coin'); }
    }
  });
  addP(earned);
  return {earned, found};
}
let tickN = 0;
function tick(){
  const t = now();
  stepWorld(1, t);
  S.stats.play++; tickN++;
  // tickets
  while(S.tickets < CONFIG.TICKETS_MAX && t - S.tkT >= CONFIG.TICKET_MIN * 60000){ S.tickets++; S.tkT += CONFIG.TICKET_MIN * 60000; }
  if(S.tickets >= CONFIG.TICKETS_MAX) S.tkT = t;
  // visitors
  if(S.visitor && t > S.visitor.until){ S.visitor = null; S.visitorAt = t + rnd(...CONFIG.VISITOR_MIN) * 60000; if(curView === 'Lagoon') renderLagoon(); }
  if(S.tut >= 99 && !S.visitor){
    if(S.daily.last === dayNum(t) && S.dvDay !== dayNum(t)){ S.dvDay = dayNum(t); spawnVisitor('daily'); }
    else if(t > S.visitorAt) spawnVisitor('random');
  }
  // eggs ready
  S.eggs.forEach(e => { if(!e.told && eggLeft(e) <= 0){ e.told = 1; toast('🥚 ' + tr('An egg is ready to hatch!'), 'gold'); sfx('chime'); } });
  if(tickN % 10 === 0) saveNow();
  // screen updates
  refreshTop();
  if(curView === 'Lagoon' && !G){
    renderEggs();
    if(tickN % 3 === 0){ renderAxos(); renderCare(); renderSide(); applyDark(); }
    if(tickN % 2 === 0) ambientBubbles();
    if(tickN % 4 === 0){ const list = axosIn(S.cur).filter(isAdult); if(list.length){ const x = pick(list); fxAtAxo(x, '+' + fmt(axoRate(x) * 4) + ' ' + PL); } }
  }
  if(curView === 'Games' && tickN % 5 === 0 && !$('modalBg').classList.contains('on')) renderGames();
  if(curView === 'Axolotls' && axTab === 'eggs' && !$('modalBg').classList.contains('on')) renderAxosView();
}
let lastFrame = performance.now();
function frame(ts){
  const dt = Math.min(0.1, (ts - lastFrame) / 1000); lastFrame = ts;
  if(S && curView === 'Lagoon' && !G) stepActors(dt);
  if(S) tickPearlDisplay();
  requestAnimationFrame(frame);
}

/* ---------- away time (pearls while the app is closed) ---------- */
function catchUp(){
  const t = now(), away = (t - (S.lastSeen || t)) / 1000;
  if(away < 60) return;
  const capped = Math.min(away, offlineCapH() * 3600);
  let earned = 0, found = 0, sim = S.lastSeen;
  const steps = Math.floor(capped / 60);
  for(let i=0;i<steps;i++){ sim += 60000; const r = stepWorld(60, sim, true); earned += r.earned; found += r.found; }
  // after the limit: no more pearls, but moods still go down and babies still grow
  const rest = away - steps * 60, rate = MOOD_RATE();
  S.axos.forEach(x => { x.m.food = Math.max(0, x.m.food - rate * rest); x.m.fun = Math.max(0, x.m.fun - rate * rest * 0.8); if(!isAdult(x)) x.grow += rest * 0.5; });
  while(S.tickets < CONFIG.TICKETS_MAX && t - S.tkT >= CONFIG.TICKET_MIN * 60000){ S.tickets++; S.tkT += CONFIG.TICKET_MIN * 60000; }
  S.lastSeen = t;
  if(earned >= 1){
    S.awayLast = Math.round(earned);
    const capTxt = away > capped ? '<p class="muted">' + tr('Pearls stop after {h}h away. Pearl jars in the Shop keep them coming longer.', {h: offlineCapH()}) + '</p>' : '';
    queueModal(() => {
      openModal('🌅 ' + tr('Welcome back!'), '<div class="reward"><div class="big">' + axoSVG('pink', {size: 150}) + '</div><p>' + tr('You were away for {t}.', {t: fmtTime(away)}) + '</p><p>' + tr('Your axolotls found') + '</p><div class="amt">+' + fmt(S.awayLast) + ' ' + PL + (found ? ' +' + found + ' 💎' : '') + '</div>' + capTxt + '</div>' +
        '<button class="btn wide gold" id="wbX2">' + adIcon() + ' ' + tr('Double it!') + ' +' + fmt(S.awayLast) + ' ' + PL + '</button><button class="btn wide ghost" id="wbOk">' + tr('Collect') + '</button>');
      $('wbOk').onclick = closeModal;
      $('wbX2').onclick = async () => { closeModal(); if(await rewardAd()){ addP(S.awayLast); toast('+' + fmt(S.awayLast) + ' ' + PL, 'gold'); S.awayLast = 0; saveNow(); } };
    });
  }
  saveNow();
}

    '<div class="seg" style="margin:12px auto;max-width:240px"><button id="nlEn" class="' + (S.lang === 'en' ? 'on' : '') + '">English</button><button id="nlFr" class="' + (S.lang === 'fr' ? 'on' : '') + '">Français</button></div>' +
    '<button class="btn wide" id="fnGo">💗 ' + tr('Let’s go!') + '</button></div>', null, true);
  const relang = l => { S.lang = l; const v = $('fnIn').value; applySettings(); renderAll(); closeModal(); startNewGameName(first, v); };
  $('nlEn').onclick = () => relang('en'); $('nlFr').onclick = () => relang('fr');
  $('fnGo').onclick = () => { const v = $('fnIn').value.trim(); if(v) first.n = v.slice(0, 14); closeModal(); S.tut = 1; renderLagoon(); tutShow(); sfx('pet'); saveNow(); };
}

/* ---------- start-up ---------- */
function boot(){
  $('loadAxo').innerHTML = axoSVG('pink');
  const lang0 = (load() || {}).lang || ((navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en');
  $('loadTip').textContent = '💡 ' + pick(TIPS)[lang0];
  let p = 0; const iv = setInterval(() => { p = Math.min(100, p + rnd(12, 28)); $('loadBar').style.width = p + '%'; }, 140);
  setTimeout(() => {
    clearInterval(iv); $('loadBar').style.width = '100%';
    const saved = load();
    if(saved){ S = saved; catchUp(); }
    if(!S) startNewGame();
    shownP = S.p;
    applySettings(); renderNav(); showView('Lagoon');
    if(S.tut >= 1 && S.tut < 99) tutShow();
    else if(S.tut >= 99) checkDaily();
    $('load').style.opacity = 0; setTimeout(() => $('load').remove(), 600);
    setInterval(tick, 1000);
    requestAnimationFrame(frame);
    adsInit();
  }, 1300);
  $('mClose').onclick = closeModal;
  $('modalBg').addEventListener('pointerdown', e => { if(e.target === $('modalBg') && $('mClose').style.display !== 'none') closeModal(); });
  $('pPearl').onclick = openBoosts;
  $('pCrys').onclick = () => { shopTab = 'paid'; showView('Shop'); };
  $('pLevel').onclick = () => showView('More');
  $('profBtn').onclick = () => showView('More');
  $('muteBtn').onclick = () => { const on = S.snd || S.mus; S.snd = S.mus = !on; if(!on) audioUnlock(); else musicStop(); refreshTop(); saveNow(); if(curView === 'More') renderMore(); };
  $('scene').addEventListener('pointerdown', () => { if(sel){ sel = null; renderAxos(); renderCare(); } });
  document.addEventListener('pointerdown', audioUnlock, {once: true});
  document.addEventListener('visibilitychange', () => {
    if(!S) return;
    if(document.hidden){ saveNow(); musicStop(); }
    else { catchUp(); if(S.mus) musicStart(); if(curView === 'Lagoon') renderLagoon(); }
  });
  document.addEventListener('pause', () => { if(S){ saveNow(); musicStop(); } }, false);
  window.addEventListener('resize', () => { if(S && curView === 'Lagoon'){ bgKey = ''; for(const k in actors) actors[k].key = ''; renderLagoon(); } });
}
window.addEventListener('load', boot);
