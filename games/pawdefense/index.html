<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5a3b2a">
<title>Paw Defense</title>
<!--
════════════════════════════════════════════════════════════════════════
  PAW DEFENSE — a pixel cat tower defense by MOS Arcade
  Cats sit on cushions in the garden and stop the bugs
  before they eat the veggie patch.

  Want to tune the feel? Everything important is in CONFIG
  (the first block inside the <script>).
════════════════════════════════════════════════════════════════════════
-->
<style>
/* =====================================================================
   STYLES — chunky pixel look. Colors live in :root.
   Each world changes the bar color (body[data-w]).
===================================================================== */
:root{
  --ink:#2a1f33; --ink2:#6d5a73; --paper:#fff4dc; --paper2:#f2dcae; --card:#fffaf0;
  --leaf:#5fb548; --leaf2:#3f8a32; --org:#ff8f3a; --org2:#c9581a; --pink:#ff7aa2; --pink2:#d24f7a;
  --sky:#5ab3ea; --sky2:#2f7fbf; --gold:#ffd23f; --gold2:#d99a10; --bad:#e2484f; --bad2:#9e2a31; --purple:#8a63d2;
  --bar:#6b4430; --bar2:#3f281c;
  --font:"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif;
}
body[data-w="1"]{--bar:#3c6188;--bar2:#243d58}
body[data-w="2"]{--bar:#5e4570;--bar2:#3a2a47}
body[data-w="3"]{--bar:#24365c;--bar2:#121c33}
body.easy{--font:Verdana,"Segoe UI",Tahoma,sans-serif;letter-spacing:.04em;word-spacing:.12em}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#241a2b;font-family:var(--font);color:var(--ink);font-size:15px;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
img.ico{width:18px;height:18px;image-rendering:pixelated;vertical-align:-3px;display:inline-block}
img.pxi{image-rendering:pixelated}
#app{position:fixed;inset:0;overflow:hidden}

/* ---------- in-level layout ---------- */
#game{position:absolute;inset:0;display:flex;flex-direction:column;background:#1d1424}
.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--bar);color:#fff;position:relative;z-index:4}
#hud{padding-top:calc(6px + env(safe-area-inset-top));border-bottom:4px solid var(--bar2)}
#bot{border-top:4px solid var(--bar2);padding-bottom:calc(8px + env(safe-area-inset-bottom));padding-top:8px;min-height:66px}
.pill{background:var(--paper);color:var(--ink);font-weight:900;padding:4px 8px;display:flex;align-items:center;gap:5px;
  border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);white-space:nowrap;font-size:15px;transition:transform .1s}
.pill.grow{flex:1;justify-content:center;min-width:0;overflow:hidden}
.pill.bump{transform:scale(1.18)}
.pill.hurt{background:#ffb3b6}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:900;padding:10px 14px;background:var(--card);
  border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset -3px -3px 0 rgba(0,0,0,.12),inset 3px 3px 0 rgba(255,255,255,.55);
  color:var(--ink);transition:transform .06s,box-shadow .06s;position:relative;line-height:1.15}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset -3px -3px 0 rgba(0,0,0,.12),inset 3px 3px 0 rgba(255,255,255,.55)}
.btn.org{background:var(--org);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.green{background:var(--leaf);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.sky{background:var(--sky);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.gold{background:var(--gold)}
.btn.pink{background:var(--pink);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.bad{background:var(--bad);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.dis{filter:grayscale(1);opacity:.5}
.btn.wide{width:100%;margin-top:8px}
.btn.small{padding:6px 9px;font-size:13px}
.ib{width:42px;height:38px;padding:0;font-size:18px}
#stage{flex:1;position:relative;overflow:hidden;background:#1d1424}
#cv{position:absolute;left:0;top:0;touch-action:none}
.pw{width:50px;height:48px;padding:0}
.pw img{width:30px;height:30px;image-rendering:pixelated}
.pw .n{position:absolute;right:-7px;top:-9px;background:var(--bad);color:#fff;border:2px solid var(--ink);font-size:12px;min-width:21px;padding:1px 3px;text-shadow:none}
.pw.on{background:var(--gold);animation:wob .5s infinite alternate}
@keyframes wob{to{transform:translateY(-3px)}}
#bWave{flex:1;height:48px;font-size:16px;min-width:0}
#bWave.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}

/* bottom sheets (build menu + cat panel) */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-top:4px solid var(--ink);
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .18s;z-index:8;max-height:64%;overflow:auto}
.sheet.on{transform:none}
.sheet h3{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px}
.sheet .x{margin-left:auto}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cb{display:flex;flex-direction:column;align-items:center;padding:4px 2px 3px;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-weight:900;font-size:13px;gap:1px}
.cb img{width:42px;height:46px;image-rendering:pixelated}
.cb img.ico{width:16px;height:16px}
.cb.sel{background:var(--gold)}
.cb.poor{opacity:.5}
.cb.lock{filter:grayscale(1);opacity:.3}
.info{background:#fff;border:3px solid var(--ink);padding:8px;margin-top:8px;font-size:14px;line-height:1.45}
.stats{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.st{background:var(--paper2);padding:2px 7px;font-weight:800;font-size:13px;border:2px solid var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.row > .btn{flex:1}
.lvpips{display:inline-flex;gap:3px;margin-left:4px}
.lvpips i{width:10px;height:10px;border:2px solid var(--ink);background:#fff;display:inline-block}
.lvpips i.on{background:var(--gold)}

/* ---------- menu screens ---------- */
.screen{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;background:#2b4a2a}
.screen.on{display:flex}
.top{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--bar);border-bottom:4px solid var(--bar2);color:#fff}
.top h2{margin:0;font-size:19px;flex:1;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.scroll{flex:1;overflow:auto;padding:12px 12px 18px;-webkit-overflow-scrolling:touch}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px 7px calc(7px + env(safe-area-inset-bottom));background:var(--bar);border-top:4px solid var(--bar2)}
.nav .btn{padding:6px 2px;flex-direction:column;gap:1px;font-size:11px}
.nav .btn b{font-size:20px;line-height:1}
.nav .btn.cur{background:var(--gold)}
.nav .dot{position:absolute;top:-6px;right:-4px;width:14px;height:14px;background:var(--bad);border:2px solid var(--ink)}
.card{background:var(--card);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:10px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px}
.muted{color:var(--ink2);font-size:13px}
.center{text-align:center}
.tabs{display:flex;gap:5px;margin-bottom:10px}
.tabs .btn{flex:1;padding:8px 2px;font-size:13px}
.tabs .btn.cur{background:var(--gold)}

/* world map */
.worlds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.worlds .btn{flex-direction:column;padding:6px 2px;font-size:11px;gap:2px}
.worlds .btn b{font-size:22px}
.worlds .btn.cur{background:var(--gold)}
.wbanner{display:flex;align-items:center;gap:10px}
.wbanner .big{font-size:20px;font-weight:900}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 18px;padding:12px 6px 6px;position:relative}
.node{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:900;padding:0;gap:2px}
.node .stars{display:flex;gap:1px}
.node .stars img{width:15px;height:15px;image-rendering:pixelated}
.node.lock{background:#b8aab9;color:#6e5f71}
.node.cur{background:var(--gold);animation:pulse 1.1s infinite}
.node.boss{background:#ffb3b6}
.node.boss.cur{background:var(--gold)}
.node .bi{width:30px;height:30px;image-rendering:pixelated}
.endless{width:100%;margin-top:14px;font-size:16px}

/* skills */
.sk{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:2px dashed var(--paper2)}
.sk:last-child{border-bottom:0}
.sk img.ci{width:36px;height:40px;image-rendering:pixelated}
.sk .nm{flex:1;font-weight:900;font-size:14px;line-height:1.25}
.sk .nm small{display:block;font-weight:700;color:var(--ink2);font-size:12px}
.chips{display:flex;gap:4px}
.chip{width:30px;height:30px;border:3px solid var(--ink);background:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.chip.on{background:var(--leaf);color:#fff}
.chip.next{background:var(--gold);box-shadow:0 3px 0 var(--ink)}
.chip.no{opacity:.45}

/* collection + album */
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cgrid .cb{font-size:11px;text-align:center;line-height:1.1;min-height:84px;justify-content:flex-start}
.cgrid .cb.unk img{filter:brightness(0) opacity(.45)}
.breeds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.breeds .cb{font-size:11px}

/* goals */
.ach{display:flex;gap:9px;align-items:center;padding:8px;background:#fff;border:3px solid var(--ink);margin-bottom:7px}
.ach.done{background:#dff3d2}
.ach .ai{font-size:24px;width:32px;text-align:center}
.ach .at{flex:1;font-size:14px;font-weight:900;line-height:1.25}
.ach .at small{display:block;font-weight:700;color:var(--ink2);font-size:12px}
.prog{height:9px;border:2px solid var(--ink);background:#eee;margin-top:4px}
.prog i{display:block;height:100%;background:var(--leaf)}
.rw{font-weight:900;white-space:nowrap}

/* title */
#title{background:linear-gradient(#7cc6f0 0 52%,#5fb548 52%);align-items:center;justify-content:center;gap:12px;padding:20px}
#title h1{margin:0;font-size:46px;color:#fff;text-align:center;line-height:.95;letter-spacing:2px;
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 8px 0 var(--ink)}
#title h1 span{color:var(--gold)}
#title .sub{color:#fff;font-weight:900;text-shadow:0 2px 0 var(--ink);font-size:16px}
#title .btn.org{font-size:24px;padding:14px 46px}
#tcv{width:260px;height:150px;image-rendering:pixelated}

/* modal */
.modal{position:absolute;inset:0;z-index:30;background:rgba(20,10,25,.62);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--paper);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);max-width:370px;width:100%;max-height:90%;overflow:auto;padding:16px;text-align:center;animation:pop .25s}
.mbox h2{margin:0 0 8px;font-size:23px}
.mbox p{margin:6px 0;line-height:1.45}
@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
.bigstars{display:flex;justify-content:center;gap:8px;margin:8px 0}
.bigstars img{width:54px;height:54px;image-rendering:pixelated;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.bigstars img.in{transform:scale(1)}
.bigstars img.off{filter:grayscale(1) brightness(.6)}
.reward{display:inline-flex;align-items:center;gap:6px;font-size:22px;font-weight:900;background:#fff;border:3px solid var(--ink);padding:4px 12px;margin:4px}
.reward img{width:24px;height:24px;image-rendering:pixelated}
.comic{width:100%;image-rendering:pixelated;border:4px solid var(--ink);background:#000;display:block}
.cap{font-weight:900;font-size:17px;margin:10px 0;min-height:48px;line-height:1.4}
.tog{display:flex;align-items:center;justify-content:space-between;padding:9px 4px;border-bottom:2px dashed var(--paper2);font-weight:800}
.tog:last-of-type{border-bottom:0}
.sw{width:56px;height:30px;border:3px solid var(--ink);background:#ccc;position:relative}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border:2px solid var(--ink);transition:left .12s}
.sw.on{background:var(--leaf)}
.sw.on::after{left:28px}
.ad-count{font-size:54px;font-weight:900;margin:8px 0}

#toast{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translate(-50%,-16px);opacity:0;z-index:45;pointer-events:none;
  background:var(--ink);color:#fff;font-weight:900;padding:8px 14px;border:3px solid #fff;transition:opacity .2s,transform .2s;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#tip{position:absolute;left:10px;right:10px;z-index:25;display:none;background:#fff;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:10px 12px;font-weight:900;font-size:16px;line-height:1.4;align-items:center;gap:10px}
#tip.on{display:flex;animation:pop .25s}
#tip img{width:44px;height:48px;image-rendering:pixelated;flex:none}
#tip .tt{flex:1}
#pointer{position:absolute;z-index:26;pointer-events:none;display:none;font-size:40px;line-height:1;animation:point .7s infinite alternate;filter:drop-shadow(0 3px 0 #2a1f33)}
@keyframes point{from{transform:translate(-50%,0)}to{transform:translate(-50%,-10px)}}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:36px;font-weight:900;color:#fff;pointer-events:none;opacity:0;z-index:3;
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),0 6px 0 var(--ink)}
#banner.show{animation:ban 1.6s forwards}
@keyframes ban{0%{opacity:0;transform:scale(2)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#combo{position:absolute;right:8px;top:8px;z-index:3;font-weight:900;color:#fff;font-size:20px;pointer-events:none;opacity:0;transition:opacity .15s;
  text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),0 4px 0 var(--ink)}
#combo.on{opacity:1}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;background:var(--ink);color:#fff;font-weight:900;padding:6px 12px;border:3px solid #fff;display:none;white-space:nowrap}
#hint.on{display:block}
</style>
</head>
<body>
<div id="app">
  <div id="game">
    <div id="hud" class="bar">
      <button id="bPause" class="btn ib" aria-label="Pause" style="font-weight:900;letter-spacing:-2px">❚❚</button>
      <div class="pill" id="hLives"></div>
      <div class="pill" id="hCoins"></div>
      <div class="pill grow" id="hWave"></div>
      <button id="bSpeed" class="btn ib">1x</button>
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="combo"></div>
      <div id="banner"></div>
      <div id="hint"></div>
    </div>
    <div id="bot" class="bar">
      <button class="btn pw" data-pw="bomb"><img alt=""><span class="n">0</span></button>
      <button class="btn pw" data-pw="laser"><img alt=""><span class="n">0</span></button>
      <button class="btn pw" data-pw="nap"><img alt=""><span class="n">0</span></button>
      <button id="bWave" class="btn org"></button>
    </div>
    <div id="sheet" class="sheet"></div>
  </div>
  <div id="title" class="screen"></div>
  <div id="scr" class="screen"></div>
  <div id="tip"></div>
  <div id="pointer">👆</div>
  <div id="modal" class="modal"><div class="mbox" id="mbox"></div></div>
  <div id="toast"></div>
</div>
<script>
(function(){
'use strict';
/* =====================================================================
   1. CONFIG — all the tuning numbers. Change these to change the feel.
===================================================================== */
const CONFIG = {
  TILE: 24, COLS: 15, ROWS: 24,   // map grid (24px tiles, portrait)
  START_LIVES: 20,                // veggies in the patch
  START_COINS: 150,               // fish at the start of level 1
  START_COINS_PER_LEVEL: 22,       // + this much per level number
  KILL_REWARD_GROWTH: 0.08,       // bug rewards grow 8% per level
  HP_GROWTH_LEVEL: 0.085,         // bug health +8.5% per level
  HP_GROWTH_WAVE: 0.03,           // bug health +3% per wave inside a level
  WAVE_GAP: 12,                   // seconds between waves (call early to skip)
  EARLY_BONUS_PER_SEC: 1.5,       // fish per second skipped when calling early
  SELL_REFUND: 0.7,               // sell gives back 70% (100% before wave 1)
  UPGRADE_COST: [0, 0.7, 1.0, 1.4, 2.0], // upgrade to lvl 2..5 = base cost x this
  UPGRADE_DMG: 1.32,              // damage x1.32 per level
  UPGRADE_RANGE: 0.07,            // +7% range per level
  UPGRADE_RATE: 0.08,             // +8% attack speed per level
  ARMOR_MIN: 0.35,                // armor can never block more than 65% of a hit
  COMBO_WINDOW: 1.3,              // seconds between squishes to keep a combo
  COMBO_MIN: 5,                   // combo pays out from this many squishes
  COMBO_FISH: 1,                  // fish per squish in a paid combo
  MAX_SPOTS: 16,                  // cushions per map
  BOMB_DMG: 80, BOMB_DMG_PER_LEVEL: 25, BOMB_RADIUS: 2.3, // catnip bomb
  LASER_TIME: 4,                  // laser pointer: bugs walk back for 4s
  NAP_TIME: 3.2,                  // nap time: every bug sleeps 3.2s
  REVIVE_LIVES: 0.5,              // revive gives back half the veggies
  ENDLESS_HP_GROWTH: 1.06,        // endless: bugs x1.06 health each wave
  FREE_AD_COOLDOWN: 120,          // seconds between free power-up ads
  STAR3: 0.9, STAR2: 0.5,         // lives kept for 3 stars / 2 stars
};

const T = CONFIG.TILE, COLS = CONFIG.COLS, ROWS = CONFIG.ROWS, W = COLS * T, H = ROWS * T;

/* =====================================================================
   2. SMALL HELPERS
===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const now = () => Date.now();
function RNG(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function fmt(n) { n = Math.floor(n); return n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'k' : String(n); }
function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* =====================================================================
   3. SAVE — everything the player keeps, in localStorage
===================================================================== */
const SAVE_KEY = 'pawDefense.v1';
function defaults() {
  return {
    lang: (navigator.language || 'en').slice(0, 2) === 'fr' ? 'fr' : 'en',
    sfx: true, mus: true, easy: false,
    stars: 0,            // stars in the wallet (to spend)
    earned: 0,           // every star ever earned
    best: {},            // level number -> best stars (1..3)
    unlocked: 1,         // highest level you can play
    skills: {},          // cat id -> rank 0..4
    garden: {lives: 0, coins: 0, refund: 0, bargain: 0, power: 0},
    skillSpent: 0,
    pw: {bomb: 1, laser: 1, nap: 1},
    breedOwn: {tabby: 1, grey: 1},
    breedPick: {},       // cat id -> breed id
    seen: {},            // bug id -> 1 (album)
    ach: {},             // achievement id -> 1
    stats: {kills: 0, maxCombo: 0, early: 0, spent: 0, pwUsed: 0, boss: {}, noLossBoss: 0, max5: 0, full: 0},
    endless: {},         // world -> best wave
    endlessPaid: {},     // world -> milestone already paid
    comics: {},          // world -> seen
    tut: {},
    daily: {last: '', streak: 0},
    freeAdAt: 0,
    pack: false, noAds: false, iapDone: {},
    speed: 1,
  };
}
let S = load();
function load() {
  const d = defaults();
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (raw && typeof raw === 'object') {
      for (const k in raw) {
        if (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k]) && raw[k] && typeof raw[k] === 'object') d[k] = Object.assign(d[k], raw[k]);
        else d[k] = raw[k];
      }
    }
  } catch (e) {}
  return d;
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

/* =====================================================================
   4. LANGUAGE — tr('English text') gives French when S.lang is 'fr'.
   The French words are in FR (next block).
===================================================================== */
function tr(s, o) {
  let r = (S.lang === 'fr' && FR[s]) || s;
  if (o) for (const k in o) r = r.split('{' + k + '}').join(o[k]);
  return r;
}

/* ---- turn a text grid into a little canvas (cached) ---- */
const sprCache = {};
function sprite(name, palName, palObj) {
  const key = name + '|' + palName;
  if (sprCache[key]) return sprCache[key];
  const rows = SPR[name], pal = palObj || PALS[palName] || {};
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((r, yy) => { for (let xx = 0; xx < r.length; xx++) { const col = pal[r[xx]]; if (col) { x.fillStyle = col; x.fillRect(xx, yy, 1, 1); } } });
  sprCache[key] = c;
  return c;
}
/* draw a sprite with its bottom-center at (x,y) */
function drawSpr(ctx, img, x, y, sc, flip, alpha) {
  sc = (sc || 1) * PX;
  const w = img.width * sc, h = img.height * sc;
  if (alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
  if (flip) { ctx.save(); ctx.translate(x, 0); ctx.scale(-1, 1); ctx.drawImage(img, -w / 2, y - h, w, h); ctx.restore(); }
  else ctx.drawImage(img, Math.round(x - w / 2), Math.round(y - h), w, h);
  if (alpha !== undefined && alpha < 1) ctx.globalAlpha = 1;
}
/* make a PNG data URL (for <img> in menus) */
const iconCache = {};
function iconURL(key, drawFn, w, h) {
  if (iconCache[key]) return iconCache[key];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  drawFn(x);
  return (iconCache[key] = c.toDataURL());
}
function sprURL(name, pal, scale) {
  scale = scale || 4;
  return iconURL('s|' + name + '|' + pal + '|' + scale, x => {
    const s = sprite(name, pal); x.drawImage(s, 0, 0, s.width * scale, s.height * scale);
  }, sprite(name, pal).width * scale, sprite(name, pal).height * scale);
}
const ICO = n => '<img class="ico" src="' + sprURL(n, n === 'fishy' ? 'fishy' : n) + '" alt="">';

/* ---- tiny 3x5 pixel font for numbers on the map ---- */
const PF = {
  '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001010010010', '8': '111101111101111', '9': '111101111001111',
  '+': '000010111010000', '-': '000000111000000', 'x': '000101010101000', '!': '010010010000010', 'k': '100101110101101',
};
function pixText(ctx, str, x, y, sz, col) {
  str = String(str); sz = sz || 2;
  const w = str.length * 4 * sz - sz;
  let cx = Math.round(x - w / 2); y = Math.round(y);
  for (const pass of [0, 1]) {
    ctx.fillStyle = pass ? col : OUT;
    let px = cx;
    for (const ch of str) {
      const g = PF[ch];
      if (g) for (let i = 0; i < 15; i++) if (g[i] === '1') {
        const gx = px + (i % 3) * sz, gy = y + Math.floor(i / 3) * sz;
        if (pass) ctx.fillRect(gx, gy, sz, sz);
        else ctx.fillRect(gx - sz / 2 - .5, gy - sz / 2 - .5, sz * 2 + 1, sz * 2 + 1);
      }
      px += 4 * sz;
    }
  }
}

let G = null; // the level being played

/* ---------- maps ---------- */
function shapePts(key) {
  const m = key.endsWith('m'), base = SHAPES[m ? key.slice(0, -1) : key];
  return base.map(p => p.map(([x, y]) => [m ? 14 - x : x, y]));
}
function buildPath(pts) {
  const P = pts.map(([x, y]) => ({x: (x + .5) * T, y: (y + .5) * T}));
  const segs = []; let L = 0;
  for (let i = 0; i < P.length - 1; i++) {
    const a = P[i], b = P[i + 1], l = Math.hypot(b.x - a.x, b.y - a.y);
    segs.push({a, b, l, s: L, dx: (b.x - a.x) / l, dy: (b.y - a.y) / l}); L += l;
  }
  return {P, segs, len: L, pts};
}
function posAt(path, d) {
  d = clamp(d, 0, path.len);
  const sg = path.segs;
  let i = 0; while (i < sg.length - 1 && sg[i].s + sg[i].l < d) i++;
  const s = sg[i], k = d - s.s;
  return {x: s.a.x + s.dx * k, y: s.a.y + s.dy * k, dx: s.dx, dy: s.dy};
}
function buildMap(shapeKey, world, seed) {
  const rng = RNG(seed);
  const raw = shapePts(shapeKey);
  const paths = raw.map(buildPath);
  const grid = []; for (let y = 0; y < ROWS; y++) grid.push(new Array(COLS).fill(0)); // 0 grass, 1 path, 2 patch, 3 spot
  const inG = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
  raw.forEach(pts => {
    for (let i = 0; i < pts.length - 1; i++) {
      let [x, y] = pts[i]; const [x2, y2] = pts[i + 1];
      const sx = Math.sign(x2 - x), sy = Math.sign(y2 - y);
      while (true) { if (inG(x, y)) grid[y][x] = 1; if (x === x2 && y === y2) break; x += sx; y += sy; }
    }
  });
  const goalPt = raw[0][raw[0].length - 1];
  const goal = {tx: goalPt[0], ty: goalPt[1], x: (goalPt[0] + .5) * T, y: (goalPt[1] + .5) * T};
  for (let y = goal.ty; y <= goal.ty + 1; y++) for (let x = goal.tx - 1; x <= goal.tx + 1; x++) if (inG(x, y) && grid[y][x] === 0) grid[y][x] = 2;
  // cushions: grass tiles touching the path, spread out
  const cands = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (grid[y][x] !== 0) continue;
    let near = false, score = 0;
    for (let yy = y - 1; yy <= y + 1; yy++) for (let xx = x - 1; xx <= x + 1; xx++) if (inG(xx, yy) && grid[yy][xx] === 1) near = true;
    if (!near) continue;
    for (let yy = y - 3; yy <= y + 3; yy++) for (let xx = x - 3; xx <= x + 3; xx++)
      if (inG(xx, yy) && grid[yy][xx] === 1 && Math.hypot(xx - x, yy - y) <= 2.6) score++;
    cands.push({tx: x, ty: y, score: score + rng() * 1.5});
  }
  cands.sort((a, b) => b.score - a.score);
  const spots = [];
  for (const c of cands) {
    if (spots.length >= CONFIG.MAX_SPOTS) break;
    if (spots.some(s => Math.abs(s.tx - c.tx) <= 1 && Math.abs(s.ty - c.ty) <= 1)) continue;
    spots.push({tx: c.tx, ty: c.ty, x: (c.tx + .5) * T, y: (c.ty + .5) * T, tw: null});
    grid[c.ty][c.tx] = 3;
  }
  spots.sort((a, b) => a.ty - b.ty || a.tx - b.tx);
  spots.forEach((s, i) => s.i = i);
  const decor = [];
  const W0 = WORLDS[world];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (grid[y][x] !== 0) continue;
    if (rng() < 0.13) decor.push({x: (x + .3 + rng() * .4) * T, y: (y + .6 + rng() * .3) * T, k: W0.deco[Math.floor(rng() * W0.deco.length)]});
  }
  const map = {shape: shapeKey, world, paths, grid, goal, spots, decor, seed};
  map.bg = drawMapBG(map);
  return map;
}

/* ---------- waves ---------- */
function threat(k) {
  const b = BUGS[k];
  let t = b.hp / 10 * Math.sqrt(b.spd / 1.1);
  if (b.fly) t *= 1.1; if (b.arm) t *= 1 + b.arm * 0.12; if (b.camo) t *= 1.4;
  if (b.heal) t *= 1.5; if (b.split) t *= 1.6; if (b.shield) t *= 1.6; if (b.rage) t *= 1.3;
  return t;
}
function bugGap(k, L) { return Math.max(0.28, 0.85 / Math.sqrt(BUGS[k].spd)) * (1 - Math.min(0.35, L * 0.008)); }
function makeWave(rng, pool, fresh, i, nW, L, budget, hm, nPaths, boss) {
  let types;
  if (i === 0 && fresh) types = [fresh];
  else {
    const n = i < 2 ? 1 : i < nW * 0.6 ? 2 : 3;
    types = [];
    const recent = pool.slice(-3);
    while (types.length < Math.min(n, pool.length)) {
      const k = rng() < 0.45 ? recent[Math.floor(rng() * recent.length)] : pool[Math.floor(rng() * pool.length)];
      if (!types.includes(k)) types.push(k);
    }
  }
  const out = []; let t0 = 0.5;
  types.forEach((k, gi) => {
    const n = clamp(Math.round(budget / types.length / threat(k)), 2, 45);
    const gap = bugGap(k, L);
    for (let j = 0; j < n; j++) out.push({t: t0 + j * gap, type: k, path: (j + gi) % nPaths, hm});
    t0 += n * gap * 0.62 + 0.8;
  });
  if (boss) {
    out.push({t: t0 + 1.5, type: boss, path: 0, hm: 1});
  }
  out.sort((a, b) => a.t - b.t);
  return out;
}
function genWaves(L, nPaths) {
  const rng = RNG(L * 9973 + 7);
  const pool = BUG_ORDER.filter(k => !BUGS[k].boss && BUGS[k].from && BUGS[k].from <= L);
  const freshK = pool.find(k => BUGS[k].from === L && L > 1);
  const nW = Math.min(15, 5 + Math.floor((L - 1) / 3)) + (BOSS_OF[L] ? 1 : 0);
  const waves = [];
  for (let i = 0; i < nW; i++) {
    const last = i === nW - 1;
    const budget = (5 + Math.min(L, 30) * 0.6 + Math.max(0, L - 30) * 0.3) * (1 + i * 0.32) * (BOSS_OF[L] && last ? 0.5 : 1);
    const hm = (1 + CONFIG.HP_GROWTH_LEVEL * (L - 1)) * (1 + CONFIG.HP_GROWTH_WAVE * i);
    waves.push(makeWave(rng, pool, freshK, i, nW, L, budget, hm, nPaths, BOSS_OF[L] && last ? BOSS_OF[L] : null));
  }
  return waves;
}
function genEndlessWave(w, n, nPaths) {
  const rng = RNG(w * 777 + n * 31 + 5);
  const maxL = 10 * (w + 1);
  const pool = BUG_ORDER.filter(k => !BUGS[k].boss && BUGS[k].from && BUGS[k].from <= maxL);
  const Leq = 10 * w + 5;
  const budget = (5 + Leq * 0.6) * (1 + (n - 1) * 0.25);
  const hm = (1 + CONFIG.HP_GROWTH_LEVEL * (Leq - 1)) * Math.pow(CONFIG.ENDLESS_HP_GROWTH, n - 1);
  let boss = null;
  if (n % 10 === 0) { const bosses = ['queen', 'mantis', 'spider', 'hornet'].slice(0, w + 1); boss = bosses[(n / 10 - 1) % bosses.length]; }
  const wave = makeWave(rng, pool, null, Math.min(n, 12), 14, Leq, budget * (boss ? 0.5 : 1), hm, nPaths, boss);
  wave.forEach(e => { if (BUGS[e.type].boss) e.hm = (0.6 + 0.25 * n / 10) * Math.pow(1.04, n); });

}

  };
}
function placeCat(spot, id) {
  const c = CAT[id], cost = catCost(c);
  if (spot.tw || G.coins < cost) return false;
  G.coins -= cost; S.stats.spent += cost;
  const tw = {id, lv: 1, spent: cost, x: spot.x, y: spot.y, spot, cd: 0.3, mode: 'first', anim: 0, face: false, blink: rand(1, 4), heat: 0, tg: null, webT: 0, hop: 0.35, t: rand(0, 5)};
  spot.tw = tw; G.towers.push(tw);
  S.stats.full = Math.max(S.stats.full || 0, G.towers.length);
  for (let i = 0; i < 10; i++) addPart(spot.x + rand(-8, 8), spot.y + 6, rand(-40, 40), rand(-60, -10), '#e8dcc0', 0.4, 2);
  sfx('meow'); return true;
}
function upgradeCat(tw) {
  const cost = upCost(tw);
  if (tw.lv >= 5 || G.coins < cost) return false;
  G.coins -= cost; tw.spent += cost; tw.lv++; S.stats.spent += cost;
  if (tw.lv === 5) S.stats.max5 = 1;
  tw.hop = 0.4;
  addRing(tw.x, tw.y, 4, 26, '#ffd23f', 0.4);
  for (let i = 0; i < 12; i++) addPart(tw.x + rand(-10, 10), tw.y + rand(-10, 4), rand(-30, 30), rand(-90, -30), pick(['#ffd23f', '#fff6c0']), 0.6, 2);
  sfx('up'); return true;
}
function sellCat(tw) {
  addCoins(sellValue(tw));
  tw.spot.tw = null; G.towers.splice(G.towers.indexOf(tw), 1);
  for (let i = 0; i < 10; i++) addPart(tw.x + rand(-8, 8), tw.y, rand(-50, 50), rand(-70, -10), '#e8dcc0', 0.4, 2);
  sfx('coin');

/* ---------- bugs ---------- */
function spawnBug(type, pi, hm, d0) {
  const B = BUGS[type], path = G.map.paths[pi] || G.map.paths[0];
  const hp = B.hp * (hm || 1);
  const b = {t: type, B, path: G.map.paths.indexOf(path), d: d0 || 0, x: 0, y: 0, hp, max: hp, arm: B.arm || 0,
    sh: B.shield ? hp * B.shield : 0, shMax: B.shield ? hp * B.shield : 0, hm: hm || 1,
    slow: 0, slowT: 0, aura: 0, frzT: 0, stunT: 0, bleedT: 0, bleedD: 0, abilT: 2, dashT: 0, hitT: 0,
    off: B.boss ? 0 : rand(-4, 4), anim: rand(0, 1), flip: false, rev: false, dead: false};
  const p = posAt(path, b.d); b.x = p.x; b.y = p.y;
  G.bugs.push(b);
  if (!S.seen[type]) { S.seen[type] = 1; save(); if (type !== 'ant' && type !== 'lady') newBugTip(type); }
  return b;
}
function hurt(b, dmg, o) {
  if (b.dead || dmg <= 0) return;
  o = o || {};
  let d = dmg;
  if (!o.magic && !o.pierce && b.arm > 0) d = o.beam ? d * (1 - Math.min(0.6, b.arm * 0.06)) : Math.max(d * CONFIG.ARMOR_MIN, d - b.arm);
  if (b.sh > 0) {
    const t = Math.min(b.sh, d); b.sh -= t; d -= t;
    if (b.sh <= 0) { addRing(b.x, b.y - 8, 6, 22, '#9fe8ff', 0.3); sfx('pop'); }
  }
  b.hp -= d; b.hitT = 0.08;
  if (b.hp <= 0) killBug(b);
}
function killBug(b) {
  if (b.dead) return;
  b.dead = true;
  const rew = Math.max(1, Math.round(b.B.rew * (1 + CONFIG.KILL_REWARD_GROWTH * (levelEq() - 1))));
  addCoins(rew);
  S.stats.kills++; G.kills++;
  G.combo.n++; G.combo.t = CONFIG.COMBO_WINDOW;
  if (G.combo.n > S.stats.maxCombo) S.stats.maxCombo = G.combo.n;
  const pal = PALS[b.B.pal];
  const n = b.B.boss ? 40 : 9;
  for (let i = 0; i < n; i++) addPart(b.x, b.y - 6, rand(-80, 80), rand(-110, -20), pick([pal.a, pal.b || pal.a, '#fff']), rand(0.35, 0.7), b.B.boss ? 4 : 2);
  addText(b.x, b.y - 18, '+' + rew, '#ffd23f');
  if (b.B.split) for (let i = 0; i < b.B.split; i++) { const m = spawnBug('mini', b.path, b.hm, Math.max(0, b.d + (i ? -8 : 6))); m.off = b.off + (i ? 3 : -3); }
  if (b.B.boss) {
    S.stats.boss[b.t] = 1; G.shake = 12; addRing(b.x, b.y, 10, 90, '#ffd23f', 0.6); sfx('boom'); banner(tr('BOSS DOWN!'));
  } else sfx('squish');
}
function bugReachedGoal(b) {
  b.dead = true;
  G.lives -= b.B.lv; G.lostAny = true; G.hurtT = 0.5;
  if (window.__PDleak) window.__PDleak[b.t] = (window.__PDleak[b.t] || 0) + b.B.lv;
  G.shake = Math.max(G.shake, b.B.boss ? 14 : 5);
  const gx = G.map.goal.x, gy = G.map.goal.y + 10;
  for (let i = 0; i < 12; i++) addPart(gx + rand(-20, 20), gy, rand(-80, 80), rand(-140, -40), pick(['#ff8a2a', '#8ed46b', '#e8483c']), 0.7, 3);
  addText(gx, gy - 24, '-' + b.B.lv, '#ff6b6b');
  sfx('hurt'); hudBump('hLives', true);
  if (G.lives <= 0) { G.lives = 0; G.state = 'lost'; onLose(); }
}

/* ---------- targets ---------- */
function canSee(b, st) { return !b.B.camo || b.rev || st.detect; }
function prog(b) { return b.d / G.map.paths[b.path].len; }
function findTarget(tw, st, exclude) {
  let best = null, bv = -Infinity;
  const r2 = st.range * st.range, air = st.c.air;
  for (const b of G.bugs) {
    if (b.dead || (b.B.fly && !air) || !canSee(b, st) || (exclude && exclude.includes(b))) continue;
    const dx = b.x - tw.x, dy = b.y - tw.y, dd = dx * dx + dy * dy;
    if (dd > r2) continue;
    const v = tw.mode === 'first' ? prog(b) : tw.mode === 'last' ? -prog(b) : tw.mode === 'strong' ? b.hp : -dd;
    if (v > bv) { bv = v; best = b; }
  }
  return best;
}
function bugsNear(x, y, r, groundOnly) {
  const out = [];
  for (const b of G.bugs) if (!b.dead && (!groundOnly || !b.B.fly) && (b.x - x) ** 2 + (b.y - y) ** 2 <= r * r) out.push(b);
  return out;
}

/* ---------- launching waves ---------- */
function launchWave(early) {
  if (G.state !== 'play' || G.wi >= waveCount() || G.queue.length) return;
  if (early && G.countdown > 0.5) {
    const bonus = Math.ceil(G.countdown * CONFIG.EARLY_BONUS_PER_SEC);
    addCoins(bonus); S.stats.early++;
    addText(W / 2, 40, '+' + bonus, '#ffd23f');
    hudBump('hCoins');
  }
  const wave = G.mode === 'endless' ? genEndlessWave(G.w, G.wi + 1, G.map.paths.length) : G.waves[G.wi];
  G.wi++; G.started = true; G.countdown = null;
  G.curHm = (wave.find(e => !BUGS[e.type].boss) || {hm: 1}).hm;
  for (const e of wave) G.queue.push({t: G.time + e.t, type: e.type, path: e.path, hm: e.hm});
  G.queue.sort((a, b) => a.t - b.t);
  for (const tw of G.towers) if (tw.id === 'fish') {
    const inc = tstats(tw).income; addCoins(inc); addText(tw.x, tw.y - 30, '+' + inc, '#6ec6ff'); tw.hop = 0.35;
  }
  const isBoss = wave.some(e => BUGS[e.type].boss);
  banner(isBoss ? tr('BOSS!') : tr('Wave {n}', {n: G.wi}));
  sfx(isBoss ? 'bossIn' : 'wave');
  if (G.mode === 'endless') endlessProgress();
  if (isBoss) bossTip();
  tutEvent('wave');
}

/* ---------- power-ups ---------- */
function powerMult() { return 1 + 0.15 * S.garden.power; }
function usePower(id, x, y) {
  if ((S.pw[id] || 0) <= 0 || G.state !== 'play') return false;
  S.pw[id]--; S.stats.pwUsed++; save();
  if (id === 'bomb') {
    const r = CONFIG.BOMB_RADIUS * T, dmg = (CONFIG.BOMB_DMG + CONFIG.BOMB_DMG_PER_LEVEL * levelEq()) * powerMult();
    for (const b of bugsNear(x, y, r, false)) hurt(b, b.B.boss ? dmg * 0.6 : dmg, {magic: 1});
    addRing(x, y, 6, r, '#8fe85a', 0.5); addRing(x, y, 2, r * 0.7, '#fff6c0', 0.35);
    for (let i = 0; i < 40; i++) addPart(x, y, rand(-160, 160), rand(-200, 40), pick(['#6fcf4a', '#d6ffc0', '#ffd23f']), rand(0.4, 0.9), 3);
    G.shake = 10; sfx('boom');
  } else if (id === 'laser') { G.laserT = CONFIG.LASER_TIME * powerMult(); sfx('zap'); banner(tr('Chase the dot!')); }
  else if (id === 'nap') { G.napT = CONFIG.NAP_TIME * powerMult(); sfx('nap'); banner(tr('Nap time!')); }
  return true;
}

/* ---------- effects ---------- */
function addPart(x, y, vx, vy, col, life, sz) { if (G.parts.length < 500) G.parts.push({x, y, vx, vy, col, life, max: life, sz: sz || 2}); }
function addText(x, y, s, col) { G.texts.push({x, y, s, col, life: 0.9}); }
function addRing(x, y, r0, r1, col, life) { G.rings.push({x, y, r0, r1, col, life, max: life}); }

/* =====================================================================
   update(dt) — one step of the game. dt = seconds (already x speed).
===================================================================== */
function update(dt) {
  if (G.state !== 'play') return;
  G.time += dt;
  // 1. spawn
  while (G.queue.length && G.queue[0].t <= G.time) { const q = G.queue.shift(); spawnBug(q.type, q.path, q.hm); }
  // 2. countdown to the next wave
  if (G.started && !G.queue.length && G.wi < waveCount()) {
    if (G.countdown === null) G.countdown = CONFIG.WAVE_GAP;
    G.countdown -= dt;
    if (G.countdown <= 0) launchWave(false);
  }
  G.napT = Math.max(0, G.napT - dt); G.laserT = Math.max(0, G.laserT - dt);
  G.hurtT = Math.max(0, G.hurtT - dt);
  // 3. cheer buffs + who can see invisible bugs
  for (const tw of G.towers) { tw.buff = 0; tw.cheerDetect = false; }
  for (const ch of G.towers) if (ch.id === 'cheer' && ch.webT <= 0) {
    const st = tstats(ch);
    for (const tw of G.towers) if (tw !== ch && dist(tw, ch) <= st.range + 2) {
      tw.buff = Math.max(tw.buff, st.buff);
      if (ch.lv >= 3) tw.cheerDetect = true;
    }
  }
  const sts = new Map();
  for (const tw of G.towers) sts.set(tw, tstats(tw));
  for (const b of G.bugs) {
    b.aura = 0;
    if (b.B.camo) { b.rev = false; for (const tw of G.towers) { const st = sts.get(tw); if (st.detect && st.range && tw.webT <= 0 && (b.x - tw.x) ** 2 + (b.y - tw.y) ** 2 <= st.range * st.range) { b.rev = true; break; } } }
  }
  // sleepy auras
  for (const tw of G.towers) if (tw.id === 'sleepy' && tw.webT <= 0) {
    const st = sts.get(tw);
    for (const b of bugsNear(tw.x, tw.y, st.range, false)) b.aura = Math.max(b.aura, b.B.boss ? st.slow * 0.5 : st.slow);
  }
  // 4. move bugs
  for (const b of G.bugs) {
    if (b.dead) continue;
    const path = G.map.paths[b.path];
    let sp = b.B.spd * T;
    if (b.B.rage) sp *= 1 + (1 - b.hp / b.max) * 1.2;
    if (b.dashT > 0) { b.dashT -= dt; sp *= 4; }
    b.slowT -= dt; if (b.slowT <= 0) b.slow = 0;
    sp *= 1 - Math.max(b.slow, b.aura);
    b.frzT -= dt; b.stunT -= dt;
    if (b.frzT > 0 || b.stunT > 0 || G.napT > 0) sp = 0;
    else if (G.laserT > 0) sp *= b.B.boss ? -0.3 : -0.7;
    b.d = Math.max(0, b.d + sp * dt);
    b.anim += Math.abs(sp) * dt * 0.08;
    b.hitT -= dt;
    if (b.bleedT > 0) { b.bleedT -= dt; hurt(b, b.bleedD * dt, {pierce: 1}); if (b.dead) continue; }
    if (b.d >= path.len) { bugReachedGoal(b); if (G.state !== 'play') return; continue; }
    const p = posAt(path, b.d);
    b.x = p.x - p.dy * b.off; b.y = p.y + p.dx * b.off;
    if (Math.abs(p.dx) > 0.5) b.flip = p.dx < 0;
    // special powers
    if (G.napT <= 0) bugAbility(b, dt);
  }
  // 5. cats attack
  for (const tw of G.towers) {
    tw.t += dt; tw.anim = Math.max(0, tw.anim - dt); tw.hop = Math.max(0, tw.hop - dt);
    tw.blink -= dt; if (tw.blink < -0.15) tw.blink = rand(2, 5);
    if (tw.webT > 0) { tw.webT -= dt; tw.tg = null; continue; }
    catAct(tw, sts.get(tw), dt);
  }
  // 6. shots
  for (const p of G.projs) moveProj(p, dt);
  G.projs = G.projs.filter(p => !p.done);
  G.bugs = G.bugs.filter(b => !b.dead);
  // 7. combo
  if (G.combo.t > 0) {
    G.combo.t -= dt;
    if (G.combo.t <= 0) {
      if (G.combo.n >= CONFIG.COMBO_MIN) {
        const bonus = G.combo.n * CONFIG.COMBO_FISH; addCoins(bonus);
        comboEnd(G.combo.n, bonus);
      }
      G.combo.n = 0;
    }
  }
  // 8. effects
  for (const p of G.parts) { p.life -= dt; p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const t of G.texts) { t.life -= dt; t.y -= 26 * dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  for (const r of G.rings) r.life -= dt; G.rings = G.rings.filter(r => r.life > 0);
  for (const z of G.zaps) z.life -= dt; G.zaps = G.zaps.filter(z => z.life > 0);
  for (const s of G.slashes) s.life -= dt; G.slashes = G.slashes.filter(s => s.life > 0);
  G.shake = Math.max(0, G.shake - dt * 30);
  // 9. win?
  if (G.started && G.wi >= waveCount() && !G.queue.length && !G.bugs.length) { G.state = 'won'; onWin(); }
}

function bugAbility(b, dt) {
  const B = b.B;
  if (B.heal) {
    b.abilT -= dt;
    if (b.abilT <= 0) {
      b.abilT = 2;
      for (const o of bugsNear(b.x, b.y, 1.8 * T, false)) if (o !== b && !o.B.heal && o.hp < o.max) {
        o.hp = Math.min(o.max, o.hp + o.max * (o.B.boss ? 0.02 : 0.07)); addText(o.x, o.y - 14, '+', '#8fe85a');
      }
      addRing(b.x, b.y - 6, 4, 1.8 * T, '#f6ff8a', 0.4);
    }
  }
  if (!B.boss) return;
  b.abilT -= dt;
  if (b.abilT > 0) return;
  if (B.spawn) {
    b.abilT = B.spawn === 'wasp' ? 5 : 4.5;
    for (let i = 0; i < (B.spawn === 'wasp' ? 3 : 2); i++) { const m = spawnBug(B.spawn, b.path, (G.curHm || 1) * 1.2, Math.max(0, b.d - 10 - i * 8)); m.off = rand(-6, 6); }
    addRing(b.x, b.y, 6, 30, '#ffd23f', 0.3);
    if (B.shield) { b.sh = b.shMax; addRing(b.x, b.y - 10, 10, 40, '#9fe8ff', 0.5); }
  } else if (B.dash) { b.abilT = 5; b.dashT = 0.7; sfx('dash'); }
  else if (B.web) {
    b.abilT = 5.5;
    let best = null, bd = 3.6 * T;
    for (const tw of G.towers) { const d = dist(tw, b); if (d < bd && tw.webT <= 0) { bd = d; best = tw; } }
    if (best) { best.webT = 3; G.zaps.push({pts: [{x: b.x, y: b.y - 20}, {x: best.x, y: best.y - 12}], life: 0.35, col: '#f0f0ff', web: 1}); sfx('web'); }
  }
}

function catAct(tw, st, dt) {
  const c = st.c;
  if (c.kind === 'farm' || c.kind === 'buff') return;
  if (c.kind === 'aura') {
    tw.cd -= dt;
    if (tw.cd <= 0) {
      tw.cd = 1 / st.rate;
      const hit = bugsNear(tw.x, tw.y, st.range, false).filter(b => canSee(b, st));
      hit.forEach(b => hurt(b, st.dmg));
      if (hit.length) addPart(tw.x + 8, tw.y - 24, rand(5, 15), -30, '#bfe1ff', 1, 3);
    }
    return;
  }
  if (c.kind === 'beam') {
    let tg = tw.tg;
    if (!tg || tg.dead || (tg.x - tw.x) ** 2 + (tg.y - tw.y) ** 2 > st.range * st.range || !canSee(tg, st)) tg = findTarget(tw, st);
    if (tg !== tw.tg) tw.heat = 0;
    tw.tg = tg;
    if (tg) {
      tw.heat = Math.min(2, tw.heat + dt);
      tw.face = tg.x < tw.x;
      hurt(tg, st.dmg * (1 + tw.heat) * dt, {beam: 1, pierce: st.sp});
      if (Math.random() < dt * 20) addPart(tg.x + rand(-4, 4), tg.y - 8, rand(-30, 30), rand(-60, -10), pick(['#ff3b3b', '#ffd0d0']), 0.3, 2);
      sfxLoop('laser');
    } else tw.heat = Math.max(0, tw.heat - dt * 2);
    return;
  }
  tw.cd -= dt;
  if (tw.cd > 0) return;
  if (c.kind === 'slam') {
    const hit = bugsNear(tw.x, tw.y, st.range, true);
    if (!hit.length) { tw.cd = 0; return; }
    tw.cd = 1 / st.rate; tw.hop = 0.45; tw.anim = 0.3;
    hit.forEach(b => { hurt(b, st.dmg); b.stunT = Math.max(b.stunT, b.B.boss ? st.stun * 0.3 : st.stun); });
    addRing(tw.x, tw.y + 4, 8, st.range, '#ffe6a0', 0.35);
    for (let i = 0; i < 14; i++) addPart(tw.x + rand(-st.range, st.range) * 0.7, tw.y + rand(-6, 10), rand(-20, 20), rand(-80, -20), '#c9a77e', 0.5, 3);
    G.shake = Math.max(G.shake, 4); sfx('slam');
    return;
  }
  const tg = findTarget(tw, st);
  if (!tg) { tw.cd = 0; return; }
  tw.cd = 1 / st.rate; tw.anim = 0.15; tw.face = tg.x < tw.x;
  const sx = tw.x, sy = tw.y - 16;
  if (c.kind === 'melee') {
    hurt(tg, st.dmg);
    if (st.sp && !tg.dead) { tg.bleedT = 2; tg.bleedD = st.dmg * 0.4; }
    G.slashes.push({x: tg.x, y: tg.y - 8, life: 0.15, a: rand(0, 3)});
    sfx('claw');
  } else if (c.kind === 'proj') {
    let dmg = st.dmg, crit = false;
    if (c.id === 'wiz' && st.sp && Math.random() < 0.25) { dmg *= 2.5; crit = true; }
    G.projs.push({k: c.proj, x: sx, y: sy, tg, tx: tg.x, ty: tg.y, spd: c.pspd * T, dmg, st, crit, bounce: c.id === 'yarn' && st.sp, rot: 0});
    sfx(c.id === 'yarn' ? 'throw' : c.id === 'ice' ? 'ice' : 'magic');
  } else if (c.kind === 'lob') {
    const d = dist({x: sx, y: sy}, tg);
    G.projs.push({k: 'lob', x: sx, y: sy, sx, sy, tx: tg.x, ty: tg.y, t: 0, dur: d / (c.pspd * T) + 0.25, dmg: st.dmg, st, rot: 0});
    sfx('lob');
  } else if (c.kind === 'chain') {
    const pts = [{x: sx, y: sy}], hit = [];
    let cur = tg, dmg = st.dmg;
    for (let i = 0; i < st.chain && cur; i++) {
      hit.push(cur); pts.push({x: cur.x, y: cur.y - 8});
      hurt(cur, dmg); dmg *= 0.8;
      let nx = null, nd = 1.9 * T;
      for (const b of G.bugs) if (!b.dead && !hit.includes(b) && canSee(b, st)) { const d = dist(b, cur); if (d < nd) { nd = d; nx = b; } }
      cur = nx;
    }
    G.zaps.push({pts, life: 0.18, col: '#fff36a'});
    sfx('zap');
  } else if (c.kind === 'multi') {
    const tgs = [tg];
    for (let i = 1; i < st.shots; i++) { const t2 = findTarget(tw, st, tgs); if (t2) tgs.push(t2); else break; }
    for (let i = 0; i < st.shots; i++) {
      const t = tgs[i % tgs.length];
      G.projs.push({k: 'star', x: sx + (i - 1) * 4, y: sy, tg: t, tx: t.x, ty: t.y, spd: c.pspd * T, dmg: st.dmg, st, rot: 0});
    }
    sfx('throw');
  }
}

function moveProj(p, dt) {
  p.rot += dt * 14;
  if (p.k === 'lob') {
    p.t += dt;
    const k = Math.min(1, p.t / p.dur);
    p.x = p.sx + (p.tx - p.sx) * k; p.y = p.sy + (p.ty - p.sy) * k - Math.sin(k * Math.PI) * 40;
    if (k >= 1) {
      p.done = true;
      const r = p.st.splash;
      for (const b of bugsNear(p.tx, p.ty, r, true)) {
        hurt(b, p.dmg);
        if (p.st.sp && !b.dead) { b.slow = Math.max(b.slow, 0.25); b.slowT = 1.5; }
      }
      addRing(p.tx, p.ty, 3, r, '#8fd65a', 0.3);

/* =====================================================================
   8. DRAWING — map background (drawn once), then every frame:

===================================================================== */
const cv = $('cv'), ctx = cv.getContext('2d');

function drawMapBG(map) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');

  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {

    if (g[ty][tx] === 1) {
      x.fillStyle = Wd.path[0]; x.fillRect(px, py, T, T);
      for (let i = 0; i < 5; i++) { x.fillStyle = Wd.path[1]; x.fillRect(px + Math.floor(rng() * 11) * 2, py + Math.floor(rng() * 11) * 2, 2, 2); }
    } else {

      for (let i = 0; i < 4; i++) {

        x.fillRect(px + Math.floor(rng() * 11) * 2, py + Math.floor(rng() * 11) * 2, 2, 2);
      }

    }

    if (!isP(tx, ty)) continue;

  x.strokeStyle = OUT; x.lineWidth = 2; x.strokeRect((gl.tx - 1) * T + 2, gl.ty * T + 2, 3 * T - 4, 2 * T - 4);

  }

    const a = p.P[0], b = p.P[1];

    x.fillStyle = '#e8483c'; x.strokeStyle = OUT;
    x.save(); x.translate(ex + Math.sign(b.x - a.x) * 8, ey + Math.sign(b.y - a.y) * 8); x.rotate(Math.atan2(b.y - a.y, b.x - a.x));

    gr.addColorStop(0, 'rgba(10,15,40,0)'); gr.addColorStop(1, 'rgba(10,15,40,.45)');

/* ---- a cat. Used on the map AND for menu icons ---- */

  const pal = catPal(breed);

/* ---- a bug ---- */

  }

/* ---- veggies on the patch (fewer as you lose lives) ---- */

function draw() {
  const sh = G.shake > 0 ? G.shake : 0;

  ctx.setTransform(1, 0, 0, 1, 0, 0);

  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + sx), dpr * (offY + sy));
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(G.map.bg, 0, 0, W, H);
  drawPatch(ctx);
  // range preview
  const sel = G.selTower || (G.selSpot && G.pick ? {x: G.selSpot.x, y: G.selSpot.y, id: G.pick, lv: 1, preview: 1} : null);
  if (sel) {
    const st = tstats(sel), r = st.range || (sel.id === 'fish' ? 0 : 0);
    if (r) {

    }
  }

    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 3; ctx.strokeRect(s.x - 12 * p, s.y - 12 * p, 24 * p, 24 * p);
    if (G.pick) drawCat(ctx, G.pick, breedOf(G.pick), s.x, s.y + 9, {t: G.time});
  }

  for (const tw of G.towers) list.push({y: tw.y + 9, tw});
  for (const b of G.bugs) list.push({y: b.y + (b.B.fly ? 30 : 0), b});
  list.sort((a, b) => a.y - b.y);
  for (const it of list) {
    if (it.tw) {
      const tw = it.tw;
      drawCat(ctx, tw.id, breedOf(tw.id), tw.x, tw.y + 9, {t: tw.t, hop: tw.hop, anim: tw.anim, flip: tw.face, blink: tw.blink < 0, web: tw.webT});
      for (let i = 0; i < tw.lv; i++) { ctx.fillStyle = OUT; ctx.fillRect(tw.x - 10 + i * 4.5, tw.y + 10, 4, 4); ctx.fillStyle = '#ffd23f'; ctx.fillRect(tw.x - 9.5 + i * 4.5, tw.y + 10.5, 3, 3); }
      if (tw.buff > 0) { ctx.fillStyle = '#ff7aa2'; ctx.fillRect(tw.x + 10, tw.y - 22 + Math.sin(tw.t * 4) * 2, 3, 3); }
      if (tw === G.selTower) { ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2; ctx.strokeRect(tw.x - 13, tw.y - 18, 26, 32); }

    else if (p.k === 'ice') { ctx.fillStyle = '#e8fbff'; ctx.fillRect(-4, -1.5, 8, 3); ctx.fillRect(-1.5, -4, 3, 8); ctx.fillStyle = '#7ad8ff'; ctx.fillRect(-2, -2, 4, 4); }

  x.fillStyle = sky; x.fillRect(0, 0, 200, 120);

    for (let i = 0; i < 14; i++) { x.fillStyle = '#fff'; x.fillRect((i * 37) % 200, (i * 23) % 60, 2, 2); } }
  x.fillStyle = Wd.grass[0]; x.fillRect(0, 84, 200, 36);
  x.fillStyle = Wd.path[0]; x.fillRect(0, 96, 200, 10);
  const bob = Math.sin(t * 4) * 1.5;
  const cat = (id, cx, s, br) => drawCat(x, id, br || breedOf(id), cx, 100 + bob * (cx % 2 ? 1 : -1), {sc: s || 1, t});
  const bug = (k, bx, s) => { const B = BUGS[k]; drawSpr(x, sprite(B.spr || k, B.pal), bx, 104 + Math.sin(t * 6 + bx) * 1.5, s || 1); };
  if (d === 'patch') { for (let i = 0; i < 5; i++) drawSpr(x, sprite(VEG[i], VEG[i]), 70 + i * 16, 96, 1.4); cat('yarn', 40, 1.4); }
  else if (d === 'bugs') { for (let i = 0; i < 5; i++) bug(i % 2 ? 'lady' : 'ant', 30 + i * 30 + ((t * 20) % 30), 1.2); drawSpr(x, sprite('carrot', 'carrot'), 185, 96, 1.4); }
  else if (d === 'cats') { cat('yarn', 50, 1.4); cat('claw', 100, 1.4); cat('sleepy', 150, 1.4); }
  else if (d === 'magic') { cat('ice', 60, 1.5); cat('wiz', 140, 1.5); for (let i = 0; i < 6; i++) { x.fillStyle = i % 2 ? '#ffe680' : '#b383ff'; x.fillRect(100 + Math.cos(t * 2 + i) * 40, 50 + Math.sin(t * 2 + i) * 20, 3, 3); } }
  else if (d === 'web') { for (let i = 0; i < 3; i++) drawSpr(x, sprite('web', 'web'), 40 + i * 60, 60 + i * 8, 2.2, false, 0.8); bug('moth', 100, 1.3); }
  else if (d === 'spider') { bug('spider', 100, 3); bug('ant', 30, 1.1); bug('beetle', 170, 1.1); }
  else if (d === 'big') { cat('chonk', 60, 1.4); cat('laser', 140, 1.4); }
  else if (d === 'night') { cat('ninja', 100, 1.5); bug('firefly', 50, 1.2); bug('moth', 160, 1.2); }
  else if (d === 'hornet') { drawSpr(x, sprite('wasp', 'hornet'), 100, 70 + bob * 3, 3); drawSpr(x, sprite('crown', 'crown'), 100, 26 + bob * 3, 2); bug('wasp', 40, 1.2); bug('wasp', 165, 1.2); }
  x.setTransform(1, 0, 0, 1, 0, 0);
}

function drawTitle(c, t) {

/* ---------- comics ---------- */
function showComic(w, after) {
  let i = 0, raf = 0;

  const show = () => {
    openModal('<h2>' + WORLDS[w].icon + ' ' + tr('World {n}', {n: w + 1}) + '</h2><canvas class="comic" id="cmc" width="400" height="240"></canvas>' +

      '<button class="btn org wide" id="cNext">' + (i < 2 ? tr('Next') + ' ▶' : tr('Let\'s go!') + ' 🐾') + '</button>');
    const c = $('cmc'), t0 = performance.now();
    cancelAnimationFrame(raf);
    const anim = () => { if (!$('cmc')) return; drawComic(c, w, panels[i].d, (performance.now() - t0) / 1000); raf = requestAnimationFrame(anim); };
    anim();
    bindBtn('cNext', () => {
      i++;
      if (i < 3) show();

}

/* ---------- daily gift ---------- */
function dailyGift() {
  const today = dayKey();
  if (S.daily.last === today || screen !== 'map' || modalOpen()) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const streak = S.daily.last === dayKey(y) ? S.daily.streak + 1 : 1;
  const idx = (streak - 1) % 7, g = DAILY[idx];
  const label = d => d.stars ? starIco() + ' +' + d.stars : '<img class="ico" src="' + sprURL(d.pw, d.pw) + '" alt=""> +1';
  openModal('<h2>🎁 ' + tr('Daily gift') + '</h2><p>' + tr('Day {n} in a row!', {n: streak}) + '</p>' +
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0">' +
    DAILY.map((d, i) => '<div class="cb' + (i === idx ? ' sel' : '') + '" style="padding:6px 2px;' + (i < idx ? 'opacity:.5' : '') + '"><small>' + tr('Day {n}', {n: i + 1}) + '</small>' + label(d) + '</div>').join('') + '</div>' +
    '<button class="btn org wide" id="dOk">' + tr('Claim') + ' ' + label(g) + '</button>');
  bindBtn('dOk', () => {
    S.daily = {last: today, streak};
    if (g.stars) { S.stars += g.stars; S.earned += g.stars; } else S.pw[g.pw] = (S.pw[g.pw] || 0) + 1;

}

function catStatsHtml(c, lv) {
  const st = tstats({id: c.id, lv: lv || 1, buff: 0});
  const ch = [];
  if (c.dmg) ch.push('🗡️ ' + tr('Damage') + ' ' + (c.kind === 'beam' ? Math.round(st.dmg) + '/s' : Math.round(st.dmg * 10) / 10));
  if (c.rate) ch.push('⚡ ' + tr('Speed') + ' ' + Math.round(st.rate * 10) / 10 + '/s');
  if (st.range) ch.push('👁️ ' + tr('Range') + ' ' + Math.round(st.range / T * 10) / 10);
  if (c.kind === 'farm') ch.push('🐟 +' + st.income + ' ' + tr('per wave'));
  if (c.kind === 'buff') ch.push('💗 +' + Math.round(st.buff * 100) + '%');
  if (c.kind === 'aura') ch.push('💤 -' + Math.round(st.slow * 100) + '% ' + tr('speed'));
  if (st.chain) ch.push('⛓️ ' + st.chain + ' ' + tr('jumps'));
  if (st.shots) ch.push('✴️ ' + st.shots + ' ' + tr('stars'));
  if (c.kind !== 'farm' && c.kind !== 'buff') ch.push(c.air ? '🪽 ' + tr('Hits flyers') : '🚫🪽 ' + tr('Ground only'));
  if (c.detect) ch.push('👀 ' + tr('Sees invisible'));
  return '<div class="stats">' + ch.map(x => '<span class="st">' + x + '</span>').join('') + '</div>';
}

/* ---------- goals ---------- */
function goalsHtml() {
  const done = ACH.filter(a => S.ach[a.id]).length;
  return '<p class="center"><b>' + done + ' / ' + ACH.length + '</b> ' + tr('goals done') + '</p>' + ACH.map(a => {
    const [v, m] = a.p(), ok = S.ach[a.id];
    return '<div class="ach' + (ok ? ' done' : '') + '"><div class="ai">' + a.i + '</div><div class="at">' + tr(a.name) + '<small>' + tr(a.desc) + '</small>' +
      (ok ? '' : '<div class="prog"><i style="width:' + Math.min(100, v / m * 100) + '%"></i></div>') + '</div><div class="rw">' + (ok ? '✔' : starIco() + a.r) + '</div></div>';
  }).join('');
}
function checkAch() {
  const got = [];
  for (const a of ACH) {
    if (S.ach[a.id]) continue;
    const [v, m] = a.p();
    if (v >= m) { S.ach[a.id] = 1; S.stars += a.r; S.earned += a.r; got.push(a); }
  }
  if (got.length) save();
  return got;
}
function checkBreeds() {
  const rules = {black: S.unlocked > 10, siamese: S.unlocked > 20, calico: S.unlocked > 30, galaxy: S.unlocked > 40,
    white: S.earned >= 60, tux: Object.keys(S.ach).length >= 12, golden: S.pack};
  const got = [];
  for (const k in rules) if (rules[k] && !S.breedOwn[k]) { S.breedOwn[k] = 1; got.push(BREED[k]); }
  if (got.length) save();
  return got;
}

/* ---------- canvas taps ---------- */
function toWorld(e) {
  const r = cv.getBoundingClientRect();
  return {x: (e.clientX - r.left - offX) / scale, y: (e.clientY - r.top - offY) / scale};
}
function spotAt(p) {
  let best = null, bd = T * 0.85;
  for (const s of G.map.spots) { const d = Math.hypot(s.x - p.x, s.y - 4 - p.y); if (d < bd) { bd = d; best = s; } }
  return best;
}
cv.addEventListener('pointerdown', e => {
  if (!G || screen !== 'game' || G.state !== 'play' || paused || modalOpen()) return;
  audioUnlock();
  const p = toWorld(e);
  if (G.pmode === 'bomb') {
    G.pmode = null; $('hint').classList.remove('on');
    usePower('bomb', p.x, p.y); refreshPw(); return;
  }
  const s = spotAt(p);
  if (s) { sfx('ui'); if (s.tw) openTower(s.tw); else openBuild(s); return; }
  closeSheet();
});
cv.addEventListener('pointermove', e => { if (G && G.pmode === 'bomb') G.aim = toWorld(e); });

    openModal('<h2>📺 ' + tr('Ad preview') + '</h2><p>' + tr('A real video ad plays here in the app.') + '</p><div class="ad-count" id="adCd">' + n + '</div>' +
      '<button class="btn wide" id="adSkip">' + tr('Close (no reward)') + '</button>');
    const back = r => {
      clearInterval(iv);

      res(r);
    };
    const iv = setInterval(() => { n--; const el = $('adCd'); if (el) el.textContent = n; if (n <= 0) back(true); }, 1000);
    $('adSkip').onclick = () => back(false);
  });
}
async function adsInit() { const A = AdMobP(); if (!A) return; try { await A.initialize({initializeForTesting: MONEY.TESTING}); } catch (e) {} }

function grantSku(sku) {
  if (sku !== PACK.sku || S.pack) return '';
  S.pack = true; S.noAds = true; S.stars += PACK.stars; S.earned += PACK.stars;
  POWERS.forEach(p => S.pw[p.id] = (S.pw[p.id] || 0) + 2);
  checkBreeds(); S.breedOwn.golden = 1;
  return '✨ ' + tr('Golden cat breed') + '<br>' + starIco() + ' +' + PACK.stars + ' ' + tr('stars') + '<br>🧪 +2 ' + tr('of each power-up') + '<br>📺 ' + tr('Ad rewards without ads');
}
const PRICES = {};
const priceOf = (sku, fb) => PRICES[sku] || fb;
let iapReady = false;
function iapStore() { return window.CdvPurchase && CdvPurchase.store; }
function iapInit() {
  const C = window.CdvPurchase; if (!C || iapReady) return;
  const {store, ProductType, Platform} = C; iapReady = true;
  store.register([{id: PACK.sku, type: ProductType.NON_CONSUMABLE, platform: Platform.GOOGLE_PLAY}]);
  store.when()
    .productUpdated(p => { if (p.pricing && p.pricing.price) PRICES[p.id] = p.pricing.price; })
    .approved(tx => {
      const tid = tx.transactionId || ('t' + now());
      if (!S.iapDone[tid]) {
        S.iapDone[tid] = now();
        (tx.products || []).forEach(it => { const msg = grantSku(it.id); if (msg) showThanks(msg); });
        save(); if (screen === 'shop') showMenu('shop');
      }
      tx.finish();
    });
  store.error(e => { if (e && e.code !== C.ErrorCode.PAYMENT_CANCELLED) toast(tr('Store error. Please try again.')); });
  store.initialize([Platform.GOOGLE_PLAY]);
}
document.addEventListener('deviceready', iapInit, false);
function showThanks(msg) { openModal('<h2>💝 ' + tr('Thank you!') + '</h2><p style="font-weight:800;line-height:1.8">' + msg + '</p><button class="btn org wide" id="tyOk">✔ ' + tr('Close') + '</button>'); bindBtn('tyOk', closeModal); sfx('win'); }
function buy(sku) {
  sfx('ui');
  const st = iapStore();
  if (st) {
    const p = st.get(sku), offer = p && p.getOffer();
    if (!offer) { toast(tr('Store is still loading. Try again in a moment.')); return; }
    offer.order(); return;
  }
  openModal('<h2>💳 ' + tr('Golden Paw Pack') + '</h2><p><b>' + PACK.price + '</b></p><p class="muted">' + tr('Demo mode: real payments work in the Android app through Google Play.') + '</p>' +
    (MONEY.DEMO_BUY ? '<button class="btn gold wide" id="dmBuy">' + tr('Demo: get it free') + '</button>' : '') + '<button class="btn wide" id="dmNo">' + tr('Close') + '</button>');
  bindBtn('dmBuy', () => { closeModal(); const msg = grantSku(sku); save(); if (screen === 'shop') showMenu('shop'); if (msg) showThanks(msg); });
  bindBtn('dmNo', closeModal);
}
function restorePurchases() {
  const st = iapStore();
  if (st && st.restorePurchases) { st.restorePurchases(); toast(tr('Checking your purchases...')); }
  else toast(tr('Restore works in the Android app.'));
}
function paidShopHtml() {
  return '<div class="card center" style="border-color:#d99a10;background:linear-gradient(#fffaf0,#fde9b0)">' +
    '<h3 style="color:#a8322a">👑 ' + tr('Golden Paw Pack') + '</h3><img class="pxi" style="width:90px" src="' + catURL('wiz', 'golden', 2) + '" alt="">' +
    '<div style="text-align:left;line-height:1.9;font-weight:800">✨ ' + tr('Golden cat breed') + '<br>' + starIco() + ' +' + PACK.stars + ' ' + tr('stars') + '<br>🧪 +2 ' + tr('of each power-up') + '<br>📺 ' + tr('Get every ad reward without watching ads') + '</div>' +
    (S.pack ? '<span class="st">✔ ' + tr('Owned') + '</span>' : '<button class="btn org wide" id="buyPack">' + priceOf(PACK.sku, PACK.price) + ' · ' + tr('one time') + '</button>') + '</div>' +
    '<p class="muted center">' + tr('Totally optional! Everything else can be earned by playing.') + '<br>' + tr('Payments are handled securely by Google Play.') + '</p>' +
    '<button class="btn wide" id="shRestore">💳 ' + tr('Restore purchases') + '</button>';
}
function bindPaidShop() { bindBtn('buyPack', () => buy(PACK.sku)); bindBtn('shRestore', restorePurchases); }
/* =====================================================================
   12. START — the main loop. Every frame: update() moves things,
   draw() paints them, hud() refreshes the numbers.
===================================================================== */
function resize() {
  const st = $('stage'), w = st.clientWidth, h = st.clientHeight;
  dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.width = w + 'px'; cv.style.height = h + 'px';
  scale = Math.min(w / W, h / H); offX = (w - W * scale) / 2; offY = (h - H * scale) / 2;
}
let last = performance.now(), slowT = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (screen === 'game' && G) {
    if (!paused && !modalOpen() && G.state === 'play' && !window.__PDfreeze) {
      const total = dt * S.speed, n = Math.ceil(total / 0.02);
      for (let i = 0; i < n && G.state === 'play'; i++) update(total / n);
    }
    draw(); hud();
    slowT += dt;
    if (slowT > 0.25) { slowT = 0; sheetTick(); tutTick(); }
    pointerTick();
  } else if (screen === 'title' && titleCv) drawTitle(titleCv, t / 1000);
  requestAnimationFrame(loop);
}
window.addEventListener('resize', () => { resize(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (screen === 'game' && G && G.state === 'play' && !paused && !modalOpen()) pauseMenu();
    if (AU.ctx) AU.ctx.suspend();
    save();
  } else if (AU.ctx) AU.ctx.resume();
});
document.addEventListener('pointerdown', () => audioUnlock(), {once: true});
// Android back button
try {
  const App = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App;
  if (App) App.addListener('backButton', () => {
    if (modalOpen()) { const tipOk = $('tipOk'); if (!$('wNext') && !$('lRe') && !$('dOk') && !$('cNext')) closeModal(); return; }
    if ($('sheet').classList.contains('on')) { closeSheet(); return; }
    if (screen === 'game') { if (G && G.state === 'play') pauseMenu(); return; }
    if (screen !== 'map' && screen !== 'title') { showMenu('map'); return; }
    if (screen === 'map') { showTitle(); return; }
    App.exitApp();
  });
} catch (e) {}

applyEasy();
checkBreeds();
resize();
refreshPw();
if ('ontouchstart' in window) document.body.classList.add('touch');
if (isNative()) document.documentElement.classList.add('native');
adsInit();
showTitle();
requestAnimationFrame(loop);

/* for testing in the browser console */
window.__PD = {get S() { return S; }, get G() { return G; }, CATS, BUGS, CONFIG, startPlay, startEndless, placeCat, upgradeCat, launchWave, update, genWaves, tstats, upCost, catCost, showMenu, levelIntro, save, usePower};

})();
