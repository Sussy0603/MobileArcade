<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fbe9dc">
<title>Kitty Café</title>
<style>
/* =====================================================================
   KITTY CAFÉ — styles
   Latte cream + soft pink. Change the colors here to restyle the game.
===================================================================== */
:root{
  --cream:#fff6ea; --latte:#f1dcc0; --caramel:#c58a57; --mocha:#7a5236;
  --pink:#ffdbe4; --pink2:#ff8fab; --mint:#d3f1e4; --mint2:#4cbf98;
  --lav:#e8defe; --lav2:#a58cff; --lemon:#fff1b8; --lemon2:#ffd34d; --sky2:#5fb2f0;
  --ink:#5b3d2c; --ink2:#937663; --card:#fffdf9; --line:#f0dcc8;
  --gold:#ffc83d; --good:#3fbf8f; --bad:#ff6b81;
  --r:18px; --font:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fbefe3;color:var(--ink);font-family:var(--font);font-size:calc(15px * var(--fs))}
body.easy{--font:Verdana,"Segoe UI",Tahoma,sans-serif;letter-spacing:.04em;word-spacing:.12em;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font-family:inherit;font-size:16px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* coin + fish gem icons (drawn with CSS, no image) */
.cn{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:-.13em;position:relative;
  background:radial-gradient(circle at 35% 30%,#fff6c4 0 14%,#ffd54a 32%,#f0a91c 78%,#c98200);box-shadow:0 1px 0 #0002,inset 0 0 0 1.5px #fff5}
.cn::after{content:"";position:absolute;inset:26%;border-radius:50%;border:1.5px solid #c98200aa}
.gm{display:inline-block;width:1.15em;height:.8em;vertical-align:-.06em;
  background:linear-gradient(135deg,#d9f4ff 0,#7fd0ff 35%,#4f9df5 70%,#3a6fe0);
  clip-path:polygon(0 50%,22% 10%,58% 4%,76% 40%,100% 8%,96% 50%,100% 92%,76% 60%,58% 96%,22% 90%)}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:linear-gradient(#fffaf3,#fbe6d6);border-bottom:2px solid #efd2bb;z-index:20}
.pill{display:flex;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:5px 10px 5px 7px;font-weight:900;box-shadow:0 2px 0 #ecd2bd;white-space:nowrap;min-width:0;font-size:1em}
.pill .ic{font-size:18px;line-height:1}
.pill .cn{width:18px;height:18px}
.pill .gm{width:21px;height:15px}
.pill.lv{flex:1;max-width:200px;min-width:70px}
.xpbar{flex:1;height:9px;background:#f6e7da;border-radius:9px;overflow:hidden;min-width:30px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--caramel),var(--pink2));border-radius:9px;transition:width .4s}
#boosts{display:flex;gap:3px;overflow:hidden;flex-wrap:nowrap}
.bst{font-size:11px;font-weight:900;background:var(--lemon);border-radius:99px;padding:3px 7px;white-space:nowrap}
.roundBtn{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 0 #ecd2bd;display:grid;place-items:center;flex:none;font-size:20px;overflow:hidden}
#muteBtn{margin-left:auto}
#profBtn svg{width:40px;height:36px}
@media (max-width:420px){#boosts .bst:nth-child(n+2){display:none}.pill{padding:4px 8px 4px 5px}}
/* ---------- body / nav ---------- */
#body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#main{flex:1;position:relative;min-width:0;overflow:hidden}
#nav{display:flex;justify-content:space-around;background:#fff;border-top:2px solid #efd2bb;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:14px;font-size:12px;font-weight:900;color:var(--ink2);position:relative;min-height:54px}
#nav button .e{font-size:25px;line-height:1.1}
#nav button.on{background:var(--pink);color:var(--ink)}
.dot{position:absolute;top:3px;right:24%;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid #fff;display:none}
.dot.show{display:block}
@media (min-width:820px){
  #body{flex-direction:row-reverse}
  #nav{flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:2px solid #efd2bb;padding:10px 8px;width:96px}
  #nav button{flex:none;padding:10px 0}
  .view .inner{max-width:760px;margin:0 auto}
}
/* ---------- views ---------- */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding:12px 12px 30px;-webkit-overflow-scrolling:touch;background:#fdf4ea}
.view.on{display:block}
#vCafe{padding:0;overflow:hidden;background:#f6e3cf}
h2{margin:4px 0 10px;font-size:1.35em}
h3{margin:14px 0 8px;font-size:1.08em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:9px 14px;border-radius:99px;background:#fff;font-weight:900;box-shadow:0 2px 0 var(--line)}
.tabs button.on{background:var(--pink);box-shadow:0 2px 0 #f3b9c8}
.card{background:var(--card);border-radius:var(--r);padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:8px;box-shadow:0 3px 0 var(--line);position:relative}
.card .art{width:62px;height:62px;flex:none;border-radius:14px;background:var(--latte);display:grid;place-items:center;font-size:32px;overflow:hidden}
.card .art svg{width:58px;height:54px}
.card .info{flex:1;min-width:0}
.nm{font-weight:900}
.sub{font-size:.86em;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{background:var(--card);border-radius:16px;padding:8px 4px 6px;text-align:center;box-shadow:0 3px 0 var(--line);position:relative;font-size:.84em;font-weight:900}
.tile svg{width:76px;height:70px;display:block;margin:0 auto}
.tile.lock{background:#f4ece4}
.tile.lock svg{filter:brightness(0) opacity(.16)}
.btn{background:var(--pink2);color:#fff;font-weight:900;padding:10px 15px;border-radius:14px;box-shadow:0 3px 0 #dd6f8f;white-space:nowrap;min-height:42px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #dd6f8f}
.btn.mint{background:var(--mint2);box-shadow:0 3px 0 #2f9a76}
.btn.lav{background:var(--lav2);box-shadow:0 3px 0 #7c62dd}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 3px 0 #d79d12}
.btn.brown{background:var(--caramel);box-shadow:0 3px 0 #96613a}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.wide{display:block;width:100%;margin-top:8px;padding:13px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.btn.sm{padding:7px 11px;font-size:.88em;min-height:38px}
.tag{display:inline-block;font-size:.74em;font-weight:900;padding:2px 7px;border-radius:99px;background:var(--lemon);vertical-align:middle}
.r0{background:#f4ece4}.r1{background:#dcefff}.r2{background:linear-gradient(90deg,#ffe0ea,#e7dcff)}.r3{background:linear-gradient(90deg,#fff1b8,#ffd9c2)}.r4{background:linear-gradient(90deg,#2f3566,#6b5fb0)}
.bar{height:11px;border-radius:9px;background:#f5e9de;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:9px}
.mood{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:.92em;font-weight:900}
.mood span{width:26px;text-align:center}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--ink2);font-size:.86em}
.center{text-align:center}
.hearts{letter-spacing:-1px}
.seg{display:flex;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.seg button{flex:1;padding:9px 6px;font-weight:900}
.seg button.on{background:var(--pink)}
/* ---------- café scene ---------- */
#scene{position:absolute;inset:0;overflow:hidden;touch-action:none}
#sceneBg{position:absolute;inset:0;width:100%;height:100%}
#props,#fxL,#cats{position:absolute;inset:0}
#props{pointer-events:none}
#props .slotAdd{pointer-events:auto}
.prop{position:absolute;transform:translate(-50%,-100%)}
.prop svg{width:100%;height:100%;display:block;overflow:visible}
.slotAdd{position:absolute;transform:translate(-50%,-80%);width:46px;height:46px;border-radius:50%;border:3px dashed #ffffffd0;background:#ffffff40;color:#fff;font-size:26px;font-weight:900;display:grid;place-items:center;text-shadow:0 1px 2px #0003;z-index:2}
.slotAdd small{position:absolute;bottom:-18px;font-size:11px;white-space:nowrap;background:#fffd;color:var(--ink);border-radius:8px;padding:0 5px;text-shadow:none}
.beam{position:absolute;pointer-events:none;background:linear-gradient(180deg,#fff7c000,#fff3b066 40%,#ffe9805e);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);animation:beam 5s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes beam{from{opacity:.55}to{opacity:1}}
#dark{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,#3a2a5a,#140f28);opacity:0;transition:opacity 1.2s}
#fxL{pointer-events:none;z-index:200}
.cat{position:absolute;width:80px;height:72px;transform:translate(-50%,-94%);touch-action:none;z-index:3}
.cat .flip{width:100%;height:100%;transition:transform .3s}
.cat .bob{width:100%;height:100%;transform-origin:50% 100%}
.cat svg{width:100%;height:100%;overflow:visible;display:block}
.cat .front{position:absolute;left:-12%;right:-12%;bottom:-5%;height:36%;pointer-events:none}
.cat .front svg{width:100%;height:100%}
.cat.walk .bob{animation:walk .32s ease-in-out infinite alternate}
.cat.nap .bob{animation:breathe 3.4s ease-in-out infinite}
.cat.sit .bob{animation:idle 4s ease-in-out infinite}
.cat.pop .bob{animation:pop .45s ease}
.cat .tl{transform-box:fill-box;transform-origin:10% 90%;animation:tail 2.6s ease-in-out infinite}
.cat.happy .tl{animation:tail .35s ease-in-out 6}
.cat .zz{position:absolute;top:2px;right:6px;font-size:15px;font-weight:900;color:#8a6ac9;animation:zz 2s infinite}
.cat .bub{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:17px;background:#fff;border-radius:12px;padding:0 5px;box-shadow:0 2px 0 #0002;white-space:nowrap}
.cat.sel::after{content:"";position:absolute;left:18%;right:18%;bottom:-5px;height:9px;border-radius:50%;background:#fff9;box-shadow:0 0 10px #fff}
.cat.leave{transition:opacity 1s;opacity:0}
.cat.adoptable .bob svg{filter:drop-shadow(0 0 4px #ffd34d)}
.glowOn .cat.glowy .bob svg{filter:drop-shadow(0 0 6px var(--gc)) drop-shadow(0 0 12px var(--gc))}
.cust{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.cust svg{width:100%;height:100%;display:block}
.cust.sip .cup{animation:sip 3s ease-in-out infinite}
@keyframes sip{0%,70%,100%{transform:translateY(0)}80%,90%{transform:translateY(-3px)}}
@keyframes walk{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-4px) rotate(2deg)}}
@keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.95)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18,.84)}70%{transform:scale(.94,1.1)}100%{transform:scale(1)}}
@keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
.fx{position:absolute;pointer-events:none;font-size:21px;font-weight:900;animation:fxup 1.1s ease-out forwards;white-space:nowrap;text-shadow:0 2px 0 #fff}
@keyframes fxup{from{opacity:1;transform:translate(-50%,0) scale(.7)}30%{transform:translate(-50%,-14px) scale(1.15)}to{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.steam{position:absolute;width:6px;height:14px;border-radius:6px;background:#fff9;pointer-events:none;animation:steam 2.2s ease-out forwards}
@keyframes steam{from{opacity:.8;transform:translate(0,0) scaleX(1)}to{opacity:0;transform:translate(6px,-30px) scaleX(1.8)}}
.star{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:twk 2.5s ease-in-out infinite alternate;pointer-events:none}
@keyframes twk{from{opacity:.2}to{opacity:1}}
.flake{position:absolute;top:-10px;font-size:12px;pointer-events:none;animation:fall linear infinite;color:#fff}
@keyframes fall{to{transform:translate(30px,110vh) rotate(360deg)}}
#roomName{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fffe;border-radius:99px;padding:3px 6px;font-weight:900;z-index:210;white-space:nowrap;display:flex;gap:4px;align-items:center;box-shadow:0 2px 0 #0001}
#roomName button{font-size:20px;width:38px;height:38px;border-radius:50%}
#roomName button[disabled]{opacity:.25}
#sideR{position:absolute;top:60px;right:8px;display:flex;flex-direction:column;gap:10px;z-index:210}
.fab{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #0002;font-size:26px;display:grid;place-items:center;position:relative}
.fab small{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;background:#fff;border-radius:6px;padding:0 4px;white-space:nowrap}
.fab .bdg{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;font-size:11px;font-weight:900;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 4px}
.fab.glow{animation:wob .6s ease-in-out infinite alternate}
@media (max-height:700px){#sideR{top:52px;gap:6px}.fab{width:46px;height:46px;font-size:21px}#roomName button{width:32px;height:32px;font-size:17px}}
@keyframes wob{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
#careBar{position:absolute;left:8px;right:8px;bottom:10px;z-index:210;display:flex;justify-content:center}
#careBar .cb{background:#fffe;border-radius:20px;padding:8px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 #0002;max-width:520px;width:100%}
#careBar .cb .who{flex:1;min-width:0;font-weight:900;line-height:1.2;overflow:hidden}
#careBar .cb .who small{display:block;font-weight:700;color:var(--ink2);font-size:.8em}
#careBar .cbtn{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:900;background:var(--pink);border-radius:14px;padding:5px 4px;min-width:52px;min-height:52px;justify-content:center}
#careBar .cbtn b{font-size:22px;line-height:1}
#careBar .cbtn.gold{background:var(--lemon2);animation:wob .6s ease-in-out infinite alternate}
#careBar .hint{background:#fffd;border-radius:99px;padding:8px 14px;font-weight:900;box-shadow:0 3px 0 #0002}
/* ---------- modal ---------- */
#modalBg{position:fixed;inset:0;background:#4a2e2066;display:none;z-index:500;align-items:center;justify-content:center;padding:14px}
#modalBg.on{display:flex}
#modal{background:#fff;border-radius:24px;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;padding:16px;box-shadow:0 10px 40px #0003;animation:mIn .25s ease;position:relative}
@keyframes mIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#modal h2{text-align:center;margin-top:0;padding:0 30px}
#mClose{position:absolute;top:8px;right:10px;font-size:22px;width:40px;height:40px;border-radius:50%;background:#f8efe6}
.reward{text-align:center}
.reward .big{font-size:60px;line-height:1.1}
.reward .big svg{width:170px;height:153px}
.reward .amt{font-size:1.5em;font-weight:900;margin:6px 0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:800;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.tst{background:#fff;border-radius:14px;padding:10px 15px;font-weight:900;box-shadow:0 4px 14px #0002;animation:tIn .3s ease;max-width:100%;text-align:center}
.tst.gold{background:var(--lemon)}.tst.err{background:#ffe0e5}
@keyframes tIn{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.pickGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:44vh;overflow-y:auto;padding:2px}
.pickGrid button{background:#fbf3ea;border-radius:14px;padding:4px;font-weight:900;font-size:.8em;border:3px solid transparent}
.pickGrid button svg{width:70px;height:63px;display:block;margin:0 auto}
.pickGrid button.on{border-color:var(--pink2);background:var(--pink)}
/* ---------- mini games ---------- */
#game{position:fixed;inset:0;z-index:600;background:#f1dcc0;display:none;touch-action:none}
#game.on{display:block}
#gCanvas{position:absolute;inset:0;width:100%;height:100%}
#gHud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:2;font-weight:900;font-size:1.1em;gap:6px}
#gOver,#gIntro{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#4a2e2055;z-index:3;padding:16px}
#gOver.on,#gIntro.on{display:flex}
#gOver .box,#gIntro .box{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:360px;text-align:center}
/* ---------- loading ---------- */
#load{position:fixed;inset:0;z-index:1000;background:linear-gradient(#fff6ea,#ffdbe4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .6s}
#load .logo{font-size:2.4em;font-weight:900;color:#ff7fa0;text-shadow:0 3px 0 #fff;text-align:center;line-height:1.05}
#load .wd{width:140px;height:126px;animation:walk .6s ease-in-out infinite alternate}
#load .wd svg{width:100%;height:100%}
#load .tip{max-width:300px;text-align:center;font-weight:800;color:var(--ink2);padding:0 20px}
#load .lbar{width:200px;height:11px;background:#fff;border-radius:9px;overflow:hidden}
#load .lbar i{display:block;height:100%;width:0;background:var(--pink2);transition:width .3s}
/* ---------- tutorial ---------- */
#tut{position:fixed;left:8px;right:8px;z-index:450;display:none;pointer-events:none}
#tut.on{display:flex;justify-content:center}
#tut .box{pointer-events:auto;background:#fff;border-radius:20px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px #0003;max-width:460px;width:100%;border:3px solid var(--lemon2)}
#tut #tutCap svg{width:58px;height:52px;flex:none}
#tut .tx{flex:1;font-weight:900;font-size:.95em}
.hl{outline:4px solid var(--lemon2)!important;outline-offset:2px;animation:hlp 1s infinite alternate;z-index:440}
@keyframes hlp{from{outline-color:var(--lemon2)}to{outline-color:var(--pink2)}}
</style>
</head>
<body>
<div id="load">
  <div class="logo">Kitty<br>Café</div>
  <div class="wd" id="loadCat"></div>
  <div class="lbar"><i id="loadBar"></i></div>
  <div class="tip" id="loadTip"></div>
</div>
<div id="app">
  <div id="top">
    <button class="pill" id="pCoin"><i class="cn"></i><span id="vCoin">0</span></button>
    <button class="pill" id="pGem"><i class="gm"></i><span id="vGem">0</span></button>
    <button class="pill lv" id="pLevel"><span class="ic">⭐</span><span id="vLevel">1</span><span class="xpbar"><i id="vXp"></i></span></button>
    <div id="boosts"></div>
    <button class="roundBtn" id="muteBtn" aria-label="Sound">🔊</button>
    <button class="roundBtn" id="profBtn" aria-label="Profile"></button>
  </div>
  <div id="body">
    <div id="main">
      <div class="view on" id="vCafe">
        <div id="scene">
          <svg id="sceneBg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
          <div id="props"></div>
          <div id="dark"></div>
          <div id="cats"></div>
          <div id="fxL"></div>
        </div>
        <div id="roomName"></div>
        <div id="sideR"></div>
        <div id="careBar"></div>
      </div>
      <div class="view" id="vCats"><div class="inner" id="iCats"></div></div>
      <div class="view" id="vShop"><div class="inner" id="iShop"></div></div>
      <div class="view" id="vGames"><div class="inner" id="iGames"></div></div>
      <div class="view" id="vMore"><div class="inner" id="iMore"></div></div>
    </div>
    <div id="nav"></div>
  </div>
</div>
<div id="modalBg"><div id="modal"><button id="mClose" aria-label="Close">✕</button><div id="mBody"></div></div></div>
<div id="toast"></div>
<div id="tut"><div class="box"><div id="tutCap"></div><div class="tx" id="tutTx"></div><button class="btn sm" id="tutBtn">OK</button></div></div>
<div id="game">
  <canvas id="gCanvas"></canvas>
  <div id="gHud"></div>
  <div id="gIntro"><div class="box" id="gIntroBox"></div></div>
  <div id="gOver"><div class="box" id="gOverBox"></div></div>
</div>

/* =====================================================================

function weighted(odds){ let s = odds.reduce((a, b) => a + b, 0), r = Math.random() * s; for(let i=0;i<odds.length;i++){ r -= odds[i]; if(r < 0) return i; } return odds.length - 1; }
function fmt(n){
  n = Math.floor(n || 0); if(n < 1000) return String(n);
  const u = ['K','M','B','T','Qa','Qi','Sx','Sp']; let i = -1;
  while(n >= 1000 && i < u.length - 1){ n /= 1000; i++; }
  return (n >= 100 ? Math.floor(n) : n >= 10 ? (Math.floor(n * 10) / 10) : (Math.floor(n * 100) / 100)) + u[i];
}
function fmtTime(sec){
  sec = Math.max(0, Math.ceil(sec));
  if(sec < 60) return sec + 's';
  const m = Math.floor(sec / 60), s = sec % 60;
  if(m < 60) return m + 'm' + (s ? ' ' + s + 's' : '');
  const h = Math.floor(m / 60); if(h < 48) return h + 'h ' + (m % 60) + 'm';
  return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}
function dayNum(t){ const d = new Date(t); return Math.floor((t - d.getTimezoneOffset() * 60000) / 86400000); }
function isNight(t){ const h = new Date(t || now()).getHours(); return h >= CONFIG.NIGHT_START || h < CONFIG.NIGHT_END; }

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){ const o = JSON.parse(raw); if(o && o.v) return fixState(o); }
  }catch(e){}
  return null;
}
/* fills in anything missing from an older save */
function fixState(o){
  const d = newState();
  for(const k in d) if(o[k] === undefined) o[k] = d[k];
  ['stats','inv','menu','up'].forEach(g => { for(const k in d[g]) if(o[g][k] === undefined) o[g][k] = d[g][k]; });
  o.open.forEach(id => { if(!o.rooms[id]) o.rooms[id] = {spots: ROOM(id).start}; });
  return o;
}
function saveNow(){

}

===================================================================== */
function L(o){ if(!o) return ''; return (S && S.lang === 'fr' && o.fr) ? o.fr : (o.en || ''); }
function tr(s, vars){
  let out = (S && S.lang === 'fr' && FR[s]) ? FR[s] : s;
  if(vars) for(const k in vars) out = out.split('{' + k + '}').join(vars[k]);
  return out;
}

function freeSlots(r){ const out = []; for(let i=0;i<slotsOwned(r);i++) if(!slotCat(r, i)) out.push(i); return out; }
const spotOf = c => c.here ? ROOM(c.here.r).slots[c.here.s] : null;
const inFav = c => { const sp = spotOf(c); return !!(sp && sp.k === c.fav); };
const moodAvg = c => (c.m.food + c.m.fun) / 2;
function hearts(c){ let h = 0; CONFIG.FRIEND_LEVELS.forEach(v => { if(c.f >= v) h++; }); return h; }
function nextHeartAt(c){ return CONFIG.FRIEND_LEVELS.find(v => v > c.f); }
const canAdopt = c => !c.res && c.here && hearts(c) >= CONFIG.ADOPT_HEARTS;

const roomMult = r => Math.pow(CONFIG.ROOM_MULT, tierOf(r));
const menuMult = () => 1 + MENU_IDS.reduce((s, k) => s + S.menu[k] * MENU[k].bonus, 0);
const themeMult = () => 1 + THEME_IDS.reduce((s, k) => s + (S.themes[k] && THEMES[k].bonus ? THEMES[k].bonus : 0), 0);
const itemMult = () => 1 + 0.05 * ITEM_IDS.filter(k => S.items[k]).length;
function globalMult(t){ return menuMult() * themeMult() * itemMult() * (S.ad2x > (t || now()) ? 2 : 1); }
function catRate(c, t){
  if(!c.here) return 0;
  const B = BREEDS[c.b] || BREEDS.tabby, h = hearts(c);
  const mood = CONFIG.SAD_MIN + (1 - CONFIG.SAD_MIN) * moodAvg(c) / 100;
  const friend = 1 + h * (CONFIG.FRIEND_BONUS + (c.t === 'shy' ? 0.03 : 0));
  return CONFIG.BASE_RATE * CONFIG.RARITY_MULT[B.r] * roomMult(c.here.r) * mood * friend *
    (inFav(c) ? 1 + CONFIG.FAV_BONUS : 1) * (c.res ? 1 + CONFIG.RESIDENT_BONUS : 1) * (c.t === 'greedy' ? 1.2 : 1) * globalMult(t);
}
const incomePerSec = () => present().reduce((s, c) => s + catRate(c), 0);
const roomIncome = r => catsIn(r).reduce((s, c) => s + catRate(c), 0);
const incomeFloor = () => Math.max(2, incomePerSec());
const priceScale = () => Math.pow(3, S.open.length - 1);
/* how cozy the café is: more spots, themes, items and rooms = rarer cats */
function coziness(){
  return ROOM_IDS.reduce((s, r) => s + slotsOwned(r), 0) + 3 * (S.open.length - 1) +
    2 * (THEME_IDS.filter(k => S.themes[k]).length - 1) + 2 * ITEM_IDS.filter(k => S.items[k]).length + Math.floor(MENU_IDS.reduce((s, k) => s + S.menu[k], 0) / 4);
}

function addC(n){ S.co += n; if(n > 0) S.stats.coins += n; }
function addG(n){ S.gm += n; }
function canPay(cur, n){ return cur === 'g' ? S.gm >= n : S.co >= n; }
function pay(cur, n){
  if(!canPay(cur, n)){ toast(cur === 'g' ? GM + ' ' + tr('Not enough fish gems') : CN + ' ' + tr('Not enough coins'), 'err'); sfx('err'); return false; }
  if(cur === 'g') S.gm -= n; else S.co -= n;
  return true;
}
const xpNeed = lv => Math.round(CONFIG.XP_BASE * Math.pow(lv, CONFIG.XP_POW));
function titleOf(lv){ let t = TITLES[0][1]; TITLES.forEach(([l, n]) => { if(lv >= l) t = n; }); return t; }
function addXP(n){
  S.xp += n;
  while(S.xp >= xpNeed(S.lv)){
    S.xp -= xpNeed(S.lv); S.lv++;
    const pr = Math.round(Math.max(200, incomeFloor() * 300)), gr = 2 + Math.floor(S.lv / 3);
    addC(pr); addG(gr); sfx('level');
    const opens = ROOMS.filter((r, i) => i > 0 && r.lvl === S.lv).map(r => '<br>🔓 ' + r.e + ' ' + L(r) + ' ' + tr('can be opened in the Shop!'));
    const menu = MENU_IDS.filter(k => MENU[k].lvl === S.lv && k !== 'coffee').map(k => '<br>🔓 ' + MENU[k].e + ' ' + L(MENU[k]) + ' ' + tr('is on the menu now!'));
    queueModal(() => showReward('⭐', tr('Level {n}!', {n: S.lv}), '+' + fmt(pr) + ' ' + CN + ' +' + gr + ' ' + GM + '<br>' + L(titleOf(S.lv)) + opens.join('') + menu.join('')));
  }
}

/* ---------- cats: who comes to visit? ---------- */
function randName(){ const used = new Set(S.cats.map(c => c.n)); const free = NAMES.filter(n => !used.has(n)); return pick(free.length ? free : NAMES); }
function breedOK(b){ const B = BREEDS[b]; return !B.hidden && !B.paid && !B.season && (!B.need || S.items[B.need]); }
function chooseBreed(kind){
  const season = seasonNow(), cz = coziness();
  const sChance = kind === 'daily' ? 0.12 : kind === 'rare' ? 0.2 : CONFIG.SEASON_CHANCE * (1 + cz / 40);
  if(Math.random() < sChance){ const sb = BREED_IDS.find(k => BREEDS[k].season === season); if(sb) return sb; }
  const odds = kind === 'rare' ? [0, 50, 50] : kind === 'daily' ? [25, 55, 20] : [70, 24, 6 * (1 + cz / 25)];
  const r = weighted(odds);
  let pool = BREED_IDS.filter(k => BREEDS[k].r === r && breedOK(k));
  if(!pool.length) pool = BREED_IDS.filter(k => BREEDS[k].r === 1);
  return pick(pool);
}
function newCat(b, o){
  o = o || {};
  const c = {id: S.nextId++, n: o.n || randName(), b, t: o.t || pick(PERS_IDS), fav: o.fav || pick(SPOT_IDS), f: o.f || 0, visits: 0, res: false,
    here: null, m: {food: 70, fun: 70}, pet: 0, toyAt: 0, met: now(), left: 0};
  S.cats.push(c);
  return c;
}
/* where can a cat sit? its favorite spot if free, else any free spot */
function pickSlot(c, prefer){
  const rooms = [prefer || S.cur].concat(S.open).filter((r, i, a) => a.indexOf(r) === i);
  for(const r of rooms){
    const fr = freeSlots(r); if(!fr.length) continue;
    const fav = fr.filter(i => ROOM(r).slots[i].k === c.fav);
    return {r, s: fav.length ? pick(fav) : pick(fr)};
  }
  return null;
}
const anyFree = () => S.open.some(r => freeSlots(r).length > 0);
/* a cat walks in. kind: random | daily | rare | pack. Returns the cat or null */
function arrive(kind, t, offline, forceCat){
  t = t || now();
  if(!anyFree()){
    if(kind !== 'random' && !forceCat){ S.queue.push(kind); if(!offline) toast('🐾 ' + tr('A cat is waiting at the door! Buy a new spot in the Shop.'), 'gold'); }
    return null;
  }
  let c = forceCat || null;
  if(!c && kind === 'random' && Math.random() < CONFIG.RETURN_CHANCE){
    const known = S.cats.filter(q => !q.here && !q.res && t - (q.left || 0) > 20 * 60000 && !BREEDS[q.b].paid && (!BREEDS[q.b].season || BREEDS[q.b].season === seasonNow()));
    if(known.length) c = pick(known);
  }
  if(!c) c = newCat(chooseBreed(kind));
  const where = pickSlot(c); if(!where) return null;
  const stay = rnd(...CONFIG.STAY_HOURS) * 3600000;
  c.here = {r: where.r, s: where.s, until: c.res ? 0 : t + stay};
  if(!forceCat) c.m = {food: rnd(35, 75), fun: rnd(45, 85)};
  c.visits++; S.stats.visits++;
  const isNew = !S.book[c.b];
  addToBook(c.b, offline);
  if(!offline){
    sfx('meow');
    if(where.r === S.cur && curView === 'Cafe') actorEnter(c);
    if(!isNew) toast('🐾 ' + (c.visits > 1 ? tr('{n} came back to visit!', {n: esc(c.n)}) : tr('{n} came in!', {n: esc(c.n)})), c.visits > 1 ? 'gold' : '');
    renderCafeLight();
  }
  return c;
}
function leave(c, offline){
  if(!c.here || c.res) return;
  const r = c.here.r;
  c.here = null; c.left = now();
  if(sel === c.id) sel = null;
  if(!offline){
    if(r === S.cur && curView === 'Cafe') actorLeave(c);
    toast('👋 ' + tr('{n} went home. See you soon!', {n: esc(c.n)}));
    renderCafeLight();
  }
  // keep the save small: forget old visitors you never made friends with
  if(S.cats.length > 90){
    const drop = S.cats.filter(q => !q.here && !q.res && q.id !== S.avatar).sort((x, y) => (x.f - y.f) || (x.left - y.left)).slice(0, S.cats.length - 75);
    const ids = new Set(drop.map(q => q.id)); S.cats = S.cats.filter(q => !ids.has(q.id));
  }
  // a waiting cat can come in now
  if(S.queue.length) S.nextArrive = Math.min(S.nextArrive, now() + 4000);
}
const arriveGap = () => rnd(...CONFIG.ARRIVE_MIN) * 60000 * Math.pow(0.82, S.up.flap);

/* first time a breed visits = a new page in the cat book */
function addToBook(b, offline){
  if(S.book[b]) return false;
  S.book[b] = now();
  if(S.tut === 0) return true;   // the starting cats
  const B = BREEDS[b], gr = [3, 6, 12, 15, 0][B.r];
  addG(gr); addXP(15 + B.r * 12);
  queueModal(() => {
    sfx('new');
    showReward(catSVG(b, {size: 170}), '✨ ' + tr('New cat in your book!'),
      '<b style="color:' + RARITY[B.r].c + '">' + L(B) + ' · ' + L(RARITY[B.r]) + '</b>' + (gr ? '<br>+' + gr + ' ' + GM : '') + '<br><span class="muted">' + tr('Make friends to adopt it!') + '</span>');
  });
  return true;
}

/* ---------- care ---------- */
function addFriend(c, n){
  const h0 = hearts(c);
  c.f += n * (c.t === 'shy' ? 0.7 : 1);
  if(hearts(c) > h0){
    toast('💗 ' + esc(c.n) + ' ' + tr('likes you more!') + ' ' + '❤️'.repeat(hearts(c)), 'gold'); sfx('level');
    if(!c.res && hearts(c) === CONFIG.ADOPT_HEARTS){ setTimeout(() => toast('🏠 ' + tr('{n} can be adopted now!', {n: esc(c.n)}), 'gold'), 900); }
  }
}
/* returns true, false (cooldown) or 'hiss' (grumpy cat said no) */
function petCat(c, silent){
  const t = now();
  if(t - (c.pet || 0) < CONFIG.PET_COOLDOWN_MS) return false;
  c.pet = t;
  if(c.t === 'grumpy' && hearts(c) < 3 && Math.random() < 0.35){ if(!silent) sfx('hiss'); return 'hiss'; }
  c.m.fun = Math.min(100, c.m.fun + CONFIG.PET_FUN);
  addFriend(c, CONFIG.PET_FRIEND);
  const bonus = Math.max(1, Math.round(catRate(c) * CONFIG.PET_COINS_SEC));
  addC(bonus); c.lastBonus = bonus;
  S.stats.pets++; addXP(1);
  if(!silent) sfx('purr');
  tutEvent('pet');
  return true;
}
function feedCat(c, k){
  if(S.inv[k] < 1){ toast(FOODS[k].e + ' ' + tr('You have none. Buy some in the Shop.'), 'err'); sfx('err'); return false; }
  const F = FOODS[k];
  S.inv[k]--; c.m.food = Math.min(100, c.m.food + F.food); c.m.fun = Math.min(100, c.m.fun + F.fun);
  addFriend(c, F.fr_ * (c.t === 'grumpy' ? 1.5 : 1));
  if(c.here && !c.res) c.here.until += CONFIG.FEED_STAY_MIN * 60000;
  S.stats.feeds++; addXP(2); sfx('eat');
  tutEvent('feed'); saveNow();
  return true;
}
function toyCat(c, k){
  const T = TOYS[k], t = now();
  if(t < (c.toyAt || 0)){ toast('⏳ ' + tr('Let it rest a moment'), 'err'); return false; }
  c.toyAt = t + CONFIG.TOY_COOLDOWN_SEC * 1000;
  const x2 = c.t === 'playful' ? 2 : 1;
  c.m.fun = Math.min(100, c.m.fun + T.fun * x2);
  addFriend(c, T.fr_ * x2); S.stats.toys++; addXP(2); sfx('boing'); saveNow();
  return true;
}
function adoptCat(c){
  if(!canAdopt(c)) return;
  c.res = true; c.here.until = 0; S.stats.adopted++;
  addG(5); addXP(30); sfx('new'); saveNow();
  if(!S.avatar || !catById(S.avatar) || !catById(S.avatar).res) S.avatar = c.id;
  showReward(catSVG(c.b, {size: 180, collar: true}), '🏠 ' + tr('{n} lives here now!', {n: esc(c.n)}),
    tr('Resident cats stay forever and bring +50% coins.') + '<br>+5 ' + GM);
  renderCafe();
}

/* ---------- costs ---------- */
const spotCost = r => Math.round(150 * Math.pow(2.3, slotsOwned(r) - ROOM(r).start + tierOf(r) * 0.5) * roomMult(r));
const menuCost = k => Math.round(MENU[k].p * Math.pow(1.75, S.menu[k] - (k === 'coffee' ? 1 : 0)));
const menuOpen = k => S.lv >= MENU[k].lvl;
const jarCost = () => Math.round(2000 * Math.pow(4, S.up.jar));
const flapCost = () => Math.round(1000 * Math.pow(3, S.up.flap));
const foodPrice = k => Math.round(FOODS[k].p * priceScale());
const toyPrice = k => Math.round(TOYS[k].p * priceScale());
const offlineCapH = () => CONFIG.OFFLINE_HOURS + CONFIG.OFFLINE_UP_HOURS * S.up.jar;
function canOpenRoom(i){ return !S.open.includes(ROOMS[i].id) && S.open.length === i && S.lv >= ROOMS[i].lvl; }
/* the cheapest coin upgrade (for the free upgrade ad) */
function cheapestUpgrade(){
  const opts = [];
  S.open.forEach(r => { if(slotsOwned(r) < ROOM(r).slots.length) opts.push({cost: spotCost(r), n: SPOTS[ROOM(r).slots[slotsOwned(r)].k].e + ' ' + tr('New spot') + ' · ' + L(ROOM(r)), go: () => { S.rooms[r].spots++; S.nextArrive = Math.min(S.nextArrive, now() + 8000); }}); });
  MENU_IDS.forEach(k => { if(menuOpen(k) && S.menu[k] < MENU_MAX) opts.push({cost: menuCost(k), n: MENU[k].e + ' ' + L(MENU[k]) + ' ' + tr('Lv') + ' ' + (S.menu[k] + 1), go: () => { S.menu[k]++; }}); });
  opts.sort((a, b) => a.cost - b.cost);
  return opts[0] || null;
}

/* =====================================================================
   6. ART — every cat, customer and café thing is drawn in code (SVG).
   No image files needed.
===================================================================== */
function shade(hex, amt){ // amt -1..1 (darker..lighter)
  let c = hex.replace('#', ''); if(c.length === 3) c = c.split('').map(x => x + x).join('');
  let r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  const f = v => Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt);
  return '#' + [f(r), f(g), f(b)].map(v => clamp(v, 0, 255).toString(16).padStart(2, '0')).join('');
}
let svgUid = 0;
/* stable pseudo-random numbers, so patterns look the same every time */
function seeded(n){ const out = []; let s = n * 9301 + 49297; for(let i=0;i<60;i++){ s = (s * 9301 + 49297) % 233280; out.push(s / 233280); } return out; }
const E = (cx, cy, rx, ry, fill, extra) => '<ellipse cx="' + (+cx).toFixed(1) + '" cy="' + (+cy).toFixed(1) + '" rx="' + (+rx).toFixed(1) + '" ry="' + (+ry).toFixed(1) + '" fill="' + fill + '"' + (extra || '') + '/>';
const P = (d, fill, extra) => '<path d="' + d + '" fill="' + fill + '"' + (extra || '') + '/>';
const mirror = (pts, cx) => pts.map(([x, y]) => [2 * cx - x, y]);
const poly = pts => 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + ' Z';

/* the cat. b = breed id. opt: sleep (curled up loaf), size (px), collar, halo */
function catSVG(b, opt){
  opt = opt || {};
  const B = BREEDS[b] || BREEDS.tabby, u = 'ct' + (++svgUid), sl = !!opt.sleep;
  const G = sl ? {hx:33, hy:61, hrx:20, hry:17, bx:57, by:73, brx:31, bry:14.5}
               : {hx:50, hy:36, hrx:24, hry:20.5, bx:50, by:66, brx:21, bry:20};
  const body = B.body, dark = shade(body, -0.16), line = B.hi ? '#e9dbe8' : '#6b4a3a';
  const pts = B.pat === 'points', tux = B.pat === 'tux';
  const pawC = tux ? '#fff' : pts ? B.pc : body, earC = pts ? B.pc : body;
  const sz = opt.size ? ' width="' + opt.size + '" height="' + Math.round(opt.size * 0.9) + '"' : '';
  const glowSt = opt.halo && B.glow ? ' style="filter:drop-shadow(0 0 6px ' + B.glow + ')"' : '';
  let s = '<svg viewBox="0 0 100 90"' + sz + glowSt + ' xmlns="http://www.w3.org/2000/svg"><defs>';
  // clip = the cat's fur (head + body), patterns are drawn inside it
  s += '<clipPath id="' + u + 'c">' + E(G.hx, G.hy, G.hrx, G.hry, '#000') + E(G.bx, G.by, G.brx, G.bry, '#000') +
    (sl ? '' : E(33, 77, 10.5, 9, '#000') + E(67, 77, 10.5, 9, '#000')) + '</clipPath>';
  if(pts) s += '<radialGradient id="' + u + 'm"><stop offset="0" stop-color="' + B.pc + '" stop-opacity=".95"/><stop offset=".65" stop-color="' + B.pc + '" stop-opacity=".7"/><stop offset="1" stop-color="' + B.pc + '" stop-opacity="0"/></radialGradient>';
  s += '</defs>';
  // ears (behind the head)
  const earL = sl ? [[17, 57], [18.5, 39], [30, 47]] : B.bigEars ? [[27, 31], [24, 2], [47, 18]] : [[29, 28], [30.5, 8], [46, 19.5]];
  const earR = sl ? [[50, 56], [49, 39], [37, 46]] : mirror(earL, 50);
  const inner = e => { const cx = (e[0][0] + e[1][0] + e[2][0]) / 3, cy = (e[0][1] + e[1][1] + e[2][1]) / 3; return e.map(([x, y]) => [cx + (x - cx) * 0.55, cy + (y - cy) * 0.55 + 1.2]); };
  // tail
  let tail;
  if(sl){
    tail = '<path d="M86 76 C96 90 62 93 40 87" stroke="' + body + '" stroke-width="9" fill="none" stroke-linecap="round"/>' +
      (B.pat === 'stripes' ? '<path d="M78 87 l2 -6 M66 89 l1 -7 M54 89 l0 -7" stroke="' + B.pc + '" stroke-width="2.6" stroke-linecap="round"/>' : '') +
      (pts ? '<path d="M50 89 C46 88 42 88 40 87" stroke="' + B.pc + '" stroke-width="9" fill="none" stroke-linecap="round"/>' : '');
  } else {
    const td = 'M64 81 C82 86 93 73 88 58 C86 51 79 51 80 57 C83 67 78 75 63 73 Z';
    tail = '<g class="tl">' + P(td, body) +
      (B.pat === 'stripes' ? '<path d="M85 66 l6 2 M82 74 l5 4 M74 79 l2 5" stroke="' + B.pc + '" stroke-width="2.8" stroke-linecap="round"/>' : '') +
      (pts || B.pat === 'calico' ? '<path d="M80 57 C79 52 86 51 88 58 C89 63 88 66 87 68 C84 66 82 62 80 57Z" fill="' + (pts ? B.pc : B.pc2) + '"/>' : '') +
      (B.fluffy ? '<path d="M66 79 C82 88 96 72 88 54" stroke="' + body + '" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="2 3"/>' : '') + '</g>';
  }
  if(!opt.noTail) s += tail;
  [earL, earR].forEach(e => { s += P(poly(e), earC, ' stroke="' + earC + '" stroke-width="3" stroke-linejoin="round"') + P(poly(inner(e)), B.ear); });
  if(B.tufts && !sl) s += '<path d="M30.5 8 l-2 -6 M30.5 8 l2 -6 M69.5 8 l-2 -6 M69.5 8 l2 -6" stroke="' + dark + '" stroke-width="1.6" stroke-linecap="round"/>';
  // body
  if(!sl){
    s += E(33, 77, 10.5, 9, body) + E(67, 77, 10.5, 9, body);
  }
  s += E(G.bx, G.by, G.brx, G.bry, body);
  if(sl) s += E(48, 85, 7, 3.6, pawC);
  // head (fluffy cheeks first)
  if(B.fluffy){
    for(let i=0;i<9;i++){ const a = 0.15 + i * (Math.PI - 0.3) / 8; s += E(G.hx + Math.cos(a) * G.hrx * 0.98, G.hy + Math.sin(a) * G.hry * 0.92 + 1, 5.2, 4.6, body); }
  }
  s += E(G.hx, G.hy, G.hrx, G.hry, body);
  // pattern (clipped to the fur)
  s += '<g clip-path="url(#' + u + 'c)">' + patternSVG(B, b, G, sl, u) + '</g>';
  // chest / bib
  if(!sl){
    s += E(G.bx, G.by + 1, G.brx * (tux ? 0.62 : 0.52), G.bry * (tux ? 0.78 : 0.66), B.belly);
    if(B.fluffy) for(let i=0;i<5;i++) s += E(G.bx - 8 + i * 4, G.by - G.bry * 0.62 + (i % 2) * 2, 3.6, 3.6, B.belly);
    // front paws
    s += E(43, 85, 6.2, 3.8, pawC) + E(57, 85, 6.2, 3.8, pawC);
    s += '<path d="M41 86 v-2 M45 86 v-2 M55 86 v-2 M59 86 v-2" stroke="' + shade(pawC, -0.2) + '" stroke-width=".9" stroke-linecap="round"/>';
  }
  // face
  s += faceSVG(B, G, sl || opt.closed, line);
  // little things they wear
  s += accSVG(B.acc, G, sl, body);
  if(opt.collar){
    const cy = sl ? G.hy + G.hry * 0.86 : G.hy + G.hry * 0.93;
    s += '<path d="M' + (G.hx - G.hrx * 0.62) + ' ' + (cy - 1.5) + ' Q' + G.hx + ' ' + (cy + 4) + ' ' + (G.hx + G.hrx * 0.62) + ' ' + (cy - 1.5) + '" stroke="#e8455a" stroke-width="3.4" fill="none" stroke-linecap="round"/>' +
      '<circle cx="' + G.hx + '" cy="' + (cy + 3.6) + '" r="2.8" fill="#ffd34d" stroke="#d99a12" stroke-width=".8"/>';
  }
  return s + '</svg>';
}
function faceSVG(B, G, closed, line){
  const ex = B.flat ? 8.5 : 9, ey = G.hy + (B.flat ? 2 : 1), er = B.flat ? 5 : 4.4;
  let s = '';
  // muzzle
  const ny = G.hy + G.hry * (B.flat ? 0.3 : 0.38);
  s += E(G.hx - 4.2, ny + 2.5, 5.6, 4.2, B.belly, ' opacity=".85"') + E(G.hx + 4.2, ny + 2.5, 5.6, 4.2, B.belly, ' opacity=".85"');
  if(B.pat === 'sphynx') s += '<path d="M' + (G.hx - 7) + ' ' + (G.hy - 11) + ' q7 -3 14 0 M' + (G.hx - 5) + ' ' + (G.hy - 8) + ' q5 -2 10 0" stroke="' + shade(B.body, -0.18) + '" stroke-width="1.1" fill="none" stroke-linecap="round"/>';
  if(closed){

/* =====================================================================
   7. SOUND — purrs, meows and soft café music (WebAudio, no files)
===================================================================== */
let AC = null, musGain = null, sfxGain = null, musTimer = null, musRoom = null, musStep = 0, noiseBuf = null;
function audio(){
  if(AC) return AC;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(AC.destination);
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.connect(AC.destination);
    musGain = AC.createGain(); musGain.gain.value = 0.15; musGain.connect(lp);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random() * 2 - 1;
  }catch(e){ AC = null; }
  return AC;
}
function tone(f, dur, type, vol, when, dest, slide){
  const A = audio(); if(!A) return;
  const t = (when || A.currentTime);
  const o = A.createOscillator(), g = A.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxGain); o.start(t); o.stop(t + dur + 0.05);
}
/* a soft purr: rumbly noise that pulses ~24 times a second */
function purr(dur){
  const A = audio(); if(!A || !noiseBuf) return;
  const t = A.currentTime, n = A.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
  const lp = A.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
  const g = A.createGain(); g.gain.value = 0;
  const lfo = A.createOscillator(), lg = A.createGain(); lfo.frequency.value = 24; lg.gain.value = 0.35; lfo.connect(lg); lg.connect(g.gain);
  const env = A.createGain(); env.gain.setValueAtTime(0.0001, t); env.gain.exponentialRampToValueAtTime(1, t + 0.12); env.gain.setValueAtTime(1, t + dur - 0.25); env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(lp); lp.connect(g); g.connect(env); env.connect(sfxGain);
  n.start(t); lfo.start(t); n.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
}
/* a little "mew": a sliding tone through a soft filter */
function meow(p){
  const A = audio(); if(!A) return;
  p = p || rnd(0.9, 1.25);
  const t = A.currentTime, o = A.createOscillator(), o2 = A.createOscillator(), g = A.createGain(), bp = A.createBiquadFilter();
  o.type = 'sawtooth'; o2.type = 'sine'; bp.type = 'bandpass'; bp.Q.value = 3;
  [o, o2].forEach((x, i) => { const m = i ? 2 : 1; x.frequency.setValueAtTime(520 * p * m, t); x.frequency.linearRampToValueAtTime(820 * p * m, t + 0.14); x.frequency.linearRampToValueAtTime(560 * p * m, t + 0.42); });
  bp.frequency.setValueAtTime(900, t); bp.frequency.linearRampToValueAtTime(1900, t + 0.15); bp.frequency.linearRampToValueAtTime(1100, t + 0.42);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.46);
  o.connect(bp); o2.connect(bp); bp.connect(g); g.connect(sfxGain); o.start(t); o2.start(t); o.stop(t + 0.5); o2.stop(t + 0.5);
}
function hiss(){
  const A = audio(); if(!A || !noiseBuf) return;
  const t = A.currentTime, n = A.createBufferSource(); n.buffer = noiseBuf;
  const hp = A.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500;
  const g = A.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  n.connect(hp); hp.connect(g); g.connect(sfxGain); n.start(t); n.stop(t + 0.45);
}
function sfx(k){
  if(!S || !S.snd || !audio()) return;
  const t = AC.currentTime;
  switch(k){
    case 'tap': tone(700, 0.05, 'triangle', 0.12); break;
    case 'purr': purr(0.9); tone(1180, 0.08, 'sine', 0.08, t, null, 1500); break;
    case 'meow': meow(); break;
    case 'hiss': hiss(); break;
    case 'eat': [0, 0.11, 0.22].forEach(d => tone(320, 0.06, 'triangle', 0.18, t + d, null, 220)); setTimeout(() => meow(1.3), 380); break;
    case 'boing': tone(260, 0.22, 'sine', 0.22, t, null, 720); tone(900, 0.06, 'triangle', 0.1, t + 0.2); break;
    case 'coin': tone(1400, 0.07, 'sine', 0.18); tone(2100, 0.12, 'sine', 0.14, t + 0.06); break;
    case 'err': tone(240, 0.14, 'triangle', 0.15); tone(190, 0.18, 'triangle', 0.15, t + 0.1); break;
    case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.22, t + i * 0.09)); break;
    case 'new': [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.3, 'triangle', 0.18, t + i * 0.1)); setTimeout(() => meow(1.2), 600); break;
    case 'chime': tone(1319, 0.4, 'sine', 0.14); tone(1760, 0.5, 'sine', 0.1, t + 0.12); break;
    case 'bell': tone(1568, 0.6, 'sine', 0.12); tone(2093, 0.5, 'sine', 0.08, t + 0.02); break;
    case 'win': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.15, t + i * 0.1)); break;
    case 'whoosh': tone(200, 0.35, 'sine', 0.15, t, null, 700); break;
  }
}
/* soft generative café music: gentle chords + a little melody */
function musicStart(){
  if(!S || !S.mus || !audio()){ musicStop(); return; }
  if(musTimer && musRoom === S.cur) return;
  musicStop();
  musRoom = S.cur;
  const R = ROOM(S.cur) || ROOMS[0];
  const [scale, bpm, wave] = R.music;
  const step = 60 / bpm / 2;
  const root = 262 * Math.pow(2, (ROOMS.indexOf(R) * -3) / 12);
  const prog = [0, 3, 1, 4];
  musStep = 0;
  musTimer = setInterval(() => {
    if(!AC || AC.state !== 'running') return;
    const t = AC.currentTime + 0.05;
    const bar = Math.floor(musStep / 8) % 4, beat = musStep % 8, chord = prog[bar];
    if(beat === 0) [0, 2, 4].forEach((o, i) => tone(root / 2 * Math.pow(2, scale[(chord + o) % scale.length] / 12), step * 7.5, 'sine', 0.2, t + i * 0.03, musGain));
    if(beat === 4) tone(root / 4 * Math.pow(2, scale[chord % scale.length] / 12), step * 3, 'sine', 0.22, t, musGain);
    if(Math.random() < 0.5){
      const deg = chord + [0, 2, 4, 2, 1, 3, 4, 2][beat];
      const f = root * Math.pow(2, (scale[deg % scale.length] + 12 * Math.floor(deg / scale.length)) / 12);
      tone(f, step * 2, wave, 0.26, t, musGain);
    }
    musStep++;
  }, step * 1000);
}
function musicStop(){ if(musTimer) clearInterval(musTimer); musTimer = null; musRoom = null; }
function audioUnlock(){ const A = audio(); if(A && A.state === 'suspended') A.resume(); musicStart(); }

function catKey(c, a){ return [c.b, a.st === 'nap' ? 1 : 0, c.res ? 1 : 0].join('|'); }
function makeActorEl(c){

function renderCats(){

      a.el = makeActorEl(c);

      const B = BREEDS[c.b];

      let fr = a.el.querySelector('.front');

      if(atBox && !fr){ fr = document.createElement('div'); fr.className = 'front'; fr.innerHTML = boxFrontSVG(); a.el.appendChild(fr); }
      if(!atBox && fr) fr.remove();
    }
    // little thought bubble

    if(a.st !== 'nap' && a.st !== 'walk'){

    let be = a.el.querySelector('.bub');
    if(bub && !be){ be = document.createElement('div'); be.className = 'bub'; a.el.appendChild(be); }
    if(be){ if(bub) be.textContent = bub; else be.remove(); }
    let zz = a.el.querySelector('.zz');
    if(a.st === 'nap' && !zz){ zz = document.createElement('div'); zz.className = 'zz'; zz.textContent = 'z'; a.el.appendChild(zz); }
    if(a.st !== 'nap' && zz) zz.remove();
    a.el.classList.toggle('sel', sel === c.id);

}
function placeActor(a){
  a.el.style.left = a.x + '%'; a.el.style.top = a.y + '%'; a.el.style.zIndex = 5 + Math.round(a.y);
  a.el.firstChild.style.transform = a.face < 0 ? 'scaleX(-1)' : '';

  a.el.classList.toggle('nap', a.st === 'nap');

/* a new cat walks in from the side */
function actorEnter(c){

  const fromLeft = sp.x < 50;
  const a = actors[c.id] = {id: c.id, x: fromLeft ? -8 : 108, y: Math.max(FLOOR + 22, sp.y), tx: sp.x, ty: sp.y, st: 'walk', until: now() + 30000, face: fromLeft ? 1 : -1, key: ''};
  a.el = makeActorEl(c);

}
function actorLeave(c){
  const a = actors[c.id]; if(!a) return;
  a.leaving = true; a.st = 'walk'; a.key = '';
  const sc = sceneScale();
  a.el.querySelector('.bob').innerHTML = catSVG(c.b, {});

}
/* what does a cat do next? depends on its personality and the time */
function decide(a, c){
  const t = now(), night = isNight(t), sp = spotOf(c);
  if(!sp) return;
  if(a.st === 'nap'){ a.st = 'sit'; a.until = t + rnd(4000, 9000); a.key = ''; return; }
  let nap = 0.25 + (c.t === 'sleepy' ? 0.3 : 0) + (night ? 0.2 : 0) + (sp.k === 'sunbeam' ? 0.15 : 0);
  const atSpot = Math.abs(a.x - sp.x) < 1 && Math.abs(a.y - sp.y) < 1;
  if(!atSpot){ a.tx = sp.x; a.ty = sp.y; a.st = 'walk'; a.until = t + 30000; return; }
  const r = Math.random();
  if(r < nap){ a.st = 'nap'; a.until = t + rnd(12000, 30000) * (c.t === 'sleepy' ? 1.6 : 1); a.key = ''; }
  else if(r < nap + (c.t === 'playful' ? 0.3 : 0.1) && sp.y > FLOOR){
    a.tx = clamp(sp.x + rnd(-22, 22), 8, 86); a.ty = clamp(sp.y + rnd(-6, 4), FLOOR + 14, 84); a.st = 'walk'; a.wander = true; a.until = t + 30000; a.key = '';
  } else {
    a.st = 'sit'; a.until = t + rnd(5000, 12000); a.fav = Math.random() < 0.3;
    if(Math.random() < 0.4){ a.face = -a.face; a.el.classList.remove('pop'); void a.el.offsetWidth; a.el.classList.add('pop'); }
    if(Math.random() < 0.08) sfx('meow');
  }
}
function stepActors(dt){
  const t = now();
  for(const id in actors){
    const a = actors[id], c = catById(+id);
    if(!a.leaving && (!c || !c.here)) continue;
    if(!a.leaving && t > a.until && a.st !== 'walk') decide(a, c);
    if(a.st === 'walk'){
      const sp = 14 * (c && c.t === 'sleepy' ? 0.75 : 1);
      // high spots (shelves, windows): jump down first, walk on the floor, then jump up
      const up = a.ty < FLOOR + 4, onHigh = a.y < FLOOR + 4, floorY = FLOOR + 16;
      if(onHigh && (Math.abs(a.tx - a.x) > 1 || Math.abs(a.ty - a.y) > 1)){ a.y = floorY; hop(a); }
      const gx = a.tx, gy = up ? floorY : a.ty;
      const dx = gx - a.x, dy = gy - a.y, d = Math.hypot(dx, dy);
      if(d < 0.6){
        if(a.leaving) continue;
        if(up) hop(a);
        a.x = a.tx; a.y = a.ty;
        if(a.wander){ a.wander = false; a.st = 'sit'; a.until = t + rnd(1500, 4000); const s2 = spotOf(c); a.tx = s2.x; a.ty = s2.y; }
        else { a.st = 'sit'; a.until = t + rnd(3000, 8000); }
        a.key = ''; renderCats();
      } else {
        a.x += dx / d * sp * dt; a.y += dy / d * sp * dt * 0.9;
        if(Math.abs(dx) > 0.5) a.face = dx > 0 ? 1 : -1;
      }
    }
    placeActor(a);
  }
}

function hop(a){ a.el.classList.remove('pop'); void a.el.offsetWidth; a.el.classList.add('pop'); if(Math.random() < 0.5) sfx('boing'); }

/* ---------- toast + modal ---------- */
function toast(msg, kind){
  const t = document.createElement('div'); t.className = 'tst' + (kind ? ' ' + kind : ''); t.innerHTML = msg;
  const box = $('toast'); box.appendChild(t);
  while(box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.style.transition = 'opacity .4s'; t.style.opacity = 0; setTimeout(() => t.remove(), 400); }, 2600);
}
let modalOnClose = null, modalQueue = [];
function openModal(title, html, onClose, noClose){
  $('mBody').innerHTML = (title ? '<h2>' + title + '</h2>' : '') + html;
  $('modalBg').classList.add('on');
  $('mClose').style.display = noClose ? 'none' : '';
  $('modal').scrollTop = 0;
  modalOnClose = onClose || null;
}
function closeModal(){
  if(!$('modalBg').classList.contains('on')) return;
  $('modalBg').classList.remove('on');
  const f = modalOnClose; modalOnClose = null; if(f) f();
  refreshTop();
  if(modalQueue.length) setTimeout(() => { if(!$('modalBg').classList.contains('on') && modalQueue.length) modalQueue.shift()(); }, 250);
}
function queueModal(fn){ if($('modalBg').classList.contains('on')) modalQueue.push(fn); else fn(); }
function showReward(art, title, html, onClose){

}
function confirmBox(title, msg, yes, cb){

}

let G = null;   // the running game
const cv = () => $('gCanvas');
function svgImg(svg){ const i = new Image(); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); return i; }
function playerCat(){ return (S.avatar && catById(S.avatar)) || residents()[0] || present()[0] || {b: 'tabby'}; }
function startGame(id, intro){
  if(S.tickets < 1){ toast('🎟️ ' + tr('No tickets left. Watch an ad or wait.'), 'err'); sfx('err'); showView('Games'); return; }
  audioUnlock();
  $('game').classList.add('on'); $('gOver').classList.remove('on'); $('gHud').innerHTML = '';
  const c = cv(), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pc = playerCat();
  G = {id, ctx, W: innerWidth, H: innerHeight, t: 0, score: 0, shownScore: 0, shake: 0, parts: [], texts: [], over: false, started: false, last: performance.now(),
    img: svgImg(catSVG(pc.b, {collar: pc.res})), imgScared: svgImg(catSVG(pc.b, {closed: true, collar: pc.res}))};
  ({laser: laserInit, catch: catchInit})[id]();
  const go = () => {
    if(S.tickets < 1) return;
    if(S.tickets >= CONFIG.TICKETS_MAX) S.tkT = now();
    S.tickets--; S.stats.games++; saveNow();
    $('gIntro').classList.remove('on'); G.started = true; G.last = performance.now();
    tutEvent('game');
  };
  if(intro){
    const g = GAMES.find(q => q.id === id);
    $('gIntroBox').innerHTML = '<div style="font-size:56px">' + g.e + '</div><h2 style="margin:6px 0">' + L(g) + '</h2><p style="font-weight:800">' + L(g.d) + '</p>' +
      '<button class="btn wide" id="giGo">▶ ' + tr('Start') + ' · 🎟️ 1</button><button class="btn wide ghost" id="giBack">' + tr('Back') + '</button>';
    $('gIntro').classList.add('on');
    $('giGo').onclick = go; $('giBack').onclick = closeGame;
  } else go();
  requestAnimationFrame(gameLoop);
}
function gameLoop(ts){
  if(!G || G.over) return;
  const dt = Math.min(0.05, (ts - G.last) / 1000); G.last = ts;
  if(G.started){ G.t += dt; G.update(dt); }
  G.shownScore += (G.score - G.shownScore) * Math.min(1, dt * 10);
  const ctx = G.ctx; ctx.save();
  if(G.shake > 0){ G.shake -= dt; ctx.translate(rnd(-6, 6) * G.shake * 3, rnd(-6, 6) * G.shake * 3); }
  G.draw(ctx);
  G.parts = G.parts.filter(p => (p.life -= dt) > 0);
  G.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
  G.texts = G.texts.filter(q => (q.life -= dt) > 0);
  G.texts.forEach(q => { q.y -= 40 * dt; ctx.globalAlpha = Math.min(1, q.life * 2); ctx.font = '900 ' + (q.size || 24) + 'px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(q.s, q.x, q.y); ctx.fillStyle = q.c || '#5b3d2c'; ctx.fillText(q.s, q.x, q.y); });
  ctx.globalAlpha = 1; ctx.restore();
  requestAnimationFrame(gameLoop);
}
function burst(x, y, c, n){ for(let i=0;i<(n || 10);i++){ const a = Math.random() * 7, s = rnd(60, 200); G.parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, r: rnd(2, 5), c: c || '#fff', life: 0.7, max: 0.7}); } }
function floatText(x, y, s, c, size){ G.texts.push({x, y, s, c, size, life: 0.9}); }
/* the score bar: only the numbers change, the ✕ button stays put so it is easy to tap */
function hud(html){
  if(!$('gQuit')){
    $('gHud').innerHTML = '<div id="gHudIn" style="display:flex;gap:6px;flex-wrap:wrap"></div><button class="pill" id="gQuit" style="padding:8px 14px">✕</button>';
    $('gQuit').onclick = () => { if(!G) return; if(G.started) gameOver(true); else closeGame(); };
  }
  const box = $('gHudIn'); if(box._h !== html){ box._h = html; box.innerHTML = html; }
}
function emoji(ctx, e, x, y, size){ ctx.fillStyle = '#000'; ctx.font = size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y); }
function coinDot(ctx, x, y, r){ const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r); g.addColorStop(0, '#fff6c4'); g.addColorStop(0.4, '#ffd54a'); g.addColorStop(1, '#d99a12'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.strokeStyle = '#c98200'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, r * 0.62, 0, 7); ctx.stroke(); }
function floorBg(ctx){
  const th = curTheme();
  ctx.fillStyle = th.floor; ctx.fillRect(0, 0, G.W, G.H);
  ctx.fillStyle = th.floor2;
  for(let y = 0; y < G.H; y += 44){ ctx.fillRect(0, y, G.W, 2); for(let x = (y / 44 % 2) * 60; x < G.W; x += 120) ctx.fillRect(x, y, 2, 44); }
  ctx.fillStyle = th.acc + '44'; ctx.beginPath(); ctx.ellipse(G.W / 2, G.H * 0.55, G.W * 0.42, G.H * 0.25, 0, 0, 7); ctx.fill();
}
function drawCat(ctx, x, y, w, face, sx, sy, scared){
  const img = scared ? G.imgScared : G.img;
  if(!img.complete) return;
  ctx.save(); ctx.translate(x, y); ctx.scale((face || 1) * (sx || 1), sy || 1); ctx.drawImage(img, -w / 2, -w * 0.9, w, w * 0.9); ctx.restore();
}

/* ---------- LASER CHASE ---------- */
function laserInit(){
  Object.assign(G, {lx: G.W / 2, ly: G.H * 0.4, cx: G.W / 2, cy: G.H * 0.7, face: 1, stars: [], cukes: [], lives: 3, left: CONFIG.LASER_TIME, sS: 0.4, sC: 2.5, scared: 0, hop: 0});
  const c = cv();
  c.onpointerdown = c.onpointermove = e => { G.lx = clamp(e.clientX, 20, G.W - 20); G.ly = clamp(e.clientY, 90, G.H - 20); };
  const near = (o, r) => Math.hypot(o.x - G.cx, o.y - (G.cy - 30)) < r;
  G.update = dt => {
    G.left -= dt; if(G.left <= 0){ G.left = 0; gameOver(); return; }
    if(G.scared > 0) G.scared -= dt;
    else {
      const dx = G.lx - G.cx, dy = (G.ly + 30) - G.cy, d = Math.hypot(dx, dy), sp = CONFIG.LASER_SPEED + G.t * 4;
      if(d > 6){ const m = Math.min(d, sp * dt); G.cx += dx / d * m; G.cy += dy / d * m; G.hop += dt * 14; }
      if(Math.abs(dx) > 4) G.face = dx > 0 ? 1 : -1;
    }
    // spawn stars + cucumbers
    G.sS -= dt; G.sC -= dt;
    if(G.sS <= 0 && G.stars.length < 4){ G.sS = rnd(0.6, 1.2); G.stars.push({x: rnd(40, G.W - 40), y: rnd(120, G.H - 60), life: 6, k: Math.random() < 0.15 ? 'fish' : 'star'}); }
    if(G.sC <= 0 && G.cukes.length < 2 + Math.floor(G.t / 10)){ G.sC = Math.max(1.4, 3.2 - G.t * 0.04); let p, tries = 0; do { p = {x: rnd(40, G.W - 40), y: rnd(130, G.H - 60), life: 7}; tries++; } while(tries < 10 && Math.hypot(p.x - G.cx, p.y - G.cy) < 140); G.cukes.push(p); }
    G.stars = G.stars.filter(s => {
      s.life -= dt;
      if(near(s, 46)){ const v = s.k === 'fish' ? 3 : 1; G.score += v; sfx(s.k === 'fish' ? 'coin' : 'tap'); burst(s.x, s.y, s.k === 'fish' ? '#7fd0ff' : '#ffd54a', 12); floatText(s.x, s.y - 20, '+' + v); return false; }
      return s.life > 0;
    });
    G.cukes = G.cukes.filter(k => {
      k.life -= dt;
      if(G.scared <= 0 && near(k, 40)){ G.lives--; G.scared = 0.9; G.shake = 0.35; sfx('hiss'); burst(k.x, k.y, '#7fcf6a', 14); floatText(G.cx, G.cy - 90, '😱'); if(G.lives <= 0) setTimeout(() => gameOver(), 400); return false; }
      return k.life > 0;
    });
    hud('<span class="pill">⭐ ' + Math.round(G.shownScore) + '</span><span class="pill">' + '❤️'.repeat(Math.max(0, G.lives)) + '🤍'.repeat(Math.max(0, 3 - G.lives)) + '</span><span class="pill">⏱️ ' + Math.ceil(G.left) + '</span>');
  };
  G.draw = ctx => {
    floorBg(ctx);
    G.stars.forEach(s => { ctx.globalAlpha = s.life < 1 ? s.life : 1; const b = 1 + Math.sin(G.t * 6 + s.x) * 0.08; emoji(ctx, s.k === 'fish' ? '🐟' : '⭐', s.x, s.y, 34 * b); });
    G.cukes.forEach(k => { ctx.globalAlpha = k.life < 1 ? k.life : 1; emoji(ctx, '🥒', k.x, k.y, 40); });
    ctx.globalAlpha = 1;
    // shadow + cat
    ctx.fillStyle = '#00000022'; ctx.beginPath(); ctx.ellipse(G.cx, G.cy, 34, 9, 0, 0, 7); ctx.fill();
    const jump = G.scared > 0 ? Math.sin((0.9 - G.scared) / 0.9 * Math.PI) * 50 : Math.abs(Math.sin(G.hop)) * 5;
    drawCat(ctx, G.cx, G.cy - jump, 96, G.face, 1, 1, G.scared > 0);
    // the laser dot
    const r = 9 + Math.sin(G.t * 20) * 1.5, g = ctx.createRadialGradient(G.lx, G.ly, 0, G.lx, G.ly, r * 2.4);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, '#ff3a4a'); g.addColorStop(1, 'rgba(255,40,60,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(G.lx, G.ly, r * 2.4, 0, 7); ctx.fill();
  };

}

/* ---------- TREAT CATCH ---------- */
function catchInit(){
  Object.assign(G, {x: G.W / 2, tx: G.W / 2, face: 1, items: [], spawn: 0, lives: 3, pop: 0, speed: CONFIG.CATCH_SPEED});
  const c = cv();
  c.onpointerdown = c.onpointermove = e => { G.tx = e.clientX; };
  G.update = dt => {
    const old = G.x; G.x += (G.tx - G.x) * Math.min(1, dt * 12);
    if(Math.abs(G.x - old) > 0.5) G.face = G.x > old ? 1 : -1;
    G.speed += CONFIG.CATCH_RAMP * dt;
    G.spawn -= dt;
    if(G.spawn <= 0){
      G.spawn = Math.max(0.33, 0.95 - G.t * 0.012);
      const r = Math.random();
      G.items.push({x: rnd(30, G.W - 30), y: -30, k: r < 0.07 ? 'sushi' : r < 0.15 ? 'coin' : r < 0.36 + Math.min(0.18, G.t * 0.004) ? 'drop' : 'fish', vy: G.speed * rnd(0.85, 1.2), rot: rnd(-2, 2)});
    }
    const py = G.H - 130;
    G.items = G.items.filter(it => {
      it.y += it.vy * dt; it.rot += dt;
      if(Math.abs(it.y - py) < 36 && Math.abs(it.x - G.x) < 50){
        if(it.k === 'drop'){ G.lives--; G.shake = 0.35; sfx('hiss'); burst(it.x, it.y, '#7fc8ff', 12); if(G.lives <= 0) setTimeout(() => gameOver(), 300); }
        else { const v = it.k === 'sushi' ? 3 : it.k === 'coin' ? 2 : 1; G.score += v; G.pop = 0.18; sfx(it.k === 'coin' ? 'coin' : 'tap'); burst(it.x, it.y, it.k === 'coin' ? '#ffd54a' : '#ff9fb6', 10); floatText(it.x, it.y - 20, '+' + v); }
        return false;
      }
      return it.y < G.H + 40;
    });
    if(G.pop > 0) G.pop -= dt;
    hud('<span class="pill">🐟 ' + Math.round(G.shownScore) + '</span><span class="pill">' + '❤️'.repeat(Math.max(0, G.lives)) + '🤍'.repeat(Math.max(0, 3 - G.lives)) + '</span>');
  };
  G.draw = ctx => {
    const th = curTheme();
    ctx.fillStyle = th.wall; ctx.fillRect(0, 0, G.W, G.H);
    ctx.fillStyle = th.floor; ctx.fillRect(0, G.H - 70, G.W, 70);
    ctx.fillStyle = th.trim; ctx.fillRect(0, G.H - 72, G.W, 4);
    G.items.forEach(it => { ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot * 0.4);
      if(it.k === 'coin'){ ctx.shadowColor = '#ffd54a'; ctx.shadowBlur = 12; coinDot(ctx, 0, 0, 15); } else emoji(ctx, it.k === 'drop' ? '💧' : it.k === 'sushi' ? '🍣' : '🐟', 0, 0, 40);
      ctx.restore(); });
    const s = 1 + (G.pop > 0 ? G.pop * 1.2 : 0);
    drawCat(ctx, G.x, G.H - 64, 110, G.face, s, 2 - s);
    emoji(ctx, '🥣', G.x, G.H - 60, 44);
  };
  hud('<span class="pill">🐟 0</span>');
}

  const A = AdMobP();

    let earned = false, finished = false, hs = [];
    const finish = () => { if(finished) return; finished = true; hs.forEach(h => { try{ h.remove(); }catch(e){} }); res(earned); };
    try{
      hs.push(await A.addListener('onRewardedVideoAdReward', () => { earned = true; }));

      hs.push(await A.addListener('onRewardedVideoAdFailedToShow', finish));
      await A.prepareRewardVideoAd({adId: MONEY.REWARDED_ID, isTesting: MONEY.TESTING});
      const item = await A.showRewardVideoAd();
      if(item && item.amount !== undefined) earned = true;

  });
}

/* =====================================================================
   12. MAIN LOOP — game ticks, away time, tutorial, start-up
   tick(): once a second — moods, coins, visits, timers
   frame(): every screen frame — cats walk
===================================================================== */
function stepWorld(dt, t, offline, noEarn){
  const rate = MOOD_RATE();
  let earned = 0, found = 0;
  present().forEach(c => {
    c.m.food = Math.max(0, c.m.food - rate * dt * (c.t === 'greedy' ? 1.5 : 1) * (c.t === 'sleepy' ? 0.8 : 1));
    c.m.fun = Math.max(0, c.m.fun - rate * dt * (c.t === 'sleepy' ? 0.6 : 1));
    if(!noEarn){
      earned += catRate(c, t) * dt;
      if(Math.random() < CONFIG.GEM_CHANCE * dt / 60){ found++; S.stats.gems++; if(!offline && c.here.r === S.cur && curView === 'Cafe'){ fxAtCat(c, GM); sfx('coin'); } }
    }
  });
  if(!noEarn){ addC(earned); if(found) addG(found); }
  // visitors go home when their time is up
  if(S.tut >= 99 || offline) present().forEach(c => { if(!c.res && c.here.until && t > c.here.until) leave(c, offline); });
  // new cats walk in
  if(t >= S.nextArrive){
    if(anyFree()){
      const q = S.queue.shift();
      if(q && q.startsWith('cat:')){ const fc = catById(+q.slice(4)); if(fc) arrive('pack', t, offline, fc); }
      else arrive(q || 'random', t, offline);
      S.nextArrive = t + arriveGap();
    } else S.nextArrive = t + 30000;
  }
  return {earned, found};
}
let tickN = 0;
function tick(){
  const t = now();
  stepWorld(1, t);
  S.stats.play++; tickN++;
  while(S.tickets < CONFIG.TICKETS_MAX && t - S.tkT >= CONFIG.TICKET_MIN * 60000){ S.tickets++; S.tkT += CONFIG.TICKET_MIN * 60000; }
  if(S.tickets >= CONFIG.TICKETS_MAX) S.tkT = t;
  if(tickN % 10 === 0) saveNow();
  refreshTop();
  if(curView === 'Cafe' && !G){
    renderRoomName(); renderSide();
    if(tickN % 2 === 0) renderCare();
    if(tickN % 3 === 0){ renderCats(); ambient(); applyDark(); }
    if(tickN % 4 === 0){ const list = catsIn(S.cur); if(list.length){ const c = pick(list); fxAtCat(c, '+' + fmt(catRate(c) * 4) + ' ' + CN); } }
    if(tickN % 60 === 0) bgKey = '', renderBg();
  }
  if(curView === 'Games' && tickN % 5 === 0 && !$('modalBg').classList.contains('on')) renderGames();
}
let lastFrame = performance.now();
function frame(ts){
  const dt = Math.min(0.1, (ts - lastFrame) / 1000); lastFrame = ts;
  if(S && curView === 'Cafe' && !G) stepActors(dt);
  if(S) tickCoinDisplay();
  requestAnimationFrame(frame);
}

/* ---------- away time (coins while the app is closed) ---------- */
function catchUp(){
  const t = now(), away = (t - (S.lastSeen || t)) / 1000;
  if(away < 60) return;
  const capped = Math.min(away, offlineCapH() * 3600), all = Math.min(away, 7 * 86400);
  let earned = 0, found = 0, sim = S.lastSeen;
  const known = new Set(S.cats.filter(c => c.here).map(c => c.id));
  const steps = Math.floor(all / 60);
  for(let i=0;i<steps;i++){ sim += 60000; const r = stepWorld(60, sim, true, i * 60 >= capped); earned += r.earned; found += r.found; }
  while(S.tickets < CONFIG.TICKETS_MAX && t - S.tkT >= CONFIG.TICKET_MIN * 60000){ S.tickets++; S.tkT += CONFIG.TICKET_MIN * 60000; }
  S.lastSeen = t;
  const newcomers = present().filter(c => !known.has(c.id)).length;
  if(earned >= 1){
    S.awayLast = Math.round(earned);
    const capTxt = away > capped ? '<p class="muted">' + tr('Coins stop after {h}h away. Tip jars in the Shop keep them coming longer.', {h: offlineCapH()}) + '</p>' : '';
    queueModal(() => {
      openModal('🌅 ' + tr('Welcome back!'), '<div class="reward"><div class="big">' + catSVG((residents()[0] || present()[0] || {b: 'mocha'}).b, {size: 140, collar: true}) + '</div><p>' + tr('You were away for {t}.', {t: fmtTime(away)}) + '</p><p>' + tr('Your customers paid') + '</p><div class="amt">+' + fmt(S.awayLast) + ' ' + CN + (found ? ' +' + found + ' ' + GM : '') + '</div>' +
        (newcomers ? '<p>🐾 ' + tr('{n} new cats came to visit!', {n: newcomers}) + '</p>' : '') + capTxt + '</div>' +
        '<button class="btn wide gold" id="wbX2">' + adIcon() + ' ' + tr('Double it!') + ' +' + fmt(S.awayLast) + ' ' + CN + '</button><button class="btn wide ghost" id="wbOk">' + tr('Collect') + '</button>');
      $('wbOk').onclick = closeModal;
      $('wbX2').onclick = async () => { closeModal(); if(await rewardAd()){ addC(S.awayLast); toast('+' + fmt(S.awayLast) + ' ' + CN, 'gold'); S.awayLast = 0; saveNow(); } };
    });
  }
  saveNow();
}

    '<button class="btn wide" id="fnGo">💗 ' + tr('Let’s go!') + '</button></div>', null, true);
  const relang = l => { S.lang = l; const v = $('fnIn').value; applySettings(); renderAll(); closeModal(); startNewGameName(first, v); };
  $('nlEn').onclick = () => relang('en'); $('nlFr').onclick = () => relang('fr');
  $('fnGo').onclick = () => { const v = $('fnIn').value.trim(); if(v) first.n = v.slice(0, 14); closeModal(); S.tut = 1; renderCafe(); tutShow(); sfx('purr'); saveNow(); };
}

/* ---------- start-up ---------- */
function boot(){
  $('loadCat').innerHTML = catSVG('mocha');
  const lang0 = (load() || {}).lang || ((navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en');
  $('loadTip').textContent = '💡 ' + pick(TIPS)[lang0];
  let p = 0; const iv = setInterval(() => { p = Math.min(100, p + rnd(12, 28)); $('loadBar').style.width = p + '%'; }, 140);
  setTimeout(() => {
    clearInterval(iv); $('loadBar').style.width = '100%';
    const saved = load();
    if(saved){ S = saved; catchUp(); }
    if(!S) startNewGame();
    shownC = S.co;
    applySettings(); renderNav(); showView('Cafe');
    if(S.tut >= 1 && S.tut < 99) tutShow();
    else if(S.tut >= 99) checkDaily();
    $('load').style.opacity = 0; setTimeout(() => $('load').remove(), 600);
    setInterval(tick, 1000);
    requestAnimationFrame(frame);
    adsInit();
  }, 1300);
  $('mClose').onclick = closeModal;
  $('modalBg').addEventListener('pointerdown', e => { if(e.target === $('modalBg') && $('mClose').style.display !== 'none') closeModal(); });
  $('pCoin').onclick = openBoosts;
  $('pGem').onclick = () => { shopTab = 'paid'; showView('Shop'); };
  $('pLevel').onclick = () => showView('More');
  $('profBtn').onclick = () => showView('More');
  $('muteBtn').onclick = () => { const on = S.snd || S.mus; S.snd = S.mus = !on; if(!on) audioUnlock(); else musicStop(); refreshTop(); saveNow(); if(curView === 'More') renderMore(); };
  $('scene').addEventListener('pointerdown', () => { if(sel){ sel = null; renderCats(); renderCare(); } });
  document.addEventListener('pointerdown', audioUnlock, {once: true});
  document.addEventListener('visibilitychange', () => {
    if(!S) return;
    if(document.hidden){ saveNow(); musicStop(); }
    else { catchUp(); if(S.mus) musicStart(); if(curView === 'Cafe') renderCafe(); }
  });
  document.addEventListener('pause', () => { if(S){ saveNow(); musicStop(); } }, false);
  window.addEventListener('resize', () => { if(S && curView === 'Cafe'){ bgKey = ''; for(const k in actors) actors[k].key = ''; renderCafe(); } });
}
window.addEventListener('load', boot);
