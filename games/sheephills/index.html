<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bfe8a6">
<title>Sheep Hills</title>
<style>
/* =====================================================================
   SHEEP HILLS — styles
   Fresh green theme. Change the colors here to restyle the whole game.
===================================================================== */
@font-face{font-family:"Nunito";src:url(fonts/nunito-700.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-800.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-900.woff2) format("woff2");font-weight:900;font-display:swap}
:root{
  --grass:#8fd46f; --grass2:#5fb64a; --cream:#fff8ea; --cream2:#f6e9cf;
  --pink:#ffd0dc; --pink2:#ff8fac; --mint:#d3f4dc; --mint2:#47b96c;
  --lemon:#fff3b8; --lemon2:#ffcf3d; --sky:#d6efff; --sky2:#5fb2f0;
  --lav:#e8defd; --lav2:#9d86f0; --peach:#ffe2cc; --coral:#ff8a7a;
  --ink:#3f4a3a; --ink2:#6f7a68; --card:#fffdf6; --line:#e7eedb;
  --gold:#ffc83d; --good:#3fb877; --bad:#ff6b81;
  --r:18px; --font:"Nunito","Varela Round","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#eef8e4;color:var(--ink);font-family:var(--font);font-weight:700;font-size:calc(16px * var(--fs))}
button{font-family:inherit;font-size:inherit;font-weight:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font-family:inherit;font-size:16px;font-weight:800}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:linear-gradient(#fbfff4,#e6f6d6);border-bottom:2px solid #cfe8b8;z-index:20}
.pill{display:flex;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:5px 11px 5px 7px;font-weight:900;box-shadow:0 2px 0 #cfe2bd;white-space:nowrap;min-width:0}
.pill .ic{font-size:19px}
#boosts{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden;flex:1;min-width:0}
.bst{font-size:12px;font-weight:900;background:var(--lemon);border-radius:99px;padding:4px 8px;white-space:nowrap}
.topBtn{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 0 #cfe2bd;display:grid;place-items:center;flex:none;font-size:20px}
@media (max-width:400px){.pill{padding:4px 8px 4px 5px}.bst{font-size:11px;padding:3px 6px}#boosts .bst:nth-child(n+3){display:none}}
/* ---------- body / nav ---------- */
#body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#main{flex:1;position:relative;min-width:0;overflow:hidden}
#nav{display:flex;justify-content:space-around;background:#fff;border-top:2px solid #cfe8b8;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:14px;font-size:12px;font-weight:900;color:var(--ink2);position:relative}
#nav button .e{font-size:25px;line-height:1.1}
#nav button.on{background:var(--mint);color:var(--ink)}
.dot{position:absolute;top:2px;right:20%;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid #fff;display:none}
.dot.show{display:block}
@media (min-width:820px){
  #body{flex-direction:row-reverse}
  #nav{flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:2px solid #cfe8b8;padding:10px 8px;width:96px}
  #nav button{flex:none;padding:10px 0;font-size:13px}
  #nav button .e{font-size:30px}
  .view .inner{max-width:760px;margin:0 auto}
}
/* ---------- views ---------- */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding:12px 12px 30px;-webkit-overflow-scrolling:touch;background:#f5fbee}
.view.on{display:block}
#vHills{padding:0;overflow:hidden;background:#bfe6ff}
h2{margin:4px 0 10px;font-size:1.4em;font-weight:900}
h3{margin:16px 0 8px;font-size:1.1em;font-weight:900}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:9px 14px;border-radius:99px;background:#fff;font-weight:900;box-shadow:0 2px 0 var(--line)}
.tabs button.on{background:var(--mint);box-shadow:0 2px 0 #a9dcb8}
.card{background:var(--card);border-radius:var(--r);padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:9px;box-shadow:0 3px 0 var(--line);position:relative}
.card .art{width:60px;height:60px;flex:none;border-radius:16px;background:var(--mint);display:grid;place-items:center;font-size:32px;overflow:hidden;position:relative}
.card .art svg{width:58px;height:58px}
.card .info{flex:1;min-width:0}
.nm{font-weight:900}
.sub{font-size:.86em;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{background:var(--card);border-radius:16px;padding:8px 4px 6px;text-align:center;box-shadow:0 3px 0 var(--line);position:relative;font-size:.82em;font-weight:900}
.tile svg{width:76px;height:70px;display:block;margin:0 auto}
.tile .big{font-size:40px;line-height:70px;height:70px}
.tile.lock{opacity:.45}
.tile.lock svg{filter:grayscale(1) brightness(.75)}
.tile.lockI{opacity:.5}
.tile.lockI svg{opacity:.45}
.btn{background:var(--mint2);color:#fff;font-weight:900;padding:10px 15px;border-radius:14px;box-shadow:0 3px 0 #2f8f52;white-space:nowrap;min-height:44px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #2f8f52}
.btn.pink{background:var(--pink2);box-shadow:0 3px 0 #db6a88}
.btn.lav{background:var(--lav2);box-shadow:0 3px 0 #7660d0}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 3px 0 #d79d12}
.btn.sky{background:var(--sky2);box-shadow:0 3px 0 #3f86c4}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.wide{display:block;width:100%;margin-top:9px;padding:13px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.btn.sm{padding:7px 11px;font-size:.88em;min-height:40px}
.tag{display:inline-block;font-size:.74em;font-weight:900;padding:2px 8px;border-radius:99px;background:var(--lemon);vertical-align:middle}
.r0{background:#eceff3}.r1{background:#cfe9ff}.r2{background:#e2d6ff}.r3{background:#ffe7a8}
.bar{height:11px;border-radius:9px;background:#e9efe0;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:9px}
.mood{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:.92em;font-weight:900}
.mood span{width:26px;text-align:center}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--ink2);font-size:.86em}
.center{text-align:center}
.hearts{letter-spacing:1px}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle;border:2px solid #fff;box-shadow:0 0 0 1px #0002}
.seg{display:flex;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.seg button{flex:1;padding:10px 6px;font-weight:900}
.seg button.on{background:var(--mint)}
/* ---------- hills scene ---------- */
#scene{position:absolute;inset:0;overflow:hidden;touch-action:none}
#sceneBg{position:absolute;inset:0;width:100%;height:100%}
#props,#sheep{position:absolute;inset:0}
#props{pointer-events:none;z-index:0}
#sheep{z-index:2}
.prop{position:absolute;transform:translate(-50%,-85%);pointer-events:none;line-height:1}
.prop svg{display:block}
.sheep{position:absolute;width:76px;height:68px;margin:-60px 0 0 -38px;will-change:left,top;touch-action:none}
.sheep .flip{width:100%;height:100%;transform-origin:50% 85%}
.sheep .bob{width:100%;height:100%;transform-origin:50% 85%}
.sheep svg{width:100%;height:100%;overflow:visible;display:block}
.sheep.idle .bob{animation:breathe 2.4s ease-in-out infinite}
.sheep.walk .bob{animation:waddle .45s ease-in-out infinite alternate}
.sheep.graze .bob{animation:graze 1.6s ease-in-out infinite}
.sheep.bounce .bob{animation:hop .5s cubic-bezier(.3,.0,.4,1) infinite alternate}
.sheep.nap .bob{animation:breathe 3.6s ease-in-out infinite}
.sheep.roll .bob{animation:roll .7s linear infinite}
.sheep.sulk .bob{animation:sulk 1.2s ease-in-out infinite}
.sheep.pop .bob{animation:pop .35s ease}
.sheep.shorn .bob{animation:shiver .12s linear 6}
.sheep .zz{position:absolute;top:-6px;right:4px;font-size:16px;font-weight:900;color:#6a7ac9;animation:zz 2s infinite;pointer-events:none}
.sheep .bub{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:900;background:#fff;border-radius:12px;padding:1px 7px;box-shadow:0 2px 0 #0001;white-space:nowrap;pointer-events:none}
.sheep .ready{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:18px;animation:wob .6s ease-in-out infinite alternate;pointer-events:none}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes waddle{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-3px) rotate(3deg)}}
@keyframes graze{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg) translateY(2px)}}
@keyframes hop{from{transform:translateY(0) scale(1.06,.94)}to{transform:translateY(-18px) scale(.96,1.05)}}
@keyframes roll{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes sulk{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22,.82)}70%{transform:scale(.92,1.12)}100%{transform:scale(1)}}
@keyframes shiver{0%{transform:translateX(-2px)}50%{transform:translateX(2px)}100%{transform:translateX(0)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
@keyframes wob{from{transform:translateX(-50%) rotate(-8deg)}to{transform:translateX(-50%) rotate(8deg)}}
.fx{position:absolute;pointer-events:none;font-size:22px;font-weight:900;z-index:900;animation:fxup 1s ease-out forwards;white-space:nowrap}
@keyframes fxup{from{opacity:1;transform:translate(-50%,0) scale(.7)}30%{transform:translate(-50%,-14px) scale(1.15)}to{opacity:0;transform:translate(-50%,-50px) scale(1)}}
.puff{position:absolute;pointer-events:none;width:16px;height:16px;border-radius:50%;z-index:901;animation:puff .9s ease-out forwards}
@keyframes puff{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.5)}}
.decoItem{position:absolute;transform:translate(-50%,-85%);font-size:34px;line-height:1;touch-action:none}
.decoItem svg{display:block}
body.decoMode .decoItem{outline:3px dashed #fff;outline-offset:3px;border-radius:12px;animation:wob2 .8s ease-in-out infinite alternate}
@keyframes wob2{from{transform:translate(-50%,-85%) rotate(-3deg)}to{transform:translate(-50%,-85%) rotate(3deg)}}
#careBar{position:absolute;left:8px;bottom:12px;display:flex;flex-direction:column;gap:9px;z-index:950}
#sideR{position:absolute;right:8px;bottom:12px;display:flex;flex-direction:column;gap:9px;z-index:950}
.fab{width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #0002;font-size:27px;display:grid;place-items:center;position:relative}
.fab small{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:900;background:#fff;border-radius:7px;padding:0 5px;white-space:nowrap}
.fab .bdg{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;font-size:12px;font-weight:900;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 4px}
#areaName{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fffd;border-radius:99px;padding:6px 14px;font-weight:900;z-index:950;white-space:nowrap;display:flex;gap:8px;align-items:center;box-shadow:0 2px 0 #0001}
#areaName button{font-size:18px;width:30px;height:30px;border-radius:50%;background:var(--mint)}
#decoDone{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:960;display:none}
body.decoMode #decoDone{display:block}
#nightTint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#141c4acc,#2b2a66aa);mix-blend-mode:multiply;opacity:0;transition:opacity 2s;z-index:1}
#weather{position:absolute;inset:0;pointer-events:none;z-index:810;overflow:hidden}
.flake{position:absolute;top:-30px;font-size:14px;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(30px,110vh) rotate(300deg)}}
/* ---------- modal ---------- */
#modalBg{position:fixed;inset:0;background:#2f3a2a66;display:none;z-index:1050;align-items:center;justify-content:center;padding:14px}
#modalBg.on{display:flex}
#modal{background:#fff;border-radius:24px;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;padding:16px;box-shadow:0 10px 40px #0003;animation:mIn .25s ease;position:relative}
@keyframes mIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#modal h2{text-align:center;margin-top:0;padding:0 30px}
#mClose{position:absolute;top:8px;right:10px;font-size:22px;width:40px;height:40px;border-radius:50%;background:#f1f6ea}
.reward{text-align:center}
.reward .big{font-size:62px;line-height:1.1}
.reward .big svg{width:120px;height:108px}
.reward .amt{font-size:1.5em;font-weight:900;margin:6px 0}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:1200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.tst{background:#fff;border-radius:14px;padding:10px 15px;font-weight:900;box-shadow:0 4px 14px #0002;animation:tIn .3s ease;max-width:100%;text-align:center}
.tst.gold{background:var(--lemon)}.tst.err{background:#ffe0e5}
@keyframes tIn{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
/* ---------- knit screen ---------- */
.slot{background:var(--card);border-radius:18px;padding:10px;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;gap:10px;margin-bottom:8px}
.slot .art{width:56px;height:56px;border-radius:14px;background:var(--lav);display:grid;place-items:center;font-size:30px;flex:none;position:relative}
.slot.done .art{background:var(--lemon);animation:wob3 .6s ease-in-out infinite alternate}
@keyframes wob3{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.yarn{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:99px;padding:5px 10px 5px 5px;margin:0 6px 6px 0;font-weight:900;box-shadow:0 2px 0 var(--line);font-size:.92em}
.yarn.sel{outline:3px solid var(--mint2)}
.ball{width:22px;height:22px;border-radius:50%;display:inline-block;position:relative;box-shadow:inset -3px -3px 0 #0002;flex:none}
.ball:after{content:"";position:absolute;inset:4px 3px;border-top:2px solid #fff8;border-bottom:2px solid #fff6;border-radius:50%}
.pick{display:flex;flex-wrap:wrap}
.dyeB{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:72px;height:76px;border-radius:16px;background:#fff;box-shadow:0 2px 0 var(--line);margin:0 6px 6px 0;font-size:.78em;font-weight:900;position:relative}
.dyeB .e{font-size:28px}
.dyeB.sel{outline:3px solid var(--mint2);background:var(--mint)}
.dyeB .n{position:absolute;top:3px;right:6px;font-size:.9em}
/* ---------- mini games ---------- */
#game{position:fixed;inset:0;z-index:1100;background:#bfe6ff;display:none;touch-action:none}
#game.on{display:block}
#gCanvas{position:absolute;inset:0;width:100%;height:100%}
#gHud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:2;font-weight:900;font-size:1.1em;gap:6px}
#gAns{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));display:none;justify-content:center;gap:10px;z-index:3;flex-wrap:wrap;padding:0 10px}
#gAns.on{display:flex}
#gAns button{min-width:70px;font-size:1.5em}
#gOver{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#2f3a2a55;z-index:4;padding:16px}
#gOver.on{display:flex}
#gOver .box{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:360px;text-align:center}
/* ---------- loading ---------- */
#load{position:fixed;inset:0;z-index:2000;background:linear-gradient(#d9f1ff,#dff5cf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .6s}
#load .logo{font-size:2.6em;font-weight:900;color:#4fae5a;text-shadow:0 3px 0 #fff;letter-spacing:.02em}
#load .wd{width:130px;height:117px;animation:hop .45s ease-in-out infinite alternate}
#load .wd svg{width:100%;height:100%}
#load .tip{max-width:300px;text-align:center;font-weight:800;color:var(--ink2);padding:0 20px}
#load .lbar{width:200px;height:12px;background:#fff;border-radius:9px;overflow:hidden}
#load .lbar i{display:block;height:100%;width:0;background:var(--mint2);transition:width .3s}
/* ---------- guide (tutorial) ---------- */
#tut{position:fixed;left:8px;right:8px;top:calc(110px + env(safe-area-inset-top));z-index:1000;display:none;pointer-events:none}
#tut.on{display:flex;justify-content:center}
#tut .box{pointer-events:auto;background:#fff;border-radius:20px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px #0003;max-width:470px;width:100%;border:3px solid var(--lemon2)}
#tut .gd{width:64px;height:58px;flex:none}
#tut .gd svg{width:100%;height:100%}
#tut .tx{flex:1;font-weight:900;font-size:.98em;line-height:1.35}
.hl{outline:4px solid var(--lemon2)!important;outline-offset:2px;animation:hlp 1s infinite alternate;z-index:999}
@keyframes hlp{from{outline-color:var(--lemon2)}to{outline-color:var(--pink2)}}
.spinW{width:250px;height:250px;margin:6px auto;position:relative}
.spinW svg{width:100%;height:100%;transition:transform 3.2s cubic-bezier(.15,.9,.2,1)}
.spinW .ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:28px}
</style>
</head>
<body>
<div id="load">
  <div class="logo">Sheep Hills</div>
  <div class="wd" id="loadSheep"></div>
  <div class="lbar"><i id="loadBar"></i></div>
  <div class="tip" id="loadTip"></div>
</div>
<div id="app">
  <div id="top">
    <button class="pill" id="pCoin"><span class="ic">🪙</span><span id="vCoin">0</span></button>
    <button class="pill" id="pYarn"><span class="ic">🧶</span><span id="vYarn">0</span></button>
    <div id="boosts"></div>
    <button class="topBtn" id="muteBtn" aria-label="Sound">🔊</button>
    <button class="topBtn" id="setBtn" aria-label="Settings">⚙️</button>
  </div>
  <div id="body">
    <div id="main">
      <div class="view on" id="vHills">
        <div id="scene">
          <svg id="sceneBg" preserveAspectRatio="none" viewBox="0 0 100 100"></svg>
          <div id="props"></div>
          <div id="sheep"></div>
          <div id="nightTint"></div>
          <div id="weather"></div>
        </div>
        <div id="areaName"></div>
        <button class="btn gold" id="decoDone">✔ Done</button>
        <div id="careBar"></div>
        <div id="sideR"></div>
      </div>
      <div class="view" id="vKnit"><div class="inner" id="iKnit"></div></div>
      <div class="view" id="vMarket"><div class="inner" id="iMarket"></div></div>
      <div class="view" id="vFarm"><div class="inner" id="iFarm"></div></div>
      <div class="view" id="vBook"><div class="inner" id="iBook"></div></div>
      <div class="view" id="vShop"><div class="inner" id="iShop"></div></div>
    </div>
    <div id="nav"></div>
  </div>
</div>
<div id="modalBg"><div id="modal"><button id="mClose" aria-label="Close">✕</button><div id="mBody"></div></div></div>
<div id="toast"></div>
<div id="tut"><div class="box"><div class="gd" id="tutGd"></div><div class="tx" id="tutTx"></div><button class="btn sm ghost" id="tutBtn">Skip</button></div></div>
<div id="game">
  <canvas id="gCanvas"></canvas>
  <div id="gHud"></div>
  <div id="gAns"></div>
  <div id="gOver"><div class="box" id="gOverBox"></div></div>
</div>
<script>
/* =====================================================================
   SHEEP HILLS  —  a cozy sheep idle game by MOS Arcade
   ---------------------------------------------------------------------
   HOW THIS FILE IS ORGANISED (same as Quackipelago)
     1. CONFIG        ← all the tuning numbers. Change feel here.
     2. DATA          ← areas, sheep, foods, dyes, items, upgrades...
     3. LANGUAGE      ← English / French: T('English','Français')
     4. STATE + SAVE  ← what the game remembers (on the phone only)
     5. ECONOMY       ← wool, yarn, knitting, coins, costs

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function weighted(odds){ let s = odds.reduce((a, b) => a + b, 0), r = Math.random() * s; for(let i=0;i<odds.length;i++){ r -= odds[i]; if(r < 0) return i; } return odds.length - 1; }
function fmt(n){
  n = Math.floor(n || 0); if(n < 1000) return String(n);
  const u = ['K','M','B','T','Qa']; let i = -1;
  while(n >= 1000 && i < u.length - 1){ n /= 1000; i++; }
  return (n >= 100 ? Math.floor(n) : n >= 10 ? (Math.floor(n * 10) / 10) : (Math.floor(n * 100) / 100)) + u[i];
}
function fmtTime(sec){
  sec = Math.max(0, Math.ceil(sec));
  if(sec < 60) return sec + 's';
  const m = Math.floor(sec / 60), s = sec % 60;
  if(m < 60) return m + 'm' + (s ? ' ' + s + 's' : '');
  const h = Math.floor(m / 60); if(h < 48) return h + 'h ' + (m % 60) + 'm';
  return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}
function dayNum(t){ const d = new Date(t); return Math.floor((t - d.getTimezoneOffset() * 60000) / 86400000); }

const SAVE_KEY = 'sheephills_v1';
let S = null;

function newState(){
  const t = now();
  const s = {
    v:1, created:t, lastSeen:t, lang:(navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en',
    snd:true, mus:true, fs:1,
    coins:CONFIG.START_COINS,
    sheep:[], nextId:1, areas:['hills'], cur:'hills',
    upg:{}, raw:{}, yarn:{}, spinP:0, knit:[], items:[],
    inv:{clover:0, apple:0, carrot:0}, dyes:{poppy:2, sunflower:2, blueberry:1, blossomD:1},
    decorOwn:{}, decor:[], book:{}, ibook:{},
    daily:{streak:0, last:null}, giftAt:t, ad2x:0, rareDay:null,
    tries:{day:null, used:0, extra:0}, visit:null, lambAt:t + CONFIG.LAMB_EVERY_MIN * 60000,
    tut:0, paid:false, theme:'farm', firstKnit:false, iapDone:{},
    stats:{coins:0, sheared:0, knit:0, sold:0, pets:0, feeds:0, play:0, lambs:0, best:{fence:0, catch:0}},
  };
  UPG_IDS.forEach(k => s.upg[k] = 0);
  return s;
}
function load(){
  try{ const raw = localStorage.getItem(SAVE_KEY); if(raw){ const o = JSON.parse(raw); if(o && o.v) return fixState(o); } }catch(e){}
  return null;
}
/* fills in anything missing from an older save */
function fixState(o){
  const d = newState();
  for(const k in d) if(o[k] === undefined) o[k] = d[k];
  for(const k in d.stats) if(o.stats[k] === undefined) o.stats[k] = d.stats[k];
  for(const k in d.upg) if(o.upg[k] === undefined) o.upg[k] = 0;
  return o;
}
function saveNow(){
  if(!S) return;
  S.lastSeen = now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}

/* ---------- time + seasons ---------- */
function isNight(t){ const h = new Date(t || now()).getHours(); return h >= CONFIG.NIGHT_START || h < CONFIG.NIGHT_END; }
function seasonOf(t){
  if(CONFIG.SEASON_TEST) return CONFIG.SEASON_TEST;
  const m = new Date(t || now()).getMonth();
  return m >= 2 && m <= 4 ? 'spring' : m >= 5 && m <= 7 ? 'summer' : m >= 8 && m <= 10 ? 'autumn' : 'winter';
}

/* =====================================================================
   5. ECONOMY — wool, yarn, knitting, coins, costs
===================================================================== */
const B = s => BREEDS[s.b] || BREEDS.white;
const sheepById = id => S.sheep.find(s => s.id === id);
const sheepIn = area => S.sheep.filter(s => s.a === area);
const cap = () => CONFIG.PASTURE_START + CONFIG.PASTURE_STEP * S.upg.pasture;
const herd = () => S.sheep.filter(s => !B(s).paid).length;   // Candy pack sheep are a bonus: they don't take pasture spots
const roomLeft = () => cap() - herd();
const hearts = s => Math.min(CONFIG.MAX_HEARTS, Math.floor(s.love / CONFIG.LOVE_PER_HEART));
const moodAvg = s => (s.m.food + s.m.joy) / 2;
const isLamb = s => !!s.lamb;
const sheepName = s => s.nm ? s.nm : (NAMES[s.n] ? NAMES[s.n][S && S.lang === 'fr' ? 1 : 0] : 'Sheep');
const MOOD_RATE = () => 100 / (CONFIG.MOOD_EMPTY_HOURS * 3600);
const yarnKey = (w, c) => w + '|' + c;
const splitKey = k => { const [w, c] = k.split('|'); return {w, c}; };
const colorName = c => L(COLORS[c]);
const isDyed = c => DYE_COLORS.includes(c);
const yarnTotal = () => Object.values(S.yarn).reduce((a, b) => a + b, 0);
const rawTotal = () => Object.values(S.raw).reduce((a, b) => a + b, 0);
const has2x = () => S.ad2x > now();

function decorBonus(area){ return Math.min(CONFIG.DECOR_MAX, S.decor.filter(d => d.a === area).length) * CONFIG.DECOR_BONUS; }
/* wool per second (0..1 scale) */
function woolRate(s, t){
  if(isLamb(s)) return 0;
  let r = 1 / CONFIG.WOOL_FULL_SEC[B(s).r];
  r *= CONFIG.SAD_MIN + (1 - CONFIG.SAD_MIN) * moodAvg(s) / 100;
  r *= 1 + CONFIG.FRIEND_WOOL_BONUS * hearts(s);
  r *= 1 + 0.10 * S.upg.barn;
  r *= 1 + decorBonus(s.a);
  if(s.boost && s.boost.until > t) r *= 1 + s.boost.m;
  if(seasonOf(t) === 'summer') r *= 1.1;
  if(s.p === 'sleepy' && s.nap > t) r *= 1.25;
  return r;
}
function addCoins(n){ n = Math.round(n); S.coins += n; if(n > 0) S.stats.coins += n; }
function pay(n){ if(S.coins < n){ toast('🪙 ' + T('Not enough coins', 'Pas assez de pièces'), 'err'); sfx('err'); return false; } S.coins -= n; return true; }
function addLove(s, n){
  const before = hearts(s);
  s.love = Math.min(CONFIG.MAX_HEARTS * CONFIG.LOVE_PER_HEART, s.love + n * (1 + 0.15 * S.upg.pond) * (s.p === 'shy' ? 1.5 : 1));
  if(hearts(s) > before){ fxAtSheep(s, '💖'); toast('💖 ' + esc(sheepName(s)) + ' ' + T('loves you more!', 't’aime encore plus!') + ' ' + '❤️'.repeat(hearts(s)), 'gold'); }
}
function itemValue(it){ return Math.round(ITEMS[it.k].price * WOOL[it.w].mult * (isDyed(it.c) ? CONFIG.DYED_BONUS : 1) * (1 + 0.06 * S.upg.windmill)); }
function upgCost(k){
  const U = UPGRADES[k], lv = S.upg[k];
  if(U.cost) return U.cost[lv] || 0;
  return Math.round(U.base * Math.pow(U.grow, lv));
}
const spinSec = () => CONFIG.SPIN_SEC * Math.pow(0.82, S.upg.wheel);
const knitSpeed = () => 1 + 0.15 * S.upg.chair;
const knitSlots = () => CONFIG.KNIT_SLOTS + (S.upg.chair >= 4 ? 1 : 0) + (S.upg.chair >= 8 ? 1 : 0);
const areaCost = () => CONFIG.AREA_COST[S.areas.length - 1] || 1e9;
const areaTier = id => Math.max(0, S.areas.indexOf(id));
function inviteCost(area){ return Math.round(CONFIG.INVITE_BASE * Math.pow(CONFIG.INVITE_GROWTH, Math.max(0, S.sheep.length - CONFIG.START_SHEEP)) * (1 + 0.6 * areaTier(area))); }

/* ---------- making sheep ---------- */
function freeName(){
  const used = S.sheep.map(s => s.n);
  const free = NAMES.map((_, i) => i).filter(i => !used.includes(i));
  return free.length ? pick(free) : rint(0, NAMES.length - 1);
}
function makeSheep(opt){
  const s = {
    id: S.nextId++, n: opt.n !== undefined ? opt.n : freeName(), b: opt.b, p: opt.p || pick(PERS_IDS), spot: opt.spot || pick(SPOT_IDS),
    a: opt.a || S.cur, w: opt.w !== undefined ? opt.w : rnd(0.2, 0.6), dye: null, m: {food: 80, joy: 80}, love: opt.love || 0,
    o: [], lamb: opt.lamb || null, mom: opt.mom || null, born: now(), nap: 0, sulk: 0, boost: null,
  };
  if(opt.nm) s.nm = opt.nm;
  S.sheep.push(s);
  addToBook(s.b);
  return s;
}
const BOOK_COINS = [100, 300, 800, 2000];
function addToBook(b){
  if(S.book[b]) return;
  S.book[b] = 1;
  if(S.tut === 0) return;   // the first sheep don't pay out
  const c = BOOK_COINS[BREEDS[b].r]; addCoins(c);
  setTimeout(() => toast('📖 ' + T('New in your book', 'Nouveau dans ton livre') + ': ' + L(BREEDS[b]) + ' +' + fmt(c) + ' 🪙', 'gold'), 600);
}
function addToItemBook(it){
  const key = it.k + ':' + (isDyed(it.c) ? it.c : 'natural');
  if(S.ibook[key]) return;
  S.ibook[key] = 1; addCoins(50);
  setTimeout(() => toast('📖 ' + T('New pattern', 'Nouveau patron') + ': ' + itemName(it) + ' +50 🪙', 'gold'), 900);
}
function itemName(it){
  const nm = L(ITEMS[it.k]);
  if(!isDyed(it.c)) return nm;
  return S.lang === 'fr' ? nm + ' ' + colorName(it.c).toLowerCase() : colorName(it.c) + ' ' + nm.toLowerCase();
}
/* which breeds can come from an area right now */
function poolFor(area){
  let pool = AREA(area).pool.slice();
  return pool;
}
function rollBreed(area){
  const ssn = seasonOf();
  if(Math.random() < 0.12){ const sb = BREED_IDS.find(b => BREEDS[b].season === ssn); if(sb) return sb; }
  const pool = poolFor(area);
  const odds = [70, 22, 7, 1];
  for(let tries = 0; tries < 20; tries++){
    const r = weighted(odds);
    const ok = pool.filter(b => BREEDS[b].r === r);
    if(ok.length) return pick(ok);
  }
  return pool[0];
}

/* ---------- shearing, spinning, knitting ---------- */
function shear(s){
  if(isLamb(s)) return 0;
  if(s.w < CONFIG.SHEAR_MIN) return 0;
  const n = Math.max(1, Math.round(CONFIG.WOOL_YIELD[B(s).r] * s.w)) + (s.p === 'dramatic' ? 1 : 0);
  const col = s.dye || B(s).col, key = yarnKey(B(s).wool, col);
  S.raw[key] = (S.raw[key] || 0) + n;
  s.w = 0; s.dye = null;
  s.m.food = Math.max(0, s.m.food - 25);
  S.stats.sheared++;
  return n;
}
function stepSpin(dt){
  const sec = spinSec();
  if(rawTotal() <= 0){ S.spinP = 0; return 0; }
  S.spinP += dt; let made = 0;
  while(S.spinP >= sec){
    const k = Object.keys(S.raw).find(k => S.raw[k] > 0);
    if(!k){ S.spinP = 0; break; }
    S.raw[k]--; if(S.raw[k] <= 0) delete S.raw[k];
    S.yarn[k] = (S.yarn[k] || 0) + 1; S.spinP -= sec; made++;
  }
  return made;
}
function startKnit(k, key){
  const I = ITEMS[k];
  if((S.yarn[key] || 0) < I.yarn){ toast(T('Not enough yarn', 'Pas assez de fil'), 'err'); sfx('err'); return false; }
  if(S.knit.length >= knitSlots()){ toast(T('The knitting queue is full', 'La file de tricot est pleine'), 'err'); sfx('err'); return false; }
  S.yarn[key] -= I.yarn; if(S.yarn[key] <= 0) delete S.yarn[key];
  const {w, c} = splitKey(key);
  const dur = S.firstKnit ? I.sec : CONFIG.FIRST_KNIT_SEC;
  S.firstKnit = true;
  S.knit.push({id: now() + Math.random(), k, w, c, dur, prog: 0});
  sfx('knit');
  return true;
}
/* knitting is a queue: the first item is worked on, the rest wait */
function stepKnit(dt, offline){
  let done = [];
  let left = dt * knitSpeed();
  while(left > 0 && S.knit.length){
    const j = S.knit[0], need = j.dur - j.prog;
    if(left >= need){ left -= need; S.knit.shift(); done.push(finishKnit(j, offline)); }
    else { j.prog += left; left = 0; }
  }
  return done;
}
function finishKnit(j, offline){
  const it = {id: S.nextId++, k: j.k, c: j.c, w: j.w};
  S.items.push(it); S.stats.knit++;
  addToItemBook(it);
  if(!offline){ toast(itemIcon(it, 26) + ' ' + itemName(it) + ' ' + T('is ready!', 'est prêt!'), 'gold'); sfx('coin'); }
  return it;
}
function knitLeft(i){ // seconds left until item i in the queue is done
  let t = 0; for(let n = 0; n <= i && n < S.knit.length; n++) t += S.knit[n].dur - S.knit[n].prog;
  return t / knitSpeed();
}
function sellItem(it){
  const v = itemValue(it) * (has2x() ? 2 : 1);
  S.items = S.items.filter(x => x !== it);
  addCoins(v); S.stats.sold++;
  return v;
}
function dyeYarn(key, dA, dB){
  const col = mixColor(dA, dB); if(!col) return 0;
  if((S.dyes[dA] || 0) < 1 || (dB && dB !== dA && (S.dyes[dB] || 0) < 1)){ toast(T('You need more dye', 'Il te faut plus de teinture'), 'err'); return 0; }
  const have = S.yarn[key] || 0; if(!have) return 0;
  const n = Math.min(have, CONFIG.DYE_BATCH), {w} = splitKey(key), nk = yarnKey(w, col);
  if(nk === key){ toast(T('That yarn is already this color', 'Ce fil est déjà de cette couleur'), 'err'); return 0; }
  S.dyes[dA]--; if(dB && dB !== dA) S.dyes[dB]--;
  S.yarn[key] -= n; if(S.yarn[key] <= 0) delete S.yarn[key];
  S.yarn[nk] = (S.yarn[nk] || 0) + n;
  return n;
}

/* =====================================================================
   6. ART — every sheep and item is drawn in code (SVG). No image files.
===================================================================== */
function shade(hex, amt){ // amt -1..1 (darker..lighter)
  let c = hex.replace('#', ''); if(c.length === 3) c = c.split('').map(x => x + x).join('');
  let r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  const f = v => Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt);
  return '#' + [f(r), f(g), f(b)].map(v => clamp(v, 0, 255).toString(16).padStart(2, '0')).join('');
}
function mix(a, b, p){
  const h = x => [1, 3, 5].map(i => parseInt(x.substr(i, 2), 16));
  const A = h(a), Bc = h(b);
  return '#' + A.map((v, i) => Math.round(v + (Bc[i] - v) * p).toString(16).padStart(2, '0')).join('');
}
const lum = hex => { const c = hex.replace('#', ''); return (parseInt(c.substr(0, 2), 16) * 0.3 + parseInt(c.substr(2, 2), 16) * 0.59 + parseInt(c.substr(4, 2), 16) * 0.11) / 255; };
const RB = ['#ff8a8a', '#ffc36b', '#ffe76b', '#8fe08a', '#7cc4ff', '#c59bff'];
let svgUid = 0;
function star4(x, y, r, c){ return '<path d="M'+x+' '+(y-r)+' Q'+x+' '+y+' '+(x+r)+' '+y+' Q'+x+' '+y+' '+x+' '+(y+r)+' Q'+x+' '+y+' '+(x-r)+' '+y+' Q'+x+' '+y+' '+x+' '+(y-r)+'Z" fill="'+c+'"/>'; }
function leafPath(x, y, s, rot, c){ return '<path transform="translate('+x+' '+y+') rotate('+rot+') scale('+s+')" d="M0 0 C4 -6 10 -6 12 0 C10 6 4 6 0 0Z" fill="'+c+'" stroke="'+shade(c, -0.3)+'" stroke-width=".8"/>'; }
const wornOf = (s, slot) => (s.o || []).find(it => ITEMS[it.k] && ITEMS[it.k].slot === slot);

/* the sheep. s = {b, w, dye, o, p}. opt: sleep, sulk, blush, noShadow, winter, glasses, size */
function sheepSVG(s, opt){
  opt = opt || {};
  const Bd = BREEDS[s.b] || BREEDS.white, id = 'sh' + (svgUid++);
  const w = clamp(opt.w !== undefined ? opt.w : (s.w !== undefined ? s.w : 1), 0, 1);
  const shorn = w < 0.12;
  const woolC = s.dye ? COLORS[s.dye].c : COLORS[Bd.col].c;
  const rainbow = !s.dye && Bd.rb;
  const face = Bd.face, dark = lum(face) < 0.42;
  const R = shorn ? 14 : 13 + 17 * w;
  const cx = 44, cy = shorn ? 60 : 55 - w * 9;
  const legC = dark ? shade(face, -0.15) : shade(face, -0.45);
  const sweater = wornOf(s, 'body') || (opt.winter ? {k:'sweater', c:'red', auto:1} : null);
  const mitt = wornOf(s, 'feet'), hat = wornOf(s, 'head'), scarf = wornOf(s, 'neck');
  const sz = opt.size ? ' width="'+opt.size+'" height="'+Math.round(opt.size * 0.9)+'"' : '';
  let h = '<svg viewBox="0 0 100 90"'+sz+' xmlns="http://www.w3.org/2000/svg">';
  if(!opt.noShadow) h += '<ellipse cx="'+(cx+5)+'" cy="83.5" rx="'+(R*0.85+8)+'" ry="4.5" fill="#0002"/>';
  // legs
  const legTop = cy + R * 0.35, lx = shorn ? [34, 40, 50, 56] : [cx - R*0.5, cx - R*0.18, cx + R*0.22, cx + R*0.5];
  lx.forEach((x, i) => {
    const back = i === 1 || i === 3;
    h += '<rect x="'+(x-2.6)+'" y="'+(legTop - (back ? 2 : 0))+'" width="5.2" height="'+(81 - legTop + (back ? 0 : 1))+'" rx="2.6" fill="'+(back ? shade(legC, -0.12) : legC)+'"/>';
    if(mitt) h += '<rect x="'+(x-3.6)+'" y="75" width="7.2" height="7.5" rx="3" fill="'+colFill(mitt.c, id)+'" stroke="'+shade(COLORS[mitt.c].c, -0.25)+'" stroke-width=".8"/>';
  });
  if(rainbow || (mitt && COLORS[mitt.c].rb) || (sweater && COLORS[sweater.c] && COLORS[sweater.c].rb) || (hat && COLORS[hat.c].rb) || (scarf && COLORS[scarf.c].rb))
    h += '<defs><linearGradient id="'+id+'rb" x1="0" y1="0" x2="1" y2="1">'+RB.map((c, i) => '<stop offset="'+(i/5)+'" stop-color="'+c+'"/>').join('')+'</linearGradient></defs>';
  // body
  if(shorn){
    h += '<ellipse cx="'+cx+'" cy="'+cy+'" rx="17" ry="12" fill="#ffd8cf" stroke="#f0b6aa" stroke-width="1"/>';
    h += '<path d="M'+(cx-9)+' '+(cy+5)+' q9 4 18 0" stroke="#f0b6aa" stroke-width="1" fill="none"/>';
    [[-8,-10],[0,-12],[8,-10],[13,-3]].forEach(([dx, dy], i) => h += '<circle cx="'+(cx+dx)+'" cy="'+(cy+dy)+'" r="3.6" fill="'+(rainbow ? RB[i] : woolC)+'"/>');
  } else {
    const N = 10, under = Bd.cloudy ? '#cfe2fb' : shade(woolC, -0.13);
    const pts = []; for(let i=0;i<N;i++){ const a = i / N * Math.PI * 2; pts.push([cx + Math.cos(a) * R * 0.78, cy + Math.sin(a) * R * 0.56]); }
    const pr = R * 0.42;
    pts.forEach(([x, y]) => h += '<circle cx="'+x+'" cy="'+(y+2.6)+'" r="'+pr+'" fill="'+(rainbow ? '#e9d6ff' : under)+'"/>');
    pts.forEach(([x, y], i) => h += '<circle cx="'+x+'" cy="'+y+'" r="'+pr+'" fill="'+(rainbow ? RB[i % 6] : woolC)+'"/>');
    h += '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(R*0.82)+'" ry="'+(R*0.6)+'" fill="'+(rainbow ? '#fff3fb' : woolC)+'"/>';
    if(rainbow) [0,1,2].forEach(i => h += '<circle cx="'+(cx-R*0.3+i*R*0.3)+'" cy="'+(cy-R*0.05+(i%2)*R*0.2)+'" r="'+(R*0.22)+'" fill="'+RB[(i*2+1)%6]+'" opacity=".75"/>');
    // little highlights
    [[-0.45,-0.45],[-0.1,-0.58],[-0.62,-0.1]].forEach(([dx, dy]) => h += '<circle cx="'+(cx+dx*R)+'" cy="'+(cy+dy*R)+'" r="'+(R*0.13)+'" fill="#fff" opacity=".55"/>');
    if(Bd.curl) pts.forEach(([x, y], i) => { if(i % 2) return; const r = pr * 0.32; h += '<path d="M'+(x-r)+' '+y+' a'+r+' '+r+' 0 1 1 '+r+' '+r+' a'+(r*0.5)+' '+(r*0.5)+' 0 1 1 -'+(r*0.5)+' -'+(r*0.5)+'" stroke="'+shade(woolC, -0.25)+'" stroke-width="1.3" fill="none"/>'; });
    if(Bd.spots) [[-0.3,-0.1,0.2],[0.28,0.12,0.16],[-0.02,-0.36,0.13],[0.05,0.3,0.12]].forEach(([dx, dy, r]) => h += '<ellipse cx="'+(cx+dx*R)+'" cy="'+(cy+dy*R)+'" rx="'+(r*R)+'" ry="'+(r*R*0.8)+'" fill="#3e3a42" opacity=".85"/>');
    if(Bd.swirl){ const c2 = s.b === 'lollipop' ? '#fff' : '#9fd6ff'; h += '<path d="M'+(cx-R*0.55)+' '+cy+' a'+(R*0.55)+' '+(R*0.4)+' 0 1 1 '+(R*0.55)+' '+(R*0.4)+' a'+(R*0.35)+' '+(R*0.25)+' 0 1 1 -'+(R*0.3)+' -'+(R*0.4)+' a'+(R*0.15)+' '+(R*0.12)+' 0 1 1 '+(R*0.2)+' '+(R*0.1)+'" stroke="'+c2+'" stroke-width="'+(R*0.12)+'" fill="none" stroke-linecap="round" opacity=".9"/>'; }
    if(Bd.sugar) [[-0.5,-0.2],[-0.2,0.25],[0.15,-0.3],[0.45,0.1],[0.05,0.05],[-0.35,-0.45],[0.35,-0.1]].forEach(([dx, dy]) => h += '<circle cx="'+(cx+dx*R)+'" cy="'+(cy+dy*R)+'" r="1.3" fill="#fff"/>');

/* =====================================================================
   7. SOUND — baas, snips and a soft music box (WebAudio, no files)
===================================================================== */
let AC = null, musGain = null, sfxGain = null, musTimer = null, musKey = null, musStep = 0, musMotif = [];
function audio(){
  if(AC) return AC;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(AC.destination);
    musGain = AC.createGain(); musGain.gain.value = 0.16; musGain.connect(AC.destination);
  }catch(e){ AC = null; }
  return AC;
}
function tone(f, dur, type, vol, when, dest, slide){
  const A = audio(); if(!A) return;
  const t = (when || A.currentTime);
  const o = A.createOscillator(), g = A.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxGain); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, freq, vol, type){
  const A = audio(); if(!A) return;
  const n = A.createBufferSource(), b = A.createBuffer(1, Math.floor(A.sampleRate * dur), A.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  const f = A.createBiquadFilter(); f.type = type || 'highpass'; f.frequency.value = freq;
  const g = A.createGain(); g.gain.value = vol; n.buffer = b; n.connect(f); f.connect(g); g.connect(sfxGain); n.start();
}
/* a little "baa": buzzy voice + wobble + two formants */
function baa(pitch, long){
  const A = audio(); if(!A || !S || !S.snd) return;
  const t = A.currentTime, p = pitch || rnd(0.9, 1.15), dur = long ? 0.95 : 0.5;
  const o = A.createOscillator(), lfo = A.createOscillator(), lg = A.createGain(), g = A.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(300 * p, t); o.frequency.linearRampToValueAtTime(330 * p, t + 0.08); o.frequency.exponentialRampToValueAtTime(250 * p, t + dur);
  lfo.frequency.value = 7.5; lg.gain.value = 16 * p; lfo.connect(lg); lg.connect(o.frequency);
  const f1 = A.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 850 * p; f1.Q.value = 4;
  const f2 = A.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 2300 * p; f2.Q.value = 6;
  const m = A.createGain(); m.gain.value = 1;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(long ? 0.9 : 0.6, t + 0.05); g.gain.setValueAtTime(long ? 0.8 : 0.5, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f1); o.connect(f2); f1.connect(g); f2.connect(m); m.connect(g); g.connect(sfxGain);
  o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
}
function sfx(k){
  if(!S || !S.snd || !audio()) return;
  const A = AC, t = A.currentTime;
  switch(k){
    case 'tap': tone(700, 0.06, 'triangle', 0.14); break;
    case 'pop': tone(900, 0.08, 'sine', 0.3, t, null, 1600); break;
    case 'coin': tone(1047, 0.08, 'square', 0.1); tone(1397, 0.14, 'square', 0.1, t + 0.07); break;
    case 'err': tone(240, 0.15, 'triangle', 0.2); tone(190, 0.18, 'triangle', 0.2, t + 0.1); break;
    case 'snip': noise(0.07, 3000, 0.5); setTimeout(() => noise(0.07, 3500, 0.5), 110); break;
    case 'knit': tone(1800, 0.03, 'square', 0.06); tone(1500, 0.03, 'square', 0.06, t + 0.09); tone(1800, 0.03, 'square', 0.06, t + 0.18); break;
    case 'win': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.3, 'sine', 0.25, t + i * 0.1)); break;
    case 'whoosh': tone(300, 0.3, 'sine', 0.15, t, null, 900); break;
    case 'boing': tone(220, 0.25, 'sine', 0.3, t, null, 520); break;
    case 'gift': [784, 988, 1175, 1568].forEach((f, i) => bell(f, 0.6, 0.3, t + i * 0.08, sfxGain)); break;
  }
}
/* music box: a bell-like note (plucked metal tine) */
function bell(f, dur, vol, when, dest){
  const A = audio(); if(!A) return;
  const t = when || A.currentTime;
  [[1, 1], [2.76, 0.25], [5.4, 0.08]].forEach(([m, v]) => {
    const o = A.createOscillator(), g = A.createGain();
    o.type = 'sine'; o.frequency.value = f * m;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * v, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur / m * 1.4);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.1);
  });
}
function makeMotif(scale){
  // a gentle tune that repeats, like a real music box
  const m = []; let d = rint(2, 4);
  for(let i=0;i<16;i++){
    if(i % 4 === 3 && Math.random() < 0.5){ m.push(null); continue; }
    d = clamp(d + pick([-1, -1, 1, 1, 2, -2, 0]), 0, scale.length + 3); m.push(d);
  }
  m[15] = null; m[0] = rint(0, 2) * 2;
  return m;
}
function musicStart(){
  if(!S || !S.mus || !audio()){ musicStop(); return; }
  const key = S.cur + seasonOf();
  if(musTimer && musKey === key) return;
  musicStop(); musKey = key;
  const scale = (AREA(S.cur) || AREAS[0]).music, root = 523 * Math.pow(2, ({spring:2, summer:4, autumn:0, winter:-3})[seasonOf()] / 12);
  const step = 60 / 76 / 2;
  musMotif = [makeMotif(scale), makeMotif(scale)]; musStep = 0;
  const freq = deg => root * Math.pow(2, (scale[deg % scale.length] + 12 * Math.floor(deg / scale.length)) / 12);
  musTimer = setInterval(() => {
    if(!AC || AC.state !== 'running') return;
    const t = AC.currentTime + 0.05, phrase = Math.floor(musStep / 16) % 4, i = musStep % 16;
    const mot = musMotif[phrase === 2 ? 1 : 0], d = mot[i];
    if(d !== null) bell(freq(d), 1.6, 0.5, t, musGain);
    if(i % 8 === 0) bell(freq([0, 3, 4, 0][phrase]) / 2, 2.4, 0.35, t, musGain);
    if(i % 8 === 4 && Math.random() < 0.6) bell(freq([2, 5, 6, 2][phrase]) / 2, 1.8, 0.2, t, musGain);
    musStep++;
    if(musStep % 128 === 0) musMotif[Math.random() < 0.5 ? 0 : 1] = makeMotif(scale);
  }, step * 1000);
}
function musicStop(){ if(musTimer) clearInterval(musTimer); musTimer = null; musKey = null; }
function audioUnlock(){ const A = audio(); if(A && A.state === 'suspended') A.resume(); musicStart(); }

  }

/* ---------- tapping sheep: tap = pet (or shear when fluffy), hold = sheep card ---------- */
function bindSheep(a){
  let timer = null, down = false, sx = 0, sy = 0, held = false;
  a.el.addEventListener('pointerdown', e => {
    e.stopPropagation(); down = true; held = false; sx = e.clientX; sy = e.clientY;
    timer = setTimeout(() => { if(!down) return; held = true; const s = sheepById(a.id); if(s){ sfx('tap'); openSheep(s); } }, 480);
  });
  a.el.addEventListener('pointermove', e => { if(down && Math.hypot(e.clientX - sx, e.clientY - sy) > 14){ clearTimeout(timer); down = false; } });
  a.el.addEventListener('pointerup', e => {
    e.stopPropagation(); clearTimeout(timer);
    if(!down || held){ down = false; return; } down = false;
    const s = sheepById(a.id); if(!s) return;
    if(s.w >= 1 && !isLamb(s)) doShear(s); else petSheep(s);
  });
  a.el.addEventListener('pointercancel', () => { clearTimeout(timer); down = false; });
  a.el.addEventListener('contextmenu', e => e.preventDefault());
}
function popActor(s, cls){
  const a = actors[s.id]; if(!a) return;
  a.el.classList.remove('pop', 'shorn'); void a.el.offsetWidth; a.el.classList.add(cls || 'pop');
  setTimeout(() => a.el.classList.remove(cls || 'pop'), 700);
}
function petSheep(s){
  const t = now(), a = actors[s.id];
  baa(isLamb(s) ? 1.6 : rnd(0.9, 1.15));
  popActor(s);
  if(s.sulk > t){ fxAtSheep(s, '💢'); return; }
  fxAtSheep(s, pick(['💛','💕','💖','💗']));
  if(s.p === 'shy'){ s.blush = t + 3000; if(a) a.key = ''; renderSheep(); }
  if(t - (s.petT || 0) < CONFIG.PET_COOLDOWN_MS) return;
  s.petT = t;
  if(s.nap > t) s.nap = 0;
  addLove(s, CONFIG.PET_LOVE); s.m.joy = Math.min(100, s.m.joy + CONFIG.PET_JOY);
  S.stats.pets++; tutEvent('pet');
}
function doShear(s){
  const n = shear(s); if(!n) return;
  sfx('snip'); fluffPuffs(s);
  const a = actors[s.id]; if(a){ a.key = ''; }
  renderSheep(); popActor(s, 'shorn');
  fxAtSheep(s, '+' + n + ' ☁️');
  if(s.p === 'dramatic'){
    s.sulk = now() + 12000; setTimeout(() => baa(0.8, true), 150);
    const ac = actors[s.id]; if(ac){ const b = document.createElement('div'); b.className = 'bub'; b.textContent = T('BAAA!', 'BÊÊÊ!'); ac.el.appendChild(b); setTimeout(() => b.remove(), 1800); }
    if(a) a.key = '';
  } else setTimeout(() => baa(isLamb(s) ? 1.5 : 1.25), 200);
  renderSide(); renderCare(); refreshTop(); tutEvent('shear'); saveNow();
}
function shearAll(){
  const ds = sheepIn(S.cur).filter(s => s.w >= CONFIG.SHEAR_MIN && !isLamb(s));
  if(!ds.length){ toast(T('Nobody is fluffy yet', 'Personne n’est assez duveteux'), 'err'); sfx('err'); return; }
  ds.forEach((s, i) => setTimeout(() => doShear(s), i * 180));
}
function fluffPuffs(s){

    const p = document.createElement('div'); p.className = 'puff';
    p.style.left = a.x + '%'; p.style.top = (a.y - 6) + '%';

    sceneEl().appendChild(p); setTimeout(() => p.remove(), 900);
  }
}
function fxAt(x, y, txt, delay){

function openFeed(){

  let h = '<p class="center muted">' + T('Pick a food. The hungriest sheep here eat first.', 'Choisis un aliment. Les moutons les plus affamés mangent en premier.') + '</p>';

      (!un ? '<button class="btn ghost sm" disabled>🔒</button>' : (F.free || have > 0) ? '<button class="btn" data-feed="'+k+'">'+T('Feed','Nourrir')+'</button>' : '<button class="btn ghost sm" data-buy="'+k+'">'+T('Buy','Acheter')+'</button>')+'</div>';
  });

  $('mBody').querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { closeModal(); mTab = 'food'; showView('Market'); });
  tutEvent('openFeed');

function feedOne(s, k){
  const F = FOODS[k];
  if(!F.free){ if((S.inv[k] || 0) <= 0) return false; S.inv[k]--; }
  s.m.food = Math.min(100, s.m.food + F.food); s.m.joy = Math.min(100, s.m.joy + F.joy);
  if(F.boost) s.boost = {m: F.boost, until: now() + F.mins * 60000 * (s.p === 'greedy' ? 2 : 1)};
  addLove(s, k === 'grass' ? 2 : 6); fxAtSheep(s, F.e); S.stats.feeds++;
  return true;
}
function feedArea(k){
  const ds = sheepIn(S.cur).filter(s => s.m.food < 95).sort((a, b) => a.m.food - b.m.food);
  if(!ds.length){ toast(T('Everyone is full!', 'Tout le monde a le ventre plein!')); return; }
  let fed = 0;
  for(const s of ds){ if(!feedOne(s, k)) break; fed++; setTimeout(() => baa(rnd(1, 1.3)), fed * 120); }
  if(fed){ sfx('coin'); tutEvent('feed'); }
  renderCare(); saveNow();
}

/* ---------- the animation loop for sheep ---------- */
function placeActor(a){ a.el.style.left = a.x + '%'; a.el.style.top = a.y + '%'; a.el.style.zIndex = Math.round(a.y * 10); }
function chooseAct(s, a){
  const t = now();
  if(isNight() && (s.p === 'sleepy' || Math.random() < 0.6)){ s.nap = t + rnd(20, 60) * 1000; a.act = 'nap'; a.wait = rnd(8, 20); a.key = ''; return; }
  const w = {graze:30, walk:22, spot:20, bounce:s.p === 'bouncy' ? 30 : 5, nap:s.p === 'sleepy' ? 22 : (seasonOf() === 'summer' ? 8 : 4), roll:7};
  const keys = Object.keys(w), k = keys[weighted(keys.map(x => w[x]))];
  a.act = k;
  if(k === 'graze'){ a.wait = rnd(2, 6); }
  else if(k === 'walk'){ [a.tx, a.ty] = randSpot(); }
  else if(k === 'spot'){ const p = SPOTS[s.spot].p; a.tx = p[0] + rnd(-5, 5); a.ty = p[1] + rnd(-2, 3); }
  else if(k === 'bounce'){ [a.tx, a.ty] = randSpot(); a.bouncing = true; }
  else if(k === 'nap'){ s.nap = t + rnd(10, 30) * 1000; a.wait = rnd(8, 16); a.key = ''; }
  else if(k === 'roll'){ a.tx = HILL_TOP[0] + rnd(-3, 3); a.ty = HILL_TOP[1] + rnd(0, 2); a.rollNext = true; }
}
function stepActors(dt){
  const t = now();
  sheepIn(S.cur).forEach(s => {
    const a = actors[s.id]; if(!a) return;
    let cls = 'idle';
    const mom = s.mom && isLamb(s) ? actors[s.mom] : null;
    if(s.sulk > t){ cls = 'sulk'; a.tx = a.x; a.ty = a.y; }
    else if(napping(s)){ cls = 'nap'; a.tx = a.x; a.ty = a.y; if(s.nap && s.nap <= t && !isNight()){ s.nap = 0; a.key = ''; } }
    else if(mom){ const back = mom.flip ? 1 : -1; a.tx = mom.x + back * 7; a.ty = mom.y + 1.5; }
    const dx = a.tx - a.x, dy = a.ty - a.y, dist = Math.hypot(dx, dy);
    if(cls === 'idle' && dist > 0.5){
      let sp = (isLamb(s) ? 8 : 5.5) * dt;
      if(a.act === 'rolling') sp = 16 * dt;
      const m = Math.min(dist, sp);
      a.x += dx / dist * m; a.y += dy / dist * m;
      if(a.act !== 'rolling') a.flip = dx < -0.1 ? true : dx > 0.1 ? false : a.flip;
      cls = a.act === 'rolling' ? 'roll' : a.bouncing ? 'bounce' : 'walk';
    } else if(cls === 'idle'){
      if(a.rollNext){ a.rollNext = false; a.act = 'rolling'; a.tx = HILL_BOTTOM[0] + rnd(-4, 4); a.ty = HILL_BOTTOM[1] + rnd(-2, 3); a.flip = false; if(Math.random() < 0.5) setTimeout(() => baa(1.4), 100); }
      else if(a.act === 'rolling'){ a.act = 'idle'; a.wait = 1.5; fxAtSheep(s, '💫'); }
      else {
        a.bouncing = false;
        if(a.act === 'graze') cls = 'graze';
        if(!mom){ a.wait -= dt; if(a.wait <= 0) chooseAct(s, a); }
      }
    }
    if(a.cls !== cls){ a.el.classList.remove('idle','walk','graze','bounce','nap','roll','sulk'); a.el.classList.add(cls); a.cls = cls; }
    a.el.querySelector('.flip').style.transform = a.flip ? 'scaleX(-1)' : '';
    placeActor(a);
  });
}

function bindDecor(el, d){
  let down = false, moved = false, sx = 0, sy = 0;
  el.addEventListener('pointerdown', e => { if(!document.body.classList.contains('decoMode')) return; e.stopPropagation(); down = true; moved = false; sx = e.clientX; sy = e.clientY; el.setPointerCapture && el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    if(!down) return;
    if(Math.hypot(e.clientX - sx, e.clientY - sy) > 8) moved = true;
    if(moved){ const r = sceneEl().getBoundingClientRect(); d.x = clamp((e.clientX - r.left) / r.width * 100, 3, 97); d.y = clamp((e.clientY - r.top) / r.height * 100 + 4, WALK.y0 - 2, 98); el.style.left = d.x + '%'; el.style.top = d.y + '%'; el.style.zIndex = Math.round(d.y * 10); }
  });
  el.addEventListener('pointerup', e => {
    if(!down) return; down = false;
    if(!moved){
      confirmBox(T('Put it away?', 'Ranger cet objet?'), T('It goes back to your storage.', 'Il retourne dans ton rangement.'), '📦 ' + T('Put away', 'Ranger'), () => {
        S.decor = S.decor.filter(x => x !== d);

function rollGift(){
  const r = Math.random();
  if(r < 0.3){ const d = pick(DYE_IDS); return {dye: d, n: rint(1, 3)}; }
  if(r < 0.55 && S.upg.food > 0){ const pool = FOOD_IDS.filter(k => !FOODS[k].free && foodUnlocked(k)); return {food: pick(pool), n: rint(2, 4)}; }
  if(r < 0.7){ return {yarn: rint(2, 4)}; }
  return {coins: Math.round(rnd(60, 120) * (1 + S.sheep.length * 0.25))};
}
function giveGift(g){
  if(g.dye){ S.dyes[g.dye] = (S.dyes[g.dye] || 0) + g.n; return '+' + g.n + ' ' + DYES[g.dye].e + ' ' + L(DYES[g.dye]); }

  addCoins(g.coins); return '+' + fmt(g.coins) + ' 🪙';
}

  ({fence: fenceInit, catch: catchInit})[id]();
  requestAnimationFrame(gameLoop);
}
function gameLoop(ts){
  if(!G) return;
  const dt = Math.min(0.05, (ts - G.last) / 1000); G.last = ts; G.t += dt;
  const ctx = G.ctx; ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  G.step(dt, ctx);
  G.parts = G.parts.filter(p => (p.life -= dt) > 0);
  G.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1;
  requestAnimationFrame(gameLoop);
}
function burst(x, y, c, n){ for(let i=0;i<(n || 10);i++){ const a = Math.random() * 7, s = rnd(60, 220); G.parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, r: rnd(2, 5), c: c || '#fff', life: 0.7, max: 0.7}); } }
function hud(html){ $('gHud').innerHTML = html + '<button class="pill" id="gQuit" aria-label="Quit">✕</button>'; $('gQuit').onclick = () => gameOver(true); }
function emoji(ctx, e, x, y, size){ ctx.font = size + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y); }
function hillsBg(ctx, groundY){
  const W = G.W, H = G.H, g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#a9dcff'); g.addColorStop(1, '#e6f6ff'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; [[0.2,0.15],[0.7,0.22]].forEach(([x, y]) => { ctx.beginPath(); ctx.ellipse(W*x, H*y, 50, 16, 0, 0, 7); ctx.ellipse(W*x+30, H*y-8, 30, 14, 0, 0, 7); ctx.fill(); });
  ctx.fillStyle = '#a6d98a'; ctx.beginPath(); ctx.moveTo(0, groundY - 60); ctx.quadraticCurveTo(W * 0.3, groundY - 120, W * 0.6, groundY - 50); ctx.quadraticCurveTo(W * 0.85, groundY - 10, W, groundY - 70); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  ctx.fillStyle = '#86cb64'; ctx.fillRect(0, groundY, W, H - groundY);
}
function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function gameImgs(){
  const owned = S.sheep.length ? S.sheep : [{b:'white'}];
  return owned.slice(0, 8).map(s => svgImg(sheepSVG({b: s.b, w: 1, o: []}, {noShadow: 1})));
}

/* ---- Fence Count: count the sheep that jump over ---- */
function fenceInit(){
  G.imgs = gameImgs(); G.round = 0; G.rounds = 3; G.right = 0;
  G.groundY = G.H * 0.68; G.fx = G.W * 0.5;
  newFenceRound();
  G.step = (dt, ctx) => {
    hillsBg(ctx, G.groundY);
    // fence
    ctx.fillStyle = '#c98f55'; ctx.strokeStyle = '#a8703c'; ctx.lineWidth = 3;
    for(let i=-1;i<=1;i++){ roundRect(ctx, G.fx - 6 + i * 26, G.groundY - 74, 12, 80, 4); ctx.fill(); ctx.stroke(); }
    roundRect(ctx, G.fx - 50, G.groundY - 62, 100, 10, 4); ctx.fill(); ctx.stroke();
    roundRect(ctx, G.fx - 50, G.groundY - 34, 100, 10, 4); ctx.fill(); ctx.stroke();
    // sheep
    G.list.forEach(s => {
      if(G.t < s.at) return;
      const sp = s.v * dt;
      if(s.fake){
        if(s.phase === 0){ s.x += sp; if(s.x >= G.fx - 90){ s.phase = 1; s.wait = 0.6; } }
        else if(s.phase === 1){ s.wait -= dt; if(s.wait <= 0){ s.phase = 2; s.flip = true; } }
        else s.x -= sp * 1.2;
      } else {
        s.x += sp;
        const d = s.x - (G.fx - 70);
        s.y = d > 0 && d < 140 ? -Math.sin(d / 140 * Math.PI) * 110 : 0;
        if(d > 0 && d < 140) s.rot = (d / 140 - 0.5) * 0.5; else s.rot = 0;
        if(d > 0 && !s.boing){ s.boing = 1; sfx('boing'); }
      }
      const size = 80 * (s.lamb ? 0.65 : 1), bob = s.y === 0 ? Math.abs(Math.sin(G.t * 10 + s.at)) * 3 : 0;
      ctx.save(); ctx.translate(s.x, G.groundY - size * 0.42 + s.y - bob); ctx.rotate(s.rot || 0); if(s.flip) ctx.scale(-1, 1);
      if(s.img.complete) ctx.drawImage(s.img, -size / 2, -size * 0.45, size, size * 0.9);
      ctx.restore();
    });
    const done = G.list.every(s => G.t > s.at && (s.fake ? s.x < -80 : s.x > G.W + 80));
    if(done && !G.asking && !G.over) askFence();
  };
}
function newFenceRound(){
  G.round++; G.asking = false; G.t = 0;
  const r = G.round, n = [rint(4, 6), rint(6, 9), rint(8, 12)][r - 1], fakes = [1, 2, 3][r - 1];
  G.answer = n; G.list = [];
  let at = 0.8;
  const all = Array(n).fill(0).concat(Array(fakes).fill(1)).sort(() => Math.random() - 0.5);
  all.forEach(f => {
    G.list.push({at, x: -70, y: 0, v: rnd(150, 230) * (1 + r * 0.15) * (G.W / 400 < 1 ? 0.85 : 1), fake: !!f, img: pick(G.imgs), lamb: Math.random() < 0.2, phase: 0});
    at += rnd(0.5, 1.3) / (1 + r * 0.25);
  });
  hud('<span class="pill">🐑 ' + T('Round', 'Manche') + ' ' + r + '/' + G.rounds + '</span><span class="pill">✅ ' + G.right + '</span>');
}
function askFence(){
  G.asking = true;
  const opts = new Set([G.answer]); while(opts.size < 4){ const o = G.answer + rint(-3, 3); if(o > 0) opts.add(o); }
  const box = $('gAns');
  box.innerHTML = '<div class="pill" style="width:100%;justify-content:center;font-size:1.15em;padding:10px">' + T('How many jumped over?', 'Combien ont sauté?') + '</div>' + [...opts].sort((a, b) => a - b).map(o => '<button class="btn" data-a="'+o+'">'+o+'</button>').join('');
  box.classList.add('on');
  box.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    box.classList.remove('on');
    const ok = +b.dataset.a === G.answer;
    if(ok){ G.right++; sfx('win'); burst(G.W / 2, G.H / 3, '#ffd23f', 24); }
    else sfx('err');
    hud('<span class="pill">' + (ok ? '✅ ' + T('Yes!', 'Oui!') : '❌ ' + T('It was', 'C’était') + ' ' + G.answer) + '</span>');
    setTimeout(() => { if(!G) return; if(G.round >= G.rounds){ G.score = G.right; gameOver(); } else newFenceRound(); }, 1400);
  });
}

/* ---- Yarn Catch ---- */
function catchInit(){
  Object.assign(G, {x: G.W / 2, tx: G.W / 2, items: [], spawn: 0, lives: 3, speed: CONFIG.CATCH_SPEED, groundY: G.H - 40});
  const move = e => { const p = e.touches ? e.touches[0] : e; G.tx = p.clientX; };
  G.c = cv(); G.c.onpointermove = move; G.c.onpointerdown = move;
  G.step = (dt, ctx) => {
    hillsBg(ctx, G.H - 90);
    G.speed += CONFIG.CATCH_RAMP * dt;
    G.spawn -= dt;
    if(G.spawn <= 0 && !G.over){
      G.spawn = Math.max(0.35, 0.95 - G.t * 0.012);
      const r = Math.random(), k = r < 0.07 ? 'gold' : r < 0.27 ? 'bad' : 'yarn';
      G.items.push({k, x: rnd(30, G.W - 30), y: -30, c: pick(DYE_COLORS.concat(['white','white','cream'])), v: G.speed * rnd(0.85, 1.2), rot: rnd(0, 6)});
    }
    G.x += (G.tx - G.x) * Math.min(1, dt * 14);
    const by = G.H - 90;
    G.items.forEach(it => {
      it.y += it.v * dt; it.rot += dt * 2;
      if(it.k === 'bad') emoji(ctx, '🌰', it.x, it.y, 38);
      else {
        const col = it.k === 'gold' ? '#ffd23f' : COLORS[it.c].c, R = it.k === 'gold' ? 22 : 18;
        ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
        ctx.strokeStyle = shade(col, -0.25); ctx.lineWidth = 2;
        for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.ellipse(0, i * 7, R * 0.9, R * 0.35, 0, 0, 7); ctx.stroke(); }
        if(it.k === 'gold'){ emoji(ctx, '✨', 0, 0, 18); }
        ctx.restore();
      }
      if(!it.hit && it.y > by - 30 && it.y < by + 10 && Math.abs(it.x - G.x) < 52){
        it.hit = 1;
        if(it.k === 'bad'){ G.lives--; sfx('err'); burst(it.x, it.y, '#8a5a3a', 12); if(G.lives <= 0) gameOver(); }
        else { G.score += it.k === 'gold' ? 5 : 1; sfx(it.k === 'gold' ? 'win' : 'pop'); burst(it.x, it.y, it.k === 'gold' ? '#ffd23f' : COLORS[it.c].c, 10); }
      }
    });
    G.items = G.items.filter(it => !it.hit && it.y < G.H + 40);
    // basket
    ctx.fillStyle = '#c98f55'; ctx.strokeStyle = '#8f5f33'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(G.x - 55, by - 20); ctx.lineTo(G.x + 55, by - 20); ctx.lineTo(G.x + 42, by + 26); ctx.lineTo(G.x - 42, by + 26); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#e3b17c'; ctx.lineWidth = 2;
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(G.x - 52 + i * 3, by - 8 + i * 12); ctx.lineTo(G.x + 52 - i * 3, by - 8 + i * 12); ctx.stroke(); }
    hud('<span class="pill">🧶 ' + G.score + '</span><span class="pill">' + '❤️'.repeat(Math.max(0, G.lives)) + '</span>');
  };
}

/* =====================================================================
   12. MAIN LOOP — game ticks, away time, guide, start-up
   tick(): once a second — moods, wool, yarn, knitting, lambs
   frame(): every screen frame — sheep move
===================================================================== */
function stepWorld(dt, t, offline){
  const rate = MOOD_RATE();
  S.sheep.forEach(s => {
    s.m.food = Math.max(0, s.m.food - rate * dt * (s.p === 'greedy' ? 1.5 : 1) * (1 - 0.1 * S.upg.hay));
    s.m.joy = Math.max(0, s.m.joy - rate * dt * (s.p === 'bouncy' ? 0.7 : 1) * (1 - 0.1 * S.upg.fence));
    if(!isLamb(s)) s.w = Math.min(1, s.w + woolRate(s, t) * dt);
    else if(t - s.lamb >= CONFIG.LAMB_GROW_HOURS * 3600000){
      s.lamb = null; s.w = Math.max(s.w, 0.5); if(actors[s.id]) actors[s.id].key = '';
      if(!offline) toast('🐑 ' + esc(sheepName(s)) + ' ' + T('is all grown up!', 'est maintenant grand!'), 'gold');
    }
  });
  const yarn = stepSpin(dt);
  const items = stepKnit(dt, offline);
  return {yarn, items};
}
function tryLamb(t){
  S.lambAt = t + CONFIG.LAMB_EVERY_MIN * 60000;
  if(roomLeft() <= 0 || S.tut < 99) return null;
  const moms = S.sheep.filter(s => !isLamb(s) && !B(s).paid && !B(s).ad && hearts(s) >= 2 && moodAvg(s) >= 60 && !S.sheep.some(x => x.mom === s.id && isLamb(x)));
  if(!moms.length || Math.random() > CONFIG.LAMB_CHANCE) return null;
  const mom = pick(moms);
  const l = makeSheep({b: mom.b, a: mom.a, lamb: t, mom: mom.id, w: 0.2, love: 100, spot: mom.spot});
  S.stats.lambs++;
  return l;
}
let tickN = 0, wasNight = null;

  const t = now();
  stepWorld(1, t);
  S.stats.play++; tickN++;
  if(t > S.lambAt){ const l = tryLamb(t); if(l){ toast('🍼 ' + T('A baby lamb arrived!', 'Un bébé agneau est arrivé!') + ' ' + esc(sheepName(l)), 'gold'); sfx('gift'); setTimeout(() => baa(1.7), 300); if(curView === 'Hills') renderSheep(); } }
  if(S.tut >= 99 && tickN % 30 === 0 && !modalOpen() && !G) checkDaily();
  if(tickN % 10 === 0) saveNow();
  refreshTop();
  const night = isNight();
  if(curView === 'Hills' && !G){
    renderSheep();
    if(night !== wasNight){ wasNight = night; renderBg(); renderProps(); $('nightTint').style.opacity = night ? 0.4 : 0; }
    if(tickN % 3 === 0){ renderSide(); renderCare(); }
    if(S.upg.windmill && tickN % 2 === 0){}
  }
  if(curView === 'Knit' && (S.knit.length || rawTotal()) && !modalOpen()) refresh();
  if(curView === 'Shop' && tickN % 5 === 0) refresh();
}

/* ---------- away time ---------- */
function catchUp(){
  const t = now(), away = (t - (S.lastSeen || t)) / 1000;
  if(away < 30) return;
  const fluffy0 = S.sheep.filter(s => s.w >= 1).length;
  const steps = Math.min(Math.floor(away / 60), CONFIG.OFFLINE_MAX_DAYS * 24 * 60);
  let sim = S.lastSeen, yarn = 0, items = [];
  for(let i=0;i<steps;i++){ sim += 60000; const r = stepWorld(60, sim, true); yarn += r.yarn; items = items.concat(r.items); }
  const rest = away - steps * 60;
  if(rest > 0 && rest < 600){ const r = stepWorld(rest, t, true); yarn += r.yarn; items = items.concat(r.items); }
  if(t > S.lambAt) tryLamb(t);
  S.lastSeen = t;
  const fluffy = S.sheep.filter(s => s.w >= 1 && !isLamb(s)).length;
  if(away >= 60 && (yarn || items.length || fluffy > fluffy0)){
    let h = '<div class="reward"><div class="big">' + guideSVG() + '</div><p>' + T('You were away for', 'Temps d’absence :') + ' <b>' + fmtTime(away) + '</b></p>';
    if(fluffy) h += '<p>☁️ <b>' + fluffy + '</b> ' + T('sheep are fluffy and ready to shear!', 'moutons sont tout duveteux et prêts à tondre!') + '</p>';
    if(yarn) h += '<p>🧶 +' + yarn + ' ' + T('yarn spun', 'fils filés') + '</p>';
    if(items.length) h += '<p>🪡 ' + items.map(it => itemIcon(it, 26)).join(' ') + '<br>' + items.length + ' ' + T('items knitted', 'objets tricotés') + '</p>';
    h += '</div><button class="btn wide" id="wbOk">' + T('Let’s go!', 'C’est parti!') + '</button>';
    queueModal(() => { openModal('🌅 ' + T('Welcome back!', 'Bon retour!'), h); $('wbOk').onclick = closeModal; });
  }
  saveNow();
}

/* ---------- guide: Nana Pearl ---------- */
const TUT = [
  null,
  {ev:'pet', hl:['#sheep .sheep'], en:'Hello dear! I’m Nana Pearl. Tap a sheep to pet it! 💛', fr:'Bonjour mon chou! Je suis Mamie Perle. Touche un mouton pour le flatter! 💛'},
  {ev:'shear', hl:['#sShear'], en:'Biscuit is SO fluffy! Tap a sheep with ✂️ above it, or tap “Shear all”.', fr:'Galette est TELLEMENT duveteuse! Touche un mouton avec ✂️ au-dessus, ou « Tout tondre ».'},
  {ev:'feed', hl:['#cFeed'], en:'Shorn sheep get hungry. Tap Feed and give them grass! 🌿', fr:'Les moutons tondus ont faim. Touche Nourrir et donne-leur de l’herbe! 🌿'},
  {ev:'viewKnit', hl:['#navKnit'], en:'The wool turns into yarn on the spinning wheel all by itself. Open Knit! 🧶', fr:'La laine devient du fil sur le rouet toute seule. Ouvre Tricot! 🧶'},
  {ev:'knit', hl:['[data-knit="scarf"]'], en:'When you have 2 yarn, tap Knit on the Scarf! 🧣', fr:'Quand tu as 2 fils, touche Tricoter sur le Foulard! 🧣'},
  {ev:'sell', hl:['[data-sell]','#navMarket'], en:'Your scarf will be ready in a few seconds. Then sell it at the Market! 🪙', fr:'Ton foulard sera prêt dans quelques secondes. Puis vends-le au Marché! 🪙'},
];
function tutHl(){
  document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
  const st = TUT[S.tut]; if(!st) return;
  for(const sel of st.hl){ const el = document.querySelector(sel); if(el){ el.classList.add('hl'); break; } }
}
function tutShow(){
  const st = TUT[S.tut];
  if(!st){ $('tut').classList.remove('on'); document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl')); return; }
  $('tutGd').innerHTML = guideSVG();
  $('tutTx').textContent = S.lang === 'fr' ? st.fr : st.en;
  $('tutBtn').textContent = T('Skip', 'Passer');
  $('tutBtn').onclick = () => { S.tut = 99; $('tut').classList.remove('on'); document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl')); saveNow(); checkDaily(); };
  $('tut').classList.add('on');
  const top = curView === 'Hills';
  $('tut').style.top = top ? '' : 'auto'; $('tut').style.bottom = top ? '' : 'calc(92px + env(safe-area-inset-bottom))';
  setTimeout(tutHl, 200);
}
function tutEvent(ev){
  if(!S || S.tut < 1 || S.tut >= 99) return;
  const st = TUT[S.tut];
  if(ev.startsWith('view')) setTimeout(tutShow, 60);
  if(!st || st.ev !== ev) return;
  S.tut++; sfx('coin');
  if(!TUT[S.tut]){
    S.tut = 99; $('tut').classList.remove('on'); document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
    addCoins(200); DYE_IDS.forEach(k => S.dyes[k] = (S.dyes[k] || 0) + 2);
    queueModal(() => showReward(guideSVG(), T('You’re a natural!', 'Bravo, c’est parfait!'), T('Here’s a gift to start your farm:', 'Voici un cadeau pour commencer ta ferme :') + '<br>+200 🪙 · +8 🎨<br><span class="muted">' + T('Tip: hold your finger on a sheep to see its card.', 'Astuce : garde ton doigt sur un mouton pour voir sa fiche.') + '</span>', () => checkDaily()));
  } else setTimeout(tutShow, 300);
  saveNow();
}

/* ---------- new game ---------- */
function startNewGame(){
  S = newState();
  const a = makeSheep({b:'white', n:0, p:'bouncy', spot:'oak', a:'hills', w:1});
  const b = makeSheep({b:'black', n:1, p:'sleepy', spot:'sunny', a:'hills', w:0.45});
  a.m = {food: 70, joy: 70}; b.m = {food: 60, joy: 75};
  S.tut = 0;
  saveNow();
  askName(a, sheepName(a));
}
function askName(first, val){
  openModal('', '<div class="reward"><div class="big">' + sheepSVG(first) + '</div><h2>' + T('Welcome to Sheep Hills!', 'Bienvenue à Sheep Hills!') + '</h2><p>' + T('This fluffy sheep is yours. What’s its name?', 'Ce mouton duveteux est à toi. Comment s’appelle-t-il?') + '</p>' +
    '<input id="fnIn" maxlength="14" value="' + esc(val) + '" style="width:80%;padding:12px;border-radius:12px;border:2px solid #e3ead8;text-align:center;font-size:18px">' +
    '<div class="seg" style="margin:12px auto;max-width:260px"><button id="nlEn" class="' + (S.lang === 'en' ? 'on' : '') + '">English</button><button id="nlFr" class="' + (S.lang === 'fr' ? 'on' : '') + '">Français</button></div>' +
    '<button class="btn wide" id="fnGo">🐑 ' + T('Let’s go!', 'C’est parti!') + '</button></div>', null, true);
  const relang = l => { const v = $('fnIn').value, same = v === sheepName(first); S.lang = l; applySettings(); renderNav(); renderHills(); closeModal(); askName(first, same ? sheepName(first) : v); };
  $('nlEn').onclick = () => relang('en'); $('nlFr').onclick = () => relang('fr');
  $('fnGo').onclick = () => { const v = $('fnIn').value.trim(); if(v && v !== sheepName(first)) first.nm = v.slice(0, 14); closeModal(); S.tut = 1; renderHills(); tutShow(); audioUnlock(); baa(); saveNow(); };
}

/* ---------- start-up ---------- */
function boot(){
  $('loadSheep').innerHTML = sheepSVG({b:'white', w:1, o:[{k:'scarf', c:'red', w:'soft'}]}, {noShadow:1});
  const saved0 = load(), lang0 = (saved0 || {}).lang || ((navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en');
  $('loadTip').textContent = '💡 ' + pick(TIPS)[lang0];
  let p = 0; const iv = setInterval(() => { p = Math.min(100, p + rnd(12, 28)); $('loadBar').style.width = p + '%'; }, 140);
  setTimeout(() => {
    clearInterval(iv); $('loadBar').style.width = '100%';
    const saved = load();
    if(saved){ S = saved; catchUp(); } else startNewGame();
    shownC = S.coins;
    applySettings(); renderNav(); showView('Hills');
    if(S.tut >= 1 && S.tut < 99) tutShow();
    else if(S.tut >= 99) checkDaily();
    $('load').style.opacity = 0; setTimeout(() => $('load').remove(), 600);
    setInterval(tick, 1000);
    requestAnimationFrame(frame);
    adsInit();
  }, 1300);
  $('mClose').onclick = closeModal;
  $('modalBg').addEventListener('pointerdown', e => { if(e.target === $('modalBg') && $('mClose').style.display !== 'none') closeModal(); });
  $('pCoin').onclick = openBoosts;
  $('pYarn').onclick = () => { sfx('tap'); showView('Knit'); };
  $('setBtn').onclick = openSettings;
  $('muteBtn').onclick = () => { const on = !(S.snd || S.mus); S.snd = on; S.mus = on; if(on){ audioUnlock(); sfx('tap'); } else musicStop(); refreshTop(); saveNow(); };
  $('decoDone').onclick = () => { decoMode(false); saveNow(); };
  document.addEventListener('pointerdown', audioUnlock, {once: true});
  document.addEventListener('visibilitychange', () => {
    if(!S) return;
    if(document.hidden){ saveNow(); musicStop(); }
    else { catchUp(); if(S.mus && !G) musicStart(); if(curView === 'Hills') renderHills(); }
  });
  document.addEventListener('pause', () => { if(S){ saveNow(); musicStop(); } }, false);
  window.addEventListener('resize', () => { if(S && curView === 'Hills'){ for(const k in actors) actors[k].key = ''; renderHills(); } });
}
window.addEventListener('load', boot);
</script>
