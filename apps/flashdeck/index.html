<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF5EA">
<title>Flash Deck</title>
<!--
=====================================================================
  FLASH DECK — cozy flashcards + Tiny Timer, by MOS Arcade
  One file, no internet needed. How it's organized (top to bottom):
   1. STYLE      — colors, fonts, buttons, card flip, timer, themes
   2. MONEY      — optional rewarded ads (unlock card themes)
   3. WORDS      — every sentence in English + French
   4. MEMORY     — saving on the phone (cards in localStorage,
                   photos in IndexedDB)
   5. SCREENS    — home, deck, study, quiz, settings, timer
   6. PHONE      — read aloud, camera, share, reminders, back button
   7. START      — boots the app
=====================================================================
-->
<style>
@font-face{font-family:"Fredoka";src:url(fonts/fredoka-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Fredoka";src:url(fonts/fredoka-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Fredoka";src:url(fonts/fredoka-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"OpenDyslexic";src:url(fonts/opendyslexic-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"OpenDyslexic";src:url(fonts/opendyslexic-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}

:root{
  --paper:#FBF5EA; --paper2:#F4EADA; --card:#FFFDF8; --ink:#3B2F2A; --ink2:#7A6A5F; --line:#E7DAC6;
  --accent:#D96C4E; --accent-ink:#fff; --sage:#6FA287; --butter:#EDBE5F; --rose:#D9607A;
  --head:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  --r:22px; --shadow:0 2px 0 rgba(90,60,30,.08),0 8px 24px rgba(90,60,30,.08);
  --st:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));
  --sb:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.big{font-size:19.5px}
html.dys{--head:"OpenDyslexic",sans-serif;--body:"OpenDyslexic",sans-serif}
html.dys body{line-height:1.55}
html.dys .grade,html.dys .modes button,html.dys .theme{font-size:.82rem}
button,.btn{overflow-wrap:anywhere}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.45;
  background-image:radial-gradient(rgba(150,110,60,.05) 1px,transparent 1px);background-size:6px 6px;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.2}
.screen{max-width:560px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 110px)}
.screen.no-tabs{padding-bottom:calc(var(--sb) + 28px)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:52px}
.topbar h1{font-size:1.6rem;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.topbar h1 span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:48px;height:48px;border-radius:16px;border:2px solid var(--line);background:var(--card);
  display:grid;place-items:center;font-size:1.3rem;flex:none;box-shadow:var(--shadow)}
.icon-btn:active{transform:translateY(1px)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);
  border-radius:999px;padding:6px 12px;font-weight:800;font-size:.95rem;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:12px 18px;
  border-radius:18px;border:none;font-family:var(--head);font-weight:600;font-size:1.15rem;
  background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(120,50,30,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,50,30,.25)}
.btn.soft{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.sage{background:var(--sage);box-shadow:0 4px 0 #4d7a63}
.btn.small{min-height:46px;font-size:1rem;border-radius:14px;width:auto;padding:8px 14px}
.btn.ghost{background:none;box-shadow:none;color:var(--ink2);min-height:48px;font-family:var(--body);font-weight:800;font-size:1rem;text-decoration:underline}
.btn.danger{background:#fff;color:#B33A3A;border:2px solid #EBC3C3;box-shadow:0 3px 0 #EBC3C3}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.muted{color:var(--ink2)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h2{font-size:1.15rem;margin-bottom:10px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.section-title h2{font-size:1.2rem}

/* ---------- home ---------- */
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:40px;height:40px;flex:none}
.due-banner{display:flex;align-items:center;gap:12px;background:var(--butter);color:#4A3517;border-radius:var(--r);
  padding:14px 16px;font-weight:800;margin-bottom:16px;box-shadow:0 3px 0 #C99B3E}
.due-banner .big{font-size:1.9rem;font-family:var(--head)}
.decks{display:grid;gap:12px}
.deck{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);
  border-radius:var(--r);padding:14px;box-shadow:0 4px 0 var(--line);border-left:10px solid var(--c)}
.deck:active{transform:translateY(2px)}
.deck .emo{width:56px;height:56px;border-radius:18px;background:color-mix(in srgb,var(--c) 28%,white);display:grid;place-items:center;font-size:1.9rem;flex:none}
.deck .nm{font-family:var(--head);font-weight:600;font-size:1.2rem;word-break:break-word}
.deck .meta{color:var(--ink2);font-weight:600;font-size:.95rem}
.deckrow{display:flex;gap:8px;align-items:stretch}
.deckrow .deck{flex:1;min-width:0}
.trash{width:54px;flex:none;border-radius:18px;border:2px solid #EBC3C3;background:#fff;font-size:1.3rem;box-shadow:0 4px 0 #EBC3C3;display:grid;place-items:center}
.trash:active{transform:translateY(2px);box-shadow:0 1px 0 #EBC3C3}
.deck .chk{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-weight:800;background:#fff}
.deck.sel{border-color:#D99382;background:#FDF0EC}
.deck.sel .chk{background:#B33A3A;border-color:#B33A3A}
.selbar{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border-radius:18px;padding:8px 8px 8px 16px;margin-bottom:14px;font-weight:800}
.selbar span{flex:1}
.selbar button{min-height:44px;border-radius:12px;border:none;background:rgba(255,255,255,.14);color:var(--paper);font-weight:800;padding:0 12px}
.tip{text-align:center;color:var(--ink2);font-weight:700;font-size:.9rem;margin:10px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem;min-height:40px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rtag.qa{background:#E3F1E6;color:#24543B}.rtag.tf{background:#F4D3CC;color:#7A2E1F}.rtag.list{background:#ECE4F7;color:#4B3577}.rtag.num{background:#DDEFF2;color:#1D5560}
.badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;padding:4px 10px;font-weight:800;font-size:.9rem;flex:none}
.badge.ok{background:var(--sage)}
.empty{text-align:center;padding:26px 10px}
.empty svg{width:150px;height:auto;margin-bottom:10px}
.empty h2{font-size:1.4rem;margin-bottom:6px}
.empty p{margin:0 0 18px;color:var(--ink2)}

/* ---------- deck ---------- */
.hero{border-radius:var(--r);padding:16px;margin-bottom:14px;background:color-mix(in srgb,var(--c) 26%,var(--card));border:2px solid color-mix(in srgb,var(--c) 45%,var(--line))}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px;text-align:center}
.stat{background:var(--card);border-radius:16px;padding:8px 4px}
.stat b{display:block;font-family:var(--head);font-size:1.6rem}
.stat span{font-size:.85rem;color:var(--ink2);font-weight:700}
.cardlist{display:grid;gap:8px}
.citem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;min-height:60px}
.citem .txt{flex:1;min-width:0}
.citem .f{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .b{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem img{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;background:var(--paper2)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;font-weight:700;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.mbar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--paper2);margin-top:12px}

/* ---------- study: the flip card ---------- */
.prog{height:12px;background:var(--paper2);border-radius:999px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--sage);border-radius:999px;transition:width .3s}
.flip{perspective:1400px;margin:8px 0 14px;cursor:pointer}
.flip-inner{position:relative;height:min(58vh,440px);transition:transform .6s cubic-bezier(.25,.8,.25,1);transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:56px 22px 22px;text-align:center;
  overflow:auto;box-shadow:0 6px 0 rgba(90,60,30,.12),0 16px 36px rgba(90,60,30,.12)}
.face.back{transform:rotateY(180deg)}
.face .side{position:absolute;top:16px;left:18px;font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
.face .say{position:absolute;top:10px;right:10px}
.face .ctext{font-family:var(--head);font-weight:600;white-space:pre-wrap;word-break:break-word;max-width:100%}
.face .ctext.l{font-size:2.2rem}.face .ctext.m{font-size:1.6rem}.face .ctext.s{font-size:1.2rem;font-family:var(--body);font-weight:600}
.face img.photo{max-width:100%;max-height:52%;border-radius:16px;object-fit:contain}
.hint{text-align:center;color:var(--ink2);font-weight:700;min-height:1.5em}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grade{min-height:78px;border-radius:18px;border:none;font-family:var(--head);font-weight:600;font-size:1.02rem;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.grade .e{font-size:1.6rem}
.g0{background:#F4D3CC;color:#7A2E1F;box-shadow:0 4px 0 #DDAA9E}
.g1{background:#F6E2B3;color:#6B4C10;box-shadow:0 4px 0 #DCC283}
.g2{background:#CFE6D8;color:#24543B;box-shadow:0 4px 0 #9CC5AE}
.grade:active{transform:translateY(3px);box-shadow:none}
.grades.hidden{visibility:hidden}
@media (prefers-reduced-motion:reduce){.flip-inner{transition:none}.flip .face{transition:opacity .25s}}

/* card themes (study + quiz card faces) */
.th-classic{background:#FFFDF8;color:#3B2F2A;border:2px solid #EADDC9}
.th-notebook{background:#FFFEFA repeating-linear-gradient(#FFFEFA 0 31px,#CFE0F0 31px 33px);color:#2F3A4A;border:2px solid #DDE6EE;border-left:12px solid #F1B9B9}
.th-kraft{background:#D9B98C;color:#3E2A14;border:2px solid #C29E6D}
.th-chalk{background:#2F4A3E;color:#F4F1E6;border:8px solid #8A6447}
.th-sakura{background:linear-gradient(160deg,#FFE9EF,#FFD3E0);color:#6E2840;border:2px solid #F7BBCC}
.th-ocean{background:linear-gradient(180deg,#D7F0F7,#9ED3E6);color:#173E52;border:2px solid #8CC4D8}
.th-night{background:radial-gradient(#fff 1px,transparent 1.5px) 0 0/34px 34px,radial-gradient(#fff8 1px,transparent 1.5px) 17px 17px/34px 34px,linear-gradient(180deg,#22264A,#3A3F75);color:#FFF6D8;border:2px solid #4A4F8C}
.th-mint{background:linear-gradient(180deg,#E8F6E9,#C9E8CF);color:#244A2E;border:2px solid #A9D4B2}
.th-sunset{background:linear-gradient(180deg,#FFE3B8,#F7A98B);color:#5A2414;border:2px solid #EE9C7E}

/* ---------- quiz ---------- */
.qcard{min-height:200px;border-radius:26px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;margin-bottom:14px;box-shadow:var(--shadow);position:relative}
.qcard .say{position:absolute;top:10px;right:10px}
.qcard img{max-width:100%;max-height:180px;border-radius:14px}
.choices{display:grid;gap:10px}
.choice{min-height:62px;text-align:left;padding:12px 16px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:1.08rem;box-shadow:0 3px 0 var(--line);word-break:break-word}
.choice.right{background:#CFE6D8;border-color:#7FB797}
.choice.wrong{background:#F4D3CC;border-color:#D99382}
.choice[disabled]{opacity:1}

/* ---------- sheets / modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(50,35,25,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(var(--sb) + 20px);animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet h2{font-size:1.35rem;margin:4px 0 14px}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
label.lbl{display:block;font-weight:800;margin:12px 0 6px}
.field{width:100%;min-height:52px;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;font-size:1.05rem}
textarea.field{min-height:96px;resize:vertical}
.field:focus{border-color:var(--accent);outline:none}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:46px;height:46px;border-radius:14px;border:3px solid transparent;background:var(--c)}
.sw.on{border-color:var(--ink);transform:scale(1.06)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:var(--card);font-size:1.4rem;padding:0}
.emojis button.on{border-color:var(--accent);background:#FBE3DA}
.photo-slot{display:flex;align-items:center;gap:10px;margin-top:8px}
.photo-slot img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.sheet .actions{display:grid;gap:10px;margin-top:18px}

/* ---------- settings ---------- */
.set-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);min-height:60px}
.set-row:last-child{border-bottom:none}
.set-row .lab{flex:1;font-weight:800}
.set-row .lab small{display:block;font-weight:600;color:var(--ink2)}
.toggle{width:62px;height:36px;border-radius:999px;border:none;background:#D9CDBD;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.toggle[aria-checked=true]{background:var(--sage)}
.toggle[aria-checked=true]::after{left:30px}
.seg{display:flex;background:var(--paper2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:none;border-radius:11px;background:none;font-weight:800}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.theme{position:relative;aspect-ratio:3/4;border-radius:16px;font-family:var(--head);font-weight:600;font-size:.9rem;display:flex;align-items:flex-end;justify-content:center;padding:8px;text-align:center}
.theme.on{outline:4px solid var(--accent);outline-offset:2px}
.theme .lock{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.9);color:#3B2F2A;border-radius:999px;padding:2px 8px;font-size:.8rem;font-family:var(--body);font-weight:800}
input[type=time].field{max-width:150px}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:10px;padding:10px 16px calc(var(--sb) + 10px);
  background:linear-gradient(180deg,rgba(251,245,234,0),var(--paper) 30%)}
.tabs button{flex:1;max-width:180px;min-height:66px;border-radius:20px;border:2px solid var(--line);background:var(--card);font-family:var(--head);font-weight:600;font-size:.95rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 3px 0 var(--line);padding:4px;line-height:1.15;position:relative}
.tabs button .ti{font-size:1.4rem}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:0 3px 0 #1d1714}
.tabs .tm{position:absolute;top:-10px;right:6px;font-variant-numeric:tabular-nums;font-size:.8rem;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;font-family:var(--body);font-weight:800}

/* ---------- breathe bubble ---------- */
.bwrap{position:relative;width:min(84vw,340px);aspect-ratio:1;margin:6px auto 4px;display:grid;place-items:center}
.bwrap .guide{position:absolute;inset:0;border-radius:50%;border:3px dashed color-mix(in srgb,var(--bc) 40%,transparent)}
.bwrap .guide.min{inset:30%}
.bubble{width:100%;height:100%;border-radius:50%;transform:scale(.4);will-change:transform;
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 22%),radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--bc) 55%,white),var(--bc));
  box-shadow:0 0 0 10px color-mix(in srgb,var(--bc) 18%,transparent),0 18px 40px color-mix(in srgb,var(--bc) 40%,transparent)}
.bword{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.bword b{font-family:var(--head);font-size:2rem;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.bword span{font-family:var(--head);font-size:1.5rem;color:#fff;opacity:.9;font-variant-numeric:tabular-nums;text-shadow:0 2px 6px rgba(0,0,0,.2)}
.pats{display:grid;gap:8px;margin-bottom:12px}
.pat{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:10px 14px;min-height:62px;box-shadow:0 3px 0 var(--line)}
.pat.on{border-color:var(--bc);background:color-mix(in srgb,var(--bc) 16%,var(--card))}
.pat .pe{font-size:1.6rem}
.pat b{display:block;font-family:var(--head);font-weight:600;font-size:1.08rem}
.pat small{color:var(--ink2);font-weight:700}
.bcount{text-align:center;font-weight:800;color:var(--ink2);min-height:1.5em;margin-bottom:12px}

/* ---------- tiny timer ---------- */
.modes{display:flex;gap:6px;background:var(--paper2);border-radius:16px;padding:4px;margin-bottom:12px}
.modes button{flex:1;min-width:0;padding:4px 2px;min-height:46px;border:none;border-radius:12px;background:none;font-weight:800;font-size:.95rem}
.modes button.on{background:var(--card);box-shadow:var(--shadow)}
.stage{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:4px auto 0}
.stage svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.stage .pet{position:absolute;inset:11%;border-radius:50%;overflow:hidden;background:linear-gradient(180deg,#EAF4F6 0 58%,#CFE6C4 58%)}
.stage.rest .pet{background:linear-gradient(180deg,#2E335E 0 58%,#5F7C5E 58%)}
.pet svg{width:100%;height:100%;display:block}
.time{font-family:var(--head);font-weight:700;font-size:3.6rem;text-align:center;font-variant-numeric:tabular-nums;margin-top:6px;line-height:1}
.tlabel{text-align:center;font-weight:800;color:var(--ink2);margin:6px 0 14px}
.cyc{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.cyc i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.cyc i.on{background:var(--accent)}
.grow{height:14px;background:var(--paper2);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.grow i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),#9CCB7E);border-radius:999px}
.friends{display:flex;flex-wrap:wrap;gap:8px}
.friend{width:72px;text-align:center;font-size:.8rem;font-weight:800}
.friend svg{width:72px;height:72px;background:#EAF4E3;border-radius:18px}
.animal-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.animal-pick button{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:6px;font-weight:800}
.animal-pick button.on{border-color:var(--accent);background:#FBE3DA}
.animal-pick svg{width:100%;height:auto}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.3rem;font-weight:800}
.stepper b{min-width:56px;text-align:center;font-family:var(--head);font-size:1.2rem}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}}
@keyframes twinkle{50%{opacity:.3}}
.pet .bob{animation:bob 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.pet .breathe{animation:breathe 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.pet .z{animation:zz 2.4s ease-in infinite;font-family:var(--head);font-weight:700;fill:#fff}
.pet .z2{animation-delay:1.2s}
.pet .star{animation:twinkle 2s infinite}
@media (prefers-reduced-motion:reduce){.pet .bob,.pet .breathe,.pet .z{animation:none}}

/* ---------- review (cards from a document) ---------- */
.ritem{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px;opacity:.55}
.ritem.on{opacity:1;border-color:#9CC5AE}
.rcheck{width:44px;height:44px;flex:none;border-radius:14px;border:3px solid var(--line);background:#fff;font-size:1.3rem;font-weight:800;color:#fff}
.ritem.on .rcheck{background:var(--sage);border-color:var(--sage)}
.rbody{flex:1;min-width:0;display:grid;gap:6px}
.rtag{justify-self:start;font-size:.8rem;font-weight:800;border-radius:999px;padding:2px 10px;background:#E8F0FA;color:#2E4E73}
.rtag.blank{background:#F6E2B3;color:#6B4C10}
.rfield{width:100%;border:2px solid transparent;border-radius:12px;background:var(--paper);padding:8px 10px;font-size:1rem;resize:none;min-height:44px;overflow:hidden;line-height:1.4}
.rfield.f{font-weight:800}
.rfield:focus{border-color:var(--accent);outline:none;background:#fff}
.rbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(var(--sb) + 12px);background:linear-gradient(180deg,rgba(251,245,234,0),var(--paper) 35%);display:flex;justify-content:center}
.rbar .btn{max-width:528px}
.btn.doc{background:linear-gradient(135deg,#D96C4E,#E8946B);margin-bottom:10px}

/* ---------- toast + confetti ---------- */
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:16px;font-weight:800;z-index:80;max-width:90vw;text-align:center;animation:fade .2s;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.celebrate{text-align:center;padding:10px 0}
.celebrate .big{font-size:4rem}
.celebrate h2{font-size:1.6rem;margin:6px 0}
.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
.adbox{text-align:center;padding:10px}
.adbox .big{font-size:3.5rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

/* photos live in IndexedDB (bigger than localStorage) */
const Photos = {
  db: undefined, mem: new Map(),
  open(){
    if (this.db !== undefined) return Promise.resolve(this.db);
    return new Promise(res => {
      try{
        const r = indexedDB.open('flashdeck-photos', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('p');
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => { this.db = null; res(null); };
      }catch(e){ this.db = null; res(null); }
    });
  },
  async put(id, data){
    this.mem.set(id, data);
    const db = await this.open(); if (!db) return;
    await new Promise(res => { try{ const tx = db.transaction('p','readwrite'); tx.objectStore('p').put(data, id); tx.oncomplete = tx.onerror = tx.onabort = () => res(); }catch(e){ res(); } });
  },
  async get(id){
    if (!id) return null;
    if (this.mem.has(id)) return this.mem.get(id);
    const db = await this.open(); if (!db) return null;
    return new Promise(res => { try{ const r = db.transaction('p').objectStore('p').get(id); r.onsuccess = () => { if (r.result) this.mem.set(id, r.result); res(r.result || null); }; r.onerror = () => res(null); }catch(e){ res(null); } });
  },
  async del(id){
    if (!id) return; this.mem.delete(id);
    const db = await this.open(); if (!db) return;
    await new Promise(res => { try{ const tx = db.transaction('p','readwrite'); tx.objectStore('p').delete(id); tx.oncomplete = tx.onerror = () => res(); }catch(e){ res(); } });
  },
  async clear(){
    this.mem.clear(); const db = await this.open(); if (!db) return;
    await new Promise(res => { try{ const tx = db.transaction('p','readwrite'); tx.objectStore('p').clear(); tx.oncomplete = tx.onerror = () => res(); }catch(e){ res(); } });
  }
};

/* =====================================================================
   SMART REVIEW (spaced repetition)
   Each card has: interval (days until next review), ease, due (time).
   Didn't know → comes back in 10 minutes (and later in this session)
   Almost      → back soon (interval grows only a little)
   I knew it   → back later (interval × ease, grows each time)
===================================================================== */
function newCard(front, back, frontImg = null, backImg = null){
  return { id: uid(), front, back, frontImg, backImg, interval: 0, ease: 2.5, due: 0, reps: 0, lapses: 0, created: Date.now() };
}
function gradeCard(card, g, early){
  const now = Date.now();
  card.reps++;
  if (g === 0){ card.lapses++; card.interval = 0; card.ease = Math.max(1.3, card.ease - 0.2); card.due = now + 10 * 60000; return; }
  if (early) return;               // practising before it's due: don't push it further away
  if (g === 1){ card.interval = card.interval < 1 ? 1 : Math.max(1, Math.round(card.interval * 1.2)); card.ease = Math.max(1.3, card.ease - 0.15); }
  else { card.interval = card.interval < 1 ? 1 : Math.max(card.interval + 1, Math.round(card.interval * card.ease)); card.ease = Math.min(3, card.ease + 0.05); }
  card.due = startOfDay() + card.interval * DAY;
}
const isDue = c => c.due <= Date.now();
const isKnown = c => c.interval >= 7;
function dueCount(deck){ return deck.cards.filter(isDue).length; }

/* activity log → streak + chart */
function logActivity(deck, n = 1){
  const k = dayKey();
  state.days[k] = (state.days[k] || 0) + n;
  if (deck){ deck.days = deck.days || {}; deck.days[k] = (deck.days[k] || 0) + n;
    const keep = dayKey(new Date(Date.now() - 60 * DAY)); for (const d in deck.days) if (d < keep) delete deck.days[d]; }
  const s = streak(); if (s > state.best) state.best = s;
}
function streak(){
  let n = 0; const d = new Date();
  if (!state.days[dayKey(d)]) d.setDate(d.getDate() - 1);   // today not done yet: count from yesterday
  while (state.days[dayKey(d)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

function chartPanel(d){
  const days = []; const now = new Date();
  for (let i = 13; i >= 0; i--){ const x = new Date(now); x.setDate(x.getDate() - i); days.push(x); }
  const vals = days.map(x => (d.days || {})[dayKey(x)] || 0);
  const max = Math.max(5, ...vals);
  const W = 280, H = 96, bw = 14, gap = (W - 14 * bw) / 13;
  const letters = state.lang === 'fr' ? ['D','L','M','M','J','V','S'] : ['S','M','T','W','T','F','S'];
  let bars = '';
  days.forEach((x, i) => {
    const v = vals[i], bh = v ? Math.max(6, (v / max) * 70) : 3, xx = i * (bw + gap);
    bars += '<rect x="' + xx.toFixed(1) + '" y="' + (76 - bh).toFixed(1) + '" width="' + bw + '" height="' + bh.toFixed(1) + '" rx="5" fill="' + (v ? d.color : '#E7DAC6') + '"><title>' + v + '</title></rect>' +
      (v ? '<text x="' + (xx + bw / 2).toFixed(1) + '" y="' + (72 - bh).toFixed(1) + '" font-size="9" text-anchor="middle" fill="#7A6A5F" font-weight="800">' + v + '</text>' : '') +
      '<text x="' + (xx + bw / 2).toFixed(1) + '" y="92" font-size="10" text-anchor="middle" fill="' + (i === 13 ? '#3B2F2A' : '#9C8C80') + '" font-weight="800">' + letters[x.getDay()] + '</text>';
  });
  const n = d.cards.length, kn = d.cards.filter(isKnown).length, nw = d.cards.filter(c => !c.reps).length, lr = n - kn - nw;
  const pct = v => (n ? (v / n * 100) : 0) + '%';
  return '<div class="panel chart"><h2>📈 ' + t('progress') + '</h2><div class="muted" style="font-weight:700;font-size:.9rem;margin-bottom:6px">' + t('last14') + '</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('last14')) + '">' + bars + '</svg>' +
    '<div class="mbar" aria-hidden="true"><i style="width:' + pct(kn) + ';background:var(--sage)"></i><i style="width:' + pct(lr) + ';background:var(--butter)"></i><i style="width:' + pct(nw) + ';background:#D9CDBD"></i></div>' +
    '<div class="legend"><span><i style="background:var(--sage)"></i>' + t('known') + ' ' + kn + '</span><span><i style="background:var(--butter)"></i>' + t('learning') + ' ' + lr + '</span><span><i style="background:#D9CDBD"></i>' + t('newC') + ' ' + nw + '</span></div></div>';
}

      });

  }
  const list = due.length && !force ? due : shuffle(deck.cards.slice());
  const ids = Array.isArray(force) ? force : null;
  const pick = ids ? deck.cards.filter(c => ids.includes(c.id)) : list;
  S = { deckId: deck.id, queue: pick.map(c => ({ id: c.id, early: !isDue(c), tries: 0 })), pos: 0, flipped: false, total: pick.length, res: { 0: 0, 1: 0, 2: 0 }, missed: [] };

    face('front', c.front, c.frontImg, t('front'), d.frontLang) + face('back', c.back, c.backImg, t('backSide'), d.backLang) + '</div></div>' +

function afterStudyRender(){
  if (state.autoRead && !S.flipped) setTimeout(() => sayCurrent('front'), 250);
}
function currentStudyCard(){ const d = getDeck(S.deckId); return d && d.cards.find(x => x.id === S.queue[S.pos].id); }
function flipCard(){
  if (!S) return;
  S.flipped = !S.flipped;
  $('#flip').classList.toggle('flipped', S.flipped);
  $('#grades').classList.toggle('hidden', !S.flipped);
  $('#hint').textContent = S.flipped ? t('howWell') : t('tapFlip');
  if (state.autoRead) sayCurrent(S.flipped ? 'back' : 'front');
}
function sayCurrent(side){
  const d = getDeck(S.deckId), c = currentStudyCard(); if (!c) return;
  speak(side === 'back' ? c.back : c.front, side === 'back' ? d.backLang : d.frontLang);
}
function gradeCurrent(g){
  const d = getDeck(S.deckId), item = S.queue[S.pos], c = currentStudyCard();
  if (c){
    gradeCard(c, g, item.early);
    if (item.tries === 0){ S.res[g]++; if (g === 0) S.missed.push(c.id); }
    if (g === 0 && item.tries < 2){ S.queue.splice(Math.min(S.queue.length, S.pos + 4), 0, { id: c.id, early: false, tries: item.tries + 1 }); }
    logActivity(d, 1); save();
  }
  S.pos++; S.flipped = false; stopSpeak();
  if (S.pos >= S.queue.length){ nav = { screen: 'done' }; render(); chime(true); return; }
  render();
}

/* ---------- PASTE A LIST (import text) ---------- */
function parseLines(txt){
  const cards = []; let skipped = 0;
  for (const raw of txt.split(/\r?\n/)){
    const line = raw.trim(); if (!line) continue;
    const m = line.match(/^(.*?)\s+[-–—]\s+(.*)$/) || line.match(/^(.*?)\s*[-–—]\s*(.*)$/);
    if (!m || !m[1].trim() || !m[2].trim()){ skipped++; continue; }
    cards.push({ front: m[1].trim(), back: m[2].trim() });
  }
  return { cards, skipped };
}
function pasteSheet(deck){
  openSheet('<h2>📋 ' + t('pasteTitle') + '</h2><p class="muted" style="margin-top:-6px">' + t('pasteHelp') + '</p>' +
    '<label class="sr" for="pt">' + t('pasteTitle') + '</label><textarea id="pt" class="field" style="min-height:180px" placeholder="' + esc(t('pasteEx')) + '" autofocus></textarea>' +
    '<p id="pc" class="muted" style="font-weight:800;margin:8px 2px 0"></p><div class="actions"><button class="btn" id="go" disabled>' + t('addCards', { n: 0 }) + '</button></div>', sh => {
      const ta = sh.querySelector('#pt'), pc = sh.querySelector('#pc'), go_ = sh.querySelector('#go');
      const upd = () => { const r = parseLines(ta.value); pc.textContent = (r.cards.length ? t('found', { n: r.cards.length }) : '') + (r.skipped ? ' · ' + t('skipped', { n: r.skipped }) : ''); go_.disabled = !r.cards.length; go_.textContent = t('addCards', { n: r.cards.length }); };
      ta.oninput = upd;
      go_.onclick = () => { const r = parseLines(ta.value); r.cards.forEach(c => deck.cards.push(newCard(c.front, c.back))); save(); closeSheet(); render(); toast(t('added', { n: r.cards.length })); };
    });
}

function shareSheet(deck){
  openSheet('<h2>📤 ' + t('shareHow', { name: esc(deck.name) }) + '</h2><div class="actions">' +
    '<button class="btn" id="f">📁 ' + t('sendFile') + '</button><p class="muted" style="margin:-4px 4px 4px;font-weight:700">' + t('sendFileP') + '</p>' +

async function exportDeck(deck){
  const cards = [];
  for (const c of deck.cards) cards.push({ front: c.front, back: c.back, frontImg: c.frontImg ? await Photos.get(c.frontImg) : null, backImg: c.backImg ? await Photos.get(c.backImg) : null });
  const json = JSON.stringify({ app: 'flashdeck', version: 1, deck: { name: deck.name, emoji: deck.emoji, color: deck.color, frontLang: deck.frontLang, backLang: deck.backLang, cards } });
  const fname = (deck.name.replace(/[^\p{L}\p{N} _-]/gu, '').trim().replace(/\s+/g, '-') || 'deck') + '.flashdeck.json';
  const FS = Plug('Filesystem'), SH = Plug('Share');

}
function importFile(){
  const inp = document.createElement('input'); inp.type = 'file';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const r = new FileReader();

      if (data && data.app === 'flashdeck' && data.deck && Array.isArray(data.deck.cards)){

        const deck = { id: uid(), name: String(src.name || 'Deck').slice(0, 40), emoji: String(src.emoji || '📚').slice(0, 8), color: COLORS.includes(src.color) ? src.color : COLORS[0],
          frontLang: VOICES.some(v => v[0] === src.frontLang) ? src.frontLang : defVoice(), backLang: VOICES.some(v => v[0] === src.backLang) ? src.backLang : defVoice(), cards: [], days: {}, created: Date.now() };
        for (const c of src.cards.slice(0, 5000)){
          let fi = null, bi = null;
          if (typeof c.frontImg === 'string' && c.frontImg.startsWith('data:image/')){ fi = uid(); await Photos.put(fi, c.frontImg); }
          if (typeof c.backImg === 'string' && c.backImg.startsWith('data:image/')){ bi = uid(); await Photos.put(bi, c.backImg); }
          const fr = String(c.front || '').slice(0, 400), bk = String(c.back || '').slice(0, 600);

        }
        state.decks.push(deck); save(); toast(t('importOk', { name: deck.name })); go('deck', { deckId: deck.id });
        return;
      }
      const p = parseLines(txt);           // a plain text list works too
      if (p.cards.length){
        const deck = { id: uid(), name: f.name.replace(/\.(flashdeck\.)?(json|txt|csv)$/i, '').slice(0, 40) || 'Deck', emoji: '📚', color: COLORS[state.decks.length % COLORS.length], frontLang: defVoice(), backLang: defVoice(), cards: p.cards.map(c => newCard(c.front, c.back)), days: {}, created: Date.now() };

function pickDocFile(){
  const inp = document.createElement('input'); inp.type = 'file';
  inp.accept = '.pdf,.docx,.txt,.md,.csv,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const name = f.name.toLowerCase();
    DOC.name = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40); DOC.name = DOC.name.charAt(0).toUpperCase() + DOC.name.slice(1);
    try{
      progress(t('docReading'), 0.05);
      let res;
      if (name.endsWith('.pdf') || f.type === 'application/pdf') res = await readPdf(await f.arrayBuffer());
      else if (name.endsWith('.docx')) res = await readDocx(await f.arrayBuffer());
      else if (name.endsWith('.doc')){ progDone(); toast(t('docOld')); return; }
      else res = { text: await f.text(), pairs: [] };
      if (DOC.cancel) return;
      await makeCards(res.text, res.pairs || []);
    }catch(e){ console.warn(e); progDone(); if (!(DOC && DOC.cancel)) toast(e && e.userMsg ? e.userMsg : t('docBad')); }

}

let pdfjsLib = null;
async function loadPdfJs(){
  if (!pdfjsLib){ pdfjsLib = await import('./lib/pdf.min.mjs'); pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('./lib/pdf.worker.min.mjs', location.href).href; }
  return pdfjsLib;
}
async function readPdf(buf){
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
  const n = Math.min(pdf.numPages, DOC_MAX_PAGES), out = [];
  let scanned = 0;
  for (let p = 1; p <= n; p++){
    if (DOC.cancel) return { text: '' };
    progress(t('docReadingPage', { a: p, b: n }), p / n * 0.6);
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    let txt = pdfLines(tc.items);
    if (txt.replace(/\s/g, '').length < 25){            // probably a scan → read it like a photo
      if (canOcr()){
        const vp = page.getViewport({ scale: 2 });
        const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        try{ txt = await ocr(c.toDataURL('image/jpeg', 0.85)); }catch(e){ txt = ''; }
      } else scanned++;
    }
    out.push(txt);
    if (out.join('\n').length > DOC_MAX_CHARS) break;
  }
  const text = out.join('\n\n');
  if (!text.replace(/\s/g, '').length){ const e = new Error('empty'); e.userMsg = scanned ? t('docScanned') : t('docNoText'); throw e; }
  return { text, pairs: [] };
}
/* pdf.js gives words with positions → rebuild lines and paragraphs */
function pdfLines(items){
  const rows = [];
  for (const it of items){
    if (!it.str) continue;
    const x = it.transform[4], y = it.transform[5], h = Math.abs(it.transform[3]) || it.height || 10;
    let row = rows.find(r => Math.abs(r.y - y) < h * 0.5);
    if (!row){ row = { y, h, parts: [] }; rows.push(row); }
    row.parts.push({ x, s: it.str, w: it.width || 0 });
  }
  rows.sort((a, b) => b.y - a.y);
  let out = '', prev = null;
  for (const r of rows){
    r.parts.sort((a, b) => a.x - b.x);
    let line = '', end = null;
    for (const p of r.parts){ if (end != null && p.x - end > r.h * 0.25 && !line.endsWith(' ') && !p.s.startsWith(' ')) line += ' '; line += p.s; end = p.x + p.w; }
    line = line.replace(/\s+/g, ' ').trim(); if (!line) continue;
    if (prev && prev.y - r.y > Math.max(prev.h, r.h) * 1.9) out += '\n';
    out += line + '\n'; prev = r;
  }
  return out;
}
async function readDocx(buf){
  const zip = await JSZip.loadAsync(buf);
  const f = zip.file('word/document.xml'); if (!f) throw new Error('no document.xml');
  const xml = new DOMParser().parseFromString(await f.async('string'), 'application/xml');
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const body = xml.getElementsByTagNameNS(W, 'body')[0]; if (!body) throw new Error('no body');
  const lines = [], pairs = [];
  const isOn = el => { if (!el) return false; const v = el.getAttributeNS(W, 'val') || el.getAttribute('w:val'); return !(v === '0' || v === 'false' || v === 'none'); };
  const para = p => {
    let text = '', bold = '', boldDone = false;
    for (const r of p.getElementsByTagNameNS(W, 'r')){
      let s = '';
      for (const ch of r.childNodes){ if (ch.localName === 't') s += ch.textContent; else if (ch.localName === 'tab') s += ' '; else if (ch.localName === 'br') s += '\n'; }
      if (!s) continue;
      const rPr = r.getElementsByTagNameNS(W, 'rPr')[0], b = rPr && isOn(rPr.getElementsByTagNameNS(W, 'b')[0]);
      if (!boldDone){ if (b) bold += s; else if (s.trim()) boldDone = true; }
      text += s;
    }
    return { text: text.trim(), bold: bold.trim() };
  };
  for (const node of body.childNodes){
    if (node.localName === 'p'){
      const { text, bold } = para(node); if (!text) { lines.push(''); continue; }
      const isList = node.getElementsByTagNameNS(W, 'numPr').length > 0;
      lines.push(isList ? '• ' + text : text);
      const rest = text.slice(bold.length).replace(/^[\s:–—\-=]+/, '').trim();
      const term = bold.replace(/[\s:–—\-=]+$/, '').trim();
      if (term && term.length <= 60 && rest.split(/\s+/).length >= 3 && termOk(term) && defOk(rest)) pairs.push({ front: term, back: rest.charAt(0).toUpperCase() + rest.slice(1), kind: 'term' });
    } else if (node.localName === 'tbl'){
      for (const tr of node.getElementsByTagNameNS(W, 'tr')){
        const cells = Array.from(tr.getElementsByTagNameNS(W, 'tc')).map(tc => Array.from(tc.getElementsByTagNameNS(W, 'p')).map(p => para(p).text).filter(Boolean).join(' ').trim());
        lines.push(cells.filter(Boolean).join(' : '));
        if (cells.length === 2 && cells[0] && cells[1] && cells[0].length <= 60 && termOk(cells[0]) && defOk(cells[1])) pairs.push({ front: cells[0], back: cells[1], kind: 'term' });
      }
      lines.push('');
    }
  }
  const text = lines.join('\n');
  if (!text.replace(/\s/g, '').length){ const e = new Error('empty'); e.userMsg = t('docNoText'); throw e; }
  return { text, pairs };
}

const STOP = new Set(('a an the and or but if of to in on at by for with from as is are was were be been being this that these those it its into than then there their they them we you your our i he she his her not no yes can will would should could may might must do does did done have has had so such also more most very just about over under between after before during while which who whom whose what when where why how all any each other some many much few own same only both either neither one two three ' +
  'le la les l un une des du de d et ou mais si à au aux en dans par pour sur sous avec sans ce cet cette ces c est sont était être été qui que qu quoi dont où il elle ils elles on nous vous je tu son sa ses leur leurs notre nos votre vos mon ma mes ne pas plus moins très tout tous toute toutes aussi comme donc car ni se s y lors entre après avant pendant chaque autre autres même cela ça peut doit faire fait avoir a ont été').split(/\s+/));
const ADMIN = /^(courriel|e-?mail|t[ée]l[ée]?phone|t[ée]l\.?|phone|cell|bureau|office|local|room|salle|disponibilit|heures?|hours?|horaire|schedule|professeure?s?|enseignante?s?|teacher|instructor|coordonn|contact|session|trimestre|semester|term\b|groupe?s?|section|page|date|pond[ée]ration|weight|note|grade|total|cours|course|code|d[ée]partement|department|programme|program|site|web|url|lms|moodle|omnivox|l[ée]a\b|teams|zoom|pr[ée]alables?|prerequisites?|cr[ée]dits?|credits?|unit[ée]s?|semaine|week|examens?|exam|travail|travaux|assignment|remise|due|retard|late|plagiat|plagiarism|absences?|pr[ée]sences?|attendance|comp[ée]tences?|objectifs?|[ée]l[ée]ments?|crit[èe]res?|manuels?|textbook|mat[ée]riel|volumes?|auteurs?|isbn|[ée]dition|lieu|campus|c[ée]gep|coll[èe]ge|nom|name|signature|version|automne|hiver|[ée]t[ée]|fall|winter|summer|copyright|tous droits|politiques?|policy|policies|r[èe]gles?|rules?|grading|[ée]valuations?|calendrier|calendar|bibliographie|references?|r[ée]f[ée]rences|pr[ée]sentation|introduction|notions? cl[ée]s|key terms)/i;
const CODEISH = /\b[\dA-Z]{2,}-[\dA-Z]{2,}\b|\b(19|20)\d\d\b/;
const COURSE = /^(ce|le|cette|this|the|in this|dans ce)\s+(cours|course|session|semester|class)\b/i;
const MESSY = /@|https?:|www\.|\.com\b|\.ca\b|^\d[\d\s.,:/h-]*$/i;
function termOk(s){ const w = s.trim().split(/\s+/); return w.length >= 1 && w.length <= 7 && s.length >= 2 && s.length <= 60 && !ADMIN.test(s.trim()) && !MESSY.test(s) && !CODEISH.test(s) && /\p{L}/u.test(s) && (s.replace(/[^\d]/g, '').length / s.length) < 0.3; }
function defOk(s){ s = s.trim(); const w = s.split(/\s+/); return w.length >= 2 && !/^(notes?\s+de\s+cours|plan\s+de\s+cours|course\s+notes|lecture\s+notes|class\s+notes|syllabus|r[ée]sum[ée]|summary|chapitre|chapter|module|unit[ée]?)\b/i.test(s) && !/^(automne|hiver|[ée]t[ée]|printemps|fall|winter|summer|spring)\b/i.test(s) && !/\d\s*%/.test(s) && s.length <= 320 && !MESSY.test(s) && /\p{L}{3}/u.test(s) && !/^\d+\s*%$/.test(s) && !/^[\d\s%h:.,/-]+$/.test(s); }
function detectLang(text){
  const w = text.toLowerCase().match(/\p{L}+/gu) || [];
  const fr = new Set('le la les des est et une du pour dans que qui pas sur avec sont aux cette ce au'.split(' ')), en = new Set('the and is of to in for that with are this on as be by it an'.split(' '));
  let f = 0, e = 0; for (const x of w.slice(0, 4000)){ if (fr.has(x)) f++; if (en.has(x)) e++; }
  return f > e ? 'fr' : 'en';
}
function cleanText(text){
  return text.replace(/\r/g, '').replace(/­/g, '').replace(/([a-zà-ÿ])-\n([a-zà-ÿ])/g, '$1$2')
    .replace(/^[ \t]*[•▪◦●○■□➢►✓✔\-*–—]+[ \t]*/gm, '').replace(/^[ \t]*(?:\d{1,2}|[a-z])[.)][ \t]+/gm, '').replace(/[ \t]+/g, ' ').slice(0, DOC_MAX_CHARS);
}
function sentencesOf(text){
  text = text.split('\n').map(l => { const t = l.trim(); return (t && t.split(/\s+/).length <= 6 && !/[.!?;:,]$/.test(t)) ? '\n' + t + '\n' : l; }).join('\n');
  const paras = text.split(/\n\s*\n/).map(p => p.replace(/\n/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const out = [];
  for (const p of paras) for (const s of p.split(/(?<=[.!?;])\s+(?=[A-ZÀ-ÖØ-Ý«"(])/)) out.push(s.trim());
  return out;
}
function rulesCards(rawText, extra){
  const text = cleanText(rawText), cards = [], seen = new Set(), terms = [], termCards = [];
  const lang = detectLang(rawText), fr = lang === 'fr';
  const add = (front, back, kind) => {
    front = front.replace(/\s+/g, ' ').trim(); back = (kind === 'list' ? back.replace(/[ \t]+/g, ' ') : back.replace(/\s+/g, ' ')).replace(/^[,;:.\s]+/, '').trim();
    const k = front.toLowerCase(); if (!front || !back || seen.has(k) || front.toLowerCase() === back.toLowerCase()) return;
    seen.add(k); cards.push({ front, back: kind === 'term' ? back.charAt(0).toUpperCase() + back.slice(1) : back, kind });
    if (kind === 'term'){ terms.push(front.replace(/^(l'|l’|le |la |les |un |une |the |a |an )/i, '').toLowerCase()); termCards.push(cards[cards.length - 1]); }
  };
  for (const p of extra || []) add(p.front, p.back, 'term');
  const usedSent = new Set();
  // a) "Term : definition" lines
  for (const raw of text.split('\n')){
    const line = raw.trim(); if (line.length < 6) continue;
    const m = line.match(/^([^:=→–—]{2,60}?)\s*(?::|=|→|\s[–—-]\s)\s*(.{6,320})$/);
    if (m && termOk(m[1]) && defOk(m[2]) && !/^(semaine|week|cours|class|session)\s*\d/i.test(m[1])){ add(m[1], m[2], 'term'); usedSent.add(line); }
  }
  // b) "X is a … / X est un …" sentences
  const sents = sentencesOf(text);
  const VERB = /^(.{2,50}?)\s+(?:(?:est|sont|is|are)\s+(?=(?:un|une|le|la|l['’]|les|des|a|an|the)\b)|d[ée]signe(?:nt)?\s+|signifie(?:nt)?\s+|correspond(?:ent)?\s+à\s+|se\s+d[ée]fini(?:t|ssent)\s+comme\s+|consiste(?:nt)?\s+(?:à|en)\s+|means\s+|refers?\s+to\s+|is\s+defined\s+as\s+|consists?\s+of\s+)(.{8,260})$/i;
  const PRON = /^(il|elle|ils|elles|ce|cet|cette|ces|cela|ça|c['’]|on|nous|vous|je|tu|it|this|that|these|those|they|we|you|i|he|she|there|ici|here|le cours|ce cours|the course|this course|votre|your|notre|our)\b/i;
  const FRDEF = [/^on\s+(?:appelle|nomme)\s+(.{2,50}?)\s+(?:le|la|les|l['’]|un|une|des)?\s*(.{8,240})$/i, /^(.{2,50}?),\s*c['’]est\s+(.{8,240})$/i];
  for (const s of sents){
    const m = s.match(VERB);
    for (const re of FRDEF){ const f = s.match(re); if (f && !PRON.test(f[1]) && termOk(f[1]) && defOk(f[2])){ add(f[1], f[2].replace(/[.;]+$/, ''), 'term'); usedSent.add(s); } }
    if (m && !PRON.test(m[1]) && termOk(m[1]) && m[1].split(/\s+/).length <= 5 && defOk(m[2])){ add(m[1], m[2].replace(/[.;]+$/, ''), 'term'); usedSent.add(s); }
  }
  // b2) questions: "X sert à …" → "À quoi sert X ?" / "X is used to …" → "What is X used for?"
  const lcFirst = x => /^\p{Lu}{2,}/u.test(x) ? x : x.charAt(0).toLowerCase() + x.slice(1);
  const capF = x => x.charAt(0).toUpperCase() + x.slice(1);
  const aux = x => { const w = x.trim().split(/\s+/).pop(); return /[^s]s$/i.test(w) && !/^(the|a|an)$/i.test(x) && x.trim().split(/\s+/).length > 0 && !/(is|us|ss)$/i.test(w) ? 'do' : 'does'; };
  const QA = fr ? [
    [/^(.{2,50}?)\s+(?:permet(?:tent)?\s+de|sert\s+à|servent\s+à)\s+(.{5,220})$/i, m => ['À quoi sert ' + lcFirst(m[1]) + ' ?', m[2]]],
    [/^(.{2,50}?)\s+(?:est|sont)\s+caus[ée]e?s?\s+par\s+(.{4,220})$/i, m => ['Qu’est-ce qui cause ' + lcFirst(m[1]) + ' ?', m[2]]],
    [/^(.{2,50}?)\s+(?:se\s+compose(?:nt)?|est\s+form[ée]e?|sont\s+form[ée]e?s)\s+(?:de|d['’])\s*(.{4,220})$/i, m => ['De quoi est formé ' + lcFirst(m[1]) + ' ?', m[2]]],
    [/^(.{2,50}?)\s+(produi(?:t|sent)|contien(?:t|nent)|transporte(?:nt)?|contr[ôo]le(?:nt)?|prot[èe]ge(?:nt)?|fabrique(?:nt)?|stocke(?:nt)?|regroupe(?:nt)?|re[çc]oi(?:t|vent)|lib[èe]re(?:nt)?)\s+(.{4,220})$/i, m => ['Que ' + m[2].toLowerCase() + ' ' + lcFirst(m[1]) + ' ?', m[3]]]
  ] : [
    [/^(.{2,50}?)\s+(?:is|are)\s+used\s+(?:to|for)\s+(.{5,220})$/i, m => ['What is ' + lcFirst(m[1]) + ' used for?', m[2]]],
    [/^(.{2,50}?)\s+(?:is|are)\s+caused\s+by\s+(.{4,220})$/i, m => ['What causes ' + lcFirst(m[1]) + '?', m[2]]],
    [/^(.{2,50}?)\s+(allows?|helps?|lets?|enables?)\s+(.{5,220})$/i, m => ['What ' + aux(m[1]) + ' ' + lcFirst(m[1]) + ' do?', m[2] + ' ' + m[3]]],
    [/^(.{2,50}?)\s+(produces?|contains?|carry|carries|transports?|controls?|stores?|protects?|releases?|receives?|makes?)\s+(.{4,220})$/i,
      m => ['What ' + aux(m[1]) + ' ' + lcFirst(m[1]) + ' ' + m[2].toLowerCase().replace(/ies$/, 'y').replace(/(?<=[^s])es$/, 'e').replace(/(?<=[^s])s$/, '') + '?', m[3]]]
  ];
  for (const s of sents){
    if (usedSent.has(s) || COURSE.test(s)) continue;
    const clean = s.replace(/[.;!]+$/, '');
    for (const [re, fn] of QA){
      const m = clean.match(re);
      if (m && !PRON.test(m[1]) && termOk(m[1]) && m[1].split(/\s+/).length <= 6 && defOk(m[m.length - 1])){
        const [q, a] = fn(m); add(q, capF(a), 'qa'); usedSent.add(s); break;
      }
    }
  }
  // b3) lists: a short heading followed by 2–8 bullet points
  const BUL = /^\s*(?:[•▪◦●○■□➢►✓✔*–—-]|\d{1,2}[.)]|[a-z][.)])\s+(.+)$/;
  const rl = rawText.replace(/\r/g, '').split('\n');
  for (let i = 0; i < rl.length; i++){
    const head = rl[i].trim(); if (!head || BUL.test(head)) continue;
    const hw = head.split(/\s+/).length;
    if (hw > 10 || head.length > 80 || /[.!?]$/.test(head) || ADMIN.test(head) || MESSY.test(head) || CODEISH.test(head)) continue;
    const items = []; let j = i + 1, gaps = 0;
    while (j < rl.length){
      const ln = rl[j].trim();
      if (!ln){ if (++gaps > 1) break; j++; continue; }
      const m = ln.match(BUL); if (!m) break;
      items.push(m[1].trim()); j++;
    }
    if (items.length >= 2 && items.length <= 8 && items.every(x => x.split(/\s+/).length <= 18 && !MESSY.test(x) && !/\d\s*%/.test(x))){
      const h2 = head.replace(/\s*:$/, '');
      add(h2 + (fr ? ' — nomme les ' : ' — name the ') + items.length + (fr ? ' éléments' : ' items'), items.map(x => '• ' + x).join('\n'), 'list');
      i = j - 1;
    }
  }
  // b4) true or false (built from the definitions found above)
  if (termCards.length >= 3){
    const pool = termCards.slice(0, 8);
    pool.forEach((c, k) => {
      if (k >= 4) return;
      const def = c.back.replace(/[.;]+$/, '');
      if (k % 2 === 0) add((fr ? 'Vrai ou faux ? ' : 'True or false? ') + c.front + ' : ' + lcFirst(def), fr ? 'Vrai ✓' : 'True ✓', 'tf');
      else {
        const other = pool[(k + 1) % pool.length]; if (other === c) return;
        add((fr ? 'Vrai ou faux ? ' : 'True or false? ') + c.front + ' : ' + lcFirst(other.back.replace(/[.;]+$/, '')), (fr ? 'Faux ✗ — ' : 'False ✗ — ') + c.front + ' : ' + lcFirst(def), 'tf');
      }
    });
  }
  // b5) numbers and dates
  let nums = 0;
  for (const s of sents){
    if (nums >= 8) break;
    const w = s.split(/\s+/);
    if (w.length < 8 || w.length > 32 || usedSent.has(s) || MESSY.test(s) || ADMIN.test(s) || COURSE.test(s) || CODEISH.test(s.replace(/\b(1[0-9]{3}|20\d\d)\b/g, '')) || /\d\s*%|[:=]/.test(s)) continue;
    const found = s.match(/(?<![\p{L}\d-])\d+(?:[.,]\d+)?(?![\p{L}\d-])/gu);
    if (!found || found.length !== 1 || s.trim().startsWith(found[0])) continue;
    add(s.replace(found[0], '____'), found[0], 'num'); usedSent.add(s); nums++;
  }
  // c) fill-in-the-blank from important sentences
  const freq = new Map();
  for (const w of (text.match(/\p{L}[\p{L}'’-]{4,}/gu) || [])){ const k = w.toLowerCase(); if (!STOP.has(k)) freq.set(k, (freq.get(k) || 0) + 1); }
  const pool = [];
  sents.forEach((s, i) => {
    const words = s.split(/\s+/);
    if (words.length < 8 || words.length > 34 || usedSent.has(s) || MESSY.test(s) || ADMIN.test(s) || COURSE.test(s) || (PRON.test(s) && words.length < 10)) return;
    if (/\s[:–—=]\s|\s:|%/.test(s) || (s.replace(/[^\d]/g, '').length / s.length) > 0.06) return;
    if (/^[\p{Lu}\s\d\W]+$/u.test(s)) return;                               // ALL CAPS title
    let best = null, score = 0;
    for (const term of terms){ if (term.length > 2 && s.toLowerCase().includes(term)){ const sc = 10 + term.length; if (sc > score){ score = sc; best = term; } } }
    if (!best){
      words.forEach((w, j) => {
        const clean = w.replace(/^[^\p{L}]+|[^\p{L}'’-]+$/gu, ''), k = clean.toLowerCase();
        if (clean.length < 6 || STOP.has(k)) return;
        const f = freq.get(k) || 1, cap = j > 0 && /^\p{Lu}/u.test(clean) ? 2 : 0;
        const sc = Math.min(f, 6) + clean.length / 4 + cap;
        if (sc > score && f >= 2){ score = sc; best = clean; }
      });
    }
    if (best && score >= 4) pool.push({ i, s, best, score });
  });
  pool.sort((a, b) => b.score - a.score);
  const pick = pool.slice(0, 25).sort((a, b) => a.i - b.i);
  const usedAns = new Set();
  for (const p of pick){
    if (usedAns.has(p.best.toLowerCase())) continue; usedAns.add(p.best.toLowerCase());
    const re = new RegExp('(^|[^\\p{L}])(' + p.best.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?=[^\\p{L}]|$)', 'iu');
    const m = p.s.match(re); if (!m) continue;
    const answer = m[2];
    add(p.s.replace(re, '$1_____'), answer, 'blank');
  }
  const ORDER = { term: 0, qa: 1, list: 2, tf: 3, blank: 4, num: 5 };
  return cards.map((c, i) => [c, i]).sort((a, b) => (ORDER[a[0].kind] - ORDER[b[0].kind]) || a[1] - b[1]).map(x => x[0]).slice(0, 100);
}

const AI = () => window.__fakeAI || Plug('GenAiPrompt');
async function aiStatus(){ const G = AI(); if (!G) return 'NONE'; try{ return (await G.checkFeatureStatus()).featureStatus || 'NONE'; }catch(e){ return 'NONE'; } }

async function aiDownload(){

  try{
    progress(t('aiDling', { mb: 0 }), 0.02);

function aiChunks(text){
  const paras = text.split(/\n\s*\n/), out = []; let cur = '';
  for (const p of paras){
    if ((cur + '\n\n' + p).length > AI_CHUNK && cur){ out.push(cur); cur = ''; }
    cur += (cur ? '\n\n' : '') + p;
    while (cur.length > AI_CHUNK * 1.5){ out.push(cur.slice(0, AI_CHUNK)); cur = cur.slice(AI_CHUNK); }
  }
  if (cur.trim()) out.push(cur);
  return out.filter(c => c.replace(/\s/g, '').length > 80).slice(0, AI_MAX_CHUNKS);
}
const AI_PROMPT = chunk => 'You are a study helper. Read the course text below and write flashcards.\n' +
  'Rules:\n- Write 5 cards: 2 term cards, 1 question card, 1 true-or-false card and 1 fill-in-the-blank card.\n' +
  '- Question card: Q is a clear question that ends with ?. A is the short answer.\n' +
  '- True-or-false card: Q starts with "True or false?" then a statement from the text. A is "True" or "False — " and the correct fact.\n' +
  '- Term card: Q is a key term or a short question. A is a short answer taken from the text (20 words or less).\n' +
  '- Fill-in-the-blank card: Q is one important sentence from the text with one key word replaced by ____. A is that word.\n' +
  '- Use only facts from the text. Skip teacher names, emails, phone numbers, rooms, schedules, dates and grading.\n' +
  '- Output only lines in this exact format, nothing else:\nQ: ... | A: ...\n\nText:\n"""\n' + chunk + '\n"""';
function parseAI(out){
  const cards = [];
  const lines = String(out || '').replace(/\*\*/g, '').split('\n').map(l => l.trim()).filter(Boolean);
  for (let i = 0; i < lines.length; i++){
    let m = lines[i].match(/^(?:[-•*]|\d+[.)])?\s*Q\s*[:：]\s*(.+?)\s*\|\s*A\s*[:：]\s*(.+)$/i);
    if (!m && /^(?:[-•*]|\d+[.)])?\s*Q\s*[:：]/i.test(lines[i]) && lines[i + 1] && /^A\s*[:：]/i.test(lines[i + 1])){
      m = [null, lines[i].replace(/^(?:[-•*]|\d+[.)])?\s*Q\s*[:：]\s*/i, ''), lines[i + 1].replace(/^A\s*[:：]\s*/i, '')]; i++;
    }
    if (!m) continue;
    let front = m[1].trim(), back = m[2].trim().replace(/^["“]|["”]$/g, '');
    if (front.length < 2 || front.length > 260 || back.length < 1 || back.length > 220) continue;
    const blank = /_{2,}/.test(front);
    if (blank) front = front.replace(/_{2,}/g, '_____');
    const kind = /^(true or false|vrai ou faux)/i.test(front) ? 'tf' : blank ? 'blank' : /\?\s*$/.test(front) ? 'qa' : 'term';
    if (kind === 'tf'){ if (/^true\b/i.test(back)) back = 'True ✓'; else if (/^false\b/i.test(back)) back = back.replace(/^false\b[\s.,:—-]*/i, 'False ✗ — ').replace(/ — $/, ''); }
    cards.push({ front, back, kind });
  }
  return cards;
}
async function aiCards(text){
  const G = AI(), chunks = aiChunks(cleanText(text)), cards = [];
  for (let i = 0; i < chunks.length; i++){
    if (DOC.cancel) return null;
    progress(t('aiMaking', { a: i + 1, b: chunks.length }), 0.1 + 0.9 * i / chunks.length);
    let got = null;
    for (let tries = 0; tries < 3 && got === null; tries++){
      try{
        const r = await G.generateContent({ prompt: AI_PROMPT(chunks[i]), temperature: 0.2, topK: 16, maxOutputTokens: 256 });
        got = parseAI(r && r.text);
      }catch(e){
        const msg = String(e && e.message || e);
        if (/BUSY|quota|rate/i.test(msg) && !/BATTERY/i.test(msg)) await sleep(1500 * Math.pow(2, tries));
        else break;
      }
    }
    if (got && got.length) cards.push(...got);
    else cards.push(...rulesCards(chunks[i], []).slice(0, 5));   // the AI said nothing useful → rules for this part
  }
  return cards;
}

async function makeCards(text, pairs){
  try{
    if (!text || !text.replace(/\s/g, '').length){ progDone(); toast(t('docNoText')); return; }
    const lang = detectLang(text);
    let status = await aiStatus(), by = 'rules', cards = null, note = '';
    if (status !== 'NONE' && status !== 'UNAVAILABLE' && lang === 'en' && state.ai !== 'no'){
      if (status === 'DOWNLOADABLE' || status === 'DOWNLOADING'){
        progDone();
        if (await aiAskSheet()){ if (await aiDownload()) status = 'AVAILABLE'; }
        else { state.ai = 'no'; save(); }
      }
      if (status === 'AVAILABLE'){ cards = await aiCards(text); if (cards === null) return; by = 'ai'; }
    } else if (lang === 'fr' && (status === 'AVAILABLE' || status === 'DOWNLOADABLE')) note = t('rulesFr');
    if (!cards){ progress(t('rulesMaking'), 0.8); await sleep(150); cards = rulesCards(text, pairs); }
    else {
      const have = new Set(cards.map(c => c.front.toLowerCase()));
      pairs.forEach(p => { if (!have.has(p.front.toLowerCase())) cards.unshift(p); });
      rulesCards(text, []).filter(c => c.kind === 'list' || c.kind === 'num').forEach(c => { if (!have.has(c.front.toLowerCase())) cards.push(c); });
    }
    if (DOC && DOC.cancel) return;
    progDone();
    const seen = new Set();
    cards = cards.filter(c => { const k = c.front.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
    R = { deckId: DOC.deckId, name: DOC.name || '', lang, items: cards.map(c => Object.assign({ on: true }, c)), by, note };
    go('review');
  }catch(e){ console.warn(e); progDone(); toast(t('docBad')); }
}

let adBusy = false;

  if (adBusy) return false; adBusy = true; stopSpeak();
  let ok = false;
  try{ ok = Plug('AdMob') ? await nativeAd() : await demoAd(); }catch(e){ ok = false; }

function nativeAd(){
  const A = Plug('AdMob');
  return new Promise(async res => {
    let earned = false, finished = false; const hs = [];
    const finish = () => { if (finished) return; finished = true; hs.forEach(h => { try{ h.remove(); }catch(e){} }); res(earned); };
    try{
      hs.push(await A.addListener('onRewardedVideoAdReward', () => { earned = true; }));
      hs.push(await A.addListener('onRewardedVideoAdDismissed', () => setTimeout(finish, 250)));
      hs.push(await A.addListener('onRewardedVideoAdFailedToShow', finish));
      hs.push(await A.addListener('onRewardedVideoAdFailedToLoad', finish));
      await A.prepareRewardVideoAd({ adId: MONEY.REWARDED_ID, isTesting: MONEY.TESTING });
      const item = await A.showRewardVideoAd();
      if (item && item.amount !== undefined) earned = true;
      setTimeout(finish, 600);
    }catch(e){ finish(); }
  });
}

function tStart(){
  const T = state.timer;
  if (!T.animal){ pickAnimalSheet(); return; }
  if (T.remaining <= 0) T.remaining = modeLen(T.mode);
  T.running = true; T.endAt = Date.now() + T.remaining * 1000; save(); scheduleTimerNotif(); render(); unlockAudio();
}
function tPause(){ const T = state.timer; T.remaining = tRemaining(); T.running = false; save(); cancelTimerNotif(); render(); }
function tReset(){ const T = state.timer; T.running = false; T.remaining = modeLen(T.mode); save(); cancelTimerNotif(); render(); }
function tSetMode(m){ const T = state.timer; T.mode = m; T.running = false; T.remaining = modeLen(m); save(); cancelTimerNotif(); render(); }
function tFinish(completed){
  const T = state.timer; const wasWork = T.mode === 'work';
  T.running = false; cancelTimerNotif();
  let msg = null, grownUp = false;
  if (wasWork && completed){
    const before = stageOf(T.growth);
    T.growth++; T.total++; T.cycle++;
    const k = dayKey(); T.mins[k] = (T.mins[k] || 0) + T.work;
    const keep = dayKey(new Date(Date.now() - 60 * DAY)); for (const d in T.mins) if (d < keep) delete T.mins[d];
    logActivity(null, 1);
    if (T.growth >= GRADUATE && T.animal){ grownUp = true; }
    else if (stageOf(T.growth) > before && T.animal) msg = t('grew', { name: T.animal.name });
  }
  T.mode = wasWork ? (T.cycle % T.every === 0 ? 'long' : 'short') : 'work';
  T.remaining = modeLen(T.mode); save();
  if (completed){ if (T.sound) chime(wasWork); toast(msg || (wasWork ? t('focusDone') : t('breakDone'))); }
  if (grownUp){
    const a = T.animal; T.friends.push({ type: a.type, name: a.name }); T.animal = null; T.growth = 0; save();
    if (nav.screen !== 'timer'){ nav = { screen: 'timer' }; navStack.length = 0; }
    render();
    openSheet('<div class="celebrate"><svg viewBox="0 0 200 200" style="width:160px" aria-hidden="true">' + animalSVG(a.type, 3, 'work') + '</svg><h2>' + t('grownUp', { name: esc(a.name) }) + '</h2><p class="muted">' + t('grownUpP', { name: esc(a.name) }) + '</p></div><div class="actions"><button class="btn" id="ok">🐣 ' + t('pickAnimal') + '</button></div>', sh => {
      sh.querySelector('#ok').onclick = () => { closeSheet(); pickAnimalSheet(); };
    });
    return;
  }
  render();
}
/* one ticking loop for the whole app — the timer keeps going on other tabs */
setInterval(() => {
  const T = state.timer; if (!T.running) return;
  const rem = tRemaining();
  if (rem <= 0){ tFinish(true); return; }
  const el = $('#tTime'); if (el) el.textContent = fmt(rem);
  const tab = $('#tabTime'); if (tab) tab.textContent = fmt(rem);
  const ring = $('#ringFg'); if (ring){ const C = 2 * Math.PI * 46; ring.setAttribute('stroke-dashoffset', (C * (rem / modeLen(T.mode))).toFixed(2)); }
}, 250);

    '<div class="bword" aria-live="polite"><b id="bWord">' + (B ? '' : '🫧') + '</b><span id="bNum"></span></div></div>' +
    '<p class="bcount" id="bCount">' + (B ? '' : t('bReady')) + '</p>' +
    '<button class="btn" data-act="bToggle" id="bBtn" style="min-height:66px;font-size:1.3rem;background:' + P.color + ';box-shadow:0 4px 0 color-mix(in srgb,' + P.color + ' 70%,black)">' + (B ? '⏹ ' + t('bStop') : '▶ ' + t('bStart')) + '</button>' +
    '<div class="section-title"><h2>' + t('breatheP') + '</h2></div><div class="pats">';
  for (const k of Object.keys(PATTERNS)){
    const p = PATTERNS[k];
    h += '<button class="pat ' + (st.pattern === k ? 'on' : '') + '" style="--bc:' + p.color + '" data-act="bPat" data-p="' + k + '" aria-pressed="' + (st.pattern === k) + '"><span class="pe" aria-hidden="true">' + p.emoji + '</span><span><b>' + t('p_' + k) + '</b><small>' + t('p_' + k + 'D') + '</small></span></button>';
  }
  h += '</div><div class="panel"><div class="set-row"><span class="lab">📳 ' + t('vibrate') + '</span>' + toggleHTML('bVib', st.vibrate, t('vibrate')) + '</div></div></div>';
  return h;
}
function bStart(){
  B = { start: performance.now(), raf: 0, lastStep: -1, breaths: 0 };
  render(); bFrame();
}
function bStop(silent){
  if (!B) return;
  cancelAnimationFrame(B.raf);
  const n = B.breaths; B = null;
  if (n){ state.breathe.total += n; save(); }
  if (!silent){ render(); if (n) toast(t('bDone', { n })); }
}
function bFrame(){
  if (!B) return;
  const P = PATTERNS[state.breathe.pattern] || PATTERNS.calm;
  const cycle = P.steps.reduce((a, s) => a + s[1], 0);
  const el = (performance.now() - B.start) / 1000;
  const inCycle = el % cycle, cycles = Math.floor(el / cycle);
  let acc = 0, idx = 0;
  while (idx < P.steps.length - 1 && inCycle >= acc + P.steps[idx][1]){ acc += P.steps[idx][1]; idx++; }
  const [kind, len] = P.steps[idx], p = (inCycle - acc) / len;
  const ease = x => 0.5 - Math.cos(Math.PI * x) / 2;          // smooth in-out
  const prevKind = idx > 0 ? P.steps[idx - 1][0] : P.steps[P.steps.length - 1][0];
  let s;
  if (kind === 'in') s = B_MIN + (B_MAX - B_MIN) * ease(p);
  else if (kind === 'out') s = B_MAX - (B_MAX - B_MIN) * ease(p);
  else s = prevKind === 'in' ? B_MAX : B_MIN;
  const stepId = cycles * P.steps.length + idx;
  if (stepId !== B.lastStep){
    if (B.lastStep >= 0) buzz();
    B.lastStep = stepId;
    B.breaths = cycles;
    const w = $('#bWord'); if (w) w.textContent = t(kind === 'in' ? 'bIn' : kind === 'out' ? 'bOut' : 'bHold');
    const c = $('#bCount'); if (c) c.textContent = cycles ? (cycles === 1 ? t('breath1') : t('breaths', { n: cycles })) : '';
  }
  const bub = $('#bub'); if (bub) bub.style.transform = 'scale(' + s.toFixed(4) + ')';
  const num = $('#bNum'); if (num) num.textContent = Math.max(1, Math.ceil(len - (inCycle - acc)));
  B.raf = requestAnimationFrame(bFrame);
}
function buzz(){
  if (!state.breathe.vibrate) return;
  const H = Plug('Haptics');
  if (H){ H.impact({ style: 'LIGHT' }).catch(() => {}); return; }
  try{ if (navigator.vibrate) navigator.vibrate(40); }catch(e){}
}

/* soft chime (Web Audio, made in code — no sound files) */
let AC = null;
function unlockAudio(){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); }catch(e){} }
function chime(happy){
  try{
    unlockAudio(); if (!AC) return;
    const notes = happy ? [659, 784, 1047] : [784, 659];
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + i * 0.16;
      o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.18, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.9);
      o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + 1);
    });
  }catch(e){}
}
