let awaySummary=null;
const FEEDER_FULL=80;
function tickWorld(){
  const t=now();
  let el=(t-S.lastTick)/1000;
  if(!isFinite(el)||el<0)el=0;
  if(el>43200)el=43200;
  const wasAway=el>=120;
  S.lastTick=t;
  if(el<=0)return;
  const mins=el/60;
  const dd=diffDef(), td=tankDef(), tl=toolDef();
  const slow=tl.slow;
  const prev=S.clean;
  const bioload=S.fish.reduce((a,f)=>a+(spec(f.sp).size||1)*.055,0);
  const baseDecay=(0.28+bioload)*mins*2*dd.dirtMul*td.dirtMul;
  const toolDecay=baseDecay*slow;
  const plecoCount=S.fish.filter(f=>spec(f.sp).cleanHelp).length;
  const plecoMul=Math.max(.6,1-plecoCount*.08);
  const cleanBoostMul=cleanBoostActive()?Math.max(.05,1-(S.cleanBoost||0)):1;
  S.clean=clamp(S.clean-toolDecay*plecoMul*cleanBoostMul,0,100);
  let autoCoins=0;
  if(slow<1){
    const avoided=baseDecay*(1-slow);
    const rawAuto=(avoided/2.4)*10+(S.autoCleanFrac||0);
    autoCoins=Math.floor(rawAuto);
    S.autoCleanFrac=rawAuto-autoCoins;
    if(autoCoins>0){S.cleans+=Math.round(avoided/2.4);addCoins(autoCoins,false);}
  }
  const hungerHelpCount=S.fish.filter(f=>spec(f.sp).hungerHelp).length;
  const hungerHelpMul=Math.max(.7,1-hungerHelpCount*.06);
  S.fish.forEach(f=>{
    const sp=spec(f.sp);
    f.hunger=bellyMul()===0?100:clamp(f.hunger-0.42*sp.feed*mins*dd.hungerMul*tl.hungerMul*hungerHelpMul*bellyMul(),0,100);
    const neglect=(f.hunger<35?1:0)+(S.clean<35?1:0);
    if(neglect&&loveOf(f)>0)f.love=clamp(loveOf(f)-.14*neglect*mins,0,100);
    if(isFav(f)&&loveOf(f)>0){
      const lonelyFrom=Math.max(favClock(f)+FAV_GRACE,t-el*1000);
      const lonelyMins=Math.max(0,t-lonelyFrom)/60000;
      if(lonelyMins>0)f.love=clamp(loveOf(f)-FAV_LONELY*lonelyMins,0,100);
    }
  });
  const fdDef=feederDef();
  if(fdDef&&S.feederStock>0&&S.feederFoodId&&S.fish.length){
    S.feederAcc=(S.feederAcc||0)+mins;
    let guard=0;
    while(S.feederAcc>=fdDef.interval&&S.feederStock>0&&guard<1000){
      const food=FOODS.find(f=>f.id===S.feederFoodId);
      if(!food)break;
      /* smart hopper: only drops food when the fish actually need it, so full bellies save food */
      if(S.fish.reduce((a,f)=>a+f.hunger,0)/S.fish.length>=FEEDER_FULL){S.feederAcc=Math.min(S.feederAcc,fdDef.interval);break;}
      const per=(food.fill*1.9*(fdDef.fillMul||1))/S.fish.length;
      S.fish.forEach(f=>{f.hunger=clamp(f.hunger+per,0,100);});
      S.feederStock--; S.feederAcc-=fdDef.interval; guard++;
    }
    if(S.feederStock<=0)S.feederAcc=0;
  }
  S.hunger=S.fish.length?S.fish.reduce((a,f)=>a+f.hunger,0)/S.fish.length:0;
  const auraMul=S.fish.reduce((m,f)=>Math.max(m,spec(f.sp).incomeAura||1),1);
  let fishCoins=0, topFish=null, topAmt=0;
  if(S.clean>25){
    const inc=S.fish.reduce((a,f)=>a+(f.hunger>25?fishIncome(f):0),0)*tl.incomeMul*dd.incomeMul*td.incomeMul*auraMul;
    const raw=inc*mins*Math.pow(S.clean/100,1.6)*boostMul()*(wasAway?1+.1*upgLv('away'):1)+(S.coinFrac||0);
    fishCoins=Math.floor(raw);
    S.coinFrac=raw-fishCoins;
    if(fishCoins>0)addCoins(fishCoins,false);
    if(wasAway){
      S.fish.forEach(f=>{
        if(f.hunger<=25)return;
        const amt=fishIncome(f)*tl.incomeMul*dd.incomeMul*td.incomeMul*auraMul*mins*Math.pow(S.clean/100,1.6)*boostMul();
        if(amt>topAmt){topAmt=amt;topFish=f;}
      });
    }
  }
  if(Math.abs(prev-S.clean)>3)seedDirt();
  if(wasAway&&((fishCoins+autoCoins)>0||(S.fish.length&&mins>=10))){
    S.adAway=Math.floor(fishCoins+autoCoins);
    awaySummary={total:fishCoins+autoCoins,fish:fishCoins,clean:autoCoins,mins:mins,why:S.clean<=25?'dirty':'hungry',
      topName:topFish?topFish.name:null,topSp:topFish?spec(topFish.sp).n:null};
  }
}
function addCoins(n,fx,x,y){
  n=Math.floor(n); if(!(n>0))return;
  /* past ~9 quadrillion, tiny amounts would be lost to rounding: keep them in a buffer until they add up */
  const cap=COIN_MAX(); n=Math.min(n,Math.max(0,cap-S.coins-(S.coinBuf||0)));
  if(!(n>0)){S.coins=Math.min(S.coins,cap);S.coinBuf=0;capNotice();return;}
  S.coinBuf=(S.coinBuf||0)+n;
  if(S.coinBuf>=S.coins*4e-16||S.coins+S.coinBuf>=cap){S.coins=Math.min(cap,S.coins+S.coinBuf);S.coinBuf=0;}
  if(S.coins>=cap)capNotice();
  S.totalCoins+=n; S.runCoins=(S.runCoins||0)+n;
  setTimeout(()=>{try{shopAffCheck();}catch(e){}},0);
  if(fx){
    const el=document.createElement('div');
    el.className='fl'; el.textContent='+'+fmt(n)+' 🪙';
    el.style.left=((x==null?W/2:x)*dispZoom)+'px';
    el.style.top=((y==null?H/2:y)*dispZoom)+'px';
    el.style.transform='translateX(-50%)';
    $('floats').appendChild(el);
    setTimeout(()=>el.remove(),1150);
  }
  checkAch(); save();
}

/* =====================================================================
   PLAYER LEVELS — keeper XP, titles, level-up gifts, and level locks.
   Items unlock by level based on their price (see reqLevel). Anything a
   player already owns is never locked.
===================================================================== */
const LV_MAX=80;
function xpForLevel(L){return L>=40?2000:Math.round(15*Math.pow(L,1.5));}  /* levels 41–60 cost a flat 2000 XP each */           // XP to go from L to L+1
function xpTotalTo(L){let t=0;for(let k=1;k<L;k++)t+=xpForLevel(k);return t;} // total XP to reach L
function lvInfoFrom(xp){let L=1,x=xp||0;while(L<LV_MAX&&x>=xpForLevel(L)){x-=xpForLevel(L);L++;}return{L:L,into:x,need:L<LV_MAX?xpForLevel(L):0};}
function lvInfo(){return lvInfoFrom(S?S.pxp:0);}
function playerLevel(){return lvInfo().L;}
/* Each Rebirth doubles every Market price (levels needed stay the same) */
function rebMul(){return Math.pow(2,(S&&S.rebirths)||0);}
const PRICE_CEIL=999e33;/* 999 Dc: nothing ever goes past decillions */
function COIN_MAX(){return Math.min(PRICE_CEIL,1e15*rebMul());}
let _capT=0;function capNotice(){const t=Date.now();if(t-_capT<60000)return;_capT=t;try{toast(T('💰 Max gold reached! Spend it or Rebirth.'),'gold');}catch(e){}}
function clampCoins(){try{if(S&&S.coins>COIN_MAX()){S.coins=COIN_MAX();S.coinBuf=0;}}catch(e){}}
let _priceMul=1;
function applyRebirthPrices(){
  const m=rebMul(); if(m===_priceMul)return; _priceMul=m;
  [SPECIES,TANKS,TOOLS,AUTOFEEDERS,FOODS,DECOS].forEach(L=>L.forEach(x=>{if(x._bp===undefined)x._bp=x.price;x.price=x._bp?Math.min(PRICE_CEIL,Math.round(x._bp*m)):x._bp;}));
}
function reqLevel(price){price=price/_priceMul;if(!(price>150))return 1;return Math.max(1,Math.min(LV_MAX,Math.ceil(1+(Math.log10(price)-2.18)*6)));}
function lvLocked(price){return reqLevel(price)>playerLevel();}
function lockBtn(price){return T('<div class="lockwrap"><span class="lvtag">🔒 Lv ')+reqLevel(price)+'</span><button class="btn" disabled>'+fmt(price)+' 🪙</button></div>';}
const TITLES=[[1,T('Puddle Pal'),'💧'],[3,T('Guppy Keeper'),'🐟'],[6,T('Bubble Buddy'),'🫧'],[10,T('Reef Tender'),'🪸'],[15,T('Tide Keeper'),'🌊'],
  [20,T('Coral Curator'),'🐚'],[25,T('Deep Diver'),'🤿'],[30,T('Abyss Warden'),'🦑'],[35,T('Ocean Master'),'🐋'],[40,T('Legend of the Deep'),'👑'],
  [45,T('Star Swimmer'),'🌠'],[50,T('Comet Rider'),'☄️'],[55,T('Galaxy Keeper'),'🌌'],[60,T('Ruler of the Cosmos'),'✨'],
  [65,T('Golden Swimmer'),'🌅'],[70,T('Halo Keeper'),'😇'],[75,T('Diamond Legend'),'💎'],[80,T('Origin of the Seas'),'🌍']];
function titleFor(L){let t=TITLES[0];TITLES.forEach(x=>{if(L>=x[0])t=x;});return t;}
function lvGift(L){return{coins:Math.round(60*Math.pow(L,1.7)),food:L%5===0?{pellet:4,gourmet:1}:{pellet:3,shrimp:1}};}
function unlocksAt(L){
  const out=[];
  SPECIES.forEach(x=>{if(x.price>0&&reqLevel(x.price)===L)out.push('🐠 '+x.n);});
  TANKS.forEach(x=>{if(x.price>0&&reqLevel(x.price)===L)out.push(x.e+' '+x.n);});
  TOOLS.forEach(x=>{if(x.price>0&&reqLevel(x.price)===L)out.push(x.e+' '+x.n);});
  AUTOFEEDERS.forEach(x=>{if(reqLevel(x.price)===L)out.push(x.e+' '+x.n);});
  FOODS.forEach(x=>{if(reqLevel(x.price)===L)out.push(x.e+' '+x.n);});
  DECOS.forEach(x=>{if(reqLevel(x.price)===L)out.push(x.e+' '+x.n);});

/* returning players: rebuild the XP they would have earned from what they already did */
function historyXP(s){
  let xp=0;
  xp+=(s.feeds||0)*3;
  xp+=(s.cleans||0)*.5;
  xp+=(s.pets||0)*2;
  xp+=(s.breeds||0)*15;
  xp+=(s.scaleCleans||0)*5;
  xp+=Object.keys(s.ach||{}).length*25;
  xp+=Math.max(1,s.streak||0)*20;                       // daily gifts collected
  const buyXP=p=>Math.max(2,Math.round(Math.log10((p||0)+1)*3));
  (s.fish||[]).forEach(f=>{const sp=SPECIES.find(x=>x.id===f.sp);if(sp&&sp.price)xp+=buyXP(sp.price);});
  for(let i=1;i<(s.tank||1);i++)if(TANKS[i])xp+=buyXP(TANKS[i].price);
  for(let i=1;i<(s.tool||1);i++)if(TOOLS[i])xp+=buyXP(TOOLS[i].price);
  for(let i=0;i<(s.feeder||0);i++)if(AUTOFEEDERS[i])xp+=buyXP(AUTOFEEDERS[i].price);
  Object.keys(s.decoOwned||{}).forEach(id=>{const d=DECOS.find(x=>x.id===id);if(d)xp+=buyXP(d.price);});
  Object.keys(s.foodsTried||{}).forEach(id=>{const f=FOODS.find(x=>x.id===id);if(f)xp+=buyXP(f.price)*3;});
  return Math.round(xp);
}

/* returning players: start at least at the level that matches what they already own */
function migrateXP(s){

  if(TANKS[s.tank-1])bump(TANKS[s.tank-1].price);
  if(TOOLS[s.tool-1])bump(TOOLS[s.tool-1].price);
  if(s.feeder&&AUTOFEEDERS[s.feeder-1])bump(AUTOFEEDERS[s.feeder-1].price);
  (s.fish||[]).forEach(f=>{const sp=SPECIES.find(x=>x.id===f.sp);if(sp)bump(sp.price);});
  Object.keys(s.decoOwned||{}).forEach(id=>{const d=DECOS.find(x=>x.id===id);if(d)bump(d.price);});
  bump((s.totalCoins||0)/10);

const QTY_CAP=999;
function foodPack(f){return Math.round(f.price*10*.8);}
function foodCost(f,q){
  q=Math.max(0,Math.floor(q));
  return foodPack(f)*Math.floor(q/10)+f.price*(q%10);
}
function maxFishQty(spId){
  const sp=spec(spId); if(!sp)return 1;
  const free=Math.max(0,tankDef().cap-S.fish.length);
  const afford=sp.price>0?Math.floor(S.coins/sp.price):free;
  return clamp(Math.min(free,afford),0,QTY_CAP);
}
function maxFoodQty(id){
  const f=FOODS.find(x=>x.id===id); if(!f)return 1;
  const pack=foodPack(f), packs=Math.floor(S.coins/pack);
  return clamp(packs*10+Math.floor((S.coins-packs*pack)/f.price),0,QTY_CAP);
}
// Press-and-hold on a stepper button: repeats, then accelerates.
let holdT=null;
function stopHold(){if(holdT){clearTimeout(holdT);holdT=null;}}
['mouseup','touchend','touchcancel','blur'].forEach(ev=>window.addEventListener(ev,stopHold));
function holdRepeat(btn,step){
  const begin=ev=>{
    if(ev.type==='mousedown'&&ev.button!==0)return;
    if(btn.disabled)return;
    ev.preventDefault(); stopHold();
    step(1); sfx('tap');
    let reps=0;
    const tick=()=>{
      reps++;
      step(reps>26?10:(reps>12?3:1));
      if(btn.disabled){stopHold();return;}
      holdT=setTimeout(tick,reps>18?45:(reps>6?70:105));
    };
    holdT=setTimeout(tick,420);
  };
  btn.addEventListener('mousedown',begin);
  btn.addEventListener('touchstart',begin,{passive:false});
  btn.addEventListener('mouseleave',stopHold);
}
// Renders the −  [input]  +  MAX control used by the fish and food shelves.
function qtyBox(kind,id,q){
  return '<div class="qty" data-kind="'+kind+'" data-id="'+id+'">'+
    '<button class="qmin" type="button" aria-label="One fewer">−</button>'+
    '<input class="qin" type="text" inputmode="numeric" autocomplete="off" value="'+q+'" aria-label="How many">'+
    '<button class="qplus" type="button" aria-label="One more">+</button>'+
    '<button class="qmax" type="button" title="Fill up to what your coins and space allow">MAX</button>'+
    '<span class="qhint"></span></div>';
}
function qtyOf(kind,id){
  const store=kind==='fish'?buyQty:foodQty;
  const max=Math.max(1,kind==='fish'?maxFishQty(id):maxFoodQty(id));
  const q=clamp(Math.floor(store[id]||1),1,max);
  store[id]=q; return q;
}
function syncQty(kind,id){
  const B=$('shBody'); if(!B)return;
  const q=qtyOf(kind,id);
  const max=Math.max(1,kind==='fish'?maxFishQty(id):maxFoodQty(id));
  const box=B.querySelector('.qty[data-kind="'+kind+'"][data-id="'+id+'"]');
  if(box){
    const inp=box.querySelector('.qin');
    if(inp&&document.activeElement!==inp)inp.value=q;
    const mn=box.querySelector('.qmin'), pl=box.querySelector('.qplus'), mx=box.querySelector('.qmax');
    if(mn)mn.disabled=q<=1;
    if(pl)pl.disabled=q>=max;
    if(mx)mx.disabled=q>=max;
    const hint=box.querySelector('.qhint');
    if(hint){
      if(kind==='food')hint.textContent=q>=10?'📦 −20%':'';
      else if(q>1&&q>=max){
        const sp=spec(id), free=Math.max(0,tankDef().cap-S.fish.length);
        const afford=(sp&&sp.price>0)?Math.floor(S.coins/sp.price):Infinity;
        hint.textContent=free<=afford?T('fills the tank'):T('spends every coin');
      }else hint.textContent='';
    }
  }
  const btn=B.querySelector('['+(kind==='fish'?'data-buy':'data-food')+'="'+id+'"]');
  if(!btn)return;
  if(kind==='fish'){
    const sp=spec(id); if(!sp)return;
    btn.textContent=sp.price?fmt(sp.price*q)+' 🪙':T('FREE');
    btn.disabled=S.coins<sp.price*q||S.fish.length>=tankDef().cap;
  }else{
    const f=FOODS.find(x=>x.id===id); if(!f)return;
    const total=foodCost(f,q);
    btn.textContent=fmt(total)+' 🪙';
    btn.disabled=S.coins<total;
  }
}
function wireQty(box){
  const kind=box.dataset.kind, id=box.dataset.id;
  const store=kind==='fish'?buyQty:foodQty;
  const maxOf=()=>Math.max(1,kind==='fish'?maxFishQty(id):maxFoodQty(id));
  const set=v=>{store[id]=clamp(Math.floor(v)||1,1,maxOf());syncQty(kind,id);};
  const inp=box.querySelector('.qin');
  holdRepeat(box.querySelector('.qmin'),n=>set((store[id]||1)-n));
  holdRepeat(box.querySelector('.qplus'),n=>set((store[id]||1)+n));
  box.querySelector('.qmax').onclick=()=>{sfx('tap');set(maxOf());};
  inp.onfocus=()=>{try{inp.select();}catch(e){}};
  inp.oninput=()=>{
    let v=inp.value.replace(/[^0-9]/g,'').slice(0,5);
    if(v!==''){
      const max=maxOf();
      let n=parseInt(v,10)||0;
      if(n>max){n=max;v=String(max);}
      store[id]=Math.max(1,n);
    }
    if(v!==inp.value)inp.value=v;
    syncQty(kind,id);
  };
  inp.onblur=()=>{set(parseInt(inp.value,10)||1);inp.value=store[id];};
  inp.onkeydown=e=>{
    if(e.key==='Enter'){e.preventDefault();inp.blur();}
    else if(e.key==='ArrowUp'){e.preventDefault();set((store[id]||1)+1);inp.value=store[id];}
    else if(e.key==='ArrowDown'){e.preventDefault();set((store[id]||1)-1);inp.value=store[id];}
  };
}

function findDecoAt(x,y){
  let best=null,bd=1e9;
  S.decoPlaced.forEach(d=>{
    const s=d.scale||1, by=decoY(d), dx=Math.abs(decoX(d)-x);
    if(dx>44*Math.max(1,s)||y>by+16||y<by-80*Math.max(1,s))return;
    const dd=dx+Math.abs(by-30*s-y)*.5;
    if(dd<bd){bd=dd;best=d;}
  });
  return best;
}

function scrub(x,y){
  const R=18+toolDef().pw*5;
  let hit=0;
  for(let i=dirt.length-1;i>=0;i--){
    const d=dirt[i];
    if((d.x-x)*(d.x-x)+(d.y-y)*(d.y-y)<(R+d.r)*(R+d.r)){
      d.hp-=.20+toolDef().pw*.06;
      if(d.hp<=0){
        dirt.splice(i,1);hit++;
        for(let k=0;k<5;k++)sparks.push({x:d.x,y:d.y,vx:rnd(-1,1),vy:rnd(-1.2,-.1),l:22,c:'#a8f0dd'});
      }
    }
  }
  if(hit){
    S.clean=clamp(S.clean+hit*2.4,0,100);
    S.cleans+=hit; S.qScrubs=(S.qScrubs||0)+hit; addXP(Math.min(hit,4)*.5);
    const res=applyDouble(Math.round(hit*10*boostMul()));
    addCoins(res.amt,true,x,y-12);
    if(res.doubled)toast(T('💥 Double payout!'),'gold');
    sfx('scrub'); checkAch(); save(); refreshHUD();
  }else if(Math.random()<.08)sfx('scrub');
}
function applyDouble(n){
  const toolCh=toolDef().doubleChance||0;
  const fishCh=S.fish.reduce((m,f)=>Math.max(m,spec(f.sp).doubleChance||0),0);
  const ch=1-(1-toolCh)*(1-fishCh);
  if(ch>0&&Math.random()<ch){grant('doubled1');return {amt:n*2,doubled:true};}
  return {amt:n,doubled:false};
}

function pos(ev){

let dragPetted=null;
function tryPetAt(x,y){
  let best=null,bd=1e9;
  visEnts().forEach(e=>{
    const d=(e.x-x)*(e.x-x)+(e.y-y)*(e.y-y);
    const R=34*e.sp.size;
    if(d<R*R&&d<bd){bd=d;best=e;}
  });
  if(best&&(!dragPetted||!dragPetted.has(best.id))){
    if(dragPetted)dragPetted.add(best.id);
    petFish(best);
    return true;
  }
  return false;
}
function down(ev){
  audioInit();audioResume();
  const {x,y}=pos(ev);
  cursor.x=x;cursor.y=y;cursor.on=true;
  if(tryGrabTreasure(x,y)){ev.preventDefault();return;}
  if(armed==='feed'){ev.preventDefault();dropFood(x,y);return;}
  if(armed==='clean'){ev.preventDefault();dragging=true;scrub(x,y);return;}
  dragPetted=new Set();
  petSession={count:0,coins:0,firstName:null};
  if(tryPetAt(x,y))return;
  const dec=findDecoAt(x,y);
  if(dec){
    ev.preventDefault();
    draggingDeco=dec;
    decoDragOffset=decoX(dec)-x; decoDragOffY=decoY(dec)-y;
    dragPetted=null;
    petSession=null;
    sfx('tap');
  }else{
    for(let i=0;i<3;i++)bubbles.push({x:x+rnd(-8,8),y:y,r:rnd(2,4),s:rnd(24,44),w:rnd(0,6),tmp:1});
    sfx('bubble');
  }
}
function move(ev){

    draggingDeco.fy=clamp((y+decoDragOffY)/H,DECO_TOP,DECO_FLOOR);

      const i=S.decoPlaced.findIndex(p=>p.id===id);

      else{
        if(S.decoPlaced.length>=tankDef().decoCap){toast(T('Tank is crowded (max ')+tankDef().decoCap+T(' — upgrade your tank for more)'),'err');sfx('err');return;}
        S.decoPlaced.push({id:id,kind:d.kind,fx:rnd(.15,.85),scale:rnd(.9,1.2)});
        sfx('buy'); toast(d.n+T(' placed — drag it to rearrange 🏰'));
      }
      layoutDeco();
    }
    checkAch(); save(); refreshHUD(); openShop('deco');
  });
}

    T('<div style="text-align:center;margin-top:10px;font-size:13px;font-weight:800" id="snackStatus">Round 1/8 · 🪙 0</div>'));
  const cvv=$('snackCv'), gx=cvv.getContext('2d');
  const DPR=Math.min(window.devicePixelRatio||1,2);
  cvv.width=280*DPR; cvv.height=120*DPR; gx.setTransform(DPR,0,0,DPR,0,0);
  const TOTAL=8;
  let round=0, score=0, streak=0, resolved=false, ended=false, pos=0, dir=1, speed=90, zoneW=44;
  let flashTxt='', flashT=0;
  const statusEl=$('snackStatus');
  function updStatus(){if(statusEl)statusEl.textContent=T('Round ')+Math.min(round+1,TOTAL)+'/'+TOTAL+' · 🪙 '+score;}
  updStatus();
  function newRound(){pos=0; dir=1; speed=90+round*10; zoneW=Math.max(26,44-round*2); resolved=false;}
  newRound();
  let raf=null, last=null;
  function render(t){
    if(!scrim2.classList.contains('on')){cancelAnimationFrame(raf);cleanup();return;}
    if(last==null)last=t;
    const dt=Math.min(.05,(t-last)/1000); last=t;
    if(!ended&&!resolved){
      pos+=dir*speed*dt;
      if(pos>232){pos=232;dir=-1;} if(pos<0){pos=0;dir=1;}
    }
    gx.clearRect(0,0,280,120);
    gx.fillStyle='rgba(255,255,255,.08)';gx.fillRect(24,70,232,14);
    const zoneX=236-zoneW;
    gx.fillStyle='rgba(124,231,200,.35)';gx.fillRect(zoneX,70,zoneW,14);
    gx.font='22px sans-serif';gx.textAlign='center';gx.textBaseline='middle';
    gx.fillText('🐟',zoneX+zoneW+18,77);
    gx.font='20px sans-serif';
    gx.fillText('🍚',24+pos,77);
    if(flashT>0){
      flashT-=dt;
      gx.font='700 14px Nunito,sans-serif';gx.fillStyle='#ffe066';
      gx.fillText(flashTxt,140,40);
    }
    raf=requestAnimationFrame(render);
  }
  raf=requestAnimationFrame(render);
  function hitNow(){
    if(ended||resolved)return;
    resolved=true;
    const zoneX=236-zoneW, markerX=24+pos, zoneCx=zoneX+zoneW/2, dist=Math.abs(markerX-zoneCx), half=zoneW/2+10;
    let pts=0, label=T('Miss');
    if(dist<=half){
      const acc=1-clamp(dist/half,0,1);
      if(acc>.85){pts=30;label=T('Perfect! +30');}
      else if(acc>.5){pts=18;label=T('Nice! +18');}
      else{pts=8;label=T('Hit +8');}
      streak++;
    }else streak=0;
    score+=pts; flashTxt=label; flashT=1;
    sfx(pts>0?'coin':'err');
    updStatus();
    round++;
    setTimeout(()=>{
      if(!scrim2.classList.contains('on'))return;
      if(round>=TOTAL)finish(); else newRound();
    },500);
  }
  function tap(ev){ev.preventDefault();hitNow();}
  cvv.addEventListener('mousedown',tap);
  cvv.addEventListener('touchstart',tap,{passive:false});
  function cleanup(){
    cvv.removeEventListener('mousedown',tap);
    cvv.removeEventListener('touchstart',tap);
  }
  function finish(){
    ended=true;
    S.lastSnackAttack=dayNum(now()); addXP(20);
    if(streak>=TOTAL)grant('snackpro');
    save();
    setTimeout(()=>{
      closeModal();
      addCoins(score,false);
      toast(T('Snack Attack complete! +')+fmt(score)+' 🪙','gold');
      sfx('coin'); refreshHUD(); checkAch();
    },500);
  }
}
function canPlayWhackCrab(){return (S.lastWhackCrab||0)!==dayNum(now());}
function openWhackCrab(){
  if(!canPlayWhackCrab()){toast(T('The crabs need a day to regroup'),'err');sfx('err');return;}
  const N=12;
  const holeState=new Array(N).fill('empty'), holeTimers=new Array(N).fill(null);
  let score=0, caught=0, tLeft=14, ended=false;
  let h=T('<p style="opacity:.75;font-size:12.5px;margin-bottom:10px">Whack the crabs, dodge the shells! 14 seconds.</p>')+
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">';
  for(let i=0;i<N;i++)h+='<div class="deco" data-hole="'+i+'" style="cursor:pointer"><div class="de">🕳️</div></div>';
  h+='</div><div style="text-align:center;margin-top:12px;font-size:13px;font-weight:800" id="crabStatus">🪙 0 · ⏱ 14s</div>';
  openModal(T('Whack-a-Crab'),h);
  const statusEl=$('crabStatus');
  function updStatus(){if(statusEl)statusEl.textContent='🪙 '+score+' · ⏱ '+Math.max(0,Math.ceil(tLeft))+'s';}
  const holes=$('sh2Body').querySelectorAll('[data-hole]');
  function alive(){
    if(!scrim2.classList.contains('on')){
      ended=true; clearInterval(popTimer); clearInterval(countdownTimer);
      holeTimers.forEach(t=>t&&clearTimeout(t));
      return false;
    }
    return true;
  }
  function popRandom(){
    if(!alive()||ended)return;
    const idle=[]; for(let i=0;i<N;i++)if(holeState[i]==='empty')idle.push(i);
    if(!idle.length)return;
    const i=pick(idle);
    holeState[i]=Math.random()<.25?'shell':'crab';
    holes[i].querySelector('.de').textContent=holeState[i]==='shell'?'🐚':'🦀';
    holeTimers[i]=setTimeout(()=>{
      holeState[i]='empty';
      if(holes[i])holes[i].querySelector('.de').textContent='🕳️';
      holeTimers[i]=null;
    },rnd(500,750));
  }
  holes.forEach(el=>{
    el.onclick=()=>{
      const i=+el.dataset.hole;
      if(ended)return;
      if(holeState[i]==='crab'){score+=10; caught++; sfx('coin');}
      else if(holeState[i]==='shell'){score=Math.max(0,score-5); sfx('err');}
      else return;
      clearTimeout(holeTimers[i]); holeTimers[i]=null;
      holeState[i]='empty'; el.querySelector('.de').textContent='🕳️';
      updStatus();
    };
  });
  const popTimer=setInterval(popRandom,450);
  const countdownTimer=setInterval(()=>{
    if(!alive())return;
    tLeft-=1; updStatus();
    if(tLeft<=0)finish();
  },1000);
  updStatus();
  function finish(){
    if(ended)return;
    ended=true;
    clearInterval(popTimer); clearInterval(countdownTimer);
    holeTimers.forEach(t=>t&&clearTimeout(t));
    S.lastWhackCrab=dayNum(now()); addXP(20);
    if(caught>=12)grant('crabpro');
    save();
    setTimeout(()=>{
      closeModal();
      addCoins(score,false);
      toast(T('Whacked ')+caught+T(' crabs for +')+fmt(score)+' 🪙','gold');
      sfx('coin'); refreshHUD(); checkAch();
    },400);
  }
}

/* ---------- ad counter (10 a day) ---------- */
function adsLeft(){
  const t=dayNum(now());
  if(S.adDay!==t){S.adDay=t;S.adCount=0;}
  return Math.max(0,MONEY.ADS_PER_DAY-(S.adCount||0));
}

/* ---------- show one rewarded ad, resolves true if the player earned it ---------- */
function showRewardedAd(){
  if(adBusy)return Promise.resolve(false);
  adBusy=true;
  const done=r=>{adBusy=false;return r;};
  const A=AdMobP();
  if(!A)return demoAd().then(done);
  return new Promise(async res=>{
    let earned=false, finished=false, hs=[];
    const finish=()=>{if(finished)return;finished=true;hs.forEach(h=>{try{h.remove();}catch(e){}});res(earned);};
    try{
      hs.push(await A.addListener('onRewardedVideoAdReward',()=>{earned=true;}));
      hs.push(await A.addListener('onRewardedVideoAdDismissed',()=>setTimeout(finish,250)));
      hs.push(await A.addListener('onRewardedVideoAdFailedToShow',finish));
      await A.prepareRewardVideoAd({adId:MONEY.REWARDED_ID,isTesting:MONEY.TESTING});
      const item=await A.showRewardVideoAd();
      if(item&&item.amount!==undefined)earned=true;
      setTimeout(finish,600);
    }catch(e){finish();}
  }).then(r=>{
    if(!r)toast(T('No ad available right now — try again in a minute'),'err');
    return done(r);
  });
}

/* ---------- Google Play coin packs ---------- */
function iapStore(){return window.CdvPurchase&&CdvPurchase.store;}
function packBySku(sku){return COIN_PACKS.find(p=>p.sku===sku);}
function iapInit(){
  const C=window.CdvPurchase; if(!C||iapReady)return;
  const {store,ProductType,Platform}=C;
  iapReady=true;
  store.register(COIN_PACKS.map(p=>({id:p.sku,type:ProductType.CONSUMABLE,platform:Platform.GOOGLE_PLAY})));
  store.when()
    .productUpdated(pr=>{const p=packBySku(pr.id);if(p&&pr.pricing&&pr.pricing.price)p.price=pr.pricing.price;})
    .approved(tr=>{
      // give the coins once per transaction, then tell Google Play it's done (consumed)
      if(!S.iapDone)S.iapDone={};
      const tid=tr.transactionId||('t'+now());
      if(!S.iapDone[tid]){
        S.iapDone[tid]=now();
        (tr.products||[]).forEach(it=>{
          const p=packBySku(it.id); if(!p)return;
          addCoins(p.coins,false); toast(T('Thank you! +')+fmt(p.coins)+' 🪙','gold'); sfx('coin');
        });
        checkAch(); saveNow(); refreshHUD();
      }
      tr.finish();
    });
  store.error(e=>{if(e&&e.code!==C.ErrorCode.PAYMENT_CANCELLED)toast(T('Store error — please try again'),'err');});
  store.initialize([Platform.GOOGLE_PLAY]);
}

/* ---------- Daily quests ---------- */
const QDEF={
  feed:{e:'🍤',t:n=>T('Feed your fish ')+n+T(' times'),m:()=>S.feeds||0,g:[5,8,12]},
  scrub:{e:'🧽',t:n=>T('Scrub ')+n+T(' algae spots'),m:()=>S.qScrubs||0,g:[8,15,25]},
  pet:{e:'💗',t:n=>T('Pet your fish ')+n+T(' times'),m:()=>S.pets||0,g:[3,5,8]},
  game:{e:'🎮',t:n=>(LANG==='fr'?'Joue à '+n+' mini-jeu'+(n>1?'x':''):'Play '+n+' minigame'+(n>1?'s':'')),m:()=>gamesToday(),g:[1,2,3],abs:true},
  scales:{e:'🧼',t:n=>(LANG==='fr'?'Nettoie les écailles '+n+' fois':'Clean fish scales '+n+' time'+(n>1?'s':'')),m:()=>S.scaleCleans||0,g:[1,2,3]},
  earn:{e:'🪙',t:n=>T('Earn ')+fmt(n)+T(' coins'),m:()=>S.totalCoins||0,g:null},
  breed:{e:'🥚',t:()=>T('Breed a baby fish'),m:()=>S.breeds||0,g:[1]}
};
function gamesToday(){const d=dayNum(now());return ['lastBubblePop','lastTreasureDig','lastFishCatch','lastMemoryMatch','lastSnackAttack','lastWhackCrab'].filter(k=>S[k]===d).length;}
function qRand(seed){let x=seed>>>0||1;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296;};}
function canBreedSoon(){
  if(S.fish.length>=tankDef().cap)return false;
  const c={};return S.fish.some(f=>{c[f.sp]=(c[f.sp]||0)+1;return c[f.sp]>=2;});
}
function questsToday(){
  const d=dayNum(now());
  const noDirt=toolDef().slow<=.1; /* auto-clean tools keep the tank spotless, so no scrub quest */
  if(S.quests&&S.quests.day===d){
    if(noDirt){const Q=S.quests, used=Q.list.map(q=>q.id);
      Q.list.forEach((q,k)=>{if(q.id==='scrub'&&!q.claimed){
        const alt=['feed','pet','scales','game','earn'].find(id=>!used.includes(id))||'feed';
        const tier=Math.min(2,Math.floor(playerLevel()/8)), qd=QDEF[alt];
        const perMin=Math.max(1,S.fish.reduce((a,f)=>a+fishIncome(f),0));
        Q.list[k]={id:alt,goal:qd.g?qd.g[Math.min(tier,qd.g.length-1)]:Math.max(300,Math.round(perMin*15/50)*50),base:qd.abs?0:qd.m(),claimed:false};
        used.push(alt); save();}});}
    return S.quests;
  }
  const r=qRand(d*7919+(S.fish.length||1));
  let pool=['feed','scrub','pet','game','scales','earn'];
  if(!S.fish.length)pool=['feed','scrub','game'];
  if(noDirt)pool=pool.filter(id=>id!=='scrub');
  if(canBreedSoon()&&r()<.35)pool.push('breed');
  const pick=[];
  while(pick.length<3&&pool.length){const i=Math.floor(r()*pool.length);pick.push(pool.splice(i,1)[0]);}
  const tier=Math.min(2,Math.floor(playerLevel()/8));
  const perMin=Math.max(1,S.fish.reduce((a,f)=>a+fishIncome(f),0));
  const list=pick.map(id=>{
    const q=QDEF[id];
    let goal=q.g?q.g[Math.min(tier,q.g.length-1)]:Math.max(300,Math.round(perMin*15/50)*50);
    return {id,goal,base:q.abs?0:q.m(),claimed:false};
  });
  S.quests={day:d,list,chest:false}; save();
  return S.quests;
}
function questProg(q){return Math.max(0,Math.min(q.goal,QDEF[q.id].m()-q.base));}
function questReward(){const L=playerLevel(), perMin=S.fish.reduce((x,f)=>x+fishIncome(f),0);return Math.round(Math.max(80+20*L,perMin*10)/10)*10;}
function questsClaimable(){
  if(!S||!S.onboarded)return 0;
  const Q=questsToday();
  let n=Q.list.filter(q=>!q.claimed&&questProg(q)>=q.goal).length;
  if(!Q.chest&&Q.list.every(q=>q.claimed))n++;
  return n;
}

  {id:'grow',e:'🌱',n:T('Super Growth'),d:T('+10% growth per level'),base:3000,g:1.4,max:100},

  {id:'xp',e:'⭐',n:T('Fast Learners'),d:T('Fish level up 10% faster per level'),base:6000,g:1.45,max:100},

function upgLv(id){return Math.min(100,(S&&S.upg&&S.upg[id])||0);}
function upgMaxed(u){return !!u.max&&upgLv(u.id)>=u.max;}
function upgCost(u){return Math.min(COIN_MAX(),Math.round(u.base*Math.pow(u.g,upgLv(u.id))));}
function upgEffect(u){const L=upgLv(u.id);
  if(u.id==='inc')return '+'+(L*10)+'%';
  if(u.id==='grow')return '+'+(L*10)+'%';
  if(u.id==='luck')return '+'+(L*5)+'%';
  if(u.id==='xp'||u.id==='away')return '+'+(L*10)+'%';
  if(u.id==='belly')return bellyMul()===0?T('Never hungry!'):'−'+Math.min(99,Math.round((1-bellyMul())*100))+'%';
  return '+'+Math.round((1/treasMul()-1)*100)+'%';}
function bellyMul(){const L=Math.min(100,upgLv('belly'));return L>=100?0:Math.pow(.97,L)*(1-L/100);}
function treasMul(){const L=Math.min(100,upgLv('treas'));return .25+.75*Math.pow(.95,L)*(1-L/100);}
function growUpgMul(){return 1+.1*upgLv('grow');}
function luckUpgMul(){return 1+.05*upgLv('luck');}
/* --- collection --- */
function dexState(id){return (S&&S.dex&&S.dex[id])||0;}
function dexPages(){const by={};SPECIES.slice().sort((a,b)=>a.price-b.price).forEach(sp=>{(by[sp.r]=by[sp.r]||[]).push(sp);});return Object.keys(RAR).filter(r=>by[r]).map(r=>({r,list:by[r]}));}
function dexBonus(){
  if(!S||!S.dex)return 0;
  let b=0; SPECIES.forEach(sp=>{const v=dexState(sp.id); if(v>=1)b+=1; if(v>=2)b+=2;});
  dexPages().forEach(p=>{if(p.list.every(sp=>dexState(sp.id)>=1))b+=10; if(p.list.every(sp=>dexState(sp.id)>=2))b+=25;});
  return b;
}
function updateDex(silent){
  if(!S)return; S.dex=S.dex||{}; let msg=null;
  S.fish.forEach(f=>{const v=fishLevel(f)>=10?2:1, cur=S.dex[f.sp]||0;
    if(v>cur){S.dex[f.sp]=v; const sp=spec(f.sp); if(sp)msg=(v===2?T('📖 Mastered: '):T('📖 New in your Collection: '))+sp.n+(v===2?' (+2%)':' (+1%)');}});

/* --- rebirth --- */
function pearlGain(){return Math.floor(10*Math.sqrt(Math.max(0,S.runCoins||0)/1e9));}

let _permC=0,_permV=1;
function permMul(){
  const t=performance.now(); if(t-_permC<1000)return _permV; _permC=t;
  _permV=pearlMul()*(1+dexBonus()/100)*(1+.1*upgLv('inc')); return _permV;
}

function buildStatsCard(){
  const W2=340, H2=480, tankH=280;
  const out=document.createElement('canvas');
  out.width=W2; out.height=H2;
  const g=out.getContext('2d');
  g.fillStyle='#062a45'; g.fillRect(0,0,W2,H2);
  const srcW=cv.width, srcH=cv.height;
  const scale=Math.max(W2/srcW,tankH/srcH);
  const sw=W2/scale, sh=tankH/scale;
  const sx=(srcW-sw)/2, sy=(srcH-sh)*.35;
  g.drawImage(cv,sx,sy,sw,sh,0,0,W2,tankH);
  const grad=g.createLinearGradient(0,tankH-60,0,tankH);
  grad.addColorStop(0,'rgba(6,42,69,0)'); grad.addColorStop(1,'rgba(6,42,69,1)');
  g.fillStyle=grad; g.fillRect(0,tankH-60,W2,60);
  g.fillStyle='#062a45'; g.fillRect(0,tankH,W2,H2-tankH);
  g.fillStyle='#ffce4d'; g.font='800 21px Nunito,sans-serif'; g.textAlign='left';
  g.fillText(LANG==='fr'?'Aquarium de '+S.name:S.name+"'s Aquarium",18,tankH+34);
  g.fillStyle='rgba(255,255,255,.6)'; g.font='700 11px Nunito,sans-serif';
  const dd=diffDef();
  g.fillText(dd.e+' '+dd.n+T(' difficulty'),18,tankH+54);
  const gotN=Object.keys(S.ach).length;
  const rows=[['🐠',String(S.fish.length),T('Fish')],['🪙',fmt(S.totalCoins),T('Coins earned')],
    ['🏆',String(gotN),T('Achievements')],['📅',String(S.streak),T('Day streak')]];
  const colW=W2/2, rowH=70, top=tankH+70;
  rows.forEach((r,i)=>{
    const cx2=(i%2)*colW+colW/2, cy2=top+Math.floor(i/2)*rowH;
    g.textAlign='center';
    g.font='800 20px Nunito,sans-serif'; g.fillStyle='#ffce4d';
    g.fillText(r[0]+' '+r[1],cx2,cy2);
    g.font='700 10px Nunito,sans-serif'; g.fillStyle='rgba(255,255,255,.55)';
    g.fillText(r[2].toUpperCase(),cx2,cy2+18);
  });
  g.textAlign='center'; g.font='700 10px Nunito,sans-serif'; g.fillStyle='rgba(255,255,255,.4)';
  g.fillText(T('made with Fishies 🐠'),W2/2,H2-14);
  return out.toDataURL('image/png');
}
function takePhoto(mode){
  mode=mode||'plain';
  try{
    const url=mode==='card'?buildStatsCard():cv.toDataURL('image/png');
    openModal(T('Tank Photo'),
      '<div style="text-align:center">'+
      '<img src="'+url+'" style="width:100%;border-radius:14px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)"/>'+
      T('<button class="btn wide" id="dlPhoto">⬇️ Save ')+(mode==='card'?'stats card':'photo')+'</button>'+
      T('<button class="btn wide ghost" id="sharePhoto" style="margin-top:8px">📤 Share</button>')+
      '<button class="btn wide ghost" id="toggleMode" style="margin-top:8px">'+
      (mode==='card'?T('📷 Just the tank'):T('📊 Share as stats card'))+'</button>'+
      '</div>');
    $('toggleMode').onclick=()=>{sfx('tap');takePhoto(mode==='card'?'plain':'card');};
    $('dlPhoto').onclick=()=>{
      const a=document.createElement('a');
      a.href=url; a.download='fishies-'+(mode==='card'?'card':'tank')+'-'+dayNum(now())+'.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast((mode==='card'?T('Stats card'):'Photo')+T(' saved ⬇️'),'gold'); sfx('buy');
    };
    const shareBtn=$('sharePhoto');
    if(navigator.share&&navigator.canShare){
      shareBtn.onclick=async()=>{
        try{
          const blob=await (await fetch(url)).blob();
          const file=new File([blob],'fishies-'+(mode==='card'?'card':'tank')+'.png',{type:'image/png'});
          if(navigator.canShare({files:[file]})){
            await navigator.share({files:[file],title:T('My Fishies ')+(mode==='card'?'stats':'tank')});
          }else{
            toast(T('Sharing not supported here — try Save instead'),'err');sfx('err');
          }
        }catch(e){/* user cancelled — ignore */}
      };
    }else{
      shareBtn.style.display='none';
    }
  }catch(e){toast(T('Could not capture photo'),'err');sfx('err');}
}
function openAch(){
  const visible=ACHS.filter(a=>!a.hidden||has(a.id));
  const got=visible.filter(a=>has(a.id)), lock=visible.filter(a=>!has(a.id));
  const hiddenLeft=ACHS.filter(a=>a.hidden&&!has(a.id)).length;
  let h='<div class="row"><div><div class="l">'+got.length+T(' of ')+visible.length+T(' unlocked</div>')+
    T('<div class="d">Every achievement pays its own coin reward')+(hiddenLeft?' · '+hiddenLeft+T(' secret still hidden 🤫'):'')+'</div></div></div>';
  got.concat(lock).forEach(a=>{

  slots.forEach(s=>{

    h+='<div class="card" data-slot="'+s.id+'" style="cursor:pointer;'+(isActive?'border-color:var(--gold)':'')+'">'+
      '<div class="art"><span class="emo">'+dd.e+'</span></div>'+

      '<div class="sub">'+dd.n+' · '+fmt(s.coins||0)+' 🪙 · '+(s.fishCount||0)+T(' fish</div></div>')+
      (isActive?'':'<button class="btn ghost" data-del="'+s.id+'">🗑️</button>')+

  });
  h+=T('<button class="btn wide mint" id="newSlotBtn" style="margin-top:6px">➕ New Aquarium</button>')+
    (slots.length>1?T('<button class="btn wide ghost" id="cmpSlotBtn" style="margin-top:8px">📊 Compare Aquariums</button>'):'')+

  const cmpBtn=$('cmpSlotBtn'); if(cmpBtn)cmpBtn.onclick=()=>{sfx('tap');openCompareSlots();};

    T('<button class="btn wide" id="yesDel" style="background:linear-gradient(180deg,#ff8080,#e74c3c);color:#fff">Delete it</button>')+
    T('<button class="btn wide ghost" id="noDel" style="margin-top:8px">Cancel</button>'));

  $('yesDel').onclick=()=>{

function saveCode(){
  saveNow();
  const data=localStorage.getItem(activeKey())||JSON.stringify(S);
  return 'FISHIES1:'+btoa(unescape(encodeURIComponent(data)));
}
function parseSaveText(t){
  t=String(t||'').trim();
  if(!t)return null;
  try{
    if(t.startsWith('FISHIES1:'))t=decodeURIComponent(escape(atob(t.slice(9).replace(/\s+/g,''))));
    const d=JSON.parse(t);
    if(!d||typeof d!=='object'||!Array.isArray(d.fish)||typeof d.coins!=='number')return null;
    return d;
  }catch(e){return null;}
}
function copyText(txt,ta){
  const ok=()=>{toast(T('Save code copied 📋'),'gold');sfx('coin');};
  const fallback=()=>{try{ta.focus();ta.select();ta.setSelectionRange(0,txt.length);
    if(document.execCommand('copy'))ok(); else toast(T('Press and hold the code, then Copy'),'err');}catch(e){toast(T('Press and hold the code, then Copy'),'err');}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fallback); else fallback();
}

var TUT={on:false,base:{},glowEl:null,tick:0,last:''};
function tutEls(){

function tutEnter(i){

function tutTick(){

  const st=TUT_STEPS[S.tut];
  const so=scrim.classList.contains('on'), mo=scrim2.classList.contains('on'), title=$('shTitle').textContent;
  let txt='', tgt=null, pt=null, done=false;

    else{tgt=$('tFeed');txt=T('Your fish is hungry! Tap <b>FEED</b>');}
  }else if(st==='clean'){
    done=(S.cleans||0)>=TUT.base.cleans+3||!dirt.length;
    if(so){tgt=$('shX');txt=T('Tap <b>Exit</b> to go back to your tank');}
    else if(armed==='clean'){
      txt=T('<b>Drag your finger</b> across the green algae 🧽');
      const r0=cv.getBoundingClientRect(), cy=(r0.height*.5)/dispZoom, d=dirt.slice().sort((a,b)=>Math.abs(a.y-cy)-Math.abs(b.y-cy))[0]; if(d){const r=cv.getBoundingClientRect();pt={x:r.left+d.x*dispZoom,y:r.top+(d.y-d.r)*dispZoom};}
    }else{tgt=$('tClean');txt=T('Algae is growing! Tap <b>CLEAN</b>');}
  }else if(st==='pet'){
    done=(S.pets||0)>TUT.base.pets;
    if(armed)tutDisarm();
    if(so){tgt=$('shX');txt=T('Tap <b>Exit</b> to go back to your tank');}

  }

  const bar=$('tutBar');

  if(mo&&!(st==='feed'&&!so)){
    pt=null; tgt=document.querySelector('#sh2Body .btn.wide:not(.ghost)')||$('sh2X');

window.addEventListener('pagehide',saveNow);

// MOS's "Play as DevOps" opens with ?devmode=1 — this is a second door into
// the same S.devMode gate the "fishngo" easter egg already unlocks (see
// startNewSlot above), so the existing Settings > Developer Mode tools work
// without anyone needing to know that phrase.
function wantsDevMode(){
  try{ return new URLSearchParams(location.search).get('devmode')==='1'; }catch(e){ return false; }
}
function boot(){
  const activeId=ensureSlots();
  S=activeId?load():fresh();
  if(activeId&&wantsDevMode()&&!S.devMode){
    S.devMode=true; saveNow();
    setTimeout(()=>{toast(T('🛠️ Developer Mode unlocked — check Settings'),'gold');sfx('ach');},1300);
  }
  dispZoom=tankZoom();
  try{updateDex(true);}catch(e){}
  resize(); tickWorld(); syncEnt(); initFx(); seedDirt(); layoutDeco();
  refreshHUD(); checkSeason();
  requestAnimationFrame(loop);
  setInterval(()=>{
    tickWorld(); refreshHUD();
  },2000);
  let saveTick=0;
  setInterval(()=>{
    checkAch(); saveTick++;
    if(!window._crowd||saveTick%2===0)save();
  },10000);
  setInterval(()=>{
    shopAffCheck();
  },2000);
  setInterval(checkSeason,60000);
  setInterval(()=>{
    const want=Math.round((100-S.clean)/2.4);
    if(dirt.length<want-2)seedDirt();
  },7000);
  if(!activeId)renderDifficultyPicker();
  maybeWhatsNew();
}
boot();
</script>
</body>
</html>
