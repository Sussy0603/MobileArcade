<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#1d3a2a"/>
<title>Buggies: Idle Bug Sanctuary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fff; --line:rgba(255,255,255,.22);
  --glass:rgba(16,36,26,.62);
  --gold:#ffd25a; --gem:#7fe3ff; --mint:#6fe0a8; --pink:#ff8fbf; --bad:#ff6b6b;
  --sheet:#f7f3e8; --sheetInk:#22301f; --card:#fff; --cardLine:#e4dccb; --soft:#6a7a62;
  --font:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);background:#0c1a12;color:var(--ink);display:flex;justify-content:center;
  user-select:none;-webkit-user-select:none;letter-spacing:.01em}
#app{position:relative;width:100%;height:100%;max-width:520px;overflow:hidden;background:#1d3a2a}
canvas#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--font);cursor:pointer;border:0}

/* ---------- top bar ---------- */
.top{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--sat)) 10px 6px;display:flex;gap:6px;align-items:center;z-index:20;pointer-events:none}
.top>*{pointer-events:auto}
.chip{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;white-space:nowrap;color:#fff}
.chip small{font-size:11px;font-weight:600;opacity:.8}
.chip .ic{font-size:17px}
.icbtn{width:42px;height:42px;border-radius:50%;background:var(--glass);border:1px solid var(--line);font-size:19px;display:grid;place-items:center;color:#fff;flex:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.icbtn:active,.chip:active{transform:scale(.94)}
.sp{flex:1}
.row2{position:absolute;left:10px;right:10px;top:calc(58px + var(--sat));display:flex;gap:6px;align-items:center;z-index:19;flex-wrap:wrap;pointer-events:none}
.row2>*{pointer-events:auto}
.pill{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;color:#fff;display:flex;gap:6px;align-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill.warn{background:rgba(200,60,60,.75);animation:pulse 1.6s infinite}
.pill.gold{background:rgba(160,120,20,.7);border-color:rgba(255,210,90,.7)}
@keyframes pulse{50%{transform:scale(1.05)}}

/* ---------- action bar + tabs ---------- */
.actions{position:absolute;left:0;right:0;bottom:calc(64px + var(--sab));display:flex;justify-content:space-around;padding:6px 6px;z-index:18;pointer-events:none}
.act{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--glass);border:1px solid var(--line);
  border-radius:16px;padding:6px 4px 5px;min-width:58px;color:#fff;font-size:11.5px;font-weight:600;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative}
.act b{font-size:21px;line-height:1.1}
.act:active{transform:scale(.93)}
.dot{position:absolute;top:-3px;right:-3px;background:#ff5a5a;color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;font-weight:800}
.tabs{position:absolute;left:0;right:0;bottom:0;height:calc(64px + var(--sab));padding-bottom:var(--sab);display:flex;background:#16301f;border-top:1px solid rgba(255,255,255,.12);z-index:40}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:rgba(255,255,255,.65);font-size:12.5px;font-weight:600;background:none;position:relative}
.tab b{font-size:23px;filter:grayscale(.4)}
.tab.on{color:#fff}.tab.on b{filter:none;transform:scale(1.1)}
.tab.on::after{content:'';position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 4px 4px;background:var(--mint)}

/* ---------- sheets & modals ---------- */
.sheet{position:absolute;left:0;right:0;top:0;bottom:calc(64px + var(--sab));background:var(--sheet);color:var(--sheetInk);z-index:30;
  display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.sheet.open{transform:none}
.shHead{display:flex;align-items:center;gap:10px;padding:calc(12px + var(--sat)) 14px 10px;border-bottom:1px solid var(--cardLine);background:#efe8d6}
.shHead h2{font-size:21px;font-weight:800;flex:1}
.shHead .x{width:40px;height:40px;border-radius:50%;background:#e2d9c3;font-size:18px;color:#3a3a2a}
.shTop{display:flex;gap:6px}
.shTop .chip{background:#2c4a34;font-size:14px;padding:5px 10px}
.shBody{flex:1;overflow-y:auto;padding:12px 12px 30px;-webkit-overflow-scrolling:touch}
.hl{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:16px 4px 8px}
.card{background:var(--card);border:2px solid var(--cardLine);border-radius:18px;padding:10px;display:flex;gap:10px;align-items:center;margin-bottom:8px}
.card .art{width:62px;height:62px;flex:none;border-radius:14px;background:#eef3e4;display:grid;place-items:center;font-size:32px;overflow:hidden}
.card .art img{width:100%;height:100%;object-fit:contain}
.card .info{flex:1;min-width:0}
.card .nm{font-weight:700;font-size:16px;line-height:1.25}
.card .sub{font-size:13.5px;color:var(--soft);line-height:1.35;margin-top:2px}
.btn{background:#2f8a52;color:#fff;font-weight:700;font-size:15px;border-radius:14px;padding:10px 14px;white-space:nowrap;box-shadow:0 3px 0 #1d5a34}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1d5a34}
.btn.gem{background:#2a7fb0;box-shadow:0 3px 0 #1a5070}
.btn.ad{background:#7a4fc0;box-shadow:0 3px 0 #4f2f8a}
.btn.gold{background:#d89a1a;box-shadow:0 3px 0 #8a6010}
.btn.red{background:#c8484a;box-shadow:0 3px 0 #8a2a2a}
.btn.ghost{background:#e6dfcc;color:#33402c;box-shadow:0 3px 0 #c8bea6}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%;display:block;margin-top:8px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:#e9f6e0;color:#2f6a3a;vertical-align:middle}
.bar{height:10px;border-radius:999px;background:#e4dccb;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6fe0a8,#2f8a52);border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.jc{background:#fff;border:3px solid var(--cardLine);border-radius:16px;padding:6px 4px 8px;text-align:center;font-size:12px;font-weight:600;line-height:1.2;position:relative}
.jc img{width:76px;height:76px;object-fit:contain;display:block;margin:0 auto 2px}
.jc .st{position:absolute;top:4px;right:6px;font-size:14px}
.note{font-size:13.5px;color:var(--soft);line-height:1.45;margin:6px 4px}
.overlay{position:absolute;inset:0;background:rgba(8,16,10,.55);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--sheet);color:var(--sheetInk);border-radius:24px;width:100%;max-width:400px;max-height:88%;overflow-y:auto;padding:18px 16px 16px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal h3{font-size:21px;font-weight:800;text-align:center;margin-bottom:8px}
.modal p{font-size:15.5px;line-height:1.5;text-align:center;margin:6px 0}
.big{font-size:54px;text-align:center}
.amt{font-size:28px;font-weight:800;text-align:center;color:#2f8a52;margin:6px 0}
.rowb{display:flex;gap:8px;margin-top:10px}.rowb .btn{flex:1}

/* Barnaby speech */
#talk{position:absolute;left:8px;right:8px;top:calc(104px + var(--sat));z-index:25;display:none;gap:8px;align-items:flex-start}
#talk.open{display:flex}
#talk canvas{width:92px;height:92px;flex:none}
#talk .bub{flex:1;background:#fffaf0;color:#22301f;border-radius:6px 20px 20px 20px;padding:12px 14px;font-size:16px;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.35);font-weight:600}
#talk .bub .btn{margin-top:8px;padding:8px 16px}

/* toast */
#toasts{position:absolute;left:0;right:0;bottom:calc(140px + var(--sab));z-index:70;display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(20,40,28,.92);color:#fff;border-radius:16px;padding:9px 16px;font-size:15px;font-weight:600;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:tin .25s ease-out;line-height:1.35}
.toast.gold{background:rgba(150,104,10,.95)}.toast.err{background:rgba(160,40,40,.95)}.toast.new{background:rgba(90,50,150,.95)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}

/* mini game layer */
#game{position:absolute;inset:0;z-index:80;background:#0f1f16;display:none;flex-direction:column}
#game.open{display:flex}
#game .gh{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat)) 12px 8px;color:#fff}
#game .gh h2{flex:1;font-size:19px}
#game canvas{flex:1;width:100%;display:block;touch-action:none}
#game .gf{padding:10px 12px calc(14px + var(--sab));color:#fff;font-size:15px;text-align:center;min-height:60px}
.swatches{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.4)}
.sw.on{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 3px rgba(255,255,255,.3)}
input[type=range]{width:100%;accent-color:#2f8a52;height:30px}
.seg{display:flex;background:#e6dfcc;border-radius:14px;padding:3px}.seg button{flex:1;padding:9px;border-radius:11px;background:none;font-weight:700;font-size:15px;color:#33402c}.seg button.on{background:#2f8a52;color:#fff}
.odds{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13.5px;margin:6px 4px;color:#33402c}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div class="top">
    <div class="chip" id="cCoins"><span class="ic">🪙</span><span id="vCoins">0</span><small id="vRate"></small></div>
    <div class="chip" id="cGems"><span class="ic">💎</span><span id="vGems">0</span></div>
    <div class="chip" id="cCandy" style="display:none"><span class="ic">🍬</span><span id="vCandy">0</span></div>
    <div class="sp"></div>
    <button class="icbtn" id="bSet" aria-label="Settings">⚙️</button>
  </div>
  <div class="row2" id="row2"></div>
  <div class="actions" id="actions"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="sheet" id="sheet"><div class="shHead"><h2 id="shTitle"></h2><div class="shTop" id="shTop"></div><button class="x" id="shX">✕</button></div><div class="shBody" id="shBody"></div></div>
  <div id="talk"><canvas id="talkCv" width="184" height="184"></canvas><div class="bub" id="talkBub"></div></div>
  <div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
  <div id="game"><div class="gh"><h2 id="gTitle"></h2><div class="chip" id="gScore" style="background:rgba(255,255,255,.12)"></div><button class="icbtn" id="gX">✕</button></div><canvas id="gCv"></canvas><div class="gf" id="gFoot"></div></div>
  <div id="toasts"></div>
</div>
<script>
/* =====================================================================
   BUGGIES — game data (species, plants, decor, badges)
   Every text is [English, French].
===================================================================== */
const RAR=[
  {id:0,n:['Common','Commun'],col:'#9fd8a0',inc:1,  price:120,  rel:150,  gem:0},
  {id:1,n:['Uncommon','Peu commun'],col:'#7cc4ff',inc:3,  price:900,  rel:900,  gem:0},
  {id:2,n:['Rare','Rare'],col:'#c49bff',inc:10, price:0,    rel:5000, gem:5},
  {id:3,n:['Legendary','Légendaire'],col:'#ffcf4a',inc:35, price:0,    rel:25000,gem:15}
];

const HABS=[
  {id:'g',n:['Flower Garden','Jardin fleuri'],e:'🌸',plants:['milkweed','lavender','coneflower','buddleia','sunflower'],day:true},
  {id:'p',n:['Pond','Étang'],e:'💧',plants:['waterlily','cattail','pickerel','iris'],day:true},
  {id:'f',n:['Forest Floor','Sous-bois'],e:'🍂',plants:['fern','oak','strawberry','moss'],day:true},
  {id:'n',n:['Night Garden','Jardin de nuit'],e:'🌙',plants:['primrose','moonflower','jasmine','honeysuckle'],day:false}
];
const HAB=id=>HABS.find(h=>h.id===id);

/* real plants. c = flower colour, k = how it is drawn */
const PLANTS={
  milkweed:  {n:['Milkweed','Asclépiade'],cost:40, c:'#e889b5',k:'cluster'},
  lavender:  {n:['Lavender','Lavande'],cost:80, c:'#9b7fe0',k:'spike'},
  coneflower:{n:['Coneflower','Échinacée'],cost:150,c:'#e86fa6',k:'daisy'},
  buddleia:  {n:['Butterfly Bush','Arbre à papillons'],cost:400,c:'#8d5fd6',k:'cone'},
  sunflower: {n:['Sunflower','Tournesol'],cost:900,c:'#ffc531',k:'sun'},
  waterlily: {n:['Water Lily','Nénuphar'],cost:120,c:'#ffd0e4',k:'lily'},
  cattail:   {n:['Cattail','Quenouille'],cost:200,c:'#7a4a24',k:'cattail'},
  pickerel:  {n:['Pickerelweed','Pontédérie'],cost:500,c:'#7b8cf0',k:'spike'},
  iris:      {n:['Marsh Iris','Iris des marais'],cost:1200,c:'#ffd84a',k:'iris'},
  fern:      {n:['Fern','Fougère'],cost:150,c:'#4f9a46',k:'fern'},
  oak:       {n:['Oak Sapling','Jeune chêne'],cost:350,c:'#5f8f3a',k:'oak'},
  strawberry:{n:['Wild Strawberry','Fraisier des bois'],cost:800,c:'#e8343f',k:'berry'},
  moss:      {n:['Mossy Stump','Souche moussue'],cost:2000,c:'#6fae4a',k:'stump'},
  primrose:  {n:['Evening Primrose','Onagre'],cost:600,c:'#fff07a',k:'daisy'},
  moonflower:{n:['Moonflower','Fleur de lune'],cost:1200,c:'#f6f4ff',k:'trumpet'},
  jasmine:   {n:['Jasmine','Jasmin'],cost:3000,c:'#ffffff',k:'cluster'},
  honeysuckle:{n:['Honeysuckle','Chèvrefeuille'],cost:6000,c:'#ffe3a8',k:'trumpet'}
};

/* t = body type used by the drawing code, s = size, pl = favourite plant
   tr = species personality, f = real fun fact */
const SPECIES=[
 /* ---------- FLOWER GARDEN ---------- */
 {id:'cabbagewhite',h:'g',r:0,t:'bf',s:.85,pl:'milkweed',c:{w:'#f7f5ea',p:'#2b2b2b',b:'#3a3a3a',pat:'white'},
  n:['Cabbage White','Piéride du chou'],tr:['Curious','Curieux'],
  f:['One of the most common butterflies in the world.','Un des papillons les plus communs du monde.']},
 {id:'honeybee',h:'g',r:0,t:'bee',s:.7,pl:'lavender',c:{b:'#d99a2b',p:'#3a2410',k:'honey'},
  n:['Honeybee','Abeille domestique'],tr:['Busy','Travailleuse'],
  f:['Honeybees dance to tell their friends where the flowers are.','Les abeilles dansent pour montrer aux autres où sont les fleurs.']},
 {id:'monarch',h:'g',r:0,t:'bf',s:1.1,pl:'milkweed',c:{w:'#f08a1c',p:'#1d1410',b:'#1d1410',pat:'monarch'},
  n:['Monarch','Monarque'],tr:['Adventurous','Aventurier'],
  f:['Monarchs fly up to 4,000 km to spend the winter in Mexico.','Les monarques volent jusqu’à 4 000 km pour passer l’hiver au Mexique.']},
 {id:'paintedlady',h:'g',r:0,t:'bf',s:.95,pl:'coneflower',c:{w:'#ee8a4a',p:'#2a1a12',b:'#4a3424',pat:'lady'},
  n:['Painted Lady','Belle-dame'],tr:['Traveler','Voyageuse'],
  f:['Painted Ladies make the longest known butterfly trip: up to 14,000 km there and back.','La belle-dame fait la plus longue migration connue chez les papillons : jusqu’à 14 000 km aller-retour.']},
 {id:'bumblebee',h:'g',r:0,t:'bee',s:.85,pl:'coneflower',c:{b:'#f2c230',p:'#1b1612',k:'bumble'},
  n:['Bumblebee','Bourdon'],tr:['Cuddly','Câlin'],
  f:['Bumblebees shiver their muscles to warm up before they fly.','Les bourdons font frissonner leurs muscles pour se réchauffer avant de voler.']},
 {id:'redadmiral',h:'g',r:1,t:'bf',s:1,pl:'buddleia',c:{w:'#1e1a1c',p:'#e2452b',b:'#2a2224',pat:'admiral'},
  n:['Red Admiral','Vulcain'],tr:['Bold','Audacieux'],
  f:['Red Admirals love to drink juice from very ripe fruit.','Le vulcain adore boire le jus des fruits trop mûrs.']},
 {id:'tigerswallow',h:'g',r:1,t:'bf',s:1.25,pl:'lavender',c:{w:'#f6d64a',p:'#1c1712',b:'#1c1712',pat:'tiger',tail:1},
  n:['Canadian Tiger Swallowtail','Papillon tigré du Canada'],tr:['Proud','Fier'],
  f:['The tails on its back wings help trick birds into attacking the wrong end.','Les queues de ses ailes trompent les oiseaux, qui attaquent le mauvais bout.']},
 {id:'commonblue',h:'g',r:1,t:'bf',s:.75,pl:'coneflower',c:{w:'#6f9cf2',p:'#2a3a6a',b:'#3a4050',pat:'blue'},
  n:['Common Blue','Azuré commun'],tr:['Shy','Timide'],
  f:['Only the males are bright blue. The females are mostly brown.','Seuls les mâles sont bleu vif. Les femelles sont surtout brunes.']},
 {id:'peacock',h:'g',r:1,t:'bf',s:1,pl:'buddleia',c:{w:'#b4312a',p:'#2a1a18',b:'#2a1a18',pat:'peacock'},
  n:['Peacock Butterfly','Paon-du-jour'],tr:['Show-off','Frimeur'],
  f:['It flashes its big eye spots to scare birds away.','Il montre ses gros ocelles pour faire peur aux oiseaux.']},
 {id:'masonbee',h:'g',r:1,t:'bee',s:.65,pl:'lavender',c:{b:'#2b3a6a',p:'#151a2a',k:'mason'},
  n:['Mason Bee','Osmie'],tr:['Builder','Bâtisseuse'],
  f:['Mason bees build their nests with mud.','Les osmies construisent leur nid avec de la boue.']},
 {id:'hummingmoth',h:'g',r:1,t:'mo',s:.8,pl:'buddleia',c:{w:'#6b5a4a',p:'#e08a2a',b:'#5a4a3a',pat:'hawk'},
  n:['Hummingbird Hawk-moth','Moro-sphinx'],tr:['Speedy','Rapide'],
  f:['It hovers like a tiny hummingbird while it drinks nectar.','Il fait du surplace comme un petit colibri pour boire le nectar.']},
 {id:'bluemorpho',h:'g',r:2,t:'bf',s:1.4,pl:'sunflower',c:{w:'#1e8cf0',p:'#0d1420',b:'#2a2a2a',pat:'morpho'},
  n:['Blue Morpho','Morpho bleu'],tr:['Dreamy','Rêveur'],
  f:['Its blue comes from tiny scales that bounce light, not from color pigment.','Son bleu vient de minuscules écailles qui reflètent la lumière, pas d’un pigment.']},
 {id:'glasswing',h:'g',r:2,t:'bf',s:1,pl:'sunflower',c:{w:'rgba(220,235,240,.18)',p:'#3a2418',b:'#3a2418',pat:'glass'},
  n:['Glasswing','Papillon de verre'],tr:['Mysterious','Mystérieux'],
  f:['Its wings are clear like glass, so it is very hard to see.','Ses ailes sont transparentes comme du verre : il est difficile à voir.']},
 {id:'orchidmantis',h:'g',r:2,t:'ma',s:1,pl:'sunflower',c:{b:'#f6d6e8',p:'#e89cc4',k:'orchid'},
  n:['Orchid Mantis','Mante orchidée'],tr:['Patient','Patiente'],
  f:['It looks just like a flower, to catch bugs that come close.','Elle ressemble à une fleur pour attraper les insectes qui s’approchent.']},
 {id:'birdwing',h:'g',r:3,t:'bf',s:1.75,pl:'sunflower',c:{w:'#121214',p:'#29d6b0',b:'#e8c020',pat:'birdwing'},
  n:['Queen Alexandra’s Birdwing','Ornithoptère de la reine Alexandra'],tr:['Majestic','Majestueux'],
  f:['The biggest butterfly in the world. Its wings can be 28 cm wide!','Le plus grand papillon du monde. Ses ailes mesurent jusqu’à 28 cm !']},
 {id:'sunsetmoth',h:'g',r:3,t:'bf',s:1.35,pl:'sunflower',paid:1,c:{w:'#141414',p:'#3fe08a',b:'#1a1a1a',pat:'sunset',tail:1},
  n:['Madagascan Sunset Moth','Uranie de Madagascar'],tr:['Dazzling','Éblouissant'],
  f:['This moth flies by day. Its rainbow colors come from light on its scales.','Ce papillon vole le jour. Ses couleurs arc-en-ciel viennent de la lumière sur ses écailles.']},

 /* ---------- POND ---------- */

/* =====================================================================
   BUGGIES — art. Every insect, plant and habitat is drawn with code.
   Insects are drawn top-down, head pointing up (-y).
===================================================================== */
function hexToRgb(h){
  if(h[0]!=='#')return null;
  if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];

function shade(h,a){ // a: -1..1 darker..lighter

function rgba(h,al){const c=hexToRgb(h);return c?'rgba('+c.join(',')+','+al+')':h;}
function ell(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,Math.PI*2);}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(.1,r),0,Math.PI*2);}
function line(c,pts,w,col){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.lineWidth=w;c.strokeStyle=col;c.lineCap='round';c.lineJoin='round';c.stroke();}

/* ---------------- wing shapes (right side, in units of u) ---------------- */
function P(u,cmds){ // tiny path builder: ['M',x,y,'C',...]
  const p=new Path2D();let i=0;
  while(i<cmds.length){const k=cmds[i++];
    if(k==='M'){p.moveTo(cmds[i]*u,cmds[i+1]*u);i+=2;}
    else if(k==='L'){p.lineTo(cmds[i]*u,cmds[i+1]*u);i+=2;}
    else if(k==='Q'){p.quadraticCurveTo(cmds[i]*u,cmds[i+1]*u,cmds[i+2]*u,cmds[i+3]*u);i+=4;}
    else if(k==='C'){p.bezierCurveTo(cmds[i]*u,cmds[i+1]*u,cmds[i+2]*u,cmds[i+3]*u,cmds[i+4]*u,cmds[i+5]*u);i+=6;}
    else if(k==='Z')p.closePath();}

}

  if(kind==='mo'){
    let h=['M',.06,.04,'C',.42,.06,.78,.12,.76,.36,'C',.72,.6,.48,.7,.34,.64];
    if(tail===1)h=h.concat(['C',.32,.9,.36,1.25,.3,1.55,'C',.2,1.3,.2,.9,.2,.6]);
    else if(tail===2)h=h.concat(['C',.34,1.2,.42,1.9,.3,2.35,'C',.18,1.9,.2,1.1,.2,.6]);
    h=h.concat(['C',.12,.52,.07,.34,.06,.15,'Z']);
    return{f:P(u,['M',.06,-.16,'C',.34,-.58,.86,-.78,1.06,-.64,'C',1.08,-.38,.98,-.1,.86,.05,'C',.56,.09,.3,.07,.06,.04,'Z']),h:P(u,h)};

  let h=['M',.06,-.02,'C',.4,-.04,.8,.02,.82,.26,'C',.84,.5,.64,.72,.44,.73];
  if(tail)h=h.concat(['C',.43,.85,.42,1.02,.37,1.12,'C',.31,1.0,.31,.84,.3,.74]);

function dots(c,u,list,r,col){c.fillStyle=col;list.forEach(p=>{circ(c,p[0]*u,p[1]*u,(p[2]||r)*u);c.fill();});}
function eyespot(c,u,x,y,r,cols){cols.forEach((col,i)=>{circ(c,x*u,y*u,r*u*(1-i/(cols.length+.3)));c.fillStyle=col;c.fill();});}
function veins(c,u,from,to,w,col){to.forEach(p=>qline(c,from[0]*u,from[1]*u,(from[0]+p[0])/2*u,(from[1]+p[1])/2*u+.04*u,p[0]*u,p[1]*u,w*u,col));}

/* paint the pattern inside one wing (already clipped) */
function wingPattern(c,u,cl,isFore){
  const pat=cl.pat, W=cl.w, Pc=cl.p;
  const F=isFore;
  const base=(c0,c1,cx,cy)=>{const g=c.createRadialGradient(cx*u,cy*u,0,cx*u,cy*u,1.2*u);g.addColorStop(0,c0);g.addColorStop(1,c1);c.fillStyle=g;c.fillRect(-.1*u,-1.2*u,1.4*u,3.8*u);};

  switch(pat){
  case 'monarch':
    if(F){c.fillStyle=Pc;circ(c,1.0*u,-.8*u,.3*u);c.fill();
      veins(c,u,[.08,-.05],[[.96,-.72],[.95,-.5],[.9,-.3],[.82,-.08],[.6,-.62],[.4,-.45]],.045,Pc);
      dots(c,u,[[.9,-.72],[.97,-.62],[.82,-.66]],.035,'#f4c070');}

    break;
  case 'white':
    if(F){c.fillStyle=rgba('#333333',.85);circ(c,1.02*u,-.85*u,.24*u);c.fill();dots(c,u,[[.6,-.4],[.66,-.2]],.055,'#333');}
    else {c.fillStyle='rgba(230,225,170,.5)';c.fillRect(-.1*u,-.2*u,1.2*u,1.2*u);}
    break;
  case 'lady':
    if(F){c.fillStyle=Pc;ell(c,.92*u,-.62*u,.36*u,.3*u,-.5);c.fill();ell(c,.52*u,-.36*u,.12*u,.08*u,-.6);c.fill();
      dots(c,u,[[.94,-.78,.06],[.8,-.6,.05],[.98,-.55,.04],[.87,-.45,.035]],.05,'#fff7ea');}
    else{dots(c,u,[[.68,.42],[.58,.56],[.44,.64],[.74,.28]],.045,Pc);}
    break;
  case 'admiral':
    if(F){line(c,[.42*u,-.78*u,.78*u,-.1*u],.15*u,Pc);dots(c,u,[[.9,-.75,.05],[.82,-.68,.04],[.97,-.62,.035]],.05,'#fff');}
    else{c.save();c.lineWidth=.22*u;c.strokeStyle=Pc;c.stroke(wingShapes(u,'bf').h);c.restore();dots(c,u,[[.66,.5],[.5,.62]],.035,'#222');}
    break;
  case 'tiger':
    if(F){[[.28,-.62,.24,-.08],[.48,-.78,.4,-.1],[.68,-.86,.6,-.2],[.86,-.86,.82,-.45]].forEach(s=>line(c,[s[0]*u,s[1]*u,s[2]*u,s[3]*u],.09*u,Pc));}
    else{dots(c,u,[[.42,.66,.06]],.05,'#e8742a');dots(c,u,[[.55,.62],[.66,.52]],.04,'#4a80e0');}
    break;
  case 'blue':
    base('#a8c8ff',W,.1,F?-.1:.1);dots(c,u,[[.5,-.4]],.04,'#2a3a6a');break;
  case 'peacock':
    if(F)eyespot(c,u,.8,-.6,.24,['#1a1414','#f2d24a','#3a5ab8','#121212','#7aa0f0']);
    else{eyespot(c,u,.55,.38,.24,['#121212','#2a3a6a','#4a6ad8','#0a0a12']);}
    break;
  case 'morpho':
    base('#7ad4ff',W,.15,F?-.15:.15);break;
  case 'glass':
    if(F)line(c,[.74*u,-.8*u,.95*u,-.55*u],.07*u,'rgba(255,255,255,.85)');
    else{c.fillStyle='rgba(200,110,60,.55)';ell(c,.48*u,.68*u,.18*u,.08*u);c.fill();}
    veins(c,u,[.08,F?-.05:.03],F?[[.96,-.72],[.9,-.35],[.8,-.08]]:[[.78,.3],[.6,.6],[.3,.66]],.02,'rgba(60,36,24,.6)');
    break;
  case 'birdwing':
    if(F){[[.95,-.78],[.92,-.5],[.85,-.22],[.6,-.7]].forEach(p=>qline(c,.1*u,-.08*u,p[0]*.5*u,p[1]*.6*u,p[0]*u,p[1]*u,.07*u,'#29d6b0'));}
    else{const g=c.createLinearGradient(0,0,.8*u,.7*u);g.addColorStop(0,'#1fe0c0');g.addColorStop(.6,'#2a8af0');g.addColorStop(1,'#0e3a6a');c.fillStyle=g;ell(c,.42*u,.34*u,.42*u,.32*u,.4);c.fill();dots(c,u,[[.5,.4],[.62,.28],[.36,.52]],.05,'#0a0a0a');}

    else{const g=c.createLinearGradient(.1*u,0,.7*u,.7*u);g.addColorStop(0,'#3fe08a');g.addColorStop(.35,'#f6e04a');g.addColorStop(.65,'#f08a2a');g.addColorStop(1,'#e83a8a');c.fillStyle=g;ell(c,.48*u,.4*u,.36*u,.3*u,.6);c.fill();dots(c,u,[[.38,1.08]],.05,'#fff');}
    break;
  case 'hawk':

    else{c.fillStyle=Pc;c.fillRect(-.1*u,-.2*u,1*u,1*u);}
    break;
  case 'rosy':
    if(F){c.fillStyle=Pc;ell(c,.52*u,-.32*u,.34*u,.16*u,-.45);c.fill();}
    else{c.fillStyle='#ffe8a0';c.fillRect(-.1*u,-.2*u,1.2*u,1.4*u);c.fillStyle='rgba(242,138,184,.55)';ell(c,.5*u,.45*u,.3*u,.22*u);c.fill();}
    break;
  case 'tigermoth':
    if(F){[[.15,-.2,.5,-.55,.95,-.6],[.2,-.05,.55,-.3,.9,-.25],[.4,.0,.7,-.12,.85,.0]].forEach(s=>qline(c,s[0]*u,s[1]*u,s[2]*u,s[3]*u,s[4]*u,s[5]*u,.07*u,Pc));}
    else{c.fillStyle=cl.a;c.fillRect(-.1*u,-.2*u,1.2*u,1.4*u);dots(c,u,[[.5,.3,.09],[.36,.48,.07],[.62,.5,.06]],.07,'#1a1a3a');}
    break;
  case 'luna':
    eyespot(c,u,F?.5:.42,F?-.3:.36,.07,['#f6d24a','#8a5a9a','#1a1418','#e8f0d0']);
    if(F)line(c,[.06*u,-.16*u,.34*u,-.56*u,.86*u,-.76*u],.06*u,Pc);

    if(F){line(c,[.2*u,-.1*u,.8*u,-.55*u],.04*u,'rgba(250,220,200,.7)');eyespot(c,u,.5,-.3,.06,['#f6d24a','#e8f0ff']);}
    else eyespot(c,u,.42,.35,.2,['#f6d24a','#2a3a6a','#121218','#f0f4ff']);
    break;
  case 'cecropia':
    c.fillStyle=cl.a;ell(c,.1*u,F?-.08*u:.12*u,.25*u,.18*u);c.fill();
    qline(c,.15*u,F?-.35*u:.55*u,.55*u,F?-.2*u:.35*u,.95*u,F?-.45*u:.4*u,.08*u,Pc);
    qline(c,.15*u,F?-.3*u:.6*u,.55*u,F?-.15*u:.4*u,.95*u,F?-.4*u:.45*u,.04*u,cl.a);
    dots(c,u,[F?[.55,-.38,.07]:[.4,.32,.07]],.06,Pc);dots(c,u,[F?[.55,-.38,.035]:[.4,.32,.035]],.03,cl.a);
    if(F)eyespot(c,u,.92,-.62,.06,['#1a1418','#7ad0f0']);
    break;
  case 'comet':
    eyespot(c,u,F?.55:.42,F?-.32:.34,.11,['#7a2a1a','#f6e08a','#c84a2a','#1a1210','#f0f0f0']);
    if(!F){c.fillStyle=Pc;c.fillRect(.15*u,.6*u,.4*u,2*u);}
    break;
  case 'atlas':
    const win=(pts)=>{c.beginPath();c.moveTo(pts[0]*u,pts[1]*u);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i]*u,pts[i+1]*u);c.closePath();c.fillStyle='rgba(255,246,220,.85)';c.fill();};
    if(F){win([.42,-.42,.55,-.3,.4,-.24]);qline(c,.1*u,-.15*u,.5*u,-.12*u,.95*u,-.5*u,.04*u,Pc);

    else{win([.36,.22,.48,.3,.34,.4]);qline(c,.1*u,.2*u,.4*u,.15*u,.72*u,.45*u,.04*u,Pc);c.strokeStyle='#e8c070';c.lineWidth=.06*u;c.stroke(wingShapes(u,'mo').h);}

    else{c.fillStyle='rgba(154,122,176,.35)';ell(c,.45*u,.5*u,.3*u,.12*u,.5);c.fill();}

/* ---------------- butterflies & moths ---------------- */
function drawLep(c,sp,u,t,o){
  const cl=sp.c, moth=sp.t==='mo';
  const kind=cl.pat==='hawk'?'hawk':(moth?'mo':'bf');
  const S=wingShapes(u,kind,cl.tail);
  c._wf=S.f;c._wh=S.h;
  const fast=kind==='hawk'?3:1;
  let k=1;
  if(o.flap>0){const ph=Math.sin(t*(moth?7:9)*fast);k=.18+.82*Math.abs(ph);}
  else if(!moth&&!o.sleep){k=.75+.25*Math.abs(Math.sin(t*1.3));} // perched butterfly slowly fans
  if(o.sleep&&!moth)k=.15; // sleeping butterflies close their wings
  [1,-1].forEach(side=>{
    c.save();c.scale(side*k,1);
    // shadow-ish depth: hind first
    [S.h,S.f].forEach((path,i)=>{
      c.save();c.clip(path);wingPattern(c,u,cl,i===1);c.restore();
    });
    c.restore();
  });
  /* body */
  const bc=cl.b||'#222';
  const fur=moth?1.5:1;
  if(cl.pat==='skull'){c.fillStyle='#1a1410';ell(c,0,.35*u,.1*u,.42*u);c.fill();
    for(let i=0;i<5;i++){c.fillStyle=i%2?'#141010':'#f0c030';c.fillRect(-.09*u,(.08+i*.11)*u,.18*u,.055*u);}}
  else{const g=c.createLinearGradient(-.1*u,0,.1*u,0);g.addColorStop(0,shade(bc,-.3));g.addColorStop(.5,shade(bc,.2));g.addColorStop(1,shade(bc,-.3));
    c.fillStyle=g;ell(c,0,.32*u,.065*u*fur,.42*u);c.fill();}
  c.fillStyle=shade(bc,-.1);ell(c,0,-.05*u,.09*u*fur,.16*u);c.fill();
  if(cl.pat==='skull'){c.fillStyle='#e8d8a8';circ(c,0,-.06*u,.06*u);c.fill();c.fillStyle='#141010';circ(c,-.022*u,-.07*u,.016*u);c.fill();circ(c,.022*u,-.07*u,.016*u);c.fill();}
  c.fillStyle=shade(bc,-.2);circ(c,0,-.24*u,.07*u);c.fill();
  c.fillStyle='#111';circ(c,-.05*u,-.27*u,.03*u);c.fill();circ(c,.05*u,-.27*u,.03*u);c.fill();
  /* antennae */
  [1,-1].forEach(s=>{
    if(moth){qline(c,s*.03*u,-.29*u,s*.12*u,-.48*u,s*.2*u,-.6*u,.02*u,shade(bc,-.2));
      c.strokeStyle=rgba(hexToRgb(bc)?bc:'#666666',.7);c.lineWidth=.012*u;
      for(let i=1;i<6;i++){const x=s*(.03+.034*i)*u,y=(-.29-.062*i)*u;c.beginPath();c.moveTo(x,y);c.lineTo(x+s*.05*u,y+.02*u);c.moveTo(x,y);c.lineTo(x-s*.03*u,y-.04*u);c.stroke();}}
    else{qline(c,s*.03*u,-.29*u,s*.1*u,-.55*u,s*.18*u,-.72*u,.018*u,'#222');c.fillStyle='#222';circ(c,s*.18*u,-.72*u,.03*u);c.fill();}
  });
}

/* ---------------- beetles ---------------- */
function legs(c,u,t,o,len,col,w,spread){
  const walk=o.walk?Math.sin(t*14)*.12:0;
  [-1,1].forEach(s=>{
    [[-.12,-.55,-.35],[.05,-.6,.05],[.18,-.55,.42]].forEach((L,i)=>{
      const ph=(i%2?walk:-walk)*s;
      const x0=s*.12*u, y0=L[0]*u;
      const x1=s*(.3+spread)*len*u, y1=(L[0]+L[2]*.4+ph)*u;
      const x2=s*(.42+spread)*len*u, y2=(L[0]+L[2]*.9+ph*1.5)*u;
      line(c,[x0,y0,x1,y1,x2,y2],w*u,col);
    });
  });
}
function drawBeetle(c,sp,u,t,o){
  const cl=sp.c, bc=cl.b;
  legs(c,u,t,o,cl.goliath?1.1:1,shade(bc,-.4),.045,0);
  /* antennae */
  if(cl.longant){[1,-1].forEach(s=>{c.beginPath();c.moveTo(s*.06*u,-.42*u);c.bezierCurveTo(s*.3*u,-.7*u,s*.6*u,-.6*u,s*.75*u,-.15*u);c.lineWidth=.03*u;c.strokeStyle='#5a7a9a';c.setLineDash([.08*u,.05*u]);c.stroke();c.setLineDash([]);});}
  else [1,-1].forEach(s=>qline(c,s*.05*u,-.45*u,s*.14*u,-.6*u,s*.2*u,-.66*u,.025*u,'#1a1410'));
  /* mandibles / horns */
  if(cl.mand){[1,-1].forEach(s=>{c.beginPath();c.moveTo(s*.06*u,-.5*u);c.bezierCurveTo(s*.3*u,-.7*u,s*.25*u,-.95*u,s*.06*u,-1.05*u);c.lineWidth=.07*u;c.strokeStyle='#5a2a18';c.lineCap='round';c.stroke();line(c,[s*.2*u,-.78*u,s*.08*u,-.8*u],.04*u,'#5a2a18');});}
  if(cl.horn==='herc'){c.fillStyle='#141210';c.beginPath();c.moveTo(-.07*u,-.32*u);c.quadraticCurveTo(0,-1.3*u,.0,-1.35*u);c.quadraticCurveTo(.02,-1.3*u,.07*u,-.32*u);c.fill();
    c.beginPath();c.moveTo(-.05*u,-.45*u);c.quadraticCurveTo(0,-.95*u,.02*u,-.98*u);c.lineWidth=.06*u;c.strokeStyle='#2a2420';c.stroke();}
  if(cl.horn==='rhino'){c.beginPath();c.moveTo(0,-.5*u);c.quadraticCurveTo(.02*u,-.8*u,-.08*u,-.9*u);c.lineWidth=.09*u;c.strokeStyle='#2a1408';c.lineCap='round';c.stroke();}
  /* head */
  c.fillStyle=cl.head||shade(bc,-.35);ell(c,0,-.44*u,.13*u,.1*u);c.fill();
  if(cl.scarab){c.fillStyle=shade(bc,-.2);c.beginPath();for(let i=0;i<6;i++){const a=Math.PI+i*Math.PI/5;c.lineTo(Math.cos(a)*.2*u,-.48*u+Math.sin(a)*.14*u);}c.closePath();c.fill();}

/* draw any insect. size = full length in px; ang = facing direction (rad, 0 = right) */

/* ---------------- habitat backgrounds (cached) ---------------- */
const _bg={};
function habitatBG(h,W,H,night){
  const key=h+W+'x'+H+(night?'n':'d');
  if(_bg[key])return _bg[key];
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const R=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647;})();
  const sky=c.createLinearGradient(0,0,0,H*.5);
  const SK={g:['#8fd0f4','#e6f6ff'],p:['#7cc4e8','#d8f0f6'],f:['#3a6a4a','#8ab87a'],n:['#0c1430','#2a2a5a']}[h];
  const NSK={g:['#0b1630','#283a6a'],p:['#0a1428','#1f3458'],f:['#08140e','#1e3424'],n:['#060a1c','#1a1a40']}[h];

  else if(h!=='f'){c.fillStyle='rgba(255,255,255,.75)';[[.2,.16,.09],[.27,.15,.06],[.7,.22,.08],[.77,.21,.05]].forEach(p=>{ell(c,p[0]*W,p[1]*H,p[2]*W,p[2]*W*.45);c.fill();});}

  const dk=night?.55:0;

    for(let i=0;i<9;i++){const x=R()*W,w=W*(.05+R()*.06);c.fillStyle=shade('#4a3424',-dk-.1*R());c.fillRect(x,0,w,H*.55);c.fillStyle='rgba(0,0,0,.15)';c.fillRect(x+w*.6,0,w*.4,H*.55);}
    for(let i=0;i<14;i++){c.fillStyle=shade(i%2?'#2f5a2a':'#3a6a30',-dk);circ(c,R()*W,R()*H*.25,W*(.12+R()*.1));c.fill();}
    if(!night){for(let i=0;i<5;i++){c.fillStyle='rgba(255,250,200,.07)';c.beginPath();const x=R()*W;c.moveTo(x,0);c.lineTo(x+W*.12,0);c.lineTo(x+W*.3,H*.8);c.lineTo(x+W*.1,H*.8);c.fill();}}
  } else {
    hill(H*.38,shade(h==='n'?'#1a2a3a':'#6aa060',-dk),H*.03);
    hill(H*.44,shade(h==='n'?'#1e3426':'#5a9a4a',-dk),H*.025);
  }
  /* ground */
  const gy=H*.5;
  const GR={g:['#6cb850','#3f8a34'],p:['#6aa850','#3a7a30'],f:['#6a4a2a','#3a2614'],n:['#2a4a2a','#14261a']}[h];
  const gg=c.createLinearGradient(0,gy,0,H);gg.addColorStop(0,shade(GR[0],-dk));gg.addColorStop(1,shade(GR[1],-dk));

  if(h==='p'){
    const wy=H*.59, wh=H*.34;
    const wg=c.createLinearGradient(0,wy,0,wy+wh);wg.addColorStop(0,night?'#16304a':'#5ab0d8');wg.addColorStop(1,night?'#0a1a2a':'#2a6a9a');
    c.fillStyle=wg;ell(c,W*.5,wy+wh*.5,W*.55,wh*.52);c.fill();
    c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=1.5;for(let i=0;i<14;i++){const x=W*(.1+R()*.8),y=wy+wh*(.15+R()*.75);c.beginPath();c.moveTo(x,y);c.lineTo(x+W*.06,y);c.stroke();}
    for(let i=0;i<5;i++){c.fillStyle=shade('#3f8a4a',-dk);const x=W*(.15+R()*.7),y=wy+wh*(.2+R()*.6);ell(c,x,y,W*.05,H*.012);c.fill();}

    [[0,-.75,.38],[-.25,-.55,.3],[.25,-.55,.3],[0,-.45,.3]].forEach(b=>{c.fillStyle=shade(col,-dk+(b[1]<-.7?.08:0));circ(c,x+b[0]*s,y+b[1]*s,b[2]*s);c.fill();});};
  if(h==='g'||h==='p'){tree(W*.08,gy+H*.02,H*.2,'#3f8a3a');tree(W*.93,gy+H*.01,H*.24,'#367a34');tree(W*.82,gy-H*.01,H*.13,'#4a9a44');}
  if(h==='n'){[[.06,.24],[.9,.28],[.75,.16]].forEach(t=>tree(W*t[0],gy+H*.02,H*t[1],'#1c3a28'));}

  /* grass blades / texture */
  for(let i=0;i<260;i++){const x=R()*W,y=gy+R()*(H-gy);

    else{c.strokeStyle=shade(i%3?'#4f9a3a':'#78c058',-dk-(h==='n'?.3:0));c.lineWidth=1.3;c.beginPath();c.moveTo(x,y);c.lineTo(x+(R()-.5)*5,y-5-R()*8);c.stroke();}}
  /* wildflowers, bigger toward the front */
  if(h==='g'||h==='n'){const cols=h==='n'?['#f6f4ff','#fff07a','#cfd8ff']:['#ff8fbf','#ffd23a','#ffffff','#b48aff','#ff7a5a'];
    for(let i=0;i<90;i++){const y=gy+H*.03+R()*(H-gy-H*.05),x=R()*W,k=(y-gy)/(H-gy),r=1+k*3.2;
      if(h==='p')continue;c.strokeStyle=shade('#3f7a34',-dk);c.lineWidth=1;c.beginPath();c.moveTo(x,y);c.lineTo(x,y+r*3);c.stroke();

  if(h==='p'){for(let i=0;i<9;i++){const a=R()*6.28,x=W*.5+Math.cos(a)*W*.56,y=H*.76+Math.sin(a)*H*.18;if(y<gy)continue;
      for(let k=0;k<5;k++){c.strokeStyle=shade(k%2?'#5a8a3a':'#3f7a34',-dk);c.lineWidth=2;c.beginPath();c.moveTo(x+k*3,y);c.quadraticCurveTo(x+k*3+4,y-H*.04,x+k*4-6,y-H*(.06+R()*.04));c.stroke();}
      c.fillStyle=shade('#7a4a24',-dk);ell(c,x+6,y-H*.07,2.5,7);c.fill();}}
  if(h==='f'){for(let i=0;i<10;i++){const x=R()*W,y=gy+H*.04+R()*(H-gy-H*.08),s=4+(y-gy)/(H-gy)*10;
      c.fillStyle=shade('#f0e8d8',-dk);c.fillRect(x-s*.15,y-s*.6,s*.3,s*.6);c.fillStyle=shade(i%3?'#c84a2a':'#d8a050',-dk);c.beginPath();c.ellipse(x,y-s*.6,s*.6,s*.4,0,Math.PI,0);c.fill();
      if(i%3){c.fillStyle='rgba(255,255,255,.8)';circ(c,x-s*.2,y-s*.8,s*.08);c.fill();circ(c,x+s*.2,y-s*.75,s*.07);c.fill();}}}

  return _bg[key]=cv;
}

function drawDirt(c,d,s){
  c.save();c.translate(d.x,d.y);c.rotate(d.r);
  if(d.k===0){c.fillStyle='#8a5a2a';ell(c,0,0,s*.5,s*.25);c.fill();c.strokeStyle='#5a3a1a';c.lineWidth=1;c.beginPath();c.moveTo(-s*.5,0);c.lineTo(s*.5,0);c.stroke();}
  else if(d.k===1){c.fillStyle='#b8862a';ell(c,0,0,s*.45,s*.22);c.fill();c.fillStyle='#d8a040';ell(c,-s*.1,-s*.05,s*.2,s*.1);c.fill();}
  else if(d.k===2){line(c,[-s*.5,0,s*.5,s*.05],s*.12,'#6a4a2a');line(c,[0,0,s*.15,-s*.25],s*.07,'#6a4a2a');}
  else{c.fillStyle='rgba(90,70,40,.75)';circ(c,0,0,s*.3);c.fill();circ(c,s*.25,s*.1,s*.18);c.fill();}
  c.restore();
}

/* ---------------- Old Barnaby (a wise old scarab beetle) ---------------- */
function drawBarnaby(c,x,y,s,t,mood){
  c.save();c.translate(x,y);
  const bob=Math.sin((t||0)*2)*s*.015;c.translate(0,bob);
  /* legs */
  c.strokeStyle='#2a2018';c.lineWidth=s*.035;c.lineCap='round';
  [[-1,.15],[1,.15],[-1,.32],[1,.32]].forEach(l=>{c.beginPath();c.moveTo(l[0]*s*.25,l[1]*s);c.lineTo(l[0]*s*.42,l[1]*s+s*.12);c.lineTo(l[0]*s*.46,l[1]*s+s*.2);c.stroke();});
  /* shell */
  const g=c.createRadialGradient(-s*.12,s*.05,s*.05,0,s*.2,s*.45);g.addColorStop(0,'#5aa88a');g.addColorStop(.5,'#2f6a5a');g.addColorStop(1,'#14302a');
  c.fillStyle=g;ell(c,0,s*.22,s*.36,s*.32);c.fill();
  c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=s*.012;c.beginPath();c.moveTo(0,-s*.05);c.lineTo(0,s*.53);c.stroke();
  c.fillStyle='rgba(255,255,255,.18)';ell(c,-s*.16,s*.1,s*.06,s*.15,.3);c.fill();
  /* little bandage scar from long ago */
  c.save();c.translate(s*.17,s*.3);c.rotate(-.5);c.fillStyle='#f4e2c4';c.fillRect(-s*.08,-s*.025,s*.16,s*.05);c.fillStyle='rgba(180,140,100,.6)';c.fillRect(-s*.02,-s*.025,s*.04,s*.05);c.restore();
  /* head */
  c.fillStyle='#24423a';ell(c,0,-s*.12,s*.25,s*.17);c.fill();
  c.fillStyle='#1c342e';c.beginPath();for(let i=0;i<7;i++){const a=Math.PI+i*Math.PI/6;c.lineTo(Math.cos(a)*s*.3,-s*.2+Math.sin(a)*s*.14);}c.closePath();c.fill();
  /* bushy white eyebrows */
  c.fillStyle='#f0ece0';[-1,1].forEach(d=>{ell(c,d*s*.1,-s*.2,s*.08,s*.03,d*.25);c.fill();});
  /* glasses */
  [-1,1].forEach(d=>{c.fillStyle='rgba(220,240,255,.35)';circ(c,d*s*.1,-s*.12,s*.065);c.fill();c.strokeStyle='#c8a050';c.lineWidth=s*.014;circ(c,d*s*.1,-s*.12,s*.065);c.stroke();});
  c.beginPath();c.moveTo(-s*.035,-s*.12);c.lineTo(s*.035,-s*.12);c.stroke();
  [-1,1].forEach(d=>{c.fillStyle='#111';const bl=Math.sin((t||0)*.7)>.97?.2:1;ell(c,d*s*.1,-s*.115,s*.025,s*.03*bl);c.fill();c.fillStyle='#fff';circ(c,d*s*.1+s*.01,-s*.125,s*.008);c.fill();});
  /* smile */
  c.strokeStyle='#f0ece0';c.lineWidth=s*.014;c.beginPath();c.arc(0,-s*.05,s*.05,.2,Math.PI-.2);c.stroke();
  /* antennae */
  [-1,1].forEach(d=>{c.strokeStyle='#2a2018';c.lineWidth=s*.02;c.beginPath();c.moveTo(d*s*.12,-s*.26);c.quadraticCurveTo(d*s*.18,-s*.38,d*s*.26,-s*.4);c.stroke();c.fillStyle='#3a3020';ell(c,d*s*.27,-s*.4,s*.04,s*.025,d*.5);c.fill();});
  c.restore();
}

const now=()=>Date.now();
const dayNum=t=>{const d=new Date(t);return d.getFullYear()*1000+Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function L(en,fr){return S&&S.lang==='fr'?fr:en;}
function N(arr){return arr?(S&&S.lang==='fr'?arr[1]:arr[0]):'';}
function fmt(n){
  n=Math.floor(n||0);
  if(n<1000)return String(n);
  const u=['','K','M','B','T','Qa','Qi'];let i=0,v=n;
  while(v>=1000&&i<u.length-1){v/=1000;i++;}
  return (v>=100?Math.floor(v):v.toFixed(v>=10?1:2).replace(/\.?0+$/,''))+u[i];
}
function fmtTime(sec){sec=Math.max(0,Math.ceil(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return h?h+'h '+String(m).padStart(2,'0')+'m':m?m+':'+String(s).padStart(2,'0'):s+'s';}

/* ---------------- bugs ---------------- */
function makeBug(sp,opt){
  opt=opt||{};
  const b={uid:S.uid++,sp,name:pick(NAMES),lv:1,xp:0,hun:85,sick:opt.sick?1:0,heal:0,rescue:opt.sick?1:0,paid:opt.paid?1:0};
  if(!S.journal[sp]){S.journal[sp]={rel:0,t:now()};b._new=1;}
  return b;
}
function habOf(b){return b.h;}
function bugsIn(h){return S.bugs.filter(b=>b.h===h);}
function freeSlots(h){return S.hab[h]?S.hab[h].slots-bugsIn(h).length:0;}
function isNightReal(){const h=new Date().getHours();return h>=20||h<6;}
function lanternOn(){return now()<S.lanternEnd;}
function bugAwake(b){
  const sp=SP[b.sp];
  if(sp.h==='n')return isNightReal()||lanternOn();
  return !isNightReal();
}
function mood(b){
  if(b.heal)return{e:'🩹',k:'heal',t:L('Healing','En soin')};
  if(b.sick)return{e:'🤒',k:'sick',t:L('Hurt — needs care','Blessé — a besoin de soins')};
  if(!bugAwake(b))return{e:'😴',k:'sleep',t:L('Sleepy','Endormi')};
  if(b.hun<40)return{e:'😋',k:'hungry',t:L('Hungry','A faim')};
  return{e:'😊',k:'happy',t:L('Happy','Heureux')};
}
function xpNeed(lv){return Math.ceil(1+lv*.8);}

/* ---------------- money multipliers ---------------- */
function decorBonus(h,key){
  let v=0;DECOR.forEach(d=>{if(S.decor[d.id]&&(d.h===h||d.h==='*')){if(key==='inc')v+=(d.h==='*'?(d.all||0):(d.inc||0));else v+=d[key]||0;}});
  return v;
}
function boostOn(){return now()<S.boostEnd;}
function habMul(h){return (1+.25*S.hab[h].lvl)*(1+decorBonus(h,'inc')/100);}
function globalMul(){return (1+TUNE.PRESTIGE_BONUS*S.prestige)*(boostOn()?2:1);}
function bugRate(b,ignoreState){
  if(!b.h)return 0;
  if(!ignoreState&&(b.sick||b.heal))return 0;
  const sp=SP[b.sp];
  let r=RAR[sp.r].inc*(1+.3*(b.lv-1));
  if(!ignoreState){
    r*=b.hun>50?1:b.hun>20?.7:.4;
    if(!bugAwake(b))r*=.5;
  }
  return r*habMul(b.h)*globalMul();
}
function totalRate(){return S.bugs.reduce((a,b)=>a+bugRate(b),0);}
function addCoins(n,track){
  n=Math.floor(n);if(n<=0)return;
  S.coins+=n;
  if(track!==false){S.seasonCoins+=n;S.totalCoins+=n;}
}
function spend(n){if(S.coins<n){toast(L('Not enough coins','Pas assez de pièces'),'err');sfx('err');return false;}S.coins-=n;return true;}
function spendGems(n){if(S.gems<n){toast(L('Not enough gems','Pas assez de gemmes'),'err');sfx('err');setTimeout(()=>openTab('shop'),400);return false;}S.gems-=n;return true;}

/* ---------------- costs ---------------- */
const habCost=()=>TUNE.HAB_COST[S.habs.length]||1e9;
const slotCost=h=>Math.round(250*Math.pow(2.15,S.hab[h].slots-TUNE.SLOTS0)*(1+S.habs.indexOf(h)*.5));
const lvlCost=h=>Math.round(150*Math.pow(1.7,S.hab[h].lvl)*(1+S.habs.indexOf(h)*1.5));
const offCost=()=>Math.round(1500*Math.pow(4,S.offLvl));
const enCost=()=>Math.round(3000*Math.pow(3.2,S.enLvl));
function adoptCost(sp){const n=S.bugs.concat(S.box).filter(b=>b.sp===sp).length;return Math.round(RAR[SP[sp].r].price*Math.pow(1.35,n)*(1+HABS.findIndex(h=>h.id===SP[sp].h)*.8));}

/* ---------------- placing new bugs ---------------- */
function placeBug(b,prefH){
  const sp=SP[b.sp];
  const tryH=[prefH,sp.h,S.cur].concat(S.habs).filter(h=>h&&S.habs.includes(h));
  for(const h of tryH){if(freeSlots(h)>0){b.h=h;S.bugs.push(b);return h;}}
  delete b.h;S.box.push(b);return null;
}

/* ---------------- simulation tick (dt seconds) ---------------- */
function simTick(dt,offline){
  const t=now();
  /* income */
  const inc=totalRate()*dt;
  if(inc>0){addCoins(inc);if(offline)S.away+=inc;}
  /* hunger */
  S.bugs.forEach(b=>{
    const slow=1+decorBonus(b.h,'food')/100;
    b.hun=Math.max(0,b.hun-dt*100/TUNE.HUNGER_SEC/slow);
    if(S.helpers.feeder&&b.hun<60&&!b.sick&&!b.heal){b.hun=100;gainXp(b,1,true);}
    if(b.heal&&t>=b.heal)finishHeal(b,offline);
  });
  /* plants, dirt, visitors, sickness per habitat */
  S.habs.forEach(h=>{
    const H=S.hab[h];
    H.plants.forEach(p=>{if(!p)return;p.w=Math.max(0,p.w-dt*100/TUNE.WATER_SEC);if(S.helpers.gardener&&p.w<35)p.w=100;});
    const dSec=TUNE.DIRT_SEC*(1+decorBonus(h,'clean')/100);
    while(t-H.tDirt>dSec*1000){H.tDirt+=dSec*1000;if(H.dirt.length<TUNE.DIRT_MAX)H.dirt.push(newDirt(h));}
    if(S.helpers.cleaner&&H.dirt.length&&(!H.tClean||t-H.tClean>60000)){H.dirt.shift();H.tClean=t;}
    if(t-H.tSick>600000){
      H.tSick=t;
      if(H.dirt.length>=TUNE.DIRT_SICK){
        let n=0;bugsIn(h).forEach(b=>{if(!b.sick&&!b.heal&&Math.random()<.1&&n<(offline?2:1)){b.sick=1;n++;
          if(!offline)toast(b.name+' '+L('got sick from the mess! 🤒 Tap to help.','est malade à cause du désordre ! 🤒 Touche-le pour aider.'),'err');}});
      }
    }
    const vSec=TUNE.VISIT_SEC/(1+decorBonus(h,'vis')/100);
    if(t-H.tVisit>vSec*1000){H.tVisit=t;if(!offline&&S.tut>=99)tryVisitor(h);}
  });
  /* rescue calls */
  if(!offline&&S.tut>=99&&t>S.nextRescue){S.nextRescue=t+TUNE.RESCUE_SEC*1000*rnd(.8,1.2);rescueCall();}
  /* energy */
  while(S.energy<enMax()&&t-S.enT>TUNE.EN_SEC*1000){S.enT+=TUNE.EN_SEC*1000;S.energy++;}
  if(S.energy>=enMax())S.enT=t;
}
function newDirt(h){return{x:rnd(.06,.94),y:rnd(.04,.9),k:Math.floor(Math.random()*4),r:rnd(0,6.28),id:Math.random()};}

function gainXp(b,n,quiet){
  b.xp+=n;let up=false;
  while(b.xp>=xpNeed(b.lv)){b.xp-=xpNeed(b.lv);b.lv++;up=true;}
  if(up&&!quiet){toast('⭐ '+b.name+' '+L('is now level','est maintenant niveau')+' '+b.lv+'!','gold');sfx('level');}
  return up;
}

/* ---------------- visitors (attracted by plants) ---------------- */
function rollRarity(w){const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;for(let i=0;i<w.length;i++){if((r-=w[i])<0)return i;}return 0;}
function tryVisitor(h){
  if(freeSlots(h)<=0)return;
  const H=S.hab[h];
  const ok=H.plants.filter(p=>p&&p.w>0).map(p=>p.id);
  if(!ok.length||Math.random()>.6)return;
  let pool=SPECIES.filter(s=>s.h===h&&!s.paid&&!s.ev&&ok.includes(s.pl));
  if(!pool.length)return;
  const r=rollRarity([60,28,10,2]);
  let c=pool.filter(s=>s.r===r);
  if(!c.length)c=pool.filter(s=>s.r<=r);
  if(!c.length)return;
  const sp=pick(c);
  const b=makeBug(sp.id);b.h=h;b.hun=70;S.bugs.push(b);
  spawnArrival(b);
  toast((sp.t==='bf'||sp.t==='mo'?'🦋 ':'🐞 ')+L('A '+N(sp.n)+' came to visit and stayed!','Nouveau visiteur : '+N(sp.n)+' ! Il reste chez toi.'),b._new?'new':'');
  if(b._new)newSpecies(b);
  checkBadges();
}
/* ---------------- rescue calls ---------------- */
function rescueCall(){
  if(S.rescueQ.length>=3)return;
  const h=pick(S.habs);
  const pool=SPECIES.filter(s=>s.h===h&&!s.paid&&!s.ev);
  let r=rollRarity([55,30,12,3]);
  let c=pool.filter(s=>s.r===r);if(!c.length)c=pool;
  const sp=pick(c).id;
  if(freeSlots(h)>0){
    const b=makeBug(sp,{sick:1});b.h=h;b.hun=40;S.bugs.push(b);spawnArrival(b);
    sfx('alert');
    barnabySay(L('🚑 A hurt '+N(SP[sp].n)+' just arrived in the '+N(HAB(h).n)+'. Tap it to help!','🚑 Un insecte blessé vient d’arriver ('+N(SP[sp].n)+', '+N(HAB(h).n)+'). Touche-le pour l’aider !'),null,6000);
    if(b._new)newSpecies(b);
  } else {
    S.rescueQ.push({sp,h});sfx('alert');
    toast('🚑 '+L('A hurt bug is waiting! Make room for it.','Un insecte blessé attend ! Fais-lui de la place.'),'err');
  }
  refreshUI();
}
function takeRescue(i){
  const q=S.rescueQ[i];if(!q)return;
  const h=freeSlots(q.h)>0?q.h:S.habs.find(x=>freeSlots(x)>0);
  if(!h){toast(L('All habitats are full. Move a bug to storage or release one.','Tous les habitats sont pleins. Range ou relâche un insecte.'),'err');sfx('err');return false;}
  S.rescueQ.splice(i,1);
  const b=makeBug(q.sp,{sick:1});b.h=h;b.hun=40;S.bugs.push(b);
  if(h!==S.cur)goHab(h);
  spawnArrival(b);if(b._new)newSpecies(b);
  toast(L('Tap the hurt bug to care for it 🩹','Touche l’insecte blessé pour le soigner 🩹'));
  refreshUI();return true;
}

/* ---------------- healing ---------------- */
function startHeal(b){
  b.sick=0;b.heal=now()+TUNE.HEAL_SEC[SP[b.sp].r]*1000;
  save();refreshUI();
}
function finishHeal(b,quiet){
  b.heal=0;b.sick=0;b.hun=Math.max(b.hun,60);
  S.st.heals++;questProg('heal',1);
  if(!quiet){sfx('heal');toast('💚 '+b.name+' '+L('is all better!','va mieux !'),'gold');}
  if(b.rescue){b.rescue=0;if(!quiet)setTimeout(()=>askReleaseAfterHeal(b),500);}
  checkBadges();
}

/* ---------------- release ---------------- */
function releaseReward(b){const r=SP[b.sp].r;return{coins:Math.round(RAR[r].rel*(1+.1*(b.lv-1))*(1+.5*S.prestige)),gems:RAR[r].gem};}
function doRelease(b){
  const rw=releaseReward(b);
  S.bugs=S.bugs.filter(x=>x!==b);S.box=S.box.filter(x=>x!==b);
  addCoins(rw.coins);S.gems+=rw.gems;
  const j=S.journal[b.sp]||(S.journal[b.sp]={rel:0,t:now()});j.rel=(j.rel||0)+1;
  S.st.rel++;sfx('release');
  toast('🕊️ '+b.name+' '+L('flew free!','est libre !')+' +'+fmt(rw.coins)+' 🪙'+(rw.gems?' +'+rw.gems+' 💎':''),'gold');
  spawnRelease(b);
  checkBadges();save();refreshUI();
}

/* ---------------- quests ---------------- */
function ensureQuests(){
  const d=dayNum(now());
  if(S.quests&&S.quests.day===d)return;
  const pool=QUESTS.slice();const list=[];
  ['pet','heal','game'].forEach(id=>list.push({id,p:0,c:0}));
  S.quests={day:d,list};
}
function questReward(){return Math.round(150+totalRate()*240);}
function questProg(id,n){
  ensureQuests();
  S.quests.list.forEach(q=>{if(q.id===id&&!q.c){const Q=QUESTS.find(x=>x.id===id);const was=q.p>=Q.goal;q.p=Math.min(Q.goal,q.p+n);if(!was&&q.p>=Q.goal){toast('📜 '+L('Task done! Claim it with Barnaby.','Tâche finie ! Récupère-la avec Barnaby.'),'gold');}}});
  if(id==='feed')S.st.feeds+=0;
  refreshUI();
}
function questsReady(){ensureQuests();return S.quests.list.filter(q=>!q.c&&q.p>=QUESTS.find(x=>x.id===q.id).goal).length+(S.giftDay!==dayNum(now())?1:0);}

/* ---------------- badges ---------------- */
function checkBadges(){
  BADGES.forEach(b=>{if(!S.badges[b.id]&&b.ok(S)){S.badges[b.id]=now();S.gems+=b.g;
    setTimeout(()=>{toast('🏅 '+L('Badge','Badge')+': '+N(b.n)+'  +'+b.g+' 💎','new');sfx('badge');},300);}});
}

/* ---------------- offline progress ---------------- */
function catchUp(){
  const t=now();let el=(t-(S.last||t))/1000;
  if(el<30)return;
  const capS=offCapH()*3600;
  const sim=Math.min(el,capS);
  S.away=0;
  // simulate in chunks so hunger etc. progress
  let left=sim;const step=Math.max(60,sim/120);
  while(left>0){const d=Math.min(step,left);simTick(d,true);left-=d;}
  // time beyond the cap: things still dry out / get messy, no coins
  if(el>capS){const extra=Math.min(el-capS,86400);
    S.bugs.forEach(b=>{b.hun=Math.max(0,b.hun-extra*100/TUNE.HUNGER_SEC);if(S.helpers.feeder&&b.hun<60)b.hun=100;});
    S.habs.forEach(h=>{const H=S.hab[h];H.plants.forEach(p=>{if(p){p.w=Math.max(0,p.w-extra*100/TUNE.WATER_SEC);if(S.helpers.gardener)p.w=100;}});});}
  S.habs.forEach(h=>{S.hab[h].tDirt=Math.max(S.hab[h].tDirt,t-TUNE.DIRT_SEC*1000);S.hab[h].tVisit=t;S.hab[h].tSick=t;});
  S.away=Math.floor(S.away);
  if(S.away>0&&el>120)setTimeout(()=>showWelcomeBack(el,el>capS),600);
}

/* =====================================================================
   BUGGIES — calm nature sounds (all made with Web Audio, no files)
===================================================================== */
let AC=null, MG=null, SG=null, ambT=null, musT=null, musOn=false, paused=false;
function audioStart(){
  if(AC){if(AC.state==='suspended'&&!paused)AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  MG=AC.createGain();MG.connect(AC.destination);musicVol();
  SG=AC.createGain();SG.gain.value=1;SG.connect(AC.destination);
  startAmbience();startMusic();
}
function musicVol(){if(MG)MG.gain.value=S.vol.music*.6;}
function musicPause(p){paused=p;if(!AC)return;if(p)AC.suspend();else AC.resume();}
document.addEventListener('visibilitychange',()=>{if(document.hidden){musicPause(true);save();}else{musicPause(false);}});

function noise(sec){const b=AC.createBuffer(1,AC.sampleRate*sec,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
/* soft wind bed + birds by day / crickets at night */
function startAmbience(){
  const src=AC.createBufferSource();src.buffer=noise(4);src.loop=true;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
  const g=AC.createGain();g.gain.value=.05;
  const lfo=AC.createOscillator();lfo.frequency.value=.07;const lg=AC.createGain();lg.gain.value=.035;lfo.connect(lg);lg.connect(g.gain);lfo.start();
  src.connect(f);f.connect(g);g.connect(MG);src.start();
  const tick=()=>{
    if(!document.hidden&&AC.state==='running'){
      const night=S.cur==='n'||isNightReal();
      if(night){cricket();}
      else if(Math.random()<.6)bird();
      if(S.cur==='p'&&Math.random()<.4)plop();
    }
    ambT=setTimeout(tick,rnd(1500,4500));
  };tick();
}
function bird(){
  const t=AC.currentTime,n=Math.floor(rnd(2,6)),base=rnd(2200,3600);
  for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
    const st=t+i*rnd(.09,.16);o.frequency.setValueAtTime(base,st);o.frequency.exponentialRampToValueAtTime(base*rnd(1.2,1.6),st+.06);o.frequency.exponentialRampToValueAtTime(base*.9,st+.1);
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.025,st+.02);g.gain.linearRampToValueAtTime(0,st+.11);
    o.connect(g);g.connect(MG);o.start(st);o.stop(st+.13);}
}
function cricket(){
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),am=AC.createOscillator(),ag=AC.createGain();
  o.frequency.value=rnd(4200,4800);am.frequency.value=28;ag.gain.value=.012;
  g.gain.value=0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.012,t+.05);g.gain.setValueAtTime(.012,t+.5);g.gain.linearRampToValueAtTime(0,t+.6);
  am.connect(ag);ag.connect(g.gain);o.connect(g);g.connect(MG);o.start(t);am.start(t);o.stop(t+.65);am.stop(t+.65);
}
function plop(){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(220,t+.12);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(MG);o.start(t);o.stop(t+.16);}
/* slow, soft music: gentle notes on a pentatonic scale with an echo */
function startMusic(){
  const dl=AC.createDelay();dl.delayTime.value=.45;const fb=AC.createGain();fb.gain.value=.35;const wet=AC.createGain();wet.gain.value=.4;
  dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(MG);
  const scale=[0,2,4,7,9,12,14,16];const roots=[57,60,55,53];let bar=0;
  const play=()=>{
    if(!document.hidden&&AC.state==='running'){
      const root=roots[Math.floor(bar/4)%roots.length];bar++;
      const t=AC.currentTime;
      // pad
      if(bar%4===1)[0,7,12].forEach(iv=>tone(root-12+iv,t,3.6,.018,'triangle',dl));
      // melody
      for(let i=0;i<2;i++)if(Math.random()<.75)tone(root+pick(scale),t+i*.9+rnd(0,.1),1.4,.035,'sine',dl);
    }
    musT=setTimeout(play,1800);
  };play();
}
function tone(midi,t,dur,vol,type,fx){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=440*Math.pow(2,(midi-69)/12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.06);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  o.connect(g);g.connect(MG);if(fx)g.connect(fx);o.start(t);o.stop(t+dur+.05);
}
/* sound effects */
function sfx(k){
  if(!AC||!S||S.vol.sfx<=0||AC.state!=='running')return;
  const t=AC.currentTime,v=S.vol.sfx*.22;
  const beep=(f,st,d,type,vol,f2)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t+st);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+st+d);
    g.gain.setValueAtTime(0,t+st);g.gain.linearRampToValueAtTime(v*(vol||1),t+st+.01);g.gain.exponentialRampToValueAtTime(.0005,t+st+d);o.connect(g);g.connect(SG);o.start(t+st);o.stop(t+st+d+.02);};
  switch(k){
    case 'tap':beep(660,0,.06,'sine',.5);break;
    case 'pet':beep(520,0,.12,'sine',.6,780);beep(780,.08,.14,'sine',.4,1040);break;
    case 'coin':beep(988,0,.08,'square',.25);beep(1319,.07,.18,'square',.25);break;
    case 'eat':for(let i=0;i<3;i++)beep(300+i*40,i*.07,.06,'triangle',.6);break;
    case 'water':beep(900,0,.12,'sine',.5,400);beep(1100,.06,.1,'sine',.3,500);break;
    case 'sweep':{const s=AC.createBufferSource();s.buffer=noise(.2);const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2500;const g=AC.createGain();g.gain.setValueAtTime(v*.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);s.connect(f);f.connect(g);g.connect(SG);s.start(t);break;}
    case 'plant':beep(392,0,.15,'triangle',.7);beep(523,.1,.2,'triangle',.6);break;
    case 'buy':beep(784,0,.08,'triangle',.6);beep(1047,.08,.16,'triangle',.6);break;
    case 'level':[523,659,784,1047].forEach((f,i)=>beep(f,i*.08,.2,'triangle',.5));break;
    case 'heal':[659,784,988,1319].forEach((f,i)=>beep(f,i*.1,.35,'sine',.5));break;
    case 'bandage':beep(440,0,.08,'triangle',.6,520);break;
    case 'release':[1047,880,1175,1568].forEach((f,i)=>beep(f,i*.12,.4,'sine',.4));break;
    case 'unlock':[392,523,659,784,1047].forEach((f,i)=>beep(f,i*.09,.3,'triangle',.5));break;
    case 'new':[784,988,1175,1568].forEach((f,i)=>beep(f,i*.1,.4,'sine',.5));break;
    case 'badge':[659,880,1319].forEach((f,i)=>beep(f,i*.1,.3,'square',.2));break;
    case 'alert':beep(880,0,.15,'triangle',.6);beep(660,.18,.2,'triangle',.6);break;
    case 'err':beep(220,0,.18,'sawtooth',.25);break;
    case 'match':beep(700+Math.random()*300,0,.12,'triangle',.5);break;
    case 'win':[523,659,784,1047,1319].forEach((f,i)=>beep(f,i*.1,.35,'triangle',.5));break;
    case 'lose':[392,330,262].forEach((f,i)=>beep(f,i*.15,.3,'triangle',.4));break;
  }
}
function noteSfx(i){if(!AC||AC.state!=='running')return;const f=[523,587,659,784,880,1047,1175,1319,1568][i%9];const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(S.vol.sfx*.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g);g.connect(SG);o.start(t);o.stop(t+.42);}

/* =====================================================================
   BUGGIES — the living habitat scene (canvas) + touch
===================================================================== */
const CV=$('scene'), CX=CV.getContext('2d');
let W=0,H=0,DPR=1,BH=0,TOP=0,BOT=0;
const ENT={};          // runtime movement per bug uid
let FX=[];             // particles
let tGlobal=0;
const WATER_BUGS={waterstrider:1,whirligig:1,divingbeetle:1,giantwaterbug:1};

function safeTop(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat'))||0;}
function resize(){
  const r=$('app').getBoundingClientRect();
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=r.width;H=r.height;CV.width=W*DPR;CV.height=H*DPR;
  TOP=104;BOT=H-140;BH=BOT+30;
  for(const k in _bg)delete _bg[k];
}
function resetScene(){for(const k in ENT)delete ENT[k];FX=[];}

/* ---------- layout helpers ---------- */
function plantPos(i){return{x:W*(.13+.248*i),y:BH*.86};}
function plantSize(){return Math.min(W*.22,BH*.2);}
function dirtPos(d){return{x:d.x*W,y:BH*.6+d.y*(BH*.36)};}
function bugSize(b){const sp=SP[b.sp];return clamp(Math.min(W,BH)*.17*sp.s,46,140);}
function inWater(x,y){return Math.hypot((x-W*.5)/(W*.52),(y-BH*.76)/(BH*.17))<1;}
function region(b){
  const sp=SP[b.sp];
  if(b.h==='p'&&WATER_BUGS[b.sp])return'water';
  return FLYERS[sp.t]?'air':'ground';
}
function randPoint(reg){
  if(reg==='air')return{x:rnd(W*.1,W*.9),y:rnd(TOP+40,BH*.7)};
  if(reg==='water'){for(let i=0;i<30;i++){const x=rnd(W*.1,W*.9),y=rnd(BH*.6,BH*.92);if(inWater(x,y))return{x,y};}return{x:W*.5,y:BH*.76};}
  return{x:rnd(W*.08,W*.92),y:rnd(BH*.6,BH*.97)};
}
function ent(b){
  let e=ENT[b.uid];
  if(!e){const reg=region(b);const p=randPoint(reg);e=ENT[b.uid]={x:p.x,y:p.y,tx:p.x,ty:p.y,ang:rnd(0,6.28),mode:'move',wait:0,reg,seed:Math.random()*10,spd:0,perch:-1};}
  return e;
}
function spawnArrival(b){
  if(b.h!==S.cur)return;
  const e=ent(b);
  if(e.reg==='air'){e.x=Math.random()<.5?-40:W+40;e.y=rnd(TOP+40,BH*.5);}
  else{e.x=Math.random()<.5?-30:W+30;}
  for(let i=0;i<14;i++)FX.push({k:'spark',x:e.tx,y:e.ty,vx:rnd(-60,60),vy:rnd(-80,20),life:1});
}
function spawnRelease(b){
  const e=ENT[b.uid];if(!e)return;
  FX.push({k:'ghost',sp:b.sp,x:e.x,y:e.y,vx:rnd(-30,30),vy:-120,life:2.2,size:bugSize(b)});
  for(let i=0;i<12;i++)FX.push({k:'heart',x:e.x,y:e.y,vx:rnd(-50,50),vy:rnd(-120,-40),life:1.3});
  delete ENT[b.uid];
}

/* ---------- movement ---------- */
function stepBug(b,e,dt){
  const sp=SP[b.sp], awake=bugAwake(b)&&!b.sick&&!b.heal;
  e.reg=region(b);
  const fly=e.reg==='air';
  if(!awake){
    // land and rest
    if(fly&&e.mode!=='rest'){const p=randPoint('ground');e.tx=p.x;e.ty=p.y;e.mode='land';}
    if(!fly)e.mode='rest';
  }
  const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy);
  let sp0=fly?(sp.t==='dr'||sp.t==='da'?150:sp.t==='bee'?90:60):(sp.t==='ws'?70:sp.t==='ho'?40:22);
  if(!awake)sp0*=.6;
  if(e.mode==='rest'||e.mode==='perch'){e.walk=false;e.flap=0;
    e.wait-=dt;if(e.wait<=0&&awake){const p=randPoint(e.reg);e.tx=p.x;e.ty=p.y;e.mode='move';}
    return;}
  if(d<4){
    if(e.mode==='land'){e.mode='rest';e.wait=9e9;return;}
    // sometimes perch on a plant (flyers) or pause (walkers)
    if(fly&&Math.random()<.45){
      const pl=S.hab[S.cur].plants.map((p,i)=>p?i:-1).filter(i=>i>=0);
      if(pl.length&&e.perch<0&&(sp.t==='bf'||sp.t==='bee'||sp.t==='mo')){const i=pick(pl),pp=plantPos(i),s=plantSize();e.tx=pp.x+rnd(-s*.2,s*.2);e.ty=pp.y-s*rnd(.8,1.1);e.perch=i;return;}
    }
    if(e.perch>=0){e.mode='perch';e.wait=rnd(3,8);e.perch=-1;return;}
    e.mode='rest';e.wait=fly?rnd(.2,1.2):rnd(1,4);return;
  }
  const v=Math.min(d,sp0*dt);
  const wob=fly?Math.sin(tGlobal*3+e.seed)*20*dt:0;
  e.x+=dx/d*v; e.y+=dy/d*v+wob;
  const ta=Math.atan2(dy,dx);
  let da=ta-e.ang;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
  e.ang+=da*Math.min(1,dt*(fly?5:4));
  e.walk=!fly;e.flap=fly?1:0;
}

/* ---------- render ---------- */
function render(dt){
  tGlobal+=dt;
  const c=CX;c.setTransform(DPR,0,0,DPR,0,0);
  const h=S.cur, night=h==='n'?true:isNightReal();
  const bg=habitatBG(h,Math.ceil(W),Math.ceil(BH),night);
  c.drawImage(bg,0,0);
  c.fillStyle=night?'#0d1a12':(h==='f'?'#3a2614':'#3f8a34');c.fillRect(0,BH-1,W,H-BH+1);
  if(h==='n'&&!isNightReal()&&!lanternOn()){c.fillStyle='rgba(255,230,180,.08)';c.fillRect(0,0,W,H);}
  /* night garden glow when lantern lit */
  if(h==='n'&&lanternOn()){const g=c.createRadialGradient(W*.5,BH*.7,10,W*.5,BH*.7,W*.7);g.addColorStop(0,'rgba(255,200,120,.18)');g.addColorStop(1,'rgba(255,200,120,0)');c.fillStyle=g;c.fillRect(0,0,W,H);}
  const H0=S.hab[h];
  /* decor (emoji) */
  const placed=DECOR.filter(d=>S.decor[d.id]&&(d.h===h));
  placed.forEach((d,i)=>{c.font=Math.round(BH*.055)+'px serif';c.textAlign='center';c.fillText(d.e,W*(.08+((i*.31)%0.84)),BH*.7+((i%2)*BH*.04));});
  const glob=DECOR.filter(d=>S.decor[d.id]&&d.h==='*');
  glob.forEach((d,i)=>{c.font=Math.round(BH*.045)+'px serif';c.textAlign='center';c.fillText(d.e,W*(.94-i*.07),BH*.66);});
  /* dirt */
  H0.dirt.forEach(d=>{const p=dirtPos(d);drawDirt(c,{x:p.x,y:p.y,k:d.k,r:d.r},Math.min(W,BH)*.06);});
  /* plants */
  const ps=plantSize();
  H0.plants.forEach((p,i)=>{
    const pp=plantPos(i);
    c.fillStyle='rgba(60,36,18,.85)';ell(c,pp.x,pp.y+2,ps*.33,ps*.09);c.fill();
    c.fillStyle='rgba(110,70,40,.9)';ell(c,pp.x,pp.y,ps*.3,ps*.07);c.fill();
    if(!p){c.fillStyle='rgba(255,255,255,.85)';circ(c,pp.x,pp.y-ps*.25,ps*.16);c.fill();c.fillStyle='#2f8a52';c.font='bold '+Math.round(ps*.24)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('+',pp.x,pp.y-ps*.24);c.textBaseline='alphabetic';return;}
    drawPlant(c,p.id,pp.x,pp.y,ps,p.w<=0,tGlobal);
    if(p.w<45){c.font=Math.round(ps*.2)+'px serif';c.textAlign='center';c.globalAlpha=.6+.4*Math.sin(tGlobal*4);c.fillText('💧',pp.x+ps*.3,pp.y-ps*.6);c.globalAlpha=1;}
  });
  /* bugs */
  const list=bugsIn(h);
  const order=list.map(b=>({b,e:ent(b)})).sort((a,b)=>(region(a.b)==='air')-(region(b.b)==='air')||a.e.y-b.e.y);
  order.forEach(({b,e})=>{
    stepBug(b,e,dt);
    const sp=SP[b.sp],sz=bugSize(b),aw=bugAwake(b)&&!b.sick&&!b.heal;
    const reg=region(b);
    if(reg==='air'&&e.mode==='move'){c.fillStyle='rgba(0,0,0,.12)';ell(c,e.x,Math.max(e.y+sz*.9,BH*.62),sz*.3,sz*.08);c.fill();}
    drawBug(c,sp,e.x,e.y,sz,e.ang,tGlobal+e.seed,{flap:e.flap&&aw?1:0,walk:e.walk&&aw,sleep:!aw,night:night||lanternOn(),seed:e.seed,shadow:reg!=='air',water:reg==='water'});
    if(b.sick||b.heal){c.font=Math.round(sz*.38)+'px serif';c.textAlign='center';c.fillText(b.heal?'🩹':'🤒',e.x,e.y-sz*.55-Math.abs(Math.sin(tGlobal*3))*5);
      if(b.heal){const left=(b.heal-now())/1000;c.font='bold 12px Lexend,sans-serif';c.fillStyle='#fff';c.strokeStyle='rgba(0,0,0,.6)';c.lineWidth=3;c.strokeText(fmtTime(left),e.x,e.y+sz*.7);c.fillText(fmtTime(left),e.x,e.y+sz*.7);}}
    else if(!aw){c.font='bold '+Math.round(sz*.3)+'px Lexend,sans-serif';c.fillStyle='rgba(255,255,255,.9)';c.textAlign='center';const z=(tGlobal*.7+e.seed)%1;c.globalAlpha=1-z;c.fillText('z',e.x+sz*.3+z*10,e.y-sz*.4-z*20);c.globalAlpha=1;}
    else if(b.hun<40){c.font=Math.round(sz*.3)+'px serif';c.textAlign='center';c.fillText('😋',e.x,e.y-sz*.55);}
  });
  /* particles */
  FX=FX.filter(f=>(f.life-=dt)>0);
  FX.forEach(f=>{
    f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=(f.k==='drop'?400:f.k==='ghost'?-30:20)*dt;
    const a=Math.min(1,f.life);
    c.globalAlpha=a;
    if(f.k==='heart'){c.font='20px serif';c.textAlign='center';c.fillText('💚',f.x,f.y);}
    else if(f.k==='txt'){c.font='bold 17px Lexend,sans-serif';c.textAlign='center';c.fillStyle=f.col||'#ffe27a';c.strokeStyle='rgba(0,0,0,.55)';c.lineWidth=3;c.strokeText(f.t,f.x,f.y);c.fillText(f.t,f.x,f.y);}
    else if(f.k==='spark'){c.fillStyle='#fff8c0';circ(c,f.x,f.y,2.5);c.fill();}
    else if(f.k==='drop'){c.fillStyle='#7fd0ff';ell(c,f.x,f.y,2.5,4);c.fill();}
    else if(f.k==='dust'){c.fillStyle='rgba(170,130,80,.8)';circ(c,f.x,f.y,3);c.fill();}
    else if(f.k==='ghost'){drawBug(c,SP[f.sp],f.x,f.y,f.size,-Math.PI/2,tGlobal,{flap:1});}
    c.globalAlpha=1;
  });
}

/* ---------- touch ---------- */
let press=null;
function hitBug(x,y){
  let best=null,bd=1e9;
  bugsIn(S.cur).forEach(b=>{const e=ENT[b.uid];if(!e)return;const r=Math.max(34,bugSize(b)*.6);const d=Math.hypot(e.x-x,e.y-y);if(d<r&&d<bd){bd=d;best=b;}});
  return best;
}
function hitDirt(x,y){const s=Math.min(W,BH)*.06;return S.hab[S.cur].dirt.find(d=>{const p=dirtPos(d);return Math.hypot(p.x-x,p.y-y)<Math.max(26,s*.9);});}
function hitPlant(x,y){const s=plantSize();for(let i=0;i<4;i++){const p=plantPos(i);if(Math.abs(x-p.x)<s*.38&&y<p.y+s*.15&&y>p.y-s*(S.hab[S.cur].plants[i]?1.25:.55))return i;}return -1;}
function pointerPos(ev){const r=CV.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};}
CV.addEventListener('pointerdown',ev=>{
  audioStart();
  const p=pointerPos(ev);
  const b=hitBug(p.x,p.y);
  press={x:p.x,y:p.y,b,t:now(),long:false};
  if(b){press.timer=setTimeout(()=>{if(press&&press.b===b){press.long=true;sfx('tap');openBugCard(b);}},520);}
});
CV.addEventListener('pointermove',ev=>{if(!press)return;const p=pointerPos(ev);if(Math.hypot(p.x-press.x,p.y-press.y)>18){clearTimeout(press.timer);press.moved=true;
  // swipe-to-clean: rub over dirt
  const d=hitDirt(p.x,p.y);if(d)cleanDirt(d);}});
CV.addEventListener('pointerup',ev=>{
  if(!press)return;clearTimeout(press.timer);
  const p=pointerPos(ev),pr=press;press=null;
  if(pr.long)return;
  if(pr.b&&!pr.moved){tapBug(pr.b);return;}
  if(pr.moved)return;
  const d=hitDirt(p.x,p.y);if(d){cleanDirt(d);return;}
  const pi=hitPlant(p.x,p.y);if(pi>=0){tapPlant(pi);return;}
});
CV.addEventListener('pointercancel',()=>{if(press)clearTimeout(press.timer);press=null;});

function tapBug(b){
  const e=ENT[b.uid];
  if(b.sick){openCare(b);return;}
  if(b.heal){openHealWait(b);return;}
  // pet!
  const t=now();
  for(let i=0;i<3;i++)FX.push({k:'heart',x:e.x+rnd(-10,10),y:e.y-10,vx:rnd(-40,40),vy:rnd(-110,-60),life:1.1});
  sfx('pet');
  if(b._pt&&t-b._pt<1200)return;
  b._pt=t;
  const amt=Math.max(1,Math.round(bugRate(b,true)*4));
  addCoins(amt);
  FX.push({k:'txt',t:'+'+fmt(amt),x:e.x,y:e.y-bugSize(b)*.6,vx:0,vy:-50,life:1.1});
  S.st.pets++;questProg('pet',1);
  if(halloweenOn()&&Math.random()<(SP[b.sp].ev?.25:.06)){S.candy++;FX.push({k:'txt',t:'+1 🍬',x:e.x+20,y:e.y-bugSize(b)*.9,vx:0,vy:-40,life:1.3,col:'#ffb0e0'});}
  if(e.mode==='rest'||e.mode==='perch'){e.wait=Math.min(e.wait,.6);}
  if(S.tut===2)tutNext();
  checkBadges();refreshHUD();
}
function cleanDirt(d){
  const H0=S.hab[S.cur];H0.dirt=H0.dirt.filter(x=>x!==d);
  const p=dirtPos(d);for(let i=0;i<6;i++)FX.push({k:'dust',x:p.x,y:p.y,vx:rnd(-60,60),vy:rnd(-90,-20),life:.6});
  addCoins(Math.max(2,Math.round(totalRate()*2)));
  S.st.cleans++;questProg('clean',1);sfx('sweep');
  if(S.tut===5)tutNext();
  checkBadges();refreshHUD();
}
function tapPlant(i){
  const H0=S.hab[S.cur],p=H0.plants[i];
  if(!p){openPlantPicker(i);return;}
  if(p.w<90){p.w=100;const pp=plantPos(i),s=plantSize();for(let k=0;k<12;k++)FX.push({k:'drop',x:pp.x+rnd(-s*.25,s*.25),y:pp.y-s*rnd(.8,1.1),vx:rnd(-20,20),vy:rnd(-40,0),life:.8});
    sfx('water');S.st.waters++;questProg('water',1);return;}
  const who=SPECIES.filter(s=>s.pl===p.id&&!s.paid&&!s.ev).map(s=>S.journal[s.id]?N(s.n):'???');
  toast('🌱 '+N(PLANTS[p.id].n)+' '+L('attracts','attire')+': '+who.join(', '));
}

/* ---------- care mini-game (bandages + drops) ---------- */
function openCare(b){
  const wounds=[[.3,.32],[.68,.38],[.42,.7],[.62,.66],[.35,.5]].sort(()=>Math.random()-.5).slice(0,3).map(p=>({x:p[0]+rnd(-.04,.04),y:p[1]+rnd(-.04,.04),done:false}));
  let drops=0;
  const draw=()=>{
    const cv=$('careCv');if(!cv)return;const c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);
    c.fillStyle='#eef3e4';c.fillRect(0,0,cv.width,cv.height);
    drawBug(c,SP[b.sp],cv.width/2,cv.height/2,cv.width*.62,-Math.PI/2,1,{flap:0});
    wounds.forEach(w=>{const x=w.x*cv.width,y=w.y*cv.height;
      if(w.done){c.save();c.translate(x,y);c.rotate(-.5);c.fillStyle='#f6e2c0';c.fillRect(-26,-9,52,18);c.fillStyle='#e8c89a';c.fillRect(-8,-9,16,18);c.restore();}
      else{c.strokeStyle='#d0303a';c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(x-14,y-8);c.lineTo(x+14,y+8);c.moveTo(x-6,y-12);c.lineTo(x+4,y+12);c.stroke();
        c.strokeStyle='rgba(255,80,80,.35)';c.lineWidth=3;circ(c,x,y,24+Math.sin(now()/200)*3);c.stroke();}});
  };
  const all=()=>wounds.every(w=>w.done);
  const foot=()=>{
    const f=$('careFoot');if(!f)return;
    if(!all())f.innerHTML='<p>'+L('Tap the red scratches to put on bandages.','Touche les égratignures rouges pour mettre des pansements.')+'</p>';
    else f.innerHTML='<p>'+L('Now give 3 drops of nectar medicine.','Donne maintenant 3 gouttes de nectar-remède.')+'</p><button class="btn wide ad" id="careDrop" style="background:#2a7fb0;box-shadow:0 3px 0 #1a5070">💧 '+L('Give a drop','Donner une goutte')+' ('+drops+'/3)</button>';
    if($('careDrop'))$('careDrop').onclick=()=>{drops++;sfx('water');if(drops>=3){sfx('heal');closeModal();startHeal(b);openHealWait(b,true);}else foot();};
  };
  openModal('<h3>🩹 '+L('Help','Soigne')+' '+esc(b.name)+'</h3><canvas id="careCv" width="300" height="260" style="width:100%;border-radius:18px;touch-action:none"></canvas><div id="careFoot"></div>');
  const cv=$('careCv');
  cv.onpointerdown=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    const w=wounds.find(w=>!w.done&&Math.hypot((w.x-x)*1.15,w.y-y)<.12);if(w){w.done=true;sfx('bandage');draw();foot();}};
  draw();foot();
  const iv=setInterval(()=>{if(!$('careCv')){clearInterval(iv);return;}draw();},120);
}
function openHealWait(b,fresh){
  if(!b.heal)return;
  const left=()=>Math.max(0,(b.heal-now())/1000);
  openModal('<div style="text-align:center"><img src="'+thumb(b.sp,110)+'" style="width:110px;height:110px"></div><h3>'+(fresh?L('Great care! 💚','Super soins ! 💚'):'🩹 '+esc(b.name))+'</h3>'+
    '<p>'+L('Now '+b.name+' needs to rest.','Maintenant '+b.name+' doit se reposer.')+'</p><div class="amt" id="hwT">'+fmtTime(left())+'</div>'+
    '<button class="btn wide ad" id="hwAd">'+(S.noads?'✨ '+L('Heal now (free)','Guérir maintenant (gratuit)'):'📺 '+L('Watch a video to heal now','Regarde une vidéo pour guérir'))+'</button>'+
    '<button class="btn wide ghost" id="hwOk">'+L('OK, wait','OK, attendre')+'</button>');
  const iv=setInterval(()=>{const el=$('hwT');if(!el||!b.heal){clearInterval(iv);if(el&&!b.heal)closeModal();return;}el.textContent=fmtTime(left());},500);
  $('hwOk').onclick=()=>{sfx('tap');closeModal();};
  $('hwAd').onclick=async()=>{const ok=await rewardAd('heal');if(ok&&b.heal){closeModal();finishHeal(b);save();refreshUI();}};
}

function openBugs(keep){
  const list=bugsIn(S.cur);
  const row=(b,inBox)=>{const m=mood(b);return '<div class="card"><div class="art"><img src="'+thumb(b.sp,62)+'"></div><div class="info"><div class="nm">'+esc(b.name)+' <span class="tag" style="background:'+RAR[SP[b.sp].r].col+'">⭐'+b.lv+'</span></div><div class="sub">'+N(SP[b.sp].n)+(inBox?'':' · '+m.e+' '+m.t)+'</div></div>'+
    (inBox?'<button class="btn" data-out="'+b.uid+'">'+L('Bring here','Placer ici')+'</button>':'<button class="btn ghost" data-card="'+b.uid+'">ℹ️</button>')+'</div>';};
  let h='<div class="hl">'+HAB(S.cur).e+' '+N(HAB(S.cur).n)+' · '+list.length+'/'+S.hab[S.cur].slots+'</div>';
  h+=list.length?list.map(b=>row(b,false)).join(''):'<p class="note">'+L('No bugs here yet. Plant flowers to bring visitors!','Pas encore d’insectes ici. Plante des fleurs pour attirer des visiteurs !')+'</p>';
  h+='<p class="note">'+L('Tip: hold a bug in the habitat to see its card.','Astuce : garde ton doigt sur un insecte pour voir sa fiche.')+'</p>';
  h+='<div class="hl">📦 '+L('Storage box','Boîte de rangement')+' · '+S.box.length+'</div>';
  h+=S.box.length?S.box.map(b=>row(b,true)).join(''):'<p class="note">'+L('Bugs in storage rest and don’t earn coins.','Les insectes rangés se reposent et ne gagnent pas de pièces.')+'</p>';
  if(!keep||sheetKind!=='bugs')openSheet('📦 '+L('Bugs','Insectes'),h,'bugs');else $('shBody').innerHTML=h;
  $('shBody').querySelectorAll('[data-card]').forEach(bt=>bt.onclick=()=>{const b=S.bugs.find(x=>x.uid==bt.dataset.card);if(b)openBugCard(b);});
  $('shBody').querySelectorAll('[data-out]').forEach(bt=>bt.onclick=()=>{
    const b=S.box.find(x=>x.uid==bt.dataset.out);if(!b)return;
    if(freeSlots(S.cur)<=0){toast(L('This habitat is full','Cet habitat est plein'),'err');sfx('err');return;}
    S.box=S.box.filter(x=>x!==b);b.h=S.cur;S.bugs.push(b);spawnArrival(b);sfx('tap');save();refreshUI();openBugs(true);});
}
function openRescue(){
  let h='<p class="note">'+L('These hurt bugs need a free spot. Make room by storing 📦 or releasing 🕊️ a bug.','Ces insectes blessés ont besoin d’une place libre. Range 📦 ou relâche 🕊️ un insecte pour faire de la place.')+'</p>';
  S.rescueQ.forEach((q,i)=>{h+='<div class="card"><div class="art"><img src="'+thumb(q.sp,62)+'"></div><div class="info"><div class="nm">🤒 '+N(SP[q.sp].n)+'</div><div class="sub">'+HAB(q.h).e+' '+N(HAB(q.h).n)+'</div></div><button class="btn red" data-r="'+i+'">🚑 '+L('Take in','Accueillir')+'</button></div>';});
  h+='<button class="btn wide ghost" id="rsBugs">📦 '+L('Manage bugs','Gérer les insectes')+'</button>';
  openSheet('🚑 '+L('Rescue','Sauvetage'),h,'rescue');
  $('shBody').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(takeRescue(+b.dataset.r)){closeSheet();}});
  $('rsBugs').onclick=()=>openBugs();
}

/* ---------- map ---------- */
function openMap(){
  let h='<p class="note">'+L('Pick where to go. You choose which habitat to open next!','Choisis où aller. C’est toi qui choisis le prochain habitat !')+'</p>';
  HABS.forEach(hb=>{
    const open=S.habs.includes(hb.id);
    const cv='<canvas data-hb="'+hb.id+'" width="160" height="120" style="width:80px;height:60px;border-radius:12px"></canvas>';
    let right;
    if(open)right=S.cur===hb.id?'<span class="tag">'+L('You are here','Tu es ici')+'</span>':'<button class="btn" data-go="'+hb.id+'">'+L('Go','Aller')+'</button>';
    else right='<button class="btn gold" data-open="'+hb.id+'">🔓 '+fmt(habCost())+' 🪙</button>';
    const n=open?bugsIn(hb.id).length+'/'+S.hab[hb.id].slots+' '+L('bugs','insectes'):(hb.day?'':'🌙 '+L('Bugs wake up at night','Les insectes se réveillent la nuit'));
    h+='<div class="card"'+(S.cur===hb.id?' style="border-color:#6fe0a8"':'')+'><div class="art" style="width:80px;height:60px">'+cv+'</div><div class="info"><div class="nm">'+hb.e+' '+N(hb.n)+'</div><div class="sub">'+n+'</div></div>'+right+'</div>';
  });
  openSheet('🗺️ '+L('Sanctuary Map','Carte du refuge'),h,'map');
  $('shBody').querySelectorAll('canvas[data-hb]').forEach(cv=>{const c=cv.getContext('2d');c.drawImage(habitatBG(cv.dataset.hb,160,120,cv.dataset.hb==='n'),0,0);if(!S.habs.includes(cv.dataset.hb)){c.fillStyle='rgba(0,0,0,.45)';c.fillRect(0,0,160,120);c.font='40px serif';c.textAlign='center';c.fillText('🔒',80,75);}});
  $('shBody').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{sfx('tap');goHab(b.dataset.go);closeSheet();});
  $('shBody').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.open;if(!spend(habCost()))return;
    S.habs.push(id);S.hab[id]=newHab();
    sfx('unlock');goHab(id);closeSheet();checkBadges();save();
    barnabySay(L('Welcome to the ','Bienvenue au ')+N(HAB(id).n)+'! '+L('Plant something to bring new friends. 🌱','Plante quelque chose pour attirer de nouveaux amis. 🌱')+(id==='n'?' '+L('Night bugs sleep in the day. A 🏮 lantern from the Shop wakes them up.','Les insectes de nuit dorment le jour. Une lanterne 🏮 de la boutique les réveille.'):''),null,8000);
  });
}

  h+='<div class="hl">🏅 '+L('Badges','Badges')+' · '+Object.keys(S.badges).length+'/'+BADGES.length+'</div><div class="grid">';

function openUpgrades(){
  const card=(art,nm,sub,btn,id,cls,dis)=>'<div class="card"><div class="art">'+art+'</div><div class="info"><div class="nm">'+nm+'</div><div class="sub">'+sub+'</div></div><button class="btn '+(cls||'')+'" id="'+id+'"'+(dis?' disabled':'')+'>'+btn+'</button></div>';
  let h='';
  S.habs.forEach(id=>{
    const hb=HAB(id),H0=S.hab[id];
    h+='<div class="hl">'+hb.e+' '+N(hb.n)+'</div>';
    h+=card('🌼',L('Nectar quality','Qualité du nectar')+' · '+L('Lv','Niv')+' '+H0.lvl,L('Bugs here earn','Les insectes ici gagnent')+' +25% 🪙',fmt(lvlCost(id))+' 🪙','uL_'+id);
    h+=card('🏡',L('More space','Plus de place')+' · '+H0.slots+'/'+TUNE.SLOTSMAX,L('Room for one more bug','Place pour un insecte de plus'),H0.slots>=TUNE.SLOTSMAX?'MAX':fmt(slotCost(id))+' 🪙','uS_'+id,'',H0.slots>=TUNE.SLOTSMAX);

      ad.forEach(s=>{h+='<div class="card"><div class="art"><img src="'+thumb(s.id,62)+'"></div><div class="info"><div class="nm">'+N(s.n)+'</div><div class="sub"><span class="tag" style="background:'+RAR[s.r].col+'">'+N(RAR[s.r].n)+'</span> '+fmt(RAR[s.r].inc)+' 🪙/s</div></div><button class="btn" data-adopt="'+s.id+'" data-h="'+id+'">'+fmt(adoptCost(s.id))+' 🪙</button></div>';});}
  });
  h+='<div class="hl">🌍 '+L('Whole sanctuary','Tout le refuge')+'</div>';
  h+=card('🌙',L('Away time','Temps d’absence')+' · '+offCapH()+'h',L('Bugs keep earning while you’re away, up to this long.','Tes insectes gagnent pendant ton absence, jusqu’à cette durée.'),S.offLvl>=TUNE.OFF_MAXLV?'MAX':fmt(offCost())+' 🪙','uOff','',S.offLvl>=TUNE.OFF_MAXLV);

  [['gardener','🧑‍🌾',['Gardener','Jardinier'],['Waters all plants','Arrose toutes les plantes']],['feeder','🐝',['Feeder','Nourrisseur'],['Feeds hungry bugs','Nourrit les insectes affamés']],['cleaner','🧹',['Cleaner','Nettoyeur'],['Cleans up messes','Nettoie le désordre']]].forEach(x=>{
    const got=S.helpers[x[0]];
    h+=card(x[1],N(x[2]),N(x[3]),got?'✓ '+L('Hired','Engagé'):TUNE.HELPER_GEMS+' 💎','uH_'+x[0],'gem',got);});
  h+='<div class="hl">🪴 '+L('Decorations','Décorations')+'</div><p class="note">'+L('Decorations stay forever, even in a new season.','Les décorations restent pour toujours, même à la nouvelle saison.')+'</p>';
  DECOR.filter(d=>!d.ev).forEach(d=>{
    const got=S.decor[d.id], lock=d.h!=='*'&&!S.habs.includes(d.h);

  /* new season */
  const goal=prestigeGoal(),pct=Math.min(100,S.seasonCoins/goal*100);

  h+='<div class="card" style="display:block;border-color:#6fe0a8"><div class="nm">🍃 '+L('Start a new season','Commencer une nouvelle saison')+'</div>'+
    '<div class="sub">'+L('Your bugs return to nature and your sanctuary starts fresh. You get','Tes insectes retournent dans la nature et ton refuge recommence. Tu gagnes')+' <b>+10% 🪙 '+L('forever','pour toujours')+'</b>.</div>'+
