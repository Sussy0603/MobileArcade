<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0b3d5c"/>
<title>Fishies</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --line:rgba(255,255,255,.22);
    --gold:#ffce4d; --gold2:#ffa62b;
    --accent:#ff7fb0; --accent2:#7ce7c8;
    --bad:#ff6b6b;
    --ui-font:'Nunito',system-ui,sans-serif;
    --dis-font:'Baloo 2',system-ui,sans-serif;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body.web #mFree,body.web #mShop,body.web .coinplus{display:none!important}
  /* Feed mode: only the FEED button stays usable, so taps never hit other buttons */
  body.feedlock .hud,body.feedlock .strip,body.feedlock #boostRow,body.feedlock .dock .tool:not(#tFeed){pointer-events:none!important;opacity:.35;transition:opacity .2s}
  body.feedlock .hud,body.feedlock .strip{opacity:.6}
  body.lite .tool.armed,body.feedlock .tool.armed{background:linear-gradient(180deg,var(--gold),var(--gold2))!important;color:#3a2500!important;opacity:1!important}body.lite .tool.armed .tx{color:#3a2500!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:var(--ui-font);background:#03151f;color:#fff;
    display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
  #app{position:relative;width:100%;height:100%;max-width:520px;max-height:100vh;
    overflow:hidden;background:#062a45;box-shadow:0 0 80px rgba(0,0,0,.6)}
  @media(min-width:700px){#app{max-width:min(92vw,900px)}}
  canvas#tank{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .hud{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;gap:8px;align-items:flex-start;z-index:20;pointer-events:none}
  .hud>*{pointer-events:auto}
  .chip{background:rgba(4,26,40,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:999px;padding:7px 13px;display:flex;align-items:center;gap:7px;
    font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
  .icbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:rgba(4,26,40,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    display:grid;place-items:center;font-size:17px;cursor:pointer;color:#fff;
    box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .12s;flex:none}
  .icbtn:active{transform:scale(.9)}
  .icbtn.off{opacity:.45}
  .spacer{flex:1}
  .lvchip{position:relative;overflow:hidden}
  .lvchip::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:var(--xp,0%);background:var(--gold);border-radius:3px}
  .xpbar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 0 4px}
  .xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:99px}
  #tutBar{position:absolute;left:12px;right:12px;bottom:calc(140px + env(safe-area-inset-bottom));z-index:58;display:none;
    background:linear-gradient(135deg,#ffd166,#ffb020);color:#3a2400;border-radius:16px;padding:10px 70px 10px 14px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none}
  #tutBar.top{bottom:auto;top:calc(10px + env(safe-area-inset-top))}
  #tutBar .ts{font-size:10.5px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;opacity:.65}
  #tutBar .tt{font-size:15px;font-weight:800;line-height:1.3}
  #tutSkip{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:auto;background:rgba(0,0,0,.14);border:none;
    color:#3a2400;font-weight:900;font-size:12px;padding:7px 11px;border-radius:99px;font-family:inherit}
  #tutArrow{position:fixed;z-index:59;font-size:34px;line-height:1;pointer-events:none;display:none;transform:translate(-50%,-100%);
    animation:tutBob .8s ease-in-out infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
  @keyframes tutBob{0%,100%{margin-top:0}50%{margin-top:-10px}}
  .tutGlow.tutGlow{box-shadow:0 0 0 3px #ffd166,0 0 18px 4px rgba(255,209,102,.8);animation:tutPulse 1s ease-in-out infinite;position:relative;z-index:3}
  @keyframes tutPulse{50%{box-shadow:0 0 0 5px #ffd166,0 0 26px 8px rgba(255,209,102,.95)}}
  .shopSearch{position:sticky;top:-2px;z-index:4;display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:9px 12px;
    background:#0b3550;border:1px solid rgba(255,255,255,.18);border-radius:14px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
  .shopSearch input{flex:1;min-width:0;background:none;border:none;outline:none;color:#fff;font:inherit;font-size:15px;font-weight:700}
  .shopSearch input#shopSearch,.shopSearch input#shopSearch:focus{outline:none;box-shadow:none;border:none;padding:0;margin:0;height:auto;background:none}
  .shopSearch input::placeholder{color:rgba(255,255,255,.5)}
  .shopSearch input::-webkit-search-cancel-button{display:none}
  .shopSearch button{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:99px;width:26px;height:26px;font-size:12px;visibility:hidden}
  #menuBtn{position:relative}
  .card .bar>i{background:linear-gradient(90deg,#7ce7c8,#ffd166)}
  #menuBtn.qdot::after{content:'';position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 0 2px #0b3550}
  .lockwrap{position:relative;flex:none;display:inline-block}
  .lockwrap .btn{opacity:.8}
  .lvtag{position:absolute;top:-9px;right:-4px;z-index:2;background:#7b5cff;color:#fff;font-size:10px;font-weight:900;line-height:1;padding:4px 7px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap;pointer-events:none}
  .lvtag.dtag{top:5px;right:5px}
  .deco{position:relative}
  .lockt{font-size:11.5px;font-weight:800;color:var(--gold);opacity:.95}
  /* Narrow phones: keep the whole top bar (incl. the ☰ menu) on screen */
  .hud .chip{flex-shrink:1;min-width:0}
  @media(max-width:430px){
    .hud{gap:6px;padding-left:10px;padding-right:10px}
    .hud .chip{padding:6px 10px;gap:5px;font-size:13px}
    .icbtn{width:36px;height:36px;font-size:16px}
  }
  @media(max-width:400px){ #seasonTx{display:none} }

  .strip{position:absolute;top:calc(58px + env(safe-area-inset-top));left:12px;right:12px;z-index:19;display:flex;gap:8px;pointer-events:none}
  #tresBanner{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:99999;
    display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:900;font-size:14.5px;color:#2a1240;white-space:nowrap;
    background:linear-gradient(90deg,#ffd166,#ff8fb8,#b48bff,#ffd166);background-size:300% 100%;box-shadow:0 6px 24px rgba(255,143,184,.55),0 0 0 3px rgba(255,255,255,.55);
    transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .25s,visibility 0s .35s;animation:tbShine 2.4s linear infinite;cursor:pointer;pointer-events:none;
    opacity:0;visibility:hidden}
  #tresBanner.on{transform:translate(-50%,0);pointer-events:auto;opacity:1;visibility:visible;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .2s,visibility 0s}
  #tresBanner .tb-e{display:inline-block;animation:tbBob 1s ease-in-out infinite}
  @keyframes tbShine{to{background-position:300% 0}}
  @keyframes tbBob{50%{transform:translateY(-3px) rotate(-10deg) scale(1.15)}}
  .boostpill.prem{background:linear-gradient(90deg,#ffd166,#ff8fb8,#b48bff)!important;color:#2a1240!important;font-weight:900;animation:pulse 1s ease-in-out infinite}
  #boostRow{position:absolute;top:calc(98px + env(safe-area-inset-top));left:12px;right:12px;z-index:19;
    display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
  .boostpill.questpill{margin-left:auto;pointer-events:auto;cursor:pointer;background:rgba(124,231,200,.18);border-color:rgba(124,231,200,.55);color:#d6fff2}
  .boostpill.questpill.ready{background:rgba(255,77,109,.25);border-color:#ff7f96;color:#fff;animation:tutPulse 1.4s ease-in-out infinite}
  .boostpill{background:rgba(255,206,77,.2);border:1px solid rgba(255,206,77,.55);color:#ffe9a8;
    border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:800;display:flex;align-items:center;gap:4px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:pulse 1.8s ease-in-out infinite}
  .meter{flex:1;background:rgba(4,26,40,.5);border:1px solid var(--line);border-radius:999px;
    padding:5px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .meter .lab{font-size:9.5px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;opacity:.75;display:flex;justify-content:space-between}
  .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.16);margin-top:4px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:999px;transition:width .45s cubic-bezier(.3,1,.4,1)}
  #cleanFill{background:linear-gradient(90deg,#7ce7c8,#5fc4dd)}
  #hungerFill{background:linear-gradient(90deg,var(--gold),var(--accent))}

  .dock{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
  .tool{position:relative;flex:1;max-width:110px;border-radius:16px;cursor:pointer;padding:10px 4px 8px;
    font-family:var(--ui-font);color:#fff;background:rgba(4,26,40,.6);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;gap:3px;
    transition:transform .12s,background .2s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .tool:active{transform:translateY(2px) scale(.96)}
  .tool .ic{font-size:21px;line-height:1}
  .tool .tx{font-size:10.5px;font-weight:800;letter-spacing:.03em}
  .tool.armed{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a2500;border-color:#fff6;
    box-shadow:0 0 0 3px rgba(255,206,77,.28),0 10px 26px rgba(0,0,0,.35)}
  .tool.armed .tx{color:#3a2500}
  .badge{position:absolute;top:4px;right:6px;background:var(--bad);border-radius:999px;font-size:9px;font-weight:900;padding:1px 5px;line-height:1.5}

  body.lite *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  body.lite .chip,body.lite .tool{background:rgba(4,26,40,.8)}
  body.lite .scrim{background:rgba(2,14,24,.78)}
  .scrim{position:absolute;inset:0;z-index:40;display:none;background:rgba(2,14,24,.62);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:flex-end;justify-content:center}
  .scrim.on{display:flex;animation:fade .22s ease}
  @keyframes fade{from{opacity:0}}
  .sheet{width:100%;max-height:86%;background:linear-gradient(180deg,#0b3a58,#062639);
    border-top-left-radius:26px;border-top-right-radius:26px;border-top:1px solid rgba(255,255,255,.2);
    display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,1,.3,1);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
  @keyframes up{from{transform:translateY(100%)}}
  .sheet.center{border-radius:24px;margin:auto 14px;max-width:400px;animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
  @keyframes pop{from{transform:scale(.85);opacity:0}}
  .scrim.mid{align-items:center}
  .grab{width:38px;height:4px;border-radius:9px;background:rgba(255,255,255,.3);margin:9px auto 2px;flex:none}
  .shead{display:flex;align-items:center;gap:10px;padding:10px 18px 12px;flex:none;border-bottom:1px solid rgba(255,255,255,.1)}
  .shead h2{font-family:var(--dis-font);font-size:23px;font-weight:800;flex:1}
  .x.word{width:auto;padding:0 16px;border-radius:99px;font-size:14px;font-weight:900;letter-spacing:.3px}
  .x{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;
    font-size:16px;cursor:pointer;display:grid;place-items:center;flex:none}
  .sbody{overflow-y:auto;padding:14px 16px 22px;-webkit-overflow-scrolling:touch;flex:1}
  .sbody::-webkit-scrollbar{width:0}
  .tabs{display:flex;gap:6px;padding:0 16px 12px;flex:none}
  .tab{flex:1;padding:8px 2px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);
    color:#fff;font-weight:800;font-size:11.5px;cursor:pointer;font-family:var(--ui-font)}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0}
  .tab .te{font-size:18px;line-height:1}
  .tab .tn{line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9.5px;letter-spacing:-.2px}
  #shTabs{gap:4px;padding-left:10px;padding-right:10px}
  .tab.on{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a2500;border-color:transparent}

  .card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:var(--r);
    padding:12px;margin-bottom:10px;display:flex;gap:11px;align-items:center}
  .card .art{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;background:rgba(0,0,0,.22);overflow:hidden}
  .card .art canvas{width:100%;height:100%}
  .card .art .emo{font-size:26px}
  .card .info{flex:1;min-width:0}
  .card .nm{font-weight:900;font-size:14.5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .card .sub{font-size:11.5px;opacity:.72;margin-top:2px;line-height:1.35}
  .card.fav{border-color:rgba(255,206,77,.45);background:linear-gradient(90deg,rgba(255,206,77,.14),rgba(255,255,255,.07))}
  .card.fx-boost,.row.fx-boost{border-color:rgba(255,206,77,.5);animation:fxglow 2.2s ease-in-out infinite}
  @keyframes fxglow{0%,100%{box-shadow:0 0 0 1px rgba(255,206,77,.22),0 4px 14px rgba(255,206,77,.08)}
    50%{box-shadow:0 0 0 1px rgba(255,206,77,.5),0 4px 18px rgba(255,206,77,.3)}}
  .btn{border:none;border-radius:12px;padding:9px 13px;font-weight:900;font-size:12.5px;cursor:pointer;
    font-family:var(--ui-font);background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a2500;
    flex:none;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .12s;white-space:nowrap}
  .btn:active{transform:scale(.93)}
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
  .btn.mint{background:linear-gradient(180deg,#7ce7c8,#3fc9a6);color:#04352a}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .btn.wide{width:100%;padding:13px;font-size:14px;margin-top:6px}
  .qty{display:flex;align-items:center;gap:5px;flex:none;flex-wrap:wrap;margin-top:7px}
  .qty button{width:23px;height:23px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.14);
    color:#fff;font-weight:900;font-size:13px;cursor:pointer;display:grid;place-items:center;padding:0;font-family:var(--ui-font)}
  .qty button:active{transform:scale(.9)}
  .qty button[disabled]{opacity:.3;pointer-events:none}
  .qty input.qin{width:48px;flex:none;padding:4px 3px;border-radius:9px;border:1px solid var(--line);
    background:rgba(0,0,0,.3);color:#fff;font-family:var(--ui-font);font-weight:900;font-size:12.5px;
    text-align:center;-moz-appearance:textfield}
  .qty .qmax{width:auto;height:23px;padding:0 8px;border-radius:9px;font-size:9.5px;letter-spacing:.06em;
    background:rgba(255,206,77,.22);border-color:rgba(255,206,77,.5);color:var(--gold)}
  .qty .qhint{font-size:10px;opacity:.6;font-weight:800;margin-left:1px}

  .lovebar{margin:10px 0 12px}
  .lovebar .lt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:900;margin-bottom:5px}
  .lovebar .lt span:last-child{opacity:.7;font-size:11px}
  .lovebar .ld{font-size:10.5px;opacity:.6;margin-top:5px;line-height:1.45}
  .lovebar .meter{height:9px;border-radius:999px;background:rgba(0,0,0,.32);overflow:hidden;border:1px solid rgba(255,255,255,.14);
    flex:none;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none}
  .lovebar .meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ff9ec8,#ff4d8d);
    box-shadow:0 0 10px rgba(255,127,176,.55);transition:width .35s ease}

  .rar{font-size:9px;font-weight:900;padding:2px 6px;border-radius:6px;letter-spacing:.05em}
  .r-common{background:#8fb8c9;color:#062a45}
  .r-rare{background:#7cc6ff;color:#062a45}
  .r-epic{background:#c79bff;color:#2b0d47}
  .r-legend{background:linear-gradient(90deg,var(--gold),var(--accent));color:#3a2500}
  .r-mythic{background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#1dd1a1,#a55eea);color:#1a0a2e}
  .r-ancient{background:linear-gradient(90deg,#0f0620,#4c1d95,#7c3aed,#0f0620);color:#e9d5ff}
  .r-divine{background:linear-gradient(90deg,#fffbeb,#fde68a,#ffffff,#fbbf24,#fffbeb);background-size:200% 100%;animation:celest 2.2s linear infinite;color:#5b3a00;box-shadow:0 0 8px rgba(253,230,138,.8)}
  .r-celestial{background:linear-gradient(90deg,#1e1b4b,#ec4899,#22d3ee,#fef08a,#a855f7,#1e1b4b);background-size:200% 100%;animation:celest 3s linear infinite;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  @keyframes celest{to{background-position:200% 0}}
  .r-eternal{background:linear-gradient(90deg,#78350f,#f59e0b,#fef3c7,#f59e0b,#78350f);color:#3a2500}

  .empty{text-align:center;padding:34px 16px;opacity:.75;font-size:13px;line-height:1.6}
  .empty .e{font-size:40px;display:block;margin-bottom:8px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;margin-bottom:9px}
  .row .l{font-weight:800;font-size:13.5px}
  .row .d{font-size:11px;opacity:.68;margin-top:2px}

  .sw{width:50px;height:28px;border-radius:999px;background:rgba(255,255,255,.2);position:relative;
    cursor:pointer;flex:none;transition:background .2s;border:none}
  .sw:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:#fff;transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
  .sw.on{background:linear-gradient(90deg,var(--gold),var(--gold2))}
  .sw.on:after{transform:translateX(22px)}

  .themes{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .th{border-radius:15px;padding:11px;cursor:pointer;border:2px solid transparent;position:relative;
    display:flex;flex-direction:column;gap:7px;transition:transform .12s}
  .th:active{transform:scale(.96)}
  .th.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22)}
  .th .tn{font-weight:900;font-size:12.5px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .th .dots{display:flex;gap:4px}
  .th .dots i{width:13px;height:13px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.35)}
  .th .lk{position:absolute;top:7px;right:8px;font-size:11px}

  input[type=text]{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);
    background:rgba(0,0,0,.28);color:#fff;font-size:15px;font-family:var(--ui-font);font-weight:700}
  input:focus{outline:2px solid var(--gold);outline-offset:1px}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .st{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:10px 11px}
  .st .v{font-family:var(--dis-font);font-size:20px;font-weight:800}
  .st .k{font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.07em;font-weight:800;margin-top:1px}

  .ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;margin-bottom:8px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
  .ach.got{background:linear-gradient(90deg,rgba(255,206,77,.2),rgba(255,127,176,.12));border-color:rgba(255,206,77,.45)}
  .ach .ai{font-size:22px;width:38px;height:38px;border-radius:11px;background:rgba(0,0,0,.25);display:grid;place-items:center;flex:none}
  .ach.got .ai{background:linear-gradient(135deg,var(--gold),var(--accent))}
  .ach .an{font-weight:900;font-size:13px}
  .ach .ad{font-size:11px;opacity:.7;margin-top:1px}
  .ach .ac{margin-left:auto;font-size:16px;flex:none}
  .ach.locked{opacity:.55}

  #toasts{position:absolute;top:calc(104px + env(safe-area-inset-top));left:0;right:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;gap:6px;pointer-events:none}
  .toast{background:rgba(4,26,40,.9);border:1px solid var(--line);border-radius:999px;padding:8px 16px;
    font-weight:800;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    animation:tin .3s cubic-bezier(.2,1.4,.4,1), tout .3s ease 2.2s forwards;
    backdrop-filter:blur(10px);max-width:90%;text-align:center}
  .toast.gold{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#3a2500;border-color:#fff5}
  @keyframes tin{from{transform:translateY(-16px) scale(.85);opacity:0}}
  @keyframes tout{to{transform:translateY(-10px);opacity:0}}

  #floats{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden}
  .fl{position:absolute;font-weight:900;font-size:15px;color:var(--gold);
    text-shadow:0 2px 6px rgba(0,0,0,.6);animation:flup 1.1s ease-out forwards}
  @keyframes flup{to{transform:translate(-50%,-52px) scale(1.15);opacity:0}}

  #banner{position:absolute;top:-140px;left:14px;right:14px;z-index:70;
    background:linear-gradient(135deg,#ffce4d,#ff7fb0);color:#3a2500;border-radius:20px;padding:13px 15px;
    display:flex;gap:11px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.5);
    transition:top .5s cubic-bezier(.2,1.4,.4,1)}
  #banner.show{top:calc(14px + env(safe-area-inset-top))}
  #banner .bi{font-size:26px}
  #banner .bt{font-size:9.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
  #banner .bn{font-weight:900;font-size:15px;font-family:var(--dis-font)}

  .reward{text-align:center;padding:8px 4px 4px}
  .reward .big{font-size:56px;animation:bob 2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}
  .reward h3{font-family:var(--dis-font);font-size:26px;margin:6px 0 2px}
  .reward p{opacity:.78;font-size:13px;line-height:1.5}
  .amt{font-family:var(--dis-font);font-size:38px;font-weight:800;color:var(--gold);margin:10px 0 2px}
  .streak{display:flex;gap:5px;justify-content:center;margin:14px 0 4px}
  .streak i{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.12);display:grid;place-items:center;
    font-size:11px;font-weight:900;font-style:normal;border:1px solid rgba(255,255,255,.15)}
  .streak i.on{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a2500;border-color:transparent}

  .hint{position:absolute;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:18;
    background:rgba(4,26,40,.75);border:1px solid var(--line);border-radius:999px;padding:6px 14px;
    font-size:11.5px;font-weight:800;backdrop-filter:blur(10px);white-space:nowrap;
    animation:pulse 1.8s ease-in-out infinite;pointer-events:none}
  @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
  .hint.hide{display:none}

  .fishrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
  .mini{font-size:10px;font-weight:800;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.28)}
  .mini.warn{background:rgba(255,107,107,.3)}
  .mini.good{background:rgba(92,224,141,.22)}

  .deco-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .deco{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;
    padding:9px 5px;text-align:center;cursor:pointer;transition:transform .12s}
  .deco:active{transform:scale(.94)}
  .deco.owned{border-color:var(--accent2)}
  .deco.placed{background:rgba(124,231,200,.18)}
  .deco .de{font-size:26px;line-height:1.2}
  .deco .dn{font-size:9.5px;font-weight:800;margin-top:3px;opacity:.85}
  .deco .dp{font-size:10px;font-weight:900;color:var(--gold);margin-top:3px}
  .deco.owned .dp{color:var(--accent2)}

  #splash{position:absolute;inset:0;z-index:100;background:linear-gradient(180deg,#0b4a70,#031825);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    transition:opacity .6s;cursor:pointer}
  #splash.gone{opacity:0;pointer-events:none}
  #splash .lg{font-family:var(--dis-font);font-size:52px;font-weight:800;
    background:linear-gradient(90deg,#ffce4d,#ff7fb0,#7ce7c8);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;animation:bob 3s ease-in-out infinite}
  #splash .sb{opacity:.7;font-size:13px;font-weight:700;letter-spacing:.05em;text-align:center;padding:0 22px;box-sizing:border-box;max-width:100%}
  #splash .go{margin-top:22px;padding:13px 34px;border-radius:999px;border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1);font-weight:900;font-size:14px;animation:pulse 1.6s ease-in-out infinite}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="tank"></canvas>
  <div id="floats"></div>

  <div class="hud">
    <div class="chip" id="coinChip" style="cursor:pointer"><span>🪙</span><span id="coins">0</span><span class="coinplus" style="opacity:.55;font-weight:900;margin-left:1px">＋</span></div>
    <div class="chip" id="fishChip" style="cursor:pointer"><span>🐠</span><span id="fishCount">0/3</span></div>
    <div class="chip lvchip" id="lvChip" style="cursor:pointer"><span>⭐</span><span id="lvNum">1</span></div>
    <div class="chip" id="seasonChip" style="display:none"><span id="seasonEmo">☀️</span><span id="seasonTx">Summer</span></div>
    <div class="spacer"></div>
    <button class="icbtn" id="muteBtn">🔊</button>
    <button class="icbtn" id="menuBtn">☰</button>
  </div>

  <div class="strip">
    <div class="meter"><div class="lab"><span>Clean</span><span id="cleanVal">100%</span></div>
      <div class="bar"><i id="cleanFill" style="width:100%"></i></div></div>
    <div class="meter"><div class="lab"><span>Fed</span><span id="hungerVal">100%</span></div>
      <div class="bar"><i id="hungerFill" style="width:100%"></i></div></div>
  </div>
  <div id="boostRow"></div>

  <div class="hint" id="hint">Tap a tool below to begin</div>

  <div class="dock">
    <button class="tool" id="tFeed"><span class="ic">🍤</span><span class="tx">FEED</span><span class="badge" id="feedBadge" style="display:none"></span></button>
    <button class="tool" id="tClean"><span class="ic">🧽</span><span class="tx">CLEAN</span></button>
    <button class="tool" id="tShop"><span class="ic">🛒</span><span class="tx">MARKET</span></button>
    <button class="tool" id="tFish"><span class="ic">🐠</span><span class="tx">FISHIES</span></button>
  </div>

  <div id="toasts"></div>
  <div id="banner"><div class="bi">🏆</div><div><div class="bt">Achievement</div><div class="bn" id="bnName"></div></div></div>

  <div class="scrim" id="scrim">
    <div class="sheet">
      <div class="grab"></div>
      <div class="shead"><span class="chip" id="shCoins" style="display:none"><span>🪙</span><span id="shCoinsVal">0</span></span><span class="chip" id="shFish" style="display:none"><span>🐠</span><span id="shFishVal">0</span></span><h2 id="shTitle">Title</h2><button class="x word" id="shX">Exit</button></div>
      <div class="tabs" id="shTabs" style="display:none"></div>
      <div class="sbody" id="shBody"></div>
    </div>
  </div>

  <div class="scrim mid" id="scrim2">
    <div class="sheet center">
      <div class="shead"><h2 id="sh2Title">Title</h2><button class="x word" id="sh2X">Exit</button></div>
      <div class="sbody" id="sh2Body"></div>
    </div>
  </div>

  <div id="splash">
    <div class="lg">Fishies</div>
    <div class="sb">a cozy little aquarium</div>
    <div class="go">Tap to dive in</div>
  </div>
</div>

<script>
/* ---------- Language (English / Français) ---------- */
var LANG=(function(){try{var v=localStorage.getItem('fishies.lang');if(v==='fr'||v==='en')return v;}catch(e){}return /^fr/i.test(navigator.language||'')?'fr':'en';})();
var FR=Object.assign({"Fish Keeper": "Gardien de poissons", "Spring": "Printemps", "Summer": "Été", "Autumn": "Automne", "Winter": "Hiver", "Guppy": "Guppy", "The friendly starter fish. Cheerful, hardy, and always up for a swim. Everyone’s first friend — and always grateful for a snack.": "Le gentil poisson du début. Joyeux, robuste et toujours partant pour une baignade. Le premier ami de tout le monde — et toujours reconnaissant pour une collation.", "Neon Tetra": "Néon", "A living neon sign. Tiny, speedy, and impossible to miss even in the darkest corner of the tank.": "Une enseigne au néon vivante. Minuscule, rapide et impossible à manquer, même dans le coin le plus sombre de l’aquarium.", "Goldfish": "Poisson rouge", "The timeless classic. Rumour says it forgets this very description in about three seconds — but everyone still wants one.": "L’éternel classique. On dit qu’il oublie cette description en trois secondes environ — mais tout le monde en veut un quand même.", "Molly": "Molly", "A peaceful little swimmer that gets along with just about everybody. The friend-maker of the tank.": "Un petit nageur paisible qui s’entend avec à peu près tout le monde. Le rassembleur de l’aquarium.", "Zebra Danio": "Danio zébré", "Quick, striped, and always racing its own reflection. Never actually gets anywhere first.": "Rapide, rayé et toujours en course contre son propre reflet. N’arrive jamais premier, en fait.", "Pleco": "Pléco", "A quiet bottom-dweller with a taste for algae. Doesn’t ask for much, and keeps the glass a little cleaner just by being there.": "Un discret habitant du fond qui raffole des algues. Ne demande pas grand-chose, et garde la vitre un peu plus propre juste en étant là.", "Cardinal Tetra": "Néon cardinal", "A streak of red and blue that never sits still. Every so often it turns up a lucky coin while snacking.": "Un éclair rouge et bleu qui ne tient jamais en place. De temps en temps, il déniche une pièce porte-bonheur en grignotant.", "Clownfish": "Poisson-clown", "Orange, bouncy, and a little dramatic. Loves a cozy anemone, a good punchline, and doubling down on a bit.": "Orange, bondissant et un brin théâtral. Adore une anémone douillette, une bonne blague et en remettre une couche.", "Sea Anemone": "Anémone de mer", "Waves gently, stings gently, and is secretly best friends with every clownfish in the tank.": "Ondule doucement, pique doucement, et est secrètement la meilleure amie de chaque poisson-clown de l’aquarium.", "Cleaner Wrasse": "Labre nettoyeur", "The tank’s unofficial dentist. Nibbles the leftovers so efficiently the whole crew stays fed a little longer.": "Le dentiste officieux de l’aquarium. Grignote les restes si efficacement que toute la bande reste nourrie un peu plus longtemps.", "Firefish Goby": "Gobie de feu", "A little torch of a fish that darts back into its burrow at the first sign of a tap. Worth the chase.": "Une petite torche de poisson qui file dans son terrier au moindre petit coup. Ça vaut la poursuite.", "Angelfish": "Scalaire", "Elegant and graceful — the ballet dancer of the aquarium. Glides like it owns the place, and learns just as gracefully.": "Élégant et gracieux — le danseur de ballet de l’aquarium. Glisse comme s’il était chez lui, et apprend avec autant de grâce.", "Betta": "Betta", "Flowing fins like royal robes. Bold, beautiful, and just a teeny bit of a diva. Loves the attention — pet it for extra coins.": "Des nageoires flottantes comme une robe royale. Audacieux, magnifique et juste un tout petit peu diva. Adore l’attention — flatte-le pour des pièces en plus.", "Swordtail": "Porte-épée", "Wears its namesake blade with pride. Purely for fashion — it has never once used it in a duel.": "Porte fièrement l’épée qui lui donne son nom. Juste pour le style — il ne s’en est jamais servi en duel.", "Puffer Fish": "Poisson-globe", "Round, roly-poly, and prepared to inflate dramatically at the slightest inconvenience.": "Rond, dodu et prêt à se gonfler théâtralement au moindre petit dérangement.", "Discus": "Discus", "The gentle giant of discs. Calm, round, and quietly majestic — the tank’s zen centrepiece, and famously prized among keepers.": "Le doux géant des disques. Calme, rond et discrètement majestueux — la pièce zen de l’aquarium, et très prisé des connaisseurs.", "Blue Tang": "Chirurgien bleu", "Bright blue and bursting with energy. Its life motto: just keep swimming — and always leave a little extra in the tip jar.": "Bleu vif et débordant d’énergie. Sa devise: continuer à nager — et toujours laisser un petit extra dans le pot à pourboires.", "Lionfish": "Poisson-lion", "All frills and fabulous spines. Looks fierce, but mostly it’s just showing off.": "Que des froufrous et de superbes épines. A l’air féroce, mais surtout, il se pavane.", "Moray Eel": "Murène", "Long, slinky, and impossible to hug properly. Excellent at hide-and-seek in the rocks.": "Longue, ondulante et impossible à serrer dans ses bras comme il faut. Championne de cache-cache dans les rochers.", "Moorish Idol": "Idole des Maures", "A bold black-and-white banner fin that looks like it’s always dressed for a fancy occasion.": "Une audacieuse nageoire-bannière noire et blanche qui lui donne toujours l’air habillé pour une grande occasion.", "Sea Turtle": "Tortue de mer", "Slow and steady, with a shell full of secrets. Has seen some things — and somehow picks up new tricks faster than anyone expects.": "Lente et constante, avec une carapace pleine de secrets. Elle en a vu d’autres — et apprend de nouveaux trucs plus vite qu’on le pense.", "Jellyfish": "Méduse", "A drifting glow of jelly and grace. Pulses gently and asks for nothing but good vibes — its low-energy metabolism helps the whole tank stay fed longer.": "Une lueur flottante de gelée et de grâce. Pulse doucement et ne demande que de bonnes vibrations — son métabolisme tranquille aide tout l’aquarium à rester nourri plus longtemps.", "Axolotl": "Axolotl", "Perpetually smiling, delightfully frilly, and just a little bit magic. Can apparently regrow anything except its patience for empty food bowls.": "Toujours souriant, délicieusement frisé et juste un peu magique. Peut apparemment tout faire repousser, sauf sa patience devant un bol de nourriture vide.", "Rainbow Fish": "Poisson arc-en-ciel", "Shimmers a different color with every turn. Grows noticeably faster than its tankmates — showing off, probably.": "Scintille d’une couleur différente à chaque tour. Grandit nettement plus vite que ses voisins — pour se montrer, sans doute.", "Koi": "Koï", "Living art. A symbol of luck and patience — famously fond of very expensive ponds, and worth every coin if you ever let it go.": "Une œuvre d’art vivante. Symbole de chance et de patience — célèbre pour aimer les bassins très chers, et vaut chaque pièce si jamais tu le laisses partir.", "Dragonet": "Dragonnet", "A tiny psychedelic dragon of the reef. Impossibly colorful, endlessly mesmerising, and carries a little hoarded luck.": "Un minuscule dragon psychédélique du récif. Incroyablement coloré, sans fin envoûtant, et il garde un petit trésor de chance.", "Seahorse": "Hippocampe", "The ocean’s slowest wonder. Curls its tail, sways with the current, and dreams big dreams — occasionally a lucky one comes true.": "La plus lente merveille de l’océan. Enroule sa queue, se balance avec le courant et fait de grands rêves — parfois, un rêve chanceux se réalise.", "Manta Ray": "Raie manta", "Glides like it’s flying underwater. The tank’s resident acrobat, minus the applause — and always glad to see you come back.": "Glisse comme si elle volait sous l’eau. L’acrobate attitrée de l’aquarium, sans les applaudissements — et toujours contente de te revoir.", "Ocean Sunfish": "Poisson-lune", "Enormous, flat, and utterly serene. Drifts through the tank like a dinner plate that achieved consciousness.": "Énorme, plat et parfaitement serein. Dérive dans l’aquarium comme une assiette qui aurait pris conscience.", "Golden Arowana": "Arowana doré", "Called the \"dragon fish\" for luck and fortune. Every so often, feeding it turns up a little extra treasure.": "Surnommé le « poisson-dragon », porteur de chance et de fortune. De temps en temps, le nourrir fait apparaître un petit trésor en plus.", "Reef Shark": "Requin de récif", "Sleek, silent, and surprisingly cuddly once you get to know it. Mostly harmless. Mostly. Occasionally doubles down on a meal.": "Élancé, silencieux et étonnamment câlin une fois qu’on le connaît. Surtout inoffensif. Surtout. Double parfois la mise sur un repas.", "Dolphin": "Dauphin", "Playful, clever, and definitely the class clown of the reef. Loves an audience.": "Joueur, futé et sans aucun doute le clown de la classe du récif. Adore avoir un public.", "Narwhal": "Narval", "The unicorn of the sea, tusk and all. No one has ever asked what the tusk is actually for, least of all the narwhal.": "La licorne des mers, défense comprise. Personne n’a jamais demandé à quoi sert la défense, encore moins le narval.", "Humpback Whale": "Baleine à bosse", "The gentle giant of the tank. Somehow fits, somehow thrives, endlessly beloved — and worth an absolute fortune to the right buyer.": "Le doux géant de l’aquarium. Elle y entre on ne sait comment, s’y épanouit, adorée de tous — et vaut une véritable fortune pour le bon acheteur.", "Celestial Ray": "Raie céleste", "Trails stardust instead of bubbles. Its calm presence seems to lift the mood — and the earnings — of every fish nearby.": "Laisse une traînée de poussière d’étoiles au lieu de bulles. Sa présence calme semble remonter le moral — et les gains — de chaque poisson autour.", "Starfish": "Étoile de mer", "Doesn’t swim, doesn’t rush, doesn’t care. Just vibes on the glass or the sand, forever chill.": "Ne nage pas, ne se presse pas, s’en fiche. Elle relaxe sur la vitre ou le sable, toujours zen.", "Sea Urchin": "Oursin", "A pincushion with opinions. Doesn’t move, doesn’t apologize, and somehow still has more personality than it should.": "Une pelote d’épingles qui a des opinions. Ne bouge pas, ne s’excuse pas, et a quand même plus de personnalité qu’il ne devrait.", "Crab": "Crabe", "Sideways is the only direction that matters. Pinchy, proud, and always up to something.": "De côté, c’est la seule direction qui compte. Pinceur, fier et toujours en train de manigancer quelque chose.", "Cherry Blossom Betta": "Betta fleur de cerisier", "Its fins drift like falling petals. Only ever seen in bloom during spring.": "Ses nageoires flottent comme des pétales qui tombent. On ne le voit en fleur qu’au printemps.", "Sunbeam Snapper": "Vivaneau rayon de soleil", "Glows like captured sunlight. Surfaces only when the water runs warm.": "Brille comme un rayon de soleil capturé. Ne fait surface que quand l’eau est chaude.", "Maple Leaf Fish": "Poisson feuille d’érable", "Drifts sideways like a falling leaf. A quiet, colorful visitor of the cooler months.": "Dérive de côté comme une feuille qui tombe. Un visiteur discret et coloré des mois plus frais.", "Frost Koi": "Koï givré", "Patterned like frost on glass. A rare, chilly cousin of the classic koi.": "Motifs de givre sur une vitre. Un cousin rare et frileux du koï classique.", "Petal Ray": "Raie pétale", "A manta that glides through the tank trailing a wake of cherry-blossom petals. Everything nearby seems to grow a little faster when it's around.": "Une manta qui glisse dans l’aquarium en laissant derrière elle une traînée de pétales de cerisier. Tout autour semble grandir un peu plus vite quand elle est là.", "Sakura Empress Turtle": "Tortue impératrice Sakura", "Ancient, unhurried, and crowned in blossoms that never seem to wilt. Legend says her whole garden of a shell blooms brighter with each passing spring.": "Ancienne, sereine et couronnée de fleurs qui ne semblent jamais faner. La légende dit que tout le jardin de sa carapace fleurit plus fort à chaque printemps.", "Solstice Dolphin": "Dauphin du solstice", "Rides the longest, brightest days of the year. Loves an audience, loves a splash, and every so often doubles the fun of feeding time.": "Surfe sur les jours les plus longs et lumineux de l’année. Adore un public, adore les éclaboussures, et double parfois le plaisir de l’heure du repas.", "Blazing Sunfish": "Poisson-lune flamboyant", "Bigger and brighter than any sunfish in the reef, like it swallowed the whole summer sky. Collectors will pay a fortune for one this radiant.": "Plus gros et plus brillant que tous les poissons-lunes du récif, comme s’il avait avalé tout le ciel d’été. Les collectionneurs paieront une fortune pour un spécimen aussi radieux.", "Rustwind Reef Shark": "Requin de récif vent rouille", "Patterned like fallen leaves swept up in a current. Feeding it during harvest season sometimes turns up a lucky coin among the drift.": "Motifs de feuilles mortes emportées par le courant. Le nourrir pendant la saison des récoltes fait parfois apparaître une pièce porte-bonheur dans la dérive.", "Harvest Moon Whale": "Baleine lune des moissons", "Surfaces only under the harvest moon, trailing drifts of copper leaves. The luckiest fish in the whole tank to feed all autumn long.": "Ne fait surface que sous la lune des moissons, entraînant des feuilles cuivrées dans son sillage. Le poisson le plus chanceux de tout l’aquarium à nourrir tout l’automne.", "Glacier Seal": "Phoque des glaciers", "A frost-flecked pup that loves a belly rub even more once the water turns cold. Petting it warms up the whole tank's mood — and your wallet.": "Un bébé phoque moucheté de givre qui adore encore plus les grattouilles de bedaine quand l’eau refroidit. Le flatter réchauffe l’humeur de tout l’aquarium — et ton portefeuille.", "Aurora Narwhal": "Narval aurore", "Trails shimmering aurora light instead of bubbles through the deep winter dark. Its icy calm seems to lift the earnings of every fish nearby.": "Laisse une traînée scintillante d’aurore boréale au lieu de bulles dans la nuit profonde de l’hiver. Son calme glacé semble remonter les gains de chaque poisson autour.", "Lanternfish": "Poisson-lanterne", "A tiny deep-sea wanderer with a built-in nightlight. Its glow burns brightest exactly when the tank needs a scrub — hard to miss when things get grimy.": "Un petit voyageur des abysses avec une veilleuse intégrée. Sa lueur brille le plus fort justement quand l’aquarium a besoin d’être frotté — difficile à manquer quand ça devient sale.", "Harbor Seal": "Phoque commun", "A playful pup who lives for an audience. Give it a pat and it’ll flip into a little splash-trick just to hear you cheer.": "Un bébé phoque joueur qui vit pour son public. Donne-lui une petite tape et il fera une pirouette éclaboussante juste pour t’entendre applaudir.", "Octopus": "Pieuvre", "Eight arms and endless mischief. Every so often it vanishes behind a puff of ink, just to make a more dramatic entrance later.": "Huit bras et des bêtises à l’infini. De temps en temps, elle disparaît derrière un nuage d’encre, juste pour faire une entrée plus spectaculaire ensuite.", "Manatee": "Lamantin", "A slow, gentle grazer who nibbles at algae between naps. In no rush, ever — and the tank is a little cleaner for its company.": "Un brouteur lent et doux qui grignote des algues entre deux siestes. Jamais pressé — et l’aquarium est un peu plus propre grâce à sa compagnie.", "Calamary": "Calmar", "A quicksilver hunter that jets backward in a blink, leaving a small puff of ink hanging in the water. Blink and you'll miss the getaway — never the entrance.": "Un chasseur vif-argent qui file à reculons en un clin d’œil, laissant un petit nuage d’encre flotter dans l’eau. Cligne des yeux et tu rateras la fuite — jamais l’entrée.", "Kraken Hatchling": "Bébé kraken", "Still young, already legendary. Its ink runs deep violet and its presence alone seems to lift the whole tank's fortunes. Ancient things dream slowly — this one is just waking up.": "Encore jeune, déjà légendaire. Son encre est d’un violet profond et sa seule présence semble faire grimper la fortune de tout l’aquarium. Les choses anciennes rêvent lentement — celle-ci se réveille à peine.", "Elder Kraken": "Kraken ancestral", "Centuries deep and still growing. Sailors' tales are mostly true — it just prefers a good scratch behind the mantle to any shipwreck.": "Profond de plusieurs siècles et grandit encore. Les histoires de marins sont presque toutes vraies — il préfère juste une bonne gratouille derrière le manteau à n’importe quel naufrage.", "Void Leviathan": "Léviathan du néant", "A shadow given fins, gliding just past the edge of sight. Utterly silent, utterly enormous, and worth a small fortune to whoever finally lets it go.": "Une ombre dotée de nageoires, qui glisse juste au bord du regard. Totalement silencieux, totalement énorme, et vaut une petite fortune pour qui finira par le laisser partir.", "Cosmic Whale": "Baleine cosmique", "A whale that seems to carry the night sky on its back, stars and all. The rarest sight in the entire ocean — and the crown jewel of any collection.": "Une baleine qui semble porter le ciel nocturne sur son dos, étoiles comprises. La vision la plus rare de tout l’océan — et le joyau de toute collection.", "Abyssal Seraph": "Séraphin abyssal", "Six pale wings of fin, folded and unfolded in total silence. It has been circling the trench since long before anyone thought to name it, and it still finds treasure down there.": "Six pâles ailes-nageoires, pliées et dépliées dans un silence total. Il tourne autour de la fosse depuis bien avant que quiconque songe à lui donner un nom, et il y trouve encore des trésors.", "Storm Leviathan": "Léviathan des tempêtes", "Where it swims, the water crackles. Old crews swore the storms followed it home — the truth is it just likes the noise, and it pays out twice as often when it's happy.": "Là où il nage, l’eau crépite. Les vieux équipages juraient que les tempêtes le suivaient — en vérité, il aime juste le bruit, et il rapporte deux fois plus souvent quand il est content.", "Tidefather Serpent": "Serpent père des marées", "The current does not carry it; it carries the current. Every fish nearby swims a little easier, earns a little more, and somehow always knows which way is home.": "Le courant ne le porte pas; c’est lui qui porte le courant. Chaque poisson autour nage un peu plus facilement, gagne un peu plus, et sait toujours où se trouve la maison.", "Genesis Turtle": "Tortue de la genèse", "A shell mapped with coastlines that no longer exist. It remembers the first reef, and everything raised in its shadow grows twice as fast.": "Une carapace couverte de côtes qui n’existent plus. Elle se souvient du premier récif, et tout ce qui grandit à son ombre pousse deux fois plus vite.", "Aurora Leviathan": "Léviathan aurore", "Ribbons of green and violet trail from its flukes like a sky that came down for a swim. Nobody who owns one sells it — but the offers are extraordinary.": "Des rubans verts et violets s’échappent de sa queue comme un ciel descendu se baigner. Personne qui en possède un ne le vend — mais les offres sont extraordinaires.", "Worldheart Ray": "Raie cœur du monde", "It glides with a slow golden pulse, like something enormous keeping time. Coins surface in its wake with unsettling regularity, as if the ocean were paying rent.": "Elle glisse avec une lente pulsation dorée, comme quelque chose d’immense qui bat la mesure. Des pièces surgissent dans son sillage avec une régularité troublante, comme si l’océan payait son loyer.", "Eternity Dragon": "Dragon de l’éternité", "The last fish. Or the first — the stories disagree, and it has never bothered to settle the matter. Owning one is less a purchase than an arrangement.": "Le dernier poisson. Ou le premier — les histoires ne s’entendent pas, et il ne s’est jamais donné la peine de trancher. En posséder un, c’est moins un achat qu’une entente.", "Cool Customer": "Trop cool", "Too cool for the reef. Swims like it’s got somewhere better to be.": "Trop cool pour le récif. Nage comme s’il avait mieux à faire ailleurs.", "Sleepyhead": "Endormi", "Runs on forty naps a day. Do not disturb the floaty dreams.": "Carbure à quarante siestes par jour. Ne pas déranger les rêves flottants.", "Bookworm": "Rat de bibliothèque", "Has read every rock in the tank. Twice. Working on the gravel now.": "A lu chaque roche de l’aquarium. Deux fois. Il s’attaque au gravier maintenant.", "Goofball": "Farceur", "Blows bubbles just to pop them. A true underwater comedian.": "Fait des bulles juste pour les éclater. Un vrai comique sous-marin.", "Party Animal": "Fêtard", "Every single day is a fin-tastic fiesta down here.": "Ici, chaque jour est une fiesta nageoire-tastique.", "Sweetheart": "Petit cœur", "Would share the very last flake with anyone. Aww.": "Partagerait son tout dernier flocon avec n’importe qui. Aww.", "Feisty": "Fougueux", "Small fish, enormous attitude. Fears absolutely nothing.": "Petit poisson, énorme caractère. N’a peur d’absolument rien.", "Deep Thinker": "Penseur", "Currently pondering the great mystery of the glass wall.": "Médite en ce moment sur le grand mystère de la paroi de verre.", "Foodie": "Gourmand", "Lives for snack o’clock — which, conveniently, is always.": "Vit pour l’heure de la collation — qui, par chance, est tout le temps.", "Zen Master": "Maître zen", "Achieved total inner peace somewhere near the filter.": "A atteint la paix intérieure totale quelque part près du filtre.", "Dreamer": "Rêveur", "Wants to see the big wide ocean someday. Practising its wave.": "Veut voir le grand océan un jour. Pratique sa vague.", "Little Rascal": "Petit coquin", "Is absolutely, definitely planning something sneaky.": "Prépare absolument, certainement un mauvais coup.", "Top Hat": "Haut-de-forme", "Crown": "Couronne", "Ball Cap": "Casquette", "Cowboy": "Cowboy", "Graduate": "Diplômé", "Sun Hat": "Chapeau de soleil", "Bow": "Nœud", "Flower": "Fleur", "Diver": "Plongeur", "Star": "Étoile", "Mushroom": "Champignon", "Pumpkin": "Citrouille", "Army Helmet": "Casque militaire", "Ribbon": "Ruban", "Party Popper": "Cotillon", "Donut": "Beigne", "Ice Cream": "Crème glacée", "Sparkle Halo": "Auréole scintillante", "Watermelon": "Melon d’eau", "Taco": "Taco", "Cupcake": "Petit gâteau", "Lollipop": "Suçon", "Sparkler": "Cierge magique", "Unicorn Horn": "Corne de licorne", "Flower Bouquet": "Bouquet de fleurs", "Sunflower": "Tournesol", "Maple Leaf Crown": "Couronne de feuilles d’érable", "Holiday Topper": "Chapeau des fêtes", "Gold Medal": "Médaille d’or", "Trophy Crown": "Couronne trophée", "Diamond Tiara": "Diadème de diamants", "Ember Crown": "Couronne de braises", "Frost Crown": "Couronne de givre", "Disco Ball Hat": "Chapeau boule disco", "Butterfly Perch": "Perchoir à papillon", "Poseidon’s Crest": "Cimier de Poséidon", "Crescent Moon": "Croissant de lune", "Comet Crown": "Couronne comète", "Ringed Planet": "Planète à anneaux", "Angel Wings": "Ailes d’ange", "Galaxy Crown": "Couronne galactique", "Shades": "Lunettes fumées", "Specs": "Lunettes", "Goggles": "Lunettes de protection", "Dive Mask": "Masque de plongée", "Frost Specs": "Lunettes givrées", "Tropical Shades": "Lunettes tropicales", "Loupe": "Loupe", "Masquerade": "Loup de bal masqué", "Third Eye": "Troisième œil", "Disguise": "Déguisement", "Big Eyes": "Gros yeux", "Rainbow Shades": "Lunettes arc-en-ciel", "Gold Monocle": "Monocle doré", "Star Shades": "Lunettes étoiles", "Crystal Visor": "Visière de cristal", "Oracle Lens": "Lentille d’oracle", "Nova Lens": "Lentille nova", "Eclipse Lens": "Lentille éclipse", "Infinity Visor": "Visière infinie", "Cosmic Lens": "Lentille cosmique", "Handful of Coins": "Poignée de pièces", "Coin Pouch": "Bourse de pièces", "Coin Chest": "Coffre de pièces", "Coin Vault": "Chambre forte", "Treasure Trove": "Caverne aux trésors", "Sunken Hoard": "Trésor englouti", "Leviathan’s Fortune": "Fortune du Léviathan", "Daily Snack": "Collation du jour", "Daily Feast": "Festin du jour", "Daily Royale": "Royal du jour", "Daily Leviathan": "Léviathan du jour", "Daily Eternal": "Éternel du jour", "Flakes": "Flocons", "Basic. Gets the job done.": "De base. Fait le travail.", "Pellets": "Granulés", "Sinks nicely. Fish approve.": "Coule bien. Les poissons approuvent.", "Brine Shrimp": "Artémias", "A treat. +20% coins for 2 min.": "Une gâterie. +20% de pièces pendant 2 min.", "Gourmet Bits": "Bouchées gourmet", "Fills everyone. +50% coins for 3 min.": "Rassasie tout le monde. +50% de pièces pendant 3 min.", "Vitality Pellets": "Granulés vitalité", "Doubles growth & leveling for 3 min.": "Double la croissance et les niveaux pendant 3 min.", "Mineral Flakes": "Flocons minéraux", "Tank stays 50% cleaner for 4 min.": "L’aquarium reste 50% plus propre pendant 4 min.", "Bloodworms": "Vers de vase", "A favorite. No frills, just great eating.": "Un favori. Sans chichi, juste délicieux.", "Enrichment Cubes": "Cubes d’enrichissement", "Feed it back-to-back — fish get more excited each time, so the fill rises the longer your streak runs.": "Nourris sans arrêt — les poissons sont plus excités à chaque fois, donc la jauge monte plus ta série dure.", "Golden Flakes": "Flocons dorés", "A shimmering treat that sprinkles a few bonus coins with every feeding.": "Une gâterie scintillante qui saupoudre quelques pièces bonus à chaque repas.", "Sea Sparkle Dust": "Poussière d’étincelles marines", "Showers the tank in sparkles and boosts lucky odds for 3 min.": "Couvre l’aquarium d’étincelles et augmente la chance pendant 3 min.", "Royal Feast": "Festin royal", "A banquet fit for royalty. +65% coins for 4 min.": "Un banquet digne de la royauté. +65% de pièces pendant 4 min.", "Ambrosia Kelp": "Varech ambroisie", "A legendary strain of kelp. ×2.6 growth & leveling for 4 min.": "Une variété légendaire de varech. ×2.6 croissance et niveaux pendant 4 min.", "Abyssal Krill": "Krill abyssal", "Deep-sea krill, packed with minerals. Tank stays 70% cleaner for 5 min.": "Krill des grands fonds, plein de minéraux. L’aquarium reste 70% plus propre pendant 5 min.", "Celestial Nectar": "Nectar céleste", "Nectar that fell from the stars. Big boost to lucky odds for 4 min.": "Un nectar tombé des étoiles. Gros boost de chance pendant 4 min.", "Phoenix Roe": "Œufs de phénix", "Roe that glows like embers. Sprinkles a generous shower of bonus coins with every feeding.": "Des œufs qui brillent comme des braises. Saupoudre une généreuse pluie de pièces bonus à chaque repas.", "Kraken's Bounty": "Butin du Kraken", "The richest feast in the sea. +130% coins for 5 min.": "Le festin le plus riche de la mer. +130% de pièces pendant 5 min.", "Leviathan's Feast": "Festin du Léviathan", "A feast fit for a sea giant. +150% coins for 5 min.": "Un festin digne d’un géant des mers. +150% de pièces pendant 5 min.", "Nebula Bloom": "Floraison nébuleuse", "Kelp infused with stardust. ×3.4 growth & leveling for 4 min.": "Du varech infusé de poussière d’étoiles. ×3.4 croissance et niveaux pendant 4 min.", "Void Pearl": "Perle du néant", "A pearl from the deepest trench. Tank stays 80% cleaner for 6 min.": "Une perle de la fosse la plus profonde. L’aquarium reste 80% plus propre pendant 6 min.", "Eclipse Roe": "Œufs d’éclipse", "Roe harvested under a total eclipse. Huge boost to lucky odds for 5 min.": "Des œufs récoltés pendant une éclipse totale. Énorme boost de chance pendant 5 min.", "Supernova Flakes": "Flocons supernova", "Flakes that spark like dying stars. Sprinkles a massive shower of bonus coins with every feeding.": "Des flocons qui crépitent comme des étoiles mourantes. Saupoudre une pluie massive de pièces bonus à chaque repas.", "Tidal Caviar": "Caviar des marées", "Caviar pulled from a tidal trench. +180% coins for 6 min.": "Du caviar tiré d’une fosse des marées. +180% de pièces pendant 6 min.", "Aurora Kelp": "Varech aurore", "Kelp lit from the inside by the aurora. ×4.2 growth & leveling for 5 min.": "Du varech illuminé de l’intérieur par l’aurore. ×4.2 croissance et niveaux pendant 5 min.", "Obsidian Roe": "Œufs d'obsidienne", "Roe cooled in volcanic glass. Enormous boost to lucky odds for 6 min.": "Des œufs refroidis dans le verre volcanique. Énorme boost de chance pendant 6 min.", "Prism Krill": "Krill prisme", "Krill that split the light as they sink. Tank stays 88% cleaner for 7 min.": "Du krill qui décompose la lumière en coulant. L'aquarium reste 88% plus propre pendant 7 min.", "Solar Nectar": "Nectar solaire", "Nectar distilled from pure sunlight. Sprinkles a blazing shower of bonus coins with every feeding.": "Un nectar distillé de pur soleil. Fait pleuvoir une averse éclatante de pièces bonus à chaque repas.", "Genesis Feast": "Festin de la Genèse", "The very first meal the ocean ever served. +220% coins for 6 min.": "Le tout premier repas servi par l'océan. +220% de pièces pendant 6 min.", "Eternity Roe": "Œufs d'éternité", "Roe that has not spoiled in a thousand years. Colossal boost to lucky odds for 6 min.": "Des œufs qui ne se gâtent pas depuis mille ans. Boost colossal de chance pendant 6 min.", "Infinity Bloom": "Fleur infinie", "A bloom that keeps unfolding, forever. ×5.5 growth & leveling for 5 min.": "Une fleur qui ne cesse jamais d'éclore. ×5.5 croissance et niveaux pendant 5 min.", "Starter Bowl": "Bocal de départ", "Glass Cube": "Cube de verre", "Reef Tank": "Aquarium récif", "Natural filtration — 8% less grime buildup.": "Filtration naturelle — 8% moins de saleté.", "Grand Aquarium": "Grand aquarium", "Room to roam — fish grow 10% faster.": "De l'espace pour nager — les poissons grandissent 10% plus vite.", "Ocean Wing": "Aile océane", "Open water calm — +8% passive income.": "Le calme du large — +8% de revenus passifs.", "Coral Palace": "Palais de corail", "Royal upkeep — 15% less grime, +5% income.": "Entretien royal — 15% moins de saleté, +5% de revenus.", "Mega Reef Complex": "Méga complexe récifal", "Vast currents — fish grow 15% faster, +10% income.": "De vastes courants — les poissons grandissent 15% plus vite, +10% de revenus.", "Bioluminescent Grotto": "Grotte bioluminescente", "Glowing algae keeps things clean — 20% less grime, +15% income.": "Des algues lumineuses gardent tout propre — 20% moins de saleté, +15% de revenus.", "Infinity Aquarium": "Aquarium infini", "A tank that seems to stretch forever — 30% less grime, +30% income, fish grow 20% faster.": "Un aquarium qui semble s'étendre à l'infini — 30% moins de saleté, +30% de revenus, les poissons grandissent 20% plus vite.", "Leviathan’s Reach": "Domaine du Léviathan", "A tank so vast it has its own currents — 40% less grime, +45% income, fish grow 30% faster.": "Un aquarium si vaste qu'il a ses propres courants — 40% moins de saleté, +45% de revenus, les poissons grandissent 30% plus vite.", "Abyssal Sanctum": "Sanctuaire abyssal", "Pressure-sealed and pristine — 50% less grime, +60% income, fish grow 35% faster.": "Scellé sous pression et immaculé — 50% moins de saleté, +60% de revenus, les poissons grandissent 35% plus vite.", "Celestial Reef": "Récif céleste", "Starlight filters through the water — 58% less grime, +80% income, fish grow 45% faster.": "La lumière des étoiles filtre dans l'eau — 58% moins de saleté, +80% de revenus, les poissons grandissent 45% plus vite.", "The Endless Deep": "Les Profondeurs sans fin", "A tank without a bottom — 65% less grime, +110% income, fish grow 60% faster.": "Un aquarium sans fond — 65% moins de saleté, +110% de revenus, les poissons grandissent 60% plus vite.", "Starfall Basin": "Bassin des étoiles filantes", "Falling starlight settles on the water — 70% less grime, +150% income, fish grow 75% faster.": "La lumière des étoiles filantes se pose sur l'eau — 70% moins de saleté, +150% de revenus, les poissons grandissent 75% plus vite.", "Nebula Atrium": "Atrium nébuleuse", "A hall of drifting stardust — 76% less grime, +200% income, fish grow 90% faster.": "Une salle de poussière d'étoiles à la dérive — 76% moins de saleté, +200% de revenus, les poissons grandissent 90% plus vite.", "Oblivion Trench": "Fosse de l'Oubli", "Deeper than any chart records — 82% less grime, +260% income, fish grow 110% faster.": "Plus profonde que toutes les cartes — 82% moins de saleté, +260% de revenus, les poissons grandissent 110% plus vite.", "The Infinite Ocean": "L'Océan infini", "Not a tank so much as a sea you happen to own — 88% less grime, +340% income, fish grow 140% faster.": "Moins un aquarium qu'une mer qui t'appartient — 88% moins de saleté, +340% de revenus, les poissons grandissent 140% plus vite.", "Old Sponge": "Vieille éponge", "Scrub one spot at a time.": "Frotte une tache à la fois.", "Scrub Brush": "Brosse à récurer", "Twice the reach.": "Deux fois plus de portée.", "Magnet Glider": "Aimant glisseur", "Glides across glass.": "Glisse sur la vitre.", "Auto-Skimmer": "Écumeur auto", "Auto-cleans 30% of the grime for you — and pays you for it, even while you're away.": "Nettoie 30% de la saleté pour toi — et te paie pour ça, même quand tu es absent.", "Reef Purifier": "Purificateur récifal", "Auto-cleans 60% of the grime for you — and pays you for it, even while you're away. Sparkles.": "Nettoie 60% de la saleté pour toi — et te paie pour ça, même quand tu es absent. Ça brille.", "Nanobot Swarm": "Essaim de nanobots", "Auto-cleans 80% of the grime and pays you for it. A spotless tank makes fish thrive: +10% passive income.": "Nettoie 80% de la saleté et te paie pour ça. Un aquarium impeccable fait prospérer les poissons: +10% de revenus passifs.", "Prismatic Current": "Courant prismatique", "Auto-cleans 92% of the grime and pays you for it. Near-flawless water: +25% passive income, permanently.": "Nettoie 92% de la saleté et te paie pour ça. Une eau presque parfaite: +25% de revenus passifs, pour toujours.", "Bio-Filter Matrix": "Matrice bio-filtre", "Auto-cleans 96% of the grime, +35% passive income, and fish stay fed 15% longer.": "Nettoie 96% de la saleté, +35% de revenus passifs, et les poissons restent nourris 15% plus longtemps." oupe", "Pet a stack of 100 fish at once": "Caresse une pile de 100 poissons d’un coup", "Clearance Sale": "Grande liquidation", "Sell 100 fish at once": "Vends 100 poissons d’un coup", "Quest Regular": "Habitué des quêtes", "Open 7 Daily Quest chests": "Ouvre 7 coffres de quêtes du jour", "Quest Legend": "Légende des quêtes", "Open 30 Daily Quest chests": "Ouvre 30 coffres de quêtes du jour", "Halo Climber": "Grimpeur d’auréole", "Reach player level 70": "Atteins le niveau 70", "Bilingual Keeper": "Gardien bilingue", "Switch the game language": "Change la langue du jeu", "Trillionaire": "Billionnaire", "Earn 1T coins total": "Gagne 1T de pièces au total"});Object.assign(FR,{"Divine fish": "Poissons Divins", "8 golden Divine fish, 5 new tanks and 10 decorations that cost trillions. Max level is now 80!": "8 poissons Divins dorés, 5 nouveaux aquariums et 10 décorations qui coûtent des billions. Le niveau maximum est maintenant 80 !"});Object.assign(FR,{"Genesis Koi": "Koï de la Genèse", "The first koi ever to swim. Its scales are thin sheets of pure gold, and every pond it visits becomes a little richer.": "Le tout premier koï. Ses écailles sont de fines feuilles d’or pur, et chaque bassin qu’il visite devient un peu plus riche.", "Halo Manta": "Raie auréole", "A glowing ring floats above it wherever it glides. Lucky coins fall out of the ring like warm rain.": "Un anneau lumineux flotte au-dessus d’elle. Des pièces chanceuses en tombent comme une pluie tiède.", "Nova Leviathan": "Léviathan nova", "Born from an exploding star, it still sparkles at the edges. Its glow makes coins split in two.": "Né d’une étoile qui explose, il scintille encore sur les bords. Sa lueur fait doubler les pièces.", "Paradise Puffer": "Poisson-globe du paradis", "When it puffs up, flowers bloom on its spikes. Everything around it grows three times faster.": "Quand il gonfle, des fleurs poussent sur ses épines. Tout autour de lui grandit trois fois plus vite.", "Infinity Shark": "Requin infini", "Its fin draws the infinity sign in the water. No collector has ever had enough coins to buy one back.": "Son aileron dessine le signe infini dans l’eau. Aucun collectionneur n’a jamais pu en racheter un.", "Cosmos Whale": "Baleine cosmos", "Inside its song you can hear whole galaxies being born. The entire tank earns more just by listening.": "Dans son chant, on entend naître des galaxies entières. Tout l’aquarium gagne plus rien qu’en l’écoutant.", "Eclipse Serpent": "Serpent de l’éclipse", "Half sun, half shadow. When it coils, day and night trade places, and fortune follows close behind.": "Moitié soleil, moitié ombre. Quand il s’enroule, le jour et la nuit échangent leur place, et la chance suit de près.", "Primordial Turtle": "Tortue primordiale", "Older than oceans, older than stars. The whole world once rested on its shell, and now it rests in your tank.": "Plus vieille que les océans, plus vieille que les étoiles. Le monde entier reposait sur sa carapace, et maintenant elle se repose dans ton aquarium.", "Halo Sanctuary": "Sanctuaire de l’auréole", "A golden ring of light floats over the water — 97% less grime, +1400% income, fish grow 380% faster.": "Un anneau de lumière dorée flotte sur l’eau — 97 % moins de saleté, +1400 % de revenus, les poissons grandissent 380 % plus vite.", "Sunforge Lagoon": "Lagon forge-soleil", "Warmed by a tiny captured sun — 97% less grime, +1700% income, fish grow 430% faster.": "Réchauffé par un petit soleil capturé — 97 % moins de saleté, +1700 % de revenus, les poissons grandissent 430 % plus vite.", "Diamond Deep": "Profondeurs de diamant", "Every wall is one flawless diamond — 98% less grime, +2100% income, fish grow 480% faster.": "Chaque paroi est un diamant parfait — 98 % moins de saleté, +2100 % de revenus, les poissons grandissent 480 % plus vite.", "Paradise Shallows": "Hauts-fonds du paradis", "Warm, golden, endless water — 98% less grime, +2600% income, fish grow 520% faster.": "Une eau chaude, dorée et sans fin — 98 % moins de saleté, +2600 % de revenus, les poissons grandissent 520 % plus vite.", "The Origin Sea": "La Mer des origines", "Where all water first began — 99% less grime, +3200% income, fish grow 580% faster.": "Là où toute l’eau a commencé — 99 % moins de saleté, +3200 % de revenus, les poissons grandissent 580 % plus vite.", "Golden Halo": "Auréole dorée", "Rainbow Bridge": "Pont arc-en-ciel", "Captured Sun": "Soleil capturé", "Diamond Ring": "Bague de diamant", "Crown Jewels": "Joyaux de la couronne", "Wishing Star": "Étoile à vœux", "Golden Temple": "Temple doré", "Heart of the Galaxy": "Cœur de la galaxie", "Infinity Loop": "Boucle infinie", "Origin Stone": "Pierre des origines", "Divine": "Divin", "Touched by Light": "Touché par la lumière", "Adopt a Divine creature": "Adopte une créature Divine", "Keeper of Creation": "Gardien de la Création", "Own every Divine creature": "Possède toutes les créatures Divines", "Back to the Beginning": "Retour aux origines", "Upgrade to The Origin Sea": "Passe à La Mer des origines", "Beyond Legend": "Au-delà de la légende", "Reach player level 80": "Atteins le niveau 80", "Golden Swimmer": "Nageur doré", "Halo Keeper": "Gardien de l’auréole", "Diamond Legend": "Légende de diamant", "Origin of the Seas": "Origine des mers"});Object.assign(FR,{"40 new decorations": "40 nouvelles décorations", "Cute and cosmic decor, from a Peacock Statue to a Ringed Planet. Enough to fill even the biggest tank!": "Des décos mignonnes et cosmiques, de la Statue de paon à la Planète à anneaux. Assez pour remplir même le plus grand aquarium !", "Tougher Rebirths": "Renaissances plus difficiles", "Each Rebirth now doubles all Market prices. Your Pearls make you stronger, so it stays a fair challenge.": "Chaque Renaissance double maintenant tous les prix du Marché. Tes Perles te rendent plus fort, alors le défi reste juste."});Object.assign(FR,{"📈 Harder each time": "📈 Plus difficile à chaque fois", "Every Rebirth doubles all Market prices. ections", "Full fish leave food for hungry ones, bulk buys give full XP, and no scrub quest when your tool keeps the tank clean.": "Les poissons rassasiés laissent la nourriture aux affamés, les achats en lot donnent toute l’XP, et plus de quête de nettoyage quand ton outil garde l’aquarium propre."});Object.assign(FR,{"⚡ Upgrades": "⚡ Amélio.", "Search upgrades…": "Chercher une amélioration…"});Object.assign(FR,{"Quick select": "Sélection rapide", "✅ All": "✅ Tous", "⬜ None": "⬜ Aucun"});FR['A treasure is sinking! Tap it!']='Un trésor coule ! Touche-le !';Object.assign(FR,{"Stacks of 100": "Piles de 100", "Big tanks now show each species in stacks of up to 100 (x100). Pet or feed a stack and every fish in it counts!": "Les gros aquariums montrent chaque espèce en piles de 100 maximum (x100). Caresse ou nourris une pile et tous ses poissons comptent !", "Rebirth": "Renaissance", "Start your tank over to earn Pearls. Each Pearl gives +3% income forever, and every run gets faster.": "Recommence ton aquarium pour gagner des Perles. Chaque Perle donne +3 % de revenus pour toujours, et chaque partie va plus vite.", "Level up income, growth, luck and more. They never max out!": "Monte tes revenus, ta croissance, ta chance et plus. Elles n’ont pas de maximum !", "Find and master every species for bonuses that last forever, even after Rebirth.": "Trouve et maîtrise chaque espèce pour des bonus qui durent pour toujours, même après une Renaissance.", "Treasures": "Trésors", "Once or twice a visit, a glowing clam sinks through your tank. Tap it fast for a huge boost like ×10 coins!": "Une ou deux fois par visite, une palourde brillante coule dans ton aquarium. Touche-la vite pour un énorme bonus comme ×10 pièces !", "Celestial fish & new tanks": "Poissons Célestes et nouveaux aquariums", "8 cosmic fish, 5 giant tanks and levels up to 60.": "8 poissons cosmiques, 5 aquariums géants et des niveaux jusqu’à 60.", "✨ What’s new": "✨ Nouveautés", "👀 Show me": "👀 Montre-moi", "← Back ’est jamais perdue, même quand tu renais.", " found": " trouvés", " mastered": " maîtrisés", "Mastered": "Maîtrisé", "<button class=\"btn wide ghost\" id=\"coBk\" style=\"margin-top:12px\">← Back to profile</button>": "<button class=\"btn wide ghost\" id=\"coBk\" style=\"margin-top:12px\">← Retour au profil</button>", "Collection": "Collection", "You have ": "Tu as ", " Pearls": " Perles", "Each Pearl gives +3% income forever → now ×": "Chaque Perle donne +3 % de revenus pour toujours → maintenant ×", "Rebirths: ": "Renaissances : ", "Rebirth now for +": "Renais maintenant pour +", "More coins earned this run = more Pearls. You need at least 10 (about 1B coins earned).": "Plus tu gagnes de pièces dans cette partie, plus tu as de Perles. Il en faut au moins 10 (environ 1B de pièces gagnées).", "Earned this run: ": "Gagné dans cette partie : ", "🔄 Starts over": "🔄 Repart à zéro", "Coins, fish, tank, tools, autofeeder, food, placed decor, Upgrades and player level.": "Pièces, poissons, aquarium, outils, distributeur, nourriture, déco placée, Améliorations et niveau.", "✅ You keep": "✅ Tu gardes", "Pearls, Collection, achievements, owned decor and cosmetics.": "Perles, Collection, succès, déco achetée et accessoires.", "🎁 Head start": "🎁 Coup de pouce", "You start the new run with 1,000 coins per Pearl.": "Tu recommences avec 1 000 pièces par Perle.", "🫧 Rebirth for +": "🫧 Renaître pour +", "Not enough yet": "Pas encore assez", "<button class=\"btn wide ghost\" id=\"rbBk\" style=\"margin-top:8px\">← Back to profile</button>": "<button class=\"btn wide ghost\" id=\"rbBk\" style=\"margin-top:8px\">← Retour au profil</button>", "Rebirth": "Renaissance", "Rebirth?": "Renaître ?", "Your tank starts over, but you get +": "Ton aquarium repart à zéro, mais tu gagnes +", " income forever).": " de revenus pour toujours).", "<button class=\"btn wide\" id=\"rbYes\">Yes, Rebirth!</button><button class=\"btn wide ghost\" id=\"rbNo\" style=\"margin-top:8px\">Not now</button></div>": " "use strict";
const K='fishies.save.v1';
const SLOTS_KEY='fishies.slots.v1', ACTIVE_KEY='fishies.activeSlot';
const slotKey=id=>'fishies.save.'+id;
function loadSlots(){
  try{const raw=localStorage.getItem(SLOTS_KEY);const arr=raw?JSON.parse(raw):[];return Array.isArray(arr)?arr:[];}
  catch(e){return [];}
}
function saveSlots(arr){try{localStorage.setItem(SLOTS_KEY,JSON.stringify(arr));}catch(e){}}
function getActiveSlot(){try{return localStorage.getItem(ACTIVE_KEY);}catch(e){return null;}}
function setActiveSlot(id){try{localStorage.setItem(ACTIVE_KEY,id);}catch(e){}}
function activeKey(){const id=getActiveSlot();return id?slotKey(id):null;}
function updateSlotMeta(id){
  if(!id||!S)return;
  const slots=loadSlots();
  const i=slots.findIndex(x=>x.id===id);
  const meta={id:id,name:S.name,difficulty:S.difficulty||'normal',coins:S.coins,totalCoins:S.totalCoins,
    fishCount:S.fish.length,achCount:Object.keys(S.ach).length,streak:S.streak,devMode:!!S.devMode,updated:Date.now()};
  if(i>=0)slots[i]=meta; else slots.push(meta);
  saveSlots(slots);
}
function ensureSlots(){
  let slots=loadSlots();
  const active=getActiveSlot();
  if(slots.length===0){
    let legacy=null;
    try{legacy=localStorage.getItem(K);}catch(e){}
    if(legacy){
      const id='s'+Date.now();
      try{localStorage.setItem(slotKey(id),legacy);}catch(e){}
      let name=T('Fish Keeper'), diffId='normal', coins=0, fishCount=0;
      try{const d=JSON.parse(legacy);name=d.name||name;coins=d.coins||0;fishCount=(d.fish||[]).length;diffId=d.difficulty||'normal';}catch(e){}
      slots=[{id:id,name:name,difficulty:diffId,coins:coins,fishCount:fishCount,updated:Date.now()}];
      saveSlots(slots); setActiveSlot(id);
      return id;
    }
    return null;
  }
  if(active&&slots.some(s=>s.id===active))return active;
  const fallback=slots.slice().sort((a,b)=>(b.updated||0)-(a.updated||0))[0];
  if(fallback){setActiveSlot(fallback.id);return fallback.id;}
  return null;
}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const now=()=>Date.now();
const fmt=n=>{
  n=Math.floor(n);
  const neg=n<0?'-':''; n=Math.abs(n);
  if(!isFinite(n))return neg+'∞';
  if(n>=1e15){
    /* quadrillion and up: Qa, Qi, Sx, Sp, Oc, No, Dc, then aa, ab, ac… forever */
    const U=['Qa','Qi','Sx','Sp','Oc','No','Dc'], g=Math.floor(Math.log10(n)/3), v=n/Math.pow(10,g*3);
    let u=U[g-5]; if(!u){const k=g-5-U.length;u=String.fromCharCode(97+Math.floor(k/26)%26)+String.fromCharCode(97+k%26);}
    return neg+(v>=100?Math.floor(v):v.toFixed(1).replace(/\.0$/,''))+u;
  }
  if(n>=1e12)return neg+(n/1e12).toFixed(n>=1e14?0:1).replace(/\.0$/,'')+'T';
  if(n>=1e9)return neg+(n/1e9).toFixed(n>=1e11?0:1).replace(/\.0$/,'')+'B';
  if(n>=1e6)return neg+(n/1e6).toFixed(n>=1e8?0:1).replace(/\.0$/,'')+'M';
  if(n>=1e4)return neg+(n/1e3).toFixed(1)+'k';
  return neg+String(n);
};

function drawFishInto(ctx,sp,px,py,scale,fish){
  const L=16*sp.size*scale;
  if(sp.shape==='star'){
    paintStarfish(ctx,sp,fish,px,py,L*.85,'sand',0);
    if(fish)drawCosmetics(ctx,fish,px,py-L*.5,L*.7,1);
    return;
  }
  if(sp.shape==='crab'){
    paintCrab(ctx,sp,fish,px,py,L*.85,1,0);
    if(fish)drawCosmetics(ctx,fish,px,py-L*.4,L*.7,1);
    return;
  }
  if(sp.shape==='anemone'){
    paintAnemone(ctx,sp,fish,px,py,L*.85,'sand',0);
    if(fish)drawCosmetics(ctx,fish,px,py-L*.8,L*.7,1);
    return;
  }
  if(sp.shape==='urchin'){
    paintUrchin(ctx,sp,fish,px,py,L*.85,'sand');
    if(fish)drawCosmetics(ctx,fish,px,py-L*.8,L*.7,1);
    return;
  }
  const [body,fin,acc]=colorsFor(fish,sp);
  ctx.save();ctx.translate(px,py);
  ctx.fillStyle=fin;ctx.beginPath();
  ctx.moveTo(-L*.86,0);ctx.lineTo(-L*1.6,-L*.6);
  ctx.quadraticCurveTo(-L*1.2,0,-L*1.6,L*.6);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-L*.28,-L*.36);
  ctx.quadraticCurveTo(0,-L*1.0,L*.34,-L*.30);
  ctx.quadraticCurveTo(0,-L*.46,-L*.28,-L*.36);ctx.fill();
  const g=ctx.createLinearGradient(0,-L*.7,0,L*.7);
  g.addColorStop(0,shade(body,34));g.addColorStop(.55,body);g.addColorStop(1,shade(body,-30));
  ctx.fillStyle=g;fishBody(ctx,sp,L,0);ctx.fill();
  fishBody(ctx,sp,L,0);fishPattern(ctx,sp,L,0);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(L*.55,-L*.14,L*.19,0,7);ctx.fill();
  ctx.fillStyle='#0d1520';ctx.beginPath();ctx.arc(L*.60,-L*.14,L*.1,0,7);ctx.fill();
  if(fish)drawCosmetics(ctx,fish,0,0,L,1);
  ctx.restore();
}
const THUMB=new Map(); let thumbIO=null;
function paintOneThumb(c){
  if(c.dataset.done)return; c.dataset.done='1';
  const sp=spec(c.dataset.sp); if(!sp)return;
  const k=sp.id+'|'+c.width;
  let src=THUMB.get(k);
  if(!src){src=document.createElement('canvas');src.width=c.width;src.height=c.height;
    drawFishInto(src.getContext('2d'),sp,c.width*.56,c.height*.5,c.width/70);THUMB.set(k,src);}
  const ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height); ctx.drawImage(src,0,0);
}
function paintThumbs(){
  const list=document.querySelectorAll('canvas.fc');
  if(list.length>40&&'IntersectionObserver' in window){
    if(thumbIO)thumbIO.disconnect();
    thumbIO=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){paintOneThumb(en.target);thumbIO.unobserve(en.target);}}),{rootMargin:'300px'});
    list.forEach(c=>thumbIO.observe(c));
  }else list.forEach(paintOneThumb);
}

function feedStack(e,fill){
  const mem=stackOf(e); if(mem.length<2)return;
  for(let i=1;i<mem.length;i++){const f=mem[i].f; f.hunger=clamp(f.hunger+fill,0,100); feedGrowth(f,null,null,false,true);}
}
function feedGrowth(f,x,y,wasHungry,quiet){
  const sp0=spec(f.sp);
  const gmul=(growthBoostActive()?1+(S.growthBoost||0):1)*(now()<(S.pGrowEnd||0)?10:1)*growUpgMul()*(sp0.growthMul||1)*(tankDef().growthMul||1)*(S.clean<40?0:1);
  if(sp0.feedBonus&&wasHungry)addCoins(Math.floor(sp0.feedBonus*boostMul()),false);
  if(wasHungry)addLove(f,.4,x,y);
  if((f.growth||0)<1){
    f.growth=clamp((f.growth||0)+.012*gmul,0,1);
    if(wasHungry)rollLucky(f,x,y);
    return;
  }
  if(fishLevel(f)<10){
    const lv0=fishLevel(f);
    f.xp=(f.xp||0)+1*gmul*(sp0.xpMul||1)*(1+.1*upgLv('xp'));
    const lv1=fishLevel(f);
    if(lv1>lv0&&!quiet){
      for(let i=0;i<10;i++)sparks.push({x:x,y:y,vx:rnd(-1.4,1.4),vy:rnd(-1.8,-.3),l:36,c:'#ffd166'});
      toast(f.name+T(' reached Level ')+lv1+'! ⭐','gold');
      sfx('ach'); checkAch();
    }
  }
  if(wasHungry)rollLucky(f,x,y);
}
const LUCKY_BONUS={common:200,rare:350,epic:600,legend:1000,mythic:2000,ancient:4000,eternal:25000,celestial:150000,divine:2000000};
function rollLucky(f,x,y){
  const base=spec(f.sp).luckyChance; if(!base)return;
  const chance=base*luckUpgMul()*(luckyBoostActive()?(1+(S.luckyBoost||0)):1);
  if(Math.random()>=chance)return;
  const bonus=LUCKY_BONUS[spec(f.sp).r]||500;
  for(let i=0;i<10;i++)sparks.push({x:x,y:y,vx:rnd(-1.4,1.4),vy:rnd(-1.8,-.3),l:34,c:'#ffe58a'});
  addCoins(Math.floor(bonus*boostMul()),true,x,y-16);

}
