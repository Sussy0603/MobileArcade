<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd6e0">
<title>Quackipelago</title>
<style>
/* =====================================================================
   QUACKIPELAGO — styles
   Pastel theme. Change the colors here to restyle the whole game.
===================================================================== */
:root{
  --pink:#ffd6e0; --pink2:#ff9fb6; --mint:#c8f2e0; --mint2:#4fc79f;
  --lemon:#fff4b8; --lemon2:#ffd34d; --lav:#e5dcff; --lav2:#a58cff;
  --sky:#d4ecff; --sky2:#6fb6ff; --peach:#ffe2cc; --coral:#ff8a7a;
  --ink:#4a3f55; --ink2:#7d7088; --card:#fffdf8; --line:#f0e4ea;
  --gold:#ffc83d; --good:#3fbf8f; --bad:#ff6b81;
  --r:18px; --font:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fdeef3;color:var(--ink);font-family:var(--font);font-size:calc(15px * var(--fs))}
body.easy{--font:Verdana,"Segoe UI",Tahoma,sans-serif;letter-spacing:.04em;word-spacing:.12em;line-height:1.5}
body.easy b,body.easy .nm{letter-spacing:.03em}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font-family:inherit;font-size:16px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:linear-gradient(#fff7fa,#ffe9f0);border-bottom:2px solid #ffd2de;z-index:20;flex-wrap:nowrap}
.pill{display:flex;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:4px 10px 4px 6px;font-weight:800;box-shadow:0 2px 0 #f3c9d6;white-space:nowrap;min-width:0}
.pill .ic{font-size:18px}
.pill.lv{flex:1;max-width:220px;padding-right:8px;min-width:76px}
@media (max-width:430px){#boosts .bst:nth-child(n+3){display:none}.pill{padding:4px 8px 4px 5px}}
.xpbar{flex:1;height:9px;background:#f4e7ee;border-radius:9px;overflow:hidden;min-width:40px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lav2),var(--pink2));border-radius:9px;transition:width .4s}
#boosts{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden}
.bst{font-size:11px;font-weight:800;background:var(--lemon);border-radius:99px;padding:3px 7px;white-space:nowrap}
#profBtn{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 0 #f3c9d6;display:grid;place-items:center;flex:none;overflow:hidden}
#profBtn svg{width:34px;height:34px}
/* ---------- body / nav ---------- */
#body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#main{flex:1;position:relative;min-width:0;overflow:hidden}
#nav{display:flex;justify-content:space-around;background:#fff;border-top:2px solid #ffd2de;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:14px;font-size:11px;font-weight:800;color:var(--ink2);position:relative}
#nav button .e{font-size:23px;line-height:1.1}
#nav button.on{background:var(--pink);color:var(--ink)}
.dot{position:absolute;top:2px;right:22%;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid #fff;display:none}
.dot.show{display:block}
@media (min-width:820px){
  #app{flex-direction:column}
  #body{flex-direction:row-reverse}
  #nav{flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:2px solid #ffd2de;padding:10px 8px;width:92px}
  #nav button{flex:none;padding:10px 0;font-size:12px}
  #nav button .e{font-size:28px}
  .view .inner{max-width:760px;margin:0 auto}
}
/* ---------- views ---------- */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding:12px 12px 30px;-webkit-overflow-scrolling:touch;background:#fdf3f6}
.view.on{display:block}
#vIsland{padding:0;overflow:hidden;background:#bfe6ff}
h2{margin:4px 0 10px;font-size:1.35em}
h3{margin:14px 0 8px;font-size:1.05em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 13px;border-radius:99px;background:#fff;font-weight:800;box-shadow:0 2px 0 var(--line)}
.tabs button.on{background:var(--lav);box-shadow:0 2px 0 #cbbcff}
.card{background:var(--card);border-radius:var(--r);padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:8px;box-shadow:0 3px 0 var(--line);position:relative}
.card .art{width:58px;height:58px;flex:none;border-radius:14px;background:var(--sky);display:grid;place-items:center;font-size:32px;overflow:hidden}
.card .art svg{width:54px;height:54px}
.card .info{flex:1;min-width:0}
.nm{font-weight:900}
.sub{font-size:.85em;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tile{background:var(--card);border-radius:16px;padding:8px 4px 6px;text-align:center;box-shadow:0 3px 0 var(--line);position:relative;font-size:.82em;font-weight:800}
.tile svg{width:72px;height:72px;display:block;margin:0 auto}
.tile .big{font-size:38px;line-height:72px;height:72px}
.tile.lock{opacity:.5}
.btn{background:var(--pink2);color:#fff;font-weight:900;padding:9px 14px;border-radius:14px;box-shadow:0 3px 0 #e07691;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #e07691}
.btn.mint{background:var(--mint2);box-shadow:0 3px 0 #2f9d78}
.btn.lav{background:var(--lav2);box-shadow:0 3px 0 #7c62dd}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 3px 0 #d79d12}
.btn.sky{background:var(--sky2);box-shadow:0 3px 0 #3f8ad6}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.wide{display:block;width:100%;margin-top:8px;padding:12px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.btn.sm{padding:6px 10px;font-size:.85em}
.tag{display:inline-block;font-size:.72em;font-weight:900;padding:2px 7px;border-radius:99px;background:var(--lemon);vertical-align:middle}
.r0{background:#eceff3}.r1{background:#cfe9ff}.r2{background:#e2d6ff}.r3{background:#ffe7a8}.r4{background:linear-gradient(90deg,#ffc3d8,#c9f3ff,#fff2a8)}
.bar{height:10px;border-radius:9px;background:#f1e6ec;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:9px}
.mood{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:.9em;font-weight:800}
.mood span{width:24px;text-align:center}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--ink2);font-size:.85em}
.center{text-align:center}
.lockic{position:absolute;top:4px;right:6px;font-size:13px}
/* ---------- island scene ---------- */
#scene{position:absolute;inset:0;overflow:hidden;touch-action:none}
#sceneBg{position:absolute;inset:0;width:100%;height:100%}
#ducks{position:absolute;inset:0}
.duck{position:absolute;width:64px;height:64px;margin:-56px 0 0 -32px;transform-origin:50% 90%;will-change:transform,left,top;touch-action:none}
.duck svg{width:100%;height:100%;overflow:visible;display:block}
.duck .bob{transform-origin:50% 90%;animation:bob .5s ease-in-out infinite alternate}
.duck.idle .bob{animation:breathe 2.2s ease-in-out infinite}
.duck.swim .bob{animation:swim 1.4s ease-in-out infinite}
.duck.sleep .bob{animation:breathe 3.4s ease-in-out infinite}
.duck.pop .bob{animation:pop .35s ease}
.duck .zz{position:absolute;top:-6px;right:-2px;font-size:15px;font-weight:900;color:#7a6ac9;animation:zz 2s infinite}
.duck .bub{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:17px;background:#fff;border-radius:12px;padding:0 4px;box-shadow:0 2px 0 #0001}
@keyframes bob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-4px) rotate(4deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes swim{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(2px) rotate(2deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25,.8)}70%{transform:scale(.9,1.15)}100%{transform:scale(1)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
.fx{position:absolute;pointer-events:none;font-size:20px;font-weight:900;z-index:9;animation:fxup 1s ease-out forwards}
@keyframes fxup{from{opacity:1;transform:translate(-50%,0) scale(.7)}30%{transform:translate(-50%,-14px) scale(1.15)}to{opacity:0;transform:translate(-50%,-50px) scale(1)}}
.splash{position:absolute;pointer-events:none;width:10px;height:10px;border-radius:50%;background:#fff;z-index:8;animation:spl .7s ease-out forwards}
@keyframes spl{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.nest{position:absolute;width:62px;height:34px;margin:-17px 0 0 -31px;pointer-events:none}
.bubble{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0 12%,#e3f5ffcc 13% 55%,#bfe4ffaa 70%,#9fd3ff88);border:2px solid #fff;z-index:12;animation:bubIn .3s ease}
@keyframes bubIn{from{transform:scale(0)}to{transform:scale(1)}}
#careBar{position:absolute;left:8px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:10}
.fab{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #0002;font-size:26px;display:grid;place-items:center;position:relative}
.fab small{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:900;background:#fff;border-radius:6px;padding:0 4px;white-space:nowrap}
.fab .bdg{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;font-size:11px;font-weight:900;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 4px}
#sideR{position:absolute;right:8px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:10}
#isleName{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fffc;border-radius:99px;padding:5px 14px;font-weight:900;z-index:10;white-space:nowrap;display:flex;gap:6px;align-items:center}
#isleName button{font-size:18px}
#hatch{position:absolute;top:48px;left:8px;display:flex;flex-direction:column;gap:6px;z-index:10}
.eggslot{width:54px;height:62px;background:#fffd;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:900;position:relative;box-shadow:0 3px 0 #0002}
.eggslot svg{width:36px;height:42px}
.eggslot.ready{animation:wob .6s ease-in-out infinite alternate;background:var(--lemon)}
@keyframes wob{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.eggslot .pb{position:absolute;bottom:4px;left:6px;right:6px;height:4px;background:#eee;border-radius:4px;overflow:hidden}
.eggslot .pb i{display:block;height:100%;background:var(--mint2)}
#captain{position:absolute;top:48px;right:8px;z-index:10;width:62px;height:62px}
#captain svg{width:62px;height:62px}
#captain .bdg{position:absolute;top:0;right:0;background:var(--bad);color:#fff;border-radius:99px;font-size:12px;font-weight:900;width:20px;height:20px;display:grid;place-items:center;animation:wob .5s infinite alternate}
#golden{position:absolute;z-index:15;width:60px;height:60px;display:none;filter:drop-shadow(0 0 10px #ffe066)}
#golden svg{width:60px;height:60px}
#nightTint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#1b1f5acc,#2b2266aa);mix-blend-mode:multiply;opacity:0;transition:opacity 2s;z-index:5}
#weather{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.drop{position:absolute;top:-20px;width:2px;height:14px;background:#ffffffaa;border-radius:2px;animation:fall linear infinite}
.flake{position:absolute;top:-20px;color:#fff;font-size:12px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
/* ---------- sheet / modal ---------- */
#modalBg{position:fixed;inset:0;background:#4a3f5566;display:none;z-index:50;align-items:center;justify-content:center;padding:14px}
#modalBg.on{display:flex}
#modal{background:#fff;border-radius:24px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:16px;box-shadow:0 10px 40px #0003;animation:mIn .25s ease;position:relative}
@keyframes mIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#modal h2{text-align:center;margin-top:0}
#mClose{position:absolute;top:8px;right:10px;font-size:22px;width:36px;height:36px;border-radius:50%;background:#f7eef2}
.reward{text-align:center}
.reward .big{font-size:60px;line-height:1.1}
.reward .amt{font-size:1.5em;font-weight:900;margin:6px 0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.tst{background:#fff;border-radius:14px;padding:9px 14px;font-weight:800;box-shadow:0 4px 14px #0002;animation:tIn .3s ease;max-width:100%;text-align:center}
.tst.gold{background:var(--lemon)}.tst.err{background:#ffe0e5}
@keyframes tIn{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
/* ---------- mini games ---------- */
#game{position:fixed;inset:0;z-index:60;background:#bfe6ff;display:none;touch-action:none}
#game.on{display:block}
#gCanvas{position:absolute;inset:0;width:100%;height:100%}
#gHud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:2;font-weight:900;font-size:1.1em}
#gHud .pill{font-size:1em}
#gOver{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#4a3f5555;z-index:3;padding:16px}
#gOver.on{display:flex}
#gOver .box{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:360px;text-align:center}
#memGrid{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);display:grid;gap:8px;z-index:1}
.mc{width:64px;height:76px;border-radius:14px;background:var(--lav2);box-shadow:0 3px 0 #7c62dd;font-size:34px;display:grid;place-items:center;transition:transform .25s}
.mc.up{background:#fff;box-shadow:0 3px 0 #ddd}
.mc.done{background:var(--mint);box-shadow:none;transform:scale(.92)}
/* ---------- loading ---------- */
#load{position:fixed;inset:0;z-index:100;background:linear-gradient(#ffe3ec,#d8efff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .6s}
#load .logo{font-size:2.4em;font-weight:900;color:#ff7fa0;text-shadow:0 3px 0 #fff;letter-spacing:.02em}
#load .wd{width:110px;height:110px;animation:bob .35s ease-in-out infinite alternate}
#load .tip{max-width:300px;text-align:center;font-weight:700;color:var(--ink2);padding:0 20px}
#load .lbar{width:200px;height:10px;background:#fff;border-radius:9px;overflow:hidden}
#load .lbar i{display:block;height:100%;width:0;background:var(--pink2);transition:width .3s}
/* ---------- tutorial ---------- */
#tut{position:fixed;left:72px;right:8px;top:calc(122px + env(safe-area-inset-top));z-index:45;display:none;pointer-events:none}
@media (min-width:820px){#tut{left:180px;right:90px}}
#tut.on{display:flex;justify-content:center}
#tut .box{pointer-events:auto;background:#fff;border-radius:20px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px #0003;max-width:460px;width:100%;border:3px solid var(--lemon2)}
#tut svg{width:58px;height:58px;flex:none}
#tut .tx{flex:1;font-weight:800;font-size:.95em}
.hl{outline:4px solid var(--lemon2)!important;outline-offset:2px;animation:hlp 1s infinite alternate;z-index:44}
@keyframes hlp{from{outline-color:var(--lemon2)}to{outline-color:var(--pink2)}}
/* ---------- map ---------- */
#mapWrap{position:relative;width:100%;aspect-ratio:1/1.15;max-width:min(560px,calc((100vh - 200px)/1.15));margin:0 auto;background:radial-gradient(circle at 50% 50%,#bfe9ff,#8fd0f5);border-radius:24px;overflow:hidden;box-shadow:0 4px 0 #7cbde3}
.mIsle{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:.75em;font-weight:900;width:92px}
.mIsle .blob{width:70px;height:56px;margin:0 auto;border-radius:50% 50% 46% 54%;display:grid;place-items:center;font-size:28px;box-shadow:0 4px 0 #0002;border:3px solid #fff}
.mIsle.lock .blob{filter:grayscale(.8);opacity:.7}
.mIsle.here .blob{border-color:var(--lemon2);box-shadow:0 0 0 4px #fff8,0 4px 0 #0002}
.boatDot{position:absolute;font-size:22px;transform:translate(-50%,-50%);transition:left 1s linear,top 1s linear}
.spinW{width:260px;height:260px;margin:6px auto;position:relative}
.spinW svg{width:100%;height:100%;transition:transform 3.2s cubic-bezier(.15,.9,.2,1)}
.spinW .ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:28px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle}
.seg{display:flex;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.seg button{flex:1;padding:8px 6px;font-weight:800}
.seg button.on{background:var(--lav)}
.plot{background:#c99a6b;border-radius:18px;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#fff;position:relative;box-shadow:inset 0 -6px 0 #a87a4f,0 3px 0 #0001;font-size:.82em}
.plot .crop{font-size:40px;line-height:1}
.plot.ready{animation:wob .7s infinite alternate}
.plot .pb{position:absolute;left:12px;right:12px;bottom:10px;height:6px;background:#0002;border-radius:6px;overflow:hidden}
.plot .pb i{display:block;height:100%;background:#9cf08a}
</style>
</head>
<body>
<div id="load">
  <div class="logo">Quackipelago</div>
  <div class="wd" id="loadDuck"></div>
  <div class="lbar"><i id="loadBar"></i></div>
  <div class="tip" id="loadTip"></div>
</div>
<div id="app">
  <div id="top">
    <div class="pill" id="pFeather"><span class="ic">🪶</span><span id="vFeather">0</span></div>
    <div class="pill" id="pGem"><span class="ic">💎</span><span id="vGem">0</span></div>
    <div class="pill lv" id="pLevel"><span class="ic">⭐</span><span id="vLevel">1</span><div class="xpbar"><i id="vXp"></i></div></div>
    <div id="boosts"></div>
    <button id="profBtn" aria-label="Profile"></button>
  </div>
  <div id="body">
    <div id="main">
      <div class="view on" id="vIsland">
        <div id="scene">
          <svg id="sceneBg" preserveAspectRatio="xMidYMid slice"></svg>
          <div id="nests"></div>
          <div id="ducks"></div>
          <div id="nightTint"></div>
          <div id="weather"></div>
        </div>
        <div id="isleName"></div>
        <div id="hatch"></div>
        <button id="captain"></button>
        <div id="careBar"></div>
        <div id="sideR"></div>
        <button id="golden"></button>
      </div>
      <div class="view" id="vDucks"><div class="inner" id="iDucks"></div></div>
      <div class="view" id="vMarket"><div class="inner" id="iMarket"></div></div>
      <div class="view" id="vGames"><div class="inner" id="iGames"></div></div>
      <div class="view" id="vMap"><div class="inner" id="iMap"></div></div>
      <div class="view" id="vMore"><div class="inner" id="iMore"></div></div>
    </div>
    <div id="nav"></div>
  </div>
</div>
<div id="modalBg"><div id="modal"><button id="mClose">✕</button><div id="mBody"></div></div></div>
<div id="toast"></div>
<div id="tut"><div class="box"><div id="tutCap"></div><div class="tx" id="tutTx"></div><button class="btn sm" id="tutBtn">OK</button></div></div>
<div id="game">
  <canvas id="gCanvas"></canvas>
  <div id="memGrid"></div>
  <div id="gHud"></div>
  <div id="gOver"><div class="box" id="gOverBox"></div></div>
</div>
<script>
/* =====================================================================
   QUACKIPELAGO  —  a cozy duck idle game
   ---------------------------------------------------------------------
   HOW THIS FILE IS ORGANISED
     1. CONFIG        ← all the tuning numbers. Change feel here.
     2. DATA          ← islands, ducks, items, outfits, quests...
     3. LANGUAGE      ← English / French words
     4. STATE + SAVE  ← what the game remembers
     5. ECONOMY       ← how feathers are made
     6. ART           ← ducks drawn in code (SVG)
     7. SOUND         ← quacks + music made in code
     8. ISLAND VIEW   ← ducks waddling, petting, care
     9. SCREENS       ← Ducks, Market, Games, Map, More
    10. MINI GAMES
    11. MONEY         ← ads + purchases (demo in browser)
    12. MAIN LOOP     ← ticks, offline, tutorial, start-up
===================================================================== */

/* =====================================================================
   1. CONFIG — tune the game here. Numbers only, no code knowledge needed.

function weighted(odds){let s=odds.reduce((a,b)=>a+b,0),r=Math.random()*s;for(let i=0;i<odds.length;i++){r-=odds[i];if(r<0)return i;}return odds.length-1;}
function fmt(n){
  n=Math.floor(n||0); if(n<1000) return String(n);
  const u=['K','M','B','T','Qa','Qi','Sx','Sp'];let i=-1;
  while(n>=1000&&i<u.length-1){n/=1000;i++;}
  return (n>=100?Math.floor(n):n>=10?(Math.floor(n*10)/10):(Math.floor(n*100)/100))+u[i];
}
function fmtTime(sec){
  sec=Math.max(0,Math.ceil(sec));
  if(sec<60) return sec+'s';
  const m=Math.floor(sec/60), s=sec%60;
  if(m<60) return m+'m'+(s?' '+s+'s':'');
  const h=Math.floor(m/60); if(h<48) return h+'h '+(m%60)+'m';
  return Math.floor(h/24)+'d '+(h%24)+'h';
}
function dayNum(t){const d=new Date(t);return Math.floor((t-d.getTimezoneOffset()*60000)/86400000);}

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){ const o = JSON.parse(raw); if(o && o.v) return fixState(o); }
  }catch(e){}
  return null;
}
/* fills in anything missing from an older save */
function fixState(o){
  const d = newState();
  for(const k in d) if(o[k]===undefined) o[k]=d[k];
  for(const k in d.stats) if(o.stats[k]===undefined) o.stats[k]=d.stats[k];
  for(const k in d.inv) if(o.inv[k]===undefined) o.inv[k]=0;
  o.open.forEach(id=>{ if(!o.isl[id]) o.isl[id]=newIsland(); });
  return o;
}

/* ---------- time helpers ---------- */
function isNight(t){ const h=new Date(t||now()).getHours(); return h>=CONFIG.NIGHT_START || h<CONFIG.NIGHT_END; }
function isWeekend(t){ const d=new Date(t||now()).getDay(); return d===0||d===6; }
function easterDate(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da);
}
/* which holiday is on right now (by real date, 1 week each) */
function activeEvent(t){
  if(CONFIG.EVENT_TEST) return CONFIG.EVENT_TEST;
  const d=new Date(t||now()), y=d.getFullYear(), md=(d.getMonth()+1)*100+d.getDate();
  if(md>=208&&md<=214) return 'valentine';
  if(md>=1025&&md<=1031) return 'halloween';
  if(md>=1219&&md<=1225) return 'christmas';
  const e=easterDate(y), start=new Date(e.getFullYear(),e.getMonth(),e.getDate()-6), end=new Date(e.getFullYear(),e.getMonth(),e.getDate()+1);
  if(d>=start&&d<end) return 'easter';
  return null;
}

/* =====================================================================
   5. ECONOMY — feathers, ducks, levels, costs, quests, badges
===================================================================== */
const MOOD_RATE = () => 100 / (CONFIG.MOOD_EMPTY_HOURS * 3600);
const costMult = () => 1 + S.mig * CONFIG.MIGRATE_COST_UP;
const goldenMult = () => 1 + S.mig * CONFIG.GOLDEN_BONUS;
const tierOf = isle => Math.max(0, S.open.indexOf(isle));
const tierMult = isle => Math.pow(CONFIG.ISLAND_TIER_MULT, tierOf(isle));
const stageOf = d => d.grow < CONFIG.GROW_TEEN_SEC ? 0 : d.grow < CONFIG.GROW_ADULT_SEC ? 1 : 2;
const maxLv = d => CONFIG.MAX_DUCK_LV[d.r];
const duckById = id => S.ducks.find(d => d.id === id);
const ducksOn = isle => S.ducks.filter(d => d.i === isle);
const isleCap = isle => CONFIG.ISLAND_CAP + (S.isl[isle] ? S.isl[isle].exp : 0) * CONFIG.EXPAND_CAP;
const moodAvg = d => (d.m.food + d.m.clean + d.m.fun + d.m.sleep) / 4;
const isGlow = d => d.b === 'glow';

/* is this duck asleep right now? (nest, or night for day ducks, or day for glow ducks) */
function asleep(d, night){
  if(d.slp) return true;
  if(night === undefined) night = isNight();
  return isGlow(d) ? !night : night;
}
function paidBonus(){
  let b = 0;
  for(const k in S.paid) if(S.paid[k] && PAID_DUCKS[k]) b += PAID_DUCKS[k].bonus;
  if(S.noAds) b += NOADS.duck.bonus;
  return b;
}
function islandBoost(isle){
  const I = S.isl[isle]; if(!I) return 1;
  const decor = I.decor.filter(Boolean).length;
  const star = I.star && S.ducks.some(d => d.st && d.i === isle);
  return 1 + I.items.basket * 0.08 + decor * CONFIG.DECOR_BONUS + (star ? CONFIG.STAR_BOOST : 0);
}
function globalMult(t){
  t = t || now();
  let m = goldenMult() * (1 + paidBonus());
  if(S.ad2x > t) m *= 2;
  if(isWeekend(t)) m *= CONFIG.WEEKEND_MULT;
  if(S.weather.k === 'sunny') m *= 1.1;
  return m;
}
/* feathers per second for one duck (without global boosts) */
function duckRate(d, night){
  if(d.i === '_sea') return 0;
  if(night === undefined) night = isNight();
  let r = CONFIG.BASE_RATE * CONFIG.RARITY_MULT[d.r] * (1 + CONFIG.DUCK_LV_BONUS * (d.lv - 1)) * CONFIG.STAGE_EARN[stageOf(d)];
  r *= CONFIG.SAD_MIN + (1 - CONFIG.SAD_MIN) * moodAvg(d) / 100;
  if(d.t === 'fluffy') r *= 1.25;
  if(isGlow(d)) r *= night ? CONFIG.NIGHT_GLOW : CONFIG.DAY_GLOW;
  else if(night) r *= d.t === 'sleepy' ? 1 : CONFIG.NIGHT_DAYDUCK;
  if(d.fr){ const f = duckById(d.fr); if(f && f.i === d.i) r *= 1 + CONFIG.FRIEND_BONUS; }
  return r * tierMult(d.i) * islandBoost(d.i);
}
function incomePerSec(){
  const n = isNight(), g = globalMult();
  return S.ducks.reduce((a, d) => a + duckRate(d, n), 0) * g;
}
function isleIncome(isle){
  const n = isNight(), g = globalMult();
  return ducksOn(isle).reduce((a, d) => a + duckRate(d, n), 0) * g;
}
/* never less than this for rewards that scale with income */
const incomeFloor = () => Math.max(2, incomePerSec());

function addF(n){ S.f += n; if(n > 0) S.stats.feathers += n; }
function canPay(cur, n){ return cur === 'g' ? S.g >= n : S.f >= n; }
function pay(cur, n){
  if(!canPay(cur, n)){ toast(cur === 'g' ? tr('Not enough gems') : tr('Not enough feathers'), 'err'); sfx('err'); return false; }
  if(cur === 'g') S.g -= n; else S.f -= n; return true;
}

/* ---------- player level ---------- */
const xpNeed = lv => Math.round(CONFIG.XP_BASE * Math.pow(lv, CONFIG.XP_POW));
function titleOf(lv){ let t = TITLES[0][1]; TITLES.forEach(([l, n]) => { if(lv >= l) t = n; }); return t; }
function addXP(n){
  S.xp += Math.round(n);
  let ups = 0;
  while(S.xp >= xpNeed(S.lv)){ S.xp -= xpNeed(S.lv); S.lv++; ups++; levelReward(S.lv); }
  if(ups){ sfx('level'); refreshTop(); }
}
function levelReward(lv){
  let gems = CONFIG.LEVEL_GEMS + (lv % 5 === 0 ? 10 : 0);
  S.g += gems;
  const outs = Object.keys(OUTFITS).filter(k => OUTFITS[k].reward === lv);
  outs.forEach(k => S.outfits[k] = 1);
  queueModal(() => showReward('⭐', tr('Level {n}!', {n:lv}),
    '+' + gems + ' 💎' + outs.map(k => '<br>' + OUTFITS[k].e + ' ' + L(OUTFITS[k])).join('') +
    (titleOf(lv) !== titleOf(lv - 1) ? '<br><b>' + tr('New title') + ': ' + L(titleOf(lv)) + '</b>' : '')));
  checkBadges();
}

/* ---------- making ducks ---------- */
function rollLook(isle, tier){
  const night = tier === 'night';
  return {
    b: night ? 'glow' : pick(BREED_IDS),
    c: pick(Object.keys(COLORS)),
    p: Math.random() < 0.55 ? 'none' : pick(['spots','stripes','sparkles']),
    t: pick(TRAIT_IDS),
  };
}
function makeDuck(opt){
  const d = {
    id: S.nextId++, n: opt.n || pick(NAMES), b: opt.b || 'classic', c: opt.c || 'yellow', p: opt.p || 'none',
    r: opt.r || 0, t: opt.t || pick(TRAIT_IDS), i: opt.i || S.cur, look: opt.look !== undefined ? opt.look : (opt.i || S.cur),
    born: now(), grow: opt.adult ? CONFIG.GROW_ADULT_SEC : 0, lv: 1, love: 0,
    m: {food:80, clean:90, fun:80, sleep:90}, o: Object.assign({}, opt.o || {}), fr: null, st: !!opt.st, pd: opt.pd || null, slp: 0, par: opt.par || null,
    ev: opt.ev || null,
  };
  S.ducks.push(d);
  addToBook(d);
  return d;
}
function bookKey(d){ return (d.look || 'pond') + ':' + d.b; }
function addToBook(d){
  if(d.pd || d.ev || d.st) return;
  const k = bookKey(d);
  if(S.book[k]) return;
  S.book[k] = 1;
  const reward = Math.round(incomeFloor() * 60);
  addF(reward); S.g += 1;
  toast('📖 ' + tr('New in Duck Book!') + ' +1 💎 +' + fmt(reward) + ' 🪶', 'gold');
  const isle = d.look || 'pond';
  const page = ['classic','mallard','rubber','mandarin','runner','glow'].every(b => S.book[isle + ':' + b]);
  if(page && !S.pagesDone[isle]){
    S.pagesDone[isle] = 1;
    queueModal(() => {
      const m = makeDuck({b:pick(BREED_IDS), c:pick(Object.keys(COLORS)), p:'sparkles', r:4, i:S.cur, look:isle, adult:true});
      showReward(duckSVG(m, {size:110}), tr('Page complete!'), tr('A Mythic duck joins you!') + '<br><b>' + esc(m.n) + '</b>');
      renderIsland();
    });
  }
}
/* hatch an egg into a duck */
function hatchEgg(egg, skipModal){
  const odds = EGGS[egg.tier].odds;
  const look = rollLook(egg.isle, egg.tier);
  const r = egg.forceR !== undefined ? egg.forceR : weighted(odds);
  const mix = egg.mix || {};
  const d = makeDuck(Object.assign({r, i:S.cur, look:egg.isle}, look, mix, {par:egg.par || null}));
  if(egg.par){ const p = duckById(egg.par); if(!p || p.i !== d.i) d.par = null; }
  else {
    // a duckling follows an adult on the same island
    const adults = ducksOn(d.i).filter(x => stageOf(x) === 2 && x.id !== d.id);
    if(adults.length) d.par = pick(adults).id;
  }
  S.stats.hatched++;
  qCount('hatch');
  addXP(10);
  sfx('hatch');
  if(!skipModal) showReward(duckSVG(d, {size:110}), tr('It hatched!'),
    '<span class="tag" style="background:' + RARITY[d.r].c + ';color:#fff">' + L(RARITY[d.r]) + '</span> ' + L(BREEDS[d.b]) + ' · ' + TRAITS[d.t].e + ' ' + L(TRAITS[d.t]) +
    '<div style="margin-top:10px"><input id="nmIn" maxlength="14" value="' + esc(d.n) + '" style="padding:8px;border-radius:10px;border:2px solid #eee;text-align:center;width:70%"></div>',
    () => { const v = ($('nmIn') || {}).value; if(v && v.trim()) d.n = v.trim().slice(0, 14); renderIsland(); });
  checkBadges();
  return d;
}
function eggPrice(tier){
  const E = EGGS[tier];
  if(E.cur === 'g') return E.price;
  return Math.round(E.price * Math.pow(CONFIG.EGG_PRICE_GROWTH, S.eggsBought[tier] || 0) * Math.pow(3, tierOf(S.cur)) * costMult());
}
function addEgg(tier, isle, opt){
  opt = opt || {};
  const E = EGGS[tier];
  const dur = opt.dur || E.sec;
  const egg = Object.assign({id: S.nextId++, tier, isle: isle || S.cur, start: now(), dur, warm: 0, night: !!E.night}, opt);
  if(S.eggs.length >= CONFIG.NEST_SLOTS){ (S.eggBag = S.eggBag || []).push(egg); toast('🥚 ' + tr('Nests are full — the egg waits its turn'), 'err'); }
  else S.eggs.push(egg);
  renderHatch();
}
function eggLeft(e){
  // night eggs only warm during the night
  const el = (e.night ? (e.nightSec || 0) : (now() - e.start) / 1000) + e.warm;
  return Math.max(0, e.dur - el);
}
const nestFree = () => S.eggs.length < CONFIG.NEST_SLOTS;

/* ---------- duck levels ---------- */
function duckLvCost(d){ return Math.round(CONFIG.DUCK_LV_COST * CONFIG.RARITY_MULT[d.r] * Math.pow(CONFIG.DUCK_LV_GROWTH, d.lv - 1) * Math.pow(2, tierOf(d.i)) * costMult()); }
function duckLevelUp(d, free){
  if(d.lv >= maxLv(d)) return false;
  d.lv++; d.grow += 120;
  addXP(3);
  return true;
}
function addLove(d, n){
  d.love += n;
  while(d.love >= CONFIG.LOVE_PER_LEVEL){
    if(d.lv >= maxLv(d)){ d.love = CONFIG.LOVE_PER_LEVEL - 1; break; }
    d.love -= CONFIG.LOVE_PER_LEVEL; duckLevelUp(d, true);
    fxAtDuck(d, '⬆️ ' + tr('Lv') + ' ' + d.lv);
  }
}
function sellPrice(d){ return Math.round((60 + duckLvCost(d) * 1.5) * (stageOf(d) === 2 ? 1 : 0.5)); }

/* ---------- island costs ---------- */
function itemCost(isle, k){ return Math.round(ITEMS[k].base * Math.pow(1.15 + 0.03 * 0, S.isl[isle].items[k]) * Math.pow(1.6, S.isl[isle].items[k] > 9 ? S.isl[isle].items[k] - 9 : 0) * Math.pow(3, tierOf(isle)) * costMult()); }
function expandCost(isle){ return Math.round(2000 * Math.pow(4, S.isl[isle].exp) * Math.pow(3, tierOf(isle)) * costMult()); }
function nextIslandCost(){ const n = S.open.length - 1; return Math.round((CONFIG.ISLAND_COST[n] || 1e13) * costMult()); }
function nextIslandLevel(){ return CONFIG.ISLAND_LEVEL[S.open.length - 1] || 99; }
function boatCost(k){ const lv = S.boat[k]; const base = {speed:400, seats:600, range:500}[k]; return Math.round(base * Math.pow(k === 'range' ? 9 : 3.2, lv) * costMult()); }
const boatSeats = () => CONFIG.BOAT_SEATS_START + S.boat.seats;
const boatMax = {speed:8, seats:8, range:8};
function tripSec(to){ const I = ISLE(to); return Math.max(30, CONFIG.TRIP_SEC * (1 + I.dist * 0.3) * Math.pow(1 - CONFIG.BOAT_SPEED_CUT, S.boat.speed)); }
const plotCost = () => Math.round(300 * Math.pow(3, S.garden.plots.length - CONFIG.PLOTS_START) * costMult());
const turtleCost = () => Math.round(1500 * Math.pow(4, S.garden.turtles) * costMult());
const turtleMax = () => Math.ceil(S.garden.plots.length / 3);

/* ---------- quests (Captain's story, one at a time, per island) ---------- */
function questsFor(isle){
  const t = tierOf(isle);
  if(isle === 'pond') return [
    {k:'pet', n:5}, {k:'hatch', n:1}, {k:'ducks', n:3}, {k:'item', it:'basket', n:2},
    {k:'games', n:1}, {k:'decor', n:1}, {k:'feed', n:3}, {k:'earn', n:2500}, {k:'ducks', n:6}, {k:'item', it:'nest', n:5},
  ];
  return [
    {k:'ducks', n:3 + t * 2}, {k:'feed', n:3 + t}, {k:'item', it:'basket', n:3 + t}, {k:'decor', n:2},
    {k:'pet', n:10 + t * 3}, {k:'hatch', n:2}, {k:'earn', n:Math.round((CONFIG.ISLAND_COST[t] || 1e12) * 0.6)},
    {k:'item', it:pick(['nest','feeder','bath']), n:6 + t}, {k:'ducks', n:8 + t * 2},
  ].map((q, i) => (q.k === 'item' && i === 7) ? Object.assign(q, {it:['nest','feeder','bath'][t % 3]}) : q);
}
function questText(q){
  const n = q.k === 'earn' ? fmt(q.n) : q.n;
  return {
    pet: tr('Pet ducks {n} times here', {n}), hatch: tr('Hatch {n} eggs here', {n}), ducks: tr('Have {n} ducks here', {n}),
    item: tr('Upgrade {it} to level {n}', {n, it: q.it ? ITEMS[q.it].e + ' ' + L(ITEMS[q.it]) : ''}),
    games: tr('Play {n} mini games', {n}), decor: tr('Place {n} decor here', {n}), feed: tr('Feed the ducks {n} times here', {n}),
    earn: tr('Earn {n} feathers', {n}),
  }[q.k];
}
function curQuest(isle){ const I = S.isl[isle]; const qs = questsFor(isle); return I.q < qs.length ? qs[I.q] : null; }
function qProgress(isle, q){
  const I = S.isl[isle], c = I.cnt;
  switch(q.k){
    case 'ducks': return ducksOn(isle).length;
    case 'item': return I.items[q.it];
    case 'decor': return I.decor.filter(Boolean).length;
    case 'earn': return S.stats.feathers - (I.qStart || 0);
    default: return c[q.k] || 0;
  }
}
function qCount(k, isle){ isle = isle || S.cur; const I = S.isl[isle]; if(!I) return; I.cnt[k] = (I.cnt[k] || 0) + 1; }
function questReady(isle){ const q = curQuest(isle); return q && qProgress(isle, q) >= q.n; }
function claimQuest(isle){
  const I = S.isl[isle], q = curQuest(isle); if(!q || qProgress(isle, q) < q.n) return;
  const t = tierOf(isle);
  const fe = Math.round(Math.max(150, incomeFloor() * 120));
  const gems = (I.q % 3 === 2) ? 3 : 1;
  addF(fe); S.g += gems; addXP(20 + 10 * t);
  I.q++; I.cnt = {}; I.qStart = S.stats.feathers;
  sfx('coin');
  showReward(capSVG(90), tr('Quest done!'), '+' + fmt(fe) + ' 🪶  +' + gems + ' 💎');
  saveNow();
}
function starReady(isle){
  const I = S.isl[isle];
  return !I.star && I.q >= questsFor(isle).length && ITEM_IDS.every(k => I.items[k] >= CONFIG.ITEM_MAX_LV);
}
function unlockStar(isle){
  if(!starReady(isle)) return;
  const I = S.isl[isle], is = ISLE(isle);
  I.star = true;
  const d = makeDuck({n: L(is.star), b: pick(BREED_IDS), c: pick(Object.keys(COLORS)), p:'sparkles', r:3, i:isle, look:isle, adult:true, st:true, o:{hat:'crown'}});
  d.lv = 10;
  showReward(duckSVG(d, {size:110}), tr('Island star!'), '<b>' + esc(d.n) + '</b><br>' + tr('+50% feathers on this island'));
  renderIsland(); saveNow();
}

/* =====================================================================
   6. ART — every duck is drawn in code (SVG). No image files needed.
===================================================================== */
function shade(hex, amt){ // amt -1..1 (darker..lighter)
  let c = hex.replace('#',''); if(c.length===3) c = c.split('').map(x=>x+x).join('');
  let r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function mix(a, b, p){
  const pa=x=>[parseInt(x.substr(1,2),16),parseInt(x.substr(3,2),16),parseInt(x.substr(5,2),16)];
  const A=pa(a), B=pa(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*p).toString(16).padStart(2,'0')).join('');

/* =====================================================================
   7. SOUND — quacks, pops and a little tune per island (WebAudio, no files)
===================================================================== */
let AC = null, musGain = null, sfxGain = null, musTimer = null, musIsle = null, musStep = 0;
function audio(){
  if(AC) return AC;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(AC.destination);
    musGain = AC.createGain(); musGain.gain.value = 0.12; musGain.connect(AC.destination);
  }catch(e){ AC = null; }
  return AC;
}
function tone(f, dur, type, vol, when, dest, slide){
  const A = audio(); if(!A) return;
  const t = (when || A.currentTime);
  const o = A.createOscillator(), g = A.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxGain); o.start(t); o.stop(t + dur + 0.05);
}
function quack(pitch){
  const A = audio(); if(!A || !S || !S.snd) return;
  const t = A.currentTime, p = pitch || rnd(0.9, 1.25);
  const o = A.createOscillator(), f = A.createBiquadFilter(), g = A.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(520 * p, t); o.frequency.exponentialRampToValueAtTime(300 * p, t + 0.16);
  f.type = 'bandpass'; f.frequency.value = 1300 * p; f.Q.value = 3;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(f); f.connect(g); g.connect(sfxGain); o.start(t); o.stop(t + 0.25);
}
function sfx(k){
  if(!S || !S.snd || !audio()) return;
  const A = AC, t = A.currentTime;
  switch(k){
    case 'tap': tone(660, 0.06, 'triangle', 0.15); break;
    case 'pop': tone(900, 0.08, 'sine', 0.3, t, null, 1600); break;
    case 'coin': tone(988, 0.08, 'square', 0.12); tone(1319, 0.14, 'square', 0.12, t + 0.07); break;
    case 'err': tone(220, 0.15, 'square', 0.1); tone(180, 0.18, 'square', 0.1, t + 0.1); break;
    case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.25, t + i * 0.09)); break;
    case 'hatch': tone(700, 0.06, 'square', 0.12); tone(1000, 0.08, 'square', 0.12, t + 0.08); setTimeout(() => quack(1.5), 200); break;
    case 'splash': {
      const n = A.createBufferSource(), b = A.createBuffer(1, A.sampleRate * 0.3, A.sampleRate), dd = b.getChannelData(0);
      for(let i=0;i<dd.length;i++) dd[i] = (Math.random()*2-1) * Math.pow(1 - i/dd.length, 2);
      const f = A.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
      const g = A.createGain(); g.gain.value = 0.35; n.buffer = b; n.connect(f); f.connect(g); g.connect(sfxGain); n.start(); break;
    }
    case 'win': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, 'square', 0.1, t + i * 0.1)); break;
    case 'whoosh': tone(300, 0.3, 'sine', 0.15, t, null, 900); break;
  }
}
/* tiny generative music: each island has its own scale, speed and sound */
function musicStart(){
  if(!S || !S.mus || !audio()) { musicStop(); return; }
  if(musTimer && musIsle === S.cur) return;
  musicStop();
  musIsle = S.cur;
  const I = ISLE(S.cur) || ISLANDS[0];
  const [scale, bpm, wave] = I.music;
  const step = 60 / bpm / 2;
  const root = 262 * Math.pow(2, (ISLANDS.indexOf(I) % 5 - 2) / 12);
  const prog = [0, 5, 3, 4];
  musStep = 0;
  musTimer = setInterval(() => {
    if(!AC || AC.state !== 'running') return;
    const t = AC.currentTime + 0.05;
    const bar = Math.floor(musStep / 8) % 4, beat = musStep % 8;
    const chord = prog[bar];
    if(beat === 0 || beat === 4) tone(root / 2 * Math.pow(2, scale[chord % scale.length] / 12), step * 3, 'sine', 0.5, t, musGain);
    if(Math.random() < 0.7){
      const deg = (chord + [0, 2, 4, 2, 1, 3, 4, 2][beat] + (Math.random() < 0.2 ? 1 : 0));
      const oct = Math.floor(deg / scale.length);
      const f = root * Math.pow(2, (scale[deg % scale.length] + 12 * oct) / 12);
      tone(f, step * 1.6, wave, wave === 'square' || wave === 'sawtooth' ? 0.08 : 0.25, t, musGain);
    }
    musStep++;
  }, step * 1000);
}
function musicStop(){ if(musTimer) clearInterval(musTimer); musTimer = null; musIsle = null; }
function audioUnlock(){ const A = audio(); if(A && A.state === 'suspended') A.resume(); musicStart(); }

/* ---------- petting + dragging to a nest ---------- */
function bindDuck(a){
  let sx, sy, drag = false, down = false;
  a.el.addEventListener('pointerdown', e => {
    e.stopPropagation(); down = true; drag = false; sx = e.clientX; sy = e.clientY;
    a.el.setPointerCapture && a.el.setPointerCapture(e.pointerId);
  });
  a.el.addEventListener('pointermove', e => {
    if(!down) return;
    if(!drag && Math.hypot(e.clientX - sx, e.clientY - sy) > 12){ drag = true; a.dragging = true; a.el.style.zIndex = 999; }
    if(drag){ const p = toPct(e.clientX, e.clientY); a.x = p[0]; a.y = p[1] + 4; a.tx = a.x; a.ty = a.y; placeActor(a); }
  });
  const up = e => {
    if(!down) return; down = false;
    const d = duckById(a.id); if(!d) return;
    if(drag){
      a.dragging = false; drag = false;
      // dropped on a nest?
      let best = -1, bd = 9;
      for(let i=0;i<nestCount();i++){ const [x,y] = NEST_POS[i]; const dd = Math.hypot(x - a.x, (y - a.y) * 1.4); if(dd < bd){ bd = dd; best = i; } }
      if(best >= 0 && bd < 7){
        const taken = ducksOn(S.cur).some(o => o.slp && o.nest === best && o.id !== d.id);
        if(taken){ toast(tr('That nest is taken'), 'err'); }
        else { d.slp = 1; d.nest = best; a.x = NEST_POS[best][0]; a.y = NEST_POS[best][1]; a.tx = a.x; a.ty = a.y; fxAtDuck(d, '💤'); sfx('tap'); renderDucks(); }
      } else if(!inEll(a.x, a.y, LAND, 0.95)){ const p = randLand(); a.tx = p[0]; a.ty = p[1]; }
      return;
    }
    petDuck(d, a);
  };
  a.el.addEventListener('pointerup', up);
  a.el.addEventListener('pointercancel', () => { down = false; drag = false; a.dragging = false; });
}
function toPct(cx, cy){ const r = sceneEl().getBoundingClientRect(); return [ (cx - r.left) / r.width * 100, (cy - r.top) / r.height * 100 ]; }
function petDuck(d, a){
  const t = now();
  quack(stageOf(d) === 0 ? 1.6 : stageOf(d) === 1 ? 1.25 : rnd(0.9, 1.1));
  a.el.classList.remove('pop'); void a.el.offsetWidth; a.el.classList.add('pop');
  setTimeout(() => a.el.classList.remove('pop'), 360);
  fxAtDuck(d, pick(['💛','💕','💖','💗']));
  if(inEll(a.x, a.y, POND)){ splashAt(a.x, a.y); }
  if(t - (a.pet || 0) < CONFIG.PET_COOLDOWN_MS) return;
  a.pet = t;
  if(d.slp && d.m.sleep < 100){ /* petting a sleeping duck keeps it asleep */ }
  addLove(d, CONFIG.PET_LOVE);
  d.m.fun = Math.min(100, d.m.fun + CONFIG.PET_FUN);
  S.stats.pets++; qCount('pet'); addXP(1);
  if(S.ev.id && Math.random() < 0.25){ S.ev.cur += 1; fxAtDuck(d, EVENTS[S.ev.id].cur + '+1', 400); }
  tutEvent('pet');
}
function fxAt(x, y, txt, delay){
  setTimeout(() => {
    const f = document.createElement('div'); f.className = 'fx'; f.textContent = txt;
    f.style.left = x + '%'; f.style.top = y + '%'; sceneEl().appendChild(f);
    setTimeout(() => f.remove(), 1000);
  }, delay || 0);
}
function fxAtDuck(d, txt, delay){ const a = actors[d.id]; if(a) fxAt(a.x, a.y - 9, txt, delay); }
function splashAt(x, y){
  sfx('splash');
  for(let i=0;i<8;i++){
    const s = document.createElement('div'); s.className = 'splash';
    s.style.left = x + '%'; s.style.top = y + '%';
    const ang = Math.PI + Math.random() * Math.PI;
    s.style.setProperty('--dx', Math.cos(ang) * rnd(14, 30) + 'px'); s.style.setProperty('--dy', Math.sin(ang) * rnd(10, 26) + 'px');
    s.style.background = i % 2 ? '#fff' : '#cfeeff';
    sceneEl().appendChild(s); setTimeout(() => s.remove(), 700);
  }
}

function tuckAll(){

    used.push(free); d.slp = 1; d.nest = free; n++;
    const a = actors[d.id]; if(a){ a.tx = NEST_POS[free][0]; a.ty = NEST_POS[free][1]; }

/* ---------- the animation loop for ducks ---------- */
function placeActor(a){
  a.el.style.left = a.x + '%'; a.el.style.top = a.y + '%';
  a.el.style.zIndex = a.dragging ? 999 : Math.round(a.y * 10);
}
function stepActors(dt){
  const here = ducksOn(S.cur);
  here.forEach(d => {
    const a = actors[d.id]; if(!a || a.dragging) return;
    const sl = asleep(d);
    if(d.slp && d.nest !== undefined && NEST_POS[d.nest]){ a.tx = NEST_POS[d.nest][0]; a.ty = NEST_POS[d.nest][1] - 1; }
    else if(sl){ a.tx = a.x; a.ty = a.y; }
    else if(d.par && stageOf(d) < 2){
      const pa = actors[d.par];
      if(pa){ const back = pa.flip ? 1 : -1; a.tx = pa.x + back * (5 + (d.id % 3) * 3); a.ty = pa.y + 1 + (d.id % 2); a.wait = 0; }
    }
    const dx = a.tx - a.x, dy = a.ty - a.y, dist = Math.hypot(dx, dy);
    let cls = sl ? 'sleep' : 'idle';
    if(dist > 0.4 && !sl){
      const sp = (stageOf(d) === 0 ? 9 : 6) * dt * (d.b === 'runner' ? 1.5 : 1);
      const m = Math.min(dist, sp);
      a.x += dx / dist * m; a.y += dy / dist * m * 0.8;
      a.flip = dx < -0.1 ? true : dx > 0.1 ? false : a.flip;
      cls = 'walk';
    } else if(!sl && !(d.par && stageOf(d) < 2)){
      a.wait -= dt;
      if(a.wait <= 0){
        a.wait = rnd(1.5, 5);
        // best friends like to swim together
        const f = d.fr && duckById(d.fr);
        if(f && f.i === d.i && actors[f.id] && Math.random() < 0.5){
          const [px, py] = randLand(true); a.tx = px; a.ty = py;
          const fa = actors[f.id]; if(!asleep(f)){ fa.tx = px + 5; fa.ty = py + 0.5; fa.wait = a.wait; }
        } else { const [nx, ny] = randLand(Math.random() < 0.3); a.tx = nx; a.ty = ny; }
      }
    }
    if(inEll(a.x, a.y, POND, 0.95) && !sl) cls = 'swim';
    if(a.cls !== cls){ a.el.classList.remove('idle','walk','swim','sleep'); a.el.classList.add(cls); a.cls = cls; }
    a.el.querySelector('.bob').style.transform = '';
    a.el.style.transform = a.flip ? 'scaleX(-1)' : '';
    const svg = a.el.querySelector('svg'); if(svg) svg.style.clipPath = cls === 'swim' ? 'inset(0 0 16% 0)' : '';
    placeActor(a);
  });
}

function toast(msg, kind){
  const t = document.createElement('div'); t.className = 'tst' + (kind ? ' ' + kind : ''); t.innerHTML = msg;
  const box = $('toast'); box.appendChild(t);
  while(box.children.length > 3) box.firstChild.remove();

/* ---------- gift box (ad, every 30 min) ---------- */
function rollGift(){
  const r = Math.random();
  if(r < 0.12) return {g: rint(2, 5)};
  if(r < 0.45){ const f = pick(FOOD_IDS); return {food: f, n: rint(3, 6)}; }
  if(r < 0.58){ const pool = Object.keys(DECOR).filter(k => !DECOR[k].ev && !DECOR[k].isle && DECOR[k].cur !== 'g' && (DECOR[k].lv || 1) <= S.lv + 2); return {decor: pick(pool)}; }
  return {f: Math.round(Math.max(200, incomeFloor() * rnd(300, 600)))};
}
function giveGift(g){
  if(g.g){ S.g += g.g; return '+' + g.g + ' 💎'; }
  if(g.food){ S.inv[g.food] = (S.inv[g.food] || 0) + g.n; return '+' + g.n + ' ' + FOODS[g.food].e + ' ' + L(FOODS[g.food]); }
  if(g.decor){ S.decorOwn[g.decor] = (S.decorOwn[g.decor] || 0) + 1; return DECOR[g.decor].e + ' ' + L(DECOR[g.decor]); }
  if(g.egg){ addEgg(g.egg, S.cur); return EGGS[g.egg].en ? L(EGGS[g.egg]) : ''; }
  addF(g.f); return '+' + fmt(g.f) + ' 🪶';
}
function openGift(){
  sfx('tap');
  if(now() < S.giftAt){ openModal('🎁 ' + tr('Gift box'), '<div class="reward"><div class="big">🎁</div><p>'+tr('Next gift in')+' <b>'+fmtTime((S.giftAt-now())/1000)+'</b></p></div>'); return; }
  openModal('🎁 ' + tr('Free gift box'), '<div class="reward"><div class="big">🎁</div><p>'+tr('Feathers, food, decor or gems!')+'</p></div><button class="btn wide mint" id="gfGo">'+adIcon()+' '+tr('Open')+'</button><p class="muted center">'+tr('A new box every 30 minutes.')+'</p>');
  $('gfGo').onclick = async () => {
    closeModal();
    if(!await rewardAd()) return;
    S.giftAt = now() + CONFIG.GIFT_EVERY_MIN * 60000;
    const msg = giveGift(rollGift()); sfx('coin'); showReward('🎁', tr('A gift!'), msg); renderSide(); saveNow();
  };
}

  const n = SPIN.length, seg = 360 / n, cols = ['#ffd6e0','#c8f2e0','#fff4b8','#e5dcff','#d4ecff','#ffe2cc','#ffd6e0','#c8f2e0'];
  let svg = '<svg viewBox="-50 -50 100 100" id="spinSvg" style="transform:rotate('+spinRot+'deg)">';
  SPIN.forEach((s, i) => {
    const a0 = (i * seg - 90) * Math.PI / 180, a1 = ((i + 1) * seg - 90) * Math.PI / 180, am = (a0 + a1) / 2;
    svg += '<path d="M0 0 L'+(48*Math.cos(a0))+' '+(48*Math.sin(a0))+' A48 48 0 0 1 '+(48*Math.cos(a1))+' '+(48*Math.sin(a1))+' Z" fill="'+cols[i]+'" stroke="#fff" stroke-width="1"/>';
    svg += '<text x="'+(32*Math.cos(am))+'" y="'+(32*Math.sin(am)+4)+'" font-size="11" text-anchor="middle">'+s.e+'</text>';
  });
  svg += '<circle r="7" fill="#fff"/></svg>';
  let h = '<div class="spinW">' + svg + '<div class="ptr">🔻</div></div>';
  if(freeOk) h += '<button class="btn wide" id="spGo">🎡 '+tr('Free spin')+'</button>';
  else if(adOk) h += '<button class="btn wide mint" id="spAd">'+adIcon()+' '+tr('One more spin')+'</button>';
  else h += '<p class="center muted">'+tr('Come back tomorrow for a new spin!')+'</p>';
  openModal('🎡 ' + tr('Daily spin'), h);
  const go = () => {
    const i = weighted(SPIN.map(s => s.w));
    spinRot += 360 * 5 + (360 - (i * seg + seg / 2)) - (spinRot % 360);
    $('spinSvg').style.transform = 'rotate(' + spinRot + 'deg)';
    sfx('whoosh');
    if($('spGo')) $('spGo').disabled = true; if($('spAd')) $('spAd').disabled = true;
    setTimeout(() => { const msg = giveGift(SPIN[i].f()); sfx('coin'); showReward(SPIN[i].e, tr('You won!'), msg); renderSide(); saveNow(); }, 3300);
  };
  if($('spGo')) $('spGo').onclick = () => { S.spin.day = today; S.spin.extra = false; go(); };
  if($('spAd')) $('spAd').onclick = async () => { if(!await rewardAd()) return; S.spin.extra = true; openSpin(); setTimeout(go, 300); };
}

/* ---------- daily streak ---------- */
function streakReward(n){ return {f: Math.round(Math.max(200, incomeFloor() * 200 * Math.min(n, 10))), g: n % 7 === 0 ? 10 : (n % 3 === 0 ? 2 : 0)}; }
function checkDaily(){
  const today = dayNum(now());
  if(S.daily.last === today) return;
  if(S.daily.last !== null && today - S.daily.last > 1 && S.daily.streak > 0){
    const old = S.daily.streak;
    queueModal(() => {
      openModal('🔥 ' + tr('Streak lost!'), '<div class="reward"><div class="big">🥺</div><p>'+tr('You missed a day. Your streak was {n} days.', {n:old})+'</p></div>'+
        '<button class="btn wide mint" id="stKeep">'+adIcon()+' '+tr('Keep my streak')+'</button><button class="btn wide ghost" id="stNew">'+tr('Start over')+'</button>', null, true);
      $('stKeep').onclick = async () => { closeModal(); if(await rewardAd()){ S.daily.last = today - 1; } else { S.daily.streak = 0; S.daily.last = today - 1; } dailyClaimModal(); };
      $('stNew').onclick = () => { closeModal(); S.daily.streak = 0; S.daily.last = today - 1; dailyClaimModal(); };
    });
    return;
  }
  queueModal(dailyClaimModal);
}
function dailyClaimModal(){
  const today = dayNum(now()); if(S.daily.last === today) return;
  const n = S.daily.streak + 1, r = streakReward(n);
  let days = '<div class="row" style="justify-content:center;gap:4px;flex-wrap:wrap;margin:8px 0">';
  for(let i=Math.max(1, n-3); i<=n+3; i++) days += '<div class="tag" style="padding:6px 8px;'+(i===n?'background:var(--pink2);color:#fff':i<n?'background:var(--mint)':'')+'">'+tr('Day')+' '+i+'</div>';
  days += '</div>';
  openModal('🔥 ' + tr('Daily reward'), '<div class="reward"><div class="big">📅</div><p>'+tr('Streak')+': <b>'+n+'</b> 🔥</p>'+days+'<div class="amt">+'+fmt(r.f)+' 🪶'+(r.g?' +'+r.g+' 💎':'')+'</div></div><button class="btn wide gold" id="dyGo">'+tr('Claim')+'</button>', null, true);
  $('dyGo').onclick = () => { S.daily.streak = n; S.daily.last = today; addF(r.f); S.g += r.g; sfx('coin'); closeModal(); saveNow(); };
}

function harvest(p){
  const C = CROPS[p.c], k = p.c;
  if(k === 'wheat') S.inv.wheat = (S.inv.wheat || 0) + C.yield; else S.inv[k] = (S.inv[k] || 0) + C.yield;
  toast('+' + C.yield + ' ' + C.e); sfx('coin'); addXP(2);
  p.c = null; p.t = 0; p.boost = 0; saveNow();
}
/* turtles harvest + replant on their own */
function tickTurtles(){
  const G = S.garden; let n = G.turtles * 3;
  for(const p of G.plots){
    if(n <= 0) break; n--;
    if(p.c && cropLeft(p) <= 0){ const k = p.c; harvest(p); if((S.inv['seed_'+k]||0) > 0 || S.f >= CROPS[k].seed * 2){ if((S.inv['seed_'+k]||0) > 0) S.inv['seed_'+k]--; else S.f -= CROPS[k].seed * 2; p.c = k; p.t = now(); } }
    else if(!p.c){ const k = ['wheat','corn','berries'].find(c => (S.inv['seed_'+c]||0) > 0) || (S.f >= 10 ? 'wheat' : null); if(k){ if((S.inv['seed_'+k]||0) > 0) S.inv['seed_'+k]--; else S.f -= CROPS[k].seed * 2; p.c = k; p.t = now(); } }
  }
  // turtles also take bread out of the oven
  if(G.turtles) G.bake = G.bake.filter(t => { if(now() >= t){ S.inv.bread = (S.inv.bread||0) + 2; return false; } return true; });
}

    const k = b.dataset.ev, p = +b.dataset.p, E = EVENTS[S.ev.id];
    if(S.ev.cur < p){ toast(tr('Not enough') + ' ' + E.cur, 'err'); sfx('err'); return; }
    S.ev.cur -= p; S.ev.own = S.ev.own || {};
    if(k.startsWith('duck_')){ S.ev.own[k] = 1; const d = makeDuck({n: L(E.duck), b:E.duck.breed, c:E.duck.color, p:E.duck.pattern, r:3, i:S.cur, look:'pond', adult:true, o:E.duck.outfit, ev:S.ev.id}); showReward(duckSVG(d,{size:110}), L(E.duck), tr('joins your island!')); }
    else if(k.startsWith('o_')) S.outfits[k.slice(2)] = 1;
    else if(k.startsWith('d_')) S.decorOwn[k.slice(2)] = (S.decorOwn[k.slice(2)] || 0) + 1;
    sfx('coin'); renderMore(); saveNow();
  });
}
function openEvent(){ showView('More'); moreTab = 'event'; renderMore(); }

/* =====================================================================
   10. MINI GAMES — Bread Catch, Duck Race, Fishing, Memory Match
   Each game: start → loop (update + draw) → gameOver(score)
===================================================================== */
let G = null;   // running game
const cv = () => $('gCanvas');
function svgImg(svg){ const i = new Image(); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); return i; }
function playerDuck(){ return (S.avatar && duckById(S.avatar)) || S.ducks.find(d => stageOf(d) === 2) || S.ducks[0] || {b:'classic',c:'yellow',p:'none',look:'pond',grow:99999,o:{}}; }
function startGame(id){
  if(S.tickets < 1){ toast('🎟️ ' + tr('No tickets left. Watch an ad or wait.'), 'err'); sfx('err'); showView('Games'); return; }
  if(S.tickets >= CONFIG.TICKETS_MAX) S.tkT = now();
  S.tickets--; S.stats.games++; qCount('games'); saveNow();
  audioUnlock();
  $('game').classList.add('on'); $('gOver').classList.remove('on'); $('memGrid').innerHTML = ''; $('memGrid').style.display = 'none';
  const c = cv(), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  G = {id, ctx, W: innerWidth, H: innerHeight, t: 0, score: 0, shake: 0, parts: [], over: false, last: performance.now(), duck: svgImg(duckSVG(playerDuck(), {noShadow:true}))};
  ({catch: catchInit, race: raceInit, fish: fishInit, memory: memInit})[id]();
  if(id !== 'memory') requestAnimationFrame(gameLoop);
  tutEvent('game');
}
function gameLoop(ts){
  if(!G || G.over) return;
  const dt = Math.min(0.05, (ts - G.last) / 1000); G.last = ts; G.t += dt;
  G.update(dt);
  const ctx = G.ctx; ctx.save();
  if(G.shake > 0){ G.shake -= dt; ctx.translate(rnd(-6, 6) * G.shake * 3, rnd(-6, 6) * G.shake * 3); }
  G.draw(ctx);
  // particles
  G.parts = G.parts.filter(p => (p.life -= dt) > 0);
  G.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1; ctx.restore();
  requestAnimationFrame(gameLoop);
}
function burst(x, y, c, n){ for(let i=0;i<(n||10);i++){ const a = Math.random()*7, s = rnd(60, 220); G.parts.push({x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 80, r: rnd(2, 5), c: c || '#fff', life: 0.7, max: 0.7}); } }
function hud(html){ $('gHud').innerHTML = html + '<button class="pill" id="gQuit">✕</button>'; $('gQuit').onclick = () => gameOver(true); }
function emoji(ctx, e, x, y, size){ ctx.font = size + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y); }
function waterBg(ctx, top){
  const g = ctx.createLinearGradient(0, 0, 0, G.H); g.addColorStop(0, '#bfe6ff'); g.addColorStop(1, '#7fcbee');
  ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
  ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 2;
  for(let i=0;i<8;i++){ const y = (top || 0) + (i * 97 + G.t * 20) % G.H; ctx.beginPath(); ctx.moveTo(((i*131)%G.W), y); ctx.quadraticCurveTo(((i*131)%G.W)+15, y-6, ((i*131)%G.W)+30, y); ctx.stroke(); }
}

/* ---------- BREAD CATCH ---------- */
function catchInit(){
  Object.assign(G, {x: G.W / 2, tx: G.W / 2, items: [], spawn: 0, lives: 3, pop: 0, speed: CONFIG.CATCH_SPEED});
  const c = cv();
  c.onpointerdown = c.onpointermove = e => { G.tx = e.clientX; };
  G.update = dt => {
    G.x += (G.tx - G.x) * Math.min(1, dt * 14);
    G.speed += CONFIG.CATCH_RAMP * dt;
    G.spawn -= dt;
    if(G.spawn <= 0){
      G.spawn = Math.max(0.32, 0.9 - G.t * 0.012);
      const r = Math.random();
      G.items.push({x: rnd(30, G.W - 30), y: -30, k: r < 0.08 ? 'gold' : r < 0.32 + Math.min(0.2, G.t * 0.004) ? 'rock' : 'bread', vy: G.speed * rnd(0.85, 1.2), rot: rnd(-2, 2)});
    }
    const py = G.H - 90;
    G.items = G.items.filter(it => {
      it.y += it.vy * dt; it.rot += dt;
      if(Math.abs(it.y - py) < 34 && Math.abs(it.x - G.x) < 44){
        if(it.k === 'rock'){ G.lives--; G.shake = 0.35; sfx('err'); burst(it.x, it.y, '#8a8a99', 12); if(G.lives <= 0) setTimeout(() => gameOver(), 300); }
        else { const v = it.k === 'gold' ? 5 : 1; G.score += v; G.pop = 0.18; quack(rnd(1.1, 1.4)); burst(it.x, it.y, it.k === 'gold' ? '#ffd23f' : '#e8b071', 10); }
        return false;
      }
      return it.y < G.H + 40;
    });
    if(G.pop > 0) G.pop -= dt;
    hud('<span class="pill">🍞 ' + G.score + '</span><span class="pill">' + '❤️'.repeat(Math.max(0, G.lives)) + '🤍'.repeat(Math.max(0, 3 - G.lives)) + '</span>');
  };
  G.draw = ctx => {
    const g = ctx.createLinearGradient(0, 0, 0, G.H); g.addColorStop(0, '#d4ecff'); g.addColorStop(1, '#fff4b8');
    ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
    ctx.fillStyle = '#9fdc7c'; ctx.fillRect(0, G.H - 50, G.W, 50);
    G.items.forEach(it => { ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot * 0.5); if(it.k === 'gold'){ ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 18; } emoji(ctx, it.k === 'rock' ? '🪨' : it.k === 'gold' ? '🥐' : '🍞', 0, 0, 38); ctx.restore(); });
    const s = 1 + (G.pop > 0 ? G.pop * 1.6 : 0);
    ctx.save(); ctx.translate(G.x, G.H - 90); ctx.scale(s, 2 - s);
    if(G.duck.complete) ctx.drawImage(G.duck, -45, -60, 90, 90);
    ctx.restore();
  };
}

/* ---------- DUCK RACE ---------- */
function raceInit(){
  const lanes = 4;
  Object.assign(G, {lanes, cd: 3, racers: [], fin: [], startT: 0});
  for(let i=0;i<lanes;i++) G.racers.push({me: i === 0, d: 0, v: 0, base: rnd(...CONFIG.RACE_BOT), img: i === 0 ? G.duck : svgImg(duckSVG({b:pick(BREED_IDS),c:pick(Object.keys(COLORS)),p:'none',look:pick(S.open),grow:99999,o:{}}, {noShadow:true})), done: 0});
  cv().onpointerdown = () => {
    if(G.cd > 0 || G.over) return;
    const me = G.racers[0]; if(me.done) return;
    me.v = Math.min(26, me.v + CONFIG.RACE_TAP * 3); me.pop = 0.12; if(Math.random() < 0.25) splashSmall();
  };
  G.update = dt => {
    if(G.cd > 0){ const before = Math.ceil(G.cd); G.cd -= dt; if(Math.ceil(G.cd) !== before) sfx(G.cd <= 0 ? 'coin' : 'tap'); if(G.cd <= 0) G.startT = G.t; hud('<span class="pill">🏁 ' + (G.cd > 0 ? Math.ceil(G.cd) : tr('GO!')) + '</span>'); return; }
    G.racers.forEach((r, i) => {
      if(r.done) return;
      if(r.me){ r.v = Math.max(0, r.v - 9 * dt); }
      else r.v = r.base + Math.sin(G.t * 2 + i) * 1.5;
      r.d += r.v * dt; if(r.pop) r.pop = Math.max(0, r.pop - dt);
      if(r.d >= CONFIG.RACE_DIST){ r.done = G.t - G.startT; G.fin.push(r); if(r.me){ G.place = G.fin.length; G.time = r.done; sfx(G.place === 1 ? 'win' : 'coin'); setTimeout(() => gameOver(), 700); } }
    });
    const me = G.racers[0];
    hud('<span class="pill">🏁 ' + Math.min(CONFIG.RACE_DIST, Math.floor(me.d)) + '/' + CONFIG.RACE_DIST + 'm</span><span class="pill">⏱️ ' + (G.t - G.startT).toFixed(1) + 's</span>');
  };
  G.draw = ctx => {
    waterBg(ctx);
    const top = 110, lh = (G.H - top - 60) / G.lanes, fx = G.W - 50;
    ctx.fillStyle = '#fff'; for(let y = top; y < top + lh * G.lanes; y += 16){ ctx.fillRect(fx, y, 8, 8); ctx.fillStyle = ctx.fillStyle === '#ffffff' ? '#333' : '#fff'; }
    for(let i=1;i<G.lanes;i++){ ctx.strokeStyle = '#ffffff99'; ctx.setLineDash([10, 10]); ctx.beginPath(); ctx.moveTo(0, top + lh * i); ctx.lineTo(G.W, top + lh * i); ctx.stroke(); }
    ctx.setLineDash([]);
    G.racers.forEach((r, i) => {
      const x = 30 + (fx - 70) * Math.min(1, r.d / CONFIG.RACE_DIST), y = top + lh * i + lh / 2;
      const s = 1 + (r.pop || 0) * 2, sz = Math.min(70, lh * 0.9);
      ctx.save(); ctx.translate(x, y); ctx.scale(s, 1);
      if(r.me){ ctx.fillStyle = '#ffd6e0aa'; ctx.beginPath(); ctx.ellipse(0, sz * 0.25, sz * 0.55, sz * 0.15, 0, 0, 7); ctx.fill(); }
      if(r.img.complete) ctx.drawImage(r.img, -sz / 2, -sz / 2 - 6, sz, sz);
      ctx.restore();
      if(r.v > 4 && G.cd <= 0 && Math.random() < 0.3) G.parts.push({x: x - sz / 2, y: y + sz * 0.2, vx: -60, vy: -40, r: 3, c: '#fff', life: 0.4, max: 0.4});
    });
    if(G.cd <= 0 && G.t - G.startT < 1.5) { ctx.fillStyle = '#4a3f55'; ctx.font = '900 30px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(tr('Tap tap tap!'), G.W / 2, G.H - 30); }
  };
}
function splashSmall(){ sfx('splash'); }

/* ---------- FISHING ---------- */
function fishInit(){
  Object.assign(G, {casts: CONFIG.FISH_CASTS, pos: 0, dir: 1, zone: 0.5, zw: 0.26, sp: 0.9, catches: [], msg: '', msgT: 0, bob: 0});
  G.zone = rnd(0.2, 0.8);
  cv().onpointerdown = () => {
    if(G.over || G.casts <= 0 || G.msgT > 0.9) return;
    G.casts--;
    const hit = Math.abs(G.pos - G.zone) < G.zw / 2;
    if(hit){
      const r = Math.random(); let c;
      if(r < 0.03) c = {e:'🥚', k:'egg'}; else if(r < 0.2) c = {e:'🧰', k:'chest'}; else if(r < 0.5) c = {e:'🐠', k:'fish2'}; else c = {e:'🐟', k:'fish'};
      G.catches.push(c); G.score++; G.msg = c.e + ' ' + tr('Caught!'); G.zw = Math.max(0.1, G.zw - 0.025); G.sp += 0.15;
      quack(1.2); burst(G.W / 2, G.H * 0.55, '#bfe6ff', 16); G.bob = 0.4;
    } else { G.msg = '💦 ' + tr('Missed!'); sfx('splash'); G.shake = 0.2; }
    G.msgT = 1.1; G.zone = rnd(0.15, 0.85);
    if(G.casts <= 0) setTimeout(() => gameOver(), 1100);
  };
  G.update = dt => {
    G.pos += G.dir * G.sp * dt; if(G.pos > 1){ G.pos = 1; G.dir = -1; } if(G.pos < 0){ G.pos = 0; G.dir = 1; }
    if(G.msgT > 0) G.msgT -= dt; if(G.bob > 0) G.bob -= dt;
    hud('<span class="pill">🎣 ' + G.casts + '</span><span class="pill">' + (G.catches.map(c => c.e).join('') || '…') + '</span>');
  };
  G.draw = ctx => {
    const sky = ctx.createLinearGradient(0, 0, 0, G.H * 0.4); sky.addColorStop(0, '#ffe6f0'); sky.addColorStop(1, '#d4ecff');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, G.W, G.H * 0.4);
    const sea = ctx.createLinearGradient(0, G.H * 0.4, 0, G.H); sea.addColorStop(0, '#7fcbee'); sea.addColorStop(1, '#3f8fc4');
    ctx.fillStyle = sea; ctx.fillRect(0, G.H * 0.4, G.W, G.H);
    // dock + duck
    ctx.fillStyle = '#b9874f'; ctx.fillRect(0, G.H * 0.36, G.W * 0.36, 18);
    if(G.duck.complete) ctx.drawImage(G.duck, G.W * 0.12, G.H * 0.36 - 74, 80, 80);
    // line + bobber
    const bx = G.W * 0.62, by = G.H * 0.5 + Math.sin(G.t * 3) * 4 - (G.bob > 0 ? 18 : 0);
    ctx.strokeStyle = '#4a3f55'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(G.W * 0.12 + 70, G.H * 0.36 - 40); ctx.quadraticCurveTo(G.W * 0.45, G.H * 0.2, bx, by); ctx.stroke();
    ctx.fillStyle = '#ff6f6f'; ctx.beginPath(); ctx.arc(bx, by, 8, Math.PI, 0); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI); ctx.fill();
    // fish shadows
    for(let i=0;i<4;i++){ ctx.fillStyle = '#1f4f7a33'; ctx.beginPath(); ctx.ellipse((G.t * 30 * (i % 2 ? 1 : -1) + i * 200) % (G.W + 100) - 50 + (i % 2 ? 0 : G.W), G.H * (0.6 + i * 0.08), 26, 9, 0, 0, 7); ctx.fill(); }
    // timing bar
    const bw = Math.min(G.W - 40, 420), bx0 = (G.W - bw) / 2, byy = G.H - 110;
    ctx.fillStyle = '#ffffffcc'; roundRect(ctx, bx0 - 6, byy - 6, bw + 12, 36, 18); ctx.fill();
    ctx.fillStyle = '#ffd6e0'; roundRect(ctx, bx0, byy, bw, 24, 12); ctx.fill();
    ctx.fillStyle = '#5cd6a5'; roundRect(ctx, bx0 + (G.zone - G.zw / 2) * bw, byy, G.zw * bw, 24, 12); ctx.fill();
    ctx.fillStyle = '#4a3f55'; ctx.fillRect(bx0 + G.pos * bw - 3, byy - 8, 6, 40);
    ctx.font = '900 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(tr('Tap when the line is in the green!'), G.W / 2, byy + 56);
    if(G.msgT > 0){ ctx.globalAlpha = Math.min(1, G.msgT * 2); ctx.font = '900 34px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(G.msg, G.W / 2, G.H * 0.3); ctx.globalAlpha = 1; }
  };
}
function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* ---------- MEMORY MATCH (cards show island items) ---------- */
const MEM_ICONS = ['🌴','🍄','❄️','🍬','💎','🌋','☁️','🐸','🐚','🌷','🍭','🌲','🔮','🪷','🌈','⛱️','🧁','🔥'];
function memInit(){
  const sizes = [[4,3],[4,4],[5,4]], [cols, rows] = sizes[Math.min(2, S.memLv)];
  const pairs = cols * rows / 2;
  const icons = MEM_ICONS.slice().sort(() => Math.random() - 0.5).slice(0, pairs);
  const deck = icons.concat(icons).sort(() => Math.random() - 0.5);
  Object.assign(G, {size: Math.min(2, S.memLv), cols, rows, deck, open: [], found: 0, pairs, moves: 0, lock: false});
  const ctx = G.ctx, g = ctx.createLinearGradient(0, 0, 0, G.H); g.addColorStop(0, '#e5dcff'); g.addColorStop(1, '#ffd6e0'); ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
  const grid = $('memGrid'); grid.style.display = 'grid';
  const cw = Math.min(72, Math.floor((G.W - 30) / cols) - 8);
  grid.style.gridTemplateColumns = 'repeat(' + cols + ',' + cw + 'px)';
  grid.innerHTML = deck.map((e, i) => '<button class="mc" data-i="'+i+'" style="width:'+cw+'px;height:'+Math.round(cw*1.18)+'px;font-size:'+Math.round(cw*0.5)+'px">❔</button>').join('');
  const upd = () => hud('<span class="pill">🃏 ' + G.found + '/' + G.pairs + '</span><span class="pill">👆 ' + G.moves + '</span>');
  upd();
  grid.querySelectorAll('.mc').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if(G.lock || b.classList.contains('up') || b.classList.contains('done')) return;
    b.classList.add('up'); b.textContent = deck[i]; sfx('tap'); G.open.push(b);
    if(G.open.length === 2){
      G.moves++; const [a, c] = G.open;
      if(deck[+a.dataset.i] === deck[+c.dataset.i]){
        G.found++; G.score++; quack(1.3); setTimeout(() => { a.classList.add('done'); c.classList.add('done'); }, 200); G.open = [];
        if(G.found === G.pairs){ G.won = true; setTimeout(() => gameOver(), 700); }
      } else { G.lock = true; setTimeout(() => { a.classList.remove('up'); c.classList.remove('up'); a.textContent = c.textContent = '❔'; G.open = []; G.lock = false; }, 750); }
    }
    upd();
  });
}

/* ---------- game over + prizes ---------- */
function gameOver(quit){
  if(!G || G.over) return;
  G.over = true;
  const id = G.id, sc = G.score, inc = incomeFloor();
  let f = 0, gems = 0, items = [], best = false, line = '';
  if(id === 'catch'){ f = sc * inc * 6; if(sc > S.stats.best.catch){ S.stats.best.catch = sc; best = true; } const b = Math.floor(sc / 5); if(b){ S.inv.bread += b; items.push('+' + b + ' 🍞'); } line = '🍞 ' + sc; }
  if(id === 'race'){
    const p = G.place || 4; f = [0, 150, 70, 40, 20][p] * inc; line = ['', '🥇 1st', '🥈 2nd', '🥉 3rd', '4th'][p] + (G.time ? ' · ' + G.time.toFixed(2) + 's' : '');
    if(p === 1){ S.stats.raceWins++; if(Math.random() < 0.25) gems = 1; }
    if(G.time && (!S.stats.best.race || G.time * 1000 < S.stats.best.race)){ S.stats.best.race = Math.round(G.time * 1000); best = true; }
    G.score = 5 - p;
  }
  if(id === 'fish'){
    f = sc * inc * 10; if(sc > S.stats.best.fish){ S.stats.best.fish = sc; best = true; }
    G.catches.forEach(c => {
      if(c.k === 'fish' || c.k === 'fish2'){ S.inv.fish += c.k === 'fish2' ? 2 : 1; }
      if(c.k === 'chest'){ if(Math.random() < 0.3) gems++; else f += inc * 60; }
      if(c.k === 'egg') addEgg('silver', S.cur);
    });
    const nf = G.catches.filter(c => c.k.startsWith('fish')).reduce((a, c) => a + (c.k === 'fish2' ? 2 : 1), 0);
    if(nf) items.push('+' + nf + ' 🐟'); if(G.catches.some(c => c.k === 'egg')) items.push('🥚 ' + tr('Lost egg!'));
    line = '🎣 ' + sc + '/' + CONFIG.FISH_CASTS;
  }
  if(id === 'memory'){
    f = sc * inc * 15; line = '🃏 ' + sc + '/' + G.pairs;
    if(G.won){ S.stats.best.memory = Math.max(S.stats.best.memory, G.size + 1); if(S.memLv < 2) S.memLv++; f *= 1.5; items.push(['🌴','🍄','💎'][G.size] + ' ' + tr('Bigger board next time!')); const fd = pick(FOOD_IDS); S.inv[fd] += 2; items.push('+2 ' + FOODS[fd].e); }
  }
  if(quit) f *= 0.5;
  f = Math.round(Math.max(sc > 0 ? 25 : 0, f));
  if(Math.random() < 0.08 && sc > 2) gems++;
  addF(f); S.g += gems; addXP(Math.min(25, 8 + sc));
  if(S.ev.id && sc > 0){ const e = Math.ceil(sc / 2); S.ev.cur += e; items.push('+' + e + ' ' + EVENTS[S.ev.id].cur); }
  checkBadges(); saveNow();
  $('gOverBox').innerHTML = '<div style="font-size:50px">' + (best ? '🏆' : GAMES.find(g => g.id === id).e) + '</div><h2 style="margin:6px 0">' + (best ? tr('New best!') : tr('Nice try!')) + '</h2>' +
    '<div style="font-size:1.4em;font-weight:900">' + line + '</div>' +
    '<div class="reward"><div class="amt">+' + fmt(f) + ' 🪶' + (gems ? ' +' + gems + ' 💎' : '') + '</div>' + items.join('<br>') + '</div>' +
    '<button class="btn wide" id="goAgain"' + (S.tickets < 1 ? ' disabled' : '') + '>🔁 ' + tr('Play again') + ' · 🎟️ ' + S.tickets + '</button>' +
    (S.tickets < 1 ? '<button class="btn wide mint" id="goTk">' + adIcon() + ' +' + CONFIG.AD_TICKETS + ' 🎟️</button>' : '') +
    '<button class="btn wide ghost" id="goBack">' + tr('Back') + '</button>';
  $('gOver').classList.add('on');
  $('goAgain').onclick = () => startGame(id);
  if($('goTk')) $('goTk').onclick = async () => { if(await rewardAd()){ S.tickets += CONFIG.AD_TICKETS; saveNow(); startGame(id); } };
  $('goBack').onclick = closeGame;
}
function closeGame(){
  G = null; $('game').classList.remove('on'); $('memGrid').style.display = 'none'; cv().onpointerdown = cv().onpointermove = null;

   11. MONEY — rewarded ads (AdMob) + purchases (Google Play Billing)
   ---------------------------------------------------------------------
   FAKE FOR NOW: in a browser, ads are a 3-second pretend ad, and
   purchases are pretend (a "Demo" box gives you the item).
   Inside the Android app (Capacitor) with the plugins installed, the
   real ones take over automatically:
     • @capacitor-community/admob   → rewarded video ads
     • cordova-plugin-purchase      → Google Play purchases
   BEFORE RELEASE: put your real AdMob rewarded unit ID below,
   set MONEY.TESTING to false, and set MONEY.DEMO_BUY to false.
   Ads are ALWAYS the player's choice. Nothing plays on its own.
===================================================================== */
const MONEY = {
  TESTING: true,
  DEMO_BUY: true,   // browser only: pretend purchases give the item (for testing)
  REWARDED_ID: 'ca-app-pub-3940256099942544/5224354917', // Google's TEST rewarded ID — replace with yours
};
const isNative = () => !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const AdMobP = () => isNative() && window.Capacitor.Plugins ? Capacitor.Plugins.AdMob : null;
let adBusy = false;
const adIcon = () => S && S.noAds ? '✨' : '📺 ' + ((S && S.lang === 'fr') ? 'Pub' : 'Ad') + ' ·';

/* the one function the game calls. Resolves true if the player earned the reward. */
async function rewardAd(){
  if(S.noAds){ toast('✨ ' + tr('No-ads pass: reward given!'), 'gold'); return true; }
  if(adBusy) return false;
  adBusy = true;
  musicStop();
  let ok = false;
  try{ ok = AdMobP() ? await nativeAd() : await demoAd(); }catch(e){ ok = false; }
  adBusy = false;
  if(S.mus) musicStart();
  if(!ok) toast(tr('No reward this time'), 'err');
  return ok;
}
function nativeAd(){
  const A = AdMobP();
  return new Promise(async res => {
    let earned = false, finished = false, hs = [];
    const finish = () => { if(finished) return; finished = true; hs.forEach(h => { try{ h.remove(); }catch(e){} }); res(earned); };
    try{
      hs.push(await A.addListener('onRewardedVideoAdReward', () => { earned = true; }));
      hs.push(await A.addListener('onRewardedVideoAdDismissed', () => setTimeout(finish, 250)));
      hs.push(await A.addListener('onRewardedVideoAdFailedToShow', finish));
      await A.prepareRewardVideoAd({adId: MONEY.REWARDED_ID, isTesting: MONEY.TESTING});
      const item = await A.showRewardVideoAd();
      if(item && item.amount !== undefined) earned = true;
      setTimeout(finish, 600);
    }catch(e){ finish(); }
  });
}

function grantSku(sku){
  const gp = GEM_PACKS.find(p => p.sku === sku);
  if(gp){ S.g += gp.gems; return '+' + fmt(gp.gems) + ' 💎'; }
  for(const k in PAID_DUCKS) if(PAID_DUCKS[k].sku === sku){
    if(S.paid[k]) return '';
    S.paid[k] = true; const P = PAID_DUCKS[k];
    makeDuck({n: L(P), b: P.breed, c: P.color, p: P.pattern, r: 4, i: S.cur, look: 'pond', adult: true, o: P.outfit, pd: k});
    return L(P) + '<br>' + L(P.d);
  }
  if(sku === NOADS.sku){
    if(S.noAds) return '';
    S.noAds = true; S.g += NOADS.gems;
    const D = NOADS.duck; makeDuck({n: L(D), b: D.breed, c: D.color, p: D.pattern, r: 3, i: S.cur, look: 'pond', adult: true, o: D.outfit, pd: 'vip'});
    return tr('No more ads — rewards are instant!') + '<br>+' + NOADS.gems + ' 💎<br>' + L(D);
  }
  if(sku === STARTER.sku){
    if(S.starter) return '';
    S.starter = true; S.g += STARTER.gems; addEgg(STARTER.egg, S.cur); S.outfits[STARTER.outfit] = 1;
    const f = Math.round(Math.max(5000, incomeFloor() * 600)); addF(f);
    return '+' + STARTER.gems + ' 💎 · +' + fmt(f) + ' 🪶<br>🥇 ' + L(EGGS.gold) + ' · ' + OUTFITS[STARTER.outfit].e;
  }
  for(const k in BUNDLES) if(BUNDLES[k].sku === sku){
    S.bundles[k] = true;
    const outs = Object.keys(OUTFITS).filter(o => OUTFITS[o].paid === k); outs.forEach(o => S.outfits[o] = 1);
    return outs.map(o => OUTFITS[o].e + ' ' + L(OUTFITS[o])).join('<br>');
  }
  return '';
}
const ALL_SKUS = () => [...GEM_PACKS.map(p => p.sku), ...Object.values(PAID_DUCKS).map(p => p.sku), NOADS.sku, STARTER.sku, ...Object.values(BUNDLES).map(b => b.sku)];
const CONSUMABLE = sku => sku.startsWith('gems_');
const PRICES = {};   // filled with real local prices by Google Play
const priceOf = (sku, fallback) => PRICES[sku] || fallback;

/* ---------- Google Play ---------- */
let iapReady = false;
function iapStore(){ return window.CdvPurchase && CdvPurchase.store; }
function iapInit(){
  const C = window.CdvPurchase; if(!C || iapReady) return;
  const {store, ProductType, Platform} = C; iapReady = true;
  store.register(ALL_SKUS().map(id => ({id, type: CONSUMABLE(id) ? ProductType.CONSUMABLE : ProductType.NON_CONSUMABLE, platform: Platform.GOOGLE_PLAY})));
  store.when()
    .productUpdated(p => { if(p.pricing && p.pricing.price) PRICES[p.id] = p.pricing.price; })
    .approved(tx => {
      if(!S.iapDone) S.iapDone = {};
      const tid = tx.transactionId || ('t' + now());
      if(!S.iapDone[tid]){
        S.iapDone[tid] = now();
        (tx.products || []).forEach(it => { const msg = grantSku(it.id); if(msg) queueModal(() => showReward('💝', tr('Thank you!'), msg)); });
        saveNow(); refreshTop(); renderIsland();
      }
      tx.finish();
    });
  store.error(e => { if(e && e.code !== C.ErrorCode.PAYMENT_CANCELLED) toast(tr('Store error — please try again'), 'err'); });
  store.initialize([Platform.GOOGLE_PLAY]);
}
