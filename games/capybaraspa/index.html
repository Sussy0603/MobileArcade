<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe6cf">
<title>Capybara Spa</title>
<style>
/* =====================================================================
   CAPYBARA SPA — styles
   Warm onsen colors: peach, cream, wood and teal water.
   Change the colors here to restyle the game.
===================================================================== */
:root{
  --peach:#ffe2c8; --peach2:#ff9f6e; --cream:#fff7ec; --wood:#e7b783; --wood2:#b9784a;
  --teal:#d3f1ec; --teal2:#3fb5a8; --pink:#ffdce6; --pink2:#ff8fae; --lav:#ebe2ff; --lav2:#9f86f0;
  --lemon:#fff1b3; --lemon2:#ffcf3d; --sky:#dff0ff; --sky2:#5aa9e8;
  --ink:#4b3527; --ink2:#8a6f5c; --card:#fffdf8; --line:#f1dcc6;
  --gold:#ffc53d; --good:#45b98a; --bad:#ff6b6b;
  --r:18px; --font:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#fff3e6;color:var(--ink);font-family:var(--font);font-size:calc(15px * var(--fs))}
body.easy{--font:Verdana,"Segoe UI",Tahoma,sans-serif;letter-spacing:.04em;word-spacing:.12em;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font-family:inherit;font-size:16px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* coin icon (drawn with CSS, no image) */
.cn{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:-.13em;position:relative;
  background:radial-gradient(circle at 35% 30%,#fff7c2 0 14%,#ffd54a 32%,#f4b322 72%,#d48c12);box-shadow:0 1px 0 #0002,inset 0 0 0 1.5px #ffe58a}
.cn::after{content:"";position:absolute;inset:28%;border-radius:50%;border:1.5px solid #e39d1c;opacity:.7}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:linear-gradient(#fffaf3,#ffe9d4);border-bottom:2px solid #f3cfaa;z-index:20}
.pill{display:flex;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:5px 10px 5px 7px;font-weight:900;box-shadow:0 2px 0 #efcfae;white-space:nowrap;min-width:0;font-size:1em}
.pill .ic{font-size:18px;line-height:1}
.pill .cn{width:18px;height:18px}
.pill.lv{flex:1;max-width:200px;min-width:70px}
.xpbar{flex:1;height:9px;background:#f7e8d8;border-radius:9px;overflow:hidden;min-width:30px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--peach2),var(--pink2));border-radius:9px;transition:width .4s}
#boosts{display:flex;gap:3px;overflow:hidden;flex-wrap:nowrap}
.bst{font-size:11px;font-weight:900;background:var(--lemon);border-radius:99px;padding:3px 7px;white-space:nowrap}
.roundBtn{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 0 #efcfae;display:grid;place-items:center;flex:none;font-size:20px;overflow:hidden}
#muteBtn{margin-left:auto}
#profBtn svg{width:40px;height:30px}
@media (max-width:420px){#boosts .bst:nth-child(n+2){display:none}.pill{padding:4px 8px 4px 5px}}
/* ---------- body / nav ---------- */
#body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#main{flex:1;position:relative;min-width:0;overflow:hidden}
#nav{display:flex;justify-content:space-around;background:#fff;border-top:2px solid #f3cfaa;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:14px;font-size:12px;font-weight:900;color:var(--ink2);position:relative;min-height:56px}
#nav button .e{font-size:25px;line-height:1.1;height:28px;display:grid;place-items:center}
#nav button .e svg{width:38px;height:28px}
#nav button.on{background:var(--peach);color:var(--ink)}
.dot{position:absolute;top:3px;right:22%;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid #fff;display:none}
.dot.show{display:block}
@media (min-width:820px){
  #body{flex-direction:row-reverse}
  #nav{flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:2px solid #f3cfaa;padding:10px 8px;width:96px}
  #nav button{flex:none;padding:10px 0}
  .view .inner{max-width:760px;margin:0 auto}
}
/* ---------- views ---------- */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding:12px 12px 30px;-webkit-overflow-scrolling:touch;background:#fff6ec}
.view.on{display:block}
#vSpa{padding:0;overflow:hidden;background:#ffd9b8}
h2{margin:4px 0 10px;font-size:1.35em}
h3{margin:14px 0 8px;font-size:1.08em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:9px 14px;border-radius:99px;background:#fff;font-weight:900;box-shadow:0 2px 0 var(--line)}
.tabs button.on{background:var(--peach);box-shadow:0 2px 0 #f2b991}
.card{background:var(--card);border-radius:var(--r);padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:8px;box-shadow:0 3px 0 var(--line);position:relative}
.card .art{width:62px;height:62px;flex:none;border-radius:14px;background:var(--peach);display:grid;place-items:center;font-size:32px;overflow:hidden}
.card .art svg{width:60px;height:46px;overflow:visible}
.card .info{flex:1;min-width:0}
.nm{font-weight:900}
.sub{font-size:.86em;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{background:var(--card);border-radius:16px;padding:14px 4px 6px;text-align:center;box-shadow:0 3px 0 var(--line);position:relative;font-size:.84em;font-weight:900}
.tile svg{width:84px;height:60px;display:block;margin:0 auto}
.tile.lock{background:#f5ede4}
.tile.lock svg{filter:brightness(0) opacity(.16)}
.btn{background:var(--peach2);color:#fff;font-weight:900;padding:10px 15px;border-radius:14px;box-shadow:0 3px 0 #dc7a4c;white-space:nowrap;min-height:42px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #dc7a4c}
.btn.mint{background:var(--teal2);box-shadow:0 3px 0 #2b8c81}
.btn.lav{background:var(--lav2);box-shadow:0 3px 0 #7a62d0}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 3px 0 #d79d12}
.btn.pink{background:var(--pink2);box-shadow:0 3px 0 #dd6f8e}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.wide{display:block;width:100%;margin-top:8px;padding:13px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.btn.sm{padding:7px 11px;font-size:.88em;min-height:38px}
.tag{display:inline-block;font-size:.74em;font-weight:900;padding:2px 7px;border-radius:99px;background:var(--lemon);vertical-align:middle}
.r0{background:#f3ebe2}.r1{background:#dcefff}.r2{background:#fff0bf}.r3{background:linear-gradient(90deg,#ffe0ea,#ffefd6,#e1f6ff)}.r4{background:linear-gradient(90deg,#ece2ff,#ffe0f0)}
.bar{height:11px;border-radius:9px;background:#f4e7da;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:9px}
.mood{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:.92em;font-weight:900}
.mood span{width:26px;text-align:center}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--ink2);font-size:.86em}
.center{text-align:center}
.hearts{letter-spacing:-1px}
.seg{display:flex;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.seg button{flex:1;padding:9px 6px;font-weight:900}
.seg button.on{background:var(--peach)}
.prog{height:14px;border-radius:9px;background:#f4e7da;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--peach2))}
/* ---------- spa scene ---------- */
#scene{position:absolute;inset:0;overflow:hidden;touch-action:none}
#sceneBg{position:absolute;inset:0;width:100%;height:100%}
#props,#pools,#wx{position:absolute;inset:0;pointer-events:none}
#pools .pool{pointer-events:auto}
.prop{position:absolute;transform:translate(-50%,-100%)}
.prop svg{width:100%;height:100%;display:block;overflow:visible}
.pool{position:absolute;transform:translate(-50%,-50%)}
.pool svg{width:100%;height:100%;display:block;overflow:visible}
.poolF{pointer-events:none}
.pool.empty{border:3px dashed #ffffffcc;border-radius:50%;display:grid;place-items:center;font-size:30px;color:#fff;font-weight:900;background:#ffffff26}
.pool.empty small{display:block;font-size:12px}
.steam{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#ffffffcc 0,#ffffff55 45%,transparent 70%);pointer-events:none;animation:steam 4s ease-out forwards;z-index:200}
@keyframes steam{from{transform:translate(-50%,0) scale(.5);opacity:0}20%{opacity:.55}to{transform:translate(calc(-50% + var(--dx)),-90px) scale(2.4);opacity:0}}
.flake{position:absolute;top:-20px;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx,30px),110vh) rotate(var(--rot,0deg))}}
.drop{position:absolute;top:-30px;width:2px;height:16px;background:linear-gradient(#ffffff00,#cfe9ffdd);pointer-events:none;animation:rain linear infinite}
@keyframes rain{to{transform:translate(-30px,110vh)}}
#dark{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,#2c2550,#100c26);opacity:0;transition:opacity 1.2s;z-index:300}
#lampL{position:absolute;inset:0;pointer-events:none;z-index:301}
.halo{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#ffd27a 0,transparent 68%);opacity:.5;animation:halo 3s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes halo{from{opacity:.35}to{opacity:.6}}
#capys,#fxL{position:absolute;inset:0}
#fxL{pointer-events:none;z-index:400}
.capy{position:absolute;will-change:left,top,transform;touch-action:none}
.capy .flip{width:100%;height:100%;transition:transform .35s}
.capy svg{width:100%;height:100%;overflow:visible;display:block}
.capy .bob{width:100%;height:100%;transform-origin:50% 80%;animation:idle 3.4s ease-in-out infinite}
.capy.walk .bob{animation:walk .5s ease-in-out infinite}
.capy.soak .bob{animation:soak 3s ease-in-out infinite}
.capy.nap .bob{animation:breathe 3.8s ease-in-out infinite}
.capy.pop .bob{animation:pop .45s ease}
.capy .zz{position:absolute;top:-6px;right:8%;font-size:15px;font-weight:900;color:#7a6ac9;animation:zz 2s infinite}
.capy .bub{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:18px;background:#fff;border-radius:12px;padding:0 5px;box-shadow:0 2px 0 #0002;white-space:nowrap;z-index:2}
.capy.sel::after{content:"";position:absolute;left:18%;right:18%;bottom:-4px;height:8px;border-radius:50%;background:#fff9;box-shadow:0 0 10px #fff}
.capy.guest .bob{filter:drop-shadow(0 0 6px #fff)}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px) scale(1.01,.99)}}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes soak{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(3px) rotate(1deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.96)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18,.84)}70%{transform:scale(.94,1.1)}100%{transform:scale(1)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
.fx{position:absolute;pointer-events:none;font-size:21px;font-weight:900;z-index:9;animation:fxup 1.1s ease-out forwards;white-space:nowrap;text-shadow:0 2px 0 #fff}
@keyframes fxup{from{opacity:1;transform:translate(-50%,0) scale(.7)}30%{transform:translate(-50%,-14px) scale(1.15)}to{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.splash{position:absolute;width:8px;height:8px;border-radius:50%;background:#e9fbff;pointer-events:none;animation:spl .6s ease-out forwards}
@keyframes spl{to{transform:translate(var(--dx),var(--dy));opacity:0}}
#areaName{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fffd;border-radius:99px;padding:3px 6px;font-weight:900;z-index:450;white-space:nowrap;display:flex;gap:4px;align-items:center;box-shadow:0 2px 0 #0001}
#areaName button{font-size:20px;width:38px;height:38px;border-radius:50%}
#areaName button[disabled]{opacity:.25}
#sideL{position:absolute;top:58px;left:8px;display:flex;flex-direction:column;gap:8px;z-index:450}
#sideR{position:absolute;top:58px;right:8px;display:flex;flex-direction:column;gap:8px;z-index:450}
.fab{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #0002;font-size:26px;display:grid;place-items:center;position:relative}
.fab small{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;background:#fff;border-radius:6px;padding:0 4px;white-space:nowrap}
.fab .bdg{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;font-size:11px;font-weight:900;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 4px}
.fab.glow{animation:wob .6s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
#careBar{position:absolute;left:8px;right:8px;bottom:10px;z-index:450;display:flex;justify-content:center}
#careBar .cb{background:#fffe;border-radius:20px;padding:8px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 #0002;max-width:540px;width:100%}
#careBar .cb .who{flex:1;min-width:0;font-weight:900;line-height:1.2;overflow:hidden}
#careBar .cb .who small{display:block;font-weight:700;color:var(--ink2);font-size:.8em}
#careBar .cbtn{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:900;background:var(--peach);border-radius:14px;padding:5px 4px;min-width:52px;min-height:54px;justify-content:center}
#careBar .cbtn b{font-size:22px;line-height:1}
#careBar .hint{background:#fffd;border-radius:99px;padding:8px 14px;font-weight:900;box-shadow:0 3px 0 #0002}
/* ---------- modal ---------- */
#modalBg{position:fixed;inset:0;background:#4b352766;display:none;z-index:500;align-items:center;justify-content:center;padding:14px}
#modalBg.on{display:flex}
#modal{background:#fff;border-radius:24px;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;padding:16px;box-shadow:0 10px 40px #0003;animation:mIn .25s ease;position:relative}
@keyframes mIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#modal h2{text-align:center;margin-top:0;padding:0 30px}
#mClose{position:absolute;top:8px;right:10px;font-size:22px;width:40px;height:40px;border-radius:50%;background:#fbefe3}
.reward{text-align:center}
.reward .big{font-size:60px;line-height:1.1}
.reward .big svg{width:180px;height:126px;overflow:visible}
.reward .amt{font-size:1.5em;font-weight:900;margin:6px 0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:800;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.tst{background:#fff;border-radius:14px;padding:10px 15px;font-weight:900;box-shadow:0 4px 14px #0002;animation:tIn .3s ease;max-width:100%;text-align:center}
.tst.gold{background:var(--lemon)}.tst.err{background:#ffe0e0}
@keyframes tIn{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.pickGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:44vh;overflow-y:auto;padding:2px}
.pickGrid button{background:#fff5ea;border-radius:14px;padding:6px 4px;font-weight:900;font-size:.85em;border:3px solid transparent}
.pickGrid button .big{font-size:34px;display:block;line-height:1.2}
.pickGrid button.on{border-color:var(--peach2);background:var(--peach)}
.pickGrid button[disabled]{opacity:.35}
.bigCapy svg{width:200px;height:140px;overflow:visible}
.duo{display:flex;justify-content:center;gap:4px}
.duo svg{width:48%;height:auto;max-width:170px;overflow:visible}
/* ---------- mini games ---------- */
#game{position:fixed;inset:0;z-index:600;background:#ffe2c8;display:none;touch-action:none}
#game.on{display:block}
#gCanvas{position:absolute;inset:0;width:100%;height:100%}
#gHud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:2;font-weight:900;font-size:1.1em;gap:6px}
#gOver,#gIntro{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#4b352755;z-index:3;padding:16px}
#gOver.on,#gIntro.on{display:flex}
#gOver .box,#gIntro .box{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:360px;text-align:center}
/* ---------- loading ---------- */
#load{position:fixed;inset:0;z-index:1000;background:linear-gradient(#fff3e2,#ffd8bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .6s}
#load .logo{font-size:2.4em;font-weight:900;color:#d9774a;text-shadow:0 3px 0 #fff;text-align:center;line-height:1.05}
#load .wd{width:170px;height:120px;animation:idle 1.4s ease-in-out infinite}
#load .wd svg{width:100%;height:100%;overflow:visible}
#load .tip{max-width:300px;text-align:center;font-weight:800;color:var(--ink2);padding:0 20px}
#load .lbar{width:200px;height:11px;background:#fff;border-radius:9px;overflow:hidden}
#load .lbar i{display:block;height:100%;width:0;background:var(--peach2);transition:width .3s}
/* ---------- tutorial ---------- */
#tut{position:fixed;left:8px;right:8px;z-index:470;display:none;pointer-events:none}
#tut.on{display:flex;justify-content:center}
#tut .box{pointer-events:auto;background:#fff;border-radius:20px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px #0003;max-width:460px;width:100%;border:3px solid var(--lemon2)}
#tut #tutCap svg{width:64px;height:45px;flex:none;overflow:visible}
#tut .tx{flex:1;font-weight:900;font-size:.95em}
.hl{outline:4px solid var(--lemon2)!important;outline-offset:2px;animation:hlp 1s infinite alternate}
@keyframes hlp{from{outline-color:var(--lemon2)}to{outline-color:var(--pink2)}}
</style>
</head>
<body>
<div id="load">
  <div class="logo">Capybara<br>Spa</div>
  <div class="wd" id="loadCapy"></div>
  <div class="lbar"><i id="loadBar"></i></div>
  <div class="tip" id="loadTip"></div>
</div>
<div id="app">
  <div id="top">
    <button class="pill" id="pCoin"><i class="cn"></i><span id="vCoin">0</span></button>
    <button class="pill" id="pGem"><span class="ic">💎</span><span id="vGem">0</span></button>
    <button class="pill lv" id="pLevel"><span class="ic">⭐</span><span id="vLevel">1</span><span class="xpbar"><i id="vXp"></i></span></button>
    <div id="boosts"></div>
    <button class="roundBtn" id="muteBtn" aria-label="Sound">🔊</button>
    <button class="roundBtn" id="profBtn" aria-label="Profile"></button>
  </div>
  <div id="body">
    <div id="main">
      <div class="view on" id="vSpa">
        <div id="scene">
          <svg id="sceneBg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
          <div id="props"></div>
          <div id="pools"></div>
          <div id="capys"></div>
          <div id="wx"></div>
          <div id="dark"></div>
          <div id="lampL"></div>
          <div id="fxL"></div>
        </div>
        <div id="areaName"></div>
        <div id="sideL"></div>
        <div id="sideR"></div>
        <div id="careBar"></div>
      </div>
      <div class="view" id="vCapys"><div class="inner" id="iCapys"></div></div>
      <div class="view" id="vBuild"><div class="inner" id="iBuild"></div></div>
      <div class="view" id="vShop"><div class="inner" id="iShop"></div></div>
      <div class="view" id="vGames"><div class="inner" id="iGames"></div></div>
      <div class="view" id="vMore"><div class="inner" id="iMore"></div></div>
    </div>
    <div id="nav"></div>
  </div>
</div>
<div id="modalBg"><div id="modal"><button id="mClose" aria-label="Close">✕</button><div id="mBody"></div></div></div>
<div id="toast"></div>
<div id="tut"><div class="box"><div id="tutCap"></div><div class="tx" id="tutTx"></div><button class="btn sm" id="tutBtn">OK</button></div></div>
<div id="game">
  <canvas id="gCanvas"></canvas>
  <div id="gHud"></div>
  <div id="gIntro"><div class="box" id="gIntroBox"></div></div>
  <div id="gOver"><div class="box" id="gOverBox"></div></div>
</div>
<script>
/* =====================================================================
   CAPYBARA SPA  —  a cozy capybara hot spring idle game  (MOS Arcade)
   ---------------------------------------------------------------------
   HOW THIS FILE IS ORGANISED
     1. CONFIG        ← all the tuning numbers. Change feel here.
     2. DATA          ← capybaras, pools, areas, decor, snacks, fruits, friends
     3. LANGUAGE      ← English / French words
     4. STATE + SAVE  ← what the game remembers (on the phone only)
     5. ECONOMY       ← how coins are made, guests, babies, care
     6. ART           ← capybaras + spa drawn in code (SVG)
     7. SOUND         ← water, squeaks + soft music made in code
     8. SPA VIEW      ← capybaras walking, soaking, napping, petting

    10. MINI GAMES    ← Fruit Stack, Fruit Catch
    11. MONEY         ← ads + Spa Pack purchase (demo in browser)
    12. MAIN LOOP     ← ticks, away time, tutorial, start-up
===================================================================== */

const $ = id => document.getElementById(id);
const now = () => Date.now();
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CN = '<i class="cn"></i>';
function weighted(odds){ let s = odds.reduce((a, b) => a + b, 0), r = Math.random() * s; for(let i=0;i<odds.length;i++){ r -= odds[i]; if(r < 0) return i; } return odds.length - 1; }
function fmt(n){
  n = Math.floor(n || 0); if(n < 1000) return String(n);
  const u = ['K','M','B','T','Qa','Qi','Sx','Sp']; let i = -1;
  while(n >= 1000 && i < u.length - 1){ n /= 1000; i++; }
  return (n >= 100 ? Math.floor(n) : n >= 10 ? (Math.floor(n * 10) / 10) : (Math.floor(n * 100) / 100)) + u[i];
}
function fmtTime(sec){
  sec = Math.max(0, Math.ceil(sec));
  if(sec < 60) return sec + 's';
  const m = Math.floor(sec / 60), s = sec % 60;
  if(m < 60) return m + 'm' + (s ? ' ' + s + 's' : '');
  const h = Math.floor(m / 60); if(h < 48) return h + 'h ' + (m % 60) + 'm';
  return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}
function dayNum(t){ const d = new Date(t); return Math.floor((t - d.getTimezoneOffset() * 60000) / 86400000); }
function isNight(t){ const h = new Date(t || now()).getHours(); return h >= CONFIG.NIGHT_START || h < CONFIG.NIGHT_END; }

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){ const o = JSON.parse(raw); if(o && o.v) return fixState(o); }
  }catch(e){}
  return null;
}
/* fills in anything missing from an older save */
function fixState(o){
  const d = newState();
  for(const k in d) if(o[k] === undefined) o[k] = d[k];
  for(const k in d.stats) if(o.stats[k] === undefined) o.stats[k] = d.stats[k];
  for(const k in d.snacks) if(o.snacks[k] === undefined) o.snacks[k] = 0;
  for(const k in d.fruit) if(o.fruit[k] === undefined) o.fruit[k] = 0;
  for(const k in d.up) if(o.up[k] === undefined) o.up[k] = 0;
  o.open.forEach(id => { if(!o.ar[id]) o.ar[id] = newArea(); });
  return o;
}
function saveNow(){
  if(!S) return;
  S.lastSeen = now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}

===================================================================== */
function L(o){ if(!o) return ''; return (S && S.lang === 'fr' && o.fr) ? o.fr : (o.en || ''); }
function tr(s, vars){
  let out = (S && S.lang === 'fr' && FR[s]) ? FR[s] : s;
  if(vars) for(const k in vars) out = out.split('{' + k + '}').join(vars[k]);
  return out;
}

const babiesOf = x => S.capys.filter(q => q.parent === x.id && !isAdult(q));
const wxCount = () => WEATHER_IDS.filter(k => k !== 'clear' && S.wx[k]).length;
const palsFree = k => (S.pals[k] || 0) - S.capys.filter(x => x.pal === k).length;
function areaMult(a){ return Math.pow(CONFIG.AREA_MULT, tierOf(a)) * (1 + CONFIG.DECOR_BONUS * decorCount(a)); }
function hearts(x){ let h = 0; CONFIG.FRIEND_LEVELS.forEach(v => { if(x.f >= v) h++; }); return h; }
function nextHeartAt(x){ return CONFIG.FRIEND_LEVELS.find(v => v > x.f); }
function globalMult(t){ return (1 + CONFIG.SNACK_UP_BONUS * S.up.snack) * (1 + CONFIG.WEATHER_BONUS * wxCount()) * (S.ad2x > (t || now()) ? 2 : 1); }
function stackOk(x, t){ return x.stack && x.stack.length && (x.stackT || 0) > (t || now()); }
function stackBonus(x, t){ return stackOk(x, t) ? CONFIG.STACK_BONUS[x.stack.length] * (x.t === 'fancy' ? 1.5 : 1) : 0; }
const isCombo = x => x.pal && PALS[x.pal].likes === x.t;
function palBonus(x){ return x.pal ? CONFIG.PAL_BONUS * (isCombo(x) ? CONFIG.PAL_COMBO : 1) : 0; }
function poolBonus(x){ return POOLS[poolType(x)].bonus + (inFavPool(x) ? CONFIG.FAV_POOL_BONUS : 0); }
function capyRate(x, t){
  const K = KINDS[x.k] || KINDS.classic, h = hearts(x);
  const mood = CONFIG.SAD_MIN + (1 - CONFIG.SAD_MIN) * moodAvg(x) / 100;
  const friend = 1 + h * (CONFIG.FRIEND_BONUS + (x.t === 'grumpy' ? 0.03 : 0));
  return CONFIG.BASE_RATE * CONFIG.RARITY_MULT[K.r] * areaMult(x.a) * (isAdult(x) ? 1 : CONFIG.BABY_EARN) * mood * friend *
    (x.t === 'snacky' ? 1.2 : 1) * (1 + poolBonus(x)) * (1 + stackBonus(x, t)) * (1 + palBonus(x)) * globalMult(t);
}
function incomePerSec(){ return S.capys.reduce((s, x) => s + capyRate(x), 0); }
function areaIncome(a){ return capysIn(a).reduce((s, x) => s + capyRate(x), 0); }
const incomeFloor = () => Math.max(2, incomePerSec());
const priceScale = () => Math.pow(3, S.open.length - 1);

function addCo(n){ S.co += n; if(n > 0) S.stats.coins += n; }
function canPay(cur, n){ return cur === 'g' ? S.g >= n : S.co >= n; }
function pay(cur, n){
  if(!canPay(cur, n)){ toast((cur === 'g' ? '💎 ' + tr('Not enough gems') : CN + ' ' + tr('Not enough coins')), 'err'); sfx('err'); return false; }
  if(cur === 'g') S.g -= n; else S.co -= n;
  return true;
}
const xpNeed = lv => Math.round(CONFIG.XP_BASE * Math.pow(lv, CONFIG.XP_POW));
function titleOf(lv){ let t = TITLES[0][1]; TITLES.forEach(([l, n]) => { if(lv >= l) t = n; }); return t; }
function addXP(n){
  S.xp += n;
  while(S.xp >= xpNeed(S.lv)){
    S.xp -= xpNeed(S.lv); S.lv++;
    const pr = Math.round(Math.max(200, incomeFloor() * 300));
    addCo(pr); S.fruit.yuzu += 2; sfx('level');
    const opens = AREAS.filter((a, i) => CONFIG.AREA_LEVEL[i] === S.lv && i > 0);
    queueModal(() => showReward('⭐', tr('Level {n}!', {n: S.lv}), '+' + fmt(pr) + ' ' + CN + ' +2 🍋<br>' + L(titleOf(S.lv)) +
      opens.map(a => '<br>🔓 ' + a.e + ' ' + L(a) + ' ' + tr('can be opened in Build!')).join('')));
  }
}

/* ---------- making capybaras ---------- */
function randName(){ const used = new Set(S.capys.map(x => x.n)); const free = NAMES.filter(n => !used.has(n)); return pick(free.length ? free : NAMES); }
function assignPool(x){
  if(x.parent){ const p = capyById(x.parent); if(p && p.a === x.a){ x.pool = p.pool; return; } }
  const P = poolsIn(x.a); let best = 0, bestN = 99;
  P.forEach((_, i) => { const n = S.capys.filter(q => q !== x && q.a === x.a && q.pool === i && isAdult(q)).length; if(n < bestN){ bestN = n; best = i; } });
  // prefer a free seat in its favorite pool type
  const fav = P.findIndex((tp, i) => tp === x.fp && S.capys.filter(q => q !== x && q.a === x.a && q.pool === i && isAdult(q)).length < CONFIG.POOL_SEATS);
  x.pool = fav >= 0 ? fav : best;
}
function makeCapy(o){
  const x = {id: S.nextId++, n: o.n || randName(), k: o.k || 'classic', t: o.t || pick(PERS_IDS), fp: o.fp || pick(POOL_IDS),
    a: o.a || S.cur, pool: 0, grow: o.adult ? CONFIG.GROW_SEC : 0, m: {food: 80, calm: 80}, f: 0, pet: 0, stack: [], stackT: 0, pal: null, parent: o.parent || null, born: now()};
  S.capys.push(x);
  assignPool(x);
  addToBook(x.k);
  return x;
}
/* first time a kind is seen = goes in the book. Milestones give gems. */
function addToBook(k){
  if(S.book[k]) return false;
  S.book[k] = now();
  if(S.tut === 0) return true;   // the starting capybaras
  const K = KINDS[k];
  addXP(20 + K.r * 15);
  queueModal(() => {
    sfx('new');
    showReward(capySVG(k, {size: 180}), '✨ ' + tr('New capybara in your book!'),
      '<b style="color:' + RARITY[K.r].c + '">' + L(K) + ' · ' + L(RARITY[K.r]) + '</b><br><span class="muted">' + tr('It’s now in your Collection book.') + '</span>');
  });
  checkMiles();
  return true;
}
const bookCount = () => KIND_IDS.filter(k => S.book[k]).length;
function checkMiles(){
  while(S.miles < BOOK_MILES.length && bookCount() >= BOOK_MILES[S.miles][0]){
    const [n, gm] = BOOK_MILES[S.miles]; S.miles++; S.g += gm;
    queueModal(() => showReward('📖', tr('Book milestone!'), tr('{n} kinds found!', {n}) + '<br><div class="amt">+' + gm + ' 💎</div>'));
  }
}

/* ---------- guests at the gate ---------- */
function rollGuestKind(kind, area){
  const odds = kind === 'rare' ? [0, 55, 35, 10] : kind === 'daily' ? [45, 40, 12, 3] : [68, 25, 6, 1];
  const r = weighted(odds), season = seasonNow();
  let pool = KIND_IDS.filter(k => { const K = KINDS[k]; return K.r === r && !K.paid && (!K.home || K.home === area) && (!K.season || K.season === season); });
  if(r === 2 && Math.random() < 0.5){ const home = KIND_IDS.filter(k => KINDS[k].home === area); if(home.length) pool = home; }
  if(!pool.length) pool = KIND_IDS.filter(k => KINDS[k].r === 1);
  return pick(pool);
}
function spawnGuest(kind){
  const a = S.cur, k = rollGuestKind(kind, a);
  const cost = kind === 'random' ? Math.round(Math.max(250, incomeFloor() * 150) * (1 + KINDS[k].r)) : 0;
  S.guest = {k, t: pick(PERS_IDS), fp: pick(POOL_IDS), a, kind, cost, n: randName(), until: now() + (kind === 'random' ? CONFIG.GUEST_STAY_MIN : 30) * 60000};
  sfx('chime'); squeak(); if(curView === 'Spa') renderSpa(); saveNow();
  toast('👋 ' + tr('A guest is at the gate!'), 'gold');
}
function welcomeGuest(){
  const v = S.guest; if(!v) return;
  const area = hasRoom(v.a) ? v.a : S.open.find(a => hasRoom(a));
  if(!area){ toast('♨️ ' + tr('No room! Build more pools.'), 'err'); sfx('err'); return; }
  if(v.cost && !pay('c', v.cost)) return;
  const x = makeCapy({k: v.k, t: v.t, fp: v.fp, a: area, adult: true, n: v.n});
  S.guest = null; S.guestAt = now() + rnd(...CONFIG.GUEST_MIN) * 60000; S.stats.guests++;
  addXP(10); sfx('hatch'); squeak(1.2); saveNow(); renderSpa();
  toast('💗 ' + esc(x.n) + ' ' + tr('is staying at your spa!'), 'gold');
  tutEvent('guest');
}

/* ---------- babies ---------- */
function tryBaby(){
  const parents = S.capys.filter(x => isAdult(x) && hearts(x) >= CONFIG.BABY_HEARTS && babiesOf(x).length < CONFIG.BABIES_PER_PARENT && hasRoom(x.a));
  if(!parents.length) return null;
  const p = pick(parents);
  const k = Math.random() < 0.85 ? p.k : rollGuestKind('random', p.a);
  const b = makeCapy({k, a: p.a, parent: p.id, t: pick(PERS_IDS)});
  S.stats.babies++; addXP(15); sfx('hatch'); squeak(1.5);
  toast('🍼 ' + tr('A baby arrived! {b} follows {p}.', {b: esc(b.n), p: esc(p.n)}), 'gold');
  if(curView === 'Spa') renderSpa();
  return b;
}
const babyTime = () => CONFIG.GROW_SEC * Math.pow(0.85, S.up.towel);
const rushGems = x => Math.max(1, Math.ceil((babyTime() - x.grow) / 120));

/* ---------- care ---------- */
function petCapy(x, silent){
  const t = now();
  if(t - (x.pet || 0) < CONFIG.PET_COOLDOWN_MS) return false;
  x.pet = t;
  x.m.calm = Math.min(100, x.m.calm + CONFIG.PET_CALM);
  addFriend(x, CONFIG.PET_FRIEND);
  S.stats.pets++; addXP(1);
  if(!silent){ sfx('pet'); squeak(); }
  tutEvent('pet');
  return true;
}
function addFriend(x, n){
  const h0 = hearts(x);
  x.f += n * (x.t === 'grumpy' ? 0.7 : x.t === 'social' ? 1.3 : 1);
  if(hearts(x) > h0){ toast('💗 ' + esc(x.n) + ' ' + tr('likes you more!') + ' ' + '❤️'.repeat(hearts(x)), 'gold'); sfx('level'); }
}
function feedCapy(x, k){
  if(S.snacks[k] < 1){ toast(SNACKS[k].e + ' ' + tr('You have none. Buy some in the Shop.'), 'err'); sfx('err'); return false; }
  const F = SNACKS[k];
  S.snacks[k]--; x.m.food = Math.min(100, x.m.food + F.food); x.m.calm = Math.min(100, x.m.calm + F.calm);
  addFriend(x, F.fr_); S.stats.feeds++; addXP(2); sfx('eat');
  tutEvent('feed'); saveNow();
  return true;
}
function stackFruit(x, k){
  if(S.fruit[k] < 1){ toast(FRUITS[k].e + ' ' + tr('You have none. Buy some in the Shop.'), 'err'); sfx('err'); return false; }
  if(!stackOk(x)) x.stack = [];
  if(x.stack.length >= CONFIG.STACK_MAX){ toast('🗼 ' + tr('The stack is as tall as it can be!'), 'err'); return false; }
  S.fruit[k]--; x.stack.push(k); x.stackT = now() + CONFIG.STACK_HOURS * 3600000;
  addFriend(x, 2); S.stats.stacks++; addXP(2); sfx('stack');
  tutEvent('stack'); saveNow();
  return true;
}
function placePal(x, k){
  if(x.pal === k) return false;
  if(k && palsFree(k) < 1){ toast(tr('That friend is busy. Invite more in the Shop.'), 'err'); return false; }
  x.pal = k || null; if(k){ sfx('chirp'); addFriend(x, 3); }
  saveNow();
  return true;
}

/* ---------- costs ---------- */
const snackPrice = k => Math.round(SNACKS[k].p * priceScale());
const fruitPrice = k => Math.round(FRUITS[k].p * priceScale());
const palPrice = k => Math.round(PALS[k].p * Math.pow(1.8, S.pals[k] || 0));
const snackUpCost = () => Math.round(300 * Math.pow(1.9, S.up.snack));
const poolCost = a => Math.round(1500 * Math.pow(3.2, poolsIn(a).length - 1) * Math.pow(CONFIG.AREA_MULT, tierOf(a)));
const poolTypeCost = k => Math.round((POOLS[k].p || 0) * priceScale());
const jarCost = () => Math.round(2000 * Math.pow(4, S.up.jar));
const towelCost = () => Math.round(1200 * Math.pow(3, S.up.towel));
const decorCost = (k, a) => Math.round(DECOR[k].p * Math.pow(CONFIG.AREA_MULT, tierOf(a)));
const wxCost = k => WEATHER[k].p;
const offlineCapH = () => CONFIG.OFFLINE_HOURS + CONFIG.OFFLINE_UP_HOURS * S.up.jar;
function areaCost(i){ return CONFIG.AREA_COST[i]; }
function canOpenArea(i){ return !S.open.includes(AREAS[i].id) && S.open.length === i && S.lv >= CONFIG.AREA_LEVEL[i]; }

/* =====================================================================
   6. ART — every capybara and every spa thing is drawn in code (SVG).
   No image files needed. Fruits and animal friends are emoji.
===================================================================== */
function shade(hex, amt){ // amt -1..1 (darker..lighter)
  let c = hex.replace('#', ''); if(c.length === 3) c = c.split('').map(x => x + x).join('');
  let r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  const f = v => Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt);
  return '#' + [f(r), f(g), f(b)].map(v => clamp(v, 0, 255).toString(16).padStart(2, '0')).join('');
}
let svgUid = 0;
/* stable pseudo-random numbers, so patterns look the same every time */
function seeded(n){ const out = []; let s = n * 9301 + 49297; for(let i=0;i<60;i++){ s = (s * 9301 + 49297) % 233280; out.push(s / 233280); } return out; }
const emo = (e, x, y, s) => '<text x="' + x + '" y="' + y + '" font-size="' + s + '" text-anchor="middle" dominant-baseline="central" style="font-family:\'Noto Color Emoji\',\'Apple Color Emoji\',\'Segoe UI Emoji\',sans-serif">' + e + '</text>';

/* the capybara. k = kind id.
   opt: baby, sleep, size (px), stack (fruit ids), pal (friend id), towel, halo */
function capySVG(k, opt){
  opt = opt || {};
  const K = KINDS[k] || KINDS.classic, b = !!opt.baby, u = 'cp' + (++svgUid);
  const body = K.pat === 'rainbow' ? 'url(#' + u + 'rb)' : K.body;
  const dark = shade(K.body, -0.2), dark2 = shade(K.body, -0.32);
  const sz = opt.size ? ' width="' + opt.size + '" height="' + Math.round(opt.size * 0.7) + '"' : '';
  const glow = opt.halo && K.r >= 3 ? ' style="filter:drop-shadow(0 0 6px ' + (K.r === 4 ? '#c9b6ff' : '#ffd1e0') + ')"' : '';
  // sizes: babies have a smaller body and a bigger head
  const bx = b ? 50 : 52, by = b ? 56 : 52, brx = b ? 30 : 39, bry = b ? 19 : 24;
  const hx = b ? 66 : 70, hy = b ? 26 : 20, hw = b ? 44 : 46, hh = b ? 36 : 36;
  let s = '<svg viewBox="0 0 120 84"' + sz + glow + ' xmlns="http://www.w3.org/2000/svg"><defs>';
  if(K.pat === 'rainbow') s += '<linearGradient id="' + u + 'rb" x1="0" x2="1" y1="0" y2="0.3"><stop offset="0" stop-color="#ffa0b4"/><stop offset=".25" stop-color="#ffd27a"/><stop offset=".45" stop-color="#fff28c"/><stop offset=".62" stop-color="#a6eebc"/><stop offset=".8" stop-color="#9ad3ff"/><stop offset="1" stop-color="#cba6ff"/></linearGradient>';
  s += '<clipPath id="' + u + 'c"><ellipse cx="' + bx + '" cy="' + by + '" rx="' + brx + '" ry="' + bry + '"/><rect x="' + hx + '" y="' + hy + '" width="' + hw + '" height="' + hh + '" rx="16"/></clipPath></defs>';
  // shadow + far legs
  s += '<ellipse cx="' + (bx + 4) + '" cy="' + (by + bry + 3) + '" rx="' + (brx + 2) + '" ry="3.5" fill="#000" opacity=".12"/>';
  s += '<rect x="' + (bx - brx * 0.62) + '" y="' + (by + bry * 0.4) + '" width="9" height="' + (bry * 0.75 + 4) + '" rx="4" fill="' + dark2 + '"/>';
  s += '<rect x="' + (bx + brx * 0.5) + '" y="' + (by + bry * 0.4) + '" width="9" height="' + (bry * 0.75 + 4) + '" rx="4" fill="' + dark2 + '"/>';
  // body
  s += '<ellipse cx="' + bx + '" cy="' + by + '" rx="' + brx + '" ry="' + bry + '" fill="' + body + '"/>';
  // head (a soft rounded box) + snout
  s += '<rect x="' + hx + '" y="' + hy + '" width="' + hw + '" height="' + hh + '" rx="16" fill="' + body + '"/>';
  // pattern (clipped to body + head)
  s += '<g clip-path="url(#' + u + 'c)">' + patSVG(K, k, bx, by, brx, bry) + '</g>';
  // belly + back light
  s += '<ellipse cx="' + (bx + 2) + '" cy="' + (by + bry * 0.55) + '" rx="' + (brx * 0.72) + '" ry="' + (bry * 0.33) + '" fill="' + K.belly + '" opacity=".75"/>';
  s += '<ellipse cx="' + (bx - 6) + '" cy="' + (by - bry * 0.62) + '" rx="' + (brx * 0.5) + '" ry="4" fill="#fff" opacity=".22"/>';
  const sx = hx + hw - 20;
  s += '<rect x="' + sx + '" y="' + (hy + 9) + '" width="21" height="' + (hh - 9) + '" rx="10" fill="' + K.snout + '" opacity=".55"/>';
  // ears
  s += '<ellipse cx="' + (hx + 9) + '" cy="' + (hy + 2) + '" rx="5.5" ry="4.5" fill="' + dark + '"/><ellipse cx="' + (hx + 9.5) + '" cy="' + (hy + 2.6) + '" rx="2.6" ry="2.1" fill="' + shade(K.snout, -0.3) + '"/>';
  // face
  const ex = hx + (b ? 24 : 25), ey = hy + (b ? 13 : 12), er = b ? 3.1 : 2.6;
  if(opt.sleep){
    s += '<path d="M' + (ex - er - 1) + ' ' + ey + ' Q' + ex + ' ' + (ey + er + 1) + ' ' + (ex + er + 1) + ' ' + ey + '" stroke="#3a2a20" stroke-width="1.7" fill="none" stroke-linecap="round"/>';
  } else {
    s += '<circle cx="' + ex + '" cy="' + ey + '" r="' + er + '" fill="#2e2018"/><circle cx="' + (ex + er * 0.35) + '" cy="' + (ey - er * 0.4) + '" r="' + (er * 0.38) + '" fill="#fff"/>';
  }
  const nx = hx + hw - 5, ny = hy + 13;
  s += '<ellipse cx="' + nx + '" cy="' + ny + '" rx="4.6" ry="3.4" fill="#3a2a20" opacity=".85"/><ellipse cx="' + (nx - 1) + '" cy="' + (ny - 1.2) + '" rx="1.5" ry=".8" fill="#fff" opacity=".4"/>';
  s += '<path d="M' + (nx - 5) + ' ' + (ny + 9) + ' Q' + (nx - 2) + ' ' + (ny + 12) + ' ' + (nx + 1) + ' ' + (ny + 9) + '" stroke="#3a2a20" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".7"/>';
  s += '<ellipse cx="' + (ex + 2) + '" cy="' + (ey + 9) + '" rx="4" ry="2.2" fill="#ff7f8f" opacity=".35"/>';
  // near legs
  s += '<rect x="' + (bx - brx * 0.38) + '" y="' + (by + bry * 0.45) + '" width="10" height="' + (bry * 0.7 + 4) + '" rx="4.5" fill="' + dark + '"/>';
  s += '<rect x="' + (bx + brx * 0.72) + '" y="' + (by + bry * 0.45) + '" width="10" height="' + (bry * 0.7 + 4) + '" rx="4.5" fill="' + dark + '"/>';
  // accessories
  let top = hy;   // where the head top is (stack sits above)
  const acc = K.acc, hcx = hx + 18;
  if(acc === 'leaf'){ s += '<path d="M' + hcx + ' ' + (hy + 1) + ' C' + (hcx - 4) + ' ' + (hy - 10) + ' ' + (hcx + 8) + ' ' + (hy - 14) + ' ' + (hcx + 12) + ' ' + (hy - 8) + ' C' + (hcx + 8) + ' ' + (hy - 3) + ' ' + (hcx + 4) + ' ' + hy + ' ' + hcx + ' ' + (hy + 1) + 'Z" fill="#5bbf6a"/><path d="M' + hcx + ' ' + hy + ' L' + (hcx + 10) + ' ' + (hy - 8) + '" stroke="#3f9a4f" stroke-width="1"/>'; top -= 6; }
  if(acc === 'flowers'){ [[hcx - 7, hy + 1], [hcx + 2, hy - 2], [hcx + 11, hy + 1]].forEach(([fx, fy]) => { for(let i=0;i<5;i++){ const a = i * 1.2566; s += '<circle cx="' + (fx + Math.cos(a) * 2.6).toFixed(1) + '" cy="' + (fy + Math.sin(a) * 2.6).toFixed(1) + '" r="2.2" fill="#ffb3cf"/>'; } s += '<circle cx="' + fx + '" cy="' + fy + '" r="1.4" fill="#ffe27a"/>'; }); top -= 4; }
  if(acc === 'shades'){ s += '<rect x="' + (ex - 6) + '" y="' + (ey - 4) + '" width="12" height="7" rx="3" fill="#2a2a3a"/><rect x="' + (ex + 6) + '" y="' + (ey - 2) + '" width="9" height="2" fill="#2a2a3a"/><rect x="' + (ex - 4) + '" y="' + (ey - 3) + '" width="3" height="2" rx="1" fill="#fff" opacity=".5"/>'; }
  if(acc === 'pumpkin'){ s += '<ellipse cx="' + (hcx + 2) + '" cy="' + (hy - 4) + '" rx="10" ry="7" fill="#ff9a2e"/><path d="M' + (hcx + 2) + ' ' + (hy - 11) + ' v-4" stroke="#5a7a2a" stroke-width="2.4" stroke-linecap="round"/><path d="M' + (hcx - 3) + ' ' + (hy - 9) + ' q-2 5 0 10 M' + (hcx + 7) + ' ' + (hy - 9) + ' q2 5 0 10" stroke="#e07a12" stroke-width="1.2" fill="none"/>'; top -= 12; }
  if(acc === 'scarf'){ s += '<path d="M' + (hx - 2) + ' ' + (hy + 18) + ' Q' + (hx + 6) + ' ' + (hy + 30) + ' ' + (hx + 14) + ' ' + (hy + hh - 2) + ' L' + (hx + 6) + ' ' + (hy + hh + 2) + ' Q' + (hx - 4) + ' ' + (hy + 30) + ' ' + (hx - 8) + ' ' + (hy + 20) + 'Z" fill="#e8505b"/><rect x="' + (hx + 2) + '" y="' + (hy + hh - 4) + '" width="7" height="14" rx="2" fill="#e8505b" transform="rotate(-15 ' + (hx + 5) + ' ' + (hy + hh) + ')"/><path d="M' + (hx - 4) + ' ' + (hy + 22) + ' L' + (hx + 10) + ' ' + (hy + hh - 4) + '" stroke="#fff" stroke-width="1.6" stroke-dasharray="2 3" opacity=".7"/>'; }
  if(opt.towel){ s += '<rect x="' + (hcx - 9) + '" y="' + (hy - 7) + '" width="22" height="9" rx="3.5" fill="#fff"/><rect x="' + (hcx - 9) + '" y="' + (hy - 4) + '" width="22" height="2" fill="#7fd3c9"/>'; top -= 7; }
  // animal friend on its back
  if(opt.pal && PALS[opt.pal]) s += emo(PALS[opt.pal].e, bx - 6, by - bry - 7, b ? 17 : 22);
  // fruit stack on its head (taller = bigger bonus!)
  if(opt.stack && opt.stack.length){
    opt.stack.forEach((f, i) => { s += emo(FRUITS[f] ? FRUITS[f].e : '🍊', hcx + (i % 2 ? 1.6 : -1.2), top - 6 - i * 12.5, 15); });
  }
  return s + '</svg>';
}
/* fur patterns */
function patSVG(K, k, bx, by, brx, bry){
  const R = seeded(k.length * 7 + k.charCodeAt(0)), pc = K.pc || '#fff';
  let s = '';
  if(K.pat === 'fluffy'){ for(let i=0;i<14;i++){ const a = Math.PI * (1.05 + i * 0.07); s += '<circle cx="' + (bx + Math.cos(a) * brx * 0.98).toFixed(1) + '" cy="' + (by + Math.sin(a) * bry * 0.98).toFixed(1) + '" r="4.2" fill="' + shade(K.body, 0.25) + '"/>'; } for(let i=0;i<10;i++) s += '<circle cx="' + (bx - brx * 0.6 + R[i] * brx * 1.3).toFixed(1) + '" cy="' + (by - bry * 0.3 + R[i + 12] * bry * 0.8).toFixed(1) + '" r="3" fill="' + shade(K.body, 0.18) + '" opacity=".7"/>'; }
  if(K.pat === 'spots'){ for(let i=0;i<9;i++) s += '<ellipse cx="' + (bx - brx * 0.7 + R[i] * brx * 1.5).toFixed(1) + '" cy="' + (by - bry * 0.6 + R[i + 20] * bry * 1.1).toFixed(1) + '" rx="' + (3 + R[i + 40] * 3).toFixed(1) + '" ry="' + (2.4 + R[i + 30] * 2).toFixed(1) + '" fill="' + pc + '" opacity=".8"/>'; }
  if(K.pat === 'shine'){ s += '<ellipse cx="' + (bx - 8) + '" cy="' + (by - bry * 0.4) + '" rx="' + (brx * 0.55) + '" ry="' + (bry * 0.35) + '" fill="#fff6c8" opacity=".55"/>'; for(let i=0;i<5;i++){ const x = bx - brx * 0.6 + R[i] * brx * 1.6, y = by - bry * 0.5 + R[i + 9] * bry; s += '<path d="M' + x.toFixed(1) + ' ' + (y - 3.5).toFixed(1) + ' l1 2.5 2.5 1 -2.5 1 -1 2.5 -1 -2.5 -2.5 -1 2.5 -1z" fill="#fff"/>'; } }
  if(K.pat === 'sparkle'){ for(let i=0;i<8;i++){ const x = bx - brx * 0.7 + R[i] * brx * 1.7, y = by - bry * 0.6 + R[i + 9] * bry * 1.2; s += '<path d="M' + x.toFixed(1) + ' ' + (y - 3).toFixed(1) + ' l.8 2.2 2.2 .8 -2.2 .8 -.8 2.2 -.8 -2.2 -2.2 -.8 2.2 -.8z" fill="#9fd0ff"/>'; } }
  if(K.pat === 'petals'){ for(let j=0;j<5;j++){ const x = bx - brx * 0.6 + R[j] * brx * 1.4, y = by - bry * 0.5 + R[j + 7] * bry; for(let i=0;i<5;i++){ const a = i * 1.2566 + j; s += '<circle cx="' + (x + Math.cos(a) * 2.2).toFixed(1) + '" cy="' + (y + Math.sin(a) * 2.2).toFixed(1) + '" r="1.8" fill="' + pc + '"/>'; } s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="1" fill="#ffe27a"/>'; } }
  if(K.pat === 'stars'){ for(let i=0;i<10;i++){ const x = bx - brx * 0.7 + R[i] * brx * 1.7, y = by - bry * 0.6 + R[i + 12] * bry * 1.2, r = 1.2 + R[i + 24] * 1.1;
    s += '<path d="M' + x.toFixed(1) + ' ' + (y - r * 1.8).toFixed(1) + ' L' + (x + r * 0.5).toFixed(1) + ' ' + (y - r * 0.5).toFixed(1) + ' L' + (x + r * 1.8).toFixed(1) + ' ' + y.toFixed(1) + ' L' + (x + r * 0.5).toFixed(1) + ' ' + (y + r * 0.5).toFixed(1) + ' L' + x.toFixed(1) + ' ' + (y + r * 1.8).toFixed(1) + ' L' + (x - r * 0.5).toFixed(1) + ' ' + (y + r * 0.5).toFixed(1) + ' L' + (x - r * 1.8).toFixed(1) + ' ' + y.toFixed(1) + ' L' + (x - r * 0.5).toFixed(1) + ' ' + (y - r * 0.5).toFixed(1) + 'Z" fill="#fff" opacity=".9"/>'; } }
  return s;

/* ---------- pools: a back part (rim + water) and a front part (water that hides the capybaras' legs) ---------- */
function rimStones(half, seed){
  const R = seeded(seed), cols = ['#b7aea6', '#a39a92', '#c6beb6', '#9a918a'];
  let s = '';
  for(let i=0;i<26;i++){
    const a = i / 26 * Math.PI * 2, x = 100 + Math.cos(a) * 94, y = 46 + Math.sin(a) * 39;
    if(half === 'back' && Math.sin(a) > 0.05) continue;
    if(half === 'front' && Math.sin(a) <= 0.05) continue;
    s += '<ellipse cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" rx="' + (11 + R[i] * 5).toFixed(1) + '" ry="' + (7 + R[i + 26] * 3).toFixed(1) + '" fill="' + cols[i % 4] + '"/>';
  }
  return s;
}

/* =====================================================================
   7. SOUND — water, little capybara squeaks and soft music
   (WebAudio, made in code, no sound files)
===================================================================== */
let AC = null, musGain = null, sfxGain = null, musTimer = null, musArea = null, musStep = 0, waterNode = null, waterGain = null;
function audio(){
  if(AC) return AC;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(AC.destination);
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.connect(AC.destination);
    musGain = AC.createGain(); musGain.gain.value = 0.15; musGain.connect(lp);
  }catch(e){ AC = null; }
  return AC;
}
function tone(f, dur, type, vol, when, dest, slide){
  const A = audio(); if(!A) return;
  const t = (when || A.currentTime);
  const o = A.createOscillator(), g = A.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxGain); o.start(t); o.stop(t + dur + 0.05);
}
function bloop(p){ if(!S || !S.snd || !audio()) return; const t = AC.currentTime, f = rnd(260, 420) * (p || 1); tone(f, 0.1, 'sine', 0.2, t, null, f * 2.2); }
/* the little capybara "eep!" */
function squeak(p){
  if(!S || !S.snd || !audio()) return;
  const t = AC.currentTime, f = rnd(1050, 1300) * (p || 1);
  tone(f, 0.07, 'triangle', 0.13, t, null, f * 1.25); tone(f * 1.08, 0.08, 'triangle', 0.11, t + 0.1, null, f * 1.4);
}
function sfx(k){
  if(!S || !S.snd || !audio()) return;
  const t = AC.currentTime;
  switch(k){
    case 'tap': tone(700, 0.05, 'triangle', 0.12); break;
    case 'pet': tone(880, 0.09, 'sine', 0.2, t, null, 1320); tone(1180, 0.1, 'sine', 0.16, t + 0.1, null, 1560); break;
    case 'eat': [0, 0.11, 0.22].forEach(d => tone(300, 0.06, 'triangle', 0.18, t + d, null, 210)); break;
    case 'stack': tone(520, 0.08, 'triangle', 0.2, t, null, 780); tone(780, 0.1, 'triangle', 0.16, t + 0.08); break;
    case 'chirp': [0, 0.08, 0.16].forEach(d => tone(2200, 0.05, 'sine', 0.12, t + d, null, 2900)); break;
    case 'splash': bloop(0.8); setTimeout(() => bloop(1.2), 90); break;
    case 'coin': tone(1400, 0.07, 'sine', 0.18); tone(2100, 0.12, 'sine', 0.14, t + 0.06); break;
    case 'err': tone(240, 0.14, 'triangle', 0.15); tone(190, 0.18, 'triangle', 0.15, t + 0.1); break;
    case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.22, t + i * 0.09)); break;
    case 'hatch': [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.16, 'sine', 0.2, t + i * 0.07)); break;
    case 'new': [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.3, 'triangle', 0.18, t + i * 0.1)); break;
    case 'chime': tone(1319, 0.4, 'sine', 0.14); tone(1760, 0.5, 'sine', 0.1, t + 0.12); break;
    case 'win': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.15, t + i * 0.1)); break;
    case 'whoosh': tone(200, 0.35, 'sine', 0.15, t, null, 700); break;
  }
}
/* soft running water in the background (part of "Sounds") */
function waterStart(){
  if(!S || !S.snd || !audio() || waterNode) return;
  try{
    const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    let last = 0; for(let i=0;i<len;i++){ last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.2; }
    waterNode = AC.createBufferSource(); waterNode.buffer = buf; waterNode.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    waterGain = AC.createGain(); waterGain.gain.value = 0.18;
    waterNode.connect(lp); lp.connect(waterGain); waterGain.connect(AC.destination); waterNode.start();
  }catch(e){ waterNode = null; }
}
function waterStop(){ if(waterNode){ try{ waterNode.stop(); }catch(e){} waterNode = null; } }
/* soft generative music: each area has its own scale and speed */
function musicStart(){
  if(!S || !S.mus || !audio()){ musicStop(); return; }
  if(musTimer && musArea === S.cur) return;
  musicStop();
  musArea = S.cur;
  const A = AREA(S.cur) || AREAS[0];
  const [scale, bpm, wave] = A.music;
  const step = 60 / bpm / 2;
  const root = 294 * Math.pow(2, (AREAS.indexOf(A) * -2) / 12);
  const prog = [0, 3, 4, 2];
  musStep = 0;
  musTimer = setInterval(() => {
    if(!AC || AC.state !== 'running') return;
    const t = AC.currentTime + 0.05;
    const bar = Math.floor(musStep / 8) % 4, beat = musStep % 8, chord = prog[bar];
    if(beat === 0) [0, 2, 4].forEach(o => tone(root / 2 * Math.pow(2, scale[(chord + o) % scale.length] / 12), step * 7.5, 'sine', 0.2, t, musGain));
    if(Math.random() < 0.5){
      const deg = chord + [0, 2, 4, 2, 1, 3, 4, 2][beat];
      const f = root * Math.pow(2, (scale[deg % scale.length] + 12 * Math.floor(deg / scale.length)) / 12);
      tone(f, step * 1.6, wave, 0.28, t, musGain);          // a soft pluck, like a koto
      tone(f * 2, step * 0.6, 'sine', 0.06, t, musGain);
    }
    musStep++;
  }, step * 1000);
}
function musicStop(){ if(musTimer) clearInterval(musTimer); musTimer = null; musArea = null; }
function audioUnlock(){ const A = audio(); if(A && A.state === 'suspended') A.resume(); musicStart(); if(S && S.snd) waterStart(); }

/* ---------- capybaras ---------- */
function sceneList(){
  const list = capysIn(S.cur).slice();
  if(S.guest && S.guest.a === S.cur) list.push(Object.assign({id: 'guest', grow: CONFIG.GROW_SEC, m: {food: 100, calm: 100}, stack: [], vis: true}, S.guest));
  return list;
}
function capyKey(x, a){ return [x.k, isAdult(x) ? 1 : 0, a.st === 'nap' ? 1 : 0, stackOk(x) ? x.stack.join('.') : '', x.pal || '', x.vis ? 'v' : ''].join('|'); }
function sizeActor(a, x){
  const g = geo(), w = isAdult(x) ? g.cw : g.bw, h = w * 0.7, inPool = a.st === 'soak' || a.st === 'nap';
  a.el.style.width = w + 'px'; a.el.style.height = h + 'px';
  a.el.style.marginLeft = (-w / 2) + 'px'; a.el.style.marginTop = (inPool ? -0.74 * h : -0.92 * h) + 'px';
}
function renderCapys(){
  const box = $('capys'), list = sceneList(), seen = {};
  list.forEach(x => {
    seen[x.id] = 1;
    let a = actors[x.id];
    if(!a){
      a = actors[x.id] = {id: x.id, x: 50, y: 50, tx: 0, ty: 0, st: 'soak', until: now() + rnd(4000, 15000), face: 1, key: '', seat: 0};
      if(x.vis){ a.x = -6; a.y = GATE[1] + 1; a.st = 'walk'; a.tx = GATE[0] + 6; a.ty = GATE[1] + 1; a.until = now() + 60000; a.guest = true; }
      else { a.seat = seatIndex(x); const p = seatPos(x.a, x.pool, a.seat, !isAdult(x)); a.x = p.x; a.y = p.y; if(Math.random() < 0.25){ a.st = 'nap'; } }
      if(!isAdult(x) && x.parent) a.follow = true;
      a.el = document.createElement('div');
      a.el.className = 'capy';
      a.el.innerHTML = '<div class="flip"><div class="bob"></div></div>';
      a.el.addEventListener('pointerdown', e => { e.stopPropagation(); tapCapy(x.id); });
      box.appendChild(a.el);
    }
    const k = capyKey(x, a) + '|' + Math.round(geo().pw);
    if(a.key !== k){
      a.key = k;
      sizeActor(a, x);
      a.el.querySelector('.bob').innerHTML = capySVG(x.k, {baby: !isAdult(x), sleep: a.st === 'nap', stack: stackOk(x) ? x.stack : null, pal: x.pal});
      a.el.classList.toggle('guest', !!x.vis);
    }
    // little thought bubble
    let bub = '';
    if(x.vis) bub = '👋';
    else if(a.st !== 'nap'){ if(x.m.food < 25) bub = '🍉'; else if(x.m.calm < 25) bub = '💭'; }
    let be = a.el.querySelector('.bub');
    if(bub && !be){ be = document.createElement('div'); be.className = 'bub'; a.el.appendChild(be); }
    if(be){ if(bub) be.textContent = bub; else be.remove(); }
    let zz = a.el.querySelector('.zz');
    if(a.st === 'nap' && !zz){ zz = document.createElement('div'); zz.className = 'zz'; zz.textContent = 'z'; a.el.appendChild(zz); }
    if(a.st !== 'nap' && zz) zz.remove();
    a.el.classList.toggle('sel', sel === x.id);
    placeActor(a, x);
  });
  for(const id in actors) if(!seen[id]){ actors[id].el.remove(); delete actors[id]; }
}
/* which seat in its pool (0, 1, 2) */
function seatIndex(x){
  if(!isAdult(x) && x.parent){ const p = capyById(x.parent); if(p && actors[p.id]) return actors[p.id].seat; }
  const mates = S.capys.filter(q => q.a === x.a && q.pool === x.pool && isAdult(q));
  const i = mates.indexOf(x);
  return i < 0 ? 1 : [1, 0, 2, 1, 0, 2][i % 6];
}
function placeActor(a, x){
  const inPool = a.st === 'soak' || a.st === 'nap';
  a.el.style.left = a.x + '%'; a.el.style.top = a.y + '%';
  a.el.style.zIndex = inPool ? zOf(POOL_POS[x.pool] ? POOL_POS[x.pool][1] : a.y) : zOf(a.y) + 2;
  a.el.firstChild.style.transform = a.face < 0 ? 'scaleX(-1)' : '';
  a.el.classList.toggle('walk', a.st === 'walk' || a.st === 'go');
  a.el.classList.toggle('soak', a.st === 'soak');
  a.el.classList.toggle('nap', a.st === 'nap');
}
function setSt(a, x, st){
  const was = a.st; a.st = st;
  if((was === 'soak' || was === 'nap') !== (st === 'soak' || st === 'nap')) sizeActor(a, x);
  if((was === 'nap') !== (st === 'nap')) a.key = '';
}
/* what does a capybara do next? depends on its personality and the time */
function decide(a, x){
  const t = now(), night = isNight(t);
  if(x.vis) return;
  // babies follow their parent
  if(!isAdult(x) && x.parent){
    const pa = actors[x.parent];
    if(pa){ a.follow = true; a.until = t + 1500; return; }
  }
  if(a.st === 'nap'){ setSt(a, x, 'soak'); a.until = t + rnd(5000, 12000); renderCapys(); return; }
  if(a.st === 'soak'){
    let nap = 0.22 + (x.t === 'sleepy' ? 0.3 : 0) + (night ? 0.25 : 0);
    let walk = x.t === 'social' ? 0.35 : x.t === 'sleepy' ? 0.08 : 0.2;
    const r = Math.random();
    if(r < nap){ setSt(a, x, 'nap'); a.until = t + rnd(15000, 40000) * (x.t === 'sleepy' ? 1.5 : 1); renderCapys(); }
    else if(r < nap + walk){ setSt(a, x, 'walk'); a.tx = rnd(DECK.x0, DECK.x1); a.ty = pick(DECK.lanes); a.until = t + 30000; sfx('splash'); splashAt(a.x, a.y); }
    else a.until = t + rnd(5000, 12000);
    return;
  }
  if(a.st === 'stand'){
    if(Math.random() < 0.55){ goToPool(a, x); }
    else { setSt(a, x, 'walk'); a.tx = rnd(DECK.x0, DECK.x1); a.ty = pick(DECK.lanes); a.until = t + 30000; }
  }
}
function goToPool(a, x){
  a.seat = seatIndex(x);
  const p = seatPos(x.a, x.pool, a.seat, !isAdult(x));
  setSt(a, x, 'go'); a.tx = p.x; a.ty = p.y; a.until = now() + 30000;
}
function stepActors(dt){
  const t = now(), list = sceneList();
  list.forEach(x => {
    const a = actors[x.id]; if(!a) return;
    // babies: line up behind the parent
    if(a.follow && x.parent && !isAdult(x)){
      const pa = actors[x.parent], p = capyById(x.parent);
      if(pa && p){
        const idx = babiesOf(p).indexOf(x) + 1;
        if(pa.st === 'soak' || pa.st === 'nap'){
          const sp = seatPos(p.a, p.pool, pa.seat, true);
          a.tx = sp.x - (idx - 1) * 4; a.ty = sp.y;
          if(Math.hypot(a.tx - a.x, a.ty - a.y) < 1.2){ if(a.st !== pa.st){ setSt(a, x, pa.st === 'nap' ? 'nap' : 'soak'); if(pa.st === 'nap') renderCapys(); } }
          else if(a.st !== 'go') setSt(a, x, 'go');
        } else {
          a.tx = pa.x - pa.face * (geo().cw * 0.45 + idx * geo().bw * 0.7) / geo().W * 100; a.ty = pa.y + 0.5;
          if(a.st === 'soak' || a.st === 'nap') setSt(a, x, 'walk');
          if(Math.hypot(a.tx - a.x, a.ty - a.y) < 1) { if(a.st !== 'stand') setSt(a, x, 'stand'); a.face = pa.face; }
          else if(a.st !== 'walk') setSt(a, x, 'walk');
        }
      } else a.follow = false;
    } else if(t > a.until) decide(a, x);
    if(a.st === 'walk' || a.st === 'go'){
      const sp = (isAdult(x) ? 7 : 8.5) * (x.t === 'sleepy' ? 0.75 : 1);
      const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy);
      if(d < 0.8){
        if(a.follow){ /* handled above */ }
        else if(x.vis){ setSt(a, x, 'stand'); a.face = 1; a.until = t + 999999; }
        else if(a.st === 'go'){ setSt(a, x, 'soak'); a.until = t + rnd(8000, 20000); sfx('splash'); splashAt(a.x, a.y); renderCapys(); }
        else { setSt(a, x, 'stand'); a.until = t + rnd(1500, 4000); if(x.t === 'social' || Math.random() < 0.3) setTimeout(() => squeak(), rnd(0, 800)); }
      } else {
        const v = Math.min(d, sp * dt * (a.follow ? 1.4 : 1));
        a.x += dx / d * v; a.y += dy / d * v * 0.8;
        if(Math.abs(dx) > 0.6) a.face = dx > 0 ? 1 : -1;
      }
    }
    placeActor(a, x);
  });
}

/* ---------- tapping ---------- */
function tapCapy(id){
  audioUnlock();
  if(id === 'guest'){ openGuest(); return; }
  const x = capyById(id), a = actors[id]; if(!x || !a) return;
  sel = id;
  if(a.st === 'nap'){ setSt(a, x, 'soak'); a.until = now() + 5000; }
  if(petCapy(x)){
    fxAt(a.x, a.y - 9, '💗'); fxAt(a.x + 3, a.y - 6, '💕', 150);
    a.el.classList.remove('pop'); void a.el.offsetWidth; a.el.classList.add('pop');
  }
  renderCapys(); renderCare(); saveNow();
}
function fxAt(x, y, html, delay){
  setTimeout(() => {
    const e = document.createElement('div'); e.className = 'fx'; e.innerHTML = html;
    e.style.left = x + '%'; e.style.top = y + '%'; $('fxL').appendChild(e);
    setTimeout(() => e.remove(), 1150);

}
function fxAtCapy(x, html, delay){ const a = actors[x.id]; if(a) fxAt(a.x, a.y - 10, html, delay); }
function splashAt(x, y){

/* ---------- toast + modal ---------- */
function toast(msg, kind){
  const t = document.createElement('div'); t.className = 'tst' + (kind ? ' ' + kind : ''); t.innerHTML = msg;
  const box = $('toast'); box.appendChild(t);
  while(box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.style.transition = 'opacity .4s'; t.style.opacity = 0; setTimeout(() => t.remove(), 400); }, 2600);
}
let modalOnClose = null, modalQueue = [];

/* ---------- daily gift ---------- */
function openGift(){
  const t = now(), today = dayNum(t), ready = S.daily.last !== today;
  const streak = ready ? (S.daily.last === today - 1 ? S.daily.streak + 1 : 1) : S.daily.streak;
  const day = ((streak - 1) % 7 + 7) % 7, G = GIFT_DAYS[day];
  const pr = Math.round(Math.max(150, incomeFloor() * 60 * G.p));
  const items = Object.keys(G).filter(k => k !== 'p').map(k => ' +' + G[k] + ' ' + (SNACKS[k] || FRUITS[k]).e).join('');
  let h = '<div class="row" style="justify-content:center;gap:4px;flex-wrap:wrap;margin-bottom:8px">';
  GIFT_DAYS.forEach((g, i) => h += '<span class="tag" style="font-size:.9em;padding:5px 8px;' + (i === day ? 'background:var(--peach2);color:#fff' : i < day ? 'background:var(--teal)' : '') + '">' + tr('Day') + ' ' + (i + 1) + '</span>');
  h += '</div><div class="reward"><div class="big">🎁</div><div class="amt">+' + fmt(pr) + ' ' + CN + items + '</div>';
  h += '<p class="muted">🔥 ' + tr('Streak') + ': ' + streak + '<br>👋 ' + tr('A visiting capybara comes too!') + '</p></div>';
  h += ready ? '<button class="btn wide gold" id="gfGo">' + tr('Open my gift!') + '</button>' : '<p class="center"><b>' + tr('Come back tomorrow for the next gift!') + '</b></p>';
  openModal('🎁 ' + tr('Daily gift'), h);
  if($('gfGo')) $('gfGo').onclick = () => {
    S.daily = {streak, last: today}; addCo(pr);
    Object.keys(G).forEach(k => { if(SNACKS[k]) S.snacks[k] += G[k]; if(FRUITS[k]) S.fruit[k] += G[k]; });
    sfx('win'); closeModal(); toast('🎁 +' + fmt(pr) + ' ' + CN, 'gold'); saveNow(); renderSide(); refreshTop();
    if(S.dvDay !== today && !S.guest){ S.dvDay = today; setTimeout(() => spawnGuest('daily'), 900); }
  };
}

/* =====================================================================
   10. MINI GAMES — Fruit Stack, Fruit Catch
   Each game: intro → loop (update + draw) → gameOver(score)
   update(dt) moves things, draw(ctx) paints the screen, every frame.
===================================================================== */
const GAMES = [
  {id:'stack', e:'🗼', en:'Fruit Stack', fr:'Pile de fruits', d:{en:'Tap to drop the swinging fruit on the capybara’s head. Build the tallest stack!', fr:'Touche pour lâcher le fruit qui se balance sur la tête du capybara. Fais la plus haute pile!'}},
  {id:'catch', e:'🧺', en:'Fruit Catch', fr:'Attrape les fruits', d:{en:'Slide your finger to catch falling fruit. Watch out for the bees!', fr:'Glisse ton doigt pour attraper les fruits qui tombent. Attention aux abeilles!'}},
];
function renderGames(){
  const t = now(), next = S.tickets < CONFIG.TICKETS_MAX ? fmtTime((S.tkT + CONFIG.TICKET_MIN * 60000 - t) / 1000) : '';
  let h = card('🎟️', tr('Tickets') + ': ' + S.tickets + '/' + CONFIG.TICKETS_MAX, next ? tr('+1 in') + ' ' + next : tr('Full!'), '<button class="btn mint sm" id="tkAd">' + adIcon() + ' +' + CONFIG.AD_TICKETS + '</button>');
  GAMES.forEach(g => {
    h += '<div class="card"><div class="art" style="font-size:36px">' + g.e + '</div><div class="info"><div class="nm">' + L(g) + '</div><div class="sub">' + L(g.d) + '</div><div class="sub">🏆 ' + tr('Best') + ': ' + (S.stats.best[g.id] || 0) + '</div></div>' +
      '<button class="btn sm" data-g="' + g.id + '"' + (S.tickets < 1 ? ' disabled' : '') + '>▶ ' + tr('Play') + '</button></div>';
  });
  h += '<p class="muted center">' + tr('Win coins and fruits for your capybaras!') + '</p>';
  $('iGames').innerHTML = '<h2>🎮 ' + tr('Mini games') + '</h2>' + h;
  $('iGames').querySelectorAll('[data-g]').forEach(b => b.onclick = () => startGame(b.dataset.g, true));
  $('tkAd').onclick = async () => { if(await rewardAd()){ S.tickets += CONFIG.AD_TICKETS; saveNow(); toast('+' + CONFIG.AD_TICKETS + ' 🎟️', 'gold'); renderGames(); } };
}

let G = null;   // the running game
const cv = () => $('gCanvas');
function svgImg(svg){ const i = new Image(); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); return i; }
function playerCapy(){ return (S.avatar && capyById(S.avatar)) || S.capys[0] || {k: 'classic', grow: 99999}; }
function startGame(id, intro){
  if(S.tickets < 1){ toast('🎟️ ' + tr('No tickets left. Watch an ad or wait.'), 'err'); sfx('err'); showView('Games'); return; }
  audioUnlock();
  $('game').classList.add('on'); $('gOver').classList.remove('on'); $('gHud').innerHTML = '';
  const c = cv(), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  G = {id, ctx, W: innerWidth, H: innerHeight, t: 0, score: 0, shownScore: 0, shake: 0, parts: [], texts: [], over: false, started: false, last: performance.now(), img: svgImg(capySVG(playerCapy().k))};
  ({stack: stackInit, catch: catchInit})[id]();
  const go = () => {
    if(S.tickets < 1) return;
    if(S.tickets >= CONFIG.TICKETS_MAX) S.tkT = now();
    S.tickets--; S.stats.games++; saveNow();
    $('gIntro').classList.remove('on'); G.started = true; G.last = performance.now();
    tutEvent('game');
  };
  if(intro){
    const g = GAMES.find(q => q.id === id);
    $('gIntroBox').innerHTML = '<div style="font-size:56px">' + g.e + '</div><h2 style="margin:6px 0">' + L(g) + '</h2><p style="font-weight:800">' + L(g.d) + '</p>' +
      '<button class="btn wide" id="giGo">▶ ' + tr('Start') + ' · 🎟️ 1</button><button class="btn wide ghost" id="giBack">' + tr('Back') + '</button>';
    $('gIntro').classList.add('on');
    $('giGo').onclick = go; $('giBack').onclick = closeGame;
  } else go();
  requestAnimationFrame(gameLoop);
}
function gameLoop(ts){
  if(!G || G.over) return;
  const dt = Math.min(0.05, (ts - G.last) / 1000); G.last = ts;
  if(G.started){ G.t += dt; G.update(dt); }
  G.shownScore += (G.score - G.shownScore) * Math.min(1, dt * 10);   // score ticks up
  const ctx = G.ctx; ctx.save();
  if(G.shake > 0){ G.shake -= dt; ctx.translate(rnd(-6, 6) * G.shake * 3, rnd(-6, 6) * G.shake * 3); }
  G.draw(ctx);
  G.parts = G.parts.filter(p => (p.life -= dt) > 0);
  G.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
  G.texts = G.texts.filter(q => (q.life -= dt) > 0);
  G.texts.forEach(q => { q.y -= 40 * dt; ctx.globalAlpha = Math.min(1, q.life * 2); ctx.font = '900 ' + (q.size || 24) + 'px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(q.s, q.x, q.y); ctx.fillStyle = q.c || '#4b3527'; ctx.fillText(q.s, q.x, q.y); });
  ctx.globalAlpha = 1; ctx.restore();
  requestAnimationFrame(gameLoop);
}
function burst(x, y, c, n){ for(let i=0;i<(n || 10);i++){ const a = Math.random() * 7, s = rnd(60, 200); G.parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, r: rnd(2, 5), c: c || '#fff', life: 0.7, max: 0.7}); } }
function floatText(x, y, s, c, size){ G.texts.push({x, y, s, c, size, life: 0.9}); }
function hud(html){ if(G._hud === html) return; G._hud = html; $('gHud').innerHTML = html + '<button class="pill" id="gQuit" style="padding:8px 14px">✕</button>'; $('gQuit').onclick = () => G.started ? gameOver(true) : closeGame(); }
function emoji(ctx, e, x, y, size){ ctx.font = size + 'px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y); }
function spaBg(ctx){
  const g = ctx.createLinearGradient(0, 0, 0, G.H); g.addColorStop(0, '#ffe9d4'); g.addColorStop(0.55, '#ffd2b0'); g.addColorStop(0.56, '#e5b27c'); g.addColorStop(1, '#cf9763');
  ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
  ctx.fillStyle = '#d9b39a'; ctx.beginPath(); ctx.moveTo(0, G.H * 0.5); for(let x=0;x<=G.W;x+=G.W/6) ctx.lineTo(x, G.H * (0.42 + ((x / G.W * 6) % 2 ? 0.05 : 0))); ctx.lineTo(G.W, G.H * 0.56); ctx.lineTo(0, G.H * 0.56); ctx.fill();
}
function drawCapy(ctx, x, y, w, face, sx, sy){
  if(!G.img.complete) return;
  ctx.save(); ctx.translate(x, y); ctx.scale((face || 1) * (sx || 1), sy || 1); ctx.drawImage(G.img, -w / 2, -w * 0.7, w, w * 0.7); ctx.restore();
}

/* ---------- FRUIT STACK ---------- */
function stackInit(){
  const fr = FRUIT_IDS.map(k => FRUITS[k].e);
  Object.assign(G, {lives: 3, stack: [], cam: 0, camT: 0, hang: pick(fr), fall: null, R: 22, fr, swingT: 0});
  const cw = Math.min(260, G.W * 0.62);
  G.base = {x: G.W / 2, y: G.H - 70, w: cw};
  // head top of the capybara drawing (in screen space when cam = 0)
  G.headX = G.base.x + cw * 28 / 120; G.headY = G.base.y + 6 - cw * 0.7 * (64 / 84);
  const c = cv();
  c.onpointerdown = () => {
    if(!G.started || G.fall || G.over) return;
    const p = hangPos();
    G.fall = {x: p.x, y: p.y, vy: 0, e: G.hang}; sfx('whoosh');
  };
  const topY = () => G.headY - G.stack.length * G.R * 1.6;               // world y of the top of the stack
  const topX = () => G.stack.length ? G.stack[G.stack.length - 1].x : G.headX;
  function hangPos(){
    const L = 120, amp = Math.min(0.85, 0.5 + G.stack.length * 0.03), a = Math.sin(G.swingT) * amp;
    const ay = topY() - 230 + G.cam;   // the rope hangs well above the stack (screen space)
    return {x: G.W / 2 + Math.sin(a) * L * 1.6, y: ay + Math.cos(a) * L, ax: G.W / 2, ay};
  }
  G.hangPos = hangPos;
  G.update = dt => {
    G.swingT += dt * (CONFIG.STACK_SWING + G.stack.length * 0.1);
    // camera follows the stack up
    G.camT = Math.max(0, (G.H * 0.62) - (topY()));
    G.cam += (G.camT - G.cam) * Math.min(1, dt * 4);
    if(G.fall){
      const f = G.fall; f.vy += 1500 * dt; f.y += f.vy * dt;
      if(!f.miss){
        const ty = topY() - G.R * 0.8 + G.cam;
        if(f.y >= ty){
          const dx = f.x - topX();
          if(Math.abs(dx) < G.R * (G.stack.length ? 1.15 : 1.4)){
            const perfect = Math.abs(dx) < 6;
            G.stack.push({x: perfect ? topX() : f.x, e: f.e, sq: 0.4});
            const v = perfect ? 2 : 1; G.score += v;
            sfx('stack'); if(perfect){ sfx('coin'); floatText(f.x, ty - 30, tr('Perfect!') + ' +2', '#ff6f91', 26); burst(f.x, ty, '#ffd54a', 16); }
            else { floatText(f.x, ty - 30, '+1'); burst(f.x, ty, '#fff', 8); }
            if(G.stack.length % 5 === 0) squeak(1.3);
            G.fall = null; G.hang = pick(G.fr);
          } else { f.miss = true; f.vx = dx > 0 ? 160 : -160; G.lives--; G.shake = 0.3; sfx('err'); floatText(f.x, ty - 30, tr('Oops!'), '#ff5f6f'); }
        }
      } else {
        f.x += f.vx * dt;
        if(f.y > G.H + 60){ G.fall = null; G.hang = pick(G.fr); if(G.lives <= 0) gameOver(); }
      }
    }
    G.stack.forEach(s => { if(s.sq > 0) s.sq -= dt * 2; });
    hud('<span class="pill">🗼 ' + Math.round(G.shownScore) + '</span><span class="pill">' + '❤️'.repeat(Math.max(0, G.lives)) + '🤍'.repeat(Math.max(0, 3 - G.lives)) + '</span>');
  };
  G.draw = ctx => {
    spaBg(ctx);
    ctx.save(); ctx.translate(0, G.cam);
    // the capybara + the stack (wobbles a little as it gets taller)
    drawCapy(ctx, G.base.x, G.base.y + 6, G.base.w, 1, 1, 1);
    const wob = Math.sin(G.t * 2) * Math.min(0.06, G.stack.length * 0.004);
    ctx.save(); ctx.translate(G.headX, G.headY); ctx.rotate(wob); ctx.translate(-G.headX, -G.headY);
    G.stack.forEach((s, i) => { const y = G.headY - i * G.R * 1.6 - G.R * 0.8, sc = 1 + Math.max(0, s.sq) * 0.5; ctx.save(); ctx.translate(s.x, y); ctx.scale(sc, 2 - sc); emoji(ctx, s.e, 0, 0, G.R * 2); ctx.restore(); });
    ctx.restore();
    ctx.restore();
    // the swinging fruit on its rope
    const p = G.hangPos();
    if(!G.fall){
      ctx.strokeStyle = '#8a6040'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.ax, p.ay); ctx.lineTo(p.x, p.y - G.R); ctx.stroke();
      ctx.fillStyle = '#8a6040'; ctx.beginPath(); ctx.arc(p.ax, p.ay, 6, 0, 7); ctx.fill();
      emoji(ctx, G.hang, p.x, p.y, G.R * 2);
      // a dotted guide line down
      ctx.setLineDash([4, 8]); ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x, p.y + G.R); ctx.lineTo(p.x, p.y + 160); ctx.stroke(); ctx.setLineDash([]);
    } else emoji(ctx, G.fall.e, G.fall.x, G.fall.y, G.R * 2);
  };
  hud('<span class="pill">🗼 0</span>');
}

/* ---------- FRUIT CATCH ---------- */
function catchInit(){
  Object.assign(G, {x: G.W / 2, tx: G.W / 2, face: 1, items: [], spawn: 0, lives: 3, pop: 0, speed: CONFIG.CATCH_SPEED});
  const c = cv();
  c.onpointerdown = c.onpointermove = e => { G.tx = e.clientX; };
  const fr = ['🍊', '🍎', '🍓', '🍋', '🍑'];
  G.update = dt => {
    const old = G.x; G.x += (G.tx - G.x) * Math.min(1, dt * 12);
    if(Math.abs(G.x - old) > 0.5) G.face = G.x > old ? 1 : -1;
    G.speed += CONFIG.CATCH_RAMP * dt;
    G.spawn -= dt;
    if(G.spawn <= 0){
      G.spawn = Math.max(0.33, 0.95 - G.t * 0.012);
      const r = Math.random();
      G.items.push({x: rnd(30, G.W - 30), y: -30, k: r < 0.07 ? 'melon' : r < 0.3 + Math.min(0.18, G.t * 0.004) ? 'bee' : 'fruit', e: pick(fr), vy: G.speed * rnd(0.85, 1.2), rot: rnd(-2, 2), wob: rnd(0, 6)});
    }
    const py = G.H - 120;
    G.items = G.items.filter(it => {
      it.y += it.vy * dt; it.rot += dt; if(it.k === 'bee') it.x += Math.sin(G.t * 4 + it.wob) * 60 * dt;
      if(Math.abs(it.y - py) < 36 && Math.abs(it.x - G.x) < 52){
        if(it.k === 'bee'){ G.lives--; G.shake = 0.35; sfx('err'); burst(it.x, it.y, '#ffd23a', 12); floatText(it.x, it.y - 20, '🐝!', '#ff5f6f'); if(G.lives <= 0) setTimeout(() => gameOver(), 300); }
        else { const v = it.k === 'melon' ? 3 : 1; G.score += v; G.pop = 0.18; sfx(it.k === 'melon' ? 'coin' : 'eat'); burst(it.x, it.y, it.k === 'melon' ? '#7fd36a' : '#ffb36b', 10); floatText(it.x, it.y - 20, '+' + v); if(Math.random() < 0.2) squeak(); }
        return false;
      }
      return it.y < G.H + 40;
    });
    if(G.pop > 0) G.pop -= dt;
    hud('<span class="pill">🧺 ' + Math.round(G.shownScore) + '</span><span class="pill">' + '❤️'.repeat(Math.max(0, G.lives)) + '🤍'.repeat(Math.max(0, 3 - G.lives)) + '</span>');
  };
  G.draw = ctx => {
    spaBg(ctx);
    G.items.forEach(it => { ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.k === 'bee' ? Math.sin(G.t * 8) * 0.2 : it.rot * 0.4);
      emoji(ctx, it.k === 'bee' ? '🐝' : it.k === 'melon' ? '🍉' : it.e, 0, 0, it.k === 'melon' ? 46 : 40); ctx.restore(); });
    const s = 1 + (G.pop > 0 ? G.pop * 1.4 : 0);
    drawCapy(ctx, G.x, G.H - 80, 150, G.face, s, 2 - s);
  };
  hud('<span class="pill">🧺 0</span>');
}

/* ---------- game over + prizes ---------- */
function gameOver(quit){
  if(!G || G.over) return;
  G.over = true;
  const id = G.id, sc = G.score, inc = incomeFloor();
  let p = sc * inc * ({stack: 12, catch: 6}[id]), best = false;
  if(sc > (S.stats.best[id] || 0)){ S.stats.best[id] = sc; best = sc > 0; }
  if(quit) p *= 0.5;
  p = Math.round(Math.max(sc > 0 ? 25 : 0, p));
  addCo(p); addXP(Math.min(25, 6 + Math.floor(sc / 2)));
  const fruit = sc >= 6 ? pick(FRUIT_IDS) : null; if(fruit) S.fruit[fruit] += 2;
  const snack = sc >= 12 ? pick(SNACK_IDS) : null; if(snack) S.snacks[snack] += 2;
  saveNow();
  if(best) sfx('win');
  const g = GAMES.find(q => q.id === id);
  $('gOverBox').innerHTML = '<div style="font-size:50px">' + (best ? '🏆' : g.e) + '</div><h2 style="margin:6px 0">' + (best ? tr('New best!') : tr('Nice try!')) + '</h2>' +
    '<div style="font-size:1.4em;font-weight:900">' + g.e + ' ' + sc + ' <span class="muted">· 🏆 ' + S.stats.best[id] + '</span></div>' +
    '<div class="reward"><div class="amt">+' + fmt(p) + ' ' + CN + (fruit ? ' +2 ' + FRUITS[fruit].e : '') + (snack ? ' +2 ' + SNACKS[snack].e : '') + '</div></div>' +
    '<button class="btn wide" id="goAgain"' + (S.tickets < 1 ? ' disabled' : '') + '>🔁 ' + tr('Play again') + ' · 🎟️ ' + S.tickets + '</button>' +
    (S.tickets < 1 ? '<button class="btn wide mint" id="goTk">' + adIcon() + ' +' + CONFIG.AD_TICKETS + ' 🎟️</button>' : '') +
    '<button class="btn wide ghost" id="goBack">' + tr('Back') + '</button>';
  $('gOver').classList.add('on');
  $('goAgain').onclick = () => startGame(id, false);
  if($('goTk')) $('goTk').onclick = async () => { if(await rewardAd()){ S.tickets += CONFIG.AD_TICKETS; saveNow(); startGame(id, false); } };
  $('goBack').onclick = closeGame;
}
function closeGame(){
  G = null; $('game').classList.remove('on'); $('gIntro').classList.remove('on'); $('gOver').classList.remove('on');
  const c = cv(); c.onpointerdown = c.onpointermove = null;
  refreshTop(); if(curView === 'Games') renderGames(); else if(curView === 'Spa') renderSpa();
}

/* =====================================================================
   11. MONEY — rewarded ads (AdMob) + the Spa Pack (Google Play Billing)
   ---------------------------------------------------------------------
   FAKE FOR NOW: in a browser, ads are a 3-second pretend ad, and
   purchases are pretend (a "Demo" box gives you the item).
   Inside the Android app (Capacitor) with the plugins installed, the
   real ones take over automatically:
     • @capacitor-community/admob   → rewarded video ads
     • cordova-plugin-purchase      → Google Play purchases
   BEFORE RELEASE: put your real AdMob rewarded unit ID below,
   set MONEY.TESTING to false, and set MONEY.DEMO_BUY to false.
   Ads are ALWAYS the player's choice. Nothing plays on its own.
===================================================================== */
const MONEY = {
  TESTING: true,
  DEMO_BUY: true,   // browser only: pretend purchases give the item (for testing)
  REWARDED_ID: 'ca-app-pub-3940256099942544/5224354917', // Google's TEST rewarded ID — replace with yours
};
const PACK = {sku: 'spa_pack', price: '$2.99', gems: 60};
const isNative = () => !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const AdMobP = () => isNative() && window.Capacitor.Plugins ? Capacitor.Plugins.AdMob : null;
let adBusy = false;
const adIcon = () => S && S.noAds ? '✨' : '▶️';

/* the one function the game calls. Resolves true if the player earned the reward. */
async function rewardAd(){
  if(S.noAds){ toast('✨ ' + tr('Spa Pack: reward given!'), 'gold'); return true; }
  if(adBusy) return false;
  adBusy = true;
  musicStop(); waterStop();
  let ok = false;
  try{ ok = AdMobP() ? await nativeAd() : await demoAd(); }catch(e){ ok = false; }
  adBusy = false;
  if(S.mus) musicStart(); if(S.snd) waterStart();
  if(!ok) toast(tr('No reward this time'), 'err');
  return ok;
}
function nativeAd(){
  const A = AdMobP();
  return new Promise(async res => {
    let earned = false, finished = false, hs = [];
