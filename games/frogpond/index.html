<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#cfeecb">
<title>Frog Pond</title>
<style>
/* =====================================================================
   FROG POND — styles
   Soft leaf green + pond blue + blossom pink. Change the colors here.
===================================================================== */
:root{
  --leaf:#dcf5cf; --leaf2:#5bbf63; --pink:#ffd9e4; --pink2:#ff8fb1;
  --lav:#e6dcff; --lav2:#a58cff; --lemon:#fff3b8; --lemon2:#ffd34d;
  --sky:#d6efff; --sky2:#4fa9e8; --water:#c4ecef; --water2:#35a9b8;
  --ink:#2c4a3c; --ink2:#5f7d6c; --card:#fffefa; --line:#d6ecd0;
  --gold:#ffc83d; --good:#3fbf8f; --bad:#ff6b81;
  --r:18px; --font:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#eef9ea;color:var(--ink);font-family:var(--font);font-size:calc(15px * var(--fs))}
body.easy{--font:Verdana,"Segoe UI",Tahoma,sans-serif;letter-spacing:.04em;word-spacing:.12em;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font-family:inherit;font-size:16px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* coin icon (drawn with CSS, no image) */
.cn{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:-.13em;position:relative;
  background:radial-gradient(circle at 35% 30%,#fff7c8 0 14%,#ffd84d 34%,#f2b21c 74%,#d58f0e);box-shadow:0 1px 0 #0002,inset 0 0 0 1.5px #fff5}
.cn::after{content:"";position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50% 50% 45% 45%;background:#6fc25a;box-shadow:inset 0 -1px 0 #3f8f3a}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:linear-gradient(#f5fff0,#dbf3d2);border-bottom:2px solid #bfe3b4;z-index:20}
.pill{display:flex;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:5px 10px 5px 7px;font-weight:900;box-shadow:0 2px 0 #bfe0b6;white-space:nowrap;min-width:0;font-size:1em}
.pill .ic{font-size:18px;line-height:1}
.pill .cn{width:18px;height:18px}
.pill.lv{flex:1;max-width:200px;min-width:70px}
.xpbar{flex:1;height:9px;background:#e6f3e2;border-radius:9px;overflow:hidden;min-width:30px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf2),var(--pink2));border-radius:9px;transition:width .4s}
#boosts{display:flex;gap:3px;overflow:hidden;flex-wrap:nowrap}
.bst{font-size:11px;font-weight:900;background:var(--lemon);border-radius:99px;padding:3px 7px;white-space:nowrap}
.roundBtn{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 0 #bfe0b6;display:grid;place-items:center;flex:none;font-size:20px;overflow:hidden}
#muteBtn{margin-left:auto}
#profBtn svg{width:38px;height:32px}
@media (max-width:420px){#boosts .bst:nth-child(n+3){display:none}.pill{padding:4px 8px 4px 5px}}
/* ---------- body / nav ---------- */
#body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#main{flex:1;position:relative;min-width:0;overflow:hidden}
#nav{display:flex;justify-content:space-around;background:#fff;border-top:2px solid #bfe3b4;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:14px;font-size:12px;font-weight:900;color:var(--ink2);position:relative;min-height:54px}
#nav button .e{font-size:25px;line-height:1.1}
#nav button.on{background:var(--leaf);color:var(--ink)}
.dot{position:absolute;top:3px;right:24%;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid #fff;display:none}
.dot.show{display:block}
@media (min-width:820px){
  #body{flex-direction:row-reverse}
  #nav{flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:2px solid #bfe3b4;padding:10px 8px;width:96px}
  #nav button{flex:none;padding:10px 0}
  .view .inner{max-width:760px;margin:0 auto}
}
/* ---------- views ---------- */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding:12px 12px 30px;-webkit-overflow-scrolling:touch;background:#f1faee}
.view.on{display:block}
#vPond{padding:0;overflow:hidden;background:#9fd8e0}
h2{margin:4px 0 10px;font-size:1.35em}
h3{margin:14px 0 8px;font-size:1.08em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:9px 14px;border-radius:99px;background:#fff;font-weight:900;box-shadow:0 2px 0 var(--line)}
.tabs button.on{background:var(--pink);box-shadow:0 2px 0 #f5b8c9}
.card{background:var(--card);border-radius:var(--r);padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:8px;box-shadow:0 3px 0 var(--line);position:relative}
.card .art{width:62px;height:62px;flex:none;border-radius:14px;background:var(--leaf);display:grid;place-items:center;font-size:32px;overflow:hidden}
.card .art svg{width:58px;height:46px}
.card .info{flex:1;min-width:0}
.nm{font-weight:900}
.sub{font-size:.86em;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{background:var(--card);border-radius:16px;padding:8px 4px 6px;text-align:center;box-shadow:0 3px 0 var(--line);position:relative;font-size:.84em;font-weight:900}
.tile svg{width:80px;height:64px;display:block;margin:0 auto}
.tile.lock{background:#eef4ec}
.tile.lock svg{filter:brightness(0) opacity(.18)}
.btn{background:var(--pink2);color:#fff;font-weight:900;padding:10px 15px;border-radius:14px;box-shadow:0 3px 0 #dd6f92;white-space:nowrap;min-height:42px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #dd6f92}
.btn.mint{background:var(--leaf2);box-shadow:0 3px 0 #3c9446}
.btn.lav{background:var(--lav2);box-shadow:0 3px 0 #7c62dd}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 3px 0 #d79d12}
.btn.sky{background:var(--sky2);box-shadow:0 3px 0 #3f8ad6}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.wide{display:block;width:100%;margin-top:8px;padding:13px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.btn.sm{padding:7px 11px;font-size:.88em;min-height:38px}
.tag{display:inline-block;font-size:.74em;font-weight:900;padding:2px 7px;border-radius:99px;background:var(--lemon);vertical-align:middle}
.r0{background:#eaf2e8}.r1{background:#d6ecff}.r2{background:linear-gradient(90deg,#ffe1ec,#dcf7ff)}.r3{background:linear-gradient(90deg,#fff3b0,#ffd9a8)}.r4{background:linear-gradient(90deg,#ffe4f1,#e7dcff)}
.bar{height:11px;border-radius:9px;background:#e6f2e2;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:9px}
.mood{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:.92em;font-weight:900}
.mood span{width:26px;text-align:center}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--ink2);font-size:.86em}
.center{text-align:center}
.hearts{letter-spacing:-1px}
.swatch{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-3px;border:2px solid #fff;box-shadow:0 1px 0 #0002}
.seg{display:flex;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.seg button{flex:1;padding:9px 6px;font-weight:900}
.seg button.on{background:var(--leaf)}
/* ---------- pond scene ---------- */
#scene{position:absolute;inset:0;overflow:hidden;touch-action:none;z-index:0}
#sceneBg{position:absolute;inset:0;width:100%;height:100%}
#sky,#props,#glowL,#wx{position:absolute;inset:0;pointer-events:none}
.sun{position:absolute;border-radius:50%;background:radial-gradient(circle,#fffbe0 0 40%,#ffe27a 62%,#ffd34d);box-shadow:0 0 30px 12px #fff3a888;transform:translate(-50%,-50%)}
.moon{position:absolute;border-radius:50%;background:#fff8dc;box-shadow:0 0 26px 8px #fff8dc66;transform:translate(-50%,-50%);overflow:hidden}
.moon i{position:absolute;inset:0;border-radius:50%;background:#2a3170}
.moon.full{box-shadow:0 0 40px 18px #fff6c888}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.cloud{position:absolute;height:22px;border-radius:22px;background:#ffffffd8;animation:cloud linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:30px;height:30px;left:12px;top:-14px}.cloud::after{width:22px;height:22px;left:34px;top:-9px}
@keyframes cloud{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
.prop{position:absolute;transform:translate(-50%,-100%)}
.prop svg{width:100%;height:100%;display:block;overflow:visible}
.pad{position:absolute;transform:translate(-50%,-50%);animation:padbob 5s ease-in-out infinite alternate}
.pad svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes padbob{from{margin-top:-1px}to{margin-top:2px}}
.prop.glowp svg{filter:drop-shadow(0 0 4px var(--gc)) drop-shadow(0 0 10px var(--gc))}
.halo{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,var(--gc) 0,transparent 68%);opacity:.35;mix-blend-mode:screen;animation:halo 3s ease-in-out infinite alternate}
@keyframes halo{from{opacity:.25}to{opacity:.45}}
.speck{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gc);box-shadow:0 0 8px var(--gc);animation:speck 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes speck{from{transform:translate(0,0);opacity:.2}to{transform:translate(14px,-30px);opacity:.9}}
.petal{position:absolute;top:-20px;font-size:14px;pointer-events:none;animation:petal linear infinite}
@keyframes petal{to{transform:translate(40px,110vh) rotate(360deg)}}
.moonRef{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,#fff8dcdd 0,#fff8dc55 45%,transparent 70%);animation:shim 2.4s ease-in-out infinite alternate}
@keyframes shim{from{transform:translate(-50%,-50%) scaleX(1)}to{transform:translate(-50%,-50%) scaleX(1.25)}}
#dark{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,#1d2a5a,#0b1030);opacity:0;transition:opacity 1.2s}
#frogs,#fxL,#bugs{position:absolute;inset:0}
#bugs{z-index:8;pointer-events:none}
#fxL{pointer-events:none;z-index:9}
.frog{position:absolute;will-change:left,top;touch-action:none;z-index:3}
.frog .bob{width:100%;height:100%;transform-origin:50% 90%;animation:sitA 3.2s ease-in-out infinite}
.frog svg{width:100%;height:100%;overflow:visible;display:block}
.frog.nap .bob,.frog.sun .bob{animation:breathe 3.8s ease-in-out infinite}
.frog.pop .bob{animation:pop .4s ease}
.frog.air .bob{animation:none;transform:scale(.92,1.1)}
.frog.swim .bob{animation:swimA 1s ease-in-out infinite;clip-path:inset(0 0 46% 0);transform:translateY(32%)}
.frog.swim::after{content:"";position:absolute;left:8%;right:8%;bottom:4%;height:18%;border-radius:50%;border:2px solid #ffffffaa;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.25);opacity:0}}
.frog.tad .bob{animation:wig .5s ease-in-out infinite alternate;transform-origin:30% 50%}
.frog.tad::after{display:none}
@keyframes wig{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.frog .sac{transform-box:fill-box;transform-origin:50% 0;transform:scale(.3);opacity:0;transition:transform .2s,opacity .2s}
.frog.sing .sac{opacity:1;animation:sac .45s ease-in-out infinite alternate}
@keyframes sac{from{transform:scale(.5)}to{transform:scale(1.15)}}
.frog .tongue{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0)}
.frog.lick .tongue{animation:tongue .45s ease-out}
@keyframes tongue{0%{transform:scaleY(0);opacity:1}35%{transform:scaleY(1);opacity:1}99%{transform:scaleY(0);opacity:1}100%{opacity:0}}
.frog .zz{position:absolute;top:-6px;right:6px;font-size:15px;font-weight:900;color:#6a5ac9;animation:zz 2s infinite}
.frog .bub{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:17px;background:#fff;border-radius:12px;padding:0 5px;box-shadow:0 2px 0 #0002;white-space:nowrap}
.frog.sel::before{content:"";position:absolute;left:12%;right:12%;bottom:-4px;height:9px;border-radius:50%;background:#fff9;box-shadow:0 0 12px #fff}
.frog.visitor .bob{filter:drop-shadow(0 0 6px #fff)}
.frog .bob svg{filter:brightness(var(--dim,1))}
.glowOn .frog.glowy .bob svg{filter:drop-shadow(0 0 7px var(--gc)) drop-shadow(0 0 14px var(--gc))}
@keyframes sitA{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.975)}}
@keyframes swimA{0%,100%{transform:translateY(32%) rotate(-3deg)}50%{transform:translateY(36%) rotate(3deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.95)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.2,.82)}70%{transform:scale(.92,1.12)}100%{transform:scale(1)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
.fx{position:absolute;pointer-events:none;font-size:21px;font-weight:900;z-index:9;animation:fxup 1.1s ease-out forwards;white-space:nowrap;text-shadow:0 2px 0 #fff}
@keyframes fxup{from{opacity:1;transform:translate(-50%,0) scale(.7)}30%{transform:translate(-50%,-14px) scale(1.15)}to{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.note{position:absolute;pointer-events:none;font-size:20px;font-weight:900;color:#5b4fd0;z-index:9;animation:noteUp 1.6s ease-out forwards;text-shadow:0 1px 0 #fff}
@keyframes noteUp{from{opacity:1;transform:translate(-50%,0) rotate(-10deg)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),-60px) rotate(12deg)}}
.rip{position:absolute;border-radius:50%;border:2px solid #ffffffb0;transform:translate(-50%,-50%);pointer-events:none;animation:rip 1.4s ease-out forwards}
@keyframes rip{from{width:8px;height:3px;opacity:1}to{width:60px;height:18px;opacity:0}}
/* bugs: fireflies (tap them!) + dragonflies */
.ffly{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;display:grid;place-items:center;pointer-events:auto;transition:left 3s ease-in-out,top 3s ease-in-out}
.ffly i{width:13px;height:13px;border-radius:50%;background:#fff6a0;box-shadow:0 0 8px 4px #ffe95add,0 0 26px 12px #ffd84d77;animation:blink 1.4s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
.dfly{position:absolute;width:46px;height:30px;pointer-events:none;animation:dfly linear forwards}
.dfly svg{width:100%;height:100%;overflow:visible}
.dfly .w{animation:flap .08s linear infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
@keyframes dfly{0%{transform:translate(0,0)}25%{transform:translate(calc(var(--dx) * .25),-18px)}50%{transform:translate(calc(var(--dx) * .5),10px)}75%{transform:translate(calc(var(--dx) * .75),-12px)}100%{transform:translate(var(--dx),0)}}
/* weather */
.drop{position:absolute;top:-30px;width:2px;height:22px;background:linear-gradient(transparent,#e8f6ffcc);border-radius:2px;animation:drop linear infinite}
@keyframes drop{to{transform:translate(-30px,110vh)}}
.fog{position:absolute;left:-30%;width:160%;height:30%;background:radial-gradient(ellipse,#ffffffee 0,#ffffff88 40%,transparent 70%);animation:fog ease-in-out infinite alternate;pointer-events:none}
@keyframes fog{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
#flash.on{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.75}20%{opacity:.1}35%{opacity:.6}100%{opacity:0}}
#choirBanner{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#e6dcff,#ffd9e4);border-radius:99px;padding:5px 14px;font-weight:900;z-index:10;display:none;box-shadow:0 3px 0 #0002;white-space:nowrap}
#choirBanner.on{display:block;animation:cpulse 1.2s ease-in-out infinite alternate}
@keyframes cpulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.06)}}
#areaName{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fffd;border-radius:99px;padding:3px 6px;font-weight:900;z-index:10;white-space:nowrap;display:flex;gap:4px;align-items:center;box-shadow:0 2px 0 #0001}
#areaName button{font-size:20px;width:38px;height:38px;border-radius:50%}
#areaName button[disabled]{opacity:.25}
#eggs{position:absolute;top:58px;left:8px;display:flex;flex-direction:column;gap:7px;z-index:10}
.eggslot{width:58px;height:66px;background:#fffd;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:900;position:relative;box-shadow:0 3px 0 #0002}
.eggslot svg{width:40px;height:40px}
.eggslot.ready{animation:wob .6s ease-in-out infinite alternate;background:var(--lemon)}
@keyframes wob{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.eggslot .pb{position:absolute;bottom:4px;left:6px;right:6px;height:5px;background:#e8eef0;border-radius:4px;overflow:hidden}
.eggslot .pb i{display:block;height:100%;background:var(--leaf2)}
#sideR{position:absolute;top:58px;right:8px;display:flex;flex-direction:column;gap:9px;z-index:10}
.fab{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #0002;font-size:26px;display:grid;place-items:center;position:relative}
.fab small{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;background:#fff;border-radius:6px;padding:0 4px;white-space:nowrap}
.fab .bdg{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;font-size:11px;font-weight:900;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 4px}
.fab.off{opacity:.55}
.fab.glow{animation:wob .6s ease-in-out infinite alternate}
#careBar{position:absolute;left:8px;right:8px;bottom:10px;z-index:10;display:flex;justify-content:center}
#careBar .cb{background:#fffe;border-radius:20px;padding:8px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 #0002;max-width:520px;width:100%}
#careBar .cb .who{flex:1;min-width:0;font-weight:900;line-height:1.2}
#careBar .cb .who small{display:block;font-weight:700;color:var(--ink2);font-size:.8em}
#careBar .cbtn{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:900;background:var(--leaf);border-radius:14px;padding:5px 6px;min-width:56px;min-height:52px;justify-content:center}
#careBar .cbtn b{font-size:22px;line-height:1}
#careBar .hint{background:#fffd;border-radius:99px;padding:8px 14px;font-weight:900;box-shadow:0 3px 0 #0002;text-align:center}
/* ---------- modal ---------- */
#modalBg{position:fixed;inset:0;background:#1d3a2a66;display:none;z-index:50;align-items:center;justify-content:center;padding:14px}
#modalBg.on{display:flex}
#modal{background:#fff;border-radius:24px;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;padding:16px;box-shadow:0 10px 40px #0003;animation:mIn .25s ease;position:relative}
@keyframes mIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#modal h2{text-align:center;margin-top:0;padding:0 30px}
#mClose{position:absolute;top:8px;right:10px;font-size:22px;width:40px;height:40px;border-radius:50%;background:#eef7ec}
.reward{text-align:center}
.reward .big{font-size:60px;line-height:1.1}
.reward .big svg{width:170px;height:136px}
.reward .amt{font-size:1.5em;font-weight:900;margin:6px 0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.tst{background:#fff;border-radius:14px;padding:10px 15px;font-weight:900;box-shadow:0 4px 14px #0002;animation:tIn .3s ease;max-width:100%;text-align:center}
.tst.gold{background:var(--lemon)}.tst.err{background:#ffe0e5}
@keyframes tIn{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.pickGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:44vh;overflow-y:auto;padding:2px}
.pickGrid button{background:#f2fbef;border-radius:14px;padding:4px;font-weight:900;font-size:.8em;border:3px solid transparent}
.pickGrid button svg{width:76px;height:60px;display:block;margin:0 auto}
.pickGrid button.on{border-color:var(--pink2);background:var(--pink)}
.pickGrid button[disabled]{opacity:.35}
/* ---------- mini games ---------- */
#game{position:fixed;inset:0;z-index:60;background:#9fd8e0;display:none;touch-action:none}
#game.on{display:block}
#gCanvas{position:absolute;inset:0;width:100%;height:100%}
#gHud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:2;font-weight:900;font-size:1.1em;gap:6px}
#gOver,#gIntro{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#1d3a2a55;z-index:3;padding:16px}
#gOver.on,#gIntro.on{display:flex}
#gOver .box,#gIntro .box{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:360px;text-align:center}
/* ---------- loading ---------- */
#load{position:fixed;inset:0;z-index:100;background:linear-gradient(#dff5d6,#ffe3ec);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .6s}
#load .logo{font-size:2.4em;font-weight:900;color:#4fae5a;text-shadow:0 3px 0 #fff;text-align:center;line-height:1.05}
#load .wd{width:150px;height:120px;animation:hopL 1.1s ease-in-out infinite}
#load .wd svg{width:100%;height:100%}
@keyframes hopL{0%,100%{transform:translateY(0) scale(1.05,.95)}45%{transform:translateY(-22px) scale(.95,1.06)}}
#load .tip{max-width:300px;text-align:center;font-weight:800;color:var(--ink2);padding:0 20px}
#load .lbar{width:200px;height:11px;background:#fff;border-radius:9px;overflow:hidden}
#load .lbar i{display:block;height:100%;width:0;background:var(--leaf2);transition:width .3s}
/* ---------- tutorial ---------- */
#tut{position:fixed;left:8px;right:8px;z-index:45;display:none;pointer-events:none}
#tut.on{display:flex;justify-content:center}
#tut .box{pointer-events:auto;background:#fff;border-radius:20px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px #0003;max-width:460px;width:100%;border:3px solid var(--lemon2)}
#tut #tutCap svg{width:60px;height:48px;flex:none}
#tut .tx{flex:1;font-weight:900;font-size:.95em}
.hl{outline:4px solid var(--lemon2)!important;outline-offset:2px;animation:hlp 1s infinite alternate;z-index:44}
@keyframes hlp{from{outline-color:var(--lemon2)}to{outline-color:var(--pink2)}}
</style>
</head>

     1. CONFIG        ← all the tuning numbers. Change feel here.

     8. POND VIEW     ← frogs hop, swim, sing, nap; fireflies; weather

const $ = id => document.getElementById(id);
const now = () => Date.now();
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CN = '<i class="cn"></i>';
function weighted(odds){ let s = odds.reduce((a, b) => a + b, 0), r = Math.random() * s; for(let i=0;i<odds.length;i++){ r -= odds[i]; if(r < 0) return i; } return odds.length - 1; }
function fmt(n){
  n = Math.floor(n || 0); if(n < 1000) return String(n);
  const u = ['K','M','B','T','Qa','Qi','Sx','Sp']; let i = -1;
  while(n >= 1000 && i < u.length - 1){ n /= 1000; i++; }
  return (n >= 100 ? Math.floor(n) : n >= 10 ? (Math.floor(n * 10) / 10) : (Math.floor(n * 100) / 100)) + u[i];
}
function fmtTime(sec){
  sec = Math.max(0, Math.ceil(sec));
  if(sec < 60) return sec + 's';
  const m = Math.floor(sec / 60), s = sec % 60;
  if(m < 60) return m + 'm' + (s ? ' ' + s + 's' : '');
  const h = Math.floor(m / 60); if(h < 48) return h + 'h ' + (m % 60) + 'm';
  return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}
function dayNum(t){ const d = new Date(t); return Math.floor((t - d.getTimezoneOffset() * 60000) / 86400000); }

/* ---------- time of day, moon, weather, seasons ----------
   For testing in a browser you can add ?night=1 or ?night=0, ?wx=rain|fog|storm|sun, ?moon=1 to the address. */
const DBG = (() => { try{ return new URLSearchParams(location.search); }catch(e){ return new Map(); } })();
function hourOf(t){ const d = new Date(t || now()); return d.getHours() + d.getMinutes() / 60; }
function isNight(t){
  if(DBG.get('night') === '1') return true; if(DBG.get('night') === '0') return false;
  const h = hourOf(t); return h >= CONFIG.NIGHT_START || h < CONFIG.NIGHT_END;
}
const nightId = t => dayNum((t || now()) - 12 * 3600000);   // one id for a whole night (8 pm to 6 am)
/* moon: 0 = new moon, 0.5 = full moon (real sky) */
function moonPhase(t){ const days = (t || now()) / 86400000 - 10962.76; return ((days / 29.530588853) % 1 + 1) % 1; }
function isFullMoon(t){ if(DBG.get('moon') === '1') return true; return Math.abs(moonPhase(t) - 0.5) < 0.034; }
function hash32(n){ n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }
function wxAt(t){
  const f = DBG.get('wx'); if(f && WEATHER[f]) return f;
  const block = Math.floor((t || now()) / (CONFIG.WEATHER_HOURS * 3600000));
  const r = hash32(block * 7919 + 13), O = CONFIG.WEATHER_ODDS, tot = O.sun + O.rain + O.fog + O.storm;
  let x = r * tot;
  for(const k of ['sun', 'rain', 'fog', 'storm']){ x -= O[k]; if(x < 0) return k; }
  return 'sun';
}
const wxEndsAt = t => (Math.floor((t || now()) / (CONFIG.WEATHER_HOURS * 3600000)) + 1) * CONFIG.WEATHER_HOURS * 3600000;
function seasonOf(t){ const m = new Date(t || now()).getMonth(); return m === 11 || m <= 1 ? 'winter' : m <= 4 ? 'spring' : m <= 7 ? 'summer' : 'autumn'; }

const MOOD_RATE = () => 100 / (CONFIG.MOOD_EMPTY_HOURS * 3600);
const frogById = id => S.frogs.find(x => x.id === id);
const frogsIn = a => S.frogs.filter(x => x.a === a);
const isAdult = x => x.grow >= CONFIG.GROW_SEC;
const isTad = x => x.grow < CONFIG.GROW_SEC * CONFIG.TAD_PART;
const stageOf = x => isAdult(x) ? 2 : isTad(x) ? 0 : 1;   // 0 tadpole, 1 baby frog, 2 grown-up
const moodAvg = x => (x.m.food + x.m.fun) / 2;
const tierOf = a => AREA_IDS.indexOf(a);
const roomIn = a => CONFIG.ROOM_START + CONFIG.ROOM_PER_PAD * (S.ar[a] ? S.ar[a].pads : 0);
const padCount = a => Math.min(PADS.length, roomIn(a) + 2);
const hasRoom = a => frogsIn(a).length < roomIn(a);
const decorCount = a => S.ar[a] ? Object.keys(S.ar[a].decor).length : 0;
const lightOf = a => S.ar[a] ? DECOR_IDS.filter(k => DECOR[k].glow && S.ar[a].decor[k]).length : 0;
function caveDark(a){ return AREA(a).cave ? Math.max(0.1, CONFIG.CAVE_DARK - CONFIG.GLOW_LIGHT * lightOf(a)) : 0; }
function caveFactor(a){ return AREA(a).cave ? 1 - CONFIG.CAVE_DARK_PENALTY * (1 - lightOf(a) / 3) : 1; }
function areaMult(a){ return Math.pow(CONFIG.AREA_MULT, tierOf(a)) * (1 + CONFIG.DECOR_BONUS * decorCount(a)) * caveFactor(a); }
function hearts(x){ let h = 0; CONFIG.FRIEND_LEVELS.forEach(v => { if(x.f >= v) h++; }); return h; }
function nextHeartAt(x){ return CONFIG.FRIEND_LEVELS.find(v => v > x.f); }
const fireflyCount = t => (isNight(t) && S.ff.id === nightId(t)) ? S.ff.n : 0;
const wxMult = (t, a) => (!AREA(a).cave && wxAt(t) === 'rain') ? CONFIG.RAIN_BONUS : 1;
const choirOn = (a, t) => S.choirUntil > (t || now()) && S.choirArea === a;
function globalMult(t){ return (1 + CONFIG.BUG_UP_BONUS * S.up.bugs) * (S.ad2x > (t || now()) ? 2 : 1) * (1 + CONFIG.FIREFLY_LIGHT * fireflyCount(t)); }
function nightMult(x, t){ const F = FROGS[x.sp]; if(!F.w || !F.w.night) return 1; return isNight(t) ? CONFIG.NIGHT_FROG_BONUS : CONFIG.NIGHT_FROG_DAY; }
function frogRate(x, t){
  const F = FROGS[x.sp] || FROGS.green, h = hearts(x), st = stageOf(x);
  const mood = CONFIG.SAD_MIN + (1 - CONFIG.SAD_MIN) * moodAvg(x) / 100;
  const friend = 1 + h * (CONFIG.FRIEND_BONUS + (x.t === 'shy' ? 0.03 : 0));
  const stage = st === 2 ? 1 : st === 1 ? CONFIG.BABY_EARN : CONFIG.TAD_EARN;
  const choir = choirOn(x.a, t) ? CONFIG.CHOIR_BONUS + (x.t === 'singer' ? 0.1 : 0) : 1;
  return CONFIG.BASE_RATE * CONFIG.RARITY_MULT[F.r] * areaMult(x.a) * stage * mood * friend * (x.t === 'hungry' ? 1.2 : 1) * nightMult(x, t) * wxMult(t, x.a) * choir * globalMult(t);
}
function incomePerSec(){ return S.frogs.reduce((s, x) => s + frogRate(x), 0); }
function areaIncome(a){ return frogsIn(a).reduce((s, x) => s + frogRate(x), 0); }

      opens.map(a => '<br>🔓 ' + a.e + ' ' + L(a) + ' ' + tr('can be opened in the Shop!')).join('')));

}

/* ---------- visitors (rare frogs come out at night!) ---------- */
/* can this kind of frog visit right now, in this area? */
function canVisit(k, area, t, ignoreTime){
  const F = FROGS[k], w = F.w; if(!w || F.paid) return false;
  const A = AREA(area), night = isNight(t), wx = A.cave ? 'none' : wxAt(t);
  if(A.cave && w.area !== 'cave') return false;
  if(w.area && w.area !== area) return false;
  if(w.lit && lightOf(area) < w.lit) return false;
  if(w.season && seasonOf(t) !== w.season) return false;
  if(w.month !== undefined && new Date(t).getMonth() !== w.month) return false;
  if(ignoreTime) return true;
  if(w.night && !night) return false;
  if(w.day && night) return false;
  if(w.full && !isFullMoon(t)) return false;
  if(w.wx && wx !== w.wx && !(w.wx === 'fog' && A.fog)) return false;
  return true;
}
function rollVisitorKind(kind, area){
  const t = now();
  const ok = FROG_IDS.filter(k => canVisit(k, area, t));
  // special guests first: they only come at special times, so give them a real chance
  const special = ok.filter(k => FROGS[k].r === 3);
  if(special.length && Math.random() < (kind === 'rare' ? 0.6 : kind === 'daily' ? 0.25 : 0.12)) return pick(special);
  const odds = kind === 'rare' ? [0, 40, 60] : kind === 'daily' ? [45, 40, 15] : isNight(t) ? [40, 38, 22] : [68, 26, 6];
  for(let tries = 0; tries < 6; tries++){
    const r = weighted(odds), pool = ok.filter(k => FROGS[k].r === r);
    if(pool.length) return pick(pool);
  }
  const any = ok.filter(k => FROGS[k].r <= 2);
  return any.length ? pick(any) : (AREA(area).cave ? 'toad' : 'green');
}
function spawnVisitor(kind){
  const a = S.cur, sp = rollVisitorKind(kind, a);
  const cost = kind === 'random' ? Math.round(Math.max(250, incomeFloor() * 150) * (1 + FROGS[sp].r)) : 0;
  S.visitor = {sp, t: pick(PERS_IDS), s: pick(SPOT_IDS), a, kind, cost, n: randName(), until: now() + (kind === 'random' ? CONFIG.VISITOR_STAY_MIN : 30) * 60000};
  sfx('chime'); renderPond(); saveNow();
  toast('👋 ' + tr('A frog is visiting your pond!'), 'gold');
}
function nextVisitorAt(){ const r = isNight() ? CONFIG.VISITOR_NIGHT_MIN : CONFIG.VISITOR_MIN; return now() + rnd(r[0], r[1]) * 60000; }
function adoptVisitor(){
  const v = S.visitor; if(!v) return;
  const area = hasRoom(v.a) ? v.a : S.open.find(a => hasRoom(a));
  if(!area){ toast('🍃 ' + tr('No room! Buy more lily pads in the Shop.'), 'err'); return; }
  if(v.cost && !pay('c', v.cost)) return;
  const x = makeFrog({sp: v.sp, t: v.t, s: v.s, a: area, adult: true, n: v.n});
  S.visitor = null; S.visitorAt = nextVisitorAt();
  addXP(10); sfx('hatch'); saveNow(); renderPond();
  toast('💚 ' + esc(x.n) + ' ' + tr('lives in your pond now!'), 'gold');
}

function choirReady(){ return now() >= (S.choirCd || 0); }
function singerCount(a){ return frogsIn(a).filter(x => stageOf(x) > 0).reduce((s, x) => s + (x.t === 'singer' ? 2 : 1), 0); }

   7. SOUND — croaks, crickets, rain and soft nature music (WebAudio, no files)
===================================================================== */
let AC = null, musGain = null, sfxGain = null, musTimer = null, musKey = null, musStep = 0, rainNode = null;
function audio(){
  if(AC) return AC;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    sfxGain = AC.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(AC.destination);
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.connect(AC.destination);
    musGain = AC.createGain(); musGain.gain.value = 0.15; musGain.connect(lp);
  }catch(e){ AC = null; }
  return AC;
}
function tone(f, dur, type, vol, when, dest, slide){
  const A = audio(); if(!A) return;
  const t = (when || A.currentTime);
  const o = A.createOscillator(), g = A.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || sfxGain); o.start(t); o.stop(t + dur + 0.05);
}
/* a soft "ribbit": two little low croaks */
function croak(p, dest, vol){
  const A = audio(); if(!A) return;
  const t = A.currentTime + 0.01, f = 150 * (p || 1);
  [0, 0.13].forEach((d, i) => {
    const o = A.createOscillator(), g = A.createGain(), lp = A.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(f * (i ? 1.12 : 1), t + d); o.frequency.exponentialRampToValueAtTime(f * 0.78, t + d + 0.1);
    lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 6;
    g.gain.setValueAtTime(0.0001, t + d); g.gain.exponentialRampToValueAtTime(vol || 0.22, t + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.11);
    o.connect(lp); lp.connect(g); g.connect(dest || sfxGain); o.start(t + d); o.stop(t + d + 0.14);
  });
}
function cricket(dest){ const A = audio(); if(!A) return; const t = A.currentTime + 0.02, f = rnd(4000, 4600); for(let i=0;i<3;i++) tone(f, 0.03, 'sine', 0.035, t + i * 0.05, dest); }
function sfx(k){
  if(!S || !S.snd || !audio()) return;
  const t = AC.currentTime;
  switch(k){
    case 'tap': tone(700, 0.05, 'triangle', 0.12); break;
    case 'croak': croak(rnd(0.9, 1.25)); break;
    case 'pop': tone(500, 0.08, 'sine', 0.2, t, null, 1100); break;
    case 'splash': tone(900, 0.12, 'sine', 0.12, t, null, 300); tone(1400, 0.08, 'sine', 0.08, t + 0.04, null, 500); break;
    case 'boing': tone(260, 0.2, 'sine', 0.22, t, null, 720); break;
    case 'eat': tone(1200, 0.06, 'triangle', 0.14, t, null, 400); tone(300, 0.08, 'triangle', 0.16, t + 0.08, null, 200); break;
    case 'coin': tone(1400, 0.07, 'sine', 0.18); tone(2100, 0.12, 'sine', 0.14, t + 0.06); break;
    case 'ffly': tone(1760, 0.15, 'sine', 0.12); tone(2637, 0.25, 'sine', 0.1, t + 0.08); break;
    case 'err': tone(240, 0.14, 'triangle', 0.15); tone(190, 0.18, 'triangle', 0.15, t + 0.1); break;
    case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.22, t + i * 0.09)); break;
    case 'hatch': [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.16, 'sine', 0.2, t + i * 0.07)); break;
    case 'new': [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, 0.3, 'triangle', 0.18, t + i * 0.1)); break;
    case 'chime': tone(1319, 0.4, 'sine', 0.14); tone(1760, 0.5, 'sine', 0.1, t + 0.12); break;
    case 'win': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.15, t + i * 0.1)); break;

/* soft generative music: each area has its own scale; nights are slower with crickets */
function musicStart(){
  if(!S || !S.mus || !audio()){ musicStop(); return; }
  const night = isNight(), key = S.cur + night;
  if(musTimer && musKey === key) return;
  musicStop();
  musKey = key;
  const A = AREA(S.cur) || AREAS[0];
  const [scale, bpm0, wave] = A.music, bpm = night ? bpm0 * 0.8 : bpm0;
  const step = 60 / bpm / 2;
  const root = 262 * Math.pow(2, (AREAS.indexOf(A) * -2 - (night ? 3 : 0)) / 12);
  const prog = [0, 3, 4, 2];
  musStep = 0;
  musTimer = setInterval(() => {
    if(!AC || AC.state !== 'running') return;
    const t = AC.currentTime + 0.05;
    const bar = Math.floor(musStep / 8) % 4, beat = musStep % 8, chord = prog[bar];
    if(beat === 0) [0, 2, 4].forEach(o => tone(root / 2 * Math.pow(2, scale[(chord + o) % scale.length] / 12), step * 7.5, 'sine', 0.2, t, musGain));
    if(Math.random() < (night ? 0.4 : 0.55)){
      const deg = chord + [0, 2, 4, 2, 1, 3, 4, 2][beat];
      const f = root * Math.pow(2, (scale[deg % scale.length] + 12 * Math.floor(deg / scale.length)) / 12);
      tone(f, step * 2.2, night ? 'sine' : wave, 0.28, t, musGain);
    }
    if(night && Math.random() < 0.3) cricket(musGain);
    if(Math.random() < 0.035) croak(rnd(0.8, 1.3), musGain, 0.25);
    musStep++;
  }, step * 1000);
}
function musicStop(){ if(musTimer) clearInterval(musTimer); musTimer = null; musKey = null; }
/* gentle rain sound */
function rainSound(on){
  if(on && S && S.snd && audio() && AC.state === 'running'){
    if(rainNode) return;
    const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;
    const g = AC.createGain(); g.gain.value = 0.035;
    src.connect(lp); lp.connect(g); g.connect(AC.destination); src.start();
    rainNode = {src, g};
  } else if(!on && rainNode){ try{ rainNode.src.stop(); }catch(e){} rainNode = null; }
}
function audioUnlock(){ const A = audio(); if(A && A.state === 'suspended') A.resume(); musicStart(); }

/* ---------- frogs ---------- */
function frogKey(x, a){ return [x.sp, stageOf(x), a.st === 'nap' ? 1 : a.st === 'sun' ? 2 : 0].join('|'); }
function sceneList(){

}
function usedPads(except){ const u = new Set(); for(const id in actors){ const a = actors[id]; if(a !== except && a.pad !== null && a.pad !== undefined) u.add(a.pad); } return u; }
function freePad(except){ const u = usedPads(except), n = padCount(S.cur), free = []; for(let i=0;i<n;i++) if(!u.has(i)) free.push(i); return free.length ? pick(free) : null; }
function padPos(i){ return {x: PADS[i][0] + rnd(-1.5, 1.5), y: PADS[i][1] + 1}; }
function spotPos(x){ const sp = SPOTS[x.s] || SPOTS.rock; return {x: sp.x + rnd(-2.5, 2.5), y: sp.y - sp.up}; }

function placeActor(a){

/* start a hop to (x1,y1). then = what to do on landing */
function startHop(a, x1, y1, then){
  const d = Math.hypot(x1 - a.x, y1 - a.y);
  a.hop = {x0: a.x, y0: a.y, x1, y1, t: 0, dur: 0.45 + d * 0.012, hgt: 6 + d * 0.25, then: then || 'sit'};
  a.st = 'hop'; a.until = now() + 30000;
}
/* what does a frog do next? depends on its personality, the time and the weather */
function decide(a, x){
  const t = now(), night = isNight(t), A = AREA(S.cur), wx = A.cave ? 'none' : wxAt(t), st = stageOf(x);
  if(st === 0){ a.tx = rnd(WATER.x0, WATER.x1); a.ty = rnd(WATER.y0, WATER.y1); a.st = 'swim'; a.until = t + 20000; return; }
  if(a.st === 'nap' || a.st === 'sun'){ a.st = 'sit'; a.until = t + rnd(1500, 3000); a.key = ''; return; }
  if(a.st === 'sing'){ a.st = 'sit'; a.until = t + rnd(1500, 4000); return; }
  if(x.vis){ a.st = Math.random() < 0.3 ? 'sing' : 'sit'; a.until = t + rnd(2000, 5000); return; }
  const sleepy = x.t === 'sleepy', nf = nightFrog(x);
  const nap = 0.1 + (sleepy ? 0.22 : 0) + (night && !nf ? 0.22 : 0) + (!night && nf ? 0.2 : 0) + (wx === 'storm' ? 0.2 : 0) + (x.m.fun < 30 ? 0.08 : 0);
  const sun = !night && wx === 'sun' && !A.cave ? 0.14 : 0;
  const sing = 0.08 + (x.t === 'singer' ? 0.18 : 0) + (night ? 0.1 : 0) + (wx === 'rain' ? 0.18 : 0);
  const hop = 0.3 + (x.t === 'jumpy' ? 0.3 : 0);
  const swim = 0.12;
  const pick_ = weighted([nap, sun, sing, hop, swim, 0.25]);
  if(pick_ <= 1){   // go to the favorite spot to nap or sunbathe
    const p = spotPos(x); a.pad = null;
    startHop(a, p.x, p.y, pick_ === 0 ? 'nap' : 'sun');
  } else if(pick_ === 2){ a.st = 'sing'; a.until = t + rnd(3000, 6500); }
  else if(pick_ === 3 || pick_ === 4){
    const i = freePad(a); if(i === null){ a.st = 'sit'; a.until = t + rnd(2000, 4000); return; }
    a.pad = i; const p = padPos(i);
    if(pick_ === 3) startHop(a, p.x, p.y, 'sit');
    else { a.tx = p.x; a.ty = p.y; a.st = 'swim'; a.until = t + 25000; a.key = ''; }
  } else { a.st = 'sit'; a.until = t + rnd(2000, 5000); }
}
function stepActors(dt){
  const t = now(), list = sceneList();
  let singers = 0;
  list.forEach(x => {
    const a = actors[x.id]; if(!a) return;
    if(choirOn(S.cur, t) && stageOf(x) > 0 && a.st !== 'hop' && a.st !== 'swim' && a.st !== 'sing'){ if(a.st === 'nap' || a.st === 'sun') a.key = ''; a.st = 'sing'; a.until = S.choirUntil; }
    if(t > a.until && a.st !== 'hop') decide(a, x);
    if(a.st === 'hop'){
      const h = a.hop; h.t += dt; const p = Math.min(1, h.t / h.dur);
      a.x = h.x0 + (h.x1 - h.x0) * p; a.y = h.y0 + (h.y1 - h.y0) * p - Math.sin(Math.PI * p) * h.hgt;
      if(p >= 1){
        a.st = h.then; a.until = t + (h.then === 'nap' || h.then === 'sun' ? rnd(15000, 40000) * (x.t === 'sleepy' ? 1.6 : 1) : rnd(1500, 4500));
        a.key = ''; a.hop = null; ripple(a.x, a.y + 1);
        a.el.classList.remove('pop'); void a.el.offsetWidth; a.el.classList.add('pop');
        if(h.then !== 'sit') renderFrogs();
      }
    } else if(a.st === 'swim'){
      const sp = stageOf(x) === 0 ? 5 : 6;
      const dx = a.tx - a.x, dy = a.ty - a.y, d = Math.hypot(dx, dy);
      if(d < 0.8){
        if(stageOf(x) === 0){ a.until = 0; }
        else { a.st = 'sit'; a.until = t + rnd(1500, 4000); a.key = ''; a.el.classList.remove('pop'); void a.el.offsetWidth; a.el.classList.add('pop'); }
      } else { a.x += dx / d * sp * dt; a.y += dy / d * sp * dt * 0.8; }
      if(stageOf(x) === 0){ const sv = a.el.querySelector('svg'); if(sv) sv.style.transform = dx < 0 ? 'scaleX(-1)' : ''; }
    } else if(a.st === 'sing'){
      singers += x.t === 'singer' ? 2 : 1;
      a.noteT -= dt;
      if(a.noteT <= 0){ a.noteT = rnd(0.5, 0.9); noteAt(a.x, a.y - 9); }
    }
    placeActor(a);
  });

    S.choirUntil = t + 20000; S.choirArea = S.cur; S.natChoirAt = t + 180000; S.stats.choirs++;

}

function toast(msg, kind){
  const t = document.createElement('div'); t.className = 'tst' + (kind ? ' ' + kind : ''); t.innerHTML = msg;
  const box = $('toast'); box.appendChild(t);
  while(box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.style.transition = 'opacity .4s'; t.style.opacity = 0; setTimeout(() => t.remove(), 400); }, 2600);
}

  {id:'hop',    e:'🪷', en:'Lily Pad Hop', fr:'Saute-nénuphars', d:{en:'Tap to hop to the next lily pad. Wait for a pad to float by. Don’t fall in the water!', fr:'Touche pour sauter sur le prochain nénuphar. Attends qu’un nénuphar passe. Ne tombe pas à l’eau!'}},
];
function renderGames(){
  const t = now(), next = S.tickets < CONFIG.TICKETS_MAX ? fmtTime((S.tkT + CONFIG.TICKET_MIN * 60000 - t) / 1000) : '';
  let h = '<div class="card"><div class="art">🎟️</div><div class="info"><div class="nm">' + tr('Tickets') + ': ' + S.tickets + '/' + CONFIG.TICKETS_MAX + '</div><div class="sub">' + (next ? tr('+1 in') + ' ' + next : tr('Full!')) + '</div></div>' +
    '<button class="btn mint sm" id="tkAd">' + adIcon() + ' +' + CONFIG.AD_TICKETS + '</button></div>';
  GAMES.forEach(g => {
    h += '<div class="card"><div class="art" style="font-size:36px">' + g.e + '</div><div class="info"><div class="nm">' + L(g) + '</div><div class="sub">' + L(g.d) + '</div><div class="sub">🏆 ' + tr('Best') + ': ' + (S.stats.best[g.id] || 0) + '</div></div>' +
      '<button class="btn sm" data-g="' + g.id + '"' + (S.tickets < 1 ? ' disabled' : '') + '>▶ ' + tr('Play') + '</button></div>';
  });
  $('iGames').innerHTML = '<h2>🎮 ' + tr('Mini games') + '</h2>' + h;
  $('iGames').querySelectorAll('[data-g]').forEach(b => b.onclick = () => startGame(b.dataset.g, true));
  $('tkAd').onclick = async () => { if(await rewardAd()){ S.tickets += CONFIG.AD_TICKETS; saveNow(); toast('+' + CONFIG.AD_TICKETS + ' 🎟️', 'gold'); renderGames(); } };
}

let G = null;   // the running game
const cv = () => $('gCanvas');
function svgImg(svg){ const i = new Image(); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); return i; }
function playerFrog(){ const a = S.avatar && frogById(S.avatar); return (a && isAdult(a)) ? a : (S.frogs.find(isAdult) || {sp: 'green'}); }
function startGame(id, intro){
  if(S.tickets < 1){ toast('🎟️ ' + tr('No tickets left. Watch an ad or wait.'), 'err'); sfx('err'); showView('Games'); return; }
  audioUnlock();
  $('game').classList.add('on'); $('gOver').classList.remove('on'); $('gHud').innerHTML = '';
  const c = cv(), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  G = {id, ctx, W: innerWidth, H: innerHeight, t: 0, score: 0, shownScore: 0, shake: 0, parts: [], texts: [], over: false, started: false, last: performance.now(), img: svgImg(frogSVG(playerFrog().sp, {size: 200}))};
  ({tongue: tongueInit, hop: hopInit})[id]();
  const go = () => {
    if(S.tickets < 1) return;
    if(S.tickets >= CONFIG.TICKETS_MAX) S.tkT = now();
    S.tickets--; S.stats.games++; saveNow();
    $('gIntro').classList.remove('on'); G.started = true; G.last = performance.now();
    tutEvent('game');
  };
  if(intro){
    const g = GAMES.find(q => q.id === id);
    $('gIntroBox').innerHTML = '<div style="font-size:56px">' + g.e + '</div><h2 style="margin:6px 0">' + L(g) + '</h2><p style="font-weight:800">' + L(g.d) + '</p>' +
      '<button class="btn wide" id="giGo">▶ ' + tr('Start') + ' · 🎟️ 1</button><button class="btn wide ghost" id="giBack">' + tr('Back') + '</button>';
    $('gIntro').classList.add('on');
    $('giGo').onclick = go; $('giBack').onclick = closeGame;
  } else go();
  requestAnimationFrame(gameLoop);
}
function gameLoop(ts){
  if(!G || G.over) return;
  const dt = Math.min(0.05, (ts - G.last) / 1000); G.last = ts;
  if(G.started){ G.t += dt; G.update(dt); }
  G.shownScore += (G.score - G.shownScore) * Math.min(1, dt * 10);   // score ticks up
  const ctx = G.ctx; ctx.save();
  if(G.shake > 0){ G.shake -= dt; ctx.translate(rnd(-6, 6) * G.shake * 3, rnd(-6, 6) * G.shake * 3); }
  G.draw(ctx);
  G.parts = G.parts.filter(p => (p.life -= dt) > 0);
  G.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * dt; ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
  G.texts = G.texts.filter(q => (q.life -= dt) > 0);
  G.texts.forEach(q => { q.y -= 40 * dt; ctx.globalAlpha = Math.min(1, q.life * 2); ctx.font = '900 ' + (q.size || 24) + 'px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(q.s, q.x, q.y); ctx.fillStyle = q.c || '#2c4a3c'; ctx.fillText(q.s, q.x, q.y); });
  ctx.globalAlpha = 1; ctx.restore();
  requestAnimationFrame(gameLoop);
}
function burst(x, y, c, n){ for(let i=0;i<(n || 10);i++){ const a = Math.random() * 7, s = rnd(60, 200); G.parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, r: rnd(2, 5), c: c || '#fff', life: 0.7, max: 0.7}); } }
function floatText(x, y, s, c, size){ G.texts.push({x, y, s, c, size, life: 0.9}); }
function hud(html){ $('gHud').innerHTML = html + '<button class="pill" id="gQuit" style="padding:8px 14px">✕</button>'; $('gQuit').onclick = () => G.started ? gameOver(true) : closeGame(); }
function emoji(ctx, e, x, y, size){ ctx.font = size + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y); }
function pondBg(ctx, flow){
  const g = ctx.createLinearGradient(0, 0, 0, G.H); g.addColorStop(0, '#bfeef0'); g.addColorStop(1, '#4fb3c4');
  ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
  ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 2;
  for(let i=0;i<9;i++){ const y = ((i * 97 + (flow || 0)) % (G.H + 40)) - 20, x = (i * 173) % G.W; ctx.beginPath(); ctx.moveTo(x - 20, y); ctx.quadraticCurveTo(x, y - 5, x + 20, y); ctx.stroke(); }
}
function padDraw(ctx, x, y, w, col){
  ctx.fillStyle = shade(col, -0.22); ctx.beginPath(); ctx.ellipse(x, y + 4, w / 2, w * 0.2, 0, 0, 7); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y); ctx.ellipse(x, y, w / 2, w * 0.2, 0, -0.25, Math.PI * 2 - 0.55); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = shade(col, 0.25); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - w * 0.35, y - w * 0.05); ctx.moveTo(x, y); ctx.lineTo(x - w * 0.15, y + w * 0.15); ctx.moveTo(x, y); ctx.lineTo(x + w * 0.25, y + w * 0.12); ctx.stroke();
}
function drawFrog(ctx, x, y, w, sx, sy){
  if(!G.img.complete) return;
  const h = w * 0.8; ctx.save(); ctx.translate(x, y); ctx.scale(sx || 1, sy || 1); ctx.drawImage(G.img, -w / 2, -h * 0.92, w, h); ctx.restore();
}
function flyDraw(ctx, f){
  ctx.save(); ctx.translate(f.x, f.y);
  if(f.k === 'bee'){ emoji(ctx, '🐝', 0, 0, 34); ctx.restore(); return; }
  const flap = Math.sin(G.t * 40 + f.ph) * 0.5 + 0.5;
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.strokeStyle = '#9fd0e8'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(-6, -8, 8, 4 + flap * 3, -0.5, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(6, -8, 8, 4 + flap * 3, 0.5, 0, 7); ctx.fill(); ctx.stroke();
  if(f.k === 'gold'){ ctx.shadowColor = '#ffd84d'; ctx.shadowBlur = 16; }
  ctx.fillStyle = f.k === 'gold' ? '#ffcf3d' : '#3a3a4a'; ctx.beginPath(); ctx.ellipse(0, 0, 9, 7, 0, 0, 7); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#ff5a5a'; ctx.beginPath(); ctx.arc(-5, -3, 2.4, 0, 7); ctx.arc(5, -3, 2.4, 0, 7); ctx.fill();
  ctx.restore();
}

/* ---------- FLY SNACK (catch flies with the tongue) ---------- */
function tongueInit(){
  Object.assign(G, {flies: [], left: CONFIG.TONGUE_TIME, lives: 3, tg: null, pop: 0});
  const c = cv();
  const fw = () => Math.min(170, G.W * 0.42), fy = () => G.H - 70;
  const mouth = () => ({x: G.W / 2, y: fy() - fw() * 0.8 * 0.92 + fw() * 0.8 * 0.6});
  const spawn = () => { const r = Math.random(); G.flies.push({x: rnd(30, G.W - 30), y: rnd(110, G.H * 0.55), vx: rnd(-90, 90), vy: rnd(-40, 40), ph: rnd(0, 6), k: r < 0.08 ? 'gold' : r < 0.26 ? 'bee' : 'fly'}); };
  for(let i=0;i<5;i++) spawn();
  c.onpointerdown = e => {
    if(!G.started || G.tg) return;
    const x = e.clientX, y = e.clientY;
    let best = null, bd = 44;
    G.flies.forEach(f => { const d = Math.hypot(f.x - x, f.y - y); if(d < bd){ bd = d; best = f; } });
    G.tg = {x: best ? best.x : x, y: best ? best.y : y, t: 0, f: best};
    sfx('pop');
  };
  G.update = dt => {
    G.left -= dt;
    if(G.left <= 0){ G.left = 0; gameOver(); return; }
    const want = Math.min(10, 5 + Math.floor(G.t / 7));
    if(G.flies.length < want && Math.random() < dt * 3) spawn();
    G.flies.forEach(f => {
      f.vx += rnd(-160, 160) * dt; f.vy += rnd(-120, 120) * dt;
      const sp = f.k === 'gold' ? 180 : 120 + G.t * 2; const m = Math.hypot(f.vx, f.vy); if(m > sp){ f.vx *= sp / m; f.vy *= sp / m; }
      f.x += f.vx * dt; f.y += f.vy * dt + Math.sin(G.t * 5 + f.ph) * 0.6;
      if(f.x < 20 || f.x > G.W - 20) f.vx *= -1; if(f.y < 90 || f.y > G.H * 0.62) f.vy *= -1;
      f.x = clamp(f.x, 20, G.W - 20); f.y = clamp(f.y, 90, G.H * 0.62);
    });
    if(G.tg){
      G.tg.t += dt;
      if(G.tg.f && G.tg.t >= 0.1 && !G.tg.done){
        G.tg.done = true; const f = G.tg.f;
        if(G.flies.includes(f)){
          G.flies = G.flies.filter(q => q !== f);
          if(f.k === 'bee'){ G.lives--; G.shake = 0.35; sfx('err'); burst(f.x, f.y, '#ffd84d', 12); floatText(f.x, f.y - 20, tr('Ouch!'), '#ff5f6f'); if(G.lives <= 0) setTimeout(() => gameOver(), 400); }
          else { const v = f.k === 'gold' ? 3 : 1; G.score += v; G.pop = 0.2; sfx(f.k === 'gold' ? 'coin' : 'eat'); burst(f.x, f.y, f.k === 'gold' ? '#ffe27a' : '#9ad06a', 10); floatText(f.x, f.y - 20, '+' + v); }
        }
      }
      if(G.tg.t > 0.24) G.tg = null;
    }
    if(G.pop > 0) G.pop -= dt;
    hud('<span class="pill">🪰 ' + Math.round(G.shownScore) + '</span><span class="pill">' + '❤️'.repeat(Math.max(0, G.lives)) + '🤍'.repeat(Math.max(0, 3 - G.lives)) + '</span><span class="pill">⏱️ ' + Math.ceil(G.left) + '</span>');
  };
  G.draw = ctx => {
    const g = ctx.createLinearGradient(0, 0, 0, G.H); g.addColorStop(0, '#a6dcff'); g.addColorStop(0.62, '#e6f8ff'); g.addColorStop(0.63, '#8fd2dc'); g.addColorStop(1, '#4fb3c4');
    ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
    ctx.fillStyle = '#8fd27a'; ctx.beginPath(); ctx.ellipse(G.W * 0.2, G.H * 0.63, G.W * 0.4, 30, 0, Math.PI, 0); ctx.ellipse(G.W * 0.8, G.H * 0.63, G.W * 0.35, 24, 0, Math.PI, 0); ctx.fill();
    G.flies.forEach(f => flyDraw(ctx, f));
    padDraw(ctx, G.W / 2, fy() - 4, fw() * 1.4, '#6fcf6a');
    const s = 1 + (G.pop > 0 ? G.pop : 0);
    drawFrog(ctx, G.W / 2, fy(), fw(), s, 2 - s);
    if(G.tg){
      const m = mouth(), p = G.tg.t < 0.1 ? G.tg.t / 0.1 : Math.max(0, 1 - (G.tg.t - 0.1) / 0.14);
      const tx = m.x + (G.tg.x - m.x) * p, ty = m.y + (G.tg.y - m.y) * p;
      ctx.strokeStyle = '#ff6f8f'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.fillStyle = '#ff6f8f'; ctx.beginPath(); ctx.arc(tx, ty, 9, 0, 7); ctx.fill();
    }
  };
  hud('<span class="pill">🪰 0</span>');
}

/* ---------- LILY PAD HOP ---------- */
function hopInit(){
  const D = Math.max(105, Math.min(140, G.H / 6.2)), P = () => G.W + 220;
  Object.assign(G, {rows: [], row: 0, cam: 0, fx: G.W / 2, lives: 3, hop: null, D, flow: 0, fall: 0});
  const makeRow = r => {
    if(r === 0) return {pads: [{x0: G.W / 2 + 110, fly: false}], w: 150, v: 0};
    const w = Math.max(70, 125 - r * 1.6), n = rint(2, 3), v = (CONFIG.HOP_SPEED + r * CONFIG.HOP_RAMP) * (r % 2 ? 1 : -1) * rnd(0.85, 1.2);
    const pads = []; const off = rnd(0, P());
    for(let i=0;i<n;i++) pads.push({x0: off + i * P() / n, fly: Math.random() < 0.18});
    return {pads, w, v};
  };
  const padX = (R, p) => R.v === 0 ? p.x0 - 110 : (((p.x0 + R.v * G.t) % P()) + P()) % P() - 110;
  G.padX = padX;
  const ensure = () => { while(G.rows.length < G.row + 9) G.rows.push(makeRow(G.rows.length)); };
  ensure();
  G.cur = G.rows[0].pads[0]; G.offset = 0;
  const baseY = () => G.H - 150;
  G.rowY = r => baseY() - (r - G.cam) * G.D;
  const c = cv();
  c.onpointerdown = () => {
    if(!G.started || G.hop || G.fall > 0) return;
    G.hop = {t: 0, dur: 0.36, from: G.row}; sfx('boing');
  };
  const land = () => {
    const r = G.row + 1, R = G.rows[r];
    let hit = null;
    R.pads.forEach(p => { if(Math.abs(padX(R, p) - G.fx) < R.w / 2 - 4) hit = p; });
    G.row = r; ensure();
    if(hit){
      G.cur = hit; G.offset = G.fx - padX(R, hit);
      G.score++; sfx('splash'); burst(G.fx, G.rowY(r), '#bff3ff', 8);
      if(hit.fly){ hit.fly = false; G.score += 2; sfx('coin'); floatText(G.fx, G.rowY(r) - 60, '+3 🪰', '#3f8f3a'); }
      else floatText(G.fx, G.rowY(r) - 60, '+1');
    } else {
      G.lives--; G.shake = 0.3; sfx('err'); burst(G.fx, G.rowY(r), '#ffffff', 16); floatText(clamp(G.fx, 60, G.W - 60), G.rowY(r) - 40, tr('Splash!'), '#3f86d0');
      G.fall = 0.6;
      // climb onto the closest pad in that row
      let best = R.pads[0], bd = 1e9; R.pads.forEach(p => { const d = Math.abs(padX(R, p) - G.fx); if(d < bd){ bd = d; best = p; } });
      G.cur = best; G.offset = 0;
      if(G.lives <= 0) setTimeout(() => gameOver(), 500);
    }
  };
  G.update = dt => {
    G.flow += dt * 30;
    G.cam += (G.row - G.cam) * Math.min(1, dt * 6);
    if(G.fall > 0) G.fall -= dt;
    if(G.hop){
      G.hop.t += dt;
      if(G.hop.t >= G.hop.dur){ G.hop = null; land(); }
    } else if(G.cur){
      const R = G.rows[G.row]; G.fx = padX(R, G.cur) + G.offset;
      if(G.fx < 8 || G.fx > G.W - 8){   // carried off the edge
        G.lives--; G.shake = 0.3; sfx('err'); floatText(clamp(G.fx, 40, G.W - 40), G.rowY(G.row) - 40, tr('Splash!'), '#3f86d0'); G.fall = 0.6;
        let best = R.pads[0], bd = 1e9; R.pads.forEach(p => { const d = Math.abs(padX(R, p) - G.W / 2); if(d < bd){ bd = d; best = p; } });
        G.cur = best; G.offset = 0;
        if(G.lives <= 0) setTimeout(() => gameOver(), 500);
      }
    }
    hud('<span class="pill">🪷 ' + Math.round(G.shownScore) + '</span><span class="pill">' + '❤️'.repeat(Math.max(0, G.lives)) + '🤍'.repeat(Math.max(0, 3 - G.lives)) + '</span>');
  };
  G.draw = ctx => {
    pondBg(ctx, G.flow);
    for(let r = Math.max(0, Math.floor(G.cam) - 2); r < G.rows.length; r++){
      const y = G.rowY(r); if(y < -60 || y > G.H + 60) continue;
      const R = G.rows[r];
      R.pads.forEach(p => { const x = padX(R, p); padDraw(ctx, x, y, R.w, r % 3 === 0 ? '#6fcf6a' : r % 3 === 1 ? '#5fbf5f' : '#7fd47a'); if(p.fly){ G.t2 = G.t; flyDraw(ctx, {x: x + 4, y: y - 26 + Math.sin(G.t * 4 + x) * 4, ph: x, k: 'fly'}); } });
    }
    let y = G.rowY(G.row), x = G.fx, sx = 1, sy = 1;
    if(G.hop){ const p = G.hop.t / G.hop.dur; y = G.rowY(G.row) - G.D * p - Math.sin(Math.PI * p) * 50; sx = 0.92; sy = 1.1; }
    if(G.fall > 0){ ctx.globalAlpha = 0.5 + Math.sin(G.t * 30) * 0.3; }
    drawFrog(ctx, x, y, 92, sx, sy);
    ctx.globalAlpha = 1;
  };
  hud('<span class="pill">🪷 0</span>');
}

/* ---------- game over + prizes ---------- */
function gameOver(quit){
  if(!G || G.over) return;
  G.over = true;
  const id = G.id, sc = G.score, inc = incomeFloor();
  let p = sc * inc * ({tongue: 5, hop: 12}[id]), cr = 0, best = false;
  if(sc > (S.stats.best[id] || 0)){ S.stats.best[id] = sc; best = sc > 0; }
  if(quit) p *= 0.5;
  p = Math.round(Math.max(sc > 0 ? 25 : 0, p));
  if(sc >= 8 && Math.random() < 0.15) cr = 1 + Math.floor(sc / 20);
  addC(p); S.g += cr; addXP(Math.min(25, 6 + Math.floor(sc / 2)));
  const food = sc >= 10 ? pick(FOOD_IDS) : null; if(food) S.inv[food] += 2;
  saveNow();
  if(best) sfx('win');
  const g = GAMES.find(q => q.id === id);
  $('gOverBox').innerHTML = '<div style="font-size:50px">' + (best ? '🏆' : g.e) + '</div><h2 style="margin:6px 0">' + (best ? tr('New best!') : tr('Nice try!')) + '</h2>' +
    '<div style="font-size:1.4em;font-weight:900">' + g.e + ' ' + sc + ' <span class="muted">· 🏆 ' + S.stats.best[id] + '</span></div>' +
    '<div class="reward"><div class="amt">+' + fmt(p) + ' ' + CN + (cr ? ' +' + cr + ' 💎' : '') + (food ? ' +2 ' + FOODS[food].e : '') + '</div></div>' +
    '<button class="btn wide" id="goAgain"' + (S.tickets < 1 ? ' disabled' : '') + '>🔁 ' + tr('Play again') + ' · 🎟️ ' + S.tickets + '</button>' +
    (S.tickets < 1 ? '<button class="btn wide mint" id="goTk">' + adIcon() + ' +' + CONFIG.AD_TICKETS + ' 🎟️</button>' : '') +
    '<button class="btn wide ghost" id="goBack">' + tr('Back') + '</button>';
  $('gOver').classList.add('on');
  $('goAgain').onclick = () => startGame(id, false);
  if($('goTk')) $('goTk').onclick = async () => { if(await rewardAd()){ S.tickets += CONFIG.AD_TICKETS; saveNow(); startGame(id, false); } };
  $('goBack').onclick = closeGame;
}
function closeGame(){
  G = null; $('game').classList.remove('on'); $('gIntro').classList.remove('on'); $('gOver').classList.remove('on');
  const c = cv(); c.onpointerdown = c.onpointermove = null;
  refreshTop(); if(curView === 'Games') renderGames(); else if(curView === 'Pond') renderPond();
}

const MONEY = {
  TESTING: true,
  DEMO_BUY: true,   // browser only: pretend purchases give the item (for testing)
  REWARDED_ID: 'ca-app-pub-3940256099942544/5224354917', // Google's TEST rewarded ID — replace with yours
};
const PACK = {sku: 'blossom_pack', price: '$2.99', gems: 50};
const isNative = () => !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());

/* the one function the game calls. Resolves true if the player earned the reward. */
async function rewardAd(){
  if(S.noAds){ toast('✨ ' + tr('Cherry Blossom Pack: reward given!'), 'gold'); return true; }
  if(adBusy) return false;
  adBusy = true;
  musicStop(); rainSound(false);
  let ok = false;
  try{ ok = AdMobP() ? await nativeAd() : await demoAd(); }catch(e){ ok = false; }
  adBusy = false;
  if(S.mus) musicStart();
  if(!ok) toast(tr('No reward this time'), 'err');
  return ok;
}
function nativeAd(){
  const A = AdMobP();
  return new Promise(async res => {
    let earned = false, finished = false, hs = [];
    const finish = () => { if(finished) return; finished = true; hs.forEach(h => { try{ h.remove(); }catch(e){} }); res(earned); };
    try{
      hs.push(await A.addListener('onRewardedVideoAdReward', () => { earned = true; }));
      hs.push(await A.addListener('onRewardedVideoAdDismissed', () => setTimeout(finish, 250)));
      hs.push(await A.addListener('onRewardedVideoAdFailedToShow', finish));
      await A.prepareRewardVideoAd({adId: MONEY.REWARDED_ID, isTesting: MONEY.TESTING});
      const item = await A.showRewardVideoAd();
      if(item && item.amount !== undefined) earned = true;
      setTimeout(finish, 600);
    }catch(e){ finish(); }
  });
}

let iapReady = false;
function iapStore(){ return window.CdvPurchase && CdvPurchase.store; }
function iapInit(){
  const C = window.CdvPurchase; if(!C || iapReady) return;
  const {store, ProductType, Platform} = C; iapReady = true;
  store.register(ALL_SKUS().map(id => ({id, type: ProductType.NON_CONSUMABLE, platform: Platform.GOOGLE_PLAY})));
  store.when()
    .productUpdated(p => { if(p.pricing && p.pricing.price) PRICES[p.id] = p.pricing.price; })
    .approved(tx => {
      if(!S.iapDone) S.iapDone = {};
      const tid = tx.transactionId || ('t' + now());
      if(!S.iapDone[tid]){
        S.iapDone[tid] = now();
        (tx.products || []).forEach(it => { const msg = grantSku(it.id); if(msg) queueModal(() => showReward('💝', tr('Thank you!'), msg)); });
        saveNow(); refreshTop(); renderPond();
      }
      tx.finish();
    });
  store.error(e => { if(e && e.code !== C.ErrorCode.PAYMENT_CANCELLED) toast(tr('Store error. Please try again.'), 'err'); });
  store.initialize([Platform.GOOGLE_PLAY]);
}

/* =====================================================================
   12. MAIN LOOP — game ticks, away time, tutorial, start-up
   tick(): once a second — moods, coins, eggs, timers
   frame(): every screen frame — frogs hop and swim
===================================================================== */
function stepWorld(dt, t, offline){
  const rate = MOOD_RATE();
  let earned = 0, found = 0;
  S.frogs.forEach(x => {
    x.m.food = Math.max(0, x.m.food - rate * dt * (x.t === 'hungry' ? 1.5 : 1) * (x.t === 'sleepy' ? 0.8 : 1));
    x.m.fun = Math.max(0, x.m.fun - rate * dt * (x.t === 'sleepy' ? 0.6 : 1));
    if(!isAdult(x)){
      const st0 = stageOf(x);
      x.grow += dt * (0.5 + moodAvg(x) / 100);
      const st1 = stageOf(x);
      if(st1 !== st0 && !offline){
        if(st1 === 1) toast('🐸 ' + esc(x.n) + ' ' + tr('grew little legs!'), 'gold');
        if(st1 === 2){ toast('🌟 ' + esc(x.n) + ' ' + tr('is all grown up!'), 'gold'); addXP(10); }
        if(x.a === S.cur && actors[x.id]){ const a = actors[x.id]; a.key = ''; if(st0 === 0){ const i = freePad(a); if(i !== null){ a.pad = i; const p = padPos(i); startHop(a, p.x, p.y, 'sit'); } } }
      }
    }
    earned += frogRate(x, t) * dt;
    if(isAdult(x) && Math.random() < CONFIG.GEM_CHANCE * dt / 60){
      S.g++; S.stats.gems++; found++;
      if(!offline && x.a === S.cur && curView === 'Pond'){ fxAtFrog(x, '💎'); sfx('coin'); }
    }
  });
  addC(earned);
  return {earned, found};
}
let tickN = 0;
function tick(){
  const t = now();
  stepWorld(1, t);
  S.stats.play++; tickN++;
  // tickets
  while(S.tickets < CONFIG.TICKETS_MAX && t - S.tkT >= CONFIG.TICKET_MIN * 60000){ S.tickets++; S.tkT += CONFIG.TICKET_MIN * 60000; }
  if(S.tickets >= CONFIG.TICKETS_MAX) S.tkT = t;
  // visitors
  if(S.visitor && t > S.visitor.until){ S.visitor = null; S.visitorAt = nextVisitorAt(); if(curView === 'Pond') renderPond(); }
  if(S.tut >= 99 && !S.visitor){
    if(S.daily.last === dayNum(t) && S.dvDay !== dayNum(t)){ S.dvDay = dayNum(t); spawnVisitor('daily'); }
    else if(t > S.visitorAt) spawnVisitor('random');
  }
  // eggs ready
  S.eggs.forEach(e => { if(!e.told && eggLeft(e) <= 0){ e.told = 1; toast('🥚 ' + tr('Frog eggs are ready to hatch!'), 'gold'); sfx('chime'); } });
  if(tickN % 10 === 0) saveNow();
  // screen updates
  refreshTop();
  if(curView === 'Pond' && !G){
    renderEggs(); renderSide(); bugsTick();
    if(tickN % 3 === 0){ renderFrogs(); renderCare(); applyDark(); }
    if(tickN % 4 === 0) lickSomething();
    if(tickN % 10 === 0){ renderBg(); musicStart(); }
  }
  if(curView === 'Games' && tickN % 5 === 0 && !$('modalBg').classList.contains('on')) renderGames();
  if(curView === 'Frogs' && frTab === 'eggs' && !$('modalBg').classList.contains('on')) renderFrogsView();
}
let lastFrame = performance.now();
function frame(ts){
  const dt = Math.min(0.1, (ts - lastFrame) / 1000); lastFrame = ts;
  if(S && curView === 'Pond' && !G) stepActors(dt);
  if(S) tickCoinDisplay();
  requestAnimationFrame(frame);
}

/* ---------- away time (coins while the app is closed) ---------- */
function catchUp(){
  const t = now(), away = (t - (S.lastSeen || t)) / 1000;
  if(away < 60) return;
  const capped = Math.min(away, offlineCapH() * 3600);
  let earned = 0, found = 0, sim = S.lastSeen;
  const steps = Math.floor(capped / 60);
  for(let i=0;i<steps;i++){ sim += 60000; const r = stepWorld(60, sim, true); earned += r.earned; found += r.found; }
  // after the limit: no more coins, but moods still go down and tadpoles still grow
  const rest = away - steps * 60, rate = MOOD_RATE();
  S.frogs.forEach(x => { x.m.food = Math.max(0, x.m.food - rate * rest); x.m.fun = Math.max(0, x.m.fun - rate * rest * 0.8); if(!isAdult(x)) x.grow += rest * 0.5; });
  while(S.tickets < CONFIG.TICKETS_MAX && t - S.tkT >= CONFIG.TICKET_MIN * 60000){ S.tickets++; S.tkT += CONFIG.TICKET_MIN * 60000; }
  S.lastSeen = t;
  if(earned >= 1){
    S.awayLast = Math.round(earned);
    const capTxt = away > capped ? '<p class="muted">' + tr('Coins stop after {h}h away. Bug jars in the Shop keep them coming longer.', {h: offlineCapH()}) + '</p>' : '';
    const fx = playerFrog();
    queueModal(() => {
      openModal('🌅 ' + tr('Welcome back!'), '<div class="reward"><div class="big">' + frogSVG(fx.sp, {size: 150, happy: true}) + '</div><p>' + tr('You were away for {t}.', {t: fmtTime(away)}) + '</p><p>' + tr('Your frogs caught bugs worth') + '</p><div class="amt">+' + fmt(S.awayLast) + ' ' + CN + (found ? ' +' + found + ' 💎' : '') + '</div>' + capTxt + '</div>' +
        '<button class="btn wide gold" id="wbX2">' + adIcon() + ' ' + tr('Double it!') + ' +' + fmt(S.awayLast) + ' ' + CN + '</button><button class="btn wide ghost" id="wbOk">' + tr('Collect') + '</button>');
      $('wbOk').onclick = closeModal;
      $('wbX2').onclick = async () => { closeModal(); if(await rewardAd()){ addC(S.awayLast); toast('+' + fmt(S.awayLast) + ' ' + CN, 'gold'); S.awayLast = 0; saveNow(); } };
    });
  }
  saveNow();
}

/* ---------- start-up ---------- */
function boot(){
  $('loadFrog').innerHTML = frogSVG('green');
  const lang0 = (load() || {}).lang || ((navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en');
  $('loadTip').textContent = '💡 ' + pick(TIPS)[lang0];
  let p = 0; const iv = setInterval(() => { p = Math.min(100, p + rnd(12, 28)); $('loadBar').style.width = p + '%'; }, 140);
  setTimeout(() => {
    clearInterval(iv); $('loadBar').style.width = '100%';
    const saved = load();
    if(saved){ S = saved; catchUp(); }
    if(!S) startNewGame();
    shownC = S.c;
    applySettings(); renderNav(); showView('Pond');
    if(S.tut >= 1 && S.tut < 99) tutShow();
    else if(S.tut >= 99) checkDaily();
    $('load').style.opacity = 0; setTimeout(() => $('load').remove(), 600);
    setInterval(tick, 1000);
    requestAnimationFrame(frame);
    adsInit();
  }, 1300);
  $('mClose').onclick = closeModal;
  $('modalBg').addEventListener('pointerdown', e => { if(e.target === $('modalBg') && $('mClose').style.display !== 'none') closeModal(); });
  $('pCoin').onclick = openBoosts;
  $('pGem').onclick = () => { shopTab = 'paid'; showView('Shop'); };
  $('pLevel').onclick = () => showView('More');
  $('profBtn').onclick = () => showView('More');
  $('muteBtn').onclick = () => { const on = S.snd || S.mus; S.snd = S.mus = !on; if(!on) audioUnlock(); else { musicStop(); rainSound(false); } refreshTop(); saveNow(); if(curView === 'More') renderMore(); };
  $('scene').addEventListener('pointerdown', () => { if(sel){ sel = null; renderFrogs(); renderCare(); } });
  document.addEventListener('pointerdown', audioUnlock, {once: true});
  document.addEventListener('visibilitychange', () => {
    if(!S) return;
    if(document.hidden){ saveNow(); musicStop(); rainSound(false); }
    else { catchUp(); if(S.mus) musicStart(); if(curView === 'Pond'){ bgKey = ''; renderPond(); } }
  });
  document.addEventListener('pause', () => { if(S){ saveNow(); musicStop(); rainSound(false); } }, false);
  window.addEventListener('resize', () => { if(S && curView === 'Pond'){ bgKey = ''; for(const k in actors) actors[k].key = ''; renderPond(); } });
}
