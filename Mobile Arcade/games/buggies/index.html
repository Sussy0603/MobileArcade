    '<div class="bar"><i style="width:'+pct+'%"></i></div><div class="sub">'+fmt(S.seasonCoins)+' / '+fmt(goal)+' 🪙 '+L('this season','cette saison')+(S.prestige?' · '+L('Bonus now','Bonus actuel')+': +'+Math.round(S.prestige*10)+'%':'')+'</div>'+
    '<button class="btn wide" id="uPre"'+(canPrestige()?'':' disabled')+'>🍃 '+L('New Season','Nouvelle saison')+'</button></div>';
  openSheet('⬆️ '+L('Upgrades','Améliorer'),h,'upg',topChips());
  S.habs.forEach(id=>{
    $('uL_'+id).onclick=()=>{if(!spend(lvlCost(id)))return;S.hab[id].lvl++;sfx('buy');save();refreshHUD();openUpgrades();};
    $('uS_'+id).onclick=()=>{if(!spend(slotCost(id)))return;S.hab[id].slots++;sfx('buy');save();refreshUI();openUpgrades();};
  });

    if(freeSlots(hid)<=0){toast(L('That habitat is full. Buy more space!','Cet habitat est plein. Achète plus de place !'),'err');sfx('err');return;}
    if(!spend(adoptCost(sp)))return;const bug=makeBug(sp);bug.h=hid;S.bugs.push(bug);if(hid===S.cur)spawnArrival(bug);sfx('buy');toast('🐞 '+N(SP[sp].n)+' '+L('joined!','est arrivé !'));checkBadges();save();refreshUI();openUpgrades();});
  $('uOff').onclick=()=>{if(!spend(offCost()))return;S.offLvl++;sfx('buy');save();refreshHUD();openUpgrades();};
  $('uEn').onclick=()=>{if(!spend(enCost()))return;S.enLvl++;S.energy++;sfx('buy');save();refreshHUD();openUpgrades();};
  ['gardener','feeder','cleaner'].forEach(k=>{$('uH_'+k).onclick=()=>{if(S.helpers[k])return;if(!spendGems(TUNE.HELPER_GEMS))return;S.helpers[k]=1;sfx('unlock');toast('🧑‍🌾 '+L('Helper hired!','Assistant engagé !'),'gold');save();refreshHUD();openUpgrades();};});
  $('shBody').querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const d=DEC[b.dataset.dec];if(!spend(d.cost))return;S.decor[d.id]=1;sfx('buy');toast(d.e+' '+N(d.n)+'!');save();refreshHUD();openUpgrades();});
  $('uPre').onclick=()=>{
    openModal('<div class="big">🍃</div><h3>'+L('Start a new season?','Commencer une nouvelle saison ?')+'</h3><p>'+L('Your bugs fly back to nature. You get +10% coins forever.','Tes insectes retournent dans la nature. Tu gagnes +10 % de pièces pour toujours.')+'</p><div class="rowb"><button class="btn ghost" id="prN">'+L('Not yet','Pas encore')+'</button><button class="btn" id="prY">'+L('Yes!','Oui !')+'</button></div>');
    $('prN').onclick=()=>{sfx('tap');closeModal();};$('prY').onclick=()=>{closeModal();closeSheet();doPrestige();};
  };
}

/* =====================================================================
   MONEY — rewarded ads (AdMob) + gem packs (Google Play Billing)
   ---------------------------------------------------------------------
   Same setup as Fishies. In a normal browser everything runs in DEMO
   mode: ads are a short fake countdown and purchases show a message.
   Inside the Android app (Capacitor) the real plugins take over:
     • @capacitor-community/admob   → rewarded video ads
     • cordova-plugin-purchase      → Google Play products
   BEFORE RELEASE: put your real AdMob rewarded unit ID below and set
   MONEY.TESTING to false. Until then Google's test ads are shown.
   Ads are always the player's choice. No daily limit.
===================================================================== */
const MONEY={
  TESTING:true,
  REWARDED_ID:'ca-app-pub-3940256099942544/5224354917' // Google's TEST rewarded ID — replace with yours
};
const isNative=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const AdMobP=()=>isNative()&&window.Capacitor.Plugins?Capacitor.Plugins.AdMob:null;
let adBusy=false, iapReady=false;

function showRewardedAd(){
  if(adBusy)return Promise.resolve(false);
  adBusy=true;
  const done=r=>{adBusy=false;return r;};
  const A=AdMobP();
  if(!A)return demoAd().then(done);
  musicPause(true);
  return new Promise(async res=>{
    let earned=false,finished=false,hs=[];
    const finish=()=>{if(finished)return;finished=true;hs.forEach(h=>{try{h.remove();}catch(e){}});res(earned);};
    try{
      hs.push(await A.addListener('onRewardedVideoAdReward',()=>{earned=true;}));
      hs.push(await A.addListener('onRewardedVideoAdDismissed',()=>setTimeout(finish,250)));
      hs.push(await A.addListener('onRewardedVideoAdFailedToShow',finish));
      await A.prepareRewardVideoAd({adId:MONEY.REWARDED_ID,isTesting:MONEY.TESTING});
      const item=await A.showRewardVideoAd();
      if(item&&item.amount!==undefined)earned=true;
      setTimeout(finish,600);
    }catch(e){finish();}
  }).then(r=>{musicPause(false);if(!r)toast(L('No video right now — try again in a minute','Pas de vidéo pour le moment — réessaie dans une minute'),'err');return done(r);});
}
function demoAd(){
  return new Promise(res=>{
    let n=3;const wasOpen=$('ov').classList.contains('open'),prev=$('modal').innerHTML;
    const box=document.createElement('div');box.className='overlay open';box.style.zIndex=95;
    box.innerHTML='<div class="modal"><div class="big">📺</div><p>'+L('A short video plays here in the app.','Une courte vidéo joue ici dans l’appli.')+'</p><div class="amt" id="adCd">'+n+'</div><button class="btn wide ghost" id="adSkip">'+L('Close (no reward)','Fermer (pas de récompense)')+'</button></div>';
    $('app').appendChild(box);
    const iv=setInterval(()=>{n--;const el=box.querySelector('#adCd');if(el)el.textContent=n;if(n<=0){clearInterval(iv);box.remove();res(true);}},1000);
    box.querySelector('#adSkip').onclick=()=>{clearInterval(iv);box.remove();res(false);};
  });
}
/* every reward button goes through here. Remove-ads owners skip the video. */

  sfx('tap');
  if(S.noads)return true;
  const ok=await showRewardedAd();

/* ---------------- Google Play products ---------------- */
function iapStore(){return window.CdvPurchase&&CdvPurchase.store;}
function iapGrant(sku,tid){
  if(!S.iapDone)S.iapDone={};
  if(tid&&S.iapDone[tid])return;
  if(tid)S.iapDone[tid]=now();
  const p=GEM_PACKS.find(x=>x.sku===sku);
  if(p){S.gems+=p.gems;toast(L('Thank you!','Merci !')+' +'+fmt(p.gems)+' 💎','gold');sfx('coin');}
  if(sku===ONE_TIME.starter.sku&&!S.starter)grantStarter();
  if(sku===ONE_TIME.noads.sku&&!S.noads){S.noads=true;toast('✨ '+L('No more videos! All 📺 rewards are now free.','Plus de vidéos ! Toutes les récompenses 📺 sont gratuites.'),'gold');}
  if(sku===ONE_TIME.sunset.sku&&!S.sunset){S.sunset=true;const b=makeBug('sunsetmoth',{paid:1});const at=placeBug(b,'g');if(at===S.cur)spawnArrival(b);if(b._new)newSpecies(b);}
  checkBadges();save();refreshUI();if(sheetKind==='shop')openShop();
}
function grantStarter(){
  S.starter=true;S.gems+=150;S.lanternEnd=Math.max(S.lanternEnd,now())+3*3600000;
  const h=['gardener','feeder','cleaner'].find(k=>!S.helpers[k]);if(h)S.helpers[h]=1;
  const pool=SPECIES.filter(s=>s.r===2&&!s.ev&&!s.paid&&S.habs.includes(s.h));
  const sp=pick(pool.length?pool:SPECIES.filter(s=>s.r===2&&!s.ev&&!s.paid));
  const b=makeBug(sp.id,{paid:1});const at=placeBug(b);if(at===S.cur)spawnArrival(b);if(b._new)newSpecies(b);
  toast('⭐ '+L('Starter Pack! +150 💎, a lantern, a helper and a rare bug!','Pack de départ ! +150 💎, une lanterne, un assistant et un insecte rare !'),'gold');
}
function iapInit(){
  const C=window.CdvPurchase;if(!C||iapReady)return;
  const {store,ProductType,Platform}=C;iapReady=true;
  const list=GEM_PACKS.map(p=>({id:p.sku,type:ProductType.CONSUMABLE,platform:Platform.GOOGLE_PLAY}));
  list.push({id:ONE_TIME.starter.sku,type:ProductType.NON_CONSUMABLE,platform:Platform.GOOGLE_PLAY});
  list.push({id:ONE_TIME.noads.sku,type:ProductType.NON_CONSUMABLE,platform:Platform.GOOGLE_PLAY});
  list.push({id:ONE_TIME.sunset.sku,type:ProductType.NON_CONSUMABLE,platform:Platform.GOOGLE_PLAY});
  store.register(list);
  store.when()
    .productUpdated(pr=>{const p=GEM_PACKS.find(x=>x.sku===pr.id);const price=pr.pricing&&pr.pricing.price;if(!price)return;if(p)p.price=price;Object.values(ONE_TIME).forEach(o=>{if(o.sku===pr.id)o.price=price;});
      if(pr.owned)iapGrant(pr.id,null);})
    .approved(tr=>{(tr.products||[]).forEach(it=>iapGrant(it.id,(tr.transactionId||'t'+now())+it.id));tr.finish();});
  store.error(e=>{if(e&&e.code!==C.ErrorCode.PAYMENT_CANCELLED)toast(L('Store error — please try again','Erreur de la boutique — réessaie'),'err');});
  store.initialize([Platform.GOOGLE_PLAY]);
}
document.addEventListener('deviceready',iapInit,false);
function iapBuy(sku,label){

  if(st){const pr=st.get(sku),offer=pr&&pr.getOffer();if(!offer){toast(L('Store is still loading — try again soon','La boutique se charge — réessaie bientôt'),'err');return;}offer.order();return;}
  openModal('<div class="big">🛍️</div><h3>'+label+'</h3><p>'+L('Purchases work in the Android app through Google Play.','Les achats fonctionnent dans l’appli Android avec Google Play.')+'</p><button class="btn wide ghost" id="iapOk">OK</button>');
  $('iapOk').onclick=()=>{sfx('tap');closeModal();};
}

/* ======================= POLLEN MATCH ======================= */
const FL=[{c:'#ff8fbf',p:5,k:'round'},{c:'#ffd23a',p:8,k:'thin'},{c:'#9b7fe0',p:4,k:'round'},{c:'#ff8a3a',p:12,k:'thin'},{c:'#7fd0ff',p:6,k:'heart'}];
function drawFlowerTile(c,x,y,r,t,sc){
  const f=FL[t];c.save();c.translate(x,y);c.scale(sc,sc);
  for(let i=0;i<f.p;i++){const a=i/f.p*Math.PI*2;c.save();c.rotate(a);c.fillStyle=i%2?f.c:shade(f.c,.18);
    if(f.k==='thin')ell(c,r*.55,0,r*.42,r*.14);else if(f.k==='heart')ell(c,r*.5,0,r*.42,r*.3);else ell(c,r*.5,0,r*.45,r*.32);c.fill();c.restore();}
  c.fillStyle=t===1?'#a0501e':'#ffe680';circ(c,0,0,r*.28);c.fill();
  c.fillStyle='rgba(255,255,255,.5)';circ(c,-r*.08,-r*.08,r*.08);c.fill();
  c.restore();
}
function pollenStart(){
  const lv=S.mg.pollen, COLS=7, ROWS=8;
  const ta=lv%5, tb=(lv+2)%5;
  const goal=[{t:ta,n:Math.min(30,8+lv*2),got:0},{t:tb,n:Math.min(30,6+lv*2),got:0}];
  G={kind:'pollen',lv,COLS,ROWS,goal,moves:Math.min(25,16+Math.floor(lv/3)),grid:[],sel:null,busy:false,combo:0,pop:[],shake:null};
  const rt=()=>Math.floor(Math.random()*5);
  for(let r=0;r<ROWS;r++){G.grid[r]=[];for(let c=0;c<COLS;c++){let t;do{t=rt();}while((c>=2&&G.grid[r][c-1].t===t&&G.grid[r][c-2].t===t)||(r>=2&&G.grid[r-1][c].t===t&&G.grid[r-2][c].t===t));G.grid[r][c]={t,y:r-ROWS-2,s:1};}}
  $('gTitle').textContent='🌼 '+L('Pollen Match','Pollen en folie')+' · '+L('Lv','Niv')+' '+lv;
  const cell=()=>Math.min(GW/COLS,(GH-10)/ROWS);
  const ox=()=>(GW-cell()*COLS)/2, oy=()=>(GH-cell()*ROWS)/2;
  const foot=()=>{$('gScore').textContent='👆 '+G.moves;$('gFoot').innerHTML=G.goal.map(g=>'<span style="display:inline-flex;align-items:center;gap:4px;margin:0 10px;font-size:18px;font-weight:700"><canvas width="56" height="56" style="width:28px;height:28px" data-ft="'+g.t+'"></canvas>'+Math.min(g.got,g.n)+'/'+g.n+(g.got>=g.n?' ✅':'')+'</span>').join('')+'<div style="font-size:13px;opacity:.75;margin-top:4px">'+L('Swap two flowers next to each other to make a line of 3.','Échange deux fleurs voisines pour faire une ligne de 3.')+'</div>';
    $('gFoot').querySelectorAll('[data-ft]').forEach(cv=>drawFlowerTile(cv.getContext('2d'),28,28,24,+cv.dataset.ft,1));};
  foot();
  const findMatches=()=>{const m=new Set();
    for(let r=0;r<ROWS;r++){let run=1;for(let c=1;c<=COLS;c++){if(c<COLS&&G.grid[r][c].t===G.grid[r][c-1].t)run++;else{if(run>=3)for(let k=c-run;k<c;k++)m.add(r*COLS+k);run=1;}}}
    for(let c=0;c<COLS;c++){let run=1;for(let r=1;r<=ROWS;r++){if(r<ROWS&&G.grid[r][c].t===G.grid[r-1][c].t)run++;else{if(run>=3)for(let k=r-run;k<r;k++)m.add(k*COLS+c);run=1;}}}
    return m;};
  const hasMove=()=>{for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){for(const [dr,dc] of [[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(r2>=ROWS||c2>=COLS)continue;
    const a=G.grid[r][c],b=G.grid[r2][c2];[a.t,b.t]=[b.t,a.t];const ok=findMatches().size>0;[a.t,b.t]=[b.t,a.t];if(ok)return true;}}return false;};
  const settled=()=>G.grid.every((row,r)=>row.every(t=>Math.abs(t.y-r)<.01));
  let phase='idle',popT=0,popSet=null;
  const resolve=()=>{const m=findMatches();
    if(!m.size){G.busy=false;phase='idle';G.combo=0;
      if(G.goal.every(g=>g.got>=g.n)){const first=G.lv===5&&!S.decor.pebble;S.mg.pollen++;setTimeout(()=>gameEnd(L('Level complete!','Niveau réussi !'),Math.min(1,.75+G.moves*.03),'<p>'+L('Moves left','Coups restants')+': '+G.moves+'</p>',G.lv>=5?'pebble':null),400);return;}
      if(G.moves<=0){const pr=G.goal.reduce((a,g)=>a+Math.min(1,g.got/g.n),0)/2;setTimeout(()=>gameEnd(L('Out of moves','Plus de coups'),pr*.5,'<p>'+L('So close! Try again.','Presque ! Réessaie.')+'</p>'),400);return;}
      if(!hasMove()){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)G.grid[r][c].t=Math.floor(Math.random()*5);if(findMatches().size){resolve();return;}toast(L('Shuffle!','Mélange !'));}
      return;}
    G.combo++;sfx('match');popSet=m;popT=.22;phase='pop';
    m.forEach(i=>{const t=G.grid[Math.floor(i/COLS)][i%COLS].t;G.goal.forEach(g=>{if(g.t===t)g.got++;});});
    foot();
  };
  const afterPop=()=>{
    for(let c=0;c<COLS;c++){const col=[];for(let r=ROWS-1;r>=0;r--){if(!popSet.has(r*COLS+c))col.push(G.grid[r][c]);}
      let miss=ROWS-col.length;for(let k=0;k<miss;k++)col.push({t:Math.floor(Math.random()*5),y:-1-k,s:1});
      for(let r=ROWS-1,i=0;r>=0;r--,i++){G.grid[r][c]=col[i];G.grid[r][c].s=1;}}
    phase='fall';
  };
  const trySwap=(a,b)=>{
    if(G.busy||G.over)return;
    if(Math.abs(a.r-b.r)+Math.abs(a.c-b.c)!==1)return;
    const A=G.grid[a.r][a.c],B=G.grid[b.r][b.c];
    G.grid[a.r][a.c]=B;G.grid[b.r][b.c]=A;
    if(!findMatches().size){G.grid[a.r][a.c]=A;G.grid[b.r][b.c]=B;G.shake={a,b,t:.3};sfx('err');G.sel=null;return;}
    G.moves--;G.sel=null;G.busy=true;sfx('tap');foot();phase='fall';
  };
  let downAt=null;
  G.down=p=>{const s=cell(),c=Math.floor((p.x-ox())/s),r=Math.floor((p.y-oy())/s);if(r<0||c<0||r>=ROWS||c>=COLS)return;
    audioStart();downAt={r,c,x:p.x,y:p.y,used:false};
    if(G.sel&&(G.sel.r!==r||G.sel.c!==c)&&Math.abs(G.sel.r-r)+Math.abs(G.sel.c-c)===1){trySwap(G.sel,{r,c});downAt.used=true;return;}
    G.sel={r,c};};
  G.move=p=>{if(!downAt||downAt.used)return;const dx=p.x-downAt.x,dy=p.y-downAt.y;if(Math.hypot(dx,dy)<cell()*.4)return;
    const to=Math.abs(dx)>Math.abs(dy)?{r:downAt.r,c:downAt.c+Math.sign(dx)}:{r:downAt.r+Math.sign(dy),c:downAt.c};
    downAt.used=true;if(to.r>=0&&to.c>=0&&to.r<ROWS&&to.c<COLS)trySwap({r:downAt.r,c:downAt.c},to);};
  G.up=()=>{downAt=null;};
  G.tick=dt=>{
    G.grid.forEach((row,r)=>row.forEach(t=>{if(t.y<r)t.y=Math.min(r,t.y+dt*12);}));
    if(G.shake){G.shake.t-=dt;if(G.shake.t<=0)G.shake=null;}
    if(phase==='pop'){popT-=dt;if(popT<=0)afterPop();}
    else if(phase==='fall'&&settled()){phase='check';resolve();}
  };
  G.draw=()=>{
    const c=GX,s=cell(),x0=ox(),y0=oy();
    c.fillStyle='#163a24';c.fillRect(0,0,GW,GH);
    c.fillStyle='rgba(255,255,255,.06)';for(let r=0;r<ROWS;r++)for(let k=0;k<COLS;k++)if((r+k)%2===0)c.fillRect(x0+k*s,y0+r*s,s,s);
    c.save();c.beginPath();c.rect(x0,y0,s*COLS,s*ROWS);c.clip();
    G.grid.forEach((row,r)=>row.forEach((t,k)=>{
      let sc=1,dx=0;
      if(phase==='pop'&&popSet&&popSet.has(r*COLS+k))sc=Math.max(.01,popT/.22);
      if(G.shake&&((G.shake.a.r===r&&G.shake.a.c===k)||(G.shake.b.r===r&&G.shake.b.c===k)))dx=Math.sin(G.shake.t*60)*5;
      const cx=x0+k*s+s/2+dx,cy=y0+t.y*s+s/2;
      if(G.sel&&G.sel.r===r&&G.sel.c===k){c.fillStyle='rgba(255,255,255,.28)';c.beginPath();c.roundRect?c.roundRect(x0+k*s+2,y0+r*s+2,s-4,s-4,10):c.rect(x0+k*s+2,y0+r*s+2,s-4,s-4);c.fill();sc*=1.08;}
      drawFlowerTile(c,cx,cy,s*.42,t.t,sc);
    }));
    c.restore();
  };
}

/* ======================= FIREFLY MEMORY ======================= */
function fireStart(){
  G={kind:'fire',round:1,seq:[],inp:0,state:'wait',t:0,flash:-1,flashT:0,tapFlash:{},msg:''};
  $('gTitle').textContent='✨ '+L('Firefly Memory','Mémoire des lucioles');
  const pos=i=>{const cs=Math.min(GW,GH)/3.2;return{cx:GW/2+((i%3)-1)*cs,cy:GH/2+(Math.floor(i/3)-1)*cs,r:cs*.42};};
  const foot=t=>{$('gScore').textContent=L('Round','Manche')+' '+G.round;$('gFoot').innerHTML=t;};
  const speed=()=>({on:Math.max(.22,.6-.035*G.round),gap:Math.max(.12,.3-.015*G.round)});
  const newRound=()=>{G.seq.push(Math.floor(Math.random()*9));while(G.seq.length<G.round+1)G.seq.push(Math.floor(Math.random()*9));G.inp=0;G.state='show';G.i=0;G.t=.8;foot(L('Watch the fireflies…','Regarde les lucioles…'));};
  G.tick=dt=>{
    for(const k in G.tapFlash){G.tapFlash[k]-=dt;if(G.tapFlash[k]<=0)delete G.tapFlash[k];}
    if(G.state==='wait'){G.state='pre';G.t=.6;newRound();}
    if(G.state==='show'){G.t-=dt;
      if(G.t<=0){if(G.flash>=0){G.flash=-1;G.t=speed().gap;G.i++;}
        else if(G.i<G.seq.length){G.flash=G.seq[G.i];G.t=speed().on;noteSfx(G.flash);}
        else{G.state='input';foot(L('Your turn! Tap them in the same order.','À toi ! Touche-les dans le même ordre.'));}}}
    if(G.state==='next'){G.t-=dt;if(G.t<=0){G.round++;newRound();}}
  };
  G.down=p=>{if(G.state!=='input'||G.over)return;audioStart();
    for(let i=0;i<9;i++){const q=pos(i);if(Math.hypot(p.x-q.cx,p.y-q.cy)<q.r*1.1){
      G.tapFlash[i]=.25;noteSfx(i);
      if(i===G.seq[G.inp]){G.inp++;if(G.inp>=G.seq.length){G.state='next';G.t=.9;foot('✨ '+L('Great!','Bravo !'));if(G.round>S.mg.fire)S.mg.fire=G.round;}}
      else{G.state='end';foot('');S.mg.fire=Math.max(S.mg.fire,G.round-1);const done=G.round-1;
        setTimeout(()=>gameEnd(L('You remembered','Tu as retenu')+' '+done+' '+L('rounds','manches'),Math.min(1,done/10),'<p>'+L('Best','Record')+': '+S.mg.fire+'</p>',done>=8?'starjar':null),500);}
      return;}}};
  G.draw=()=>{
    const c=GX;const g=c.createLinearGradient(0,0,0,GH);g.addColorStop(0,'#060a1c');g.addColorStop(1,'#14261a');c.fillStyle=g;c.fillRect(0,0,GW,GH);
    for(let i=0;i<40;i++){c.fillStyle='rgba(255,255,255,'+(.2+((i*37)%10)/20)+')';circ(c,(i*97)%GW,(i*53)%(GH*.4),1);c.fill();}
    for(let i=0;i<9;i++){const q=pos(i),cx=q.cx,cy=q.cy;
      const lit=G.flash===i||G.tapFlash[i];
      if(lit){const gg=c.createRadialGradient(cx,cy,0,cx,cy,q.r*1.4);gg.addColorStop(0,'rgba(220,255,110,.8)');gg.addColorStop(1,'rgba(220,255,110,0)');c.fillStyle=gg;circ(c,cx,cy,q.r*1.4);c.fill();}
      c.fillStyle='rgba(255,255,255,.05)';circ(c,cx,cy,q.r);c.fill();
      drawBug(c,SP.firefly,cx,cy,q.r*1.7,-Math.PI/2+Math.sin(tGlobal+i)*.2,tGlobal+i,{glow:!!lit,night:!!lit});
    }
  };
}

/* ======================= WING COLORING ======================= */
const PAL={O:'#f08a1c',K:'#1c1712',W:'#f7f5ea',B:'#2a8af0',R:'#e2452b',Y:'#f6d64a',N:'#8a5a34',P:'#f28ab8'};
const WPAT=[
  {sp:'monarch',p:'OOKOKWW'},{sp:'bluemorpho',p:'BBKBKWW'},{sp:'redadmiral',p:'KRKKRWK'},{sp:'cabbagewhite',p:'WWKWWKW'},
  {sp:'tigerswallow',p:'YKYYKYB'},{sp:'peacock',p:'RRNRNBB'},{sp:'rosymaple',p:'PYPYPYP'}
];
function colorStart(){
  const pat=WPAT[(S.mg.colorN||0)%WPAT.length];S.mg.colorN=(S.mg.colorN||0)+1;
  G={kind:'color',pat,fill:[null,null,null,null,null,null,null],cur:'O'};
  $('gTitle').textContent='🎨 '+L('Wing Coloring','Coloriage d’ailes');
  $('gScore').textContent=N(SP[pat.sp].n);
  /* wing geometry in a 200 x 170 box (right side; mirrored for left) */
  const fore=new Path2D('M102 72 C118 30 160 8 192 16 C198 40 188 64 178 80 C150 84 124 82 102 80 Z');
  const hind=new Path2D('M102 82 C130 82 166 90 166 112 C165 136 140 160 116 156 C106 146 102 124 102 98 Z');
  const REG=[ // [wing, polygon]
    [fore,[[100,0],[136,0],[126,100],[100,100]]],
    [fore,[[136,0],[166,0],[156,100],[126,100]]],
    [fore,[[166,0],[220,0],[220,100],[156,100]]],
    [hind,[[100,80],[138,80],[128,170],[100,170]]],
    [hind,[[138,80],[220,80],[220,170],[128,170]]]
  ];
  const SPOT1=[[182,26],[176,46],[186,56]], SPOT2=[[150,128],[138,144],[156,110]];
  const geo=()=>{const sc=Math.min(GW*.9/190,(GH*.62)/150);return{sc,ox:GW/2-110*sc,oy:GH*.3+(GH*.68-150*sc)/2-8*sc};};
  const regPath=i=>{const p=new Path2D();REG[i][1].forEach((q,k)=>k?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]));p.closePath();return p;};
  const spotsPath=list=>{const p=new Path2D();list.forEach(s=>{p.moveTo(s[0]+6,s[1]);p.arc(s[0],s[1],6,0,Math.PI*2);});return p;};
  const paths=[0,1,2,3,4].map(regPath).concat([spotsPath(SPOT1),spotsPath(SPOT2)]);
  const drawWing=(c,fills,ox,oy,sc,outline)=>{
    [1,-1].forEach(side=>{
      c.save();c.translate(ox+110*sc,oy);c.scale(side*sc,sc);c.translate(-100,0);
      for(let i=0;i<5;i++){c.save();c.clip(REG[i][0]);c.fillStyle=fills[i]?PAL[fills[i]]:'#ffffff';c.fill(paths[i]);c.restore();}
      [5,6].forEach(i=>{c.save();c.clip(i===5?fore:hind);c.fillStyle=fills[i]?PAL[fills[i]]:'#ffffff';c.fill(paths[i]);c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1;c.stroke(paths[i]);c.restore();});
      if(outline){c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=1;[0,1,3].forEach(i=>{c.save();c.clip(REG[i][0]);c.stroke(paths[i]);c.restore();});}
      c.strokeStyle='#2a2018';c.lineWidth=2.4;c.stroke(fore);c.stroke(hind);
      c.restore();
    });
    c.fillStyle='#2a2018';ell(c,ox+110*sc,oy+95*sc,4*sc,40*sc);c.fill();circ(c,ox+110*sc,oy+50*sc,5*sc);c.fill();
    [1,-1].forEach(s=>qline(c,ox+110*sc,oy+46*sc,ox+(110+s*8)*sc,oy+30*sc,ox+(110+s*16)*sc,oy+20*sc,1.5*sc,'#2a2018'));
  };
  const foot=()=>{
    $('gFoot').innerHTML='<div class="swatches">'+Object.keys(PAL).map(k=>'<button class="sw'+(G.cur===k?' on':'')+'" data-k="'+k+'" style="background:'+PAL[k]+'"></button>').join('')+'</div><button class="btn wide" id="cDone" style="margin-top:10px">✓ '+L('Done','Terminé')+'</button>';
    $('gFoot').querySelectorAll('.sw').forEach(b=>b.onclick=()=>{G.cur=b.dataset.k;sfx('tap');foot();});
    $('cDone').onclick=()=>{if(G.over)return;const ok=G.fill.filter((f,i)=>f===pat.p[i]).length,pct=Math.round(ok/7*100);
      S.mg.color=Math.max(S.mg.color,pct);gameEnd(pct+'% '+L('match!','de ressemblance !'),pct/100,'<p>'+N(SP[pat.sp].n)+'</p>',pct>=95?'goldbloom':null);};
  };
  foot();
  G.down=p=>{audioStart();const g=geo();
    // which side? map to right-side coords
    let lx=(p.x-g.ox)/g.sc-110, ly=(p.y-g.oy)/g.sc;lx=Math.abs(lx)+100;
    const c=GX;c.save();c.setTransform(1,0,0,1,0,0);
    for(let i=6;i>=0;i--){const wing=i===5||i<3?fore:hind;
      if(c.isPointInPath(wing,lx,ly)&&c.isPointInPath(paths[i],lx,ly)){G.fill[i]=G.cur;sfx('bandage');c.restore();return;}}
    c.restore();
  };
  G.draw=()=>{
    const c=GX;c.setTransform(Math.min(2,window.devicePixelRatio||1),0,0,Math.min(2,window.devicePixelRatio||1),0,0);
    c.fillStyle='#e9f2dc';c.fillRect(0,0,GW,GH);
    // target (small, top-left)
    const ts=Math.min(GW*.5/190,GH*.24/160),bw=200*ts,bh=GH*.27,bx=GW/2-bw/2;
    c.fillStyle='#fff';c.strokeStyle='#c8d4b4';c.lineWidth=2;c.beginPath();c.rect(bx-8,6,bw+16,bh);c.fill();c.stroke();
    drawWing(c,pat.p.split(''),GW/2-110*ts,4,ts,false);
    c.fillStyle='#33402c';c.font='bold 14px Lexend,sans-serif';c.textAlign='center';c.fillText('👆 '+L('Copy this pattern!','Recopie ce motif !'),GW/2,bh-6);
    const g=geo();drawWing(c,G.fill,g.ox,g.oy,g.sc,true);
  };
}

/* =====================================================================
   BUGGIES — start-up & main loop
===================================================================== */
(function init(){
  S=load();
  const first=!S;
  if(first){
    S=fresh();
    ['cabbagewhite','honeybee'].forEach(id=>{const b=makeBug(id);delete b._new;b.h='g';b.hun=55;S.bugs.push(b);});
  }
  document.documentElement.lang=S.lang;
  resize();window.addEventListener('resize',()=>{resize();if($('game').classList.contains('open'))sizeGame();});
  ensureQuests();
  if(!first)catchUp();
  drawTabs();refreshUI();
  if(S.tut<99)setTimeout(tutShow,700);
  adsInit();
  let lt=performance.now(),acc=0,uiT=0,saveT=0;
  const loop=t=>{
    const dt=Math.min(.1,(t-lt)/1000);lt=t;
    acc+=dt;if(acc>=.25){simTick(acc,false);acc=0;}
    uiT+=dt;if(uiT>1){uiT=0;refreshHUD();refreshRow2();refreshActions();}
    saveT+=dt;if(saveT>10){saveT=0;save();}
    if(!$('game').classList.contains('open'))render(dt);
    drawTalk();
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  window.addEventListener('pagehide',save);
  document.addEventListener('pointerdown',()=>audioStart(),{once:true});
})();
