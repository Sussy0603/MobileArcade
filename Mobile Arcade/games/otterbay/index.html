<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#dff4fb">
<title>Otter Bay</title>
<style>
/* =====================================================================
   OTTER BAY — styles
   Soft ocean pastels. Change the colors here to restyle the whole game.
===================================================================== */
:root{
  --sea:#bfe9f2; --sea2:#3fb8c9; --sand:#fff1d6; --sand2:#f2c879; --coral:#ff9a8b; --coral2:#f0705e;
  --lav:#e6defc; --lav2:#9d86f0; --mint:#ccf3e4; --mint2:#3fbf9f; --sky:#d8f0ff; --sky2:#5aaee8;
  --ink:#33475b; --ink2:#6b7f92; --card:#fffefb; --line:#d9ecf2;
  --gold:#ffc83d; --good:#3fbf8f; --bad:#ff6b7d;
  --r:18px; --font:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --fs:1; --os:clamp(84px,27vw,124px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#eaf7fb;color:var(--ink);font-family:var(--font);font-size:calc(15px * var(--fs))}
body.easy{--font:Verdana,"Segoe UI",Tahoma,sans-serif;letter-spacing:.04em;word-spacing:.12em;line-height:1.5}
body.easy b,body.easy .nm{letter-spacing:.03em}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
input{font-family:inherit;font-size:16px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.pearl{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:-.12em;background:radial-gradient(circle at 32% 30%,#fff 0 18%,#f5eefa 30%,#d9cfe8 70%,#bfb2d6);box-shadow:0 1px 0 #0002}
.si{display:inline-block;width:1.3em;height:1.3em;vertical-align:-.3em}
.si svg{width:100%;height:100%}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:linear-gradient(#ffffff,#e3f6fb);border-bottom:2px solid #c3e7f1;z-index:20;flex-wrap:nowrap}
.pill{display:flex;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:4px 10px 4px 6px;font-weight:800;box-shadow:0 2px 0 #c7e3ec;white-space:nowrap;min-width:0}
.pill .ic{font-size:18px;display:grid;place-items:center}
.pill .ic .pearl{width:17px;height:17px}
.pill.lv{flex:1;max-width:200px;padding-right:8px;min-width:70px}
@media (max-width:430px){#boosts .bst:nth-child(n+3){display:none}.pill{padding:4px 7px 4px 5px}}
.xpbar{flex:1;height:9px;background:#e4f1f5;border-radius:9px;overflow:hidden;min-width:34px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sea2),var(--lav2));border-radius:9px;transition:width .4s}
#boosts{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden}
.bst{font-size:11px;font-weight:800;background:var(--sand);border-radius:99px;padding:3px 7px;white-space:nowrap}
.tbtn{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 0 #c7e3ec;display:grid;place-items:center;flex:none;overflow:hidden;font-size:20px}
#muteBtn{margin-left:auto}
#profBtn svg{width:52px;height:40px}
/* ---------- body / nav ---------- */
#body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#main{flex:1;position:relative;min-width:0;overflow:hidden}
#nav{display:flex;justify-content:space-around;background:#fff;border-top:2px solid #c3e7f1;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:14px;font-size:11.5px;font-weight:800;color:var(--ink2);position:relative}
#nav button .e{font-size:23px;line-height:1.1}
#nav button.on{background:var(--sea);color:var(--ink)}
.dot{position:absolute;top:2px;right:22%;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid #fff;display:none}
.dot.show{display:block}
@media (min-width:820px){
  #body{flex-direction:row-reverse}
  #nav{flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:2px solid #c3e7f1;padding:10px 8px;width:92px}
  #nav button{flex:none;padding:10px 0;font-size:12px}
  #nav button .e{font-size:28px}
  .view .inner{max-width:760px;margin:0 auto}
}
/* ---------- views ---------- */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding:12px 12px 30px;-webkit-overflow-scrolling:touch;background:#f1fafc}
.view.on{display:block}
#vBay{padding:0;overflow:hidden;background:#9fdcec}
h2{margin:4px 0 10px;font-size:1.35em}
h3{margin:14px 0 8px;font-size:1.05em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:9px 14px;border-radius:99px;background:#fff;font-weight:800;box-shadow:0 2px 0 var(--line)}
.tabs button.on{background:var(--sea);box-shadow:0 2px 0 #9fd6e3}
.card{background:var(--card);border-radius:var(--r);padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:8px;box-shadow:0 3px 0 var(--line);position:relative}
.card .art{width:62px;height:58px;flex:none;border-radius:14px;background:var(--sky);display:grid;place-items:center;font-size:32px;overflow:hidden}
.card .art svg{width:60px;height:46px}
.card .info{flex:1;min-width:0}
.nm{font-weight:900}
.sub{font-size:.85em;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{background:var(--card);border-radius:16px;padding:8px 4px 6px;text-align:center;box-shadow:0 3px 0 var(--line);position:relative;font-size:.85em;font-weight:800}
.tile svg{width:92px;height:62px;display:block;margin:0 auto}
.tile .big{font-size:38px;line-height:62px;height:62px}
.tile.lock{opacity:.55}
.tile .hearts{font-size:.8em;color:#ff7a90}
.btn{background:var(--coral);color:#fff;font-weight:900;padding:10px 15px;border-radius:14px;box-shadow:0 3px 0 var(--coral2);white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coral2)}
.btn.mint{background:var(--mint2);box-shadow:0 3px 0 #2c9a7e}
.btn.lav{background:var(--lav2);box-shadow:0 3px 0 #7660d4}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 3px 0 #d79d12}
.btn.sea{background:var(--sea2);box-shadow:0 3px 0 #2a92a2}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.wide{display:block;width:100%;margin-top:8px;padding:13px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.btn.sm{padding:7px 11px;font-size:.88em}
.tag{display:inline-block;font-size:.72em;font-weight:900;padding:2px 7px;border-radius:99px;background:var(--sand);vertical-align:middle}
.r0{background:#eceff3}.r1{background:#cfeaff}.r2{background:#e2d6ff}.r3{background:#ffe7a8}.r4{background:linear-gradient(90deg,#ffc3d8,#c9f3ff,#fff2a8)}
.bar{height:10px;border-radius:9px;background:#e6f0f3;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:9px}
.mood{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:.9em;font-weight:800}
.mood span{width:24px;text-align:center}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--ink2);font-size:.85em}
.center{text-align:center}
.lockic{position:absolute;top:4px;right:6px;font-size:13px}
/* ---------- bay scene ---------- */
#scene{position:absolute;inset:0;overflow:hidden;touch-action:manipulation;z-index:0}
#sceneBg{position:absolute;inset:0;width:100%;height:100%}
#props{position:absolute;inset:0;pointer-events:none}
#otters{position:absolute;inset:0}
.ot{position:absolute;width:var(--os);height:calc(var(--os) * .667);margin:calc(var(--os) * -.5) 0 0 calc(var(--os) * -.5);transform-origin:50% 70%;will-change:transform,left,top}
.ot .flip{width:100%;height:100%}
.ot .bob{width:100%;height:100%;transform-origin:50% 70%;position:relative}
.ot svg{width:100%;height:100%;overflow:visible;display:block}
.ot.swim .bob{animation:swim 1.3s ease-in-out infinite}
.ot.float .bob{animation:floaty 3s ease-in-out infinite}
.ot.nap .bob{animation:floaty 4.4s ease-in-out infinite}
.ot.juggle .bob{animation:floaty 1.6s ease-in-out infinite}
.ot.dive .bob{animation:dive 2.2s ease-in-out forwards}
.ot.pop .bob{animation:pop .35s ease}
.ot .zz{position:absolute;top:-4px;left:18%;font-size:15px;font-weight:900;color:#5a6fc9;animation:zz 2.2s infinite}
.ot .bub{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:17px;background:#fff;border-radius:12px;padding:0 5px;box-shadow:0 2px 0 #0001;white-space:nowrap}
.ot .kelpw{position:absolute;left:57%;right:9%;top:44%;height:22%;border-radius:12px;background:repeating-linear-gradient(100deg,#5aa860 0 7px,#7cc472 7px 12px);opacity:.92;pointer-events:none;box-shadow:0 2px 0 #0002}
.ot .pupw{position:absolute;left:31%;top:14%;width:46%;height:46%;pointer-events:none}
.ot .pupw svg{width:100%;height:100%}
.ot .jug{position:absolute;left:22%;top:-38%;width:58%;height:70%;pointer-events:none}
.ot .jug i{position:absolute;width:24%;height:30%;left:38%;top:70%;animation:jug 1.6s ease-in-out infinite}
.ot .jug i svg{width:100%;height:100%}
.ot .jug i:nth-child(2){animation-delay:-.53s}.ot .jug i:nth-child(3){animation-delay:-1.06s}
.ot .jug.glow i:first-child{filter:drop-shadow(0 0 6px #fff36b) drop-shadow(0 0 3px #fff)}
.ot .hand{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:16px;animation:zz 2.6s infinite}
@keyframes jug{0%{transform:translate(-90%,0)}25%{transform:translate(-40%,-190%)}50%{transform:translate(90%,0)}75%{transform:translate(40%,-190%)}100%{transform:translate(-90%,0)}}
@keyframes swim{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(3px) rotate(2deg)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-3px) rotate(1.5deg)}}
@keyframes dive{0%{transform:none;opacity:1}25%{transform:translateY(8px) rotate(-35deg);opacity:1}45%{transform:translateY(40px) rotate(-60deg);opacity:0}70%{transform:translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.2,.85)}70%{transform:scale(.92,1.1)}100%{transform:scale(1)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
.fx{position:absolute;pointer-events:none;font-size:20px;font-weight:900;z-index:30;animation:fxup 1.1s ease-out forwards;white-space:nowrap;text-shadow:0 2px 0 #fff}
@keyframes fxup{from{opacity:1;transform:translate(-50%,0) scale(.7)}30%{transform:translate(-50%,-14px) scale(1.15)}to{opacity:0;transform:translate(-50%,-54px) scale(1)}}
.splash{position:absolute;pointer-events:none;width:9px;height:9px;border-radius:50%;background:#fff;z-index:8;animation:spl .7s ease-out forwards}
@keyframes spl{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.wash{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:12;animation:washIn .6s ease,wob 1s ease-in-out .6s infinite alternate;filter:drop-shadow(0 0 6px #fff)}
.wash svg{width:100%;height:100%}
@keyframes washIn{from{transform:scale(0) translateY(20px)}to{transform:scale(1)}}
#sideL{position:absolute;left:8px;bottom:10px;display:flex;flex-direction:column;gap:9px;z-index:10}
#sideR{position:absolute;right:8px;bottom:10px;display:flex;flex-direction:column;gap:9px;z-index:10}
.fab{width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #0002;font-size:27px;display:grid;place-items:center;position:relative}
.fab svg{width:44px;height:44px}
.fab small{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;background:#fff;border-radius:6px;padding:0 4px;white-space:nowrap}
.fab .bdg{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;font-size:11px;font-weight:900;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 4px}
#areaName{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fffd;border-radius:99px;padding:6px 14px;font-weight:900;z-index:10;white-space:nowrap;display:flex;gap:6px;align-items:center}
#gran{position:absolute;top:52px;left:8px;z-index:10;width:62px;height:62px;border-radius:50%;background:#fffd;box-shadow:0 3px 0 #0002}
#gran svg{width:62px;height:62px}
#gran .bdg{position:absolute;top:-2px;right:-2px;background:var(--bad);color:#fff;border-radius:99px;font-size:12px;font-weight:900;width:21px;height:21px;display:grid;place-items:center;animation:wob .5s infinite alternate}
#x2chip{position:absolute;top:52px;right:8px;z-index:10;background:#fffd;border-radius:99px;padding:7px 11px;font-weight:900;box-shadow:0 3px 0 #0002;font-size:.9em}
@keyframes wob{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
#gull{position:absolute;z-index:15;width:74px;height:50px;display:none;filter:drop-shadow(0 0 10px #ffe066)}
#gull svg{width:74px;height:50px}
#nightTint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#141a55cc,#1d2a66aa);mix-blend-mode:multiply;opacity:0;transition:opacity 2s;z-index:5}
#weather{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.drop{position:absolute;top:-20px;width:2px;height:14px;background:#ffffffaa;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
#ring{position:absolute;z-index:40;display:none;transform:translate(-50%,-100%);background:#fff;border-radius:20px;padding:8px;box-shadow:0 6px 20px #0003;width:max-content;max-width:94vw}
#ring.on{display:block;animation:mIn .2s ease}
#ring .rt{font-weight:900;text-align:center;margin-bottom:6px;white-space:nowrap}
#ring .rb{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap}
#ring.below{transform:translate(-50%,0)}
#ring.below:after{bottom:auto;top:-8px;border-top:0;border-bottom:8px solid #fff;border-top-color:transparent}
#ring .rb button{width:54px;height:56px;flex:none;border-radius:16px;background:var(--sky);font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1.05}
#ring .rb button small{font-size:10px}
#ring .rb button.fav{background:var(--sand);outline:3px solid var(--gold)}
#ring:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
/* ---------- modal ---------- */
#modalBg{position:fixed;inset:0;background:#2a3e5266;display:none;z-index:50;align-items:center;justify-content:center;padding:14px}
#modalBg.on{display:flex}
#modal{background:#fff;border-radius:24px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:16px;box-shadow:0 10px 40px #0003;animation:mIn .25s ease;position:relative}
@keyframes mIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#ring.on{animation:none}
#modal h2{text-align:center;margin-top:0;padding:0 30px}
#mClose{position:absolute;top:8px;right:10px;font-size:22px;width:40px;height:40px;border-radius:50%;background:#eef6f8}
.reward{text-align:center}
.reward .big{font-size:60px;line-height:1.1}
.reward .big svg{width:150px;height:100px}
.reward .amt{font-size:1.5em;font-weight:900;margin:6px 0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.tst{background:#fff;border-radius:14px;padding:9px 14px;font-weight:800;box-shadow:0 4px 14px #0002;animation:tIn .3s ease;max-width:100%;text-align:center}
.tst.gold{background:var(--sand)}.tst.err{background:#ffe0e5}
@keyframes tIn{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
/* ---------- mini games ---------- */
#game{position:fixed;inset:0;z-index:60;background:#9fdcec;display:none;touch-action:none}
#game.on{display:block}
#gCanvas{position:absolute;inset:0;width:100%;height:100%}
#gHud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:2;font-weight:900;font-size:1.1em;gap:6px}
#gHud .pill{font-size:1em}
#gOver{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#2a3e5255;z-index:3;padding:16px}
#gOver.on{display:flex}
#gOver .box{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:360px;text-align:center}
#gIntro{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:4;padding:16px;background:#2a3e5244}
#gIntro.on{display:flex}
#gIntro .box{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:360px;text-align:center}
#memGrid{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(4,1fr);gap:9px;z-index:1}
.mc{width:min(20vw,78px);height:min(20vw,78px);border-radius:18px;background:#f7e7cf;box-shadow:0 4px 0 #d9b98a;display:grid;place-items:center;font-size:min(10vw,38px);transition:transform .25s}
.mc svg{width:78%;height:78%}
.mc.up{background:#fff;box-shadow:0 4px 0 #cfe3ea}
.mc.done{background:var(--mint);box-shadow:none;transform:scale(.92)}
.mc .pearl{width:52%;height:52%}
/* ---------- loading ---------- */
#load{position:fixed;inset:0;z-index:100;background:linear-gradient(#fff6e6,#bfe9f2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .6s}
#load .logo{font-size:2.5em;font-weight:900;color:#2f9fb3;text-shadow:0 3px 0 #fff;letter-spacing:.02em}
#load .wd{width:170px;height:114px;animation:floaty 1.4s ease-in-out infinite}
#load .wd svg{width:100%;height:100%}
#load .tip{max-width:300px;text-align:center;font-weight:700;color:var(--ink2);padding:0 20px}
#load .lbar{width:200px;height:10px;background:#fff;border-radius:9px;overflow:hidden}
#load .lbar i{display:block;height:100%;width:0;background:var(--sea2);transition:width .3s}
/* ---------- tutorial ---------- */
#tut{position:fixed;left:8px;right:8px;top:calc(124px + env(safe-area-inset-top));z-index:45;display:none;pointer-events:none}
#tut.on{display:flex;justify-content:center}
#tut .box{pointer-events:auto;background:#fff;border-radius:20px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px #0003;max-width:460px;width:100%;border:3px solid var(--sand2)}
#tut svg{width:58px;height:58px;flex:none}
#tut .tx{flex:1;font-weight:800;font-size:.95em}
.hl{outline:4px solid var(--gold)!important;outline-offset:2px;animation:hlp 1s infinite alternate;z-index:44}
@keyframes hlp{from{outline-color:var(--gold)}to{outline-color:var(--coral)}}
/* ---------- map ---------- */
#mapWrap{position:relative;width:100%;aspect-ratio:1/1.2;max-width:min(540px,calc((100vh - 220px)/1.2));margin:0 auto;border-radius:24px;overflow:hidden;box-shadow:0 4px 0 #7cbfd0}
#mapWrap svg.mapbg{position:absolute;inset:0;width:100%;height:100%}
.mArea{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:.8em;font-weight:900;width:110px}
.mArea .blob{width:78px;height:62px;margin:0 auto;border-radius:50% 50% 46% 54%;display:grid;place-items:center;font-size:30px;box-shadow:0 4px 0 #0002;border:3px solid #fff}
.mArea.lock .blob{filter:grayscale(.8);opacity:.75}
.mArea.here .blob{border-color:var(--gold);box-shadow:0 0 0 4px #fff8,0 4px 0 #0002}
.mArea .lbl{background:#fffe;border-radius:10px;padding:2px 6px;display:inline-block;margin-top:3px}
.seg{display:flex;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.seg button{flex:1;padding:10px 6px;font-weight:800}
.seg button.on{background:var(--sea)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:8px 0}
.cal div{background:#f1f7f9;border-radius:12px;padding:6px 2px;text-align:center;font-size:.75em;font-weight:900}
.cal div.done{background:var(--mint)}.cal div.today{background:var(--sand);outline:3px solid var(--gold)}
.cal div b{display:block;font-size:1.6em;line-height:1.3}
</style>
</head>
<body>
<div id="load">
  <div class="logo">Otter Bay</div>
  <div class="wd" id="loadOtter"></div>
  <div class="lbar"><i id="loadBar"></i></div>
  <div class="tip" id="loadTip"></div>
</div>
<div id="app">
  <div id="top">

function weighted(odds){ let s = odds.reduce((a, b) => a + b, 0), r = Math.random() * s; for(let i=0;i<odds.length;i++){ r -= odds[i]; if(r < 0) return i; } return odds.length - 1; }
function fmt(n){
  n = Math.floor(n || 0); if(n < 1000) return String(n);
  const u = ['K','M','B','T','Qa','Qi','Sx','Sp']; let i = -1;
  while(n >= 1000 && i < u.length - 1){ n /= 1000; i++; }
  return (n >= 100 ? Math.floor(n) : n >= 10 ? (Math.floor(n * 10) / 10) : (Math.floor(n * 100) / 100)) + u[i];
}
function fmtTime(sec){
  sec = Math.max(0, Math.ceil(sec));
  if(sec < 60) return sec + 's';
  const m = Math.floor(sec / 60), s = sec % 60;
  if(m < 60) return m + 'm' + (s ? ' ' + s + 's' : '');
  const h = Math.floor(m / 60); if(h < 48) return h + 'h ' + (m % 60) + 'm';
  return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}
function dayNum(t){ const d = new Date(t); return Math.floor((t - d.getTimezoneOffset() * 60000) / 86400000); }

  const d = newState();
  for(const k in d) if(o[k] === undefined) o[k] = d[k];

/* ---------- time helpers (real phone clock) ---------- */
function phaseOf(t){
  const h = new Date(t || now()).getHours();
  if(h >= CONFIG.SUNRISE && h < CONFIG.DAY) return 'sunrise';
  if(h >= CONFIG.DAY && h < CONFIG.SUNSET) return 'day';
  if(h >= CONFIG.SUNSET && h < CONFIG.NIGHT) return 'sunset';
  return 'night';
}
const isNight = t => phaseOf(t) === 'night';
function easterDate(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da);
}
/* which holiday is on right now (1 week each) */
function activeEvent(t){
  if(CONFIG.EVENT_TEST) return CONFIG.EVENT_TEST;
  const d = new Date(t || now()), y = d.getFullYear(), md = (d.getMonth() + 1) * 100 + d.getDate();
  if(md >= 208 && md <= 214) return 'valentine';
  if(md >= 1025 && md <= 1031) return 'halloween';
  if(md >= 1219 && md <= 1225) return 'christmas';
  const e = easterDate(y), start = new Date(y, e.getMonth(), e.getDate() - 6), end = new Date(y, e.getMonth(), e.getDate() + 1);
  if(d >= start && d < end) return 'easter';
  return null;
}

/* =====================================================================
   3. LANGUAGE — tr('English text') gives French when French is chosen.
   To fix a French word, change it in FR (bottom of the file). Missing → English.
===================================================================== */
function L(o){ if(!o) return ''; return (S && S.lang === 'fr' && o.fr) ? o.fr : (o.en || ''); }
function tr(s, vars){
  let out = (S && S.lang === 'fr' && FR[s]) ? FR[s] : s;
  if(vars) for(const k in vars) out = out.split('{' + k + '}').join(vars[k]);
  return out;
}

===================================================================== */
const otterById = id => S.otters.find(o => o.id === id);
const ottersIn = a => S.otters.filter(o => o.a === a);
const moodAvg = d => (d.m.food + d.m.fun + d.m.nrg) / 3;
function hearts(d){ let h = 0; CONFIG.HEARTS.forEach((v, i) => { if(d.f >= v) h = i; }); return h; }
function heartProg(d){ const h = hearts(d); if(h >= 10) return 1; const a = CONFIG.HEARTS[h], b = CONFIG.HEARTS[h + 1]; return (d.f - a) / (b - a); }
function areaCap(a){ return CONFIG.AREA_CAP + S.ar[a].items.kelp * CONFIG.KELP_CAP; }
function areaBonus(a){ const it = S.ar[a].items; let b = 1; ITEM_IDS.forEach(k => b += ITEMS[k].bonus * it[k]); return b; }
function bestie(d){ const f = d.bf && otterById(d.bf); return f && f.bf === d.id ? f : null; }
function holdingHands(d){ const f = bestie(d); return !!(f && f.a === d.a && d.nap && f.nap); }
function globalMult(t){
  t = t || now();
  let m = 1 + CONFIG.TIDE_BONUS * S.tide;
  if(S.ad2x > t) m *= 2;
  if(S.rainbowUntil > t) m *= 1 + CONFIG.RAINBOW_BONUS;
  return m;
}
function otterRate(d, t){
  t = t || now();
  const K = KIND(d.k);
  let r = CONFIG.BASE_RATE * CONFIG.RARITY_MULT[d.r] * (1 + CONFIG.LV_BONUS * (d.lv - 1));
  r *= 1 + CONFIG.HEART_BONUS * hearts(d);
  r *= CONFIG.SAD_MIN + (1 - CONFIG.SAD_MIN) * moodAvg(d) / 100;
  r *= Math.pow(CONFIG.AREA_TIER_MULT, tierOf(d.a)) * areaBonus(d.a);
  if(d.pup) r *= CONFIG.PUP_EARN;
  if(d.per === 'greedy') r *= 1.2;
  if(d.wf > t) r *= d.wfm || 1;
  const f = bestie(d);
  if(f && f.a === d.a){ r *= 1 + CONFIG.BESTIE_BONUS + (d.per === 'shy' ? 0.1 : 0); if(d.nap && f.nap) r *= 1 + CONFIG.HOLD_HANDS_BONUS; }
  if(K.glow && phaseOf(t) === 'night') r *= CONFIG.NIGHT_GLOW;
  if(K.bonus) r *= 1 + K.bonus;
  return r;
}
function incomePerSec(t){ t = t || now(); const g = globalMult(t); return S.otters.reduce((s, d) => s + otterRate(d, t), 0) * g; }
function areaIncome(a){ const g = globalMult(); return ottersIn(a).reduce((s, d) => s + otterRate(d), 0) * g; }
const incomeFloor = () => Math.max(1, incomePerSec());
function addS(n){ S.s += n; if(n > 0) S.stats.shells += n; }
function canPay(cur, n){ return cur === 'p' ? S.p >= n : S.s >= n; }
function pay(cur, n){
  if(!canPay(cur, n)){ toast(cur === 'p' ? tr('Not enough pearls') : tr('Not enough shells'), 'err'); sfx('err'); return false; }
  if(cur === 'p') S.p -= n; else S.s -= n;
  return true;
}
const xpNeed = lv => Math.round(CONFIG.XP_BASE * Math.pow(lv, CONFIG.XP_POW));
function addXP(n){
  S.xp += n;
  while(S.xp >= xpNeed(S.lv)){
    S.xp -= xpNeed(S.lv); S.lv++;
    S.p += CONFIG.LEVEL_PEARLS;
    sfx('level');
    const unlock = levelUnlocks(S.lv);
    queueModal(() => showReward('⭐', tr('Level {n}!', {n:S.lv}), '+' + CONFIG.LEVEL_PEARLS + ' ' + PEARL + (unlock ? '<p>' + unlock + '</p>' : '')));
  }
}
function levelUnlocks(lv){
  const out = [];
  ITEM_IDS.forEach(k => { if(ITEMS[k].lv === lv) out.push(ITEMS[k].e + ' ' + L(ITEMS[k])); });
  FOOD_IDS.forEach(k => { if(FOODS[k].lv === lv) out.push(foodIcon(k) + ' ' + L(FOODS[k])); });
  CONFIG.AREA_LEVEL.forEach((l, i) => { if(l === lv) out.push(AREAS[i + 1].e + ' ' + L(AREAS[i + 1]) + ' ' + tr('can be opened')); });
  return out.length ? tr('New:') + ' ' + out.join(', ') : '';
}

/* ---------- making otters ---------- */
function newName(){
  const used = S.otters.map(o => o.n);
  const free = NAMES.filter(n => !used.includes(n));
  return pick(free.length ? free : NAMES);
}
/* pick a kind from an area by rarity (night-only kinds only at night) */
function rollKind(area, odds, opt){
  opt = opt || {};
  const night = isNight();
  const ev = S.ev.id;
  if(ev && opt.allowEvent && Math.random() < 0.25){ const k = KINDS.find(k => k.ev === ev); if(k) return k; }
  let r = weighted(odds);
  for(; r >= 0; r--){
    const pool = KINDS.filter(k => k.a === area && k.r === r && (!k.night || night));
    if(pool.length) return pick(pool);
  }
  return pick(KINDS.filter(k => k.a === area && k.r === 0));
}
function makeOtter(o){
  const K = KIND(o.k);
  const d = {
    id:S.nextId++, n:o.n || newName(), k:K.id, r:K.r, per:o.per || pick(PER_IDS), fav:o.fav || pick(SHELL_IDS),
    lv:1, f:o.f || 0, m:{food:80, fun:80, nrg:85}, a:o.a || S.cur, bf:null, pup:!!o.pup, grow:0, par:o.par || null,
    o:Object.assign({}, K.o || {}), wf:0, wfm:1, nap:0, born:now(),
  };
  S.otters.push(d);
  addToBook(d);
  return d;
}
function addToBook(d){
  const first = !S.book[d.k];
  S.book[d.k] = (S.book[d.k] || 0) + 1;
  if(first){
    // finished a book page?
    BOOK_PAGES.forEach(pg => {
      if(S.pagesDone[pg.id]) return;
      const ks = pageKinds(pg);
      if(ks.every(k => S.book[k])){ S.pagesDone[pg.id] = 1; S.p += 25; queueModal(() => showReward('📖', tr('Book page complete!'), pageName(pg) + '<br>+25 ' + PEARL)); }
    });
  }
  return first;
}
function pageKinds(pg){ return pg.kinds || KINDS.filter(k => k.a === pg.id).map(k => k.id); }
function pageName(pg){ const A = AREA(pg.id); return A ? A.e + ' ' + L(A) : pg.e + ' ' + L(pg); }
function feelText(d){
  const m = d.m;
  if(d.nap) return '💤 ' + tr('Napping');
  if(m.food < 30) return '🍽️ ' + tr('Hungry');
  if(m.nrg < 30) return '🥱 ' + tr('Sleepy');
  if(m.fun < 30) return '🥺 ' + tr('Bored');
  if(moodAvg(d) > 75) return '😊 ' + tr('Very happy');
  return '🙂 ' + tr('Happy');
}
function addLove(d, n){
  const h0 = hearts(d);
  d.f += n * (d.per === 'shy' ? 0.7 : 1);
  const h1 = hearts(d);
  if(h1 > h0){
    fxAtOtter(d, '💗 ' + h1, 300);
    if(h1 === 10) toast('💞 ' + esc(d.n) + ' ' + tr('loves you with all its heart!'), 'gold');
    addXP(4); qCount('heart', d.a);
  }
}

/* =====================================================================
   6. ART — everything is drawn in code (SVG), no image files.
   otterSVG(otter, {pose}) poses: 'float' (on its back), 'swim', 'nap',
   'holdU' / 'holdD' (holding hands while napping)
===================================================================== */
function shade(hex, amt){ // amt -1..1 (darker..lighter)
  let c = hex.replace('#', ''); if(c.length === 3) c = c.split('').map(x => x + x).join('');
  let r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}
function mix(a, b, p){ const A = shade(a, 0), B = shade(b, 0); const h = (s, i) => parseInt(s.slice(1 + i * 2, 3 + i * 2), 16);
  return '#' + [0, 1, 2].map(i => Math.round(h(A, i) * (1 - p) + h(B, i) * p).toString(16).padStart(2, '0')).join(''); }
let svgUid = 0;
function star(x, y, r, c){
  let p = '';
  for(let i=0;i<10;i++){ const a = Math.PI / 5 * i - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; p += (i ? 'L' : 'M') + (x + Math.cos(a) * rr).toFixed(1) + ' ' + (y + Math.sin(a) * rr).toFixed(1); }
  return '<path d="' + p + 'z" fill="' + c + '"/>';

  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}
/* a little otter squeak: two quick chirps */
function squeak(p){
  if(!soundOn() || !S.snd || !audio()) return;
  p = p || rnd(0.9, 1.2);
  const t = AC.currentTime;
  tone(1500 * p, 0.07, 'sine', 0.22, t, null, 2300 * p);
  tone(2100 * p, 0.09, 'sine', 0.18, t + 0.09, null, 1500 * p);
  if(Math.random() < 0.5) tone(1800 * p, 0.06, 'triangle', 0.1, t + 0.2, null, 2400 * p);
}
function noiseBuf(sec, brown){
  const A = AC, b = A.createBuffer(1, A.sampleRate * sec, A.sampleRate), d = b.getChannelData(0);
  let last = 0;
  for(let i=0;i<d.length;i++){ const w = Math.random() * 2 - 1; if(brown){ last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w; }
  return b;
}
function sfx(k){
  if(!soundOn() || !S.snd || !audio()) return;
  const A = AC, t = A.currentTime;
  switch(k){
    case 'tap': tone(660, 0.06, 'triangle', 0.15); break;
    case 'pop': tone(900, 0.08, 'sine', 0.3, t, null, 1600); break;
    case 'coin': tone(988, 0.08, 'square', 0.1); tone(1319, 0.14, 'square', 0.1, t + 0.07); break;
    case 'pearl': [1568, 2093, 2637].forEach((f, i) => tone(f, 0.18, 'sine', 0.18, t + i * 0.07)); break;
    case 'err': tone(220, 0.15, 'square', 0.08); tone(180, 0.18, 'square', 0.08, t + 0.1); break;
    case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.25, t + i * 0.09)); break;
    case 'combo': tone(700 + Math.random() * 500, 0.1, 'triangle', 0.25, t, null, 1400); break;
    case 'splash': {
      const n = A.createBufferSource(); n.buffer = noiseBuf(0.35);
      const f = A.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1300;
      const g = A.createGain(); g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      n.connect(f); f.connect(g); g.connect(sfxGain); n.start(); break;
    }
    case 'win': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.2, t + i * 0.1)); break;
    case 'whoosh': tone(300, 0.3, 'sine', 0.15, t, null, 900); break;
  }
}
/* ocean waves: slow rising and falling filtered noise. Rain adds a soft patter. */
function wavesStart(){
  if(!soundOn() || !S.waves || !audio() || AC.state !== 'running'){ return; }
  const rain = S.weather.k === 'rain';
  if(wavNodes.length && wavNodes.rain === rain) return;
  wavesStop();
  const A = AC, nodes = [];
  const layer = (brown, type, freq, base, depth, rate) => {
    const src = A.createBufferSource(); src.buffer = noiseBuf(6, brown); src.loop = true;
    const f = A.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = A.createGain(); g.gain.value = base;
    const lfo = A.createOscillator(), lg = A.createGain(); lfo.frequency.value = rate; lg.gain.value = depth;
    lfo.connect(lg); lg.connect(g.gain);
    src.connect(f); f.connect(g); g.connect(wavGain); src.start(); lfo.start();
    nodes.push(src, lfo);
  };
  layer(true, 'lowpass', 500, 0.10, 0.07, 0.09);   // deep swell
  layer(false, 'bandpass', 1100, 0.012, 0.010, 0.13); // foam
  if(rain) layer(false, 'highpass', 2500, 0.03, 0.006, 0.7);
  wavNodes = nodes; wavNodes.rain = rain;
}

      if(pair && d.id > f.id && actors[f.id]){
        // the back otter of a pair floats right behind the front one, paws together
        const fa = actors[f.id]; a.tx = fa.x + 1.2; a.ty = fa.y - otH(a) * 0.36 / sceneH * 100; a.back = true;
        a.x = a.tx; a.y = a.ty;
      } else {
        a.back = false;
        if(d.spot !== undefined && d.spot < kelpSpots()){ a.tx = NAP_POS[d.spot][0]; a.ty = NAP_POS[d.spot][1]; }
        else { a.tx = a.x; a.ty = a.y; }
      }
      a.mode = 'nap';
    } else {
      a.back = false;
      if(a.mode === 'nap'){ a.mode = 'float'; a.modeT = 2; a.key = ''; }
      a.modeT -= dt;
      if(a.mode === 'juggle'){
        if(t > a.jug.until) endJuggle(a, d);
        else if(t > a.jug.next){ a.jug.glow = t + CONFIG.JUGGLE_GLOW_MS; a.jug.next = t + rnd(1100, 2100); }
        const j = a.el.querySelector('.jug'); if(j) j.classList.toggle('glow', t < a.jug.glow);
      } else if(a.mode === 'dive'){
        if(a.modeT <= 0) endDive(a, d);
      } else {
        const dx = a.tx - a.x, dy = a.ty - a.y, dist = Math.hypot(dx, dy);
        if(dist < 0.6 || a.modeT <= 0){
          // choose what to do next
                    if(!d.pup && t > a.jugAt && d.m.nrg > 25){ startJuggle(a, d); }
          else if(!d.pup && t > a.diveAt && Math.random() < 0.35){ a.mode = 'dive'; a.modeT = 2.2; a.diveAt = t + rnd(20, 50) * 1000; sfx('splash'); }
          else if(Math.random() < 0.55){ a.mode = 'float'; a.modeT = rnd(3, 8); a.tx = clamp(a.x + rnd(-3, 3), a.y > 62 ? 24 : WATER.x0, a.y > 62 ? 76 : WATER.x1); a.ty = clamp(a.y + rnd(-2, 2), WATER.y0, WATER.y1); }
          else {
            a.mode = 'swim'; a.modeT = 12;
            const f = bestie(d);
            if(f && f.a === d.a && actors[f.id] && !f.nap && Math.random() < 0.6){ a.tx = clamp(actors[f.id].x + rnd(-8, 8), WATER.x0, WATER.x1); a.ty = clamp(actors[f.id].y + rnd(-5, 5), WATER.y0, WATER.y1); }
            else [a.tx, a.ty] = randWater();
          }
        }
        const sp = (a.mode === 'swim' ? 5.5 : 0.8) * dt * (d.pup ? 1.3 : 1);
        if(dist > 0.3){ const m = Math.min(dist, sp); a.x += dx / dist * m; a.y += dy / dist * m * 0.7; if(Math.abs(dx) > 0.5) a.flip = dx > 0; }
      }
    }
    const cls = a.mode === 'nap' ? 'nap' : a.mode;
    setCls(a, cls);
    drawActor(a, d);
    a.el.firstChild && (a.el.firstChild.style.transform = a.flip && a.mode !== 'nap' ? 'scaleX(-1)' : '');
    placeActor(a);
  });
  if(ringFor && actors[ringFor]) placeRing();
}
function startJuggle(a, d){
  a.mode = 'juggle'; a.modeT = CONFIG.JUGGLE_LEN_S;

}
function juggleTap(a, d){

function placeRing(){

  S.inv[k]--;

  addLove(d, CONFIG.FEED_LOVE);
  S.stats.feeds++; qCount('feed', d.a); addXP(2);
  if(!quiet){ squeak(1.2); fxAtOtter(d, '😋 ' + foodIcon(k)); }

}
function giveToy(d, k){

function toast(msg, kind){
  const t = document.createElement('div'); t.className = 'tst' + (kind ? ' ' + kind : ''); t.innerHTML = msg;
  const box = $('toast'); box.appendChild(t);
  while(box.children.length > 3) box.firstChild.remove();

}
let modalOnClose = null, modalQueue = [];

const QUEST_TYPES = {

  gull:  {en:'Catch the golden seagull {n} times', fr:'Attrape la mouette dorée {n} fois'},
};
const QUEST_PLAN = [
  [['pet',5],['feed',3],['wash',3],['build',2],['adopt',3],['toy',2],['gift',1],['combo',3]],
  [['pet',12],['adopt',2],['build',4],['feed',8],['wash',8],['combo',5],['heart',4],['game',2],['gull',1]],
  [['adopt',2],['pet',20],['build',6],['feed',12],['gift',4],['combo',6],['heart',5],['game',3],['gull',2]],
  [['adopt',2],['build',6],['pet',25],['wash',15],['toy',10],['combo',8],['heart',6],['game',4]],
  [['adopt',2],['build',8],['feed',20],['gift',8],['combo',10],['heart',7],['game',5],['gull',3]],
];
function questsFor(a){ return QUEST_PLAN[tierOf(a)].map(([k, n]) => ({k, n})); }
function curQuest(a){ const qs = questsFor(a); return S.ar[a].q < qs.length ? qs[S.ar[a].q] : null; }
function questText(q){ return tr(L(QUEST_TYPES[q.k]), {n:q.n}).replace('{n}', q.n); }
function qProgress(a, q){
  const A = S.ar[a];
  if(q.k === 'build') return ITEM_IDS.reduce((s, k) => s + A.items[k], 0);
  if(q.k === 'adopt') return ottersIn(a).length;
  if(q.k === 'heart') return Math.max(0, ...ottersIn(a).map(hearts));
  return A.cnt[q.k] || 0;
}
function qCount(k, a, val){
  a = a || S.cur; const A = S.ar[a]; if(!A) return;
  if(k === 'combo') A.cnt.combo = Math.max(A.cnt.combo || 0, val || 0);
  else A.cnt[k] = (A.cnt[k] || 0) + (val || 1);
  if(k === 'game' || k === 'gull'){ S.open.forEach(o => { if(o !== a) S.ar[o].cnt[k] = (S.ar[o].cnt[k] || 0) + 1; }); }
}
function questReady(a){ const q = curQuest(a); return q && qProgress(a, q) >= q.n; }
function questReward(a){ const i = S.ar[a].q, tier = tierOf(a); return {s:Math.round(Math.max(80 * (i + 1) * Math.pow(4, tier), incomeFloor() * 40 * (i + 1))), p:2 + tier, xp:10 + i * 3}; }

/* ---------- free gift box + daily streak ---------- */
function rollGift(){
  const r = Math.random();
  if(r < 0.1) return {p:rint(1, 2)};
  if(r < 0.3) return {sh:pick(SHELL_IDS)};
  if(r < 0.55) return {food:S.lv >= FOODS.fish.lv && Math.random() < 0.5 ? 'fish' : 'clam', n:S.lv >= 3 ? 3 : 4};
  return {s:Math.round(Math.max(60, incomeFloor() * 120))};
}
function giveGift(g){
  if(g.p){ S.p += g.p; return '+' + g.p + ' ' + PEARL; }
  if(g.sh){ S.shells[g.sh]++; return shellIc(g.sh) + ' ' + L(SHELLS[g.sh]); }
  if(g.food){ S.inv[g.food] += g.n; return '+' + g.n + ' ' + foodIcon(g.food) + ' ' + L(FOODS[g.food]); }
  addS(g.s); return '+' + fmt(g.s) + ' 🐚';
}
function openGift(){
  sfx('tap');
  const t = now();
  if(t < S.giftAt){ toast('🎁 ' + tr('Next gift in {t}', {t:fmtTime((S.giftAt - t) / 1000)})); return; }
  S.giftAt = t + CONFIG.GIFT_EVERY_MIN * 60000;
  const msg = giveGift(rollGift());
  sfx('win'); saveNow(); renderSide();
  showReward('🎁', tr('Free gift!'), msg);
}
function dailyReward(day){ // day 1..7
  if(day === 7) return {p:15, s:Math.round(Math.max(500, incomeFloor() * 600))};
  if(day === 3) return {sh:true, s:Math.round(Math.max(150, incomeFloor() * 200))};
  if(day === 5) return {food:true, s:Math.round(Math.max(250, incomeFloor() * 300))};
  return {s:Math.round(Math.max(100 * day, incomeFloor() * 100 * day)), p:day === 2 || day === 4 || day === 6 ? 2 : 0};
}
function dailyState(){
  const today = dayNum(now()), D = S.daily;
  const claimed = D.last === today;
  let streak = D.streak;
  if(!claimed && D.last !== today - 1) streak = 0;   // missed a day: start again
  return {today, claimed, streak, day:(claimed ? (streak - 1) % 7 : streak % 7) + 1};
}
function openDaily(){
  sfx('tap');
  const st = dailyState();
  let h = '<p class="center">' + tr('Come back every day for a bigger gift! Day 7 gives pearls.') + '</p><div class="cal">';
  for(let i=1;i<=7;i++){
    const done = i < st.day || (st.claimed && i === st.day), today = i === st.day && !st.claimed;
    const r = dailyReward(i);
    h += '<div class="' + (done ? 'done' : today ? 'today' : '') + '">' + tr('Day') + ' ' + i + '<b>' + (i === 7 ? PEARL : r.sh ? '🐚' : r.food ? '🦪' : r.p ? '💎'.replace('💎', PEARL) : '🐚') + '</b>' + (done ? '✔' : '') + '</div>';
  }
  h += '</div>';
  h += st.claimed ? '<p class="center muted">' + tr('Come back tomorrow!') + '</p>' : '<button class="btn wide gold" id="dlGo">🎁 ' + tr('Claim day {n}', {n:st.day}) + '</button>';
  h += '<p class="center muted">🔥 ' + tr('Streak') + ': ' + (st.claimed ? st.streak : st.streak) + '</p>';
  openModal('📅 ' + tr('Daily gift'), h);
  if($('dlGo')) $('dlGo').onclick = () => {
    const r = dailyReward(st.day); let msg = [];
    if(r.s){ addS(r.s); msg.push('+' + fmt(r.s) + ' 🐚'); }
    if(r.p){ S.p += r.p; msg.push('+' + r.p + ' ' + PEARL); }
    if(r.sh){ const k = pick(SHELL_IDS); S.shells[k]++; msg.push(shellIc(k) + ' ' + L(SHELLS[k])); }
    if(r.food){ S.inv.fish += 3; S.inv.clam += 5; msg.push('+5 🦪 +3 🐟'); }
    S.daily = {streak:st.streak + 1, last:st.today};
    sfx('win'); addXP(5); saveNow(); closeModal(); renderSide();
    showReward('📅', tr('Day {n}!', {n:st.day}), msg.join('<br>'));
  };
}

/* =====================================================================
   10. MINI GAMES — Catch the Fish, Find the Pearl, Shell Juggling
   Each game: init() sets things up, G.update(dt) moves things,
   G.draw(ctx) paints the screen. Shells won = points × your income.
===================================================================== */
let G = null;   // the running game
function svgImg(svg){ const i = new Image(); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); return i; }
function playerOtter(){ return (S.avatar && otterById(S.avatar)) || S.otters.find(d => !d.pup) || {k:'river', o:{}}; }
function startGame(id){
  sfx('tap'); closeRing(); audioUnlock();
  const g = GAMES.find(x => x.id === id);
  $('game').classList.add('on'); $('gOver').classList.remove('on'); $('memGrid').innerHTML = ''; $('gHud').innerHTML = '';
  const cv = $('gCanvas'), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  G = {id, ctx, W:innerWidth, H:innerHeight, t:0, score:0, parts:[], over:false, running:false, shake:0, last:performance.now()};
  ({fish:fishInit, pearl:pearlInit, juggle:juggleInit})[id]();
  G.draw && G.draw(ctx);
  $('gIntroBox').innerHTML = '<div style="font-size:54px">' + g.e + '</div><h2>' + L(g) + '</h2><p>' + L(g.d) + '</p><p class="muted">🏆 ' + tr('Best') + ': ' + (S.best[id] || 0) + '</p>' +
    '<button class="btn wide" id="giGo">▶ ' + tr('Start') + '</button><button class="btn wide ghost" id="giBack">' + tr('Back') + '</button>';
  $('gIntro').classList.add('on');
  $('giGo').onclick = () => { $('gIntro').classList.remove('on'); G.running = true; G.last = performance.now(); G.start && G.start(); requestAnimationFrame(gameLoop); };
  $('giBack').onclick = closeGame;
}
function gameLoop(ts){
  if(!G || !G.running) return;
  const dt = Math.min(0.05, (ts - G.last) / 1000); G.last = ts;
  G.t += dt;
  G.update(dt);
  G.parts = G.parts.filter(p => (p.life -= dt) > 0);
  G.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; });
  const ctx = G.ctx; ctx.save();
  if(G.shake > 0){ G.shake -= dt; ctx.translate(rnd(-5, 5), rnd(-5, 5)); }
  G.draw(ctx);
  G.parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1; ctx.restore();
  if(G && G.running) requestAnimationFrame(gameLoop);
}
function burst(x, y, c, n){ for(let i=0;i<(n || 10);i++){ const a = Math.random() * 7, s = rnd(60, 220); G.parts.push({x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s - 80, r:rnd(2, 5), c:c || '#fff', life:0.7, max:0.7}); } }
function hud(html){
  // only rebuild when something changed (so the ✕ button is easy to tap)
  if(G.hudH === html) return; G.hudH = html;
  if(!$('gQuit')){ $('gHud').innerHTML = '<span id="gInfo" style="display:flex;gap:6px"></span><button class="pill" id="gQuit" style="font-size:1.1em">✕</button>'; $('gQuit').onclick = () => gameOver(true); }
  $('gInfo').innerHTML = html;
}
function waterBg(ctx, top){
  const g = ctx.createLinearGradient(0, 0, 0, G.H);
  g.addColorStop(0, '#bfeefa'); g.addColorStop(top || 0.2, '#8fdcec'); g.addColorStop(1, '#3f9fc4');
  ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
  ctx.fillStyle = '#ffffff22';
  for(let i=0;i<12;i++){ const x = (i * 97 + G.t * 12) % (G.W + 40) - 20, y = (i * 173) % G.H; ctx.beginPath(); ctx.arc(x, G.H - ((y + G.t * 30 * (1 + i % 3)) % G.H), 3 + i % 4, 0, 7); ctx.fill(); }
}
const livesTxt = n => '❤️'.repeat(Math.max(0, n)) + '🤍'.repeat(Math.max(0, 3 - n));

/* ---------- 1. Catch the Fish ---------- */
function fishInit(){
  const me = playerOtter();
  G.img = svgImg(otterSVG(me, {pose:'swim', noWater:true}));
  G.px = G.W / 2; G.tx = G.px; G.py = G.H - 110; G.flip = false;
  G.items = []; G.spawn = 0.8; G.lives = CONFIG.CATCH_LIVES;
  const move = e => { G.tx = e.clientX; };
  $('game').onpointerdown = move; $('game').onpointermove = e => { if(e.buttons || e.pointerType === 'touch') move(e); };
  G.update = dt => {
    const dx = G.tx - G.px; G.px += Math.sign(dx) * Math.min(Math.abs(dx), 900 * dt); if(Math.abs(dx) > 4) G.flip = dx > 0;
    G.px = clamp(G.px, 50, G.W - 50);
    G.spawn -= dt;
    if(G.spawn <= 0){
      G.spawn = Math.max(0.32, 0.85 - G.t * 0.012);
      const r = Math.random(), type = r < 0.05 ? 'gold' : r < 0.72 ? 'fish' : 'junk';
      G.items.push({x:rnd(30, G.W - 30), y:-30, type, junk:pick(['boot', 'can']), v:CONFIG.CATCH_SPEED + G.t * CONFIG.CATCH_RAMP + rnd(0, 60), w:rnd(0, 6)});
    }
    G.items.forEach(it => { it.y += it.v * dt; it.w += dt * 4; });
    G.items = G.items.filter(it => {
      if(Math.abs(it.x - G.px) < 58 && Math.abs(it.y - (G.py - 22)) < 34){
        if(it.type === 'junk'){ G.lives--; G.shake = 0.3; sfx('err'); burst(it.x, it.y, '#8a8a8a', 8); if(G.lives <= 0) setTimeout(() => gameOver(), 300); }
        else { const p = it.type === 'gold' ? 5 : 1; G.score += p; sfx(p > 1 ? 'pearl' : 'coin'); burst(it.x, it.y, p > 1 ? '#ffd23f' : '#fff', p > 1 ? 16 : 8); }
        return false;
      }
      return it.y < G.H + 40;
    });
    hud('<span class="pill">🐟 ' + G.score + '</span><span class="pill">' + livesTxt(G.lives) + '</span>');
  };
  G.draw = ctx => {
    waterBg(ctx, 0.1);
    G.items.forEach(it => {
      ctx.save(); ctx.translate(it.x, it.y);
      if(it.type === 'junk'){
        ctx.rotate(Math.sin(it.w) * 0.3);
        if(it.junk === 'boot'){ ctx.fillStyle = '#7a5a44'; roundRect(ctx, -12, -22, 18, 30, 4); ctx.fill(); roundRect(ctx, -12, 0, 32, 12, 5); ctx.fill(); ctx.fillStyle = '#5a3f2e'; ctx.fillRect(-12, 8, 32, 4); }
        else { ctx.fillStyle = '#b0b8c4'; roundRect(ctx, -11, -16, 22, 32, 4); ctx.fill(); ctx.fillStyle = '#e8545a'; ctx.fillRect(-11, -6, 22, 12); }
      } else {
        const gold = it.type === 'gold', c = gold ? '#ffd23f' : '#ff9a6a';
        ctx.rotate(Math.PI / 2 + Math.sin(it.w) * 0.25);
        ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(0, 0, 20, 11, 0, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(30, -10); ctx.lineTo(30, 10); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-10, -3, 3.4, 0, 7); ctx.fill(); ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(-10, -3, 1.7, 0, 7); ctx.fill();
        if(gold){ ctx.fillStyle = '#fff8'; ctx.beginPath(); ctx.arc(2, -4, 4, 0, 7); ctx.fill(); }
      }
      ctx.restore();
    });
    // player
    ctx.save(); ctx.translate(G.px, G.py); if(G.flip) ctx.scale(-1, 1);
    if(G.img.complete) ctx.drawImage(G.img, -75, -60, 150, 100);
    ctx.restore();
    ctx.fillStyle = '#ffffff55'; ctx.fillRect(0, G.py + 18, G.W, 3);
  };
}
function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* ---------- 2. Find the Pearl (memory) ---------- */
const PEARL_ICONS = ['🦀','🐠','🐙','🦐','🐡','🐌','⭐'];
function pearlInit(){
  const cards = PEARL_ICONS.concat(['pearl']); let deck = cards.concat(cards);
  for(let i=deck.length-1;i>0;i--){ const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  G.deck = deck.map((k, i) => ({k, i, up:false, done:false})); G.open = []; G.left = CONFIG.PEARL_TIME; G.pairs = 0; G.pearlFound = false; G.lock = false;
  const grid = $('memGrid');
  grid.innerHTML = G.deck.map(c => '<button class="mc" data-i="' + c.i + '">' + shellSVG('scallop') + '</button>').join('');
  G.start = () => {
    grid.querySelectorAll('.mc').forEach(b => b.onclick = () => {
      const c = G.deck[+b.dataset.i];
      if(!G.running || G.lock || c.up || c.done) return;
      c.up = true; sfx('tap'); b.classList.add('up'); b.innerHTML = c.k === 'pearl' ? PEARL : c.k;
      G.open.push({c, b});
      if(G.open.length === 2){
        const [x, y] = G.open; G.lock = true;
        if(x.c.k === y.c.k){
          setTimeout(() => {
            x.c.done = y.c.done = true; x.b.classList.add('done'); y.b.classList.add('done');
            G.pairs++; G.score += 10;
            if(x.c.k === 'pearl'){ G.pearlFound = true; G.score += 20; sfx('pearl'); toast(PEARL + ' ' + tr('You found the pearls! +20'), 'gold'); } else sfx('coin');
            G.open = []; G.lock = false;
            if(G.pairs === cards.length){ G.score += Math.ceil(G.left); setTimeout(() => gameOver(), 500); }
          }, 300);
        } else setTimeout(() => { [x, y].forEach(o => { o.c.up = false; o.b.classList.remove('up'); o.b.innerHTML = shellSVG('scallop'); }); G.open = []; G.lock = false; }, 700);
      }
    });
  };
  G.update = dt => {
    G.left -= dt;
    if(G.left <= 0 && !G.over){ G.left = 0; gameOver(); }
    hud('<span class="pill">⭐ ' + G.score + '</span><span class="pill">⏱️ ' + Math.ceil(G.left) + 's</span>');
  };
  G.draw = ctx => {
    const g = ctx.createLinearGradient(0, 0, 0, G.H); g.addColorStop(0, '#d9c7a8'); g.addColorStop(1, '#b89a76');
    ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
    ctx.fillStyle = '#8fd4e8aa'; ctx.beginPath(); ctx.ellipse(G.W / 2, G.H * 0.55, G.W * 0.62, G.H * 0.36, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffff33'; for(let i=0;i<8;i++){ ctx.beginPath(); ctx.ellipse((i * 131) % G.W, G.H * 0.2 + (i * 71) % (G.H * 0.7), 20, 6, 0, 0, 7); ctx.fill(); }
  };
}

/* ---------- 3. Shell Juggling ---------- */
function juggleInit(){
  const me = playerOtter();
  G.img = svgImg(otterSVG(me, {pose:'float', noWater:true}));
  G.shellImgs = {}; SHELL_IDS.forEach(k => G.shellImgs[k] = svgImg(shellSVG(k)));
  G.k = G.H / 800;
  G.ox = G.W / 2; G.oy = G.H - 120;
  G.zone = [G.oy - 190 * G.k, G.oy - 30];
  G.shells = []; G.lives = CONFIG.JUG_LIVES; G.want = 1; G.respawn = 0;
  const toss = (s, strong) => { s.vy = -(strong ? rnd(620, 720) : rnd(560, 660)) * Math.sqrt(G.k) * 1.05; s.vx = (G.ox - s.x) * 0.55 + rnd(-90, 90); };
  const add = () => { const s = {x:G.ox + rnd(-40, 40), y:G.oy - 60, vx:0, vy:0, k:pick(SHELL_IDS), r:0}; toss(s, true); G.shells.push(s); };
  G.start = add;
  $('game').onpointerdown = e => {
    if(!G.running) return;
    let best = null, bd = 80;
    G.shells.forEach(s => { const d = Math.hypot(s.x - e.clientX, s.y - e.clientY); if(d < bd){ bd = d; best = s; } });
    if(!best) return;
    if(best.y > G.zone[0] && best.vy > 0){
      const perfect = best.y > G.zone[1] - 60;
      toss(best); G.score += perfect ? 2 : 1;
      sfx('combo'); burst(best.x, best.y, perfect ? '#fff36b' : '#fff', perfect ? 14 : 7);
      if(perfect) G.parts.push({x:best.x, y:best.y, vx:0, vy:-40, r:0, c:'#0000', life:0.01, max:1});
      if(G.score >= G.want * 7 && G.want < 4){ G.want++; add(); toast('🐚 +1 ' + tr('shell!')); }
    }
  };
  $('game').onpointermove = null;
  G.update = dt => {
    const g = CONFIG.JUG_GRAVITY * G.k * 0.75;
    G.shells.forEach(s => {
      s.vy += g * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.r += dt * 3;
      if(s.x < 24){ s.x = 24; s.vx = Math.abs(s.vx); } if(s.x > G.W - 24){ s.x = G.W - 24; s.vx = -Math.abs(s.vx); }
      if(s.y < 70){ s.y = 70; s.vy = Math.abs(s.vy) * 0.3; }
    });
    G.shells = G.shells.filter(s => {
      if(s.y > G.oy + 40){ G.lives--; G.shake = 0.25; sfx('splash'); burst(s.x, G.oy + 30, '#fff', 12); G.respawn = 1; if(G.lives <= 0) setTimeout(() => gameOver(), 300); return false; }
      return true;
    });
    if(G.lives > 0 && G.shells.length < G.want){ G.respawn -= dt; if(G.respawn <= 0){ add(); G.respawn = 1; } }
    hud('<span class="pill">🤹 ' + G.score + '</span><span class="pill">' + livesTxt(G.lives) + '</span>');
  };
  G.draw = ctx => {
    waterBg(ctx, 0.5);
    // tap zone
    ctx.fillStyle = '#fff36b22'; ctx.fillRect(0, G.zone[0], G.W, G.zone[1] - G.zone[0]);
    ctx.strokeStyle = '#ffffff88'; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(0, G.zone[0]); ctx.lineTo(G.W, G.zone[0]); ctx.stroke(); ctx.setLineDash([]);
    if(G.img.complete) ctx.drawImage(G.img, G.ox - 130, G.oy - 80, 240, 160);
    G.shells.forEach(s => {
      const inZone = s.y > G.zone[0] && s.vy > 0;
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.sin(s.r) * 0.5);
      if(inZone){ ctx.fillStyle = '#fff36b77'; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 7); ctx.fill(); }
      const im = G.shellImgs[s.k]; if(im.complete) ctx.drawImage(im, -26, -26, 52, 52);
      ctx.restore();
    });
  };
}

/* ---------- end of a game ---------- */
function gameOver(quit){
  if(!G || G.over) return;
  G.over = true; G.running = false;
  $('game').onpointerdown = null; $('game').onpointermove = null;
  const id = G.id, sc = G.score, best = S.best[id] || 0, newBest = sc > best && !quit;
  let msg = '';

    const sh = Math.round(sc * Math.max(3, incomeFloor() * CONFIG.GAME_SEC_PER_POINT));
    addS(sh); msg += '+' + fmt(sh) + ' 🐚';
    if(newBest){ S.best[id] = sc; S.p += 2; msg += ' · +2 ' + PEARL; }
    const big = {fish:15, pearl:60, juggle:15}[id];
    if(sc >= big){ const k = pick(SHELL_IDS); S.shells[k]++; msg += '<br>' + shellIc(k) + ' ' + L(SHELLS[k]); }
    if(id === 'pearl' && G.pearlFound){ S.p += 1; msg += ' · +1 ' + PEARL; }
    S.stats.games++; qCount('game'); addXP(5); saveNow();

/* =====================================================================
   12. MAIN LOOP — game ticks, away time, tutorial, start-up
   tick(): once a second — moods, shells, naps, pups, timers
   frame(): every screen frame — otters swim, seagull flies
===================================================================== */
const MOOD_RATE = () => 100 / (CONFIG.MOOD_EMPTY_HOURS * 3600);
function freeSpot(d){
  const used = ottersIn(d.a).filter(o => o.nap && o.id !== d.id).map(o => o.spot);
  const n = Math.min(NAP_POS.length, S.ar[d.a].items.kelp);
  for(let i=0;i<n;i++) if(!used.includes(i)) return i;
  return undefined;
}
function stepWorld(dt, t, offline){
  const night = isNight(t), rate = MOOD_RATE(), gm = globalMult(t), rain = S.weather.k === 'rain';
  let earned = 0;
  S.otters.forEach(d => {
    const it = (S.ar[d.a] || newArea()).items, slow = 1 - it.falls * 0.03;
    d.m.food = Math.max(0, d.m.food - rate * dt * slow * (d.per === 'greedy' ? 1.5 : 1));
    if(!rain) d.m.fun = Math.max(0, d.m.fun - rate * dt * slow * (d.per === 'playful' ? 1.3 : 1) * (1 - it.slide * 0.03));
    if(d.nap){
      const kelp = d.spot !== undefined && d.spot < it.kelp ? 1 + it.kelp * 0.15 : 1;
      d.m.nrg = Math.min(100, d.m.nrg + 100 / (CONFIG.NAP_FULL_MIN * 60) * dt * kelp * (holdingHands(d) ? 1.5 : 1) * (d.per === 'sleepy' ? 0.8 : 1));
      if(d.m.nrg >= 100){ d.nap = 0; d.spot = undefined; }
    } else {
      d.m.nrg = Math.max(0, d.m.nrg - rate * 1.3 * dt * slow * (d.per === 'sleepy' ? 0.6 : 1));
      const f = bestie(d);
      const sleepy = d.m.nrg < CONFIG.NAP_START || (night && d.m.nrg < 75) || (f && f.a === d.a && f.nap && d.m.nrg < 85);
      if(sleepy && !d.pup){ d.nap = 1; d.spot = freeSpot(d); }
    }
    if(d.pup){
      d.grow += dt * (0.6 + moodAvg(d) / 250);
      if(d.grow >= CONFIG.PUP_GROW_MIN * 60){ d.pup = false; d.par = null; if(!offline) toast('🦦 ' + esc(d.n) + ' ' + tr('is all grown up!'), 'gold'); }
    }
    earned += otterRate(d, t) * gm * dt;
  });
  addS(earned);
  return earned;
}
function checkPups(t, offline){
  if(t < S.pupAt) return;
  S.pupAt = t + CONFIG.PUP_CHECK_MIN * 60000;
  S.otters.forEach(d => {
    const f = bestie(d);
    if(!f || d.id > f.id || f.a !== d.a || d.pup || f.pup) return;
    if(moodAvg(d) < 50 || moodAvg(f) < 50 || pupOf(d) || pupOf(f)) return;
    if(ottersIn(d.a).length >= areaCap(d.a)) return;
    if(Math.random() >= CONFIG.PUP_CHANCE) return;
    const K = Math.random() < 0.1 ? rollKind(d.a, [0, 60, 30, 9, 1]) : KIND(pick([d.k, f.k]));
    const p = makeOtter({k:K.id, a:d.a, pup:true, par:d.id, f:30});
    S.stats.pups++;
    const msg = esc(d.n) + ' & ' + esc(f.n) + ' ' + tr('have a pup! Say hello to {n}.', {n:esc(p.n)});
    if(offline) S.awayPups = (S.awayPups || []).concat([msg]);
    else { sfx('win'); squeak(1.5); queueModal(() => showReward(otterSVG(d, {noWater:true}), '🍼 ' + tr('A pup is born!'), msg + '<br>' + tr('It rides on its parent’s belly until it grows up.'))); }
  });
}
let tickN = 0, lastPhase = null;
function tick(){
  const t = now();
  stepWorld(1, t);
  S.stats.play++; tickN++;
  // weather
  if(t > S.weather.until){
    let k;
    if(S.weather.k === 'rain' && Math.random() < 0.6){ k = 'rainbow'; S.rainbowUntil = t + CONFIG.RAINBOW_MIN * 60000; S.weather = {k, until:S.rainbowUntil}; }
    else { k = pick(['clear', 'clear', 'cloudy', 'rain']); S.weather = {k, until:t + rnd(...CONFIG.WEATHER_MIN) * 60000}; }
    propsKey = ''; wxKey = ''; if(curView === 'Bay') renderBg();
    if(k !== 'clear') toast(WEATHER[k].e + ' ' + L(WEATHER[k]) + ' — ' + L(WEATHER[k].d));
  }
  // time of day
  const ph = phaseOf(t);
  if(ph !== lastPhase){ if(lastPhase) toast(PHASES[ph].e + ' ' + L(PHASES[ph])); lastPhase = ph; propsKey = ''; for(const k in actors) actors[k].key = ''; if(curView === 'Bay') renderBg(); }
  // holiday event
  const ev = activeEvent(t);
  if(ev !== S.ev.id){ S.ev.id = ev; propsKey = ''; if(ev) toast(EVENTS[ev].e + ' ' + L(EVENTS[ev]) + ' ' + tr('week is here!'), 'gold'); }
  // visitors
  if(S.visitor && t > S.visitor.until){ S.visitor = null; S.visitorAt = t + rnd(...CONFIG.VISITOR_MIN) * 60000; renderVisitor(); }
  if(S.tut >= 99 && !S.visitor && !G){
    const today = dayNum(t);
    if(S.dailyVisit !== today && t - S.created > 120000){ S.dailyVisit = today; spawnVisitor(true); }
    else if(t > S.visitorAt) spawnVisitor(false);
  }
  // golden seagull + washed-up shells
  if(t > S.gullAt){ S.gullAt = t + rnd(...CONFIG.GULL_MIN) * 60000; if(S.tut >= 99) launchGull(); }
  if(t > S.washAt){ S.washAt = t + rnd(...CONFIG.WASH_EVERY_S) * 1000; if(S.tut >= 3) spawnWash(); }
  checkPups(t);
  if(tickN % 10 === 0) saveNow();
  // screen
  refreshTop();
  if(curView === 'Bay'){
    renderX2();
    if(tickN % 2 === 0){ renderSide(); renderGran(); renderAreaName(); renderOtters(); }
    if(ringFor && tickN % 3 === 0 && ringView === 'main') openRing(ringFor, 'main');
  }
}
let lastFrame = performance.now();
function frame(ts){
  const dt = Math.min(0.1, (ts - lastFrame) / 1000); lastFrame = ts;
  if(S && curView === 'Bay' && !G){ stepActors(dt); stepGull(dt); }
  if(S) tickShellDisplay();
  requestAnimationFrame(frame);
}

/* ---------- away time (shells while the app is closed, up to 8 h) ---------- */
function catchUp(){
  const t = now(), away = (t - (S.lastSeen || t)) / 1000;
  if(away < 60) return;
  const cap = CONFIG.OFFLINE_MAX_H * 3600, sim = Math.min(away, cap);
  const step = 300, steps = Math.floor(sim / step);
  let earned = 0, st = t - sim * 1000;
  for(let i=0;i<steps;i++){ st += step * 1000; earned += stepWorld(step, st, true); checkPups(st, true); }
  const rest = sim - steps * step; if(rest > 0) earned += stepWorld(rest, t, true);
  S.lastSeen = t;
  if(earned >= 1){
    const pups = S.awayPups || []; S.awayPups = [];
    queueModal(() => {
      openModal('🌅 ' + tr('Welcome back!'), '<div class="reward"><div class="big">' + granSVG(90) + '</div><p>' + tr('You were away for {t}.', {t:fmtTime(away)}) + '</p><p>' + tr('Your otters found') + '</p><div class="amt">+' + fmt(earned) + ' 🐚</div>' +

  {ev:'build', hl:'#sBuild', en:'Shells come in by themselves. Tap Build and make a kelp bed! 🌿', fr:'Les coquillages arrivent tout seuls. Touche Construire et fais un lit de varech! 🌿'},

];
function tutShow(){
  document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
  const st = TUT[S.tut];
  if(!st){ $('tut').classList.remove('on'); return; }
  if(st.ev === 'wash' && !washes.length) spawnWash();
  if(st.ev === 'feed' && !ringFor){ const d = ottersIn(S.cur)[0]; if(d && curView === 'Bay') setTimeout(() => openRing(d.id), 100); }
  $('tutGran').innerHTML = granSVG(58);
  $('tutTx').textContent = S.lang === 'fr' ? st.fr : st.en;
  $('tutBtn').textContent = tr('Skip');
  $('tutBtn').onclick = () => { S.tut = 99; $('tut').classList.remove('on'); document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl')); saveNow(); checkDaily(); };
  $('tut').classList.add('on');
  const bay = curView === 'Bay';
  $('tut').style.top = bay ? '' : 'auto'; $('tut').style.bottom = bay ? '' : 'calc(86px + env(safe-area-inset-bottom))';
  setTimeout(() => { const el = document.querySelector(st.hl); if(el) el.classList.add('hl'); }, 250);
}
function tutEvent(ev){
  if(!S || S.tut < 1 || S.tut >= 99) return;
  const st = TUT[S.tut];
  if(ev.startsWith('view') && (!st || st.ev !== ev)){ setTimeout(tutShow, 60); }
  if(!st || st.ev !== ev) return;
  S.tut++;
  sfx('coin');
  if(!TUT[S.tut]){
    S.tut = 99; $('tut').classList.remove('on'); document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
    S.p += 5; addS(300);
    queueModal(() => showReward(granSVG(100), tr('You’re a natural!'), tr('Here’s a little gift, dear:') + '<br>+5 ' + PEARL + ' +300 🐚', () => checkDaily()));
  } else setTimeout(tutShow, 350);
  saveNow();
}
function checkDaily(){ if(S.tut >= 99 && S.daily.last !== dayNum(now())) queueModal(openDaily); }
function startNewGame(){
  S = newState();
  const first = makeOtter({k:'river', a:'bay', per:'playful', fav:'scallop'});
  first.m = {food:35, fun:70, nrg:90};
  S.avatar = first.id;
  S.tut = 0;
  saveNow();
  startNewGameName(first, first.n);
}
function startNewGameName(first, val){
  openModal('', '<div class="reward"><div class="big">' + otterSVG(first, {noWater:true, shell:'scallop'}) + '</div><h2>' + tr('Welcome to Otter Bay!') + '</h2><p>' + tr('This little otter is yours. What’s its name?') + '</p>' +
    '<input id="fnIn" maxlength="14" value="' + esc(val) + '" style="width:80%;padding:12px;border-radius:12px;border:2px solid #dde;text-align:center;font-size:18px">' +
    '<div class="seg" style="margin:12px auto;max-width:240px"><button id="nlEn" class="' + (S.lang === 'en' ? 'on' : '') + '">English</button><button id="nlFr" class="' + (S.lang === 'fr' ? 'on' : '') + '">Français</button></div>' +
    '<button class="btn wide" id="fnGo">🦦 ' + tr('Let’s go!') + '</button></div>', null, true);
  const relang = l => { S.lang = l; const v = $('fnIn').value; applySettings(); renderNav(); closeModal(); startNewGameName(first, v); };
  $('nlEn').onclick = () => relang('en'); $('nlFr').onclick = () => relang('fr');
  $('fnGo').onclick = () => { const v = $('fnIn').value.trim(); if(v) first.n = v.slice(0, 14); closeModal(); S.tut = 1; renderBay(); tutShow(); squeak(); saveNow(); };
}

/* ---------- start-up ---------- */
function goBackground(){ if(!S) return; saveNow(); wavesStop(); try{ if(AC && AC.state === 'running') AC.suspend(); }catch(e){} }
function goForeground(){ if(!S) return; catchUp(); try{ if(AC && AC.state === 'suspended') AC.resume().then(wavesStart); }catch(e){} if(curView === 'Bay') renderBay(); }
function boot(){
  $('loadOtter').innerHTML = otterSVG({k:'sea', o:{}}, {shell:'scallop'});
  const lang0 = (load() || {}).lang || ((navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en');
  $('loadTip').textContent = '💡 ' + pick(TIPS)[lang0];
  let p = 0; const iv = setInterval(() => { p = Math.min(100, p + rnd(12, 28)); $('loadBar').style.width = p + '%'; }, 140);
  setTimeout(() => {
    clearInterval(iv); $('loadBar').style.width = '100%';
    const saved = load();
    if(saved){ S = saved; shownS = S.s; S.ev.id = activeEvent(); catchUp(); }
    if(!S) startNewGame();
    shownS = S.s; S.ev.id = activeEvent();
    applySettings(); renderNav(); showView('Bay');
    if(S.tut >= 1 && S.tut < 99) tutShow();
    else if(S.tut >= 99) checkDaily();
    $('load').style.opacity = 0; setTimeout(() => $('load').remove(), 600);
    setInterval(tick, 1000);
    requestAnimationFrame(frame);
    adsInit();
  }, 1300);
  $('mClose').onclick = closeModal;
  $('modalBg').addEventListener('pointerdown', e => { if(e.target === $('modalBg') && $('mClose').style.display !== 'none') closeModal(); });
  $('pShell').onclick = openBoosts;
  $('pPearl').onclick = () => { showView('Shop'); shopTab = 'special'; renderShop(); };
  $('pLevel').onclick = () => { showView('More'); moreTab = 'stats'; renderMore(); };
  $('profBtn').onclick = () => { showView('More'); moreTab = 'settings'; renderMore(); };
  $('muteBtn').onclick = () => setMute(!S.mute);
  $('scene').addEventListener('pointerdown', () => closeRing());
  document.addEventListener('pointerdown', audioUnlock, {once:true});
  // stop ALL sound when the app goes to the background (phone home button, screen off...)
  document.addEventListener('visibilitychange', () => { if(document.hidden) goBackground(); else goForeground(); });
  document.addEventListener('pause', goBackground, false);
  document.addEventListener('resume', goForeground, false);
  window.addEventListener('pagehide', goBackground);
  try{ const App = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App; if(App) App.addListener('appStateChange', s => s.isActive ? goForeground() : goBackground()); }catch(e){}
  window.addEventListener('resize', () => { if(S && curView === 'Bay'){ for(const k in actors) actors[k].key = ''; renderOtters(); } });
}
window.addEventListener('load', boot);
