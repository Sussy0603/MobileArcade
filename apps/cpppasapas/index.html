<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140b22">
  <meta name="description" content="Apprends le C++ du cours 420-1C6 avec Segfault, le chat glitché.">
  <title>C++ Pas à Pas</title>

  <!-- Installable app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Fonts: Lexend (easy to read) + JetBrains Mono (fallback when Cascadia Code isn't installed) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <div class="glow-bg" aria-hidden="true"></div>
    <div class="local-banner" id="localBanner" hidden>MODE LOCAL · sauvegarde sur cet appareil seulement</div>

    <!-- Every screen is drawn inside <main> by js/app.js -->
    <main id="main" tabindex="-1">
      <div class="loading" id="loading">
        <div class="spinner" aria-hidden="true"></div>
        <p>Segfault compile l'app...</p>
      </div>
    </main>

    <!-- Bottom tab bar -->
    <nav class="tabs" id="tabs" aria-label="Navigation principale" hidden>
      <button data-go="home"><span class="ico" aria-hidden="true">🏠</span>Accueil</button>
      <button data-go="weak"><span class="ico" aria-hidden="true">🩹</span>Faibles</button>
      <button data-go="exam"><span class="ico" aria-hidden="true">📝</span>Examen</button>
      <button data-go="profil"><span class="ico" aria-hidden="true">🐱</span>Profil</button>
    </nav>

    <!-- "COMPILATION RÉUSSIE !" celebration -->
    <div class="celebrate" id="celebrate" role="dialog" aria-modal="true" aria-labelledby="celebrateTitle" hidden>
      <div class="confetti" id="confetti" aria-hidden="true"></div>
      <div class="tag" id="celebrateTitle">COMPILATION<br>RÉUSSIE !</div>
      <div class="cat" data-cat style="width:130px"></div>
      <p id="celebrateText"></p>
      <button class="btn" id="celebrateClose" style="width:auto">Continuer ⚡</button>
    </div>

    <!-- Small pop-up sheet (report a mistake, confirmations) -->
    <div class="sheet-bg" id="sheetBg" hidden>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
