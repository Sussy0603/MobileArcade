/* =====================================================================
   12. MAIN LOOP — game ticks, away time, tutorial, start-up
   tick(): once a second — moods, feathers, eggs, timers
   frame(): every screen frame — ducks waddle, golden duck flies
===================================================================== */
function stepWorld(dt, t, offline){
  const night = isNight(t), rate = MOOD_RATE(), gm = globalMult(t);
  let earned = 0;
  S.ducks.forEach(d => {
    if(d.i === '_sea') return;
    const I = S.isl[d.i] || newIsland();
    const f = d.fr && duckById(d.fr), friendNear = f && f.i === d.i;
    const slow = friendNear ? (1 - CONFIG.FRIEND_MOOD_SLOW) : 1;
    const sl = asleep(d, night);
    d.m.food = Math.max(0, d.m.food - rate * dt * slow * (d.t === 'hungry' ? 1.5 : 1) * (1 - I.items.feeder * 0.03));
    if(S.weather.k !== 'rainy') d.m.clean = Math.max(0, d.m.clean - rate * dt * slow * (1 - I.items.bath * 0.05));
    if(S.weather.k !== 'snowy') d.m.fun = Math.max(0, d.m.fun - rate * dt * slow);
    if(sl){
      d.m.sleep = Math.min(100, d.m.sleep + 100 / (CONFIG.SLEEP_REFILL_MIN * 60) * dt * (1 + I.items.nest * 0.1));
      if(d.slp && d.m.sleep >= 100){ d.slp = 0; d.nest = undefined; }
    } else d.m.sleep = Math.max(0, d.m.sleep - rate * dt * slow * (d.t === 'sleepy' ? 0.6 : 1));
    // growing up: time + care
    if(d.grow < CONFIG.GROW_ADULT_SEC) d.grow += dt * (d.t === 'hungry' ? 2 : 1) * (0.5 + moodAvg(d) / 100);
    const r = duckRate(d, night) * gm * dt;
    earned += r;
    // lucky ducks sometimes find a gem
    if(!offline && d.t === 'lucky' && stageOf(d) === 2 && Math.random() < dt / 3600){ S.g++; toast('🍀 ' + esc(d.n) + ' ' + tr('found a gem!') + ' +1 💎', 'gold'); }
  });
  addF(earned);
  // night eggs warm only at night
  if(night) S.eggs.forEach(e => { if(e.night) e.nightSec = (e.nightSec || 0) + dt; });
  // waiting eggs move into free nests
  if(S.eggBag && S.eggBag.length && S.eggs.length < CONFIG.NEST_SLOTS){ const e = S.eggBag.shift(); e.start = t; S.eggs.push(e); }
  return earned;
}
let tickN = 0;
function tick(){
  const t = now(), dt = 1;
  stepWorld(dt, t);
  S.stats.play += dt; tickN++;
  // tickets
  while(S.tickets < CONFIG.TICKETS_MAX && t - S.tkT >= CONFIG.TICKET_MIN * 60000){ S.tickets++; S.tkT += CONFIG.TICKET_MIN * 60000; }
  if(S.tickets >= CONFIG.TICKETS_MAX) S.tkT = t;
  // weather
  if(t > S.weather.until){
    const m = new Date(t).getMonth(), winter = m >= 10 || m <= 2;
    const opts = ['sunny','sunny','rainy','windy'].concat(winter || S.cur === 'snow' ? ['snowy','snowy'] : []);
    S.weather = {k: pick(opts), until: t + rnd(...CONFIG.WEATHER_MIN) * 60000};
    wxKey = ''; renderWeather(); toast(WEATHER[S.weather.k].e + ' ' + L(WEATHER[S.weather.k]) + ' — ' + L(WEATHER[S.weather.k].d));
  }
  // holiday event
  const ev = activeEvent(t);
  if(ev !== S.ev.id){ S.ev = {id: ev, cur: ev && S.ev.lastId === ev ? S.ev.cur : 0, own: S.ev.own || {}, lastId: ev || S.ev.lastId}; if(ev) toast(EVENTS[ev].e + ' ' + L(EVENTS[ev]) + ' ' + tr('event is on!'), 'gold'); renderIsland(); }
  if(S.ev.id && tickN % 60 === 0) S.ev.cur += Math.max(1, Math.floor(S.ducks.length / 5));
  // visitors
  if(S.visitor && t > S.visitor.until){ S.visitor = null; S.visitorAt = t + rnd(...CONFIG.VISITOR_MIN) * 60000; renderVisitor(); }
  if(!S.visitor && t > S.visitorAt && S.tut >= 99){ spawnVisitor(); }
  // golden duck
  if(t > S.goldenAt){ S.goldenAt = t + rnd(...CONFIG.GOLDEN_DUCK_MIN) * 60000 * (S.weather.k === 'windy' ? 0.5 : 1); if(S.tut >= 99) launchGolden(); }
  // best friends lay eggs
  if(t > S.friendEggAt){
    S.friendEggAt = t + CONFIG.FRIEND_EGG_EVERY_MIN * 60000;
    const done = {};
    S.ducks.forEach(d => {
      const f = d.fr && duckById(d.fr);
      if(!f || done[d.id] || f.i !== d.i || stageOf(d) < 2 || stageOf(f) < 2 || moodAvg(d) < 50) return;
      done[d.id] = done[f.id] = 1;
      if(Math.random() < CONFIG.FRIEND_EGG_CHANCE){
        addEgg('basic', d.i, {mix: {b: d.b, c: f.c, p: Math.random() < 0.5 ? d.p : f.p}, par: d.id});
        toast('💞🥚 ' + esc(d.n) + ' & ' + esc(f.n) + ' ' + tr('laid an egg!'), 'gold');
      }
    });
  }
  tickTrips(); tickTurtles();
  if(tickN % 10 === 0){ checkBadges(); saveNow(); }
  // screen updates
  refreshTop();
  if(curView === 'Island'){
    renderHatch(); renderCaptain();
    if(tickN % 5 === 0){ renderCare(); renderSide(); renderDucks(); $('nightTint').style.opacity = isNight() ? 0.55 : 0; }
  }
  if(curView === 'More' && moreTab === 'garden' && tickN % 2 === 0 && !$('modalBg').classList.contains('on')) renderMore();
  if(curView === 'Map' && S.trips.length && !$('modalBg').classList.contains('on')) renderMap();
  if(curView === 'Games' && tickN % 5 === 0 && !$('modalBg').classList.contains('on')) renderGames();
}
let lastFrame = performance.now();
function frame(ts){
  const dt = Math.min(0.1, (ts - lastFrame) / 1000); lastFrame = ts;
  if(S && curView === 'Island' && !G){ stepActors(dt); stepGolden(dt); }
  if(S) tickFeatherDisplay();
  requestAnimationFrame(frame);
}

/* ---------- away time (offline earnings) ---------- */
function catchUp(){
  const t = now(), away = (t - (S.lastSeen || t)) / 1000;
  if(away < 60) return;
  // simulate in 1-minute steps (up to 7 days), so moods drop as they really would
  const steps = Math.min(Math.floor(away / 60), 7 * 24 * 60);
  let earned = 0, sim = S.lastSeen;
  const realNow = Date.now;
  for(let i=0;i<steps;i++){ sim += 60000; earned += stepWorld(60, sim, true); }
  const rest = away - steps * 60;
  if(rest > 0 && rest < 600) earned += stepWorld(rest, t, true);
  S.tkT = Math.min(S.tkT, t);
  tickTrips();
  S.lastSeen = t;
  if(earned >= 1){
    S.awayLast = Math.round(earned);
    queueModal(() => {
      openModal('🌅 ' + tr('Welcome back!'), '<div class="reward"><div class="big">' + capSVG(90) + '</div><p>' + tr('You were away for {t}.', {t: fmtTime(away)}) + '</p><p>' + tr('Your ducks made') + '</p><div class="amt">+' + fmt(S.awayLast) + ' 🪶</div></div>' +
        '<button class="btn wide gold" id="wbX2">' + adIcon() + ' ' + tr('Double it!') + ' +' + fmt(S.awayLast) + ' 🪶</button><button class="btn wide ghost" id="wbOk">' + tr('Collect') + '</button>');
      $('wbOk').onclick = closeModal;
      $('wbX2').onclick = async () => { closeModal(); if(await rewardAd()){ addF(S.awayLast); toast('+' + fmt(S.awayLast) + ' 🪶', 'gold'); S.awayLast = 0; saveNow(); } };
    });
  }
  saveNow();
}

  $('tutBtn').onclick = () => { S.tut = 99; $('tut').classList.remove('on'); document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl')); saveNow(); checkDaily(); };
  $('tut').classList.add('on');
  // on the island the box sits up top; on other screens it sits above the menu
  const isl = curView === 'Island';
  $('tut').style.top = isl ? '' : 'auto'; $('tut').style.bottom = isl ? '' : 'calc(86px + env(safe-area-inset-bottom))'; $('tut').style.left = isl ? '' : '8px';
  setTimeout(() => { const el = document.querySelector(st.hl); if(el) el.classList.add('hl'); }, 200);
}
function tutEvent(ev){
  if(!S || S.tut < 1 || S.tut >= 99) return;
  const st = TUT[S.tut];
  if(ev === 'viewIsland' || ev.startsWith('view')){ if(curView === 'Island' || true) setTimeout(tutShow, 50); }
  if(!st || st.ev !== ev) return;
  S.tut++;
  sfx('coin');
  if(!TUT[S.tut]){
    S.tut = 99; $('tut').classList.remove('on'); document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
    S.g += 5; addF(500);
    queueModal(() => showReward(capSVG(100), tr('You’re a natural!'), tr('Here’s a gift to start your adventure:') + '<br>+5 💎 +500 🪶', () => checkDaily()));
  } else setTimeout(tutShow, 300);
  saveNow();
}
function startNewGame(){
  S = newState();
  S.outfits.bow = 1;
  S.book = {'pond:classic': 1};
  const first = makeDuck({b:'classic', c:'yellow', p:'none', r:0, t:'fluffy', i:'pond', look:'pond', adult:true});
  first.m = {food:35, clean:80, fun:60, sleep:85};
  S.avatar = first.id;
  S.book = {'pond:classic': 1};
  addEgg('basic', 'pond', {dur: CONFIG.FIRST_EGG_SEC});
  S.isl.pond.qStart = 0;
  S.tut = 0;
  saveNow();
  startNewGameName(first, first.n);
}
function startNewGameName(first, val){
  openModal('', '<div class="reward"><div class="big">' + duckSVG(first, {size:120}) + '</div><h2>' + tr('Welcome to Quackipelago!') + '</h2><p>' + tr('This little duck is yours. What’s its name?') + '</p>' +
    '<input id="fnIn" maxlength="14" value="' + esc(val) + '" style="width:80%;padding:10px;border-radius:12px;border:2px solid #eee;text-align:center;font-size:18px">' +
    '<div class="seg" style="margin:12px auto;max-width:240px"><button id="nlEn" class="' + (S.lang === 'en' ? 'on' : '') + '">English</button><button id="nlFr" class="' + (S.lang === 'fr' ? 'on' : '') + '">Français</button></div>' +
    '<button class="btn wide" id="fnGo">🦆 ' + tr('Let’s go!') + '</button></div>', null, true);
  const relang = l => { S.lang = l; const v = $('fnIn').value; applySettings(); renderNav(); closeModal(); startNewGameName(first, v); };
  $('nlEn').onclick = () => relang('en'); $('nlFr').onclick = () => relang('fr');
  $('fnGo').onclick = () => { const v = $('fnIn').value.trim(); if(v) first.n = v.slice(0, 14); closeModal(); S.tut = 1; renderIsland(); tutShow(); quack(); saveNow(); };
}

/* ---------- start-up ---------- */
function boot(){
  $('loadDuck').innerHTML = duckSVG({b:'classic',c:'yellow',p:'none',look:'pond',grow:99999,o:{hat:'bow'}}, {noShadow:true});
  const lang0 = (load() || {}).lang || ((navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en');
  $('loadTip').textContent = '💡 ' + pick(TIPS)[lang0];
  let p = 0; const iv = setInterval(() => { p = Math.min(100, p + rnd(12, 28)); $('loadBar').style.width = p + '%'; }, 140);
  setTimeout(() => {
    clearInterval(iv); $('loadBar').style.width = '100%';
    const saved = load();
    if(saved){ S = saved; shownF = S.f; catchUp(); }
    else { S = null; }
    if(!S){ startNewGame(); }
    shownF = S.f;
    applySettings(); renderNav(); showView('Island');
    if(S.tut >= 1 && S.tut < 99) tutShow();
    else if(S.tut >= 99) checkDaily();
    $('load').style.opacity = 0; setTimeout(() => $('load').remove(), 600);
    setInterval(tick, 1000);
    requestAnimationFrame(frame);
    adsInit();
  }, 1300);
  $('mClose').onclick = closeModal;
  $('modalBg').addEventListener('pointerdown', e => { if(e.target === $('modalBg') && $('mClose').style.display !== 'none') closeModal(); });
  $('pFeather').onclick = openBoosts; $('pGem').onclick = () => { showView('Market'); mTab = 'paid'; renderMarket(); };
  $('pLevel').onclick = () => { showView('More'); moreTab = 'profile'; renderMore(); };
  $('profBtn').onclick = () => { showView('More'); moreTab = 'profile'; renderMore(); };
  document.addEventListener('pointerdown', audioUnlock, {once: true});
  document.addEventListener('visibilitychange', () => {
    if(!S) return;
    if(document.hidden){ saveNow(); musicStop(); }
    else { catchUp(); if(S.mus) musicStart(); renderIsland(); }
  });
  document.addEventListener('pause', () => { if(S){ saveNow(); musicStop(); } }, false);
  window.addEventListener('resize', () => { if(S && curView === 'Island'){ for(const k in actors) actors[k].key = ''; renderDucks(); } });
}
window.addEventListener('load', boot);

</script>
