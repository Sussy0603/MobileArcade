===================================================================== */
function speak(text, lang){
  if (!text) return;
  const TTS = Plug('TextToSpeech');
  if (TTS){ TTS.stop().catch(() => {}).then(() => TTS.speak({ text, lang, rate: 0.9, pitch: 1, volume: 1, category: 'ambient' })).catch(() => toast(t('noVoice'))); return; }
  if ('speechSynthesis' in window){ try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = 0.9; speechSynthesis.speak(u); }catch(e){ toast(t('noVoice')); } }
  else toast(t('noVoice'));
}
function stopSpeak(){ const TTS = Plug('TextToSpeech'); if (TTS){ TTS.stop().catch(() => {}); return; } try{ if ('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }

/* photos are shrunk to max 900px so the phone doesn't fill up */
function shrink(dataUrl, max = 900){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h); res(c.toDataURL('image/jpeg', 0.78)); };
    img.onerror = () => res(null); img.src = dataUrl;
  });
}
async function pickPhoto(){
  const Cam = Plug('Camera');
  if (Cam){
    try{
      const p = await Cam.getPhoto({ resultType: 'dataUrl', source: 'PROMPT', quality: 80, width: 1200, correctOrientation: true,
        promptLabelHeader: t('photo'), promptLabelPhoto: t('fromGallery'), promptLabelPicture: t('takePhoto'), promptLabelCancel: t('cancel') });
      return p && p.dataUrl ? await shrink(p.dataUrl) : null;
    }catch(e){ return null; }
  }
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => { const f = inp.files && inp.files[0]; if (!f) return res(null); const r = new FileReader(); r.onload = async () => res(await shrink(r.result)); r.onerror = () => res(null); r.readAsDataURL(f); };
    inp.click();
  });
}

/* notifications: id 1 = daily study reminder, id 2 = Tiny Timer done */
async function notifAllowed(){
  const LN = Plug('LocalNotifications'); if (!LN) return false;
  try{ let p = await LN.checkPermissions(); if (p.display !== 'granted') p = await LN.requestPermissions(); return p.display === 'granted'; }catch(e){ return false; }
}
async function applyReminder(announce){
  const LN = Plug('LocalNotifications');
  if (!LN){ if (announce && state.reminder.on) toast(t('remPhone')); return; }
  try{ await LN.cancel({ notifications: [{ id: 1 }] }); }catch(e){}
  if (!state.reminder.on) return;
  if (!(await notifAllowed())){ state.reminder.on = false; save(); render(); toast(t('notifDenied')); return; }
  const [hh, mm] = state.reminder.time.split(':').map(Number);
  try{
    await LN.schedule({ notifications: [{ id: 1, title: t('remTitle'), body: t('remBody'), smallIcon: 'ic_stat_flashdeck', iconColor: '#D96C4E', schedule: { on: { hour: hh, minute: mm }, allowWhileIdle: false } }] });
    if (announce) toast(t('remSet', { t: state.reminder.time }));
  }catch(e){}
}
async function scheduleTimerNotif(){
  const LN = Plug('LocalNotifications'), T = state.timer; if (!LN || !T.notify || !T.running) return;
  if (!(await notifAllowed())) return;
  const a = T.animal ? T.animal.name : '';
  try{ await LN.cancel({ notifications: [{ id: 2 }] }); await LN.schedule({ notifications: [{ id: 2, title: t('timerEndTitle') + (a ? ' · ' + a : ''), body: T.mode === 'work' ? t('focusDone') : t('breakDone'), smallIcon: 'ic_stat_flashdeck', iconColor: '#D96C4E', schedule: { at: new Date(T.endAt) } }] }); }catch(e){}
}
function cancelTimerNotif(){ const LN = Plug('LocalNotifications'); if (LN) LN.cancel({ notifications: [{ id: 2 }] }).catch(() => {}); }

/* ---------- every tap in the app goes through here ---------- */
const ACT = {
  back: () => goBack(),
  tabHome: () => { if (nav.screen !== 'home'){ navStack.length = 0; nav = { screen: 'home' }; render(); } },
  tabTimer: () => { if (nav.screen !== 'timer'){ navStack.length = 0; nav = { screen: 'timer' }; render(); } },
  tabBreathe: () => { if (nav.screen !== 'breathe'){ navStack.length = 0; nav = { screen: 'breathe' }; render(); } },
  bToggle: () => B ? bStop(false) : bStart(),
  bPat: b => { const was = !!B; bStop(true); state.breathe.pattern = b.dataset.p; save(); render(); if (was) bStart(); },
  bVib: b => { state.breathe.vibrate = !state.breathe.vibrate; b.setAttribute('aria-checked', state.breathe.vibrate); save(); if (state.breathe.vibrate) buzz(); },
  openSettings: () => go('settings'),
  newDeck: () => deckSheet(null),
  importFile: () => importFile(),
  openDeck: b => go('deck', { deckId: b.dataset.id }),
  editDeck: () => deckSheet(getDeck(nav.deckId)),
  addCard: () => cardSheet(getDeck(nav.deckId), null),
  editCard: b => { const d = getDeck(nav.deckId); cardSheet(d, d.cards.find(c => c.id === b.dataset.id)); },
  paste: () => pasteSheet(getDeck(nav.deckId)),
  shareDeck: () => shareSheet(getDeck(nav.deckId)),
  study: () => startStudy(getDeck(nav.deckId), false),
  quiz: () => quizSheet(getDeck(nav.deckId)),
  flip: (b, e) => { if (e.target.closest('[data-act="say"]')) return; flipCard(); },
  say: (b, e) => { e.stopPropagation(); sayCurrent(b.dataset.side); },
  grade: b => gradeCurrent(+b.dataset.g),
  studyMissed: () => { const d = getDeck(S.deckId); const ids = S.missed.slice(); navStack.pop(); startStudy(d, ids); },
  backToDeck: () => { const id = (S && nav.screen === 'done') ? S.deckId : Q.deckId; navStack.length = 0; navStack.push({ screen: 'home' }); nav = { screen: 'deck', deckId: id }; render(); },
  sayQuiz: () => { const d = getDeck(Q.deckId), q = Q.qs[Q.pos], c = d.cards.find(x => x.id === q.id); if (c) speak(state.quizDir === 'fb' ? c.front : c.back, state.quizDir === 'fb' ? d.frontLang : d.backLang); },
  pick: b => { const q = Q.qs[Q.pos]; if (q.picked !== null) return; q.picked = +b.dataset.i; const ok = q.choices[q.picked] === q.ans; if (ok) Q.right++; logActivity(getDeck(Q.deckId), 1); save(); render();
    if (state.autoRead){ const d = getDeck(Q.deckId); speak(q.ans, state.quizDir === 'fb' ? d.backLang : d.frontLang); } },
  quizNext: () => { Q.pos++; if (Q.pos >= Q.qs.length){ nav = { screen: 'quizDone' }; render(); chime(true); } else render(); },
  quizAgain: () => { const d = getDeck(Q.deckId); navStack.pop(); startQuiz(d); },
  lang: b => { state.lang = b.dataset.l; save(); render(); applyReminder(false); },
  dys: () => { state.font = state.font === 'dyslexic' ? 'normal' : 'dyslexic'; save(); render(); },
  big: () => { state.big = !state.big; save(); render(); },
  autoRead: () => { state.autoRead = !state.autoRead; save(); render(); },
  testVoice: () => speak(t('voiceTest'), defVoice()),
  theme: b => themeTap(b.dataset.th),
  remOn: () => { state.reminder.on = !state.reminder.on; save(); render(); applyReminder(true); },
  erase: () => confirmSheet(t('eraseQ'), t('erase'), async () => {
    const LN = Plug('LocalNotifications'); if (LN) LN.cancel({ notifications: [{ id: 1 }, { id: 2 }] }).catch(() => {});
    await Photos.clear(); const lang = state.lang; state = defaults(); state.lang = lang; state.seeded = true; save(); navStack.length = 0; nav = { screen: 'home' }; render(); toast(t('erased'));
  }),
  docSheet: () => docSheet(getDeck(nav.deckId)),
  docAgain: () => { const d = R.deckId ? getDeck(R.deckId) : null; R.leaving = true; goBack(); docSheet(d); },
  docHome: () => docSheet(null),
  rKind: b => { const k = b.dataset.k, all = R.items.filter(x => x.kind === k), on = !all.every(x => x.on); all.forEach(x => x.on = on); render(); },
  delDeck: b => { const d = getDeck(b.dataset.id); if (!d) return;
    confirmSheet(t('deleteDeckQ', { name: d.name }), t('del'), async () => { await deleteDecks([d.id]); render(); toast(t('deckDeleted')); }); },
  selDeck: b => { const id = b.dataset.id; if (SEL.has(id)) SEL.delete(id); else SEL.add(id); render(); },
  selAll: () => { if (SEL.size === state.decks.length) SEL.clear(); else state.decks.forEach(d => SEL.add(d.id)); render(); },
  selCancel: () => { SEL = null; render(); },
  delSel: () => { const ids = Array.from(SEL); if (!ids.length) return;
    confirmSheet(ids.length === 1 ? t('deleteDeckQ', { name: getDeck(ids[0]).name }) : t('delMany', { n: ids.length }), t('del'), async () => {
      await deleteDecks(ids); SEL = null; render(); toast(ids.length === 1 ? t('deckDeleted') : t('decksDeleted', { n: ids.length })); }); },
  rToggle: b => { const i = +b.dataset.i, it = R.items[i]; it.on = !it.on; const row = b.closest('.ritem'); row.classList.toggle('on', it.on); b.setAttribute('aria-checked', it.on); b.textContent = it.on ? '✓' : ''; reviewCount(); },
  rAll: () => { const all = R.items.every(x => x.on); R.items.forEach(x => x.on = !all); render(); },
  rAdd: () => {
    let d = R.deckId ? getDeck(R.deckId) : null;
    if (!R.deckId){
      d = { id: uid(), name: (R.name || '').trim().slice(0, 40) || t('pastedNotes'), emoji: '📄', color: COLORS[state.decks.length % COLORS.length],
        frontLang: R.lang === 'fr' ? 'fr-CA' : 'en-US', backLang: R.lang === 'fr' ? 'fr-CA' : 'en-US', cards: [], days: {}, created: Date.now() };
      state.decks.push(d);
    }
    if (!d) return;
    const pick = R.items.filter(x => x.on && x.front.trim() && x.back.trim());
    pick.forEach(c => d.cards.push(newCard(c.front.trim().slice(0, 400), c.back.trim().slice(0, 600))));
    save(); R.leaving = true; navStack.length = 0; navStack.push({ screen: 'home' }); nav = { screen: 'deck', deckId: d.id }; render(); toast(t('added', { n: pick.length })); chime(true);
  },
  aiToggle: b => { state.ai = state.ai === 'no' ? 'auto' : 'no'; b.setAttribute('aria-checked', state.ai !== 'no'); save(); },
  timerSettings: () => timerSettingsSheet(),
  tMode: b => tSetMode(b.dataset.m),
  tToggle: () => state.timer.running ? tPause() : tStart(),
  tReset: () => tReset(),
  tSkip: () => tFinish(false),
  tSound: b => { state.timer.sound = !state.timer.sound; b.setAttribute('aria-checked', state.timer.sound); save(); },
  tNotify: b => { state.timer.notify = !state.timer.notify; b.setAttribute('aria-checked', state.timer.notify); save(); if (state.timer.notify) scheduleTimerNotif(); else cancelTimerNotif(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b, e);
});
document.addEventListener('keydown', e => {
  if (nav.screen === 'study' && (e.key === ' ' || e.key === 'Enter') && document.activeElement && document.activeElement.id === 'flip'){ e.preventDefault(); flipCard(); }
  if (e.key === 'Escape') goBack();
});
document.addEventListener('change', e => {
  if (e.target.id === 'rt'){ state.reminder.time = e.target.value || '19:00'; save(); applyReminder(true); }
});

function seedDemo(){
  if (state.seeded) return;
  const fr = state.lang === 'fr';
  const pairs = fr
    ? [['France','Paris'],['Japon','Tokyo'],['Canada','Ottawa'],['Brésil','Brasília'],['Égypte','Le Caire'],['Australie','Canberra'],['Italie','Rome'],['Kenya','Nairobi']]
    : [['France','Paris'],['Japan','Tokyo'],['Canada','Ottawa'],['Brazil','Brasília'],['Egypt','Cairo'],['Australia','Canberra'],['Italy','Rome'],['Kenya','Nairobi']];
  state.decks.push({ id: uid(), name: fr ? 'Capitales du monde' : 'World capitals', emoji: '🌍', color: COLORS[1], frontLang: defVoice(), backLang: defVoice(),
    cards: pairs.map(p => newCard(p[0], p[1])), days: {}, created: Date.now() });
  state.seeded = true; save();
}
function boot(){
  load(); seedDemo();
  const T = state.timer;
  if (T.running && tRemaining() <= 0) tFinish(true); // finished while the app was closed
  render();
  if (isNative()){
    document.documentElement.classList.add('native');
    const App = Plug('App');
    if (App){
      App.addListener('backButton', () => { if (!goBack()) App.exitApp(); });
      App.addListener('appStateChange', s => { if (s.isActive){ if (state.timer.running && tRemaining() <= 0) tFinish(true); else if (!B) render(); } else { stopSpeak(); bStop(false); } });
    }
    initAds();
    applyReminder(false);
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.timer.running && tRemaining() <= 0) tFinish(true); });
boot();
