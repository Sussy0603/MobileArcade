<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#16210f"/>
<title>Pixel Garden</title>
<style>
  @font-face{font-family:'Baloo 2';font-weight:700;src:url(fonts/baloo-2-latin-700-normal.woff2) format('woff2');font-display:swap}
  @font-face{font-family:'Baloo 2';font-weight:800;src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2');font-display:swap}
  @font-face{font-family:'Nunito';font-weight:600;src:url(fonts/nunito-latin-600-normal.woff2) format('woff2');font-display:swap}
  @font-face{font-family:'Nunito';font-weight:700;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2');font-display:swap}
  @font-face{font-family:'Nunito';font-weight:800 900;src:url(fonts/nunito-latin-900-normal.woff2) format('woff2');font-display:swap}
  :root{
    --line:rgba(255,255,255,.22);
    --gold:#e8c88a; --gold2:#c9a05e;
    --ui-font:'Nunito',system-ui,sans-serif;
    --dis-font:'Baloo 2',system-ui,sans-serif;
    --r:18px;
    --sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px)); --sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:var(--ui-font);background:#16210f;color:#fff;
    display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
  #app{position:relative;width:100%;height:100%;max-width:520px;overflow:hidden;background:#3f6a30}
  canvas#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;
    image-rendering:pixelated;image-rendering:crisp-edges}
  button{font-family:var(--ui-font)}

  .hud{position:absolute;top:0;left:0;right:0;padding:calc(8px + var(--sat)) 10px 0;z-index:20;pointer-events:none;
    display:flex;flex-direction:column;gap:6px}
  .hrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .hud .chip,.hud .icbtn{pointer-events:auto}
  .chip{background:rgba(18,30,14,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px;
    font-weight:800;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
  .chip.sm{font-size:11.5px;padding:4px 10px}
  .chip.hot{background:linear-gradient(160deg,rgba(232,200,138,.55),rgba(201,160,94,.45));border-color:var(--gold)}
  .chip.hide{display:none}
  .lvchip{position:relative;overflow:hidden;padding-bottom:8px}
  .lvchip .xp{position:absolute;left:10px;right:10px;bottom:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.18)}
  .lvchip .xp i{display:block;height:100%;width:0;border-radius:2px;background:#a8e070;transition:width .3s}
  .icbtn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:rgba(18,30,14,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    display:grid;place-items:center;font-size:17px;cursor:pointer;color:#fff;
    box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .12s;flex:none}
  .icbtn:active{transform:scale(.9)}
  .icbtn.boost{background:linear-gradient(160deg,#e8a888,#c9705e);border-color:#f4c4a8}
  .spacer{flex:1}
  .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;
    background:#e8604a;color:#fff;font-size:10.5px;font-weight:900;display:none;align-items:center;justify-content:center;
    border:2px solid #26401c}
  .badge.on{display:flex}
  .badge.dot{min-width:12px;height:12px;padding:0}

  .fieldbar{position:absolute;left:0;right:0;z-index:19;display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:none}
  .fieldbar>*{pointer-events:auto}
  .fbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(18,30,14,.55);
    color:#fff;font-weight:900;font-size:14px;cursor:pointer;display:grid;place-items:center}
  .fbtn.off{opacity:.25;pointer-events:none}
  .fname{font-family:var(--dis-font);font-weight:800;font-size:15px;padding:3px 14px;border-radius:999px;
    background:rgba(18,30,14,.55);border:1px solid var(--line);min-width:120px;text-align:center}
  .dots{display:flex;gap:4px;justify-content:center;margin-top:2px}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3)}
  .dots i.on{background:#fff}

  .lockcard{position:absolute;left:50%;transform:translate(-50%,-50%);z-index:18;width:min(300px,84%);
    background:rgba(24,38,18,.92);border:1px solid var(--line);border-radius:20px;padding:18px 16px;text-align:center;
    display:none;flex-direction:column;gap:10px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .lockcard.on{display:flex}
  .lockcard h3{font-family:var(--dis-font);font-size:20px;font-weight:800}
  .lockcard p{font-size:13px;opacity:.85;line-height:1.45}
  .lockcard .req{font-size:13px;font-weight:800}
  .lockcard .req.ok{color:#a8e070}.lockcard .req.no{color:#ffb0a0}

  .harvestall{pointer-events:auto;background:linear-gradient(160deg,var(--gold),var(--gold2));color:#2a2115;border:none;
    font-weight:900;font-size:12px;padding:5px 12px;border-radius:999px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer;display:none;white-space:nowrap}
  .harvestall.on{display:block}
  .harvestall:active{transform:scale(.95)}

  .menu{position:absolute;left:0;right:0;z-index:20;display:flex;gap:6px;justify-content:center;padding:0 8px}
  .menu .icbtn{width:46px;height:46px;font-size:20px}
  .dock{position:absolute;left:0;right:0;bottom:0;z-index:20;
    padding:8px 10px calc(10px + var(--sab));display:flex;gap:8px;justify-content:center}
  .tool{position:relative;flex:1;max-width:120px;border-radius:16px;cursor:pointer;padding:7px 4px 6px;
    color:#fff;background:rgba(18,30,14,.65);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    transition:transform .12s,background .2s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .tool:active{transform:translateY(2px) scale(.96)}
  .tool .ic{font-size:19px;line-height:1.05;height:22px;display:flex;align-items:center}
  .tool .ic canvas{width:22px;height:22px;image-rendering:pixelated}
  .tool .tx{font-size:10px;font-weight:800;letter-spacing:.03em;opacity:.92}
  .tool.armed{background:linear-gradient(160deg,rgba(232,200,138,.45),rgba(201,160,94,.32));border-color:var(--gold)}
  .tool .fill{position:absolute;left:0;bottom:0;height:3px;background:#6fb4e0;transition:width .2s}
  .tool .free{position:absolute;top:3px;right:6px;font-size:9px;font-weight:900;background:#a8e070;color:#203018;border-radius:6px;padding:0 4px}

  .sheet{position:absolute;inset:0;z-index:40;background:rgba(10,18,8,.74);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  .panel{width:100%;max-height:86%;background:#26401c;border:1px solid var(--line);
    border-radius:var(--r) var(--r) 0 0;padding:16px 14px calc(16px + var(--sab));
    display:flex;flex-direction:column;gap:12px;animation:rise .24s ease-out;overflow:hidden}
  @keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .panel h2{font-family:var(--dis-font);font-size:21px;font-weight:800}
  .panel .head{display:flex;align-items:center;gap:10px}
  .panel .sub{font-size:12.5px;opacity:.75;font-weight:600;line-height:1.4}
  .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;margin:0 -4px;padding:0 4px 4px;
    display:flex;flex-direction:column;gap:8px}
  .tabs{display:flex;gap:6px;background:rgba(0,0,0,.22);padding:4px;border-radius:12px}
  .tab{flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-weight:800;font-size:13px;
    cursor:pointer;opacity:.6;transition:background .2s,opacity .2s}
  .tab.on{background:rgba(255,255,255,.14);opacity:1}
  .sect{font-family:var(--dis-font);font-weight:800;font-size:15px;opacity:.85;margin-top:6px}

  .item{display:flex;align-items:center;gap:11px;padding:10px 11px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);border-radius:14px}
  .item canvas{width:42px;height:42px;flex:none;image-rendering:pixelated}
  .item .em{width:42px;text-align:center;font-size:26px;flex:none}
  .item .body{flex:1;min-width:0}
  .item .t{font-weight:800;font-size:14px}
  .item .s{font-size:11.5px;opacity:.7;font-weight:600;margin-top:2px;line-height:1.4}
  .item.locked{opacity:.55}
  .item.sel{border-color:var(--gold);background:rgba(232,200,138,.14)}
  .item.done{border-color:#a8e070;background:rgba(168,224,112,.1)}
  .btns2{display:flex;flex-direction:column;gap:5px;flex:none}
  .buy{border:none;background:linear-gradient(160deg,var(--gold),var(--gold2));color:#2a2115;
    font-weight:900;font-size:12.5px;padding:8px 12px;border-radius:11px;
    cursor:pointer;flex:none;transition:transform .12s;white-space:nowrap}
  .buy:active{transform:scale(.94)}
  .buy.ghost{background:rgba(255,255,255,.12);color:#fff}
  .buy.ad{background:linear-gradient(160deg,#e8a888,#c9705e);color:#fff}
  .buy.off{opacity:.4}
  .bar{height:6px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:#a8e070}
  .need{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
  .need span{font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.25)}
  .need span.ok{background:rgba(168,224,112,.25);color:#d8f8b8}
  .need span.no{color:#ffc0b0}
  .empty{opacity:.65;text-align:center;padding:26px 10px;font-size:14px;font-weight:700}

  .row{display:flex;align-items:center;gap:10px;padding:11px 12px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.09);border-radius:13px}
  .row .lab{flex:1;font-weight:700;font-size:14px}
  .row .rsub{font-size:11.5px;opacity:.66;font-weight:600;margin-top:2px}
  .sw{width:50px;height:29px;border-radius:999px;background:rgba(255,255,255,.16);position:relative;cursor:pointer;flex:none;transition:background .2s}
  .sw::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:transform .2s}
  .sw.on{background:var(--gold2)}
  .sw.on::after{transform:translateX(21px)}
  .seg{display:flex;gap:4px;background:rgba(0,0,0,.25);border-radius:10px;padding:3px}
  .seg div{padding:6px 12px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;opacity:.6}
  .seg div.on{background:rgba(255,255,255,.16);opacity:1}
  .btn{border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;
    font-weight:800;font-size:14px;padding:12px 16px;border-radius:13px;cursor:pointer;transition:transform .12s}
  .btn:active{transform:scale(.96)}
  .btn.pri{background:linear-gradient(160deg,var(--gold),var(--gold2));color:#2a2115;border-color:transparent}
  .btn.off{opacity:.45}
  .btn.ad{background:linear-gradient(160deg,#e8a888,#c9705e);border-color:transparent}
  a.link{color:var(--gold);font-weight:800;font-size:13px;text-align:center;padding:6px}

  .toast{position:absolute;left:50%;transform:translateX(-50%);
    z-index:60;background:rgba(18,30,14,.92);backdrop-filter:blur(14px);border:1px solid var(--line);
    border-radius:14px;padding:9px 15px;font-weight:800;font-size:13px;max-width:88%;text-align:center;
    opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.4)}
  .toast.on{opacity:1}

  .tut{position:absolute;left:50%;transform:translateX(-50%);z-index:23;max-width:86%;
    background:#fff8e0;color:#2a2115;border-radius:16px;padding:10px 14px;font-weight:900;font-size:14px;
    text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45);display:none;animation:bob 1.6s ease-in-out infinite}
  .tut.on{display:block}
  @keyframes bob{0%,100%{margin-top:0}50%{margin-top:-4px}}
  .glow{animation:glow 1.1s ease-in-out infinite!important}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,232,150,.9)}50%{box-shadow:0 0 0 7px rgba(255,232,150,0)}}

  .pop{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
    background:rgba(10,18,8,.72);backdrop-filter:blur(10px);padding:20px}
  .pop.on{display:flex}
  .popcard{background:linear-gradient(165deg,#3c6a2c,#223a18);border:1px solid var(--line);border-radius:22px;
    padding:20px 18px;max-width:330px;width:100%;text-align:center;display:flex;flex-direction:column;
    gap:12px;align-items:center;animation:popin .3s cubic-bezier(.2,1.4,.5,1);box-shadow:0 20px 60px rgba(0,0,0,.5)}
  @keyframes popin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  .popcard .big{font-size:44px;line-height:1}
  .popcard h3{font-family:var(--dis-font);font-size:22px;font-weight:800}
  .popcard p{font-size:13.5px;line-height:1.55;opacity:.9;white-space:pre-line}
  .popcard .gift{background:rgba(232,200,138,.16);border:1px solid var(--gold);border-radius:14px;padding:10px;width:100%}
  .popcard .gift b{font-family:var(--dis-font);font-size:16px;display:block}
  .popcard input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);
    background:rgba(0,0,0,.25);color:#fff;font-family:var(--ui-font);font-weight:800;font-size:16px;text-align:center}
  .popcard .btns{display:flex;gap:8px;width:100%}
  .popcard .btns .btn{flex:1}

  .fakead{position:absolute;inset:0;z-index:90;background:#000;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;color:#fff;font-weight:900}
  .fakead.on{display:flex}
  .fakead .bar{width:60%}
  .fakead .fill{display:block;height:100%;width:0;background:#e8c88a}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

  <div class="hud" id="hud">
    <div class="hrow">
      <div class="chip" id="cCoins">🪙 <span id="tCoins">0</span></div>
      <div class="chip lvchip" id="cLv">⭐ <span id="tLv">Lv 1</span><div class="xp"><i id="xpBar"></i></div></div>
      <div class="spacer"></div>
      <div class="icbtn boost" id="bBoost">🎬</div>
      <div class="icbtn" id="bSet">⚙️</div>
    </div>
    <div class="hrow">
      <div class="chip sm" id="cWx">—</div>
      <div class="chip sm hot hide" id="cFest">—</div>
      <div class="chip sm hot hide" id="cX2">—</div>
      <div class="chip sm hide" id="cRain">—</div>
      <div class="spacer"></div>
      <button class="harvestall" id="bHarvestAll">—</button>
    </div>
  </div>

  <div class="fieldbar" id="fieldbar">
    <div class="fbtn" id="fPrev">◀</div>
    <div><div class="fname" id="fName">—</div><div class="dots" id="fDots"></div></div>
    <div class="fbtn" id="fNext">▶</div>
  </div>

  <div class="lockcard" id="lockCard">
    <h3 id="lkTitle">—</h3>
    <p id="lkNote"></p>
    <div id="lkReqs"></div>
    <button class="btn pri" id="lkBuy">—</button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="tut" id="tut"></div>

  <div class="menu" id="menu">
    <div class="icbtn" id="bBag">🧺<span class="badge" id="bdBag"></span></div>
    <div class="icbtn" id="bOrders">📋<span class="badge dot" id="bdOrders"></span></div>
    <div class="icbtn" id="bKitchen">🍳<span class="badge dot" id="bdKitchen"></span></div>
    <div class="icbtn" id="bShop">🛒</div>
    <div class="icbtn" id="bBook">📗</div>
    <div class="icbtn" id="bGoals">🏆<span class="badge dot" id="bdGoals"></span></div>
  </div>

  <div class="dock" id="dock">
    <div class="tool armed" id="tHand"><div class="ic"><canvas id="seedIc" width="24" height="24"></canvas></div><div class="tx" id="handTx">Plant</div><span class="free" id="freeTag" style="display:none"></span></div>
    <div class="tool" id="tWater"><div class="ic">💧</div><div class="tx" id="waterTx">Water</div><div class="fill"></div></div>
    <div class="tool" id="tClear"><div class="ic">🌿</div><div class="tx" id="clearTx">Clear</div></div>
  </div>

  <!-- Sheets -->
  <div class="sheet" id="shBag"><div class="panel">
    <div class="head"><h2 id="hBag">Basket</h2><div class="spacer"></div><div class="chip">🪙 <span class="coinMirror">0</span></div><div class="icbtn" data-close>✕</div></div>
    <div class="scroll" id="bagBody"></div>
    <button class="btn pri" id="bSellAll">—</button>
  </div></div>

  <div class="sheet" id="shOrders"><div class="panel">
    <div class="head"><h2 id="hOrders">Orders</h2><div class="spacer"></div><div class="icbtn" data-close>✕</div></div>
    <div class="scroll" id="ordBody"></div>
  </div></div>

  <div class="sheet" id="shKitchen"><div class="panel">
    <div class="head"><h2 id="hKitchen">Kitchen</h2><div class="spacer"></div><div class="icbtn" data-close>✕</div></div>
    <div class="scroll" id="kitBody"></div>
  </div></div>

  <div class="sheet" id="shShop"><div class="panel">
    <div class="head"><h2 id="hShop">Shop</h2><div class="spacer"></div><div class="chip">🪙 <span class="coinMirror">0</span></div><div class="icbtn" data-close>✕</div></div>
    <div class="tabs" id="shopTabs"><div class="tab on" data-tab="seeds"></div><div class="tab" data-tab="up"></div><div class="tab" data-tab="decor"></div></div>
    <div class="scroll" id="shopBody"></div>
  </div></div>

  <div class="sheet" id="shBook"><div class="panel">
    <div class="head"><h2 id="hBook">Almanac</h2><div class="spacer"></div><div class="chip" id="bookCount">0</div><div class="icbtn" data-close>✕</div></div>
    <div class="scroll" id="bookBody"></div>
  </div></div>

  <div class="sheet" id="shGoals"><div class="panel">
    <div class="head"><h2 id="hGoals">Goals</h2><div class="spacer"></div><div class="chip" id="goalCount">0</div><div class="icbtn" data-close>✕</div></div>
    <div class="scroll" id="goalBody"></div>
  </div></div>

  <div class="sheet" id="shBoost"><div class="panel">
    <div class="head"><h2 id="hBoost">Boosts</h2><div class="spacer"></div><div class="icbtn" data-close>✕</div></div>
    <div class="sub" id="boostSub"></div>
    <div class="scroll" id="boostBody"></div>
  </div></div>

  <div class="sheet" id="shSet"><div class="panel">
    <div class="head"><h2 id="hSet">Settings</h2><div class="spacer"></div><div class="icbtn" data-close>✕</div></div>
    <div class="scroll" id="setBody"></div>
  </div></div>

  <div class="pop" id="popup"><div class="popcard">
    <div class="big" id="puIcon"></div>
    <h3 id="puTitle">—</h3>
    <p id="puBody">—</p>
    <div class="gift" id="puGift" style="display:none"><b id="puGiftT"></b><span id="puGiftB"></span></div>
    <input id="puInput" maxlength="14" style="display:none"/>
    <div class="btns"><button class="btn" id="puNo">—</button><button class="btn pri" id="puYes">—</button></div>
  </div></div>

  <div class="fakead" id="fakeAd"><div>🎬 <span id="fakeAdTx">Test video</span></div><div class="bar"><i class="fill"></i></div></div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/sound.js"></script>
<script src="js/ads.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
