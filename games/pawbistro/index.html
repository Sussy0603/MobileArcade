<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6b3f26">
<title>Paw Bistro</title>
<style>
/* =====================================================================
   PAW BISTRO — styles
   Warm wood + cream + red checkers + mustard.
   Change the colors here to restyle the menus.
===================================================================== */
:root{
  --wood:#7a4a2e; --wood2:#a0663f; --wood3:#c98f5e; --cream:#fff4e0; --cream2:#f6e2bf;
  --red:#d9473b; --red2:#a8322a; --mustard:#f4b73a; --mustard2:#c98a10; --mint:#6fc39b; --mint2:#3d9a70;
  --ink:#4a2a18; --ink2:#8a6248; --card:#fffaf0; --line:#ead2ac; --bad:#e2554a; --sky:#5aa7e8;
  --font:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#3d2416;color:var(--ink);font-family:var(--font);font-size:15px}
body.easy{--font:Verdana,"Segoe UI",Tahoma,sans-serif;letter-spacing:.04em;word-spacing:.12em}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- top bars ---------- */
.bar{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;
  background:linear-gradient(#8a5434,#6b3f26);border-bottom:3px solid #4a2a18;z-index:5;color:var(--cream);flex-wrap:wrap;row-gap:7px}
.pill{display:flex;align-items:center;gap:5px;background:#fff4e0;color:var(--ink);border-radius:99px;padding:5px 11px;font-weight:900;
  box-shadow:0 2px 0 #3d2416;white-space:nowrap;transition:transform .12s}
.pill.bump{transform:scale(1.18)}
.pill.warn{background:#ffd9d4;color:var(--red2)}
.pill.red{background:var(--red);color:#fff}
#hDay{min-width:0;max-width:44vw;overflow:hidden;text-overflow:ellipsis;display:block}
#hud{flex-wrap:wrap}
#hud > .pill,#hud > button{flex-shrink:0}
#hud > #hDay{flex-shrink:1}
.right{margin-left:auto}
#goalWrap{order:9;flex:1 1 100%;min-width:0;position:relative;height:16px;margin:0 4px 2px;background:#3d2416;border-radius:99px;box-shadow:inset 0 2px 3px #0006}
#goalFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(#ffd56a,var(--mustard));transition:width .25s}
.gstar{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:18px;filter:grayscale(1) brightness(.6);transition:transform .2s}
.gstar.on{filter:none;transform:translate(-50%,-50%) scale(1.25)}
.sqbtn{width:38px;height:38px;border-radius:12px;background:var(--cream);color:var(--ink);font-size:18px;font-weight:900;box-shadow:0 3px 0 #3d2416}

#stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;left:0;top:0;touch-action:none}

/* ---------- town bottom bar ---------- */
#townBar{display:flex;gap:6px;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#8a5434,#6b3f26);border-top:3px solid #4a2a18;z-index:5}
#townBar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:14px;background:var(--cream);font-weight:900;font-size:.8em;box-shadow:0 3px 0 #3d2416}
#townBar button span{font-size:22px;line-height:1.1}
#townBar button:active{transform:translateY(2px)}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:20px;
  padding-top:calc(20px + env(safe-area-inset-top));background:#2a160bcc}
.ov.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
.box{background:var(--card);border-radius:24px;padding:18px;width:100%;max-width:400px;max-height:100%;overflow:auto;
  border:4px solid var(--wood);box-shadow:0 8px 0 #2a160b;animation:pop .28s}
.box h2{margin:0 0 10px;text-align:center;font-size:1.45em;color:var(--red2)}
.box h3{margin:12px 2px 6px;font-size:1.05em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:16px;font-weight:900;font-size:1.05em;
  background:var(--cream2);color:var(--ink);box-shadow:0 4px 0 #b99367;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b99367}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red2)}
.btn.gold{background:var(--mustard);color:var(--ink);box-shadow:0 4px 0 var(--mustard2)}
.btn.mint{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint2)}
.btn.wide{display:flex;width:100%;margin-top:10px}
.btn.big{font-size:1.4em;padding:16px 22px}
.btn.sm{padding:8px 11px;font-size:.92em}
.btn[disabled]{opacity:.45;filter:grayscale(.6)}
.muted{color:var(--ink2);font-size:.9em}
.center{text-align:center}
.row{display:flex;gap:8px}
.row .btn{flex:1}

/* title screen */
#title{background:radial-gradient(circle at 50% 30%,#a0663f,#5a3320 70%);justify-content:space-between;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#tTop{width:100%;display:flex;justify-content:flex-end}
.sign{background:var(--cream);border:6px solid var(--red);border-radius:28px;padding:14px 22px 10px;text-align:center;box-shadow:0 0 0 5px var(--cream),0 0 0 9px var(--wood),0 12px 0 9px #2a160b;
  transform:rotate(-2deg);animation:swing 3s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.sign h1{margin:0;font-size:2.6em;line-height:1;color:var(--red);letter-spacing:.02em;text-shadow:3px 3px 0 #f4b73a}
.sign .sub{font-weight:900;color:var(--ink2);margin-top:4px}
#tPets{font-size:38px;display:flex;gap:6px;justify-content:center;margin:18px 0 6px}
#tPets span{display:inline-block;animation:hop 1.2s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#tHow{color:var(--cream);font-weight:800;text-align:center;max-width:320px;line-height:1.4}
#tBtns{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}

/* result */
.stars{display:flex;justify-content:center;gap:8px;font-size:52px;margin:4px 0 8px}
.stars span{filter:grayscale(1) opacity(.35);transform:scale(.7);transition:all .3s cubic-bezier(.3,1.8,.5,1)}
.stars span.on{filter:none;transform:scale(1)}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--cream2);border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:6px}
.stats b{text-align:right}
.bigcoins{text-align:center;font-size:2em;font-weight:900;color:var(--mustard2)}

/* lists (shop, staff, pets) */
#shop .box,#book .box,#staff .box{display:flex;flex-direction:column;height:100%;max-height:660px;padding:12px}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{flex:1;padding:9px 2px;border-radius:12px;font-weight:900;background:var(--cream2);font-size:.85em}
.tabs button.on{background:var(--red);color:#fff}
.list{flex:1;overflow:auto;padding:2px}
.card{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:9px;margin-bottom:8px}
.card .ic{font-size:34px;width:46px;text-align:center;flex-shrink:0}
.card .tx{flex:1;min-width:0}
.card .nm{font-weight:900}
.card .ds{font-size:.82em;color:var(--ink2)}
.dots{display:flex;gap:3px;margin-top:3px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--mustard)}
.card .btn{padding:9px 11px;font-size:.92em;flex-shrink:0;min-width:84px}
.card.owned{background:#f1fbf5;border-color:#bfe6d0}
.card.lock{opacity:.6}
.tag{display:inline-block;background:var(--mint);color:#fff;font-weight:900;border-radius:99px;padding:5px 11px;font-size:.85em}
.coinTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.coinTop h2{margin:0}
.hearts{letter-spacing:-2px;font-size:.95em}
.story{font-size:.82em;color:var(--ink2);margin-top:3px;font-style:italic}

/* settings */
.set{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:2px dashed var(--line);font-weight:800}
.tog{width:58px;height:32px;border-radius:99px;background:#d8c4a6;position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px #0004}
.tog.on{background:var(--mint)}
.tog.on::after{left:30px}

#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:40;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:max-content;max-width:92vw}
#toast div{background:var(--ink);color:#fff;padding:8px 16px;border-radius:99px;font-weight:900;animation:pop .25s;box-shadow:0 3px 0 #0004;text-align:center}
#toast div.gold{background:var(--mustard);color:var(--ink)}
#toast div.err{background:var(--bad)}
#toast div.mint{background:var(--mint)}
</style>
</head>
<body>
<div id="app">
  <!-- game top bar (Bistro + shop mini games) -->
  <div class="bar" id="hud">
    <div class="pill red" id="hDay">Day 1</div>
    <div class="pill" id="hCoins">🪙 0</div>
    <div class="pill right" id="hTime">2:00</div>
    <button class="sqbtn" id="hPause" aria-label="Pause">II</button>
    <div id="goalWrap"><div id="goalFill"></div><span class="gstar" id="gs1">⭐</span><span class="gstar" id="gs2">⭐</span><span class="gstar" id="gs3">⭐</span></div>
  </div>
  <!-- town top bar -->
  <div class="bar" id="townHud">
    <div class="pill" id="tCoins">🪙 0</div>
    <div class="pill" id="tPop">🐾 0</div>
    <div class="pill" id="tStars">⭐ 0</div>
    <button class="sqbtn right" id="tSetBtn" aria-label="Settings">⚙️</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="townBar">
    <button id="bPets"><span>🐾</span><b data-t>Pets</b></button>
    <button id="bStaff"><span>🧑‍🍳</span><b data-t>Staff</b></button>
    <button id="bShop"><span>🛒</span><b data-t>Shop</b></button>
  </div>
</div>

<!-- title -->
<div class="ov on" id="title">
  <div id="tTop"><div class="pill" id="tiCoins">🪙 0</div></div>
  <div style="display:flex;flex-direction:column;align-items:center">
    <div class="sign"><h1>Paw Bistro</h1><div class="sub">🐾 <span data-t>Cozy Pet Town</span> 🐾</div></div>
    <div id="tPets"><span>🐶</span><span style="animation-delay:.15s">🐰</span><span style="animation-delay:.3s">🐻</span><span style="animation-delay:.45s">🐼</span><span style="animation-delay:.6s">🦊</span></div>
    <div id="tHow"></div>
  </div>
  <div id="tBtns">
    <button class="btn red big" id="tPlay">▶ Play</button>
    <button class="btn" id="tSet">⚙️ Settings</button>
  </div>
</div>

<div class="ov" id="pause"><div class="box" id="pauseBox"></div></div>
<div class="ov" id="result"><div class="box" id="resBox"></div></div>
<div class="ov" id="shop"><div class="box">
  <div class="coinTop"><h2>🛒 <span id="shTitle">Shop</span></h2><div class="pill" id="shCoins">🪙 0</div></div>
  <div class="tabs" id="shTabs"></div>
  <div class="list" id="shopList"></div>
  <button class="btn wide red" id="shClose">✔ Done</button>
</div></div>
<div class="ov" id="book"><div class="box">
  <div class="coinTop"><h2>🐾 <span id="bkTitle">Pets</span></h2><div class="pill" id="bkCount">0</div></div>
  <div class="list" id="bookList"></div>
  <button class="btn wide red" id="bkClose">✔ Done</button>
</div></div>
<div class="ov" id="staff"><div class="box">
  <div class="coinTop"><h2>🧑‍🍳 <span id="stTitle">Staff</span></h2><div class="pill" id="stCoins">🪙 0</div></div>
  <div class="list" id="staffList"></div>
  <button class="btn wide red" id="stClose">✔ Done</button>
</div></div>
<div class="ov" id="settings"><div class="box" id="setBox"></div></div>
<div class="ov" id="modal" style="z-index:30"><div class="box" id="modalBox"></div></div>

<div id="toast"></div>
<canvas id="fx" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:35"></canvas>

<script>
'use strict';
/* =====================================================================
   PAW BISTRO — a cozy pet town by MOS Arcade
   ---------------------------------------------------------------------
   HOW THE CODE IS ORGANIZED (each part is one "section" below)
     1. CONFIG    — every tuning number (change these to change the feel)
     2. DATA      — shops, stations, dishes, branches, pets, upgrades
     3. SAVE      — progress saved on the phone (localStorage)
     4. WORDS     — English + French text
     5. CORE      — small helpers, sounds, paths, particles, confetti
     6. TOWN      — the town map: houses, neighbors, shops, staff
     7. BISTRO    — the restaurant game (stations, orders, waiter)
     8. BAKERY / ICE CREAM / SALON / FLOWERS — the 4 shop mini games
     9. SCREENS   — menus: building panels, pets book, staff, shop, settings
    10. MONEY     — rewarded ads (AdMob) + Golden Diner pack (Google Play)
    11. START     — scenes + the main loop
===================================================================== */

/* =====================================================================
   1. CONFIG — tune the game here
===================================================================== */
const CONFIG = {
  // ---------- town ----------
  MOVE_IN_GAP: 18,         // seconds between new neighbors moving in (when a house has room)
  PET_SPEED: 48,           // how fast pets walk around town
  VISIT_CHANCE: .6,        // when a pet decides what to do: chance it visits a shop
  SHOP_QUEUE_MAX: 5,       // max pets waiting inside one shop
  QUEUE_GIVE_UP: 90,       // a waiting pet leaves a shop after this many seconds
  STAFF_EVERY: [0, 30, 18, 10], // staff serve one waiting pet every N seconds (staff level 1, 2, 3)
  STAFF_PAY: .5,           // staff earn this part of what you earn playing yourself
  OFFLINE_MAX_H: 2,        // "while you were away" earnings stop after this many hours
  // ---------- bistro ----------
  DAY_SECONDS: 120,        // how long each Bistro day lasts (seconds)
  CLOSING_GRACE: 25,       // after closing, seated pets get this long to finish
  SPAWN_FIRST: 1.2,        // first pet walks in after this many seconds
  SPAWN_GAP_START: 7.5,    // seconds between pets on day 1
  SPAWN_GAP_PER_DAY: 0.3,  // ...gets this much shorter each day
  SPAWN_GAP_MIN: 3.6,      // ...but never shorter than this
  SPAWN_JITTER: 0.35,      // random ± part of the gap (0.35 = ±35%)
  QUEUE_MAX: 4,            // max pets waiting at the door
  PATIENCE: 30,            // seconds a pet waits at each step before leaving angry
  PATIENCE_PER_DAY: -0.45, // patience change per day (negative = less patient)
  PATIENCE_MIN: 15,        // patience never goes under this
  REFILL_SEATED: 0.35,     // patience given back when seated (0..1)
  REFILL_ORDER: 0.3,       // patience given back when you take the order
  THINK_TIME: 1.5,         // seconds a pet reads the menu
  EAT_TIME: 2.0,           // seconds a pet eats
  WALK_SPEED: 210,         // how fast pets walk in the Bistro
  WAITER_SPEED: 330,       // how fast the penguin waiter walks
  BURN_TIME: 7,            // grill / oven / pot: food burns if left this long after it's done
  HELPER_EVERY: [0, 8, 5, 3], // kitchen helper does one job every N seconds (staff level 1, 2, 3)
  VIP_FROM_DAY: 2,         // VIPs start showing up on this day
  VIP_CHANCE: 0.09,        // chance a new pet is a VIP
  VIP_PAY: 3,              // VIPs pay this many times the price
  VIP_PATIENCE: 0.75,      // VIPs are less patient (0.75 = 75%)
  TIP_MIN: 0.1,            // tip (part of price) when patience is empty
  TIP_MAX: 0.6,            // tip when patience is full
  COMBO_WINDOW: 8,         // serve again within this many seconds to grow the combo
  COMBO_STEP: 0.1,         // each combo step adds +10% coins
  COMBO_MAX: 6,            // highest combo
  GOAL_BASE: 60,           // day 1 coin goal for 1 star
  GOAL_PER_DAY: 30,        // goal grows this much each day
  GOAL_GROWTH: 1.03,       // ...and by 3% on top each day
  STAR2: 1.5,              // 2 stars at goal × 1.5
  STAR3: 2.1,              // 3 stars at goal × 2.1
  // ---------- shop mini games ----------
  MG_SECONDS: 60,          // one round in the Bakery / Ice cream / Salon / Flowers
  MG_PATIENCE: 24,         // seconds a customer waits in those shops
  // ---------- friends ----------
  FRIEND_LEVELS: [0, 3, 8, 15, 25, 40], // friendship points needed for 0..5 hearts
  // ---------- juice ----------
  SHAKE_SMALL: 4, SHAKE_BIG: 8,
  CONFETTI: 170,           // confetti pieces when you get 3 stars
  FREE_COINS_COOLDOWN: 300 // seconds between free-coin ads in the shop
};

/* =====================================================================
   2. DATA
===================================================================== */
const W = 400, H = 720;   // every scene is drawn on a 400×720 board, scaled to the phone

/* the 5 shops in town (pos = where the building stands on the town map) */
const SHOPS = {
  bistro:  {e:'🍽️', name:'Paw Bistro',      cost:0,    pos:[200,104], color:'#d9473b', awn:'#fff4e0', staff:{e:'🐻', n:'Chef Bruno'}, base:0,  staffCost:[0,400,1200,3000], top:true},
  bakery:  {e:'🧁', name:'Bakery',          cost:350,  pos:[66,108],  color:'#f29ab0', awn:'#fff', staff:{e:'🐰', n:'Mimi'},  base:16, staffCost:[0,300,900,2200], top:true},
  icecream:{e:'🍦', name:'Ice Cream Stand', cost:800,  pos:[334,108], color:'#5aa7e8', awn:'#fff', staff:{e:'🐨', n:'Kiki'},  base:15, staffCost:[0,350,1000,2500], top:true},
  salon:   {e:'✂️', name:'Pet Salon',       cost:1500, pos:[106,664], color:'#a58cff', awn:'#fff', staff:{e:'🐩', n:'Fifi'},  base:22, staffCost:[0,450,1300,3200]},
  flowers: {e:'💐', name:'Flower Shop',     cost:2400, pos:[294,664], color:'#3d9a70', awn:'#fff', staff:{e:'🦔', n:'Hazel'}, base:20, staffCost:[0,500,1400,3500]},
};
const SHOP_IDS = Object.keys(SHOPS);
const SHOP_UP_COST = [200, 450, 900, 1700, 3000]; // mini-game shop upgrades (+15% coins each)
const HOUSE_POS = [[140,238],[260,238],[140,314],[260,314],[140,456],[260,456],[140,532],[260,532]];
const HOUSE_COST = [0, 150, 300, 500, 800, 1200, 1700, 2300];
const HOUSE_ROOF = ['#d9473b','#5aa7e8','#6fc39b','#f4b73a','#a58cff','#f29ab0','#e07b39','#4fb3a5'];
const ROAD_PTS = [[70,178],[200,168],[330,178],[346,386],[330,596],[200,606],[70,596],[54,386]];
const PARK = [200,386];

/* Bistro kitchen stations — each one cooks a different part of a dish */
const STATIONS = {
  grill:  {e:'🔥', name:'Grill',         snd:'sizzle', burn:true, pos:[70,92]},
  oven:   {e:'♨️', name:'Oven',          snd:'oven',   burn:true, pos:[200,92]},
  pot:    {e:'🫕', name:'Pot',           snd:'bubble', burn:true, pos:[330,92]},
  board:  {e:'🔪', name:'Cutting board', snd:'chop',   pos:[70,170]},
  prep:   {e:'🥣', name:'Prep table',    snd:'prep',   pos:[200,170]},
  freezer:{e:'❄️', name:'Freezer',       snd:'ice',    pos:[330,170]},
};
const STATION_IDS = Object.keys(STATIONS);

/* dishes: steps = [station, seconds, what it looks like after this step] */
const DISHES = {
  cookie:   {e:'🍪', price:9,  steps:[['oven',3]]},
  pancake:  {e:'🥞', price:12, steps:[['grill',3.5]]},
  burger:   {e:'🍔', price:20, steps:[['grill',3.5,'🥩'],['prep',1.5]]},
  pizza:    {e:'🍕', price:24, steps:[['prep',1.5,'🫓'],['oven',4]]},
  soup:     {e:'🍲', price:18, steps:[['board',2,'🥕'],['pot',4]]},
  spaghetti:{e:'🍝', price:26, steps:[['pot',4,'🍜'],['prep',1.5]]},
  cake:     {e:'🍰', price:30, steps:[['oven',4.5,'🍞'],['prep',2]]},
  sushi:    {e:'🍣', price:34, steps:[['board',3,'🐟'],['prep',1.5]]},
  sundae:   {e:'🍨', price:28, steps:[['freezer',2.5,'🍦'],['prep',1.5]]},
  shrimp:   {e:'🍤', price:26, steps:[['grill',3.5]]},
  coco:     {e:'🥥', price:22, steps:[['board',2.5,'🥥'],['freezer',2]]},
  shaved:   {e:'🍧', price:24, steps:[['freezer',2.5,'🧊'],['prep',1.5]]},
  taco:     {e:'🌮', price:28, steps:[['grill',3,'🥩'],['prep',2]]},
  cocoa:    {e:'☕', price:16, steps:[['pot',3]]},
  pie:      {e:'🥧', price:30, steps:[['prep',2,'🫓'],['oven',4.5]]},
  stew:     {e:'🥘', price:32, steps:[['board',2.5,'🥕'],['pot',4.5]]},
  oden:     {e:'🍢', price:24, steps:[['pot',3.5]]},

let AC = null, master = null, musGain = null;
function audio(){
  if(AC) return AC;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .6; master.connect(AC.destination);
    musGain = AC.createGain(); musGain.gain.value = .35; musGain.connect(master);
  }catch(e){ AC = null; }
  return AC;
}
function tone(f, d, type, v, f2, delay, dest){
  const a = audio(); if(!a) return;
  const t = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v || .1, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + d + .05);
}
let NOISE = null;
function noise(d, v, type, freq, q, delay){
  const a = audio(); if(!a) return;
  if(!NOISE){ NOISE = a.createBuffer(1, a.sampleRate, a.sampleRate); const ch = NOISE.getChannelData(0); for(let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const t = a.currentTime + (delay || 0), src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = NOISE; f.type = type || 'highpass'; f.frequency.value = freq || 2000; f.Q.value = q || .7;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + d);
  src.connect(f); f.connect(g); g.connect(master); src.start(t, Math.random() * .5); src.stop(t + d + .05);
}

/* ---------- curvy paths (Catmull-Rom splines) ----------
   mkPath([[x,y],...]) makes a smooth curve through the points.
   pathAt(path, distance) gives the position at that distance along it. */
function mkPath(pts, closed){
  const n = pts.length, out = [];
  if(n === 1) pts = [pts[0], pts[0]];
  const P = pts.length, get = i => closed ? pts[(i + P) % P] : pts[clamp(i, 0, P - 1)];
  const segs = closed ? P : P - 1;
  for(let i = 0; i < segs; i++){
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    for(let k = 0; k < 10; k++){
      const t = k / 10, t2 = t * t, t3 = t2 * t;
      const f = j => .5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3);
      out.push({x:f(0), y:f(1)});
    }
  }
  if(!closed) out.push({x:pts[P - 1][0], y:pts[P - 1][1]});
  let L = 0; out[0].d = 0;
  for(let i = 1; i < out.length; i++){ L += Math.hypot(out[i].x - out[i - 1].x, out[i].y - out[i - 1].y); out[i].d = L; }
  const total = closed ? L + Math.hypot(out[0].x - out[out.length - 1].x, out[0].y - out[out.length - 1].y) : L;
  return {s:out, L:total, closed:!!closed, end:L};
}
function pathAt(P, d){
  const s = P.s;
  if(P.closed){ d = ((d % P.L) + P.L) % P.L; } else d = clamp(d, 0, P.L);
  if(d >= s[s.length - 1].d){
    const a = s[s.length - 1], b = P.closed ? s[0] : a, seg = P.L - a.d, t = seg > 0 ? (d - a.d) / seg : 0;
    return {x:a.x + (b.x - a.x) * t, y:a.y + (b.y - a.y) * t, dx:b.x - a.x};
  }
  let lo = 0, hi = s.length - 1;
  while(lo < hi){ const m = (lo + hi + 1) >> 1; if(s[m].d <= d) lo = m; else hi = m - 1; }
  const a = s[lo], b = s[lo + 1], t = (d - a.d) / ((b.d - a.d) || 1);
  return {x:a.x + (b.x - a.x) * t, y:a.y + (b.y - a.y) * t, dx:b.x - a.x};
}
/* a walker follows its path; returns true when it arrives. Speeds up / slows down softly. */
function walkPath(o, dt, speed){
  if(!o.path) return true;
  const P = o.path, left = P.L - o.pd;
  const sp = speed * (o.spd || 1) * (o.pd < 18 ? .6 + o.pd / 45 : 1) * (left < 22 ? .55 + left / 50 : 1);
  o.pd = Math.min(P.L, o.pd + sp * dt);
  const q = pathAt(P, o.pd); o.x = q.x; o.y = q.y;
  if(Math.abs(q.dx) > .3) o.face = q.dx < 0 ? -1 : 1;
  o.walk = (o.walk || 0) + dt * sp / 9;
  if(o.pd >= P.L){ o.path = null; return true; }
  return false;
}
function goTo(o, pts){ o.path = mkPath([[o.x, o.y], ...pts]); o.pd = 0; }

/* ---------- particles + floating text (shared by every scene) ---------- */
let FX = newFX();
function newFX(){ return {parts:[], floats:[], shake:0, pops:{}}; }
function part(x, y, kind, hud){
  const q = {x, y, kind, t:0, vx:rand(-60, 60), vy:rand(-120, -40), g:0, life:.8};
  if(kind === 'coin'){ q.vx = rand(-140, 140); q.vy = rand(-220, -80); q.life = 1.1; q.hx = hud[0]; q.hy = hud[1]; }
  if(kind === 'steam' || kind === 'smoke' || kind === 'chimney'){ q.vx = rand(-8, 8); q.vy = rand(-40, -25); q.life = kind === 'chimney' ? 2 : 1.2; q.r = rand(5, 9); }
  if(kind === 'spark' || kind === 'gold'){ const a = rand(0, Math.PI * 2), s = rand(60, kind === 'gold' ? 260 : 160); q.vx = Math.cos(a) * s; q.vy = Math.sin(a) * s; q.life = .6; }
  if(kind === 'heart'){ q.vy = rand(-70, -40); q.life = 1.1; }
  if(kind === 'crumb'){ q.vy = rand(-60, -20); q.g = 300; q.life = .5; }
  if(kind === 'note'){ q.vx = rand(-15, 15); q.vy = -40; q.life = 1.6; q.e = pick(['🎵','🎶']); }
  if(kind === 'oil'){ q.vx = rand(-90, 90); q.vy = rand(-200, -110); q.g = 600; q.life = .45; }
  if(kind === 'bubble'){ q.vx = rand(-6, 6); q.vy = rand(-35, -20); q.life = .8; q.r = rand(3, 6); }
  if(kind === 'frost'){ q.vx = rand(-12, 12); q.vy = rand(-18, -6); q.life = 1.3; }
  if(kind === 'leaf'){ q.vx = rand(-70, 70); q.vy = rand(-150, -80); q.g = 450; q.life = .6; }
  if(kind === 'drop'){ q.vx = rand(-120, 120); q.vy = rand(-220, -80); q.g = 700; q.life = .7; q.c = hud; }
  if(kind === 'snow'){ q.vx = rand(-10, 10); q.vy = rand(25, 45); q.life = 9; }
  if(kind === 'suds'){ q.vx = rand(-30, 30); q.vy = rand(-50, -10); q.life = .9; q.r = rand(4, 9); }
  if(kind === 'petal'){ q.vx = rand(-50, 50); q.vy = rand(-90, -30); q.g = 120; q.life = 1.1; q.e = hud || '🌸'; }
  FX.parts.push(q); return q;
}
function updFX(dt){
  for(const q of FX.parts){
    q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.g || 0) * dt;
    if(q.kind === 'coin' && q.t > .25){ q.vx += (q.hx - q.x) * dt * 9; q.vy += (q.hy - q.y) * dt * 9; q.vx *= .9; q.vy *= .9; }
    if(q.kind === 'snow') q.x += Math.sin(q.t * 2 + q.y * .02) * 12 * dt;
  }
  FX.parts = FX.parts.filter(q => q.t < q.life);
  for(const f of FX.floats){ f.t += dt; f.y -= dt * 38; }
  FX.floats = FX.floats.filter(f => f.t < f.life);
  for(const k in FX.pops){ FX.pops[k] -= dt * 3; if(FX.pops[k] <= 0) delete FX.pops[k]; }
  FX.shake = Math.max(0, FX.shake - dt * 20);
}
function drawParts(){
  for(const q of FX.parts){
    const a = 1 - q.t / q.life;
    ctx.globalAlpha = Math.max(0, q.kind === 'snow' ? Math.min(1, a * 4) : a);
    switch(q.kind){
      case 'coin': emoji('🪙', q.x, q.y, 18); break;
      case 'steam': case 'smoke': case 'chimney': ctx.fillStyle = q.kind === 'smoke' ? '#555' : '#fff'; ctx.globalAlpha = a * (q.kind === 'chimney' ? .45 : .6); ell(q.x, q.y, q.r * (1 + q.t), q.r * (1 + q.t)); ctx.fill(); break;
      case 'spark': ctx.fillStyle = '#fff6b0'; ell(q.x, q.y, 3, 3); ctx.fill(); break;
      case 'gold': emoji('✨', q.x, q.y, 16); break;
      case 'heart': emoji('❤️', q.x, q.y, 14); break;
      case 'crumb': ctx.fillStyle = '#c98f5e'; ctx.fillRect(q.x, q.y, 3, 3); break;
      case 'note': emoji(q.e, q.x, q.y, 16); break;
      case 'oil': ctx.fillStyle = '#ffd96a'; ell(q.x, q.y, 2.2, 2.2); ctx.fill(); break;
      case 'bubble': ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ell(q.x, q.y, q.r, q.r); ctx.stroke(); break;
      case 'frost': emoji('❄️', q.x, q.y, 12); break;
      case 'leaf': ctx.fillStyle = '#6fc39b'; ctx.fillRect(q.x, q.y, 4, 3); break;
      case 'drop': ctx.fillStyle = q.c || '#ffb3c7'; ell(q.x, q.y, 4, 4); ctx.fill(); break;
      case 'snow': ctx.fillStyle = '#fff'; ell(q.x, q.y, 2.4, 2.4); ctx.fill(); break;
      case 'suds': ctx.fillStyle = 'rgba(255,255,255,.85)'; ell(q.x, q.y, q.r, q.r); ctx.fill(); break;
      case 'petal': emoji(q.e, q.x, q.y, 14); break;
    }
  }
  ctx.globalAlpha = 1;
}
function floatTxt(x, y, s, color, size){ FX.floats.push({x, y, s, color, size:size || 22, t:0, life:1.1}); }
function drawFloats(){
  for(const f of FX.floats){
    const k = f.t / f.life, sc = k < .15 ? .6 + k / .15 * .5 : 1.1 - Math.min(.1, (k - .15));
    ctx.globalAlpha = k > .7 ? (1 - k) / .3 : 1;
    ctx.save(); ctx.translate(f.x, f.y); ctx.scale(sc, sc); txt(f.s, 0, 0, f.size, f.color, '#3d2416'); ctx.restore();
  }

}
const popS = k => { const v = FX.pops[k]; return v ? 1 + Math.sin(v * Math.PI) * .12 : 1; };

/* ---------- neighbors ---------- */
function newResident(arrive){
  const used = new Set(S.res.map(r => r.n));

  const counts = Array(S.houses).fill(0); S.res.forEach(r => counts[r.house]++);
  const house = counts.findIndex(c => c < 2); if(house < 0) return null;
  const menu = BRANCHES.main.menu.map(m => m[0]);
  const r = {id:S.nextId++, n:names.length ? pick(names) : 'Pal ' + S.nextId, e:pick(PETS), house, fav:pick(SHOP_IDS), dish:pick(menu), f:0, st:[]};
  S.res.push(r); save();
  const p = townPet(r);
  if(arrive){
    p.x = -24; p.y = 386; p.st = 'arrive'; p.bag = true;
    goTo(p, [[30, 380], [54, 386]]);
    toast('🎉 ' + tf('{n} the {e} moved in!', {n:r.n, e:r.e}), 'gold'); sfx('movein');

}
function townPet(r){
  const p = {r, x:0, y:0, st:'in', t:rand(1, 5), roadD:0, dir:1, tgt:{kind:'home', key:'h:' + r.house}, spd:rand(.85, 1.15), lane:rand(-5, 5), bob:rand(0, 6), face:1, walk:0};
  const [hx, hy] = houseDoor(r.house); p.x = hx; p.y = hy; p.where = 'h:' + r.house;
  TOWN.pets.push(p); return p;
}
function petOf(r){ return TOWN.pets.find(p => p.r === r); }
function chooseTarget(p){
  const shops = ownedShops().filter(s => TOWN.q[s].length < CONFIG.SHOP_QUEUE_MAX);
  const r = Math.random();
  if(r < CONFIG.VISIT_CHANCE && shops.length){
    const pool = []; shops.forEach(s => { pool.push(s); if(s === p.r.fav){ pool.push(s); pool.push(s); } });
    const s = pick(pool); p.tgt = {kind:'shop', id:s, key:'s:' + s};
  } else if(r < .82){ p.tgt = {kind:'home', key:'h:' + p.r.house}; }
  else { const i = Math.floor(Math.random() * PARK_SPOTS.length); p.tgt = {kind:'park', i, key:'p:' + i}; }
  const d = TOWN.links[p.tgt.key].d, L = TOWN.road.L;
  const diff = ((d - p.roadD) % L + L) % L;
  p.dir = diff < L / 2 ? 1 : -1;
}
function exitBuilding(p, emote){
  const key = p.where || ('h:' + p.r.house);
  const [kind, id] = key.split(':');
  const door = kind === 's' ? shopDoor(id) : kind === 'h' ? houseDoor(+id) : PARK_SPOTS[+id];
  const L = TOWN.links[key];
  p.x = door[0]; p.y = door[1]; p.st = 'fromB';
  const mid = [(door[0] + L.x) / 2 + rand(-10, 10), (door[1] + L.y) / 2 + rand(-6, 6)];
  goTo(p, [mid, [L.x, L.y]]); p.roadD = L.d;
  if(emote) p.emote = {e:emote, t:1.8};
}
/* pets inside a shop that get served in a mini game */
function takeQueue(shop){
  const list = TOWN.q[shop].map(q => q.p); TOWN.q[shop] = [];
  list.forEach(p => { p.st = 'away'; p.where = 's:' + shop; });
  return list.map(p => p.r);
}

/* ---------- update ---------- */
function townUpdate(dt){
  TOWN.time += dt;
  // move-ins
  if(S.res.length < popMax()){ TOWN.moveT -= dt; if(TOWN.moveT <= 0){ newResident(true); TOWN.moveT = CONFIG.MOVE_IN_GAP; refreshTownHud(); } }
  // pets
  for(const p of TOWN.pets){
    p.bob += dt * 6; p.pop = Math.max(0, (p.pop || 0) - dt * 3);
    if(p.emote){ p.emote.t -= dt; if(p.emote.t <= 0) p.emote = null; }
    switch(p.st){
      case 'arrive':
        if(walkPath(p, dt, CONFIG.PET_SPEED * 1.2)){ p.roadD = TOWN.leftD; p.st = 'road'; p.tgt = {kind:'home', key:'h:' + p.r.house}; const L = TOWN.road.L, d = TOWN.links[p.tgt.key].d; p.dir = (((d - p.roadD) % L + L) % L) < L / 2 ? 1 : -1; }
        break;
      case 'road': {
        const L = TOWN.road.L, tg = TOWN.links[p.tgt.key].d;
        const step = CONFIG.PET_SPEED * p.spd * dt;
        const diff = ((tg - p.roadD) * p.dir % L + L) % L;
        if(diff <= step){
          p.roadD = tg;
          const k = p.tgt.key, [kind, id] = k.split(':');
          if(kind === 's' && TOWN.q[id].length >= CONFIG.SHOP_QUEUE_MAX){ chooseTarget(p); break; }
          const door = kind === 's' ? shopDoor(id) : kind === 'h' ? houseDoor(+id) : PARK_SPOTS[+id];
          const lk = TOWN.links[k];
          p.st = 'toB'; p.where = k;
          goTo(p, [[(lk.x + door[0]) / 2 + rand(-10, 10), (lk.y + door[1]) / 2 + rand(-6, 6)], door]);
        } else {
          p.roadD += step * p.dir;
          const q = pathAt(TOWN.road, p.roadD), q2 = pathAt(TOWN.road, p.roadD + p.dir * 3);
          const nx = -(q2.y - q.y), ny = q2.x - q.x, nl = Math.hypot(nx, ny) || 1;
          p.x = q.x + nx / nl * p.lane; p.y = q.y + ny / nl * p.lane;
          if(Math.abs(q2.x - q.x) > .2) p.face = q2.x < q.x ? -1 : 1;
          p.walk += dt * CONFIG.PET_SPEED * p.spd / 9;
        }
        break;
      }
      case 'toB':
        if(walkPath(p, dt, CONFIG.PET_SPEED)){
          const [kind, id] = p.where.split(':');
          if(kind === 's'){ p.st = 'queue'; TOWN.q[id].push({p, t:0}); FX.pops['q' + id] = 1; sfx('pop'); }
          else if(kind === 'h'){ p.st = 'in'; p.t = rand(5, 11); p.bag = false; }
          else { p.st = 'sit'; p.t = rand(4, 8); p.emote = {e:pick(['🎵','☀️','💭','🌸','🦋']), t:2.5}; }
        }
        break;
      case 'in': p.t -= dt; if(p.t <= 0){ exitBuilding(p); } break;
      case 'sit': p.t -= dt; if(p.t <= 0){ exitBuilding(p); } break;
      case 'fromB': if(walkPath(p, dt, CONFIG.PET_SPEED)){ p.st = 'road'; chooseTarget(p); } break;
    }
  }
  // shop queues: staff serve, impatient pets give up
  for(const s of SHOP_IDS){
    const q = TOWN.q[s];
    q.forEach(e => e.t += dt);
    const gone = q.filter(e => e.t > CONFIG.QUEUE_GIVE_UP);
    gone.forEach(e => { q.splice(q.indexOf(e), 1); exitBuilding(e.p, '💢'); });
    const lvl = S.shops[s].staff;
    if(lvl > 0 && q.length){
      TOWN.staffT[s] += dt;
      if(TOWN.staffT[s] >= CONFIG.STAFF_EVERY[lvl]){
        TOWN.staffT[s] = 0;
        const e = q.shift(); exitBuilding(e.p, '❤️');
        const c = Math.max(1, Math.round(shopValue(s) * CONFIG.STAFF_PAY));
        S.coins += c; S.served++; befriend(e.p.r, 1);
        const [x, y] = SHOPS[s].pos; floatTxt(x, y - 40, '+' + c, '#fff', 20); coinBurst(x, y - 30, c); sfx('coin');
        save();
      }
    } else TOWN.staffT[s] = 0;
  }
  // chimney smoke + fountain
  if(Math.random() < dt * 1.5){ const i = Math.floor(Math.random() * S.houses); const [x, y] = HOUSE_POS[i]; part(x + 18, y - 40, 'chimney'); }
  if(Math.random() < dt * 14){ const q = part(PARK[0] + rand(-4, 4), PARK[1] - 14, 'drop', '#8fd3f4'); q.vx = rand(-55, 55); q.vy = rand(-120, -80); q.g = 340; q.life = .55; }
  if(TOWN.card){ TOWN.card.t -= dt; if(TOWN.card.t <= 0) TOWN.card = null; }
  updFX(dt);
  // coin counter ticks up
  if(TOWN.shown < 0) TOWN.shown = S.coins;
  TOWN.shown += (S.coins - TOWN.shown) * Math.min(1, dt * 8); if(Math.abs(S.coins - TOWN.shown) < .5) TOWN.shown = S.coins;
  $('tCoins').textContent = '🪙 ' + fmt(TOWN.shown);
}

  $('tPop').textContent = '🐾 ' + S.res.length + '/' + popMax();
  $('tStars').textContent = '⭐ ' + totalStars();
}

    pets:[], queue:[], tables:Array(6).fill(null), st:{}, tickets:[], pass:Array(4).fill(null), tasks:[], fly:[],
    waiter:{x:WAITER_HOME[0], y:WAITER_HOME[1], task:null, phase:'idle', carry:null, face:1, walk:0, bob:0},
    resQ:takeQueue('bistro'), helperT:0, helperFx:null,
    spawnT:CONFIG.SPAWN_FIRST, earned:0, shown:0, served:0, missed:0, vips:0, burnt:0, combo:0, bestCombo:0, lastServe:-99, starsLit:0};
  const fresh = br.menu.find(m => m[1] === day && day > 1);
  R.banner = {txt:br.e + ' ' + tr('Day') + ' ' + day, sub:'🎯 ' + tr('Goal') + ' 🪙 ' + R.goal + (fresh ? '   ' + tr('New dish!') + ' ' + DISHES[fresh[0]].e : ''), t:0};
  sfx('bell'); lastStars = 0; hudGoal(true);
}
function spawnGap(){
  const g = Math.max(CONFIG.SPAWN_GAP_MIN, CONFIG.SPAWN_GAP_START - CONFIG.SPAWN_GAP_PER_DAY * (R.day - 1));
  return g * (1 + (Math.random() * 2 - 1) * CONFIG.SPAWN_JITTER);
}
let pid = 0;
function spawnPet(){
  if(R.queue.length >= CONFIG.QUEUE_MAX) return;
  const res = R.resQ.shift() || null;
  const vip = !res && R.day >= CONFIG.VIP_FROM_DAY && Math.random() < CONFIG.VIP_CHANCE * R.br.vip;
  let dish = pick(R.menu);
  if(res && R.menu.includes(res.dish) && Math.random() < .6) dish = res.dish;
  const p = {id:++pid, e:res ? res.e : pick(PETS), res, vip, dish, st:'walkin', x:DOOR[0], y:H + 30, pat:1, table:-1, t:0,
    bob:Math.random() * 6, pop:1, flash:0, combo:1, spd:rand(.9, 1.1), face:1, walk:0};
  R.pets.push(p); R.queue.push(p); reflowQueue();
}
function reflowQueue(){
  R.queue.forEach((p, i) => {
    const [qx, qy] = QUEUE_POS[i];
    if(p.qx === qx) return;
    p.qx = qx;
    if(p.st === 'walkin' && !p.path) return;
    goTo(p, p.st === 'walkin' && p.y > H ? [[DOOR[0], 704], [qx, qy]] : [[qx, qy]]);
  });
}
const starsFor = c => c >= R.goal * CONFIG.STAR3 ? 3 : c >= R.goal * CONFIG.STAR2 ? 2 : c >= R.goal ? 1 : 0;

function bistroEnd(){
  mode = 'result';
  const stars = starsFor(R.earned), B = S.branches[R.branch];
  S.coins += R.earned; S.served += R.served;
  if(stars > (B.best[R.day] || 0)) B.best[R.day] = stars;
  if(stars > 0 && R.day === B.day) B.day++;
  S.tut.town = 1;
  save();
  R.result = {stars, doubled:false, passed:false};
  showBistroResult();
}

/* ---------- update ---------- */
function bistroUpdate(dt){
  R.time += dt;
  if(R.banner){ R.banner.t += dt; if(R.banner.t > 2.2) R.banner = null; }
  updFX(dt);
  if(R.intro > 0){ R.intro -= dt; if(R.intro <= 0) floatTxt(W / 2, 600, tr('Open!'), '#fff', 34); return; }
  // clock
  if(!R.closing){
    R.t -= dt;
    if(R.t <= 0){
      R.t = 0; R.closing = true; sfx('bell');
      R.banner = {txt:tr('Closing time!'), sub:tr('Pets are leaving…'), t:.4};
      R.queue.slice().forEach(p => leave(p, false)); R.queue = [];
    }
    R.spawnT -= dt;
    if(R.spawnT <= 0 && !R.closing){ spawnPet(); R.spawnT = spawnGap(); }
  } else {
    R.closeT += dt;
    const busy = R.pets.some(p => SEATED.includes(p.st)) || R.tasks.length || R.waiter.task;
    if(!busy || R.closeT > CONFIG.CLOSING_GRACE){
      if(busy) R.pets.forEach(p => { if(SEATED.includes(p.st)) leave(p, false); });
      R.ending += dt; if(R.ending > .9){ bistroEnd(); return; }
    }
  }
  // pets
  for(const p of R.pets){
    p.bob += dt * 6; p.pop = Math.max(0, p.pop - dt * 3); p.flash = Math.max(0, p.flash - dt * 2);
    const drain = dt / patienceSecs(p.vip);
    switch(p.st){
      case 'walkin': if(walkPath(p, dt, CONFIG.WALK_SPEED)) p.st = 'queue'; p.pat -= drain * .5; break;
      case 'queue': walkPath(p, dt, CONFIG.WALK_SPEED); p.pat -= drain; break;
      case 'toTable': if(walkPath(p, dt, CONFIG.WALK_SPEED)){ p.st = 'think'; p.t = CONFIG.THINK_TIME; p.pop = 1; p.face = 1; } break;
      case 'think': p.t -= dt; if(p.t <= 0){ p.st = 'order'; p.pop = 1; sfx('order'); } break;
      case 'order': p.pat -= drain; break;
      case 'wait': p.pat -= drain; break;
      case 'served': break;
      case 'eat': p.t -= dt; if(Math.random() < dt * 5) part(p.x + rand(-14, 14), p.y + 20, 'crumb'); if(p.t <= 0) pay(p); break;
      case 'leave': case 'angry': if(walkPath(p, dt, CONFIG.WALK_SPEED * (p.st === 'angry' ? 1.3 : 1))) p.gone = true; break;
    }
    if(p.pat <= 0 && ['walkin','queue','order','wait'].includes(p.st)) angry(p);
  }
  R.pets = R.pets.filter(p => !p.gone);
  // stations
  for(const s of STATION_IDS){
    const it = R.st[s]; if(!it) continue;
    const [sx, sy] = STATIONS[s].pos;
    if(it.burnt){ it.bt += dt; if(Math.random() < dt * 14) part(sx + rand(-12, 12), sy - 20, 'smoke');
      if(it.bt > 1.2){ R.st[s] = null; it.tk.step = 0; it.tk.wait = true; } continue; }
    if(!it.done){
      it.t += dt;
      const k = STATIONS[s].snd;
      if((k === 'sizzle' || k === 'oven' || k === 'bubble') && Math.random() < dt * 6) part(sx + rand(-14, 14), sy - 24, 'steam');
      if(k === 'sizzle' && Math.random() < dt * 12) part(sx + rand(-20, 20), sy - 26, 'oil');
      if(k === 'bubble' && Math.random() < dt * 6) part(sx + rand(-16, 16), sy - 30, 'bubble');
      if(k === 'ice' && Math.random() < dt * 3) part(sx + rand(-20, 20), sy - 40, 'frost');
      if(k === 'chop' && Math.random() < dt * 5) part(sx + rand(-16, 16), sy - 30, 'leaf');
      it.snd = (it.snd || 0) + dt; if(it.snd > .85){ it.snd = 0; cookSnd(k, 'loop'); }
      if(it.t >= it.dur){ it.done = true; sfx('ding'); FX.pops['s' + s] = 1; }
    }
    if(it.done){
      if(isLast(it.tk)) tryPass(s);
      if(R.st[s] === it && STATIONS[s].burn){
        it.over += dt;
        if(it.over > CONFIG.BURN_TIME * .55 && Math.random() < dt * 8) part(sx + rand(-12, 12), sy - 22, 'smoke');
        if(it.over > CONFIG.BURN_TIME){ it.burnt = true; it.bt = 0; R.burnt++; sfx('burn'); FX.shake = 3; floatTxt(sx, sy - 34, '🔥 ' + tr('Burnt!'), '#ffd0c4', 18); }
      }
    }
  }
  // kitchen helper (staff)
  const hl = S.shops.bistro.staff;
  if(hl > 0){
    R.helperT += dt;
    if(R.helperT >= CONFIG.HELPER_EVERY[hl] && helperAct()) R.helperT = 0;
  }
  if(R.helperFx){ R.helperFx.t -= dt; if(R.helperFx.t <= 0) R.helperFx = null; }
  R.pass.forEach(d => { if(d) d.t += dt; });
  for(const f of R.fly) f.t += dt; R.fly = R.fly.filter(f => f.t < .3);
  waiterUpdate(dt);
  if(R.combo && R.time - R.lastServe > CONFIG.COMBO_WINDOW) R.combo = 0;
  if(R.branch === 'main' && S.decor.jukebox && Math.random() < dt * 1.2) part(372, 640, 'note');
  if(R.branch === 'snow' && Math.random() < dt * 5) part(rand(0, W), 250, 'snow');
}
function helperAct(){
  for(const s of STATION_IDS){ const it = R.st[s]; if(it && it.done && !it.burnt && !isLast(it.tk)){ const nx = DISHES[it.tk.d].steps[it.tk.step + 1][0]; if(!R.st[nx]){ moveOn(s, true); R.helperFx = {s:nx, t:1}; return true; } } }
  const waiting = R.tickets.filter(tk => tk.wait).sort((a, b) => a.p.pat - b.p.pat);
  for(const tk of waiting){ const s = stepOf(tk)[0]; if(!R.st[s]){ startAt(s, tk); R.helperFx = {s, t:1}; return true; } }
  return false;
}
function startAt(s, tk){
  const step = stepOf(tk);
  tk.wait = false;
  R.st[s] = {tk, t:0, dur:step[1] * (1 - .1 * S.fast) * R.br.cook, done:false, over:0, burnt:false};
  FX.pops['s' + s] = 1; cookSnd(STATIONS[s].snd, 'start');
}
function tryPass(s){
  const it = R.st[s], slot = R.pass.indexOf(null);
  if(slot < 0) return false;
  R.pass[slot] = {p:it.tk.p, D:DISHES[it.tk.d], t:0};
  R.st[s] = null; R.tickets.splice(R.tickets.indexOf(it.tk), 1);
  R.fly.push({e:DISHES[it.tk.d].e, a:STATIONS[s].pos, b:PASS_POS[slot], t:0});
  FX.pops['d' + slot] = 1;
  return true;
}
function moveOn(s, quiet){
  const it = R.st[s], tk = it.tk, nx = DISHES[tk.d].steps[tk.step + 1][0];
  if(R.st[nx]){ FX.pops['s' + nx] = 1; return nope(STATIONS[nx].pos[0], STATIONS[nx].pos[1] + 30, tr('Next station busy')); }
  R.st[s] = null; R.fly.push({e:stepOf(tk)[2] || DISHES[tk.d].e, a:STATIONS[s].pos, b:STATIONS[nx].pos, t:0});
  tk.step++; startAt(nx, tk);
  if(!quiet) sfx('move');
}

/* ---------- waiter 🐧 ---------- */
function waiterUpdate(dt){
  const w = R.waiter; w.bob += dt * 6;
  if(!w.task && R.tasks.length){ w.task = R.tasks.shift(); w.phase = 'pick'; w.path = null; }
  const t = w.task;
  if(!t){
    if(!w.path && Math.hypot(w.x - WAITER_HOME[0], w.y - WAITER_HOME[1]) > 2) goTo(w, [WAITER_HOME]);
    walkPath(w, dt, CONFIG.WAITER_SPEED); return;
  }
  if(w.phase === 'pick'){
    const slot = R.pass.indexOf(t.item);
    if(slot < 0){ w.task = null; return; }
    if(!w.path) goTo(w, [[PASS_POS[slot][0], 262]]);
    if(walkPath(w, dt, CONFIG.WAITER_SPEED)){ R.pass[slot] = null; w.carry = t.item.D; w.phase = 'deliver'; sfx('tap');
      const [tx, ty] = TABLE_POS[t.p.table]; goTo(w, [[200, Math.min(ty - 24, 300)], [200, ty - 4], [tx + (tx < 200 ? 64 : -64), ty + 6]]); }
  } else if(walkPath(w, dt, CONFIG.WAITER_SPEED)){
    const p = t.p; w.carry = null; w.task = null; w.phase = 'idle';
    p.st = 'eat'; p.t = CONFIG.EAT_TIME; p.pop = 1;
    for(let k = 0; k < 8; k++) part(p.x, p.y + 10, 'spark');
    sfx('serve');
  }
}

/* ---------- leaving, paying ---------- */
function leave(p, isAngry){
  R.tasks = R.tasks.filter(t => t.p !== p);
  if(R.waiter.task && R.waiter.task.p === p){ R.waiter.task = null; R.waiter.carry = null; R.waiter.phase = 'idle'; R.waiter.path = null; }
  if(p.table >= 0 && R.tables[p.table] === p) R.tables[p.table] = null;
  const qi = R.queue.indexOf(p); if(qi >= 0){ R.queue.splice(qi, 1); reflowQueue(); }
  R.tickets = R.tickets.filter(tk => tk.p !== p);
  STATION_IDS.forEach(s => { if(R.st[s] && R.st[s].tk.p === p) R.st[s] = null; });
  R.pass.forEach((d, i) => { if(d && d.p === p) R.pass[i] = null; });
  const seated = p.table >= 0 && SEATED.includes(p.st);
  p.st = isAngry ? 'angry' : 'leave';
  goTo(p, seated ? [[200, p.y + 20], [200, 640], [DOOR[0] + 10, 704], [DOOR[0], H + 40]] : [[DOOR[0], 704], [DOOR[0], H + 40]]);
}
function angry(p){
  leave(p, true);
  R.missed++; R.combo = 0; FX.shake = CONFIG.SHAKE_SMALL; p.flash = 1;
  if(p.res) p.res.sad = true;
  floatTxt(p.x, p.y - 40, '💢', '#e2554a', 34); sfx('angry');
}
function pay(p){
  const D = DISHES[p.dish];
  const base = D.price * (p.vip ? CONFIG.VIP_PAY : 1);
  const tip = D.price * (CONFIG.TIP_MIN + (CONFIG.TIP_MAX - CONFIG.TIP_MIN) * Math.max(0, p.pat)) * (1 + tipBonus()) * R.br.tip;
  const total = Math.max(1, Math.round((base + tip) * p.combo));
  R.earned += total; R.served++;
  if(p.vip){ R.vips++; FX.shake = CONFIG.SHAKE_BIG; sfx('vip'); for(let k = 0; k < 18; k++) part(p.x, p.y, 'gold'); }
  else sfx('coin');
  floatTxt(p.x, p.y - 34, '+' + total, p.vip ? '#ffd23f' : '#fff', p.vip ? 32 : 26);
  coinBurst(p.x, p.y, total);
  for(let k = 0; k < 3; k++) part(p.x + rand(-12, 12), p.y - 20, 'heart');
  if(p.res){ befriend(p.res, p.dish === p.res.dish ? 3 : 2); if(p.dish === p.res.dish) floatTxt(p.x, p.y - 62, '💖 ' + tr('Favorite!'), '#ffd0e0', 15); }
  S.tut.bistro = (S.tut.bistro || 0) + 1;
  leave(p, false); p.happy = true;
}

/* ---------- taps ---------- */
function tableAt(x, y){ for(let i = 0; i < S.tables; i++){ const [tx, ty] = TABLE_POS[i]; if(Math.hypot(x - tx, y - (ty - 18)) < 60) return i; } return -1; }
function stationAt(x, y){ for(const s of STATION_IDS){ const [sx, sy] = STATIONS[s].pos; if(Math.abs(x - sx) < 60 && Math.abs(y - sy) < 40) return s; } return null; }
function passAt(x, y){ for(let i = 0; i < 4; i++){ const [px, py] = PASS_POS[i]; if(R.pass[i] && Math.hypot(x - px, y - py) < 42) return i; } return -1; }
function queueAt(x, y){ for(const p of R.queue){ if(Math.hypot(x - p.x, y - p.y) < 34) return p; } return null; }
function bistroTap(x, y){
  if(R.intro > 0) return;
  const d = passAt(x, y); if(d >= 0) return serve(d);
  const s = stationAt(x, y); if(s) return tapStation(s);
  const t = tableAt(x, y); if(t >= 0) return tapTable(t);
  const q = queueAt(x, y); if(q){ const free = firstFreeTable(); if(free >= 0) return seat(q, free); return nope(q.x, q.y); }
}
function firstFreeTable(){ for(let i = 0; i < S.tables; i++) if(!R.tables[i]) return i; return -1; }
function nope(x, y, msg){ sfx('nope'); if(msg) floatTxt(x, y, msg, '#ffe2dc', 17); }
function seat(p, i){
  const qi = R.queue.indexOf(p); if(qi < 0) return;
  R.queue.splice(qi, 1); reflowQueue();
  R.tables[i] = p; p.table = i; p.st = 'toTable';
  const [tx, ty] = TABLE_POS[i];
  goTo(p, [[200, Math.min(p.y - 30, 640)], [200, ty + 16], [tx + (tx < 200 ? 40 : -40), ty - 44], [tx, ty - 46]]);
  p.pat = Math.min(1, p.pat + CONFIG.REFILL_SEATED); p.pop = 1;
  FX.pops['t' + i] = 1; sfx('seat');
}
function tapTable(i){
  const p = R.tables[i];
  if(!p){
    const front = R.queue.find(q => q.st === 'queue') || R.queue[0];
    if(front) return seat(front, i);
    FX.pops['t' + i] = .6; return sfx('tap');
  }
  if(p.st === 'order') return takeOrder(p);
  FX.pops['t' + i] = .5; sfx('tap');
}
function takeOrder(p){
  p.st = 'wait'; p.pat = Math.min(1, p.pat + CONFIG.REFILL_ORDER); p.pop = 1;
  R.tickets.push({p, d:p.dish, step:0, wait:true});
  sfx('order');
}
function tapStation(s){
  const [sx, sy] = STATIONS[s].pos;
  if(!R.on.has(s)) return nope(sx, sy + 30, '🔒');
  const it = R.st[s];
  if(it){
    if(it.burnt) return;
    if(!it.done){ FX.pops['s' + s] = .6; return sfx('tap'); }
    if(isLast(it.tk)){ if(!tryPass(s)) nope(sx, sy + 30, tr('Counter full!')); return; }
    return moveOn(s);
  }
  const waiting = R.tickets.filter(tk => tk.wait && stepOf(tk)[0] === s).sort((a, b) => a.p.pat - b.p.pat);
  if(!waiting.length) return nope(sx, sy + 30, tr('Nothing to cook here'));
  startAt(s, waiting[0]);
}
function serve(i){
  const d = R.pass[i]; if(d.called) return;
  d.called = true;
  const p = d.p; p.st = 'served';
  R.combo = (R.time - R.lastServe <= CONFIG.COMBO_WINDOW) ? Math.min(CONFIG.COMBO_MAX, R.combo + 1) : 1;
  R.lastServe = R.time; R.bestCombo = Math.max(R.bestCombo, R.combo);
  p.combo = 1 + CONFIG.COMBO_STEP * (R.combo - 1);
  if(R.combo >= 2) floatTxt(W / 2, 290, tr('Combo') + ' x' + R.combo + '!', '#ffd23f', 22 + R.combo * 2);
  R.tasks.push({p, item:d}); FX.pops['d' + i] = 1;
  sfx('tap');
}

function bWall(){

  ctx.fillStyle = '#7a4a2e'; ctx.fillRect(0, 50, W, 5);
  // branch decorations

===================================================================== */
let G = null;
const MG = {};
const SHOP_LOOK = {
  bakery:  {wall:'#ffe1ea', wall2:'#ffd0de', floor:'#fff4f7', floor2:'#ffe8ef', shelf:['🥐','🍞','🧁','🥯','🍩']},
  icecream:{wall:'#dff2fb', wall2:'#cbe9f7', floor:'#f4fbff', floor2:'#e5f5fd', shelf:['🍦','🍧','🍨','🥤','🍒']},
  salon:   {wall:'#ece4ff', wall2:'#e0d4ff', floor:'#f8f5ff', floor2:'#eee8ff', shelf:['🧴','🫧','🪮','🎀','🪞']},
  flowers: {wall:'#e3f5e9', wall2:'#d2eedc', floor:'#f3fbf5', floor2:'#e6f6eb', shelf:['🪴','🌿','🌵','🌱','🪻']},
};
function mgStart(shop){
  FX = newFX();
  const impl = MG[shop];
  G = {shop, impl, t:CONFIG.MG_SECONDS, time:0, earned:0, shown:0, served:0, streak:0, best:0, missed:0, cust:null, next:.4,
    resQ:takeQueue(shop), intro:2.2, over:false, overT:0, w:{}, btns:[]};
  G.banner = {txt:SHOPS[shop].e + ' ' + tr(SHOPS[shop].name), sub:tr(impl.how), t:0};
  sfx('bell');
}
function mgUpdate(dt){
  G.time += dt; updFX(dt);
  if(G.banner){ G.banner.t += dt; if(G.banner.t > 2.6) G.banner = null; }
  if(G.intro > 0){ G.intro -= dt; return; }
  if(!G.over){ G.t -= dt; if(G.t <= 0){ G.t = 0; G.over = true; sfx('bell'); } }
  const c = G.cust;
  if(!c){
    if(!G.over){ G.next -= dt; if(G.next <= 0) mgNewCustomer(); }
    else { G.overT += dt; if(G.overT > .8) mgEnd(); }
  } else {
    c.bob += dt * 6; c.pop = Math.max(0, (c.pop || 0) - dt * 3);
    if(c.st === 'in'){ if(walkPath(c, dt, 300)){ c.st = 'wait'; c.face = 1; c.pop = 1; sfx('order'); } }
    else if(c.st === 'wait'){ c.pat -= dt / c.patSecs; if(c.pat <= 0) mgFail(); }
    else if(c.st === 'out'){ if(walkPath(c, dt, 340)){ G.cust = null; G.next = .35; } }
  }
  if(G.impl.update) G.impl.update(dt);
  // top bar
  G.shown += (G.earned - G.shown) * .15; if(Math.abs(G.earned - G.shown) < .5) G.shown = G.earned;
  $('hCoins').textContent = '🪙 ' + Math.round(G.shown);
  const s = Math.ceil(G.t);
  $('hTime').textContent = G.over ? '🌙 ' + tr('Closing') : '⏱ ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  $('hTime').classList.toggle('warn', !G.over && G.t <= 10);
}
function mgNewCustomer(){
  const res = G.resQ.shift() || null;
  const c = {res, e:res ? res.e : pick(PETS), x:470, y:212, st:'in', pat:1, bob:0, face:-1, walk:0, spd:1,
    patSecs:CONFIG.MG_PATIENCE * (1 + .1 * S.shops[G.shop].staff)};
  goTo(c, [[330, 206], [120, 212]]);
  G.w = {}; c.order = G.impl.newOrder(c);
  G.cust = c;
}
function mgReady(){ return G && G.cust && G.cust.st === 'wait' && G.intro <= 0; }
function mgDone(quality){
  const c = G.cust; if(!c || c.st !== 'wait') return;
  G.streak++; G.best = Math.max(G.best, G.streak);
  const st = S.shops[G.shop];
  const coins = Math.max(1, Math.round(shopValue(G.shop) * (.6 + .4 * c.pat) * (.75 + .35 * quality) * (1 + .1 * st.staff) * (1 + .08 * Math.min(G.streak - 1, 5))));
  G.earned += coins; G.served++;
  floatTxt(c.x, c.y - 56, '+' + coins, '#fff', 26); coinBurst(c.x, c.y, coins); sfx('coin');
  if(quality >= .99) floatTxt(200, 300, tr('Perfect!'), '#ffd23f', 24);
  if(G.streak >= 2) floatTxt(200, 330, tr('Streak') + ' x' + G.streak, '#ffe6a0', 18);
  for(let k = 0; k < 4; k++) part(c.x + rand(-14, 14), c.y - 30, 'heart');
  if(c.res) befriend(c.res, c.res.fav === G.shop ? 3 : 2);
  c.st = 'out'; c.happy = true; goTo(c, [[330, 206], [480, 212]]);
}
function mgFail(){
  const c = G.cust;
  G.streak = 0; G.missed++; FX.shake = CONFIG.SHAKE_SMALL; sfx('angry');
  floatTxt(c.x, c.y - 50, '💢', '#e2554a', 32);
  if(c.res) c.res.sad = true;
  c.st = 'out'; c.sad = true; goTo(c, [[330, 206], [480, 212]]);
}
function mgEnd(){
  mode = 'result';
  S.coins += G.earned; S.served += G.served;
  S.mgBest[G.shop] = Math.max(S.mgBest[G.shop] || 0, G.served);
  save();
  G.result = {doubled:false};
  showMgResult();
}
function mgTap(x, y){ if(G.intro > 0) return; if(G.impl.tap) G.impl.tap(x, y); }
function mgDrag(x, y, down, moved){ if(G.impl.drag) G.impl.drag(x, y, down, moved); }

/* ---------- shared drawing ---------- */
function mgBg(){
  const L = SHOP_LOOK[G.shop];
  ctx.fillStyle = L.wall; ctx.fillRect(0, 0, W, 300);
  ctx.fillStyle = L.wall2; for(let x = 0; x < W; x += 36) ctx.fillRect(x, 0, 18, 300);
  for(let y = 300, r = 0; y < H; y += 40, r++) for(let x = 0, c = 0; x < W; x += 40, c++){ ctx.fillStyle = (r + c) % 2 ? L.floor : L.floor2; ctx.fillRect(x, y, 40, 40); }
  // shelf
  ctx.fillStyle = '#a0663f'; ctx.fillRect(20, 70, 140, 8); ctx.fillRect(240, 70, 140, 8);
  L.shelf.forEach((e, i) => emoji(e, 36 + i * 30 + (i > 2 ? 160 : 0), 54, 22));
  emoji(SHOPS[G.shop].e, 200, 40, 34);
  // counter
  ctx.fillStyle = '#7a4a2e'; ctx.fillRect(0, 262, W, 44); ctx.fillStyle = '#c98f5e'; ctx.fillRect(0, 262, W, 12); ctx.fillStyle = SHOPS[G.shop].color; ctx.fillRect(0, 300, W, 6);
}
function mgCustomer(hidden){
  const c = G.cust; if(!c) return;
  if(!hidden || c.st !== 'wait') drawWalker(c.e, c.x, c.y, 72, c, () => {
    if(c.sad) emoji('💢', 26, -26, 20);
    if(c.happy) emoji('💕', 26, -26, 20);
  });
  if(c.st === 'wait'){
    if(!hidden){ patBar(c.x, 162, 70, c.pat); if(c.res) nameTag(c.res.n, c.x, 284, heartsOf(c.res)); }
    const b = Math.sin(G.time * 3) * 2;
    bubble(286, 138 + b, 196, 112, () => G.impl.drawOrder(286, 138 + b, c.order));
  }
}
function mgBtn(b, sel){
  const p = popS('btn' + b.id);
  ctx.save(); ctx.translate(b.x, b.y); ctx.scale(p, p);
  ctx.fillStyle = 'rgba(0,0,0,.15)'; rr(-b.w / 2, -b.h / 2 + 5, b.w, b.h, 16); ctx.fill();
  ctx.fillStyle = sel ? '#ffe28a' : '#fffaf0'; rr(-b.w / 2, -b.h / 2, b.w, b.h, 16); ctx.fill();
  ctx.strokeStyle = sel ? '#f4b73a' : '#ead2ac'; ctx.lineWidth = 3; rr(-b.w / 2, -b.h / 2, b.w, b.h, 16); ctx.stroke();
  if(b.c){ ctx.fillStyle = b.c; ell(0, 0, Math.min(b.w, b.h) * .3, Math.min(b.w, b.h) * .3); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 2; ctx.stroke(); }
  if(b.e) emoji(b.e, 0, b.c ? 0 : -2, Math.min(b.w, b.h) * .5);
  ctx.restore();
}
function hitBtn(x, y){ return G.btns.find(b => Math.abs(x - b.x) < b.w / 2 && Math.abs(y - b.y) < b.h / 2); }
function rowBtns(items, y, h){
  const n = items.length, w = Math.min(110, (W - 20) / n - 8);
  return items.map((it, i) => Object.assign({x:W / 2 + (i - (n - 1) / 2) * (w + 8), y, w, h:h || 70}, it));
}
function mgDraw(){
  mgBg();
  mgCustomer(G.impl.hideCustomer);
  G.impl.draw();
  G.btns.forEach(b => mgBtn(b, b.sel));
  drawParts(); drawFloats(); drawBanner(G.banner);
  if(G.intro > 0 && !G.banner){}
}
function wrongTap(msg){ sfx('nope'); FX.shake = 3; if(G.cust) G.cust.pat = Math.max(0, G.cust.pat - .06); if(msg) floatTxt(200, 330, msg, '#ffe2dc', 17); }

/* =====================================================================
   🧁 BAKERY — stack the layers in order → bake (tap in the gold zone) → frost → topping
===================================================================== */
const SPONGE = [{id:'choco', c:'#7a4a2e'}, {id:'vanilla', c:'#f6dfa0'}, {id:'straw', c:'#f7a8b8'}];
const FROST = [{id:'cream', c:'#fffaf2'}, {id:'pink', c:'#ff9ec4'}, {id:'mint', c:'#a8e6c6'}];
const TOPS = ['🍓','🍒','🫐','🍫'];
const colOf = (list, id) => list.find(x => x.id === id).c;
MG.bakery = {
  how:'Stack the layers, bake, frost, add the topping!',
  newOrder(){
    const n = 2 + (Math.random() < .35 + G.served * .06 ? 1 : 0);
    G.w = {layers:[], phase:'stack', bake:0, needle:0, nd:1, burnt:false, q:1, pop:0};
    this.btns();
    return {layers:Array.from({length:n}, () => pick(SPONGE).id), frost:pick(FROST).id, top:pick(TOPS)};
  },
  btns(){
    const w = G.w;
    if(w.phase === 'stack') G.btns = rowBtns(SPONGE.map(s => ({id:s.id, c:s.c})), 668);
    else if(w.phase === 'frost') G.btns = rowBtns(FROST.map(s => ({id:s.id, c:s.c, e:'🧁'})), 668);
    else if(w.phase === 'top') G.btns = rowBtns(TOPS.map(t => ({id:t, e:t})), 668);
    else G.btns = [];
  },
  update(dt){
    const w = G.w; w.pop = Math.max(0, w.pop - dt * 4);
    if(w.phase === 'bake'){ const sp = 1.1 + G.served * .08; w.needle += w.nd * sp * dt; if(w.needle > 1){ w.needle = 1; w.nd = -1; } if(w.needle < 0){ w.needle = 0; w.nd = 1; } if(Math.random() < dt * 8) part(200 + rand(-60, 60), 460, 'steam'); }
  },
  tap(x, y){
    if(!mgReady()) return;
    const w = G.w, o = G.cust.order;
    if(w.phase === 'bake'){
      const d = Math.abs(w.needle - .5);
      if(d < .08){ floatTxt(200, 420, tr('Perfect bake!'), '#ffd23f', 22); sfx('star'); }
      else if(d < .22){ w.q -= .15; floatTxt(200, 420, tr('Good'), '#fff', 20); sfx('ding'); }
      else { w.q -= .4; w.burnt = true; floatTxt(200, 420, tr('A bit burnt…'), '#ffd0c4', 20); sfx('burn'); }
      w.phase = 'frost'; this.btns(); return;
    }
    const b = hitBtn(x, y); if(!b) return;
    FX.pops['btn' + b.id] = 1;
    if(w.phase === 'stack'){
      if(b.id === o.layers[w.layers.length]){ w.layers.push(b.id); w.pop = 1; sfx('plop'); if(w.layers.length === o.layers.length){ w.phase = 'bake'; this.btns(); } }
      else { w.q -= .1; wrongTap(tr('Wrong layer!')); }
    } else if(w.phase === 'frost'){
      if(b.id === o.frost){ w.frost = b.id; w.phase = 'top'; w.pop = 1; sfx('plop'); for(let k = 0; k < 6; k++) part(200, 440, 'spark'); this.btns(); }
      else { w.q -= .1; wrongTap(tr('Wrong frosting!')); }
    } else if(w.phase === 'top'){
      if(b.id === o.top){ w.top = b.id; w.phase = 'done'; w.pop = 1; sfx('pop'); this.btns(); setTimeout(() => { if(G && G.cust) mgDone(Math.max(0, w.q)); }, 350); }
      else { w.q -= .1; wrongTap(tr('Wrong topping!')); }
    }
  },
  drawCake(x, y, layers, frost, top, s, burnt){
    const lw = 150 * s, lh = 30 * s;
    ctx.fillStyle = '#fff'; ell(x, y + 6 * s, lw * .62, 14 * s); ctx.fill(); ctx.strokeStyle = '#e6dccb'; ctx.lineWidth = 2; ell(x, y + 6 * s, lw * .5, 10 * s); ctx.stroke();
    layers.forEach((id, i) => {
      const ly = y - (i + 1) * lh;
      ctx.fillStyle = colOf(SPONGE, id); rr(x - lw / 2, ly, lw, lh - 2 * s, 8 * s); ctx.fill();
      if(burnt){ ctx.fillStyle = 'rgba(60,30,10,.35)'; rr(x - lw / 2, ly, lw, lh - 2 * s, 8 * s); ctx.fill(); }
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x - lw / 2 + 6 * s, ly + 4 * s, lw - 12 * s, 3 * s);
    });
    const topY = y - layers.length * lh;
    if(frost){
      ctx.fillStyle = colOf(FROST, frost); rr(x - lw / 2 - 3 * s, topY - 8 * s, lw + 6 * s, 14 * s, 7 * s); ctx.fill();
      for(let i = 0; i < 6; i++){ ell(x - lw / 2 + 12 * s + i * (lw - 24 * s) / 5, topY + 6 * s + (i % 2) * 5 * s, 6 * s, (8 + (i % 2) * 5) * s); ctx.fill(); }
    }
    if(top) emoji(top, x, topY - 18 * s, 30 * s);
  },
  draw(){
    const w = G.w, c = G.cust;
    if(!c || !w.layers) return;
    const s = 1 + w.pop * .08;
    if(w.phase === 'bake'){ ctx.fillStyle = 'rgba(255,140,60,.25)'; rr(80, 360, 240, 200, 30); ctx.fill(); }
    ctx.save(); ctx.translate(200, 560); ctx.scale(s, 2 - s); this.drawCake(0, 0, w.layers, w.frost, w.top, 1, w.burnt); ctx.restore();
    if(w.phase === 'bake'){
      const x0 = 50, x1 = 350, y = 660;
      ctx.fillStyle = '#4a2a18'; rr(x0 - 6, y - 20, x1 - x0 + 12, 40, 14); ctx.fill();
      ctx.fillStyle = '#e2554a'; rr(x0, y - 12, x1 - x0, 24, 10); ctx.fill();
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(lerp(x0, x1, .28), y - 12, (x1 - x0) * .44, 24);
      ctx.fillStyle = '#6fc39b'; ctx.fillRect(lerp(x0, x1, .42), y - 12, (x1 - x0) * .16, 24);
      const nx = lerp(x0, x1, w.needle); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(nx, y - 16); ctx.lineTo(nx - 9, y - 30); ctx.lineTo(nx + 9, y - 30); ctx.fill(); ctx.fillRect(nx - 2, y - 14, 4, 28);
      txt('🔥 ' + tr('Tap to stop in the green!'), 200, 612, 15, '#4a2a18');
    }
    if(w.phase === 'stack') txt(tr('Layer') + ' ' + (w.layers.length + 1) + ' / ' + c.order.layers.length, 200, 612, 15, '#4a2a18');
    if(w.phase === 'frost') txt('🧁 ' + tr('Pick the frosting'), 200, 612, 15, '#4a2a18');
    if(w.phase === 'top') txt('🍓 ' + tr('Pick the topping'), 200, 612, 15, '#4a2a18');
  },
  drawOrder(x, y, o){ this.drawCake(x, y + 34, o.layers, o.frost, o.top, .45); }
};

/* =====================================================================
   🍦 ICE CREAM — pick the right flavor, then tap to drop the swinging scoop on the cone
===================================================================== */
const FLAV = [{id:'straw', c:'#ffb3c7'}, {id:'choco', c:'#8a5434'}, {id:'vanilla', c:'#fff1cf'}, {id:'mint', c:'#a8e0b0'}, {id:'grape', c:'#b9a7ff'}];
function drawScoop(x, y, c, r){
  ctx.fillStyle = c; ell(x, y, r, r * .9); ctx.fill(); ctx.strokeStyle = 'rgba(120,80,40,.25)'; ctx.lineWidth = 1.5; ctx.stroke();
  for(let i = -2; i <= 2; i++){ ell(x + i * r * .38, y + r * .7, r * .2, r * .22); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ell(x - r * .35, y - r * .35, r * .25, r * .18); ctx.fill();
}
function drawCone(x, y, s){
  ctx.fillStyle = '#e8b06a'; ctx.beginPath(); ctx.moveTo(x - 30 * s, y); ctx.lineTo(x + 30 * s, y); ctx.lineTo(x, y + 80 * s); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c98a3e'; ctx.lineWidth = 2 * s;
  for(let i = -2; i <= 2; i++){ ctx.beginPath(); ctx.moveTo(x + i * 12 * s, y); ctx.lineTo(x + (i * 12 + 24) * s * .5, y + 50 * s); ctx.stroke(); }
}
MG.icecream = {
  how:'Pick the next flavor, then tap to drop the scoop on the cone!',
  newOrder(){
    const n = Math.min(4, 2 + (Math.random() < .5 ? 1 : 0) + (G.served >= 3 && Math.random() < .4 ? 1 : 0));
    G.w = {stack:[], swing:null, fall:null, misses:0, pop:0, done:false};
    G.btns = rowBtns(FLAV.map(f => ({id:f.id, c:f.c})), 676, 62);
    return {scoops:Array.from({length:n}, () => pick(FLAV).id)};
  },
  topX(){ const st = G.w.stack; return 200 + (st.length ? st[st.length - 1].dx : 0); },
  update(dt){
    const w = G.w; if(!w.stack) return; w.pop = Math.max(0, w.pop - dt * 4);
    if(w.swing){ w.swing.t += dt; const sp = 2 + w.stack.length * .35 + G.served * .06; w.swing.x = 200 + Math.sin(w.swing.t * sp) * 125; }
    const f = w.fall;
    if(f){
      f.vy += 1500 * dt; f.y += f.vy * dt;
      const ty = 548 - w.stack.length * 30;
      if(!f.miss && f.y >= ty){
        if(Math.abs(f.x - this.topX()) < 30){
          w.stack.push({id:f.id, dx:f.x - 200}); w.fall = null; w.pop = 1; sfx('plop');
          for(let k = 0; k < 5; k++) part(f.x, ty, 'drop', colOf(FLAV, f.id));
          if(w.stack.length === G.cust.order.scoops.length && !w.done){ w.done = true; w.cherry = {y:200, vy:0}; }
        } else f.miss = true;
      }
      if(f.miss && f.y > 640){ for(let k = 0; k < 10; k++) part(f.x, 640, 'drop', colOf(FLAV, f.id)); sfx('splat'); w.misses++; FX.shake = 3; floatTxt(f.x, 600, tr('Splat!'), '#ffe2dc', 18); w.fall = null; }
    }
    if(w.cherry){ const c = w.cherry; c.vy += 1400 * dt; c.y += c.vy * dt; const ty = 530 - w.stack.length * 30; if(c.y >= ty){ w.cherry = null; w.cherryOn = true; sfx('pop'); setTimeout(() => { if(G && G.cust) mgDone(Math.max(0, 1 - w.misses * .25)); }, 300); } }
  },
  tap(x, y){
    if(!mgReady()) return;
    const w = G.w, o = G.cust.order;
    const b = hitBtn(x, y);
    if(b){
      FX.pops['btn' + b.id] = 1;
      if(w.swing || w.fall || w.done) return sfx('tap');
      if(b.id === o.scoops[w.stack.length]){ w.swing = {id:b.id, t:Math.random() * 3, x:200}; sfx('pop'); }
      else wrongTap(tr('Wrong flavor!'));
      return;
    }
    if(w.swing && y < 640){ w.fall = {id:w.swing.id, x:w.swing.x, y:350, vy:0}; w.swing = null; sfx('tap'); }
  },
  draw(){
    const w = G.w; if(!w.stack) return;
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ell(200, 652, 50, 8); ctx.fill();
    drawCone(200 + (w.stack[0] ? w.stack[0].dx * .2 : 0), 566, 1);
    w.stack.forEach((s, i) => { const sq = i === w.stack.length - 1 ? 1 + w.pop * .15 : 1; ctx.save(); ctx.translate(200 + s.dx, 548 - i * 30); ctx.scale(sq, 2 - sq); drawScoop(0, 0, colOf(FLAV, s.id), 28); ctx.restore(); });
    if(w.cherryOn || w.cherry) emoji('🍒', this.topX(), w.cherry ? w.cherry.y : 530 - w.stack.length * 30, 26);
    if(w.swing){
      ctx.strokeStyle = '#9aa3ab'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(200, 316); ctx.lineTo(w.swing.x, 340); ctx.stroke();
      drawScoop(w.swing.x, 350, colOf(FLAV, w.swing.id), 28);
      ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.moveTo(w.swing.x, 382); ctx.lineTo(w.swing.x, 520 - w.stack.length * 30); ctx.stroke(); ctx.setLineDash([]);
      txt('👆 ' + tr('Tap to drop!'), 200, 326, 15, '#4a2a18');
    } else if(!w.done && G.cust && G.cust.st === 'wait') txt(tr('Pick flavor') + ' ' + (w.stack.length + 1) + ' / ' + G.cust.order.scoops.length, 200, 326, 15, '#4a2a18');
    if(w.fall) drawScoop(w.fall.x, w.fall.y, colOf(FLAV, w.fall.id), 28);
  },
  drawOrder(x, y, o){
    const n = o.scoops.length, base = y + 4 + (n - 2) * 9;
    drawCone(x, base + 10, .5);
    o.scoops.forEach((id, i) => drawScoop(x, base - i * 19, colOf(FLAV, id), 13));
  }
};

/* =====================================================================
   ✂️ PET SALON — scrub mud with soap, rinse the suds, brush the tangles, then pick the style
===================================================================== */
const ACCS = ['🎀','🎩','👒','👑'];
const TOOL_FOR = {mud:'soap', suds:'rinse', tangle:'brush'};
MG.salon = {
  how:'Drag to scrub: soap the mud, rinse, brush. Then pick the style!',
  hideCustomer:true,
  newOrder(){
    const spots = [];
    const n = 3 + Math.floor(Math.random() * 2) + (G.served > 3 ? 1 : 0);
    for(let i = 0; i < n; i++){ const a = rand(0, Math.PI * 2), r = rand(10, 66); spots.push({kind:'mud', x:200 + Math.cos(a) * r, y:470 + Math.sin(a) * r * .85, hp:1, r:rand(14, 20), seed:Math.random() * 9}); }
    for(let i = 0; i < 2 + (Math.random() < .5 ? 1 : 0); i++){ const a = rand(0, Math.PI * 2), r = rand(20, 70); spots.push({kind:'tangle', x:200 + Math.cos(a) * r, y:470 + Math.sin(a) * r * .85, hp:1, r:18, seed:Math.random() * 9}); }
    G.w = {spots, phase:'wash', tool:'soap', acc:null, ptr:null, hintT:0, scrubT:0, wob:0, q:1};
    this.btns();
    return {acc:pick(ACCS)};
  },
  btns(){
    const w = G.w;
    if(w.phase === 'wash') G.btns = rowBtns([{id:'soap', e:'🧽'}, {id:'rinse', e:'🚿'}, {id:'brush', e:'🪮'}].map(b => Object.assign(b, {sel:w.tool === b.id})), 672);
    else if(w.phase === 'style') G.btns = rowBtns(ACCS.map(a => ({id:a, e:a})), 672);
    else G.btns = [];
  },
  update(dt){ const w = G.w; if(!w.spots) return; w.hintT = Math.max(0, w.hintT - dt); w.scrubT = Math.max(0, w.scrubT - dt); w.wob = Math.max(0, w.wob - dt * 3); },
  tap(x, y){
    if(!mgReady()) return;
    const w = G.w, b = hitBtn(x, y);
    if(b){
      FX.pops['btn' + b.id] = 1;
      if(w.phase === 'wash'){ w.tool = b.id; sfx('tap'); this.btns(); return; }
      if(w.phase === 'style'){
        if(b.id === G.cust.order.acc){ w.acc = b.id; w.phase = 'done'; sfx('pop'); for(let k = 0; k < 12; k++) part(200, 390, 'gold'); this.btns(); setTimeout(() => { if(G && G.cust) mgDone(Math.max(0, w.q)); }, 450); }
        else { w.q -= .15; w.wob = 1; wrongTap(tr('Not that one!')); }
      }
      return;
    }
    this.drag(x, y, true, 14);
  },
  drag(x, y, down, moved){
    const w = G.w; if(!w.spots || !mgReady()) return;
    w.ptr = down ? {x, y} : null;
    if(!down || w.phase !== 'wash' || y > 630) return;
    let hit = false, wrong = null;
    for(const s of w.spots){
      if(Math.hypot(s.x - x, s.y - y) > s.r + 22) continue;
      if(TOOL_FOR[s.kind] !== w.tool){ wrong = TOOL_FOR[s.kind]; continue; }
      hit = true; s.hp -= moved / 110;
      if(Math.random() < .5) part(x + rand(-10, 10), y + rand(-10, 10), w.tool === 'brush' ? 'spark' : 'suds');
      if(s.hp <= 0){
        if(s.kind === 'mud'){ s.kind = 'suds'; s.hp = 1; sfx('pop'); }
        else { s.dead = true; sfx('pop'); for(let k = 0; k < 6; k++) part(s.x, s.y, 'spark'); }
      }
    }
    w.spots = w.spots.filter(s => !s.dead);
    if(hit && w.scrubT <= 0){ sfx('scrub'); w.scrubT = .12; }
    if(!hit && wrong && w.hintT <= 0){ w.hintT = .9; floatTxt(x, y - 30, ({soap:'🧽', rinse:'🚿', brush:'🪮'})[wrong] + '?', '#fff', 20); }
    if(!w.spots.length){ w.phase = 'style'; this.btns(); sfx('star'); floatTxt(200, 360, tr('Squeaky clean!'), '#fff', 22); w.ptr = null; }
  },
  draw(){
    const w = G.w, c = G.cust; if(!w.spots || !c) return;
    // tub
    ctx.fillStyle = '#c9e6f5'; rr(70, 540, 260, 70, 30); ctx.fill(); ctx.fillStyle = '#a8d4ee'; rr(70, 540, 260, 18, [30, 30, 0, 0]); ctx.fill();
    if(c.st === 'wait'){
      const wob = Math.sin(G.time * 30) * w.wob * 8;
      ctx.save(); ctx.translate(200 + wob, 470 + Math.sin(G.time * 2) * 2); emoji(c.e, 0, 0, 170); ctx.restore();
      for(const s of w.spots){
        if(s.kind === 'mud'){ ctx.fillStyle = 'rgba(110,70,35,' + (.55 + .35 * s.hp) + ')'; for(let k = 0; k < 4; k++){ ell(s.x + Math.cos(s.seed + k * 2) * s.r * .5, s.y + Math.sin(s.seed + k * 2) * s.r * .4, s.r * (.55 + .2 * (k % 2)) * (.6 + .4 * s.hp), s.r * .5 * (.6 + .4 * s.hp)); ctx.fill(); } }
        if(s.kind === 'suds'){ ctx.fillStyle = 'rgba(255,255,255,' + (.5 + .45 * s.hp) + ')'; for(let k = 0; k < 6; k++){ ell(s.x + Math.cos(s.seed + k) * s.r * .6, s.y + Math.sin(s.seed + k * 1.3) * s.r * .5, 6 + (k % 3) * 2, 6 + (k % 3) * 2); ctx.fill(); } }
        if(s.kind === 'tangle'){ ctx.strokeStyle = 'rgba(70,45,30,' + (.4 + .5 * s.hp) + ')'; ctx.lineWidth = 2.5; ctx.beginPath(); for(let k = 0; k < 22; k++){ const a = k * .9 + s.seed, rr2 = 4 + (k % 5) * 3; const px = s.x + Math.cos(a) * rr2, py = s.y + Math.sin(a * 1.3) * rr2 * .8; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.stroke(); }
      }
      if(w.acc) emoji(w.acc, 200, 392, 54);
      if(w.ptr && w.phase === 'wash') emoji(({soap:'🧽', rinse:'🚿', brush:'🪮'})[w.tool], w.ptr.x + 18, w.ptr.y - 18, 36);
      const left = w.spots.length;
      txt(w.phase === 'wash' ? '👉 ' + tr('Drag over the pet to clean') + ' (' + left + ')' : w.phase === 'style' ? '✨ ' + tr('Pick the style they asked for') : '', 200, 330, 15, '#4a2a18');
      patBar(200, 360, 90, c.pat);
      if(c.res) nameTag(c.res.n, 200, 640, heartsOf(c.res));
    }
  },
  drawOrder(x, y, o){ emoji('🛁', x - 36, y, 40); txt('+', x, y, 22, '#8a6248'); emoji(o.acc, x + 38, y, 40); }
};

/* =====================================================================
   💐 FLOWER SHOP — tap the blooming flowers the bouquet needs, before they wilt
===================================================================== */
const FL = ['🌹','🌻','🌷','🌼','🪻','🌸'];
const POTS = []; [400, 490, 580].forEach(y => [100, 200, 300].forEach(x => POTS.push([x, y])));
MG.flowers = {
  how:'Tap the blooming flowers the bouquet needs — before they wilt!',
  newOrder(){
    const kinds = []; const nk = 2 + (Math.random() < .4 + G.served * .05 ? 1 : 0);
    while(kinds.length < nk){ const e = pick(FL); if(!kinds.includes(e)) kinds.push(e); }
    const need = kinds.map(e => ({e, n:1 + (Math.random() < .5 ? 1 : 0)}));
    G.w = {pots:POTS.map(() => ({st:'empty', t:rand(.1, .9), e:null})), picked:[], need:need.map(n => ({e:n.e, left:n.n})), wrong:0};
    G.btns = [];
    return {need};
  },
  update(dt){
    const w = G.w; if(!w.pots || !G.cust || G.cust.st !== 'wait') return;
    for(const p of w.pots){
      p.t -= dt;
      if(p.t > 0) continue;
      if(p.st === 'empty'){ p.st = 'sprout'; p.t = .7; }
      else if(p.st === 'sprout'){
        const want = w.need.filter(n => n.left > 0);
        p.e = want.length && Math.random() < .55 ? pick(want).e : pick(FL);
        p.st = 'bloom'; p.t = Math.max(1.8, 3.4 - G.served * .12); p.pop = 1;
      }
      else if(p.st === 'bloom'){ p.st = 'wilt'; p.t = .6; }
      else { p.st = 'empty'; p.t = rand(.2, .8); }
    }
    w.pots.forEach(p => p.pop = Math.max(0, (p.pop || 0) - dt * 4));
  },
  tap(x, y){
    if(!mgReady()) return;
    const w = G.w;
    const i = POTS.findIndex(([px, py]) => Math.abs(x - px) < 46 && Math.abs(y - py) < 44);
    if(i < 0) return;
    const p = w.pots[i];
    if(p.st !== 'bloom') return sfx('tap');
    const n = w.need.find(k => k.e === p.e && k.left > 0);
    if(n){
      n.left--; w.picked.push(p.e); p.st = 'empty'; p.t = .4; sfx('pop');
      for(let k = 0; k < 6; k++) part(POTS[i][0], POTS[i][1] - 20, 'petal', p.e);
      if(w.need.every(k => k.left <= 0)){ sfx('star'); setTimeout(() => { if(G && G.cust) mgDone(Math.max(0, 1 - w.wrong * .2)); }, 350); }
    } else { w.wrong++; p.st = 'wilt'; p.t = .5; wrongTap(tr('Not in the bouquet!')); }
  },
  draw(){
    const w = G.w; if(!w.pots) return;
    POTS.forEach(([x, y], i) => {
      const p = w.pots[i];
      ctx.fillStyle = '#8a5434'; ell(x, y + 34, 32, 8); ctx.fill();
      ctx.fillStyle = '#c96f42'; ctx.beginPath(); ctx.moveTo(x - 30, y + 6); ctx.lineTo(x + 30, y + 6); ctx.lineTo(x + 22, y + 36); ctx.lineTo(x - 22, y + 36); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#a85a32'; rr(x - 33, y, 66, 10, 4); ctx.fill();
      if(p.st === 'sprout') emoji('🌱', x, y - 12, 30);
      if(p.st === 'bloom'){ const need = w.need.some(n => n.e === p.e && n.left > 0); const s = 1 + (p.pop || 0) * .3 + (p.t < .8 ? Math.sin(G.time * 20) * .04 : 0);
        if(need){ ctx.fillStyle = 'rgba(255,240,150,.5)'; ell(x, y - 18, 28, 28); ctx.fill(); }
        ctx.save(); ctx.translate(x, y - 18); ctx.scale(s, s); emoji(p.e, 0, 0, 44); ctx.restore(); }
      if(p.st === 'wilt') emoji('🥀', x, y - 14, 36);
    });
    // the bouquet being made
    const bx = 200, by = 676;
    ctx.fillStyle = '#f6e2bf'; ctx.beginPath(); ctx.moveTo(bx - 40, by - 24); ctx.lineTo(bx + 40, by - 24); ctx.lineTo(bx + 8, by + 36); ctx.lineTo(bx - 8, by + 36); ctx.closePath(); ctx.fill();
    w.picked.forEach((e, i) => { const a = (i - (w.picked.length - 1) / 2) * .35; emoji(e, bx + Math.sin(a) * 34, by - 30 - Math.cos(a) * 10, 30); });
    if(w.need.every(k => k.left <= 0)) emoji('🎀', bx, by + 6, 26);
  },
  drawOrder(x, y, o){
    const w = G.w; const n = o.need.length;
    o.need.forEach((k, i) => {
      const cx = x + (i - (n - 1) / 2) * 60, have = w.need ? w.need.find(m => m.e === k.e) : null;
      emoji(k.e, cx, y - 10, 34);
      txt('×' + (have ? have.left : k.n), cx, y + 26, 16, have && have.left <= 0 ? '#3d9a70' : '#4a2a18');
      if(have && have.left <= 0) emoji('✅', cx + 16, y - 24, 14);
    });
  }
};

   10. MONEY — rewarded ads (AdMob) + purchases (Google Play Billing)
   ---------------------------------------------------------------------
   FAKE FOR NOW: in a browser, ads are a 3-second pretend ad, and
   purchases are pretend (a "Demo" button gives you the item).
   Inside the Android app (Capacitor) with the plugins installed, the
   real ones take over automatically:
     • @capacitor-community/admob   → rewarded video ads
     • cordova-plugin-purchase      → Google Play purchases
   BEFORE RELEASE: put your real AdMob rewarded unit ID below,
   set MONEY.TESTING to false, and set MONEY.DEMO_BUY to false.
   Ads are ALWAYS the player's choice. Nothing plays on its own.
===================================================================== */
const MONEY = {
  TESTING: true,
  DEMO_BUY: true,   // browser only: pretend purchases give the item (for testing)
  REWARDED_ID: 'ca-app-pub-3940256099942544/5224354917', // Google's TEST rewarded ID — replace with yours
};

const isNative = () => !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const AdMobP = () => isNative() && window.Capacitor.Plugins ? Capacitor.Plugins.AdMob : null;
let adBusy = false;

/* the one function the game calls. Resolves true if the player earned the reward. */
async function rewardAd(){
  if(S.noAds){ toast('✨ ' + tr('Golden pack: reward given!'), 'gold'); return true; }
  if(adBusy) return false;
  adBusy = true; musicStop();
  let ok = false;
  try{ ok = AdMobP() ? await nativeAd() : await demoAd(); }catch(e){ ok = false; }
  adBusy = false;
  if(!ok) toast(tr('No reward this time'), 'err');
  return ok;
}
function nativeAd(){
  const A = AdMobP();
  return new Promise(async res => {
    let earned = false, finished = false; const hs = [];
    const finish = () => { if(finished) return; finished = true; hs.forEach(h => { try{ h.remove(); }catch(e){} }); res(earned); };
    try{
      hs.push(await A.addListener('onRewardedVideoAdReward', () => { earned = true; }));
      hs.push(await A.addListener('onRewardedVideoAdDismissed', () => setTimeout(finish, 250)));
      hs.push(await A.addListener('onRewardedVideoAdFailedToShow', finish));
      await A.prepareRewardVideoAd({adId:MONEY.REWARDED_ID, isTesting:MONEY.TESTING});
      const item = await A.showRewardVideoAd();
      if(item && item.amount !== undefined) earned = true;
      setTimeout(finish, 600);
    }catch(e){ finish(); }
  });
}

  return new Promise(res => {
    let n = 3;
    $('modal').dataset.soft = '0';

    const iv = setInterval(() => { n--; const el = $('adCd'); if(el) el.textContent = n; if(n <= 0){ clearInterval(iv); closeModal(); res(true); } }, 1000);
    $('adSkip').onclick = () => { clearInterval(iv); closeModal(); res(false); };
  });
}

function iapInit(){

      S.coins += c; save();
      $('modal').dataset.soft = '0';
      openModal('<h2>☀️ ' + tr('Welcome back!') + '</h2><div class="center" style="font-size:44px">' + ownedShops().filter(s => S.shops[s].staff).map(s => SHOPS[s].staff.e).join('') + '</div>' +
        '<p class="center">' + tr('While you were away, your staff served your neighbors.') + '</p><div class="bigcoins">🪙 +' + fmt(c) + '</div><button class="btn red wide" id="wOk">✔ ' + tr('Yay!') + '</button>');
      $('wOk').onclick = () => { closeModal(); sfx('coin'); showNextGift(); };
      return;
    }
  }
  setTimeout(showNextGift, 400);
}

/* ---------- input: taps + drags ---------- */
let ptrDown = false, ptrLast = null;
function toBoard(e){ const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - offX) / scale, (e.clientY - r.top - offY) / scale]; }
cv.addEventListener('pointerdown', e => {
  if(mode !== 'play' || paused) return;
  const [x, y] = toBoard(e); ptrDown = true; ptrLast = [x, y];
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  if(sceneId === 'town') townTap(x, y);
  else if(sceneId === 'bistro'){ if(R) bistroTap(x, y); }
  else if(G) mgTap(x, y);
});
cv.addEventListener('pointermove', e => {
  if(!ptrDown || mode !== 'play' || paused || !G || sceneId === 'town' || sceneId === 'bistro') return;
  const [x, y] = toBoard(e), moved = Math.hypot(x - ptrLast[0], y - ptrLast[1]); ptrLast = [x, y];
  mgDrag(x, y, true, moved);
});
const ptrEnd = e => { if(!ptrDown) return; ptrDown = false; if(G && sceneId !== 'town' && sceneId !== 'bistro'){ const [x, y] = toBoard(e); mgDrag(x, y, false, 0); } };
cv.addEventListener('pointerup', ptrEnd); cv.addEventListener('pointercancel', ptrEnd);

/* ---------- buttons ---------- */
$('hPause').onclick = () => { sfx('tap'); pauseGame(); };
$('tPlay').onclick = () => { audio(); sfx('tap'); goTown(); };
$('tSet').onclick = () => { audio(); openSettings(); };
$('tSetBtn').onclick = () => openSettings();
$('bPets').onclick = openBook; $('bStaff').onclick = openStaff; $('bShop').onclick = () => openShop('town');
$('bkClose').onclick = () => { sfx('tap'); $('book').classList.remove('on'); };
$('stClose').onclick = () => { sfx('tap'); $('staff').classList.remove('on'); refreshTownHud(); };
$('shClose').onclick = closeShop;
document.addEventListener('visibilitychange', () => { if(document.hidden){ musicStop(); save(); pauseGame(); } else if(mode === 'play' && !paused) musicStart(); });
window.addEventListener('resize', resize);

/* ---------- main loop ---------- */
function frame(t){
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  if(mode === 'play' && !paused){
    if(sceneId === 'town'){ townUpdate(dt); saveT += dt; if(saveT > 10){ saveT = 0; save(); } }
    else if(sceneId === 'bistro' && R){ bistroUpdate(dt); if(mode === 'play') hudGoal(); }
    else if(G) mgUpdate(dt);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = sceneId === 'town' ? '#7fb86a' : '#3d2416'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sh = FX.shake;
  ctx.translate(offX + (sh ? rand(-sh, sh) : 0), offY + (sh ? rand(-sh, sh) : 0)); ctx.scale(scale, scale);
  ctx.save(); rr(0, 0, W, H, 14); ctx.clip();
  if(sceneId === 'town' && TOWN.ready) townDraw();
  else if(sceneId === 'bistro' && R) bistroDraw();
  else if(G) mgDraw();
  ctx.restore();
  drawFx(dt);
  requestAnimationFrame(frame);
}
applyEasy();
resize(); renderTitle(); adsInit();
requestAnimationFrame(frame);
window.PB = {get S(){ return S; }, get R(){ return R; }, get G(){ return G; }, TOWN, CONFIG, startScene, goTown, bistroTap, mgTap, mgDrag, townTap, confettiBurst, STATIONS, DISHES, TABLE_POS, PASS_POS, POTS};

</script>
