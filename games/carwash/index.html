<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12062a">
<title>Car Wash Tycoon</title>
<style>
/* =====================================================================
   CAR WASH TYCOON — styles
   Retro 80s neon. Change the colors here to restyle the whole game.
===================================================================== */
:root{
  --bg:#12062a; --top:#0c0320; --card:#22104a; --card2:#2c1460; --line:#40207e;
  --pink:#ff3fa4; --cyan:#3ff0ff; --yellow:#ffe93f; --green:#4fff9a; --orange:#ff8a3d; --red:#ff4f6b;
  --txt:#f6efff; --mut:#bba9e0;
  --neon:#ff3fa4; --neon2:#3ff0ff;
  --font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
body.gold{ --pink:#ffb627; --neon:#ffd23f; --neon2:#ff9f1c; --line:#6a4a1e; --card:#2a1a0a; --card2:#3a2410; --bg:#140b02; --top:#0d0700; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:15px}
body.easy{--font:Verdana,Tahoma,sans-serif;letter-spacing:.04em;word-spacing:.12em;line-height:1.45}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--top);border-bottom:2px solid var(--pink);box-shadow:0 2px 10px #ff3fa444;z-index:5}
#coinBox{flex:1;min-width:0}
#coins{font-size:22px;font-weight:900;color:var(--yellow);text-shadow:0 0 6px #ff9f1c88;white-space:nowrap}
#rate{font-size:12px;color:var(--cyan);white-space:nowrap}
#chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.chip.rush{background:#5a1030;border-color:var(--yellow);color:var(--yellow)}
.chip.x2{border-color:var(--green);color:var(--green)}
.chip.turbo{border-color:var(--cyan);color:var(--cyan)}
.pill{font-weight:800;padding:6px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
#boostBtn{background:linear-gradient(var(--pink),#b5126a);color:#fff;box-shadow:0 0 8px #ff3fa488;border:0}

/* ---------- the scene ---------- */
#scene{position:relative;flex:0 0 47%;overflow:hidden;touch-action:manipulation}
.sky{position:absolute;inset:0;background:linear-gradient(#14042e 0%,#3a0a5e 38%,#a0206e 58%,#ff5f7e 70%,#ffb347 78%)}
body.gold .sky{background:linear-gradient(#120700 0%,#3a1a02 38%,#a05a10 58%,#ffb627 70%,#ffe08a 78%)}
.sun{position:absolute;left:50%;top:22%;width:44vmin;height:44vmin;max-width:240px;max-height:240px;transform:translateX(-50%);border-radius:50%;background:linear-gradient(#ffe93f,#ff7a3d 55%,#ff3fa4)}
.sun::after{content:"";position:absolute;inset:50% 0 0 0;background:repeating-linear-gradient(transparent 0 7px,#a0206e 7px 11px)}
.mtn{position:absolute;left:0;right:0;bottom:30%;height:22%;background:#2a0846;clip-path:polygon(0 100%,0 55%,10% 25%,22% 60%,34% 10%,48% 65%,60% 30%,74% 70%,86% 20%,100% 50%,100% 100%)}
.ground{position:absolute;left:0;right:0;bottom:0;height:31%;background:#13042a;overflow:hidden}
.grid{position:absolute;left:-50%;right:-50%;top:0;height:220%;transform-origin:top;transform:perspective(160px) rotateX(58deg);
  background-image:linear-gradient(var(--neon) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--neon) 1.5px,transparent 1.5px);background-size:40px 40px;opacity:.45}
.road{position:absolute;left:0;right:0;bottom:0;height:15%;background:#0a0218;border-top:2px solid var(--neon2)}
.lane{position:absolute;left:0;right:0;top:48%;height:2px;background:repeating-linear-gradient(90deg,var(--yellow) 0 18px,transparent 18px 34px);opacity:.6}

#bldg{position:absolute;left:3%;right:3%;top:13%;bottom:16%;display:flex;flex-direction:column;background:#1a0838ee;border:2px solid var(--neon);border-radius:14px 14px 4px 4px;box-shadow:0 0 12px var(--neon),inset 0 0 14px #ff3fa422}
#sign{display:flex;align-items:center;justify-content:space-between;height:26px;padding:0 4px;border-bottom:2px solid var(--neon)}
#sign .nm{flex:1;text-align:center;font-weight:900;letter-spacing:2px;font-size:15px;color:#fff;text-shadow:0 0 4px var(--neon2),0 0 10px var(--neon2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sign button{width:32px;height:24px;font-size:14px;color:var(--neon2)}
#sign button.off{opacity:.2}
#bays{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:5px;padding:6px}
.bay{position:relative;border:2px solid var(--neon2);border-radius:8px;background:linear-gradient(#2a0f55,#14052e);overflow:hidden;box-shadow:inset 0 0 8px #3ff0ff33}
.bay.vip{border-color:var(--yellow);box-shadow:0 0 8px var(--yellow),inset 0 0 10px #ffe93f44}
.bay.vip::before{content:"👑";position:absolute;top:1px;left:3px;font-size:11px;z-index:3}
.bay .brush{position:absolute;left:10%;right:10%;top:0;height:30%;background:repeating-linear-gradient(90deg,var(--pink) 0 5px,var(--cyan) 5px 10px,var(--yellow) 10px 15px);opacity:.75;border-radius:0 0 8px 8px}
body:not(.saver) .bay .brush{animation:brush .45s ease-in-out infinite alternate}
@keyframes brush{from{transform:translateX(-6%) scaleY(.9)}to{transform:translateX(6%) scaleY(1.05)}}
.bay .car{position:absolute;left:4%;right:4%;bottom:12%;transition:transform .32s ease}
.bay .car.pre{transform:translateX(-140%);transition:none}
.bay .car.out{transform:translateX(140%)}
.car svg{display:block;width:100%;height:auto}
.prog{position:absolute;left:4px;right:4px;bottom:3px;height:5px;background:#0008;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));transform-origin:left;transform:scaleX(0);transition:transform .25s linear}
.dirt{transition:opacity .25s linear}
.bay.buy{display:flex;flex-direction:column;align-items:center;justify-content:center;border-style:dashed;border-color:var(--green);color:var(--green);font-weight:800;font-size:11px;text-align:center;gap:2px}
.bay.buy b{font-size:20px;line-height:1}
.bay.buy.no{border-color:var(--line);color:var(--mut);opacity:.7}
.bay.lock{border-style:dashed;border-color:#40207e;opacity:.35;display:flex;align-items:center;justify-content:center;font-size:16px}
.bay.hit{animation:hit .12s}
@keyframes hit{50%{transform:scale(.94)}}

#reg{position:absolute;top:2.5%;right:3%;z-index:4;padding:4px 9px 6px;border-radius:12px;background:#0c0320dd;border:2px solid var(--green);font-weight:900;font-size:13px;color:var(--green);min-width:86px;text-align:center}
#reg .bar{height:4px;margin-top:3px;background:#0008;border-radius:2px;overflow:hidden}
#reg .bar i{display:block;height:100%;background:var(--green);transform-origin:left}
#reg.full{border-color:var(--red);color:var(--red)}
#reg.full .bar i{background:var(--red)}
body:not(.saver) #reg.full{animation:pulse 1s infinite}
#reg.mgr{border-color:var(--cyan);color:var(--cyan);font-size:11px}
#locRate{position:absolute;top:2.5%;left:3%;z-index:4;padding:5px 9px;border-radius:12px;background:#0c0320bb;font-size:11px;font-weight:800;color:var(--cyan)}

.spark{position:absolute;bottom:4%;left:0;width:21%;z-index:4;transform:translateX(-110%);transition:transform 7s linear;filter:drop-shadow(0 0 6px var(--yellow))}
.spark::after{content:"✨";position:absolute;top:-30%;right:10%;font-size:16px}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.fl{position:absolute;font-weight:900;font-size:14px;color:var(--yellow);text-shadow:0 0 5px #ff3fa4,0 1px 0 #000;white-space:nowrap;transform:translateX(-50%);animation:fl .95s ease-out forwards}
.fl.big{font-size:20px}
@keyframes fl{to{transform:translate(-50%,-46px);opacity:0}}
.bub{position:absolute;width:11px;height:11px;border-radius:50%;border:1.5px solid #c9fbff;background:#ffffff33;animation:bub .7s ease-out forwards}
@keyframes bub{to{transform:translate(var(--dx),-34px) scale(1.5);opacity:0}}
#scene.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
#rushBan{position:absolute;left:0;right:0;top:40%;z-index:7;text-align:center;font-size:30px;font-weight:900;color:var(--yellow);text-shadow:0 0 6px var(--pink),0 0 16px var(--pink);pointer-events:none;opacity:0}
#rushBan.on{animation:ban 2.2s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#coach{position:absolute;left:5%;right:5%;bottom:1%;z-index:8;background:#0c0320ee;border:2px solid var(--yellow);border-radius:14px;padding:8px 10px;font-weight:800;font-size:14px;text-align:center;color:#fff;display:none;pointer-events:none}
#coach.on{display:block}
.hl{outline:3px solid var(--yellow);outline-offset:2px}
body:not(.saver) .hl{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
body:not(.saver) #sign .nm{animation:flick 7s infinite}
@keyframes flick{0%,92%,96%,100%{opacity:1}94%{opacity:.4}}

/* ---------- panel ---------- */
#panel{flex:1;overflow-y:auto;padding:8px 10px 18px;-webkit-overflow-scrolling:touch}
#app.full #scene{display:none}
h2{margin:6px 0 4px;font-size:18px;color:var(--cyan);text-shadow:0 0 6px #3ff0ff66}
h3{margin:14px 0 4px;font-size:15px;color:var(--pink)}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--mut);font-size:13px}
.center{text-align:center}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:7px 0}
.card .ic{font-size:28px;width:38px;text-align:center;flex:0 0 38px}
.card .info{flex:1;min-width:0}
.nm{font-weight:900}
.sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.sub b{color:var(--txt)}
.btn{background:linear-gradient(var(--pink),#b5126a);color:#fff;font-weight:900;border-radius:12px;padding:10px 12px;min-width:86px;box-shadow:0 3px 0 #6a0a40;text-align:center;line-height:1.15}
.btn small{display:block;font-size:10px;opacity:.85;font-weight:700}
.btn.cy{background:linear-gradient(var(--cyan),#14a6be);color:#0c0320;box-shadow:0 3px 0 #0b5a6a}
.btn.gold{background:linear-gradient(#ffe93f,#ff9f1c);color:#2a1300;box-shadow:0 3px 0 #8a4a00}
.btn.green{background:linear-gradient(var(--green),#1fb86a);color:#062a14;box-shadow:0 3px 0 #0b5a30}
.btn.ghost{background:var(--card2);border:1px solid var(--line);box-shadow:none;color:var(--txt)}
.btn.wide{display:block;width:100%;margin-top:8px}
.btn.no{filter:grayscale(.8);opacity:.5}
.btn.max{background:var(--card2);box-shadow:none;color:var(--green);border:1px solid var(--green)}
.btn:active{transform:translateY(2px) scale(.97)}
.pop{animation:pop .28s}
@keyframes pop{40%{transform:scale(1.12)}}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:2px;gap:2px}
.seg button{padding:6px 10px;border-radius:8px;font-weight:800;font-size:12px;color:var(--mut)}
.seg button.on{background:var(--pink);color:#fff}
.bar2{height:8px;background:#0008;border-radius:4px;overflow:hidden;margin-top:5px}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.tag{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 6px;border-radius:6px;background:var(--card2);vertical-align:middle}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.dex{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;font-size:11px}
.dex .car{margin:2px 0}
.dex.no .car{filter:brightness(0) opacity(.45)}
.dex .cnt{color:var(--mut)}
.dex.shined{border-color:var(--yellow);box-shadow:0 0 6px #ffe93f55}
.tog{width:52px;height:30px;border-radius:15px;background:var(--card2);border:1px solid var(--line);position:relative;flex:0 0 52px}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:transform .2s}
.tog.on{background:var(--pink)}
.tog.on::after{transform:translateX(22px);background:#fff}

/* ---------- nav ---------- */
#nav{display:flex;background:var(--top);border-top:2px solid var(--neon2)}
#nav button{flex:1;padding:5px 0 7px;font-size:11px;font-weight:800;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
#nav button b{font-size:22px;line-height:1.2}
#nav button.on{color:var(--cyan);text-shadow:0 0 6px var(--cyan)}
#nav .dot{position:absolute;top:4px;right:22%;width:10px;height:10px;border-radius:50%;background:var(--red);display:none;box-shadow:0 0 6px var(--red)}
#nav .dot.on{display:block}

/* ---------- modal + toast ---------- */
#modalBg{position:fixed;inset:0;background:#05010fcc;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modalBg.on{display:flex}
#modal{position:relative;width:100%;max-width:400px;max-height:88vh;overflow-y:auto;background:var(--bg);border:2px solid var(--neon);border-radius:18px;padding:16px;box-shadow:0 0 22px var(--neon)}
#modal h2{margin-top:0;text-align:center;padding:0 26px}
#mClose{position:absolute;top:8px;right:10px;width:34px;height:34px;font-size:18px;color:var(--mut)}
.big{font-size:54px;text-align:center}
.amt{font-size:26px;font-weight:900;text-align:center;color:var(--yellow);margin:6px 0}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));pointer-events:none;transform:translateX(-50%);z-index:60;background:#0c0320f2;border:2px solid var(--cyan);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;max-width:90vw;text-align:center;display:none}
#toast.on{display:block;animation:pop .25s}
#toast.gold{border-color:var(--yellow);color:var(--yellow)}
#toast.err{border-color:var(--red)}
#load{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
#load .t{font-size:34px;font-weight:900;color:#fff;letter-spacing:3px;text-shadow:0 0 6px var(--pink),0 0 16px var(--pink);text-align:center;line-height:1.1}
#load .t span{display:block;font-size:20px;color:var(--cyan);text-shadow:0 0 6px var(--cyan),0 0 14px var(--cyan)}
#load .lb{width:60%;max-width:260px;height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
#load .lb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .15s}
</style>
</head>
<body class="saver">
<div id="load"><div class="t">CAR WASH<span>TYCOON</span></div><div id="loadCar" style="width:150px"></div><div class="lb"><i id="loadBar"></i></div></div>
<div id="app">
  <div id="top">
    <div id="coinBox"><div id="coins">🪙 0</div><div id="rate">+0/s</div></div>
    <div id="chips"></div>
    <button class="pill" id="gemPill">💎 0</button>
    <button class="pill" id="boostBtn">📺 x2</button>
  </div>
  <div id="scene">
    <div class="sky"></div><div class="sun"></div><div class="mtn"></div>
    <div class="ground"><div class="grid"></div></div>
    <div class="road"><div class="lane"></div></div>
    <div id="bldg"><div id="sign"><button id="locPrev">◀</button><div class="nm" id="signNm"></div><button id="locNext">▶</button></div><div id="bays"></div></div>
    <div id="locRate"></div>
    <button id="reg"></button>
    <div id="rushBan"></div>
    <div id="fx"></div>
    <div id="coach"></div>
  </div>
  <div id="panel"></div>
  <div id="nav"></div>
</div>
<div id="modalBg"><div id="modal"><button id="mClose" aria-label="Close">✕</button><div id="mBody"></div></div></div>
<div id="toast"></div>
<script>
/* =====================================================================
   CAR WASH TYCOON — one bay grows into a car-wash chain  (MOS Arcade)
   ---------------------------------------------------------------------
   HOW THIS FILE IS ORGANISED
     1. CONFIG        ← all the tuning numbers. Change the feel here.
     2. DATA          ← locations, cars, managers, quests, achievements
     3. STATE + SAVE  ← what the game remembers (on the phone only)
     4. ECONOMY       ← how coins are made
     5. ART           ← cars drawn in code (SVG)
     6. SOUND         ← synth blips made in code (no files)
     7. SCENE         ← the car wash: bays, scrubbing, register, events
     8. SCREENS       ← Wash, Chain, Cars, Goals, More
     9. MONEY         ← optional ads + purchases (demo in a browser)
    10. MAIN LOOP     ← ticks, away time, tutorial, start-up

   PHONE-COOL DESIGN (why your phone stays cool):
     • No game canvas and no 60 fps loop. The game thinks 4 times a
       second and the movement is done by cheap CSS transitions.
     • Only the location you are looking at is drawn. The scene is
       hidden on other tabs, and everything stops when the app is closed.
     • Battery saver (on by default) turns off the decoration animations.
===================================================================== */

/* =====================================================================
   1. CONFIG — tune the game here. Numbers only, no code knowledge needed.
===================================================================== */
const CONFIG = {
  START_COINS: 12,
  START_GEMS: 5,
  TICK_MS: 250,              // the game thinks every 250 ms (4 times a second)
  OFFLINE_MAX_H: 8,          // coins while the app is closed: up to 8 hours
  REG_CAP_MIN: 20,           // a cash register holds 20 minutes of coins (no manager)

  /* ---- scrubbing (tap a bay) ---- */
  SCRUB_PUSH: 0.12,          // one tap = 12% of a wash
  SCRUB_COIN: 0.10,          // one tap pays 10% of a car (straight to your wallet)

  /* ---- upgrades (each location) ---- */
  BAY_MAX: 8, BAY_BASE: 2, BAY_GROWTH: 3.5,               // new bay cost = base x2, then x3.5 each
  SOAP_STEP: 0.30, SOAP_DOUBLE_EVERY: 25, SOAP_MAX: 200, SOAP_GROWTH: 1.12, // +30% pay per level, x2 every 25 levels
  BRUSH_STEP: 0.12, BRUSH_MAX: 60, BRUSH_BASE: 2.5, BRUSH_GROWTH: 1.17,     // +12% wash speed per level
  STAFF_STEP: 0.04, STAFF_MAX: 20, STAFF_BASE: 6, STAFF_GROWTH: 1.4,        // +4% shine chance per detailer level
  SHINE_MULT: 3,             // a shined car pays x3
  MGR_BASE: 40,              // manager cost = location base x40
  MGR_BONUS: 1.5,            // a manager gives +50% coins

  /* ---- VIP cars ---- */
  VIP_CHANCE: 0.04,          // 4% of cars are VIPs
  VIP_MULT: 10,              // a VIP car pays x10

  /* ---- Rush Hour ---- */
  RUSH_EVERY_MIN: [3, 6],    // a Rush Hour every 3-6 minutes
  RUSH_LEN_S: 40,            // lasts 40 seconds
  RUSH_SPEED: 2,             // washes go x2 faster
  RUSH_PAY: 1.5,             // cars pay +50%
  RUSH_VIP: 0.08,            // and VIPs show up twice as often

  /* ---- sparkly car on the road ---- */
  SPARK_EVERY_S: [50, 110],  // a sparkly car drives by every 50-110 seconds
  SPARK_REWARD_S: 30,        // tap it: 30 seconds of all your income
  SPARK_DRIVE_S: 7,          // seconds it takes to cross the road
  SPARK_GEM_CHANCE: 0.25,    // and sometimes a gem

  /* ---- boosts ---- */
  AD_2X_MIN: 30, AD_2X_MAX_H: 4,   // each ad: +30 min of x2 coins, up to 4 h
  AD_RUSH_COOLDOWN_MIN: 20,        // ad "Rush Hour now": once every 20 min
  AD_GEMS: 3, AD_GEMS_PER_DAY: 5,  // ad for 3 gems, 5 times a day
  TURBO_MIN: 15, GEM_TURBO: 10,    // Turbo Foam: x2 wash speed for 15 min
  WARP_H: 1, GEM_WARP: 15,         // Time Warp: 1 hour of coins right now
  GEM_RUSH: 8,                     // start a Rush Hour now

  /* ---- Sell the Chain (rebirth, same rules as Fishies) ---- */
  KEY_COINS: 1e9,            // keys = 10 x √(coins earned this run / 1B)
  KEY_MIN: 10,               // need at least 10 keys (about 1B coins earned)
  KEY_BONUS: 0.03,           // each Gold Key = +3% coins forever
  KEY_START: 1000,           // start the new run with 1,000 coins per key
  REBIRTH_PRICE_MULT: 2,     // each rebirth doubles all prices

  /* ---- collection ---- */
  DEX_FOUND: 0.01,           // +1% coins for each car type found
  DEX_SHINE_AT: 25,          // wash 25 of a type to "shine" it...
  DEX_SHINE: 0.01,           // ...for +1% more

  /* ---- quests + daily gift ---- */
  QUEST_GEMS: 5, CHEST_GEMS: 15, CHEST_MIN: 20,   // chest = 15 gems + 20 min of coins
  DAILY_MIN: 5,              // daily gift = 5 min of coins x streak day
  DAILY_GEMS: 2,             // + 2 gems x streak day

  /* ---- Golden pack ---- */
  PACK_MULT: 2, PACK_GEMS: 100,
};

/* =====================================================================
   2. DATA
===================================================================== */
// price = coins a car pays, time = seconds per wash, base = upgrade price base, open = cost to open

const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n < 0) return '-' + fmt(-n);
  if(n < 1000) return n < 10 && n % 1 ? (Math.floor(n * 10) / 10).toString() : Math.floor(n).toString();
  let i = 0; while(n >= 1000 && i < SUF.length - 1){ n /= 1000; i++; }
  return (n < 10 ? Math.floor(n * 100) / 100 : n < 100 ? Math.floor(n * 10) / 10 : Math.floor(n)) + SUF[i];
}
function fmtTime(s){
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  if(h) return h + 'h ' + String(m).padStart(2, '0') + 'm';
  if(m) return m + ':' + String(x).padStart(2, '0');
  return x + 's';
}
function dayKey(d){ d = d || new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY); if(!raw) return null;
    const d = JSON.parse(raw), f = fresh();
    for(const k in f) if(d[k] === undefined) d[k] = f[k];
    LOCS.forEach((l, i) => {
      if(!d.loc[i]) d.loc[i] = f.loc[i];
      const x = d.loc[i];
      while(x.p.length < x.bays) x.p.push(0);
      while(x.car.length < x.bays) x.car.push('sedan');
    });
    return d;
  }catch(e){ return null; }
}

   4. ECONOMY
===================================================================== */
const openCount = () => S.loc.filter(l => l.open).length;
const rushOn = () => S && now() < S.rushUntil;
const turboOn = () => S && now() < S.turbo;
const ad2xOn = () => S && now() < S.ad2x;
const costMul = () => Math.pow(CONFIG.REBIRTH_PRICE_MULT, S.rebirths || 0);
function dexFound(){ return TYPES.filter(x => S.dex[x.id]).length; }
function dexShined(){ return TYPES.filter(x => (S.dex[x.id] || 0) >= CONFIG.DEX_SHINE_AT).length; }
function dexBonus(){ return dexFound() * CONFIG.DEX_FOUND + dexShined() * CONFIG.DEX_SHINE; }
let _pmT = 0, _pmV = 1;
function permMul(){
  const n = now(); if(n - _pmT < 1000) return _pmV; _pmT = n;
  _pmV = (1 + CONFIG.KEY_BONUS * S.keys) * (1 + dexBonus()) * (S.pack ? CONFIG.PACK_MULT : 1);
  return _pmV;
}
function carPrice(i){ const l = S.loc[i]; return LOCS[i].price * (1 + CONFIG.SOAP_STEP * l.soap) * Math.pow(2, Math.floor(l.soap / CONFIG.SOAP_DOUBLE_EVERY)); }
function washTime(i, live = true){
  let w = LOCS[i].time / (1 + CONFIG.BRUSH_STEP * S.loc[i].brush);
  if(live){ if(rushOn()) w /= CONFIG.RUSH_SPEED; if(turboOn()) w /= 2; }
  return w;
}
function incMul(i, live = true){
  let m = permMul() * (S.loc[i].mgr ? CONFIG.MGR_BONUS : 1);
  if(live && ad2xOn()) m *= 2;
  if(live && rushOn()) m *= CONFIG.RUSH_PAY;
  return m;
}
const shineChance = i => Math.min(1, CONFIG.STAFF_STEP * S.loc[i].staff);
function avgMult(i){ return (1 + (CONFIG.SHINE_MULT - 1) * shineChance(i)) * (1 + (CONFIG.VIP_MULT - 1) * CONFIG.VIP_CHANCE); }
function rate(i, live = true){ const l = S.loc[i]; if(!l.open) return 0; return l.bays * carPrice(i) * incMul(i, live) * avgMult(i) / washTime(i, live); }
function totalRate(live = true){ let r = 0; for(let i = 0; i < LOCS.length; i++) r += rate(i, live); return r; }
function regCap(i){ return Math.max(carPrice(i) * 20, rate(i, false) * CONFIG.REG_CAP_MIN * 60); }

function addCoins(a){ if(!(a > 0)) return; S.coins += a; S.total += a; S.run += a; }
function earn(i, a){
  const l = S.loc[i];
  if(l.mgr) addCoins(a);
  else l.reg = Math.min(regCap(i), l.reg + a);
}
function pickCar(i){
  const rush = S ? rushOn() : false;
  const vipCh = rush ? CONFIG.RUSH_VIP : CONFIG.VIP_CHANCE;
  if(S && Math.random() < vipCh){
    const pool = TYPES.filter(x => x.r >= 2 && x.m <= i && (!x.paid || S.pack));
    const w = x => x.r === 2 ? 70 : x.r === 3 ? 25 : 15;
    let tot = pool.reduce((a, x) => a + w(x), 0), r = Math.random() * tot;
    for(const x of pool){ r -= w(x); if(r <= 0) return x.id; }
    return pool[0].id;
  }
  const rares = TYPES.filter(x => x.r === 1 && x.m <= i), commons = TYPES.filter(x => x.r === 0 && x.m <= i);
  const pool = (rares.length && Math.random() < 0.15) ? rares : commons;
  return pool[Math.floor(Math.random() * pool.length)].id;
}

/* ---------- upgrade prices ---------- */
const UPG = {
  soap:  {e:'🧼', base:1,                  g:CONFIG.SOAP_GROWTH,  max:CONFIG.SOAP_MAX},
  brush: {e:'🌀', base:CONFIG.BRUSH_BASE,  g:CONFIG.BRUSH_GROWTH, max:CONFIG.BRUSH_MAX},
  staff: {e:'✨', base:CONFIG.STAFF_BASE,  g:CONFIG.STAFF_GROWTH, max:CONFIG.STAFF_MAX},
};
function upBase(i, k){ const u = UPG[k]; return LOCS[i].base * u.base * costMul() * Math.pow(u.g, S.loc[i][k]); }
function upCost(i, k, n){ const u = UPG[k]; return upBase(i, k) * (Math.pow(u.g, n) - 1) / (u.g - 1); }
function upN(i, k){
  const u = UPG[k], room = u.max - S.loc[i][k]; if(room <= 0) return 0;
  if(S.buyAmt === 'max'){ const n = Math.floor(Math.log(S.coins * (u.g - 1) / upBase(i, k) + 1) / Math.log(u.g)); return Math.max(1, Math.min(room, n)); }
  return Math.min(room, S.buyAmt);
}
const bayCost = i => LOCS[i].base * CONFIG.BAY_BASE * costMul() * Math.pow(CONFIG.BAY_GROWTH, Math.max(0, S.loc[i].bays - 1));
const mgrCost = i => LOCS[i].base * CONFIG.MGR_BASE * costMul();
const openCost = i => LOCS[i].open * costMul();
function keyGain(){ return Math.floor(10 * Math.sqrt(Math.max(0, S.run) / CONFIG.KEY_COINS)); }

let AC = null, lastCoinSfx = 0;
function ac(){
  if(!S || !S.sound) return null;
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(f, d, type, vol, slide, delay){
  const a = ac(); if(!a) return;
  const t0 = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t0 + d);
  g.gain.setValueAtTime(vol || .04, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + .02);
}
function sfx(n){
  if(!S || !S.sound) return;
  switch(n){
    case 'tap': beep(520 + Math.random() * 120, .05, 'triangle', .035, 200); break;
    case 'coin': if(now() - lastCoinSfx < 140) return; lastCoinSfx = now(); beep(990, .06, 'square', .025); beep(1480, .09, 'square', .02, 0, .06); break;
    case 'buy': beep(440, .08, 'sawtooth', .03, 440); beep(880, .1, 'triangle', .03, 0, .07); break;
    case 'vip': [523, 659, 784, 1046].forEach((f, k) => beep(f, .12, 'square', .03, 0, k * .08)); break;
    case 'rush': beep(220, .5, 'sawtooth', .035, 660); beep(330, .5, 'square', .02, 990, .1); break;
    case 'spark': [880, 1175, 1568].forEach((f, k) => beep(f, .1, 'triangle', .035, 0, k * .06)); break;
    case 'err': beep(160, .15, 'sawtooth', .03, -60); break;
    case 'big': [392, 523, 659, 784, 1046].forEach((f, k) => beep(f, .16, 'square', .03, 0, k * .09)); break;
  }
}

let bayEls = [], tab = 'wash', dispCoins = 0;
const sceneOn = () => tab === 'wash' && !document.hidden;

function buildScene(){
  const i = S.cur, l = S.loc[i], loc = LOCS[i];

      el.car = el.querySelector('.car'); el.pi = el.querySelector('.prog i'); el.dirt = el.querySelector('.dirt'); el.lastP = 0;

function drawScene(force){
  const i = S.cur, l = S.loc[i];
  for(let b = 0; b < bayEls.length; b++){
    const el = bayEls[b], p = Math.min(1, l.p[b]);

    else el.pi.style.transform = 'scaleX(' + p + ')';

function fx(html, x, y, cls){
  const box = $('fx'); if(box.childElementCount > 16) return;
  const d = document.createElement('div'); d.className = 'fl' + (cls ? ' ' + cls : '');
  d.innerHTML = html; d.style.left = x + 'px'; d.style.top = y + 'px';
  box.appendChild(d); setTimeout(() => d.remove(), 1000);
}
function bubbles(x, y, n){
  const box = $('fx'); if(S.saver) n = Math.min(n, 2);
  for(let k = 0; k < n; k++){
    if(box.childElementCount > 20) return;
    const d = document.createElement('div'); d.className = 'bub';
    d.style.left = (x + rnd(-14, 14)) + 'px'; d.style.top = (y + rnd(-6, 8)) + 'px'; d.style.setProperty('--dx', rnd(-16, 16) + 'px');

}
function elPos(el){ const s = $('scene').getBoundingClientRect(), r = el.getBoundingClientRect(); return {x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height * .35}; }
function shake(){ const s = $('scene'); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); }

function finishCar(i, b, quiet){
  const l = S.loc[i], id = l.car[b], T = TY(id), vip = T.r >= 2;
  const shine = Math.random() < shineChance(i);
  const pay = carPrice(i) * incMul(i) * (vip ? CONFIG.VIP_MULT : 1) * (shine ? CONFIG.SHINE_MULT : 1);
  earn(i, pay);
  S.cars++; S.dex[id] = (S.dex[id] || 0) + 1; qAdd('wash');
  if(rushOn()) qAdd('rush');
  if(vip){ S.vips++; qAdd('vip'); }
  if(S.dex[id] === 1 && S.cars > 1){ toast('📖 ' + t('New car: ', 'Nouvelle auto : ') + L(T) + ' (+1%)', 'gold'); _pmT = 0; }
  if(S.dex[id] === CONFIG.DEX_SHINE_AT){ toast('⭐ ' + L(T) + t(' shined! +1% coins', ' brille! +1% pièces'), 'gold'); _pmT = 0; }
  l.car[b] = pickCar(i);
  if(i !== S.cur || !sceneOn() || quiet) return;
  const el = bayEls[b]; if(!el) return;
  const p = elPos(el);
  fx((vip ? '👑 ' : shine ? '✨ ' : '') + '+' + fmt(pay), p.x, p.y, vip ? 'big' : '');
  if(vip){ sfx('vip'); shake(); } else sfx('coin');
  // car drives out, new one drives in (skipped if washes are super fast)
  const fast = washTime(i) < .7;
  if(fast){ el.car.innerHTML = carSVG(l.car[b], {dirt:1}); }
  else {
    const old = el.car; old.classList.add('out'); setTimeout(() => old.remove(), 360);
    const nc = document.createElement('div'); nc.className = 'car pre'; nc.innerHTML = carSVG(l.car[b], {dirt:1});
    el.appendChild(nc); void nc.offsetWidth; nc.classList.remove('pre'); el.car = nc;
  }
  el.dirt = el.car.querySelector('.dirt');
  el.classList.toggle('vip', TY(l.car[b]).r >= 2);
}
function scrub(b){
  const i = S.cur, l = S.loc[i], el = bayEls[b]; if(!el) return;
  l.p[b] += CONFIG.SCRUB_PUSH;
  const coin = Math.max(.1, carPrice(i) * incMul(i) * CONFIG.SCRUB_COIN);
  addCoins(coin); S.scrubs++; qAdd('scrub');
  const p = elPos(el); bubbles(p.x, p.y + 6, 4); sfx('tap');
  el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
  let k = 0; while(l.p[b] >= 1 && k < 5){ l.p[b] -= 1; finishCar(i, b); k++; }
  drawScene();
  if(S.tut === 0 && S.scrubs >= 5){ S.tut = 1; coach(); }
}
function collectReg(i, silent){
  const l = S.loc[i]; if(l.mgr || l.reg <= 0) return 0;
  const a = l.reg; addCoins(a); l.reg = 0; S.regs++; qAdd('reg');
  if(!silent && i === S.cur && sceneOn()){ const p = elPos($('reg')); fx('+' + fmt(a), p.x, p.y + 30, 'big'); sfx('coin'); }
  if(S.tut === 2){ S.tut = 3; coach(); }
  return a;
}

  const c = bayCost(i); if(S.coins < c) return noMoney();
  S.coins -= c; l.bays++; l.p.push(0); l.car.push(pickCar(i)); bought(btn);
  if(tab === 'wash'){ buildScene(); renderWash(); coach(); }
}
function buyMgr(btn){
  const i = S.cur, l = S.loc[i]; if(l.mgr) return;
  const c = mgrCost(i); if(S.coins < c) return noMoney();
  S.coins -= c; collectReg(i, true); l.mgr = true; bought(btn); sfx('big'); _pmT = 0;
  if(S.tut === 3) S.tut = 4;
  toast('👔 ' + L({en:LOCS[i].mgr[0], fr:LOCS[i].mgr[1]}) + t(' is on the job!', ' est au travail!'), 'gold');
  renderWash(); drawScene(); coach();
}

/* ---------- Goals tab: daily gift, quests, achievements ---------- */
function ensureQuests(){
  const d = dayKey();
  if(S.q && S.q.day === d) return;
  const canReg = S.loc.some(l => l.open && !l.mgr);
  let pool = QUESTS.filter(q => q.id !== 'reg' || canReg).sort(() => Math.random() - .5).slice(0, 3);
  S.q = {day: d, chest: false, list: pool.map(q => ({id: q.id, goal: q.n[Math.floor(Math.random() * q.n.length)], have: 0, claimed: false}))};
}
function qAdd(id, n){ if(!S.q) return; S.q.list.forEach(q => { if(q.id === id && q.have < q.goal) q.have = Math.min(q.goal, q.have + (n || 1)); }); }
function dailyReady(){ return S.daily.last !== dayKey(); }
function claimables(){
  ensureQuests();
  let n = dailyReady() ? 1 : 0;
  S.q.list.forEach(q => { if(q.have >= q.goal && !q.claimed) n++; });
  if(!S.q.chest && S.q.list.every(q => q.claimed)) n++;
  return n;
}

    q.claimed = true; S.gems += CONFIG.QUEST_GEMS; sfx('spark'); toast('💎 +' + CONFIG.QUEST_GEMS, 'gold'); save(); renderGoals(); updateDots();

    sfx('big'); showReward('🧰', t('Quest Chest!', 'Coffre de quêtes!'), '🪙 ' + fmt(c) + '<br>💎 ' + CONFIG.CHEST_GEMS); save(); renderGoals(); updateDots();
  };

function streakDay(){
  const y = new Date(); y.setDate(y.getDate() - 1);
  if(!dailyReady()) return ((S.daily.streak - 1) % 7) + 1;
  const s = S.daily.last === dayKey(y) ? S.daily.streak + 1 : 1;
  return ((s - 1) % 7) + 1;
}
function openDaily(){
  if(!dailyReady()) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  S.daily.streak = S.daily.last === dayKey(y) ? S.daily.streak + 1 : 1;
  S.daily.last = dayKey();
  const d = ((S.daily.streak - 1) % 7) + 1;
  const coins = Math.max(30, totalRate(false) * CONFIG.DAILY_MIN * 60 * d), gems = CONFIG.DAILY_GEMS * d;
  addCoins(coins); S.gems += gems; sfx('big'); save();
  showReward('🎁', t('Day ', 'Jour ') + d + ' ' + t('gift!', 'cadeau!'), '🪙 ' + fmt(coins) + '<br>💎 ' + gems, {
    label: t('Watch ad: double it', 'Pub : double-le'),
    go: async () => { if(await rewardAd()){ addCoins(coins); S.gems += gems; toast('🎁 x2!', 'gold'); save(); } }
  });
  if(tab === 'goals') renderGoals(); updateDots();
}
function checkAch(){
  let got = false;
  ACH.forEach(a => { if(!S.ach[a.id] && a.ok()){ S.ach[a.id] = now(); S.gems += a.g; got = true; toast('🏆 ' + L(a) + ' · 💎 +' + a.g, 'gold'); } });

}

function gemBuy(id){
  const cost = {turbo: CONFIG.GEM_TURBO, warp: CONFIG.GEM_WARP, rush: CONFIG.GEM_RUSH}[id];
  if(S.gems < cost){ sfx('err'); toast(t('Not enough gems', 'Pas assez de gemmes'), 'err'); return; }
  if(id === 'rush' && rushOn()){ sfx('err'); toast(t('Rush Hour is already on!', 'L’heure de pointe est déjà en cours!')); return; }
  S.gems -= cost;
  if(id === 'turbo'){ S.turbo = Math.max(now(), S.turbo) + CONFIG.TURBO_MIN * 60000; toast('🫧 ' + t('Turbo Foam on!', 'Mousse turbo activée!'), 'gold'); }
  if(id === 'warp'){ const a = totalRate(false) * 3600 * CONFIG.WARP_H; addCoins(a); showReward('⏩', t('Time Warp!', 'Saut dans le temps!'), '🪙 ' + fmt(a)); }
  if(id === 'rush') startRush();
  sfx('buy'); save(); renderMore(); renderChips();
}

    '<p>🎁 <b>' + t('Head start: ', 'Coup de pouce : ') + '</b>' + fmt(CONFIG.KEY_START * (S.keys + kg)) + ' 🪙</p>' +
    '<p>📈 ' + t('Prices next run: ×', 'Prix à la prochaine partie : ×') + Math.pow(CONFIG.REBIRTH_PRICE_MULT, S.rebirths + 1) + '</p>' +
    '<div class="amt">+' + kg + ' 🔑 → ×' + (1 + CONFIG.KEY_BONUS * (S.keys + kg)).toFixed(2) + '</div>' +
    '<button class="btn wide gold" id="rbYes">' + t('Yes, sell it!', 'Oui, vendre!') + '</button><button class="btn wide ghost" id="rbNo">' + t('Not now', 'Pas maintenant') + '</button>');
  $('rbNo').onclick = closeModal;
  $('rbYes').onclick = () => {
    S.keys += kg; S.rebirths++;
    S.loc = LOCS.map((l, i) => newLoc(i, i === 0)); S.cur = 0; S.run = 0;
    S.coins = CONFIG.KEY_START * S.keys; _pmT = 0;
    closeModal(); sfx('big'); save(); showTab('wash');
    showReward('🔑', t('Chain sold!', 'Chaîne vendue!'), '+' + kg + ' 🔑<br>' + t('Coins ×', 'Pièces ×') + (1 + CONFIG.KEY_BONUS * S.keys).toFixed(2));
  };
}
/* ---------- modal, toast, reward ---------- */
let modalClose = null;
function openModal(title, html){ $('mBody').innerHTML = '<h2>' + title + '</h2>' + html; $('modalBg').classList.add('on'); }
function closeModal(){ $('modalBg').classList.remove('on'); const f = modalClose; modalClose = null; if(f) f(); }
const modalOpen = () => $('modalBg').classList.contains('on');
function showReward(icon, title, body, ad){
  openModal(title, '<div class="big">' + icon + '</div><div class="amt">' + body + '</div>' + (ad ? '<button class="btn wide gold" id="rwAd">' + adIcon() + ' ' + ad.label + '</button>' : '') + '<button class="btn wide ' + (ad ? 'ghost' : 'cy') + '" id="rwOk">' + t('Nice!', 'Super!') + '</button>');
  $('rwOk').onclick = closeModal;
  if(ad) $('rwAd').onclick = async () => { closeModal(); await ad.go(); };
}
let toastT = 0;
function toast(msg, cls){ const e = $('toast'); e.className = 'on ' + (cls || ''); e.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => e.className = '', 2200); }

/* =====================================================================
   9. MONEY — rewarded ads (AdMob) + purchase (Google Play Billing)
   ---------------------------------------------------------------------
   FAKE FOR NOW: in a browser, ads are a 3-second pretend ad, and the
   purchase is pretend (a "Demo" button gives you the item).
   Inside the Android app (Capacitor) with the plugins installed, the
   real ones take over automatically:
     • @capacitor-community/admob   → rewarded video ads
     • cordova-plugin-purchase      → Google Play purchase
   BEFORE RELEASE: put your real AdMob rewarded unit ID below,
   set MONEY.TESTING to false, and set MONEY.DEMO_BUY to false.
   Ads are ALWAYS the player's choice. Nothing plays on its own.
===================================================================== */
const MONEY = {
  TESTING: true,
  DEMO_BUY: true,   // browser only: pretend purchase gives the item (for testing)
  REWARDED_ID: 'ca-app-pub-3940256099942544/5224354917', // Google's TEST rewarded ID — replace with yours
};
const PACK = {sku: 'golden_pack', price: '$2.99'};
const isNative = () => !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const AdMobP = () => isNative() && window.Capacitor.Plugins ? Capacitor.Plugins.AdMob : null;
let adBusy = false;
const adIcon = () => S && S.pack ? '✨' : '📺';

async function rewardAd(){
  if(S.pack){ toast('✨ ' + t('Golden Pack: reward given!', 'Pack Doré : récompense donnée!'), 'gold'); return true; }
  if(adBusy) return false;
  adBusy = true; let ok = false;
  try{ ok = AdMobP() ? await nativeAd() : await demoAd(); }catch(e){ ok = false; }
  adBusy = false; lastTick = now();
  if(!ok) toast(t('No reward this time', 'Pas de récompense cette fois'), 'err');
  return ok;
}
function nativeAd(){
  const A = AdMobP();
  return new Promise(async res => {
    let earned = false, finished = false, hs = [];
    const finish = () => { if(finished) return; finished = true; hs.forEach(h => { try{ h.remove(); }catch(e){} }); res(earned); };
    try{
      hs.push(await A.addListener('onRewardedVideoAdReward', () => { earned = true; }));
      hs.push(await A.addListener('onRewardedVideoAdDismissed', () => setTimeout(finish, 250)));
      hs.push(await A.addListener('onRewardedVideoAdFailedToShow', finish));
      await A.prepareRewardVideoAd({adId: MONEY.REWARDED_ID, isTesting: MONEY.TESTING});
      const item = await A.showRewardVideoAd();
      if(item && item.amount !== undefined) earned = true;
      setTimeout(finish, 600);
    }catch(e){ finish(); }
  });
}
function demoAd(){
  return new Promise(res => {
    let n = 3;
    openModal('📺 ' + t('Ad preview', 'Aperçu de pub'), '<div class="big">📺</div><p class="center">' + t('A real video ad plays here in the app.', 'Une vraie pub vidéo joue ici dans l’app.') + '</p><div class="amt" id="adCd">' + n + '</div><button class="btn wide ghost" id="adSkip">' + t('Close (no reward)', 'Fermer (pas de récompense)') + '</button>');
    const iv = setInterval(() => { n--; const el = $('adCd'); if(el) el.textContent = n; if(n <= 0){ clearInterval(iv); closeModal(); res(true); } }, 1000);
    $('adSkip').onclick = () => { clearInterval(iv); closeModal(); res(false); };
  });
}
async function adsInit(){ const A = AdMobP(); if(!A) return; try{ await A.initialize({initializeForTesting: MONEY.TESTING}); }catch(e){} }

function grantSku(sku){
  if(sku !== PACK.sku || S.pack) return '';
  S.pack = true; S.gold = true; S.gems += CONFIG.PACK_GEMS; _pmT = 0;
  ['plat', 'laser'].forEach(id => { S.dex[id] = Math.max(1, S.dex[id] || 0); });
  applySettings();
  return t('✨ Golden neon theme<br>🚘 Platinum Cruiser + Laser Limo<br>🪙 x2 coins forever<br>📺 No ads: rewards are instant<br>💎 +', '✨ Thème néon doré<br>🚘 Croiseur platine + Limo laser<br>🪙 Pièces x2 pour toujours<br>📺 Sans pub : récompenses instantanées<br>💎 +') + CONFIG.PACK_GEMS;
}
const PRICES = {};
let iapReady = false;
function iapStore(){ return window.CdvPurchase && CdvPurchase.store; }
function iapInit(){
  const C = window.CdvPurchase; if(!C || iapReady) return;
  const {store, ProductType, Platform} = C; iapReady = true;
  store.register([{id: PACK.sku, type: ProductType.NON_CONSUMABLE, platform: Platform.GOOGLE_PLAY}]);
  store.when()
    .productUpdated(p => { if(p.pricing && p.pricing.price) PRICES[p.id] = p.pricing.price; })
    .approved(tx => {
      if(!S.iapDone) S.iapDone = {};
      const tid = tx.transactionId || ('t' + now());
      if(!S.iapDone[tid]){
        S.iapDone[tid] = now();
        (tx.products || []).forEach(it => { const msg = grantSku(it.id); if(msg) showReward('💝', t('Thank you!', 'Merci!'), msg); });
        save(); if(tab === 'more') renderMore();
      }
      tx.finish();
    });
  store.error(e => { if(e && e.code !== C.ErrorCode.PAYMENT_CANCELLED) toast(t('Store error — please try again', 'Erreur de la boutique — réessaie'), 'err'); });
  store.initialize([Platform.GOOGLE_PLAY]);
}
document.addEventListener('deviceready', iapInit, false);
function buy(sku){
  sfx('tap');
  const st = iapStore();
  if(st){
    const p = st.get(sku), offer = p && p.getOffer();
    if(!offer){ toast(t('Store is still loading — try again in a moment', 'La boutique charge encore — réessaie dans un instant'), 'err'); return; }
    offer.order(); return;
  }
  openModal('💳 ' + t('Golden Pack', 'Pack Doré'), '<div class="big">🛍️</div><p class="center"><b>' + PACK.price + '</b></p><p class="muted center">' + t('Demo mode: real payments work in the Android app through Google Play.', 'Mode démo : les vrais paiements fonctionnent dans l’app Android avec Google Play.') + '</p>' +
    (MONEY.DEMO_BUY ? '<button class="btn wide gold" id="dmBuy">' + t('Demo: get it free', 'Démo : l’avoir gratuitement') + '</button>' : '') + '<button class="btn wide ghost" id="dmNo">' + t('Close', 'Fermer') + '</button>');
  if($('dmBuy')) $('dmBuy').onclick = () => { closeModal(); const msg = grantSku(sku); save(); if(tab === 'more') renderMore(); if(msg) showReward('💝', t('Thank you!', 'Merci!'), msg); };
  $('dmNo').onclick = closeModal;
}
function restorePurchases(){
  const st = iapStore();
  if(st && st.restorePurchases){ st.restorePurchases(); toast(t('Checking your purchases...', 'Vérification de tes achats...')); }
  else toast(t('Restore works in the Android app.', 'La restauration fonctionne dans l’app Android.'));
}
function paidShopHtml(){
  return '<div class="card" style="flex-direction:column;align-items:stretch;background:linear-gradient(135deg,#3a1a02,#a05a10);border-color:#ffd23f">' +
    '<div class="row" style="justify-content:center"><div style="width:120px">' + carSVG('plat') + '</div><div style="width:120px">' + carSVG('laser') + '</div></div>' +
    '<div class="nm center" style="font-size:1.1em">💝 ' + t('Golden Pack', 'Pack Doré') + '</div><div class="center" style="font-size:.9em;opacity:.95">' +
    t('x2 coins forever · no ads (rewards are instant) · golden neon theme · 2 exclusive VIP cars · +100 💎', 'Pièces x2 pour toujours · sans pub (récompenses instantanées) · thème néon doré · 2 autos VIP exclusives · +100 💎') + '</div>' +
    (S.pack ? '<span class="tag center" style="margin-top:8px;color:var(--green)">✔ ' + t('Owned', 'Acheté') + '</span>' : '<button class="btn gold wide" id="buyPack">' + (PRICES[PACK.sku] || PACK.price) + '</button>') + '</div>' +
    '<button class="btn wide ghost" id="spRestore">🔄 ' + t('Restore purchases', 'Restaurer les achats') + '</button>' +
    '<p class="muted center" style="font-size:.75em">' + t('Totally optional! Everything else can be earned by playing.', 'Totalement optionnel! Tout le reste se gagne en jouant.') + '</p>';
}
function bindPaidShop(){
  if($('buyPack')) $('buyPack').onclick = () => buy(PACK.sku);
  if($('spRestore')) $('spRestore').onclick = restorePurchases;
}

/* =====================================================================
   10. MAIN LOOP — game ticks, away time, tutorial, start-up
   tick(): 4 times a second — washes, events, screen numbers
===================================================================== */
let lastTick = now(), tickN = 0, tickIv = null;
function tick(){
  const n = now(); let dt = (n - lastTick) / 1000; lastTick = n;
  if(dt <= 0) return;
  if(dt > 5){ offlineCredit(dt, dt > 60); dt = CONFIG.TICK_MS / 1000; }
  dt = Math.min(dt, 2);
  if(!rushOn() && n >= S.nextRush) startRush();
  if(n >= S.nextSpark){ if(sceneOn() && !modalOpen()) spawnSpark(); else S.nextSpark = n + 10000; }
  for(let i = 0; i < LOCS.length; i++){
    const l = S.loc[i]; if(!l.open) continue;
    const wt = washTime(i);
    for(let b = 0; b < l.bays; b++){
      l.p[b] += dt / wt;
      let k = 0; while(l.p[b] >= 1 && k < 30){ l.p[b] -= 1; finishCar(i, b, k > 0); k++; }
      if(l.p[b] >= 1) l.p[b] = 0;
    }
  }
  S.lastSeen = n; tickN++;
  // coins count up instead of snapping
  const diff = S.coins - dispCoins;
  dispCoins = Math.abs(diff) < Math.max(1, S.coins * .002) ? S.coins : dispCoins + diff * .4;
  $('coins').textContent = '🪙 ' + fmt(dispCoins);
  if(sceneOn()) drawScene();
  if(tickN % 4 === 0) secondly();
  if(tickN % 40 === 0) save();
}
function secondly(){
  $('rate').textContent = '+' + fmt(totalRate()) + '/s';
  $('gemPill').textContent = '💎 ' + fmt(S.gems);
  renderChips();
  if(tab === 'wash' || tab === 'more' || tab === 'chain'){
    $('panel').querySelectorAll('[data-cost]').forEach(b => b.classList.toggle('no', S.coins < +b.dataset.cost));
    if(tab === 'wash' && S.buyAmt === 'max' && tickN % 8 === 0) refreshMaxLabels();
  }
  if(tab === 'chain') updateChain();
  if(tickN % 8 === 0){ checkAch(); updateDots(); }
  if(S.tut === 2 && tab === 'wash' && !$('coach').classList.contains('on')) coach();
}
function refreshMaxLabels(){ // in MAX mode the amount you can buy changes as coins come in
  const ch = ['soap', 'brush', 'staff'].some(k => { const b = $('panel').querySelector('[data-up="' + k + '"]'); return b && +b.dataset.n !== upN(S.cur, k); });
  if(ch){ const sc = $('panel').scrollTop; renderWash(); $('panel').scrollTop = sc; coach(); }
}
function renderChips(){
  let h = '';
  if(rushOn()) h += '<span class="chip rush">🚦 ' + fmtTime((S.rushUntil - now()) / 1000) + '</span>';
  if(ad2xOn()) h += '<span class="chip x2">x2 ' + fmtTime((S.ad2x - now()) / 1000) + '</span>';
  if(turboOn()) h += '<span class="chip turbo">🫧 ' + fmtTime((S.turbo - now()) / 1000) + '</span>';
  if($('chips').innerHTML !== h) $('chips').innerHTML = h;
}
function updateDots(){
  const g = $('dot_goals'); if(g) g.classList.toggle('on', claimables() > 0);
  const c = $('dot_chain');
  if(c){ const nx = S.loc.findIndex(l => !l.open); c.classList.toggle('on', (nx >= 0 && S.coins >= openCost(nx)) || S.loc.some((l, i) => l.open && !l.mgr && i !== S.cur && l.reg >= regCap(i) * .999)); }
}
/* ---------- away time ---------- */
function offlineCredit(sec, popup){
  sec = Math.min(sec, CONFIG.OFFLINE_MAX_H * 3600);
  const end = now(), start = end - sec * 1000;
  const adOver = Math.max(0, Math.min(S.ad2x, end) - start) / 1000, adF = (sec + adOver) / sec;
  let banked = 0, inReg = 0, cars = 0;
  S.loc.forEach((l, i) => {
    if(!l.open) return;
    const e = rate(i, false) * adF * sec;
    cars += l.bays * sec / washTime(i, false);
    if(l.mgr) banked += e;
    else { const add = Math.max(0, Math.min(regCap(i) - l.reg, e)); l.reg += add; inReg += add; }
  });
  addCoins(banked); S.cars += Math.floor(cars);
  if(popup && banked + inReg > 0){
    let body = '🪙 ' + fmt(banked) + '<div class="muted" style="font-size:13px;font-weight:400">' + t('banked by your managers', 'encaissé par tes gérants') + '</div>';
    if(inReg > 0) body += '<div style="font-size:16px;margin-top:6px">🧾 +' + fmt(inReg) + '</div><div class="muted" style="font-size:13px;font-weight:400">' + t('waiting in cash registers (managers collect it for you)', 'en attente dans les caisses (les gérants l’encaissent pour toi)') + '</div>';
    setTimeout(() => showReward('🌙', t('While you were away', 'Pendant ton absence') + ' (' + fmtTime(sec) + ')', body, banked > 0 ? {
      label: t('Watch ad: double it', 'Pub : double-le'),
      go: async () => { if(await rewardAd()){ addCoins(banked); toast('🪙 +' + fmt(banked), 'gold'); save(); } }
    } : null), 300);
  }
  save();
}
function goBackground(){ if(!S) return; save(); clearInterval(tickIv); tickIv = null; try{ if(AC && AC.state === 'running') AC.suspend(); }catch(e){} }
function goForeground(){
  if(!S || tickIv) return;
  const away = (now() - S.lastSeen) / 1000;
  lastTick = now();
  if(away > 5) offlineCredit(away, away > 60);
  tickIv = setInterval(tick, CONFIG.TICK_MS);
  if(tab === 'wash') buildScene(); else renderPanel();
}
function applySettings(){
  document.body.classList.toggle('saver', !!S.saver);
  document.body.classList.toggle('easy', !!S.easy);
  document.body.classList.toggle('gold', !!(S.pack && S.gold));
  document.documentElement.lang = S.lang;
  $('boostBtn').textContent = (S.pack ? '✨' : '📺') + ' x2';
}
function boot(){
  $('loadCar').innerHTML = carSVG('sports');
  let p = 0; const iv = setInterval(() => { p = Math.min(100, p + rnd(15, 30)); $('loadBar').style.width = p + '%'; }, 120);
  setTimeout(() => {
    clearInterval(iv);
    const saved = load();
    S = saved || fresh();
    dispCoins = S.coins;
    applySettings(); ensureQuests(); renderNav(); showTab('wash');
    if(saved){ const away = (now() - S.lastSeen) / 1000; if(away > 5) offlineCredit(away, away > 60); }
    else save();
    lastTick = now();
    tickIv = setInterval(tick, CONFIG.TICK_MS); secondly();
    $('load').style.opacity = 0; setTimeout(() => $('load').remove(), 500);
    adsInit();
  }, 900);
  // scene taps (pointerdown = instant, good for fast scrubbing)
  $('scene').addEventListener('pointerdown', e => {
    if(!S) return;
    const bay = e.target.closest('.bay[data-b]'); if(bay){ scrub(+bay.dataset.b); return; }
    if(e.target.closest('#bayBuy')){ buyBay(); return; }
    if(e.target.closest('#reg')){ collectReg(S.cur); drawScene(); return; }
    if(e.target.closest('.spark')){ catchSpark(); return; }
    const opens = S.loc.map((x, k) => x.open ? k : -1).filter(k => k >= 0), at = opens.indexOf(S.cur);
    if(e.target.closest('#locPrev') && at > 0){ S.cur = opens[at - 1]; sfx('tap'); buildScene(); renderWash(); coach(); }
    if(e.target.closest('#locNext') && at < opens.length - 1){ S.cur = opens[at + 1]; sfx('tap'); buildScene(); renderWash(); coach(); }
  });
  $('mClose').onclick = closeModal;
  $('modalBg').addEventListener('pointerdown', e => { if(e.target === $('modalBg')) closeModal(); });
  $('boostBtn').onclick = () => { sfx('tap'); openBoosts(); };
  $('gemPill').onclick = () => { sfx('tap'); showTab('more'); };
  document.addEventListener('visibilitychange', () => { if(document.hidden) goBackground(); else goForeground(); });
  document.addEventListener('pause', goBackground, false);
  document.addEventListener('resume', goForeground, false);
  window.addEventListener('pagehide', save);
}
boot();
</script>
