/* =====================================================================
   12. MAIN LOOP — game ticks, away time, tutorial, start-up
   tick(): once a second — moods, coins, babies, guests, timers
   frame(): every screen frame — capybaras walk
===================================================================== */
function stepWorld(dt, t, offline){
  const rate = MOOD_RATE();
  let earned = 0;
  S.capys.forEach(x => {
    const fav = inFavPool(x) ? 0.6 : 1;
    x.m.food = Math.max(0, x.m.food - rate * dt * (x.t === 'snacky' ? 1.5 : 1) * (x.t === 'sleepy' ? 0.8 : 1));
    x.m.calm = Math.max(0, x.m.calm - rate * dt * fav * (x.t === 'sleepy' ? 0.6 : 1) * (x.t === 'grumpy' ? 1.2 : 1));
    if(!isAdult(x)){
      x.grow += dt * (0.5 + moodAvg(x) / 100) * (CONFIG.GROW_SEC / babyTime());
      if(isAdult(x)){
        x.grow = CONFIG.GROW_SEC; assignPool(x);
        if(!offline){ toast('🌟 ' + esc(x.n) + ' ' + tr('is all grown up!'), 'gold'); addXP(10); const a = actors[x.id]; if(a){ a.follow = false; a.key = ''; a.until = 0; } }
      }
    }
    if(x.stack && x.stack.length && (x.stackT || 0) <= t){
      x.stack = []; addFriend(x, 2);
      if(!offline && x.a === S.cur && curView === 'Spa'){ fxAtCapy(x, '😋'); toast('😋 ' + esc(x.n) + ' ' + tr('ate the fruit stack! Yum!')); const a = actors[x.id]; if(a) a.key = ''; }
    }
    earned += capyRate(x, t) * dt;
  });
  addCo(earned);
  return {earned};
}
let tickN = 0;
function tick(){
  const t = now();
  stepWorld(1, t);
  S.stats.play++; tickN++;
  // tickets
  while(S.tickets < CONFIG.TICKETS_MAX && t - S.tkT >= CONFIG.TICKET_MIN * 60000){ S.tickets++; S.tkT += CONFIG.TICKET_MIN * 60000; }
  if(S.tickets >= CONFIG.TICKETS_MAX) S.tkT = t;
  // guests
  if(S.guest && t > S.guest.until){ S.guest = null; S.guestAt = t + rnd(...CONFIG.GUEST_MIN) * 60000; if(curView === 'Spa') renderSpa(); }
  if(S.tut >= 99 && !S.guest){
    if(S.daily.last === dayNum(t) && S.dvDay !== dayNum(t)){ S.dvDay = dayNum(t); spawnGuest('daily'); }
    else if(t > S.guestAt) spawnGuest('random');
  }
  // babies
  if(S.tut >= 99 && t > S.babyAt){ tryBaby(); S.babyAt = t + rnd(...CONFIG.BABY_MIN) * 60000; }
  if(tickN % 10 === 0) saveNow();
  // screen updates
  refreshTop();
  if(curView === 'Spa' && !G){
    if(tickN % 3 === 0){ renderCapys(); renderCare(); renderSide(); applyDark(); }
    if(tickN % 2 === 0) steamPuffs();
    if(tickN % 4 === 0){ const list = capysIn(S.cur).filter(isAdult); if(list.length){ const x = pick(list); fxAtCapy(x, '+' + fmt(capyRate(x) * 4) + ' ' + CN); } }
    if(tickN % 7 === 0 && S.snd && Math.random() < 0.5) bloop(rnd(0.8, 1.2));
  }
  if(curView === 'Games' && tickN % 5 === 0 && !$('modalBg').classList.contains('on')) renderGames();
}
let lastFrame = performance.now();
function frame(ts){
  const dt = Math.min(0.1, (ts - lastFrame) / 1000); lastFrame = ts;
  if(S && curView === 'Spa' && !G) stepActors(dt);
  if(S) tickCoinDisplay();
  requestAnimationFrame(frame);
}

/* ---------- away time (coins while the app is closed) ---------- */
function catchUp(){
  const t = now(), away = (t - (S.lastSeen || t)) / 1000;
  if(away < 60) return;
  const capped = Math.min(away, offlineCapH() * 3600);
  let earned = 0, sim = S.lastSeen;
  const steps = Math.floor(capped / 60);
  for(let i=0;i<steps;i++){ sim += 60000; earned += stepWorld(60, sim, true).earned; }
  // after the limit: no more coins, but moods still go down and babies still grow
  const rest = away - steps * 60, rate = MOOD_RATE();
  S.capys.forEach(x => { x.m.food = Math.max(0, x.m.food - rate * rest); x.m.calm = Math.max(0, x.m.calm - rate * rest * 0.8); if(!isAdult(x)){ x.grow = Math.min(CONFIG.GROW_SEC, x.grow + rest * 0.5); if(isAdult(x)) assignPool(x); } if(x.stack && x.stackT <= t) x.stack = []; });
  while(S.tickets < CONFIG.TICKETS_MAX && t - S.tkT >= CONFIG.TICKET_MIN * 60000){ S.tickets++; S.tkT += CONFIG.TICKET_MIN * 60000; }
  S.lastSeen = t;
  if(earned >= 1){
    S.awayLast = Math.round(earned);
    const capTxt = away > capped ? '<p class="muted">' + tr('Coins stop after {h}h away. Coin jars in Build keep them coming longer.', {h: offlineCapH()}) + '</p>' : '';
    queueModal(() => {
      openModal('🌅 ' + tr('Welcome back!'), '<div class="reward"><div class="big">' + capySVG('classic', {size: 150, towel: true}) + '</div><p>' + tr('You were away for {t}.', {t: fmtTime(away)}) + '</p><p>' + tr('Your capybaras relaxed and made') + '</p><div class="amt">+' + fmt(S.awayLast) + ' ' + CN + '</div>' + capTxt + '</div>' +
        '<button class="btn wide gold" id="wbX2">' + adIcon() + ' ' + tr('Double it!') + ' +' + fmt(S.awayLast) + ' ' + CN + '</button><button class="btn wide ghost" id="wbOk">' + tr('Collect') + '</button>');
      $('wbOk').onclick = closeModal;
      $('wbX2').onclick = async () => { closeModal(); if(await rewardAd()){ addCo(S.awayLast); toast('+' + fmt(S.awayLast) + ' ' + CN, 'gold'); S.awayLast = 0; saveNow(); } };
    });
  }
  saveNow();
}
