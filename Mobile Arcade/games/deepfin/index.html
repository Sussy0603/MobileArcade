<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E5">
<title>Deep Fin</title>
<!--
════════════════════════════════════════════════════════════════════════
  DEEP FIN · v2.0.0 (app) · one self-contained file
  Grown from Flappy Fish (MOS Arcade).
  Tap to swim up, gravity does the rest. Slip through the kelp gaps
  without touching.
════════════════════════════════════════════════════════════════════════

  One thumb, one rule, instant restart. Tap to start, tap to play again.
  Keyboard: Space / Enter act as a tap, Esc pauses.

  Storage: two localStorage keys
    stws-flappy-fish-v1   {sound, best, plays}
    mosArcadeTheme        shared with the Arcade page, same values

  DESIGN
  ──────
  Dressed to match MOS's Arcade listing page (V12/mos-server/arcade):
  daylight paper, 3px ink borders, hard offset shadows, Nunito, and the
  same light/dark tokens behind the same theme toggle — so opening a game
  from that page is not a change of product. The theme key is shared, so
  a visitor who picked dark there arrives here already dark.

  The screen inside the cabinet stays dark in both themes on purpose.
  Every one of these games draws light-on-dark — milk-white needles,
  star fields, translucent white strokes — and would be invisible on
  paper. A dark screen set into a paper cabinet is also exactly how the
  Arcade's own cards already show them.

  So the two palettes have one job each: the pastel tint is the chrome
  (marquee, badge, pills), the game's neon accent is only ever used on
  the dark screen (confetti on a new best). They never meet.
════════════════════════════════════════════════════════════════════════
-->
<script>
// Applied before first paint so a returning visitor's saved choice doesn't
// flash the wrong theme. Nothing stored = follow the OS, handled in CSS by
// the prefers-color-scheme block below. Same key as the Arcade page, which
// is the point: one choice covers the listing and every game on it.
(function(){
  try{
    var saved = localStorage.getItem('mosArcadeTheme');
    if(saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
  // In the Android app the page draws under the phone's status bar.
  if (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform())
    document.documentElement.classList.add('native');
})();
</script>
<style>
/* ---------------- Theme tokens ----------------
   Lifted from the Arcade page so the two stay in step. Every colour is
   declared twice, once for daylight and once for night, and the rest of
   the sheet only ever names tokens. */
:root{
  color-scheme:light;
  --sky-a:#FFF6E5; --sky-b:#E4F3FF;
  --paper:#FFFFFF;
  --ink:#2A2140; --ink-soft:#6B6188;
  --line:#2A2140;
  --shadow:#2A2140;
  --title-shadow:3px 4px 0 #D9E9FF, 6px 8px 0 rgba(42,33,64,.10);
  --emoji-shadow:0 3px 0 rgba(42,33,64,.18);
  --gloss:rgba(255,255,255,.35);
  --blob-a:#FFD9E8; --blob-b:#D6F3E0; --blob-c:#FFEFC2;
  --blob-opacity:.5;
  /* This game's one pastel, picked from the Arcade's eight card tints. */
  --tint:#D9E9FF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --sky-a:#241C40; --sky-b:#131A2E;
    --paper:#2A2348;
    --ink:#F6F1FF; --ink-soft:#ABA0CF;
    --line:#EFE6FF;
    --shadow:#0B0818;
    --title-shadow:3px 4px 0 #23405F, 6px 8px 0 rgba(0,0,0,.35);
    --emoji-shadow:0 3px 0 rgba(0,0,0,.45);
    --gloss:rgba(255,255,255,.08);
    --blob-a:#4A2740; --blob-b:#22473A; --blob-c:#4A3A1C;
    --blob-opacity:.65;
    --tint:#23405F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --sky-a:#241C40; --sky-b:#131A2E;
  --paper:#2A2348;
  --ink:#F6F1FF; --ink-soft:#ABA0CF;
  --line:#EFE6FF;
  --shadow:#0B0818;
  --title-shadow:3px 4px 0 #23405F, 6px 8px 0 rgba(0,0,0,.35);
  --emoji-shadow:0 3px 0 rgba(0,0,0,.45);
  --gloss:rgba(255,255,255,.08);
  --blob-a:#4A2740; --blob-b:#22473A; --blob-c:#4A3A1C;
  --blob-opacity:.65;
  --tint:#23405F;
}
/* The one surface that does not flip. See the note in the header. */
:root{ --screen:#0B0B14; }

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"Nunito","Quicksand",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(170deg,var(--sky-a) 0%,var(--sky-b) 100%);
  background-attachment:fixed;
  color:var(--ink);
  overflow:hidden;position:relative;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  user-select:none;-webkit-user-select:none;
}
/* Soft floating shapes in the background — pure decoration. */
.blob{position:fixed;border-radius:50%;filter:blur(2px);opacity:var(--blob-opacity);pointer-events:none;z-index:0;}
.blob.a{width:280px;height:280px;background:var(--blob-a);top:-70px;left:-60px;}
.blob.b{width:220px;height:220px;background:var(--blob-b);bottom:8%;right:-70px;}
.blob.c{width:150px;height:150px;background:var(--blob-c);top:38%;left:4%;}

/* ---------------- Theme toggle ---------------- */
.theme-btn{
  position:fixed;top:16px;right:16px;z-index:6;
  font:inherit;font-size:13px;font-weight:900;letter-spacing:.04em;
  color:var(--ink);background:var(--paper);
  border:3px solid var(--line);border-radius:999px;
  padding:8px 15px;cursor:pointer;
  box-shadow:3px 3px 0 var(--shadow);
  display:flex;align-items:center;gap:6px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.theme-btn:hover{transform:translate(-1px,-2px);box-shadow:5px 5px 0 var(--shadow);}
.theme-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow);}
.theme-btn:focus-visible{outline:3px solid var(--line);outline-offset:3px;}

/* ---------------- Page frame ---------------- */
.wrap{
  position:relative;z-index:1;
  height:100dvh;max-width:560px;margin:0 auto;
  display:flex;flex-direction:column;gap:14px;
  padding:calc(16px + env(safe-area-inset-top)) 5vmin calc(12px + env(safe-area-inset-bottom));
}
header{text-align:center;flex:0 0 auto;padding-top:6px;}
/* Paper, not tinted — same as the Arcade page's badge. The tint has one
   home on this page, the marquee, exactly as it has one home on a listing
   card. */
.badge{
  display:inline-block;margin-bottom:12px;
  background:var(--paper);border:3px solid var(--line);border-radius:999px;
  padding:7px 18px;font-size:12.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
  box-shadow:3px 3px 0 var(--shadow);
  transform:rotate(-2deg);
}
h1{
  margin:0;
  font-size:clamp(28px,7vmin,46px);font-weight:900;letter-spacing:-.02em;line-height:1.05;
  color:var(--ink);text-shadow:var(--title-shadow);
}
header p{
  margin:11px auto 0;max-width:38ch;
  font-size:clamp(13.5px,2.1vmin,16px);line-height:1.45;font-weight:700;color:var(--ink-soft);
}

/* ---------------- The cabinet ----------------
   One card, same construction as an Arcade listing card: tinted top strip
   with a soft highlight arc, 3px rule under it, and the picture below —
   except here the picture is the live game. */
.cabinet{
  flex:1 1 auto;min-height:0;
  background:var(--paper);
  border:3px solid var(--line);border-radius:24px;
  box-shadow:6px 7px 0 var(--shadow);
  overflow:hidden;
  display:flex;flex-direction:column;
}
.marquee{
  flex:0 0 auto;position:relative;overflow:hidden;
  background:var(--tint);
  border-bottom:3px solid var(--line);
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;
}
.marquee::after{ /* soft highlight arc */
  content:'';position:absolute;left:-20%;right:-20%;top:-70%;height:120%;
  background:var(--gloss);border-radius:50%;pointer-events:none;
}
.marquee > *{position:relative;z-index:1;}
.mico{font-size:26px;line-height:1;filter:drop-shadow(var(--emoji-shadow));}
.counts{display:flex;flex-direction:column;line-height:1;}
#hudScore{
  font-size:27px;font-weight:900;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
#hudScore.pop{animation:pop .28s ease;}
@keyframes pop{40%{transform:scale(1.2);}}
#hudBest{
  margin-top:3px;font-size:10.5px;font-weight:900;letter-spacing:.14em;
  color:var(--ink-soft);font-variant-numeric:tabular-nums;
}
.grow{flex:1;}
.iconbtn{
  width:38px;height:38px;flex:0 0 auto;
  font:inherit;font-size:15px;
  color:var(--ink);background:var(--paper);
  border:3px solid var(--line);border-radius:999px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:2px 3px 0 var(--shadow);
  transition:transform .12s ease, box-shadow .12s ease;
}
.iconbtn:hover{transform:translate(-1px,-2px);box-shadow:4px 5px 0 var(--shadow);}
.iconbtn:active{transform:translate(2px,3px);box-shadow:0 0 0 var(--shadow);}
.iconbtn:focus-visible{outline:3px solid var(--line);outline-offset:3px;}

/* The screen. Dark in both themes — see the header note. */
#stage{position:relative;flex:1 1 auto;min-height:0;background:var(--screen);touch-action:none;}
#cv{position:absolute;inset:0;display:block;touch-action:none;}

/* ---------------- Overlays ----------------
   A paper card floating on the dark screen. Only the button takes
   pointer events, so a tap anywhere else still falls through to the
   canvas and the game stays a one-thumb game. */
#ovl{
  position:absolute;inset:0;z-index:2;
  display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(11,11,20,.55);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  pointer-events:none;
}
#ovl[hidden]{display:none;}
.ovcard{
  width:100%;max-width:300px;text-align:center;
  background:var(--paper);border:3px solid var(--line);border-radius:24px;
  box-shadow:6px 7px 0 var(--shadow);
  padding:22px 20px;
  animation:rise .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;}}
.big-ico{
  width:76px;height:76px;margin:0 auto 12px;
  background:var(--tint);border:3px solid var(--line);border-radius:22px;
  display:flex;align-items:center;justify-content:center;font-size:38px;
  box-shadow:3px 4px 0 var(--shadow);
  filter:none;
}
.ovcard h2{margin:0;font-size:23px;font-weight:900;letter-spacing:-.01em;}
.ovcard .tip{margin:9px 0 0;font-size:13px;line-height:1.5;font-weight:700;color:var(--ink-soft);}
.go-label{
  font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);
}
.go-score{
  font-size:66px;font-weight:900;line-height:1.05;margin-top:2px;
  color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.03em;
}
.go-best{
  margin-top:4px;font-size:11.5px;font-weight:900;letter-spacing:.14em;
  color:var(--ink-soft);font-variant-numeric:tabular-nums;
}
.new-best{
  display:inline-block;margin-top:9px;padding:5px 14px;
  /* The one colour that never flips, same rule as the Arcade's play
     button: dark ink on arcade yellow reads the same day or night. */
  background:#FFD23D;color:#2A2140;
  border:3px solid var(--line);border-radius:999px;
  font-size:11px;font-weight:900;letter-spacing:.14em;
  box-shadow:2px 3px 0 var(--shadow);
  animation:pop .4s ease;
}
.play-btn{
  pointer-events:auto;
  display:block;width:100%;margin-top:17px;
  font:inherit;font-size:14.5px;font-weight:900;letter-spacing:.03em;
  background:#FFD23D;color:#2A2140;
  border:3px solid var(--line);border-radius:999px;
  padding:10px 16px;cursor:pointer;
  box-shadow:0 4px 0 var(--shadow);
  transition:transform .12s ease, box-shadow .12s ease, background-color .12s ease;
}
.play-btn:hover{background:#FFE27A;}
.play-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow);}
.play-btn:focus-visible{outline:3px solid var(--line);outline-offset:3px;}
.hint{margin-top:9px;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--ink-soft);opacity:.8;}

footer{
  flex:0 0 auto;text-align:center;
  font-size:12px;font-weight:800;color:var(--ink-soft);opacity:.75;
}

/* On a phone the centred badge and the fixed corner toggle grow into each
   other. The toggle drops its word rather than the page growing a 50px
   dead strip above the game — the emoji still says which way it goes, and
   the aria-label still says it in words. */
@media (max-width:459px){
  .theme-btn{padding:8px 11px;}
  #themeLabel{display:none;}
}

/* Landscape and short screens: the game keeps the room, the words give it
   up. Everything hidden here is decoration or a label repeated inside the
   cabinet — the title stays, because a page still has to say what it is. */
@media (max-height:620px){
  .badge,header p,footer{display:none;}
  .wrap{
    gap:8px;
    padding-top:calc(8px + env(safe-area-inset-top));
    padding-bottom:calc(8px + env(safe-area-inset-bottom));
  }
  header{padding-top:0;}
  h1{font-size:clamp(20px,4.6vmin,28px);}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;}
  .ovcard,.new-best,#hudScore.pop{animation:none;}
}
/* ---------------- App + money ---------------- */
:root{ --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px); }
html.native{
  --safe-top:max(env(safe-area-inset-top,0px),36px);
  --safe-bottom:max(env(safe-area-inset-bottom,0px),16px);
}
html.native .wrap{
  padding-top:calc(10px + var(--safe-top));
  padding-bottom:calc(10px + var(--safe-bottom));
  gap:10px;
}
html.native .theme-btn{top:calc(8px + var(--safe-top));}
html.native .badge, html.native header p, html.native footer{display:none;}
html.native h1{font-size:clamp(24px,6vmin,34px);}
.ovcard button, .skins button{pointer-events:auto;}
.ad-btn{
  display:block;width:100%;margin-top:14px;
  font:inherit;font-size:14.5px;font-weight:900;letter-spacing:.03em;
  background:var(--tint);color:var(--ink);
  border:3px solid var(--line);border-radius:999px;
  padding:10px 16px;cursor:pointer;
  box-shadow:0 4px 0 var(--shadow);
}
.ad-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow);}
.ad-note{margin-top:6px;font-size:11px;font-weight:800;color:var(--ink-soft);}
.link-btn{
  margin-top:12px;background:none;border:none;font:inherit;
  font-size:12.5px;font-weight:900;color:var(--ink-soft);
  text-decoration:underline;cursor:pointer;
}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px;}
.skin{
  position:relative;aspect-ratio:1;
  background:#0B0B14;border:3px solid var(--line);border-radius:16px;
  cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;
  box-shadow:2px 3px 0 var(--shadow);
}
.skin canvas{width:70%;height:70%;}
.skin.on{outline:3px solid #FFD23D;outline-offset:2px;}
.skin .lk{
  position:absolute;right:4px;bottom:3px;font-size:13px;
}
.skin.locked canvas{opacity:.45;}
.skin-name{margin-top:10px;font-size:13px;font-weight:900;min-height:1.2em;}
.ad-count{font-size:56px;font-weight:900;margin:8px 0 2px;}
.toast{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:3;max-width:90%;
  background:var(--paper);color:var(--ink);
  border:3px solid var(--line);border-radius:999px;
  padding:8px 16px;font-size:13px;font-weight:900;text-align:center;
  box-shadow:3px 3px 0 var(--shadow);
  pointer-events:none;
  opacity:0;transition:opacity .2s ease;
}
.toast.show{opacity:1;}

#hudSchool{margin-left:6px;font-size:15px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;}
#hudSchool.pop{animation:pop .28s ease;}
.btn-row{display:flex;gap:8px;}
.daily-btn{
  display:block;width:100%;margin-top:10px;
  font:inherit;font-size:14px;font-weight:900;
  background:var(--paper);color:var(--ink);
  border:3px solid var(--line);border-radius:999px;
  padding:9px 14px;cursor:pointer;box-shadow:0 4px 0 var(--shadow);
  pointer-events:auto;
}
.daily-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow);}
.streak{margin-top:8px;font-size:12px;font-weight:900;letter-spacing:.06em;color:var(--ink-soft);}
.boost-on{margin-top:12px;font-size:13px;font-weight:900;color:var(--ink);}
.feat{margin:10px 0 0;padding:0;list-style:none;text-align:left;font-size:12.5px;font-weight:800;line-height:1.5;color:var(--ink-soft);}
.feat li{margin:3px 0;}
.ovcard{max-height:100%;overflow-y:auto;}
@media (max-height:760px){
  .ovcard{padding:16px 18px;}
  .big-ico{width:54px;height:54px;font-size:28px;margin-bottom:8px;border-radius:16px;}
  .ovcard h2{font-size:20px;}
  .feat{font-size:12px;}
  .play-btn{margin-top:12px;}
}
</style>
</head>
<body>

<span class="blob a"></span><span class="blob b"></span><span class="blob c"></span>

<button id="themeBtn" class="theme-btn" type="button"><span id="themeIcon">🌙</span><span id="themeLabel">Dark</span></button>

<div class="wrap">

  <header>
    <span class="badge">🐟 Arcade game</span>
    <h1>Deep Fin</h1>
    <p>Tap to swim. Gather a school of fish, then dive from the sunny reef down to the dark abyss.</p>
  </header>

  <main class="cabinet">
    <div class="marquee">
      <span class="mico">🐟</span>
      <div class="counts">
        <span id="hudScore">0</span>
        <span id="hudBest">BEST 0</span>
      </div>
      <span id="hudSchool" aria-label="Fish in your school">🐠 0</span>
      <span class="grow"></span>
      <button class="iconbtn" id="btnPause" type="button" aria-label="Pause">⏸</button>
      <button class="iconbtn" id="btnSnd" type="button" aria-label="Toggle sound">🔊</button>
    </div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="ovl" hidden></div>
      <div id="toast" class="toast"></div>
    </div>
  </main>

  <footer>Part of MOS 💛</footer>

</div>

<script>
(() => {
'use strict';

/* ══ tiny helpers ══════════════════════════════════════ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const $ = s => document.querySelector(s);
const FONT = '"Nunito","Quicksand",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

/* Seeded random, so the Daily Dive is the same ocean for everybody. */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const yesterdayKey = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); };

/* Hex colour mixing for the zone changes. */
const hx = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mix = (a, b, t) => { const A = hx(a), B = hx(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',') + ')'; };
const mix3 = (arr, d) => d <= 1 ? mix(arr[0], arr[1], d) : mix(arr[1], arr[2], d - 1);

const GAME = {
  id: 'deepfin',
  title: 'Deep Fin',
  icon: '🐟',
  accent: '#38B6FF',
  tip: 'Tap to swim up. Slip through the kelp gaps.',
  fwd: true
};

/* The three zones. `at` = gates passed to reach it. */
const ZONES = [
  { at: 0,  name: 'Sunny Reef',    sub: 'Collect gold fish for your school' },
  { at: 12, name: 'Twilight Zone', sub: 'Careful — the kelp sways!' },
  { at: 28, name: 'The Abyss',     sub: 'Your lamp lights the way' }
];
const MAX_SCHOOL = 9;

/* ══ theme ═════════════════════════════════════════════ */
const THEME_KEY = 'mosArcadeTheme';
const themeBtn = $('#themeBtn'), themeIcon = $('#themeIcon'), themeLabel = $('#themeLabel');
const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
const storedTheme = () => { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } };
const activeTheme = () => document.documentElement.getAttribute('data-theme') || (systemDark.matches ? 'dark' : 'light');
function syncTheme() {
  const goingTo = activeTheme() === 'dark' ? 'light' : 'dark';
  themeIcon.textContent = goingTo === 'dark' ? '🌙' : '☀️';
  themeLabel.textContent = goingTo === 'dark' ? 'Dark' : 'Light';
  themeBtn.setAttribute('aria-label', 'Switch to ' + goingTo + ' mode');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', activeTheme() === 'dark' ? '#241C40' : '#FFF6E5');
}
themeBtn.addEventListener('click', e => {
  unfocus(e);

/* ══ storage ═══════════════════════════════════════════ */
const QS = new URLSearchParams(location.search);
const STORE_KEY = 'deepfin-v1' + (QS.get('prefix') ? ':' + QS.get('prefix') : '');
const DEF = { sound: true, best: 0, plays: 0, deepest: 0, dailyDay: '', dailyBest: 0, streak: 0, lastDaily: '' };
const DATA = (() => {
  try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); }
  catch (e) { return Object.assign({}, DEF); }
})();
if (QS.get('mute') === '1') DATA.sound = false;
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); } catch (e) {} };
// A streak only counts if yesterday was played too.
function liveStreak() {
  return (DATA.lastDaily === dayKey() || DATA.lastDaily === yesterdayKey()) ? DATA.streak : 0;
}
const todayDailyBest = () => DATA.dailyDay === dayKey() ? DATA.dailyBest : 0;

/* ══ audio: tiny Web Audio synth, no assets ════════════ */
const AU = {
  ctx: null,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d, type = 'sine', g = 0.16, slide = 0, at = 0) {
    if (!DATA.sound || !this.ctx) return;
    const t = this.ctx.currentTime + at;
    const o = this.ctx.createOscillator(), ga = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    ga.gain.setValueAtTime(g, t);
    ga.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(ga).connect(this.ctx.destination);
    o.start(t); o.stop(t + d + 0.02);
  },
  noise(d = 0.2, g = 0.22, fq = 900) {
    if (!DATA.sound || !this.ctx) return;
    const t = this.ctx.currentTime, n = Math.floor(this.ctx.sampleRate * d);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fq;
    const ga = this.ctx.createGain(); ga.gain.value = g;
    src.connect(f).connect(ga).connect(this.ctx.destination);
    src.start(t);
  },
  play(name, p = 1) {
    switch (name) {
      case 'ui':     this.tone(520, 0.07, 'triangle', 0.10); break;
      case 'ok':     this.tone(540 * p, 0.09, 'triangle', 0.15); this.tone(810 * p, 0.11, 'triangle', 0.11, 0, 0.055); break;
      case 'fail':   this.tone(300, 0.38, 'sawtooth', 0.14, -210); this.noise(0.22, 0.12, 500); break;
      case 'flap':   this.tone(430, 0.08, 'sine', 0.13, 190); break;
      case 'buddy':  this.tone(880, 0.07, 'triangle', 0.13); this.tone(1175, 0.10, 'triangle', 0.11, 0, 0.06); break;
      case 'lose':   this.tone(420, 0.18, 'square', 0.10, -200); this.noise(0.10, 0.10, 1200); break;
      case 'level':  [440, 550, 660, 880].forEach((f, i) => this.tone(f, 0.10, 'triangle', 0.13, 0, i * 0.07)); break;
      case 'best':   [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, 0.12, 'triangle', 0.14, 0, i * 0.085)); break;
    }
  }
};

/* ══ canvas ════════════════════════════════════════════ */
const cv = $('#cv'), g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const stageEl = $('#stage'), ovl = $('#ovl'),
      hudScore = $('#hudScore'), hudBest = $('#hudBest'), hudSchool = $('#hudSchool');

function resize() {
  const r = stageEl.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
}

if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

/* ══ the shell the game talks to ═══════════════════════ */
const S = {
  state: 'ready', game: null, score: 0, overAt: 0,
  mode: 'normal',       // 'normal' or 'daily'
  boost: 0,             // buddies earned from the start-boost ad
  revived: false, overCardUp: false,
  fx: { parts: [], shake: 0, texts: [] },

  snd(n, p) { AU.play(n, p); },
  shake(n) { this.fx.shake = Math.max(this.fx.shake, n); },
  burst(x, y, color, n = 12, sp = 220) {
    for (let i = 0; i < n; i++) {
      const a = rnd(TAU), s = rnd(sp * 0.3, sp);
      this.fx.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, g: 420, r: rnd(2, 4.5), c: color, life: rnd(0.4, 0.8) });
    }
  },
  floatText(x, y, txt, c = '#FFD23D') { this.fx.texts.push({ x, y, txt, c, life: 0.9 }); },

  addScore(n = 1) {
    this.score += n;
    hudScore.textContent = this.score;
    hudScore.classList.remove('pop'); void hudScore.offsetWidth; hudScore.classList.add('pop');
  },
  syncSchool(n) {
    hudSchool.textContent = '🐠 ' + n;
    hudSchool.classList.remove('pop'); void hudSchool.offsetWidth; hudSchool.classList.add('pop');
  },
  syncBest() {
    hudBest.textContent = this.mode === 'daily' ? 'DAILY ' + todayDailyBest() : 'BEST ' + DATA.best;
  },

  startRun(mode, p) {
    this.mode = mode;
    this.revived = false; this.overCardUp = false;
    this.score = 0; this.fx.parts.length = 0; this.fx.texts.length = 0; this.fx.shake = 0;
    hudScore.textContent = '0';
    this.syncBest();
    // The Daily Dive is the same for everyone, so no boosts there.
    const start = mode === 'normal' ? this.boost : 0;
    if (mode === 'normal') this.boost = 0;
    const seed = mode === 'daily' ? hashStr('deepfin:' + dayKey()) : (Math.random() * 4294967296) >>> 0;
    this.game.reset(seed, start);
    this.syncSchool(start);
    ovl.hidden = true;
    this.state = 'playing';
    if (GAME.fwd && p) this.game.press(p.x, p.y);
  },

  endGame() {
    if (this.state !== 'playing') return;
    this.state = 'over'; this.overAt = performance.now();
    // A second chance continues the same run, so nothing is saved yet.
    if (!this.revived && this.score > 0) {
      setTimeout(() => { if (this.state === 'over') showSecondChance(this.score); }, 380);
      return;
    }
    this.finishRun();
  },

  finishRun() {
    this.state = 'over'; this.overAt = performance.now();
    let nb = false;
    if (this.mode === 'daily') {
      const today = dayKey();
      if (DATA.dailyDay !== today) { DATA.dailyDay = today; DATA.dailyBest = 0; }
      if (DATA.lastDaily !== today) {
        DATA.streak = DATA.lastDaily === yesterdayKey() ? DATA.streak + 1 : 1;
        DATA.lastDaily = today;
      }
      nb = this.score > DATA.dailyBest;
      if (nb) DATA.dailyBest = this.score;
    } else {
      nb = this.score > DATA.best;
      if (nb) DATA.best = this.score;
    }
    DATA.deepest = Math.max(DATA.deepest, this.game.zone);
    DATA.plays++; save();
    this.syncBest();
    if (nb && this.score > 0) {
      AU.play('best');
      const cols = [GAME.accent, '#FFFFFF', '#FFD23D'];
      for (let i = 0; i < 3; i++) this.burst(rnd(W * 0.2, W * 0.8), rnd(H * 0.2, H * 0.5), cols[i % 3], 14, 280);
    }
    setTimeout(() => { if (this.state === 'over') showOver(this.score, nb); }, this.revived === 'declined' ? 0 : 380);
  },

  revive() {
    this.revived = true;
    this.game.revive();
    this.state = 'paused';
    card(
      '<div class="go-label">Second chance</div>' +
      '<h2>You\'re back! 🐟</h2>' +
      '<p class="tip">The kelp in front of you is cleared and you are safe for a moment. Tap when you are ready.</p>' +
      '<button class="play-btn" type="button" data-act="go">Keep going ▶</button>'
    );
  },

  pause() {
    if (this.state !== 'playing') return;
    this.state = 'paused';
    showPaused();
  }
};

/* ══ overlays ══════════════════════════════════════════ */
const card = html => { ovl.innerHTML = '<div class="ovcard">' + html + '</div>'; ovl.hidden = false; };
function showReady() {
  S.state = 'ready';
  const st = liveStreak(), doneToday = DATA.lastDaily === dayKey();
  card(
    '<div class="big-ico">' + GAME.icon + '</div>' +
    '<h2>' + GAME.title + '</h2>' +
    '<p class="tip">' + GAME.tip + '</p>' +
    '<ul class="feat">' +
      '<li>🐠 Grab gold fish. They follow you and save you from one hit each.</li>' +
      '<li>🌊 Dive deeper: reef, twilight, then the dark abyss.</li>' +
    '</ul>' +
    '<button class="play-btn" type="button" data-act="go">Play ▶</button>' +
    '<button class="daily-btn" type="button" data-act="daily">📅 Daily Dive' + (doneToday ? ' · best ' + todayDailyBest() : '') + '</button>' +
    '<div class="streak">' + (st > 0 ? '🔥 ' + st + ' day streak' : 'Play the Daily Dive each day for a streak') + '</div>' +
    (S.boost > 0
      ? '<div class="boost-on">✓ You start with ' + S.boost + ' fish</div>'
      : '<button class="ad-btn" type="button" data-act="boost">▶ Watch an ad: start with 3 fish</button>' +
        '<div class="ad-note">Optional</div>')

function showOver(score, nb) {
  S.overCardUp = true;
  const daily = S.mode === 'daily';
  const zoneName = ZONES[S.game.zone].name;
  card(
    '<div class="go-label">' + (daily ? 'Daily Dive' : 'Game over') + '</div>' +

        : '<div class="go-best">' + (daily ? 'TODAY\'S BEST ' + todayDailyBest() : 'BEST ' + DATA.best) + '</div>') +
    '<p class="tip">You reached: ' + zoneName + '</p>' +
    (daily ? '<div class="streak">🔥 ' + liveStreak() + ' day streak</div>' : '') +

function showSecondChance(score) {
  card(
    '<div class="go-label">So close!</div>' +
    '<div class="go-score">' + score + '</div>' +
    '<button class="ad-btn" type="button" data-act="revive">▶ Watch an ad to keep going</button>' +
    '<div class="ad-note">Optional · once per game</div>' +
    '<button class="link-btn" type="button" data-act="giveup">No thanks</button>'
  );
}
function showPaused() {
  card(
    '<div class="go-label">Paused</div>' +
    '<p class="tip">' + GAME.tip + '</p>' +
    '<button class="play-btn" type="button" data-act="go">Resume ▶</button>'
  );
}
const unfocus = e => { if (e.detail) e.currentTarget.blur(); };
ovl.addEventListener('click', async e => {
  const act = e.target.closest('[data-act]');
  if (!act) return;
  if (e.detail) act.blur();
  AU.ensure();
  const a = act.dataset.act;
  if (a === 'revive') {
    AU.play('ui');
    const ok = await showRewardedAd();
    if (ok && S.state === 'over') S.revive();
    return;
  }
  if (a === 'giveup') { AU.play('ui'); S.revived = 'declined'; S.finishRun(); return; }
  if (a === 'boost') {
    AU.play('ui');
    const ok = await showRewardedAd();
    if (ok) { S.boost = 3; AU.play('buddy'); toast('You start your next dive with 3 fish! 🐠'); }
    if (S.state === 'ready') showReady();
    return;
  }
  if (a === 'daily') { AU.play('ui'); S.startRun('daily', null); return; }
  if (a === 'menu') { AU.play('ui'); S.mode = 'normal'; S.syncBest(); showReady(); return; }
  if (a === 'go') doPress({ x: W / 2, y: H * 0.7 }, true);
});

/* ══ input ═════════════════════════════════════════════ */
const pt = e => {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
};
function doPress(p, fromBtn) {
  AU.ensure();
  if (S.state === 'ready') S.startRun('normal', fromBtn ? null : p);
  else if (S.state === 'playing') S.game.press(p.x, p.y);
  else if (S.state === 'over') {
    // Only the Game Over card restarts — the Second Chance card waits for a choice.
    if (S.overCardUp && performance.now() - S.overAt > 450) S.startRun(S.mode, fromBtn ? null : p);
  }
  else if (S.state === 'paused') { S.state = 'playing'; ovl.hidden = true; }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); doPress(pt(e)); }, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
    e.preventDefault(); doPress({ x: W / 2, y: H * 0.7 });
  }
  if (e.code === 'Escape' && S.state === 'playing') S.pause();
});
// Leaving the app pauses the game and silences it.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { S.pause(); if (AU.ctx && AU.ctx.state === 'running') AU.ctx.suspend(); }
});

/* ══ main loop ═════════════════════════════════════════ */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 0.033);
  if (!S.game) return;
  if (S.state === 'playing') S.game.update(dt);
  else S.game.idle(dt);
  g.clearRect(0, 0, W, H);
  g.save();
  if (S.fx.shake > 0.3) {
    g.translate(rnd(-S.fx.shake, S.fx.shake), rnd(-S.fx.shake, S.fx.shake));
    S.fx.shake *= 0.86;
  } else S.fx.shake = 0;
  S.game.draw(g, dt);
  const ps = S.fx.parts;
  for (let i = ps.length - 1; i >= 0; i--) {
    const p = ps[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt;
    if (p.life <= 0) { ps.splice(i, 1); continue; }
    g.globalAlpha = clamp(p.life * 2.2, 0, 1);
    g.fillStyle = p.c;
    g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill();
  }
  const ts = S.fx.texts;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '900 20px ' + FONT;
  for (let i = ts.length - 1; i >= 0; i--) {
    const t = ts[i];
    t.y -= 40 * dt; t.life -= dt;
    if (t.life <= 0) { ts.splice(i, 1); continue; }
    g.globalAlpha = clamp(t.life * 2, 0, 1);
    g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.6)'; g.strokeText(t.txt, t.x, t.y);
    g.fillStyle = t.c; g.fillText(t.txt, t.x, t.y);
  }
  g.globalAlpha = 1;
  g.restore();
}

/* ══════════════════════════════════════════════════════
   DEEP FIN
   • School of fish: gold fish in the gaps join you and follow
     in a line. A hit costs one fish instead of the game.
     Every 3 fish = +1 point per gate.
   • Zones: Sunny Reef → Twilight (gaps sway) → Abyss (dark,
     your lamp lights a circle, kelp edges glow).
   • Daily Dive: seeded layout, the same for everybody today.
   ══════════════════════════════════════════════════════ */
const SKY_TOP = ['#2E9BD0', '#2A2A6E', '#050812'];
const SKY_BOT = ['#0F4C78', '#110E33', '#010205'];
const KELP_A  = ['#1E7A52', '#24506B', '#0C2420'];
const KELP_B  = ['#2FA86B', '#3A7896', '#123A33'];
const SAND    = ['#C9A15E', '#5E5378', '#14121E'];

class DeepFin {
  constructor(S) { this.S = S; this.t = 0; this.reset(1, 0); }
  reset(seed, buddies) {
    this.R = mulberry32(seed);
    this.y = H * 0.45; this.vy = 0; this.cols = []; this.t = 0;
    this.speed = 150; this.dead = 0; this.bub = [];
    this.gates = 0; this.zone = 0; this.depth = 0; this.banner = null;
    this.school = []; this.hist = []; this.shield = 0;
    for (let i = 0; i < buddies; i++) this.school.push({ wig: rnd(TAU) });
  }
  fishX() { return W * 0.30; }
  press() {
    if (this.dead > 0) return;
    this.vy = -330;
    this.S.snd('flap');
    for (let i = 0; i < 3; i++) this.bub.push({ x: this.fishX() - 14, y: this.y + rnd(-6, 6), r: rnd(1.5, 3.5), vy: rnd(-70, -40), life: rnd(0.6, 1.2) });
  }
  revive() {
    this.dead = 0; this.y = H * 0.45; this.vy = 0;
    this.cols = this.cols.filter(c => c.x > this.fishX() + 160);
    this.shield = 2.2;
  }
  idle(dt) {
    // Keeps the water alive behind the menus.
    this.t += dt;
    if (this.S.state === 'ready') this.y = H * 0.45 + Math.sin(this.t * 2) * 10;
    for (const b of this.bub) { b.y += b.vy * dt; b.life -= dt; }
    this.bub = this.bub.filter(b => b.life > 0);
  }
  zoneFor(n) { let z = 0; ZONES.forEach((Z, i) => { if (n >= Z.at) z = i; }); return z; }
  update(dt) {
    this.t += dt;
    this.depth += (this.zone - this.depth) * Math.min(1, dt * 0.8);
    if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
    if (this.shield > 0) this.shield -= dt;
    if (this.dead > 0) {
      this.dead -= dt;
      this.vy += 900 * dt; this.y += this.vy * dt;
      if (this.dead <= 0) this.S.endGame();
      return;
    }
    this.vy = Math.min(520, this.vy + 980 * dt);
    this.y += this.vy * dt;
    this.hist.unshift(this.y);
    if (this.hist.length > 120) this.hist.length = 120;
    this.speed = Math.min(240, 150 + this.gates * 3);

    const R = this.R;
    const spacing = Math.max(200, W * 0.58);
    const lastC = this.cols[this.cols.length - 1];
    if (!lastC || lastC.x < W - spacing) {
      const z = this.zoneFor(this.gates + this.cols.filter(c => !c.passed).length);
      let gapH = Math.max(H * 0.25, H * 0.34 - this.gates * 0.004 * H);
      if (z === 2) gapH += H * 0.02;          // a little kinder in the dark
      const sway = z >= 1 ? H * (0.05 + R() * 0.05) : 0;
      const base = H * 0.24 + sway + R() * (H * 0.44 - sway * 2);
      const buddy = this.school.length < MAX_SCHOOL && R() < (z === 0 ? 0.5 : 0.35);
      this.cols.push({ x: W + 70, base, gapY: base, gapH, sway, ph: R() * TAU, sp: 1.2 + R() * 0.8,
                       w: 62, passed: false, seed: R() * TAU, buddy, got: false });
    }
    for (const c of this.cols) {
      c.x -= this.speed * dt;
      if (c.sway) c.gapY = c.base + Math.sin(this.t * c.sp + c.ph) * c.sway;
    }
    this.cols = this.cols.filter(c => c.x > -110);

    const fx = this.fishX(), r = 15;
    if (this.y < r) { this.y = r; this.vy = 0; }
    if (this.y > H - 26 - r) {
      this.y = H - 26 - r;
      if (this.shield > 0) this.vy = -300;
      else if (this.school.length) { this.loseBuddy(); this.vy = -380; }
      else return this.die();
    }
    for (const c of this.cols) {
      const topH = c.gapY - c.gapH / 2, botY = c.gapY + c.gapH / 2;
      if (this.shield <= 0 &&
          (this.hitRect(fx, this.y, r, c.x, 0, c.w, topH) ||
           this.hitRect(fx, this.y, r, c.x, botY, c.w, H - botY))) {
        if (this.school.length) { this.loseBuddy(); this.vy = -200; }
        else return this.die();
      }
      if (c.buddy && !c.got && Math.hypot(fx - (c.x + c.w / 2), this.y - c.gapY) < 26) {
        c.got = true;
        this.school.push({ wig: rnd(TAU) });
        this.S.snd('buddy');
        this.S.burst(c.x + c.w / 2, c.gapY, '#FFD23D', 10, 160);
        this.S.syncSchool(this.school.length);
      }
      if (!c.passed && c.x + c.w < fx) {
        c.passed = true;
        this.gates++;
        const pts = 1 + Math.floor(this.school.length / 3);
        this.S.addScore(pts);
        if (pts > 1) this.S.floatText(fx, this.y - 34, '+' + pts);
        this.S.snd('ok', 1 + Math.min(0.8, this.gates * 0.012));
        const z = this.zoneFor(this.gates);
        if (z > this.zone) {
          this.zone = z;
          this.banner = { name: ZONES[z].name, sub: ZONES[z].sub, t: 2.6 };
          this.S.snd('level');
        }
      }
    }
    for (const b of this.bub) { b.y += b.vy * dt; b.life -= dt; }
    this.bub = this.bub.filter(b => b.life > 0);
  }
  buddyPos(i) {
    const k = Math.min(this.hist.length - 1, (i + 1) * 6);
    const y = this.hist.length ? this.hist[Math.max(0, k)] : this.y;
    return { x: this.fishX() - 26 - i * 20, y: y + Math.sin(this.t * 5 + this.school[i].wig) * 3 };
  }
  loseBuddy() {
    const i = this.school.length - 1;
    const p = this.buddyPos(i);
    this.school.pop();
    this.shield = 1.2;
    this.S.snd('lose'); this.S.shake(5);
    this.S.burst(p.x, p.y, '#FFD23D', 12, 200);
    this.S.floatText(this.fishX(), this.y - 30, '-1 🐠', '#FFFFFF');
    this.S.syncSchool(this.school.length);
  }
  hitRect(cx, cy, cr, rx, ry, rw, rh) {
    const px = clamp(cx, rx, rx + rw), py = clamp(cy, ry, ry + rh);
    return (cx - px) * (cx - px) + (cy - py) * (cy - py) < cr * cr;
  }
  die() {
    if (this.dead > 0) return;
    this.S.snd('fail'); this.S.shake(9);
    this.S.burst(this.fishX(), this.y, '#38B6FF', 14, 220);
    this.S.burst(this.fishX(), this.y, '#FF9A3D', 8, 180);
    this.dead = 0.5; this.vy = -180;
  }
  kelp(g, x, y0, y1, w, seed, d) {
    if (y1 <= y0) return;
    g.fillStyle = mix3(KELP_A, d);
    g.fillRect(x, y0, w, y1 - y0);
    g.strokeStyle = mix3(KELP_B, d); g.lineWidth = 4; g.lineCap = 'round';
    const n = Math.max(2, Math.floor((y1 - y0) / 46));
    for (let i = 0; i <= n; i++) {
      const yy = y0 + (i / n) * (y1 - y0);
      const sway = Math.sin(this.t * 2 + seed + i) * 5;
      g.beginPath();
      g.moveTo(x + w / 2 + sway, yy);
      g.quadraticCurveTo(x + w / 2 + sway + 10, yy + 12, x + w / 2 + sway, yy + 24);
      g.stroke();
    }
    g.fillStyle = 'rgba(0,0,0,.25)';
    g.fillRect(x, y0, 6, y1 - y0);
  }
  drawFish(g, x, y, s, rot, body, belly, wagT) {
    g.save();
    g.translate(x, y); g.rotate(rot); g.scale(s, s);
    const wag = Math.sin(wagT) * 0.35;
    g.fillStyle = body;
    g.save(); g.rotate(wag);
    g.beginPath(); g.moveTo(-12, 0); g.lineTo(-24, -9); g.lineTo(-24, 9); g.closePath(); g.fill();
    g.restore();
    g.beginPath(); g.ellipse(0, 0, 15, 10, 0, 0, TAU); g.fill();
    g.fillStyle = '#F2EFFF';
    g.beginPath(); g.moveTo(-2, -3); g.lineTo(2, -3); g.lineTo(0, 4); g.closePath(); g.fill();
    g.fillStyle = belly;
    g.beginPath(); g.ellipse(-2, 6, 5, 3.5, 0.5, 0, TAU); g.fill();
    g.fillStyle = '#fff';
    g.beginPath(); g.arc(7, -3, 3.4, 0, TAU); g.fill();
    g.fillStyle = '#1A1028';
    g.beginPath(); g.arc(8, -3, 1.7, 0, TAU); g.fill();
    g.restore();
  }
  draw(g) {
    const d = clamp(this.depth, 0, 2);
    const dark = clamp(d - 1, 0, 1);
    const sun = clamp(1 - d, 0, 1);
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, mix3(SKY_TOP, d)); gr.addColorStop(1, mix3(SKY_BOT, d));
    g.fillStyle = gr; g.fillRect(0, 0, W, H);

    // sun rays on the reef
    if (sun > 0.01) {
      g.save();
      g.globalAlpha = 0.10 * sun;
      g.fillStyle = '#FFFFFF';
      for (let i = 0; i < 5; i++) {
        const x0 = ((i * 140 - this.t * 12) % (W + 200) + W + 200) % (W + 200) - 100;
        g.beginPath();
        g.moveTo(x0, 0); g.lineTo(x0 + 40, 0); g.lineTo(x0 - 60, H); g.lineTo(x0 - 130, H); g.closePath();
        g.fill();
      }
      g.restore();
    }
    // drifting specks (glowing plankton in the deep)
    for (let i = 0; i < 18; i++) {
      const px = ((i * 173 + 40 - this.t * 24) % (W + 40) + W + 40) % (W + 40) - 20;
      const py = (i * 97 + Math.sin(this.t + i) * 8) % H;
      g.globalAlpha = 0.12 + 0.35 * dark * (0.5 + 0.5 * Math.sin(this.t * 3 + i));
      g.fillStyle = dark > 0.3 && i % 3 === 0 ? '#3CF2D0' : '#F2EFFF';
      g.beginPath(); g.arc(px, py, 1.6, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;

    for (const c of this.cols) {
      this.kelp(g, c.x, 0, c.gapY - c.gapH / 2, c.w, c.seed, d);
      this.kelp(g, c.x, c.gapY + c.gapH / 2, H - 26, c.w, c.seed + 3, d);
    }
    g.fillStyle = mix3(SAND, d);
    g.fillRect(0, H - 26, W, 26);
    g.fillStyle = 'rgba(0,0,0,.18)';
    g.fillRect(0, H - 26, W, 5);

    // the dark of the abyss, with a circle of light around you
    if (dark > 0.01) {
      const fx = this.fishX() + 40;
      const rg = g.createRadialGradient(fx, this.y, 50, fx, this.y, 230);
      rg.addColorStop(0, 'rgba(1,2,8,0)');
      rg.addColorStop(0.5, 'rgba(1,2,8,' + (0.55 * dark) + ')');
      rg.addColorStop(1, 'rgba(1,2,8,' + (0.95 * dark) + ')');
      g.fillStyle = rg; g.fillRect(0, 0, W, H);
      // glowing kelp tips, so a gap can always be read
      g.save();
      g.globalAlpha = 0.85 * dark;
      g.strokeStyle = '#3CF2D0'; g.lineWidth = 3; g.lineCap = 'round';
      g.shadowColor = '#3CF2D0'; g.shadowBlur = 10;
      for (const c of this.cols) {
        const topH = c.gapY - c.gapH / 2, botY = c.gapY + c.gapH / 2;
        g.beginPath();
        g.moveTo(c.x, topH); g.lineTo(c.x + c.w, topH);
        g.moveTo(c.x, botY); g.lineTo(c.x + c.w, botY);
        g.stroke();
      }
      g.restore();
    }

    // gold fish waiting in the gaps
    for (const c of this.cols) {
      if (!c.buddy || c.got) continue;
      const bx = c.x + c.w / 2, by = c.gapY + Math.sin(this.t * 4 + c.seed) * 4;
      g.save();
      g.globalAlpha = 0.35 + 0.2 * Math.sin(this.t * 6 + c.seed);
      g.fillStyle = '#FFD23D';
      g.beginPath(); g.arc(bx, by, 16, 0, TAU); g.fill();
      g.restore();
      this.drawFish(g, bx, by, 0.62, 0, '#FFC21A', '#FFE680', this.t * 10 + c.seed);
    }

    g.strokeStyle = 'rgba(242,239,255,.5)'; g.lineWidth = 1.5;
    for (const b of this.bub) {
      g.globalAlpha = clamp(b.life, 0, 1);
      g.beginPath(); g.arc(b.x, b.y, b.r, 0, TAU); g.stroke();
    }
    g.globalAlpha = 1;

    // your school, following in a line
    for (let i = this.school.length - 1; i >= 0; i--) {
      const p = this.buddyPos(i);
      if (dark > 0.01) {
        g.save(); g.globalAlpha = 0.25 * dark; g.fillStyle = '#FFD23D';
        g.beginPath(); g.arc(p.x, p.y, 12, 0, TAU); g.fill(); g.restore();
      }
      this.drawFish(g, p.x, p.y, 0.6, 0, '#FFC21A', '#FFE680', this.t * 14 + this.school[i].wig);
    }

    // you
    const blink = this.shield > 0 && Math.floor(this.t * 12) % 2 === 0;
    g.globalAlpha = blink ? 0.4 : 1;
    const rot = clamp(this.vy * 0.0016, -0.5, 0.9);
    this.drawFish(g, this.fishX(), this.y, 1, rot, '#FF9A3D', '#FFB870', this.t * 14);
    // the lamp, once you are deep enough to need it
    if (dark > 0.01) {
      g.save();
      g.translate(this.fishX(), this.y); g.rotate(rot);
      g.globalAlpha = dark;
      g.strokeStyle = '#FF9A3D'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(4, -9); g.quadraticCurveTo(10, -24, 20, -18); g.stroke();
      g.shadowColor = '#FFF3A8'; g.shadowBlur = 16;
      g.fillStyle = '#FFF3A8';
      g.beginPath(); g.arc(20, -17, 4, 0, TAU); g.fill();
      g.restore();
    }
    g.globalAlpha = 1;

    // zone banner
    if (this.banner) {
      const b = this.banner, a = clamp(Math.min(b.t, 2.6 - b.t) * 3, 0, 1);
      g.save();
      g.globalAlpha = a;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = '900 ' + Math.round(Math.min(30, W * 0.08)) + 'px ' + FONT;
      g.lineWidth = 6; g.strokeStyle = 'rgba(0,0,0,.55)';
      g.strokeText(b.name, W / 2, H * 0.18); g.fillStyle = '#FFFFFF'; g.fillText(b.name, W / 2, H * 0.18);
      g.font = '800 ' + Math.round(Math.min(16, W * 0.045)) + 'px ' + FONT;
      g.lineWidth = 4;
      g.strokeText(b.sub, W / 2, H * 0.18 + 30); g.fillStyle = '#FFD23D'; g.fillText(b.sub, W / 2, H * 0.18 + 30);
      g.restore();
    }
    // depth meter on the right edge
    if (this.S.state !== 'ready') {
      const top = 14, bot = H - 40, x = W - 12;
      g.save();
      g.globalAlpha = 0.5;
      g.strokeStyle = '#F2EFFF'; g.lineWidth = 3; g.lineCap = 'round';
      g.beginPath(); g.moveTo(x, top); g.lineTo(x, bot); g.stroke();
      const prog = clamp(this.gates / (ZONES[2].at + 12), 0, 1);
      g.globalAlpha = 0.9; g.fillStyle = '#FFD23D';
      g.beginPath(); g.arc(x, lerp(top, bot, prog), 5, 0, TAU); g.fill();
      g.restore();
    }
  }
}

/* ══ ads ═══════════════════════════════════════════════
   Every ad is optional and rewarded: the player chooses to watch one
   (a second chance, or 3 fish to start with). Nothing interrupts play.

   In a normal browser the ad is a 3-second fake so the flow can be tested.
   Inside the Android app the AdMob plugin shows a real rewarded video.

   BEFORE RELEASE: put your real AdMob rewarded unit ID below and set
   TESTING to false. Until then Google's TEST ads are shown. */
const ADS = {
  TESTING: true,
  REWARDED_ID: 'ca-app-pub-3940256099942544/5224354917' // Google's TEST rewarded ID — replace with yours
};
const isNative = () => !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const AdMobP = () => (isNative() && window.Capacitor.Plugins ? Capacitor.Plugins.AdMob : null);
let adBusy = false, toastT = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
function showRewardedAd() {
  if (adBusy) return Promise.resolve(false);
  adBusy = true;
  const done = r => { adBusy = false; return r; };
  const A = AdMobP();
  if (!A) return demoAd().then(done);
  if (AU.ctx && AU.ctx.state === 'running') AU.ctx.suspend();
  return new Promise(async res => {
    let earned = false, finished = false;
    const hs = [];
    const finish = () => {
      if (finished) return;
      finished = true;
      hs.forEach(h => { try { h.remove(); } catch (e) {} });
      res(earned);
    };
    try {
      hs.push(await A.addListener('onRewardedVideoAdReward', () => { earned = true; }));
      hs.push(await A.addListener('onRewardedVideoAdDismissed', () => setTimeout(finish, 250)));
      hs.push(await A.addListener('onRewardedVideoAdFailedToShow', finish));
      await A.prepareRewardVideoAd({ adId: ADS.REWARDED_ID, isTesting: ADS.TESTING });
      const item = await A.showRewardVideoAd();
      if (item && item.amount !== undefined) earned = true;
      setTimeout(finish, 600);
    } catch (e) { finish(); }
  }).then(r => {
    if (AU.ctx) AU.ctx.resume();
    if (!r) toast('No ad right now — try again in a minute');
    return done(r);
  });
}
function demoAd() {
  return new Promise(res => {
    const prev = ovl.innerHTML, prevHidden = ovl.hidden;
    let n = 3;
    card(
      '<div class="go-label">Ad preview</div>' +
      '<div class="ad-count" id="adCount">' + n + '</div>' +
      '<p class="tip">A real video ad plays here in the app.</p>' +
      '<button class="link-btn" type="button" id="adSkip">Close (no reward)</button>'
    );
    const end = r => { clearInterval(iv); ovl.innerHTML = prev; ovl.hidden = prevHidden; res(r); };
    const iv = setInterval(() => {
      n--; const c = $('#adCount'); if (c) c.textContent = n;
      if (n <= 0) end(true);
    }, 1000);
    $('#adSkip').addEventListener('click', e => { e.stopPropagation(); end(false); });
  });
}
(async () => {
  const A = AdMobP();
  if (!A) return;
  try { await A.initialize({ initializeForTesting: ADS.TESTING }); } catch (e) {}
})();

/* ══ buttons ═══════════════════════════════════════════ */
function syncSound() {
  const b = $('#btnSnd');
  b.textContent = DATA.sound ? '🔊' : '🔇';
  b.setAttribute('aria-label', DATA.sound ? 'Mute' : 'Unmute');
}
$('#btnSnd').addEventListener('click', e => {
  unfocus(e);
  DATA.sound = !DATA.sound; save(); syncSound();
  AU.ensure(); AU.play('ui');
});
$('#btnPause').addEventListener('click', e => {
  unfocus(e);
  if (S.state === 'playing') S.pause();
  else if (S.state === 'paused') { S.state = 'playing'; ovl.hidden = true; }
});

/* ══ boot ══════════════════════════════════════════════ */
syncSound();
resize();
window.addEventListener('resize', resize);
S.game = new DeepFin(S);
S.syncBest();
showReady();
requestAnimationFrame(loop);

// Test hook (used by the automated tests only).
window.__DF = { S, DATA, ZONES };

})();
</script>
