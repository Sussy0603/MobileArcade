<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#efe6ff">
<title>Hoppington</title>
<style>
/* =====================================================================
   HOPPINGTON — styles
   Lavender + pink + cream. Change the colors here to restyle the game.
===================================================================== */
:root{
  --lav:#ece4ff; --lav2:#a98bea; --pink:#ffdbe8; --pink2:#f38fb3;
  --cream:#fff9f0; --cream2:#f6e9d4; --mint:#d6f4e6; --mint2:#5cc6a0;
  --lemon:#fff3c4; --gold:#ffc94d; --sky:#dfeaff; --sky2:#7fa8ee; --peach:#ffe5d4;
  --ink:#4b3f5c; --ink2:#807392; --card:#fffdf9; --line:#efe3f1;
  --good:#46bf91; --bad:#ff6b8a;
  --r:18px; --font:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:calc(15px * var(--fs))}
body.easy{--font:Verdana,"Segoe UI",Tahoma,sans-serif;letter-spacing:.04em;word-spacing:.12em;line-height:1.5}
body.easy b,body.easy .nm{letter-spacing:.03em}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
input,textarea{font-family:inherit;font-size:16px;user-select:text;-webkit-user-select:text}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:linear-gradient(#f6f0ff,#ffe9f1);border-bottom:2px solid #eadcff;z-index:20;flex-wrap:nowrap}
.pill{display:flex;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:4px 10px 4px 6px;font-weight:800;box-shadow:0 2px 0 #e6d6f5;white-space:nowrap;min-width:0}
.pill .ic{font-size:18px}
.pill.lv{flex:1;max-width:220px;padding-right:8px;min-width:76px}
@media (max-width:430px){#boosts .bst:nth-child(n+3){display:none}.pill{padding:4px 8px 4px 5px}}
.xpbar{flex:1;height:9px;background:#f1e8f6;border-radius:9px;overflow:hidden;min-width:40px}
.xpbar i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--lav2),var(--pink2));border-radius:9px;transition:width .4s}
#boosts{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden}
.bst{font-size:11px;font-weight:800;background:var(--lemon);border-radius:99px;padding:3px 7px;white-space:nowrap}
#profBtn{margin-left:auto;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 0 #e6d6f5;display:grid;place-items:center;flex:none;overflow:hidden}
#profBtn svg{width:36px;height:36px}
/* ---------- body / nav ---------- */
#body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#main{flex:1;position:relative;min-width:0;overflow:hidden}
#nav{display:flex;justify-content:space-around;background:#fff;border-top:2px solid #eadcff;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:20}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:14px;font-size:11px;font-weight:800;color:var(--ink2);position:relative}
#nav button .e{font-size:23px;line-height:1.1}
#nav button.on{background:var(--lav);color:var(--ink)}
.dot{position:absolute;top:2px;right:22%;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid #fff;display:none}
.dot.show{display:block}
@media (min-width:820px){
  #body{flex-direction:row-reverse}
  #nav{flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:2px solid #eadcff;padding:10px 8px;width:92px}
  #nav button{flex:none;padding:10px 0;font-size:12px}
  #nav button .e{font-size:28px}
  .view .inner{max-width:760px;margin:0 auto}
}
/* ---------- views ---------- */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:none;padding:12px 12px 30px;-webkit-overflow-scrolling:touch;background:#fbf5fb}
.view.on{display:block}
#vBunnies{padding:0;overflow:hidden;background:#efe6ff}
h2{margin:4px 0 10px;font-size:1.35em}
h3{margin:14px 0 8px;font-size:1.05em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 13px;border-radius:99px;background:#fff;font-weight:800;box-shadow:0 2px 0 var(--line)}
.tabs button.on{background:var(--lav);box-shadow:0 2px 0 #d3c2fb}
.card{background:var(--card);border-radius:var(--r);padding:10px;display:flex;align-items:center;gap:10px;margin-bottom:8px;box-shadow:0 3px 0 var(--line);position:relative}
.card .art{width:58px;height:58px;flex:none;border-radius:14px;background:var(--lav);display:grid;place-items:center;font-size:32px;overflow:hidden}
.card .art svg{width:56px;height:56px}
.card .info{flex:1;min-width:0}
.nm{font-weight:900}
.sub{font-size:.85em;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.tile{background:var(--card);border-radius:16px;padding:8px 4px 6px;text-align:center;box-shadow:0 3px 0 var(--line);position:relative;font-size:.82em;font-weight:800}
.tile svg{width:74px;height:74px;display:block;margin:0 auto}
.tile .big{font-size:38px;line-height:74px;height:74px}
.tile.lock{opacity:.5}
.tile.sel{outline:3px solid var(--lav2)}
.btn{background:var(--pink2);color:#fff;font-weight:900;padding:9px 14px;border-radius:14px;box-shadow:0 3px 0 #d8709a;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d8709a}
.btn.mint{background:var(--mint2);box-shadow:0 3px 0 #389c79}
.btn.lav{background:var(--lav2);box-shadow:0 3px 0 #7f63cf}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 3px 0 #d79d12}
.btn.sky{background:var(--sky2);box-shadow:0 3px 0 #4f7fcf}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.wide{display:block;width:100%;margin-top:8px;padding:12px}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.btn.sm{padding:6px 10px;font-size:.85em}
.tag{display:inline-block;font-size:.72em;font-weight:900;padding:2px 7px;border-radius:99px;background:var(--lemon);vertical-align:middle}
.r0{background:#eef0f4}.r1{background:#d6eaff}.r2{background:#e6dbff}.r3{background:#ffeab0}.r4{background:linear-gradient(90deg,#ffd0e2,#d4f2ff,#fff1b0,#e8d8ff)}
.bar{height:10px;border-radius:9px;background:#f1e7f2;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:9px}
.mood{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:.9em;font-weight:800}
.mood span{width:24px;text-align:center}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--ink2);font-size:.85em}
.center{text-align:center}
.lockic{position:absolute;top:4px;right:6px;font-size:13px}
/* ---------- the meadow scene ---------- */
#scene{position:absolute;inset:0;overflow:hidden;touch-action:none}
#sceneBg{position:absolute;inset:0;width:100%;height:100%}
#props{position:absolute;inset:0;z-index:1}
#bunnies{position:absolute;inset:0;z-index:2}
.bun{position:absolute;width:64px;height:64px;margin:-56px 0 0 -32px;transform-origin:50% 90%;will-change:transform,left,top;touch-action:none}
.bun svg{width:100%;height:100%;overflow:visible;display:block}
.bun .bob{transform-origin:50% 90%}
.bun.idle .bob{animation:breathe 2.4s ease-in-out infinite}
.bun.hop .bob{animation:hop .42s ease-in-out infinite}
.bun.zoom .bob{animation:hop .26s ease-in-out infinite}
.bun.sleep .bob{animation:breathe 3.6s ease-in-out infinite}
.bun.pop .bob{animation:pop .4s ease}
.bun .earA,.bun .earB{transform-box:fill-box;transform-origin:50% 100%}
.bun .earA.lop,.bun .earB.lop{transform-origin:50% 0%}
.bun.wig .earA{animation:wigA .55s ease}
.bun.wig .earB{animation:wigB .55s ease}
.bun .zz{position:absolute;top:-4px;right:2px;font-size:15px;font-weight:900;color:#8a72d8;animation:zz 2s infinite}
.bun .bub{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:16px;background:#fff;border-radius:12px;padding:0 4px;box-shadow:0 2px 0 #0001;pointer-events:none}
.bun.magic::after{content:"✨";position:absolute;left:-6px;top:30%;font-size:14px;animation:spark 1.4s infinite;pointer-events:none}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.04,.96)}45%{transform:translateY(-12px) scale(.96,1.05)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22,.82)}70%{transform:scale(.92,1.12)}100%{transform:scale(1)}}
@keyframes wigA{0%,100%{transform:rotate(0)}25%{transform:rotate(-16deg)}60%{transform:rotate(10deg)}}
@keyframes wigB{0%,100%{transform:rotate(0)}30%{transform:rotate(14deg)}65%{transform:rotate(-10deg)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.6)}40%{opacity:1}100%{opacity:0;transform:translate(-14px,8px) scale(1.1)}}
.fx{position:absolute;pointer-events:none;font-size:20px;font-weight:900;z-index:5;animation:fxup 1s ease-out forwards}
@keyframes fxup{from{opacity:1;transform:translate(-50%,0) scale(.7)}30%{transform:translate(-50%,-14px) scale(1.15)}to{opacity:0;transform:translate(-50%,-50px) scale(1)}}
.tuft{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;z-index:6;animation:bubIn .3s ease;font-size:30px;display:grid;place-items:center;background:radial-gradient(circle,#fff 0 40%,#fff0 70%)}
@keyframes bubIn{from{transform:scale(0)}to{transform:scale(1)}}
#careBar{position:absolute;left:8px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:10}
.fab{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #0002;font-size:26px;display:grid;place-items:center;position:relative}
.fab small{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:900;background:#fff;border-radius:6px;padding:0 4px;white-space:nowrap}
.fab .bdg{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;font-size:11px;font-weight:900;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 4px}
#sideR{position:absolute;right:8px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:10}
#areaName{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fffc;border-radius:99px;padding:5px 14px;font-weight:900;z-index:10;white-space:nowrap;display:flex;gap:6px;align-items:center}
#doors{position:absolute;top:48px;left:8px;display:flex;flex-direction:column;gap:6px;z-index:10}
.door{width:56px;height:64px;background:#fffd;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:900;position:relative;box-shadow:0 3px 0 #0002}
.door svg{width:44px;height:40px}
.door.ready{animation:wob .6s ease-in-out infinite alternate;background:var(--lemon)}
@keyframes wob{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.door .pb{position:absolute;bottom:4px;left:6px;right:6px;height:4px;background:#eee;border-radius:4px;overflow:hidden}
.door .pb i{display:block;height:100%;background:var(--mint2)}
#listBtn{position:absolute;top:8px;left:8px;z-index:11;width:40px;height:34px;border-radius:12px;background:#fffd;font-size:20px;box-shadow:0 2px 0 #0002}
#prof{position:absolute;top:48px;right:8px;z-index:10;width:64px;height:64px}
#prof svg{width:64px;height:64px}
#prof .bdg{position:absolute;top:0;right:0;background:var(--bad);color:#fff;border-radius:99px;font-size:12px;font-weight:900;min-width:20px;height:20px;display:grid;place-items:center;animation:wob .5s infinite alternate}
#golden{position:absolute;z-index:9;width:62px;height:62px;display:none;filter:drop-shadow(0 0 10px #ffe066);margin:-31px 0 0 -31px}
#golden svg{width:62px;height:62px}
#nightTint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#24205ecc,#3b2a6eaa);mix-blend-mode:multiply;opacity:0;transition:opacity 2s;z-index:3}
#weather{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.drop{position:absolute;top:-20px;width:2px;height:16px;background:#8fa6dccc;border-radius:2px;animation:fall linear infinite}
.flake{position:absolute;top:-20px;color:#fff;font-size:12px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(200deg)}}
/* ---------- modal ---------- */
#modalBg{position:fixed;inset:0;background:#4b3f5c66;display:none;z-index:1050;align-items:center;justify-content:center;padding:14px}
#modalBg.on{display:flex}
#modal{background:#fff;border-radius:24px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;padding:16px;box-shadow:0 10px 40px #0003;animation:mIn .25s ease;position:relative}
@keyframes mIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#modal h2{text-align:center;margin-top:0}
#mClose{position:absolute;top:8px;right:10px;font-size:22px;width:36px;height:36px;border-radius:50%;background:#f6eef7}
.reward{text-align:center}
.reward .big{font-size:60px;line-height:1.1}
.reward .amt{font-size:1.5em;font-weight:900;margin:6px 0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:1080;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:70%;max-width:420px}
.tst{background:#fff;border-radius:14px;padding:9px 14px;font-weight:800;box-shadow:0 4px 14px #0002;animation:tIn .3s ease;max-width:100%;text-align:center}
.tst.gold{background:var(--lemon)}
body.ingame #toast{top:calc(60px + env(safe-area-inset-top));bottom:auto}.tst.err{background:#ffe2ea}
@keyframes tIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
/* ---------- mini games ---------- */
#game{position:fixed;inset:0;z-index:1060;background:#e9f6df;display:none;touch-action:none}
#game.on{display:block}
#gCanvas{position:absolute;inset:0;width:100%;height:100%}
#gHud{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:2;font-weight:900;font-size:1.1em}
#gHud .pill{font-size:1em}
#gOver{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#4b3f5c55;z-index:3;padding:16px}
#gOver.on{display:flex}
#gOver .box{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:360px;text-align:center}
#memGrid{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);display:grid;gap:8px;z-index:1}
.mc{width:64px;height:76px;border-radius:14px;background:var(--lav2);box-shadow:0 3px 0 #7f63cf;font-size:34px;display:grid;place-items:center;transition:transform .25s}
.mc.up{background:#fff;box-shadow:0 3px 0 #ddd}
.mc.done{background:var(--mint);box-shadow:none;transform:scale(.92)}
/* ---------- loading ---------- */
#load{position:fixed;inset:0;z-index:1100;background:linear-gradient(#efe6ff,#ffe6ef 60%,#fff6ea);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .6s}
#load .logo{font-size:2.5em;font-weight:900;color:#b18af0;text-shadow:0 3px 0 #fff;letter-spacing:.02em}
#load .wd{width:120px;height:120px;animation:hop .5s ease-in-out infinite}
#load .wd svg{width:120px;height:120px}
#load .tip{max-width:300px;text-align:center;font-weight:700;color:var(--ink2);padding:0 20px}
#load .lbar{width:200px;height:10px;background:#fff;border-radius:9px;overflow:hidden}
#load .lbar i{display:block;height:100%;width:0;background:var(--pink2);transition:width .3s}
/* ---------- Professor Hops' bubbles (tutorial) ---------- */
#tut{position:fixed;left:72px;right:8px;top:calc(122px + env(safe-area-inset-top));z-index:1040;display:none;pointer-events:none}
@media (min-width:820px){#tut{left:180px;right:90px}}
#tut.on{display:flex;justify-content:center}
#tut .box{pointer-events:auto;background:#fff;border-radius:20px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px #0003;max-width:460px;width:100%;border:3px solid var(--lav2)}
#tut svg{width:58px;height:58px;flex:none}
#tut .tx{flex:1;font-weight:800;font-size:1em}
.hl{outline:4px solid var(--gold)!important;outline-offset:2px;animation:hlp 1s infinite alternate;z-index:1030}
@keyframes hlp{from{outline-color:var(--gold)}to{outline-color:var(--pink2)}}
.seg{display:flex;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.seg button{flex:1;padding:8px 6px;font-weight:800}
.seg button.on{background:var(--lav)}
.hint{background:var(--lemon);border-radius:16px;padding:10px;font-weight:800;margin:8px 0}
textarea.code{width:100%;height:90px;border-radius:12px;border:2px solid #eee;padding:8px;font-size:12px;font-family:monospace;resize:none}
</style>
</head>
<body class="easy">
<div id="load">
  <div class="logo">Hoppington</div>
  <div class="wd" id="loadBun"></div>
  <div class="lbar"><i id="loadBar"></i></div>
  <div class="tip" id="loadTip"></div>
</div>
<div id="app">
  <div id="top">
    <div class="pill" id="pCarrot"><span class="ic">🥕</span><span id="vCarrot">0</span></div>
    <div class="pill" id="pGem"><span class="ic">💎</span><span id="vGem">0</span></div>
    <div class="pill lv" id="pLevel"><span class="ic">⭐</span><span id="vLevel">1</span><div class="xpbar"><i id="vXp"></i></div></div>
    <div id="boosts"></div>
    <button id="profBtn" aria-label="Profile"></button>
  </div>
  <div id="body">
    <div id="main">
      <div class="view on" id="vBunnies">
        <div id="scene">
          <svg id="sceneBg" preserveAspectRatio="none"></svg>
          <div id="props"></div>
          <div id="bunnies"></div>
          <div id="nightTint"></div>
          <div id="weather"></div>
        </div>
        <button id="listBtn" aria-label="List">📋</button>
        <div id="areaName"></div>
        <div id="doors"></div>
        <button id="prof" aria-label="Professor Hops"></button>
        <div id="careBar"></div>
        <div id="sideR"></div>
        <button id="golden" aria-label="Golden bunny"></button>
      </div>
      <div class="view" id="vList"><div class="inner" id="iList"></div></div>
      <div class="view" id="vTown"><div class="inner" id="iTown"></div></div>
      <div class="view" id="vMarket"><div class="inner" id="iMarket"></div></div>
      <div class="view" id="vGames"><div class="inner" id="iGames"></div></div>
      <div class="view" id="vMore"><div class="inner" id="iMore"></div></div>
    </div>
    <div id="nav"></div>
  </div>
</div>
<div id="modalBg"><div id="modal"><button id="mClose">✕</button><div id="mBody"></div></div></div>
<div id="toast"></div>
<div id="tut"><div class="box"><div id="tutCap"></div><div class="tx" id="tutTx"></div><button class="btn sm" id="tutBtn">OK</button></div></div>
<div id="game">
  <canvas id="gCanvas"></canvas>
  <div id="memGrid"></div>
  <div id="gHud"></div>
  <div id="gOver"><div class="box" id="gOverBox"></div></div>
</div>
<script>
/* =====================================================================
   HOPPINGTON  —  a cozy bunny idle game
   ---------------------------------------------------------------------
   HOW THIS FILE IS ORGANISED
     1. CONFIG        ← all the tuning numbers. Change feel here.
     2. DATA          ← areas, bunny kinds, shops, outfits, food...
     3. LANGUAGE      ← English / French words
     4. STATE + SAVE  ← what the game remembers (+ backup codes)
     5. ECONOMY       ← how carrots are made, breeding, album, tasks
     6. ART           ← bunnies drawn in code (SVG)
     7. SOUND         ← music box + cute sounds made in code
     8. MEADOW VIEW   ← bunnies hopping, petting, care
     9. SCREENS       ← Bunnies list, Town, Market, Games, More
    10. MINI GAMES
    11. MONEY         ← ads + purchases (demo in browser)
    12. MAIN LOOP     ← ticks, away time, tutorial, start-up
===================================================================== */

/* =====================================================================
   1. CONFIG — tune the game here. Numbers only, no code knowledge needed.
===================================================================== */
const CONFIG = {
  /* ---- money basics ---- */
  START_CARROTS: 150,
  START_GEMS: 10,
  START_FOOD: 6,               // carrot snacks you start with
  BASE_RATE: 1,                // carrots per second for one happy Common grown bunny
  RARITY_MULT: [1, 2.5, 6, 15, 40],   // Common, Rare, Epic, Legendary, Magic
  MAX_BUN_LV: [10, 20, 30, 40, 50],   // max level by rarity
  BUN_LV_BONUS: 0.20,          // +20% carrots per bunny level

function weighted(odds){let s=odds.reduce((a,b)=>a+b,0),r=Math.random()*s;for(let i=0;i<odds.length;i++){r-=odds[i];if(r<0)return i;}return odds.length-1;}
function fmt(n){
  n=Math.floor(n||0); if(n<1000) return String(n);
  const u=['K','M','B','T','Qa','Qi','Sx','Sp'];let i=-1;
  while(n>=1000&&i<u.length-1){n/=1000;i++;}
  return (n>=100?Math.floor(n):n>=10?(Math.floor(n*10)/10):(Math.floor(n*100)/100))+u[i];
}
function fmtTime(sec){
  sec=Math.max(0,Math.ceil(sec));
  if(sec<60) return sec+'s';
  const m=Math.floor(sec/60), s=sec%60;
  if(m<60) return m+'m'+(s?' '+s+'s':'');
  const h=Math.floor(m/60); if(h<48) return h+'h '+(m%60)+'m';
  return Math.floor(h/24)+'d '+(h%24)+'h';
}

/* fills in anything missing from an older save */
function fixState(o){
  const d = newState();
  for(const k in d) if(o[k]===undefined) o[k]=d[k];
  for(const k in d.stats) if(o.stats[k]===undefined) o.stats[k]=d.stats[k];
  for(const k in d.inv) if(o.inv[k]===undefined) o.inv[k]=0;
  for(const k in d.shops) if(o.shops[k]===undefined) o.shops[k]=0;
  o.open.forEach(id=>{ if(!o.ar[id]) o.ar[id]=newArea(); });
  if(!AREA(o.cur)) o.cur = 'meadow';
  return o;
}

}

/* ---------- backup code (copy to move to a new phone) ---------- */
function makeBackupCode(){
  S.lastSeen = now();
  const json = JSON.stringify(S);
  let sum = 0; for(let i=0;i<json.length;i++) sum = (sum * 31 + json.charCodeAt(i)) >>> 0;
  return 'HOP1-' + sum.toString(36) + '-' + btoa(unescape(encodeURIComponent(json)));
}
function readBackupCode(code){
  try{
    code = String(code || '').trim().replace(/\s+/g, '');
    const m = code.match(/^HOP1-([a-z0-9]+)-(.+)$/); if(!m) return null;
    const json = decodeURIComponent(escape(atob(m[2])));
    let sum = 0; for(let i=0;i<json.length;i++) sum = (sum * 31 + json.charCodeAt(i)) >>> 0;
    if(sum.toString(36) !== m[1]) return null;
    const o = JSON.parse(json); if(!o || !o.v || !Array.isArray(o.buns)) return null;
    return fixState(o);
  }catch(e){ return null; }
}

/* ---------- time helpers ---------- */
function isNight(t){ const h=new Date(t||now()).getHours(); return h>=CONFIG.NIGHT_START || h<CONFIG.NIGHT_END; }
function isWeekend(t){ const d=new Date(t||now()).getDay(); return d===0||d===6; }
function seasonOf(t){
  if(CONFIG.SEASON_TEST) return CONFIG.SEASON_TEST;
  const m = new Date(t||now()).getMonth();
  return m>=2&&m<=4 ? 'spring' : m>=5&&m<=7 ? 'summer' : m>=8&&m<=10 ? 'autumn' : 'winter';
}
/* moon age in days (0 = new moon, ~14.8 = full moon) */
function moonAge(t){ const syn = 29.530588853, ref = Date.UTC(2000,0,6,18,14) ; return (((t||now()) - ref) / 86400000 % syn + syn) % syn; }
function isFullMoon(t){ if(CONFIG.MOON_TEST) return true; const a = moonAge(t); return a > 13.8 && a < 15.8; }
const fullMoonNight = t => isFullMoon(t) && isNight(t);
function easterDate(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da);
}
/* which holiday is on right now (by real date, 1 week each) */
function activeEvent(t){
  if(CONFIG.EVENT_TEST) return CONFIG.EVENT_TEST;
  const d=new Date(t||now()), y=d.getFullYear(), md=(d.getMonth()+1)*100+d.getDate();
  if(md>=208&&md<=214) return 'valentine';
  if(md>=1025&&md<=1031) return 'halloween';
  if(md>=1219&&md<=1225) return 'christmas';
  const e=easterDate(y), start=new Date(e.getFullYear(),e.getMonth(),e.getDate()-6), end=new Date(e.getFullYear(),e.getMonth(),e.getDate()+1);
  if(d>=start&&d<end) return 'easter';
  return null;
}

/* =====================================================================
   3. LANGUAGE — tr('English text') gives French when French is chosen.
   To fix a French word, change it in FR (near the end of the file). Missing → English.
===================================================================== */
function L(o){ if(!o) return ''; return (S && S.lang === 'fr' && o.fr) ? o.fr : (o.en || ''); }
function tr(s, vars){
  let out = (S && S.lang === 'fr' && FR[s]) ? FR[s] : s;
  if(vars) for(const k in vars) out = out.split('{' + k + '}').join(vars[k]);
  return out;
}

/* =====================================================================
   5. ECONOMY — carrots, bunnies, levels, costs, breeding, album, tasks
===================================================================== */
const MOOD_RATE = () => 100 / (CONFIG.MOOD_EMPTY_HOURS * 3600);
const tierOf = area => Math.max(0, AREA_IDS.indexOf(area));
const tierMult = area => Math.pow(CONFIG.AREA_TIER_MULT, tierOf(area));
const stageOf = b => b.grow < CONFIG.GROW_SEC ? 0 : 1;
const maxLv = b => CONFIG.MAX_BUN_LV[b.r];
const bunById = id => S.buns.find(b => b.id === id);
const bunsIn = area => S.buns.filter(b => b.a === area);
const areaCap = area => CONFIG.SPACE_START + (S.ar[area] ? S.ar[area].burrow : 0);
const areaFull = area => bunsIn(area).length >= areaCap(area);
const moodAvg = b => (b.m.food + b.m.fur + b.m.fun) / 3;
const isMagic = b => KIND(b.k).r === 4;
const kindName = b => L(KIND(b.k));
const asleep = (b, night) => night === undefined ? isNight() : night;

/* ---------- best buddies: same favorite thing + same area (pairs) ---------- */
let buddyMap = {};
function computeBuddies(){
  buddyMap = {};
  AREA_IDS.forEach(a => {
    const by = {};
    bunsIn(a).filter(b => stageOf(b) === 1).sort((x, y) => x.id - y.id).forEach(b => { (by[b.like] = by[b.like] || []).push(b); });
    for(const k in by){ const l = by[k]; for(let i=0;i+1<l.length;i+=2){ buddyMap[l[i].id] = l[i+1].id; buddyMap[l[i+1].id] = l[i].id; } }
  });
}
const buddyOf = b => buddyMap[b.id] ? bunById(buddyMap[b.id]) : null;

/* ---------- outfit bonuses ---------- */
function outfitBonus(b){
  const r = {p:0, mood:0, luck:0};
  if(stageOf(b) < 1) return r;
  for(const s in (b.o || {})){
    const O = OUTFITS[b.o[s]]; if(!O || !O.b) continue;
    const B = O.b;
    if(B.area && B.area !== b.a) continue;
    if(B.wx && B.wx !== S.weather.k) continue;
    r.p += B.p || 0; r.mood += B.mood || 0; r.luck += B.luck || 0;
  }
  return r;
}
function areaBoost(area){
  const A = S.ar[area]; if(!A) return 1;
  return 1 + A.clover * CONFIG.CLOVER_BONUS + A.decor.filter(Boolean).length * CONFIG.DECOR_BONUS;
}
function globalMult(t){
  t = t || now();
  let m = 1 + S.shops.bakery * CONFIG.BAKERY_BONUS;
  if(S.ad2x > t) m *= 2;
  if(isWeekend(t)) m *= CONFIG.WEEKEND_MULT;
  if(S.weather.k === 'sunny') m *= 1.1;
  return m;
}
/* carrots per second for one bunny (without global boosts) */
function bunRate(b, night){
  if(night === undefined) night = isNight();
  const K = KIND(b.k);
  let r = CONFIG.BASE_RATE * CONFIG.RARITY_MULT[b.r] * (1 + CONFIG.BUN_LV_BONUS * (b.lv - 1)) * CONFIG.STAGE_EARN[stageOf(b)];
  r *= CONFIG.SAD_MIN + (1 - CONFIG.SAD_MIN) * moodAvg(b) / 100;
  if(b.t === 'zoomy') r *= 1.2;
  if(b.t === 'greedy') r *= 1.3;
  if(night && b.t !== 'sleepy') r *= CONFIG.NIGHT_MULT;
  if(K.fav === b.a) r *= 1 + CONFIG.FAV_BONUS;
  if(buddyMap[b.id]) r *= 1 + CONFIG.BUDDY_BONUS;
  r *= 1 + outfitBonus(b).p;
  return r * tierMult(b.a) * areaBoost(b.a);
}
function incomePerSec(){ const n = isNight(), g = globalMult(); return S.buns.reduce((a, b) => a + bunRate(b, n), 0) * g; }
function areaIncome(area){ const n = isNight(), g = globalMult(); return bunsIn(area).reduce((a, b) => a + bunRate(b, n), 0) * g; }
/* never less than this for rewards that scale with income */
const incomeFloor = () => Math.max(2, incomePerSec());

function addC(n){ S.c += n; if(n > 0) S.stats.carrots += n; }
function canPay(cur, n){ return cur === 'g' ? S.g >= n : S.c >= n; }
function pay(cur, n){
  if(!canPay(cur, n)){ toast(cur === 'g' ? tr('Not enough gems') : tr('Not enough carrots'), 'err'); sfx('err'); return false; }
  if(cur === 'g') S.g -= n; else S.c -= n; return true;
}

/* ---------- town level (player level) ---------- */
const xpNeed = lv => Math.round(CONFIG.XP_BASE * Math.pow(lv, CONFIG.XP_POW));
function titleOf(lv){ let t = TITLES[0][1]; TITLES.forEach(([l, n]) => { if(lv >= l) t = n; }); return t; }
function addXP(n){
  S.xp += Math.round(n);
  let ups = 0;
  while(S.xp >= xpNeed(S.lv)){ S.xp -= xpNeed(S.lv); S.lv++; ups++; levelReward(S.lv); }
  if(ups){ sfx('level'); refreshTop(); }
}
function levelReward(lv){
  const gems = CONFIG.LEVEL_GEMS + (lv % 5 === 0 ? 10 : 0);
  S.g += gems;
  const outs = Object.keys(OUTFITS).filter(k => OUTFITS[k].reward === lv);
  outs.forEach(k => S.outfits[k] = 1);
  const ai = CONFIG.AREA_LEVEL.indexOf(lv), na = ai > 0 ? AREAS[ai] : null;
  if(na && !S.open.includes(na.id)){ S.open.push(na.id); S.ar[na.id] = newArea(); }
  const shopsNew = SHOP_IDS.filter(k => SHOPS[k].lv === lv);
  queueModal(() => showReward('⭐', tr('Town level {n}!', {n:lv}),
    '+' + gems + ' 💎' + outs.map(k => '<br>' + OUTFITS[k].e + ' ' + L(OUTFITS[k])).join('') +
    (na ? '<br><b>' + na.e + ' ' + tr('New area') + ': ' + L(na) + '</b>' : '') +
    shopsNew.map(k => '<br>' + SHOPS[k].e + ' ' + tr('You can build') + ': ' + L(SHOPS[k])).join('') +
    (titleOf(lv) !== titleOf(lv - 1) ? '<br><b>🏘️ ' + tr('Your town is now a') + ' ' + L(titleOf(lv)) + '!</b>' : ''),
    na ? () => { goArea(na.id); showView('Bunnies'); toast(na.e + ' ' + tr('Welcome to') + ' ' + L(na) + '!', 'gold'); } : null));
  checkGoals();
}

/* ---------- picking a bunny kind ---------- */
const inSeason = k => !k.season || k.season === seasonOf();
function kindPool(r, area){
  return KINDS.filter(k => k.r === r && !k.hol && (r === 4 ? k.r === 4 : k.r !== 4) && inSeason(k));
}
function pickKind(r, area){
  let pool = kindPool(r, area);
  if(!pool.length) pool = kindPool(0, area);
  const w = pool.map(k => (k.fav === area ? 3 : 1) * (S.album[k.id] ? 1 : 1.6) * (k.season ? 1.5 : 1));
  return pool[weighted(w)].id;
}
function makeBun(opt){
  const K = KIND(opt.k);
  const b = {
    id: S.nextId++, n: opt.n || pick(NAMES), k: K.id, r: K.r, t: opt.t || pick(TRAIT_IDS), like: opt.like !== undefined ? opt.like : rint(0, LIKES.length - 1),
    a: opt.a || S.cur, born: now(), grow: opt.baby ? 0 : CONFIG.GROW_SEC, lv: 1, love: 0,
    m: {food:80, fur:85, fun:80}, o: Object.assign({}, opt.o || {}), par: opt.par || null, follow: opt.follow || null, rest: 0, sp: opt.sp || null,
  };
  S.buns.push(b);
  addToAlbum(b);
  computeBuddies();
  return b;
}
function addToAlbum(b){
  if(S.album[b.k]) return;
  S.album[b.k] = 1;
  const reward = Math.round(incomeFloor() * 60);
  addC(reward); S.g += 1;
  if(S.tut >= 99) toast('📖 ' + tr('New in the album!') + ' +1 💎 +' + fmt(reward) + ' 🥕', 'gold');
  PAGES.forEach(P => {
    if(S.pagesDone[P.id]) return;
    if(!KINDS.filter(P.f).every(k => S.album[k.id])) return;
    S.pagesDone[P.id] = 1; S.g += P.g;
    queueModal(() => {
      let extra = '';
      if(P.crown){ S.outfits.rainbowcrown = 1; extra = '<br>' + OUTFITS.rainbowcrown.e + ' ' + L(OUTFITS.rainbowcrown); }
      if(P.magic){
        const left = KINDS.filter(k => k.r === 4 && !S.album[k.id]);
        const k = (left.length ? pick(left) : pick(KINDS.filter(k => k.r === 4))).id;
        const a = !areaFull(S.cur) ? S.cur : (S.open.find(x => !areaFull(x)) || S.cur);
        const m = makeBun({k, a}); extra = '<br>' + tr('A magic bunny joins you!') + ' <b>' + esc(m.n) + '</b>';
        renderMeadow();
      }
      showReward(P.e, tr('Album page complete!'), L(P) + ' · +' + P.g + ' 💎' + extra);
      saveNow();
    });
  });
}

/* ---------- visitors at the burrow doors ---------- */

const rarTag = r => '<span class="tag" style="background:' + RARITY[r].c + ';color:#fff">' + L(RARITY[r]) + '</span>';

/* ---------- bunny levels ---------- */
function bunLvCost(b){ return Math.round(CONFIG.BUN_LV_COST * CONFIG.RARITY_MULT[b.r] * Math.pow(CONFIG.BUN_LV_GROWTH, b.lv - 1) * Math.pow(2, tierOf(b.a))); }
function bunLevelUp(b){
  if(b.lv >= maxLv(b)) return false;
  b.lv++; b.grow += 120; addXP(3);
  return true;
}
function addLove(b, n){
  b.love += n;
  while(b.love >= CONFIG.LOVE_PER_LEVEL){
    if(b.lv >= maxLv(b)){ b.love = CONFIG.LOVE_PER_LEVEL - 1; break; }
    b.love -= CONFIG.LOVE_PER_LEVEL; bunLevelUp(b);
    fxAtBun(b, '⬆️ ' + tr('Lv') + ' ' + b.lv);
  }
}
function farmPrice(b){ return Math.round((60 + bunLvCost(b) * 1.5) * (stageOf(b) === 1 ? 1 : 0.5)); }

/* ---------- area + town costs ---------- */
function burrowCost(area){ return Math.round(300 * Math.pow(2.1, S.ar[area].burrow) * Math.pow(3, tierOf(area))); }
function cloverCost(area){ const lv = S.ar[area].clover; return Math.round(100 * Math.pow(1.15, lv) * Math.pow(1.6, lv > 9 ? lv - 9 : 0) * Math.pow(3, tierOf(area))); }
const burrowMax = () => CONFIG.SPACE_MAX - CONFIG.SPACE_START;
function shopCost(k){ return Math.round(SHOPS[k].cost * Math.pow(2.4, S.shops[k])); }
const nurserySlots = () => CONFIG.NURSERY_START + (S.shops.library >= 3 ? 1 : 0) + (S.shops.library >= 7 ? 1 : 0);

/* ---------- breeding ---------- */
function breedSec(a, b){ return Math.round(CONFIG.BREED_MIN[Math.max(a.r, b.r)] * 60 * (1 - CONFIG.LIBRARY_CUT * S.shops.library)); }
const canBreed = b => stageOf(b) === 1 && now() >= (b.rest || 0) && !S.nursery.some(n => n.a === b.id || n.b === b.id);
function recipeFor(A, B, area, night, moon){
  const ga = KIND(A.k).g, gb = KIND(B.k).g;
  return RECIPES.filter(R => {
    if(R.rr !== undefined) return A.r >= R.rr && B.r >= R.rr && (!R.moon || moon);
    const pairOk = (ga === R.a && gb === R.b) || (ga === R.b && gb === R.a);
    return pairOk && (!R.area || R.area === area) && (!R.night || night) && (!R.moon || moon);
  });
}
function breedResult(A, B, area){
  const night = isNight(), moon = fullMoonNight();
  const rs = recipeFor(A, B, area, night, moon);
  if(rs.length && Math.random() < CONFIG.RECIPE_CHANCE){ const R = pick(rs); return {k: R.out, recipe: RECIPES.indexOf(R)}; }
  const minR = Math.min(A.r, B.r), maxR = Math.max(A.r, B.r);
  if(Math.random() < CONFIG.MAGIC_CHANCE[minR]) return {k: pickKind(4, area)};
  if(Math.random() < CONFIG.MUTATION_CHANCE) return {k: pickKind(Math.min(3, maxR + 1), area)};
  return {k: Math.random() < 0.5 ? A.k : B.k};
}
function startBreeding(A, B){
  if(S.nursery.length >= nurserySlots()){ toast(tr('The nursery is full'), 'err'); return; }
  const res = breedResult(A, B, A.a);
  const sec = breedSec(A, B);
  S.nursery.push({id: S.nextId++, a: A.id, b: B.id, nA: A.n, nB: B.n, kA: A.k, kB: B.k, area: A.a, start: now(), dur: sec, rush: 0, out: res.k, recipe: res.recipe});
  A.rest = B.rest = now() + (sec + CONFIG.BREED_REST_MIN * 60) * 1000;
  S.stats.bred++; taskCount('breed'); addXP(6);
  fxAtBun(A, '💞'); fxAtBun(B, '💞');
  sfx('level'); saveNow(); checkGoals();
}
const nestLeft = n => Math.max(0, n.dur - (now() - n.start) / 1000 - n.rush);
function meetBaby(n){
  let area = n.area;
  if(areaFull(area)){ const alt = S.open.find(x => !areaFull(x)); if(!alt){ toast(tr('Every area is full! Build burrows in Town.'), 'err'); sfx('err'); return; } area = alt; }
  S.nursery = S.nursery.filter(x => x !== n);
  const pa = bunById(n.a);
  const baby = makeBun({k: n.out, a: area, baby: true, par: [{n: n.nA, k: n.kA}, {n: n.nB, k: n.kB}], follow: pa && pa.a === area ? pa.id : null});
  if(n.recipe !== undefined && n.recipe !== null) S.recipesFound[n.recipe] = 1;
  addXP(12); sfx('hop');
  showReward(bunSVG(baby, {size:120}), tr('A baby bunny!'),
    rarTag(baby.r) + ' ' + kindName(baby) + '<br>👪 ' + esc(n.nA) + ' + ' + esc(n.nB) +
    (n.recipe !== undefined && n.recipe !== null ? '<br>📜 ' + tr('Secret recipe found!') : '') +
    '<div style="margin-top:10px"><input id="nmIn" maxlength="14" value="' + esc(baby.n) + '" style="padding:8px;border-radius:10px;border:2px solid #eee;text-align:center;width:70%"></div>',
    () => { const v = ($('nmIn') || {}).value; if(v && v.trim()) baby.n = v.trim().slice(0, 14); if(area !== S.cur) goArea(area); renderMeadow(); saveNow(); });
  checkGoals(); saveNow();
}
/* a hint from Professor Hops: a recipe you have not found yet */
function nextHint(){
  const i = RECIPES.findIndex((R, i) => !S.recipesFound[i]);
  return i < 0 ? null : RECIPES[i];

/* ---------- rain + full moon visitors (adopt with carrots) ---------- */
function visitorPrice(r){ return Math.round(Math.max(300 * (r + 1) * (r + 1), incomeFloor() * 90 * (r + 1))); }
function spawnVisitor(moon){
  const area = S.cur, A = S.ar[area];
  const dec = A.decor.filter(Boolean).map(k => DECOR[k].attract).filter(Boolean);
  let odds = [20, 42, 26, 11, 1];
  if(dec.includes('rare')) odds = [12, 42, 30, 14, 2];
  if(dec.includes('local')) odds = [8, 38, 34, 17, 3];

  S.visitor = {area, moon: !!moon, until: now() + CONFIG.VISITOR_STAY_SEC * 1000, d: {k, r: KIND(k).r, n: pick(NAMES), t: pick(TRAIT_IDS), like: rint(0, LIKES.length - 1), grow: CONFIG.GROW_SEC, o: {}, a: area, m:{food:90,fur:90,fun:90}, lv:1}};
  renderVisitor();
  toast(moon ? '🌕 ' + tr('A magic bunny visits under the full moon!') : '🌧️ ' + tr('A rare visitor came in from the rain!'), 'gold');
}

/* ---------- daily tasks (3 a day) ---------- */
const TASK_TYPES = {
  pet:{e:'💕',n:12,t:{en:'Pet bunnies {n} times',fr:'Flatte des lapins {n} fois'}},
  feed:{e:'🥕',n:3,t:{en:'Feed your bunnies {n} times',fr:'Nourris tes lapins {n} fois'}},
  brush:{e:'🪮',n:2,t:{en:'Brush your bunnies {n} times',fr:'Brosse tes lapins {n} fois'}},
  play:{e:'🎾',n:2,t:{en:'Play ball {n} times',fr:'Joue à la balle {n} fois'}},
  games:{e:'🎮',n:2,t:{en:'Play {n} mini games',fr:'Joue {n} mini-jeux'}},
  welcome:{e:'🚪',n:1,t:{en:'Welcome {n} visitor',fr:'Accueille {n} visiteur'}},
  breed:{e:'🍼',n:1,t:{en:'Start {n} baby in the nursery',fr:'Commence {n} bébé à la pouponnière'}},
  lvl:{e:'⬆️',n:1,t:{en:'Level up a bunny {n} time',fr:'Monte un lapin de niveau {n} fois'}},
  earn:{e:'🥕',n:0,t:{en:'Earn {n} carrots',fr:'Gagne {n} carottes'}},
};
function seeded(seed){ let s = seed % 2147483647; if(s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }
function ensureTasks(){
  const day = dayNum(now());
  if(S.tasks.day === day) return;
  const R = seeded(day * 7 + 13), keys = Object.keys(TASK_TYPES).filter(k => k !== 'breed' || S.buns.filter(b => stageOf(b) === 1).length >= 2);
  const list = [];
  while(list.length < 3){ const k = keys[Math.floor(R() * keys.length)]; if(!list.some(x => x.k === k)) list.push({k, n: k === 'earn' ? Math.max(500, Math.round(incomeFloor() * 900 / 100) * 100) : TASK_TYPES[k].n, p: 0, done: false}); }
  S.tasks = {day, list, chest: false, earnStart: S.stats.carrots};
}
function taskCount(k, n){
  if(!S.tasks || !S.tasks.list) return;
  S.tasks.list.forEach(t => { if(t.k === k && !t.done) t.p = Math.min(t.n, t.p + (n || 1)); });
}
function taskProg(t){ return t.k === 'earn' ? Math.min(t.n, S.stats.carrots - (S.tasks.earnStart || 0)) : t.p; }
const taskReady = t => !t.done && taskProg(t) >= t.n;
const tasksReadyCount = () => (S.tasks.list || []).filter(taskReady).length + ((S.tasks.list || []).length && S.tasks.list.every(t => t.done) && !S.tasks.chest ? 1 : 0);
function claimTask(i){
  const t = S.tasks.list[i]; if(!t || !taskReady(t)) return;
  t.done = true;
  const c = Math.round(Math.max(200, incomeFloor() * 120)); addC(c); S.g += 1; addXP(15);
  sfx('coin'); toast('✅ +' + fmt(c) + ' 🥕 +1 💎', 'gold'); saveNow();
}
function claimChest(){
  if(S.tasks.chest || !S.tasks.list.every(t => t.done)) return;
  S.tasks.chest = true;
  const c = Math.round(Math.max(800, incomeFloor() * 300)); addC(c); S.g += 5; addXP(25);
  sfx('win'); showReward('🧺', tr('All tasks done!'), '+' + fmt(c) + ' 🥕 +5 💎'); saveNow();
}

/* ---------- big goals ---------- */
const GOALS = [

/* =====================================================================
   6. ART — every bunny is drawn in code (SVG). No image files needed.
   Soft round blobs: body + haunch + head + ears + tail puff.
===================================================================== */
function shade(hex, amt){ // amt -1..1 (darker..lighter)
  let c = hex.replace('#',''); if(c.length===3) c = c.split('').map(x=>x+x).join('');
  let r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function mix(a, b, p){
  const pa=x=>[parseInt(x.substr(1,2),16),parseInt(x.substr(3,2),16),parseInt(x.substr(5,2),16)];
  const A=pa(a), B=pa(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*p).toString(16).padStart(2,'0')).join('');
}
const lum = hex => { const c = hex.replace('#',''); return (parseInt(c.substr(0,2),16)*0.3 + parseInt(c.substr(2,2),16)*0.59 + parseInt(c.substr(4,2),16)*0.11) / 255; };
let svgUid = 0;
function star(x, y, r, c, extra){
  let p = '';
  for(let i=0;i<10;i++){ const a = Math.PI/5*i - Math.PI/2, rr = i%2 ? r*0.45 : r; p += (i?'L':'M')+(x+Math.cos(a)*rr).toFixed(1)+' '+(y+Math.sin(a)*rr).toFixed(1); }
  return '<path d="'+p+'Z" fill="'+c+'"'+(extra||'')+'/>';
}
function heart(x, y, r, c){ return '<path d="M'+x+' '+(y+r*0.9)+' C'+(x-r*1.6)+' '+(y-r*0.2)+' '+(x-r*0.6)+' '+(y-r*1.3)+' '+x+' '+(y-r*0.45)+' C'+(x+r*0.6)+' '+(y-r*1.3)+' '+(x+r*1.6)+' '+(y-r*0.2)+' '+x+' '+(y+r*0.9)+' z" fill="'+c+'"/>'; }
const emo = (e, x, y, s, rot) => '<text x="'+x+'" y="'+y+'" font-size="'+s+'" text-anchor="middle" dominant-baseline="central"'+(rot?' transform="rotate('+rot+' '+x+' '+y+')"':'')+'>'+e+'</text>';

/* body shapes by size / stage */
function bunGeo(K, stage){
  if(stage === 0) return {bx:47, by:76, brx:17, bry:13, qx:38, qy:77, qr:10, hx:62, hy:60, hr:15, tx:29, ty:72, tr:4.5, ear:0.62};
  if(K.ear === 'hare') return {bx:45, by:68, brx:23, bry:16, qx:34, qy:70, qr:14, hx:67, hy:47, hr:13.5, tx:20, ty:63, tr:5, ear:1};
  if(K.sz === 'dwarf') return {bx:46, by:73, brx:21, bry:16, qx:36, qy:74, qr:13, hx:64, hy:53, hr:17, tx:24, ty:68, tr:5.5, ear:0.8};
  if(K.sz === 'giant') return {bx:42, by:68, brx:30, bry:21, qx:30, qy:71, qr:17, hx:70, hy:47, hr:16.5, tx:12, ty:62, tr:6.5, ear:1.05};
  return {bx:44, by:70, brx:25, bry:19, qx:33, qy:72, qr:15, hx:66, hy:50, hr:16, tx:18, ty:65, tr:6, ear:1};
}

  if(M === 'unicorn') s += '<defs><linearGradient id="'+uid+'rb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3cf"/><stop offset=".35" stop-color="#fff2a6"/><stop offset=".7" stop-color="#bfe1ff"/><stop offset="1" stop-color="#d9c6ff"/></linearGradient></defs>';

let AC = null, musGain = null, sfxGain = null, musTimer = null, musArea = null, musStep = 0;

  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}

function plink(f, when, vol){ tone(f, 1.3, 'sine', vol || 0.3, when, musGain); tone(f * 2, 0.6, 'sine', (vol || 0.3) * 0.25, when, musGain); tone(f * 3, 0.25, 'triangle', (vol || 0.3) * 0.08, when, musGain); }

    case 'pop': tone(900, 0.08, 'sine', 0.3, t, null, 1600); break;

    case 'err': tone(260, 0.15, 'triangle', 0.14); tone(200, 0.2, 'triangle', 0.14, t + 0.1); break;

/* tiny generative music box: each area has its own scale and speed */
function musicStart(){
  if(!S || !S.mus || !audio()) { musicStop(); return; }
  if(musTimer && musArea === S.cur) return;
  musicStop();
  musArea = S.cur;
  const Ar = AREA(S.cur) || AREAS[0];
  const [scale, bpm] = Ar.music;
  const step = 60 / bpm / 2;
  const root = 523 * Math.pow(2, (AREAS.indexOf(Ar) - 1) / 12);
  const prog = [0, 3, 4, 2];
  musStep = 0;
  musTimer = setInterval(() => {
    if(!AC || AC.state !== 'running') return;
    const t = AC.currentTime + 0.05;
    const bar = Math.floor(musStep / 8) % 4, beat = musStep % 8;
    const chord = prog[bar];
    if(beat === 0) plink(root / 2 * Math.pow(2, scale[chord % scale.length] / 12), t, 0.22);
    if(beat !== 7 && Math.random() < (beat % 2 ? 0.35 : 0.75)){
      const deg = chord + [0, 2, 4, 2, 1, 3, 4, 2][beat] + (Math.random() < 0.2 ? 1 : 0);
      const oct = Math.floor(deg / scale.length);
      plink(root * Math.pow(2, (scale[deg % scale.length] + 12 * oct) / 12), t, 0.2);
    }
    musStep++;
  }, step * 1000);
}
function musicStop(){ if(musTimer) clearInterval(musTimer); musTimer = null; musArea = null; }
function audioUnlock(){ const A = audio(); if(A && A.state === 'suspended') A.resume(); musicStart(); }

function bindBun(a){
  let sx, sy, down = false, moved = false, timer = null;
  a.el.addEventListener('pointerdown', e => {
    e.stopPropagation(); down = true; moved = false; sx = e.clientX; sy = e.clientY;
    clearTimeout(timer);
    timer = setTimeout(() => { if(down && !moved){ down = false; sfx('tap'); openBun(a.id); } }, CONFIG.LONG_PRESS_MS);
  });
  a.el.addEventListener('pointermove', e => { if(down && Math.hypot(e.clientX - sx, e.clientY - sy) > 12){ moved = true; clearTimeout(timer); } });
  a.el.addEventListener('pointerup', () => { clearTimeout(timer); if(!down) return; down = false; if(moved) return; const b = bunById(a.id); if(b) petBun(b, a); });
  a.el.addEventListener('pointercancel', () => { clearTimeout(timer); down = false; });
  a.el.addEventListener('contextmenu', e => e.preventDefault());
}

function petBun(b, a){

  a.pet = t;
  addLove(b, CONFIG.PET_LOVE * (b.t === 'cuddly' ? 2 : 1));
  b.m.fun = Math.min(100, b.m.fun + CONFIG.PET_FUN);

/* ---------- the animation loop for bunnies ---------- */
function placeActor(a){
  a.el.style.left = a.x + '%'; a.el.style.top = a.y + '%';
  a.el.style.zIndex = Math.round(a.y * 10);
}
function stepActors(dt){
  const night = isNight();
  bunsIn(S.cur).forEach(b => {
    const a = actors[b.id]; if(!a) return;
    const sl = night && !a.zoom;
    if(sl){ a.tx = a.x; a.ty = a.y; }
    else if(b.follow && stageOf(b) === 0){
      const pa = actors[b.follow];
      if(pa){ const back = pa.flip ? 1 : -1; a.tx = pa.x + back * (6 + (b.id % 3) * 3); a.ty = pa.y + 1 + (b.id % 2); a.wait = 0; }
    }
    const dx = a.tx - a.x, dy = a.ty - a.y, dist = Math.hypot(dx, dy);
    let cls = sl ? 'sleep' : 'idle';
    if(dist > 0.4 && !sl){
      const sp = (stageOf(b) === 0 ? 9 : 7) * dt * (b.t === 'zoomy' || a.zoom ? 1.7 : 1);
      const m = Math.min(dist, sp);
      a.x += dx / dist * m; a.y += dy / dist * m * 0.8;
      a.flip = dx < -0.1 ? true : dx > 0.1 ? false : a.flip;
      cls = a.zoom || b.t === 'zoomy' ? 'zoom' : 'hop';
    } else if(!sl && !(b.follow && stageOf(b) === 0)){
      a.wait -= dt;
      if(a.wait <= 0){
        a.wait = rnd(2, 6);
        const bud = buddyOf(b);
        if(bud && bud.a === b.a && actors[bud.id] && Math.random() < 0.45){
          const fa = actors[bud.id]; a.tx = fa.x + (fa.flip ? -7 : 7); a.ty = fa.y + 0.5;
          if(Math.random() < 0.5) setTimeout(() => { fxAt((a.x + fa.x) / 2, Math.min(a.y, fa.y) - 12, '💞'); }, 1500);
        } else { const [nx, ny] = randLand(); a.tx = nx; a.ty = ny; }
        if(Math.random() < 0.06 && moodAvg(b) > 75) fxAtBun(b, '💕');
      }
    }
    if(a.cls !== cls){ a.el.classList.remove('idle','hop','zoom','sleep'); a.el.classList.add(cls); a.cls = cls; }
    a.el.style.transform = a.flip ? 'scaleX(-1)' : '';
    placeActor(a);
  });
}

/* ---------- toast + modal ---------- */
function toast(msg, kind){
  const t = document.createElement('div'); t.className = 'tst' + (kind ? ' ' + kind : ''); t.innerHTML = msg;
  const box = $('toast'); box.appendChild(t);
  while(box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.style.transition = 'opacity .4s'; t.style.opacity = 0; setTimeout(() => t.remove(), 400); }, 2600);
}
let modalOnClose = null, modalQueue = [];

/* ---------- daily gift (streak) ---------- */
function streakReward(n){ return {c: Math.round(Math.max(200, incomeFloor() * 200 * Math.min(n, 10))), g: n % 7 === 0 ? 10 : (n % 3 === 0 ? 2 : 0), food: n % 2 ? 'carrot' : 'berry'}; }
function checkDaily(){
  const today = dayNum(now());
  if(S.daily.last === today) return;
  if(S.daily.last !== null && today - S.daily.last > 1 && S.daily.streak > 0){
    S.daily.streak = 0;
    queueModal(() => showReward('🌱', tr('A fresh start!'), tr('Your streak starts again. Come back every day for bigger gifts!'), () => queueModal(dailyClaimModal)));
    return;
  }
  queueModal(dailyClaimModal);
}
function dailyClaimModal(){
  const today = dayNum(now()); if(S.daily.last === today) return;
  const n = S.daily.streak + 1, r = streakReward(n);
  let days = '<div class="row" style="justify-content:center;gap:4px;flex-wrap:wrap;margin:8px 0">';
  for(let i=Math.max(1, n-3); i<=n+3; i++) days += '<div class="tag" style="padding:6px 8px;'+(i===n?'background:var(--pink2);color:#fff':i<n?'background:var(--mint)':'')+'">'+tr('Day')+' '+i+'</div>';
  days += '</div>';
  openModal('🎁 ' + tr('Daily gift'), '<div class="reward"><div class="big">🧺</div><p>'+tr('Streak')+': <b>'+n+'</b> 🔥</p>'+days+'<div class="amt">+'+fmt(r.c)+' 🥕'+(r.g?' +'+r.g+' 💎':'')+' +3 '+FOODS[r.food].e+'</div></div><button class="btn wide gold" id="dyGo">'+tr('Claim')+'</button>', null, true);
  $('dyGo').onclick = () => { S.daily.streak = n; S.daily.last = today; addC(r.c); S.g += r.g; S.inv[r.food] = (S.inv[r.food] || 0) + 3; sfx('coin'); closeModal(); saveNow(); };
}

    '<button class="btn gold sm" id="upClo"'+(cMax?' disabled':'')+'>'+(cMax?'MAX':fmt(cloverCost(S.cur))+' 🥕')+'</button></div>';

    };

  M.querySelectorAll('[data-lure]').forEach(x => x.onclick = () => buyLure(x.dataset.lure));

  M.querySelectorAll('[data-out]').forEach(x => x.onclick = () => { const k = x.dataset.out, O = OUTFITS[k]; if(!pay(O.cur, O.price)) return; S.outfits[k] = 1; sfx('coin'); addXP(2); checkGoals(); toast(O.e + ' ' + tr('Hold a grown bunny, then Dress up')); renderMarket(); refreshTop(); saveNow(); });
  if($('goTown')) $('goTown').onclick = () => showView('Town');
  if(mTab === 'paid') bindPaidShop();
}
function oddsText(o){ return o.map((v, i) => v ? '<span style="color:'+RARITY[i].c+';font-weight:900">'+v+'%'+(i===4?'✨':'')+'</span>' : '').filter(Boolean).join(' '); }
function buyLure(k){
  const E = LURES[k], p = lurePrice(k);
  if(!pay(E.cur === 'g' ? 'g' : 'c', p)) return;
  if(E.cur !== 'g') S.luresBought[k] = (S.luresBought[k] || 0) + 1;
  addDoor(k); sfx('coin'); addXP(2);
  toast(E.e + ' ' + tr('A visitor is on the way!'), 'gold');
  renderMarket(); refreshTop(); saveNow();
}

/* =====================================================================
   10. MINI GAMES — Carrot Catch, Hop Race, Carrot Pull, Memory Match
   Each game: start → loop (update + draw) → gameOver(score)
===================================================================== */
let G = null;   // running game
const cv = () => $('gCanvas');
function svgImg(svg){ const i = new Image(); i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); return i; }
function playerBun(){ return (S.avatar && bunById(S.avatar)) || S.buns.find(b => stageOf(b) === 1) || S.buns[0] || {k:'nzwhite', grow:99999, o:{}}; }
function startGame(id){
  if(S.tickets < 1){ toast('🎟️ ' + tr('No tickets left. Wait a bit or use gems.'), 'err'); sfx('err'); showView('Games'); return; }
  if(S.tickets >= CONFIG.TICKETS_MAX) S.tkT = now();
  S.tickets--; S.stats.games++; taskCount('games'); saveNow();
  audioUnlock();
  document.body.classList.add('ingame');
  $('game').classList.add('on'); $('gOver').classList.remove('on'); $('memGrid').innerHTML = ''; $('memGrid').style.display = 'none';
  const c = cv(), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  G = {id, ctx, W: innerWidth, H: innerHeight, t: 0, score: 0, shake: 0, parts: [], over: false, last: performance.now(), bun: svgImg(bunSVG(playerBun(), {noShadow:true}))};
  ({catch: catchInit, race: raceInit, pull: pullInit, memory: memInit})[id]();
  if(id !== 'memory') requestAnimationFrame(gameLoop);
  tutEvent('game');
}
function gameLoop(ts){
  if(!G || G.over) return;
  const dt = Math.min(0.05, (ts - G.last) / 1000); G.last = ts; G.t += dt;
  G.update(dt);
  if(!G) return;
  const ctx = G.ctx; ctx.save();
  if(G.shake > 0){ G.shake -= dt; ctx.translate(rnd(-6, 6) * G.shake * 3, rnd(-6, 6) * G.shake * 3); }
  G.draw(ctx);
  G.parts = G.parts.filter(p => (p.life -= dt) > 0);
  G.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1; ctx.restore();
  requestAnimationFrame(gameLoop);
}
function burst(x, y, c, n){ for(let i=0;i<(n||10);i++){ const a = Math.random()*7, s = rnd(60, 220); G.parts.push({x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 80, r: rnd(2, 5), c: c || '#fff', life: 0.7, max: 0.7}); } }
function hud(html){ $('gHud').innerHTML = html + '<button class="pill" id="gQuit">✕</button>'; $('gQuit').onclick = () => gameOver(true); }
function emoji(ctx, e, x, y, size){ ctx.font = size + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y); }
function meadowBg(ctx, groundY){
  const g = ctx.createLinearGradient(0, 0, 0, G.H); g.addColorStop(0, '#ece4ff'); g.addColorStop(0.55, '#ffeef4'); g.addColorStop(1, '#fff6ea');
  ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
  ctx.fillStyle = '#d9c9f5'; ctx.beginPath(); ctx.moveTo(0, groundY - 30);
  for(let x=0;x<=G.W;x+=40) ctx.lineTo(x, groundY - 30 - Math.sin(x / 70) * 16 - 10);
  ctx.lineTo(G.W, groundY); ctx.lineTo(0, groundY); ctx.fill();
  const gg = ctx.createLinearGradient(0, groundY, 0, G.H); gg.addColorStop(0, '#cdeeb4'); gg.addColorStop(1, '#a9dc8f');
  ctx.fillStyle = gg; ctx.fillRect(0, groundY, G.W, G.H - groundY);
}
function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* ---------- CARROT CATCH ---------- */
function catchInit(){
  Object.assign(G, {x: G.W / 2, tx: G.W / 2, items: [], spawn: 0, lives: 3, pop: 0, speed: CONFIG.CATCH_SPEED});
  const c = cv();
  c.onpointerdown = c.onpointermove = e => { G.tx = e.clientX; };
  G.update = dt => {
    G.x += (G.tx - G.x) * Math.min(1, dt * 14);
    G.speed += CONFIG.CATCH_RAMP * dt;
    G.spawn -= dt;
    if(G.spawn <= 0){
      G.spawn = Math.max(0.32, 0.9 - G.t * 0.012);
      const r = Math.random();
      G.items.push({x: rnd(30, G.W - 30), y: -30, k: r < 0.08 ? 'gold' : r < 0.32 + Math.min(0.2, G.t * 0.004) ? 'rock' : 'carrot', vy: G.speed * rnd(0.85, 1.2), rot: rnd(-2, 2)});
    }
    const py = G.H - 90;
    G.items = G.items.filter(it => {
      it.y += it.vy * dt; it.rot += dt;
      if(Math.abs(it.y - py) < 34 && Math.abs(it.x - G.x) < 44){
        if(it.k === 'rock'){ G.lives--; G.shake = 0.35; sfx('err'); burst(it.x, it.y, '#8a8a99', 12); if(G.lives <= 0) setTimeout(() => gameOver(), 300); }
        else { const v = it.k === 'gold' ? 5 : 1; G.score += v; G.pop = 0.18; squeak(rnd(1.0, 1.3)); burst(it.x, it.y, it.k === 'gold' ? '#ffd23f' : '#ff9a4a', 10); }
        return false;
      }
      return it.y < G.H + 40;
    });
    if(G.pop > 0) G.pop -= dt;
    hud('<span class="pill">🥕 ' + G.score + '</span><span class="pill">' + '❤️'.repeat(Math.max(0, G.lives)) + '🤍'.repeat(Math.max(0, 3 - G.lives)) + '</span>');
  };
  G.draw = ctx => {
    meadowBg(ctx, G.H - 60);
    G.items.forEach(it => { ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot * 0.5); if(it.k === 'gold'){ ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 18; } emoji(ctx, it.k === 'rock' ? '🪨' : it.k === 'gold' ? '🌟' : '🥕', 0, 0, 38); ctx.restore(); });
    const s = 1 + (G.pop > 0 ? G.pop * 1.6 : 0);
    ctx.save(); ctx.translate(G.x, G.H - 90); ctx.scale(s, 2 - s);
    if(G.bun.complete) ctx.drawImage(G.bun, -45, -60, 90, 90);
    ctx.restore();
  };
}

/* ---------- HOP RACE ---------- */
function raceInit(){
  const lanes = 4;
  Object.assign(G, {lanes, cd: 3, racers: [], fin: [], startT: 0});
  for(let i=0;i<lanes;i++) G.racers.push({me: i === 0, d: 0, v: 0, base: rnd(...CONFIG.RACE_BOT), img: i === 0 ? G.bun : svgImg(bunSVG({k: pick(KINDS.filter(k => k.r < 3)).id, grow:99999, o:{}}, {noShadow:true})), done: 0, ph: rnd(0, 6)});
  cv().onpointerdown = () => {
    if(G.cd > 0 || G.over) return;
    const me = G.racers[0]; if(me.done) return;
    me.v = Math.min(26, me.v + CONFIG.RACE_TAP * 3); me.pop = 0.12; if(Math.random() < 0.25) sfx('hop');
  };
  G.update = dt => {
    if(G.cd > 0){ const before = Math.ceil(G.cd); G.cd -= dt; if(Math.ceil(G.cd) !== before) sfx(G.cd <= 0 ? 'coin' : 'tap'); if(G.cd <= 0) G.startT = G.t; hud('<span class="pill">🏁 ' + (G.cd > 0 ? Math.ceil(G.cd) : tr('GO!')) + '</span>'); return; }
    G.racers.forEach((r, i) => {
      if(r.done) return;
      if(r.me){ r.v = Math.max(0, r.v - 9 * dt); }
      else r.v = r.base + Math.sin(G.t * 2 + i) * 1.5;
      r.d += r.v * dt; r.ph += r.v * dt * 0.9; if(r.pop) r.pop = Math.max(0, r.pop - dt);
      if(r.d >= CONFIG.RACE_DIST){ r.done = G.t - G.startT; G.fin.push(r); if(r.me){ G.place = G.fin.length; G.time = r.done; sfx(G.place === 1 ? 'win' : 'coin'); setTimeout(() => gameOver(), 700); } }
    });
    const me = G.racers[0];
    hud('<span class="pill">🏁 ' + Math.min(CONFIG.RACE_DIST, Math.floor(me.d)) + '/' + CONFIG.RACE_DIST + 'm</span><span class="pill">⏱️ ' + (G.t - G.startT).toFixed(1) + 's</span>');
  };
  G.draw = ctx => {
    meadowBg(ctx, 100);
    const top = 110, lh = (G.H - top - 60) / G.lanes, fx = G.W - 50;
    for(let y = top, i = 0; y < top + lh * G.lanes; y += 16, i++){ ctx.fillStyle = i % 2 ? '#4b3f5c' : '#fff'; ctx.fillRect(fx, y, 8, 8); }
    for(let i=1;i<G.lanes;i++){ ctx.strokeStyle = '#ffffffaa'; ctx.setLineDash([10, 10]); ctx.beginPath(); ctx.moveTo(0, top + lh * i); ctx.lineTo(G.W, top + lh * i); ctx.stroke(); }
    ctx.setLineDash([]);
    G.racers.forEach((r, i) => {
      const x = 30 + (fx - 70) * Math.min(1, r.d / CONFIG.RACE_DIST), y = top + lh * i + lh / 2;
      const hopY = r.v > 1 && !r.done ? -Math.abs(Math.sin(r.ph)) * Math.min(18, lh * 0.25) : 0;
      const s = 1 + (r.pop || 0) * 2, sz = Math.min(70, lh * 0.9);
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = r.me ? '#f38fb355' : '#0001'; ctx.beginPath(); ctx.ellipse(0, sz * 0.3, sz * 0.4, sz * 0.1, 0, 0, 7); ctx.fill();
      ctx.translate(0, hopY); ctx.scale(s, 1);
      if(r.img.complete) ctx.drawImage(r.img, -sz / 2, -sz / 2 - 6, sz, sz);
      ctx.restore();
      if(r.v > 4 && G.cd <= 0 && Math.random() < 0.25) G.parts.push({x: x - sz / 2, y: y + sz * 0.25, vx: -60, vy: -40, r: 3, c: '#a9dc8f', life: 0.4, max: 0.4});
    });
    if(G.cd <= 0 && G.t - G.startT < 1.5){ ctx.fillStyle = '#4b3f5c'; ctx.font = '900 30px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(tr('Tap tap tap!'), G.W / 2, G.H - 30); }
  };
}

/* ---------- CARROT PULL (timing) ---------- */
function pullInit(){
  Object.assign(G, {tries: CONFIG.PULL_TRIES, pos: 0, dir: 1, zone: rnd(0.2, 0.8), zw: 0.26, sp: 0.9, got: [], msg: '', msgT: 0, pullT: 0, sprout: 0});
  cv().onpointerdown = () => {
    if(G.over || G.tries <= 0 || G.msgT > 0.9) return;
    G.tries--;
    const hit = Math.abs(G.pos - G.zone) < G.zw / 2;
    if(hit){
      const r = Math.random(); let c;
      if(r < 0.03) c = {e:'🧺', k:'lure'}; else if(r < 0.16) c = {e:'💎', k:'gem'}; else if(r < 0.45) c = {e:'🥕', k:'big'}; else c = {e:'🥕', k:'carrot'};
      G.got.push(c); G.score++; G.msg = c.e + ' ' + tr('Pulled!'); G.zw = Math.max(0.1, G.zw - 0.025); G.sp += 0.15;
      squeak(1.2); sfx('hop'); burst(G.W / 2, G.H * 0.62, '#ff9a4a', 16); G.pullT = 0.6; G.last_e = c;
    } else { G.msg = '🌱 ' + tr('Stuck!'); sfx('err'); G.shake = 0.2; }
    G.msgT = 1.1; G.zone = rnd(0.15, 0.85);
    if(G.tries <= 0) setTimeout(() => gameOver(), 1100);
  };
  G.update = dt => {
    G.pos += G.dir * G.sp * dt; if(G.pos > 1){ G.pos = 1; G.dir = -1; } if(G.pos < 0){ G.pos = 0; G.dir = 1; }
    if(G.msgT > 0) G.msgT -= dt; if(G.pullT > 0) G.pullT -= dt;
    hud('<span class="pill">🌱 ' + G.tries + '</span><span class="pill">' + (G.got.map(c => c.k === 'big' ? '🥕' : c.e).join('') || '…') + '</span>');
  };
  G.draw = ctx => {
    meadowBg(ctx, G.H * 0.5);
    // soil patch with leafy tops
    ctx.fillStyle = '#b98a5c'; roundRect(ctx, G.W * 0.2, G.H * 0.56, G.W * 0.6, 60, 30); ctx.fill();
    for(let i=0;i<5;i++) emoji(ctx, '🌿', G.W * (0.28 + i * 0.11), G.H * 0.56, 26);
    // bunny pulling
    const pull = G.pullT > 0 ? G.pullT : 0;
    if(G.bun.complete) ctx.drawImage(G.bun, G.W * 0.5 - 60, G.H * 0.56 - 108 - pull * 20, 96, 96);
    if(pull > 0 && G.last_e){ emoji(ctx, G.last_e.e, G.W * 0.5 + 30, G.H * 0.5 - pull * 120, G.last_e.k === 'big' ? 54 : 38); }
    // timing bar
    const bw = Math.min(G.W - 40, 420), bx0 = (G.W - bw) / 2, byy = G.H - 110;
    ctx.fillStyle = '#ffffffcc'; roundRect(ctx, bx0 - 6, byy - 6, bw + 12, 36, 18); ctx.fill();
    ctx.fillStyle = '#ffdbe8'; roundRect(ctx, bx0, byy, bw, 24, 12); ctx.fill();
    ctx.fillStyle = '#5cd6a5'; roundRect(ctx, bx0 + (G.zone - G.zw / 2) * bw, byy, G.zw * bw, 24, 12); ctx.fill();
    ctx.fillStyle = '#4b3f5c'; ctx.fillRect(bx0 + G.pos * bw - 3, byy - 8, 6, 40);
    ctx.font = '900 18px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#4b3f5c';
    ctx.fillText(tr('Tap when the line is in the green!'), G.W / 2, byy + 56);
    if(G.msgT > 0){ ctx.globalAlpha = Math.min(1, G.msgT * 2); ctx.font = '900 34px sans-serif'; ctx.fillStyle = '#4b3f5c'; ctx.fillText(G.msg, G.W / 2, G.H * 0.26); ctx.globalAlpha = 1; }
  };
}

/* ---------- MEMORY MATCH ---------- */
const MEM_ICONS = ['🥕','🌷','🌼','🍓','🌙','⭐','🍄','🌲','❄️','🍂','🌸','🧁','🎀','🎩','🫖','📚','🧶','🌈'];
function memInit(){
  const sizes = [[4,3],[4,4],[5,4]], [cols, rows] = sizes[Math.min(2, S.memLv)];
  const pairs = cols * rows / 2;
  const icons = MEM_ICONS.slice().sort(() => Math.random() - 0.5).slice(0, pairs);
  const deck = icons.concat(icons).sort(() => Math.random() - 0.5);
  Object.assign(G, {size: Math.min(2, S.memLv), cols, rows, deck, open: [], found: 0, pairs, moves: 0, lock: false});
  const ctx = G.ctx, g = ctx.createLinearGradient(0, 0, 0, G.H); g.addColorStop(0, '#ece4ff'); g.addColorStop(1, '#ffdbe8'); ctx.fillStyle = g; ctx.fillRect(0, 0, G.W, G.H);
  const grid = $('memGrid'); grid.style.display = 'grid';
  const cw = Math.min(72, Math.floor((G.W - 30) / cols) - 8);
  grid.style.gridTemplateColumns = 'repeat(' + cols + ',' + cw + 'px)';
  grid.innerHTML = deck.map((e, i) => '<button class="mc" data-i="'+i+'" style="width:'+cw+'px;height:'+Math.round(cw*1.18)+'px;font-size:'+Math.round(cw*0.5)+'px">🐰</button>').join('');
  const upd = () => hud('<span class="pill">🃏 ' + G.found + '/' + G.pairs + '</span><span class="pill">👆 ' + G.moves + '</span>');
  upd();
  grid.querySelectorAll('.mc').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if(G.lock || b.classList.contains('up') || b.classList.contains('done')) return;
    b.classList.add('up'); b.textContent = deck[i]; sfx('tap'); G.open.push(b);
    if(G.open.length === 2){
      G.moves++; const [a, c] = G.open;
      if(deck[+a.dataset.i] === deck[+c.dataset.i]){
        G.found++; G.score++; squeak(1.2); setTimeout(() => { a.classList.add('done'); c.classList.add('done'); }, 200); G.open = [];
        if(G.found === G.pairs){ G.won = true; setTimeout(() => gameOver(), 700); }
      } else { G.lock = true; setTimeout(() => { a.classList.remove('up'); c.classList.remove('up'); a.textContent = c.textContent = '🐰'; G.open = []; G.lock = false; }, 750); }
    }
    upd();
  });
}

/* ---------- game over + prizes ---------- */
function gameOver(quit){
  if(!G || G.over) return;
  G.over = true;
  const id = G.id, sc = G.score, inc = incomeFloor();
  let c = 0, gems = 0, items = [], best = false, line = '';
  if(id === 'catch'){ c = sc * inc * 6; if(sc > S.stats.best.catch){ S.stats.best.catch = sc; best = true; } const f = Math.floor(sc / 5); if(f){ S.inv.carrot += f; items.push('+' + f + ' ' + FOODS.carrot.e + ' ' + L(FOODS.carrot)); } line = '🥕 ' + sc; }
  if(id === 'race'){
    const p = G.place || 4; c = [0, 150, 70, 40, 20][p] * inc; line = ['', '🥇', '🥈', '🥉', '4'][p] + (G.time ? ' · ' + G.time.toFixed(2) + 's' : '');
    if(p === 1){ S.stats.raceWins++; if(Math.random() < 0.25) gems = 1; }
    if(G.time && (!S.stats.best.race || G.time * 1000 < S.stats.best.race)){ S.stats.best.race = Math.round(G.time * 1000); best = true; }
    G.score = 5 - p;
  }
  if(id === 'pull'){
    c = sc * inc * 10; if(sc > S.stats.best.pull){ S.stats.best.pull = sc; best = true; }
    G.got.forEach(x => {
      if(x.k === 'big') c += inc * 20;
      if(x.k === 'gem') gems++;
      if(x.k === 'lure') addDoor('clover');
    });
    const nc = G.got.filter(x => x.k === 'carrot' || x.k === 'big').length;
    if(nc){ S.inv.carrot += nc; items.push('+' + nc + ' ' + FOODS.carrot.e); }
    if(G.got.some(x => x.k === 'lure')) items.push('🍀 ' + tr('A visitor is on the way!'));
    line = '🌱 ' + sc + '/' + CONFIG.PULL_TRIES;
  }
  if(id === 'memory'){
    c = sc * inc * 15; line = '🃏 ' + sc + '/' + G.pairs;
    if(G.won){ S.stats.best.memory = Math.max(S.stats.best.memory, G.size + 1); if(S.memLv < 2) S.memLv++; c *= 1.5; items.push('✨ ' + tr('Bigger board next time!')); const fd = pick(FOOD_IDS); S.inv[fd] += 2; items.push('+2 ' + FOODS[fd].e); }
  }
  if(quit) c *= 0.5;
  c = Math.round(Math.max(sc > 0 ? 25 : 0, c));
  if(Math.random() < 0.08 && sc > 2) gems++;
  addC(c); S.g += gems; addXP(Math.min(25, 8 + sc));
  if(S.ev.id && sc > 0){ const e = Math.ceil(sc / 2); S.ev.cur += e; items.push('+' + e + ' ' + EVENTS[S.ev.id].cur); }
  checkGoals(); saveNow();
  $('gOverBox').innerHTML = '<div style="font-size:50px">' + (best ? '🏆' : GAMES.find(g => g.id === id).e) + '</div><h2 style="margin:6px 0">' + (best ? tr('New best!') : tr('Nice try!')) + '</h2>' +
    '<div style="font-size:1.4em;font-weight:900">' + line + '</div>' +
    '<div class="reward"><div class="amt">+' + fmt(c) + ' 🥕' + (gems ? ' +' + gems + ' 💎' : '') + '</div>' + items.join('<br>') + '</div>' +
    '<button class="btn wide" id="goAgain"' + (S.tickets < 1 ? ' disabled' : '') + '>🔁 ' + tr('Play again') + ' · 🎟️ ' + S.tickets + '</button>' +
    '<button class="btn wide ghost" id="goBack">' + tr('Back') + '</button>';
  $('gOver').classList.add('on');
  $('goAgain').onclick = () => startGame(id);
  $('goBack').onclick = closeGame;
}
function closeGame(){
  G = null; document.body.classList.remove('ingame'); $('game').classList.remove('on'); $('memGrid').style.display = 'none'; cv().onpointerdown = cv().onpointermove = null;
  refreshTop(); if(curView === 'Games') renderGames(); else if(curView === 'Bunnies') renderMeadow();
}

/* the one function the game calls. Resolves true if the player earned the reward. */
async function rewardAd(){
  if(S.noAds){ toast('✨ ' + tr('No-ads pass: reward given!'), 'gold'); return true; }
  if(adBusy) return false;
  adBusy = true;
  musicStop();
  let ok = false;
  try{ ok = AdMobP() ? await nativeAd() : await demoAd(); }catch(e){ ok = false; }
  adBusy = false;
  if(S.mus) musicStart();
  if(!ok) toast(tr('No reward this time'), 'err');
  return ok;
}
function nativeAd(){
  const A = AdMobP();
  return new Promise(async res => {
    let earned = false, finished = false, hs = [];
    const finish = () => { if(finished) return; finished = true; hs.forEach(h => { try{ h.remove(); }catch(e){} }); res(earned); };
    try{
      hs.push(await A.addListener('onRewardedVideoAdReward', () => { earned = true; }));
      hs.push(await A.addListener('onRewardedVideoAdDismissed', () => setTimeout(finish, 250)));
      hs.push(await A.addListener('onRewardedVideoAdFailedToShow', finish));
      await A.prepareRewardVideoAd({adId: MONEY.REWARDED_ID, isTesting: MONEY.TESTING});
      const item = await A.showRewardVideoAd();
      if(item && item.amount !== undefined) earned = true;
      setTimeout(finish, 600);
    }catch(e){ finish(); }
  });
}

  if(sku === NOADS.sku){

    if(S.starter) return '';
    S.starter = true; S.g += STARTER.gems; S.outfits[STARTER.outfit] = 1;
    const c = Math.round(Math.max(5000, incomeFloor() * 600)); addC(c);

/* ---------- Google Play ---------- */
let iapReady = false;
function iapStore(){ return window.CdvPurchase && CdvPurchase.store; }
function iapInit(){
  const C = window.CdvPurchase; if(!C || iapReady) return;
  const {store, ProductType, Platform} = C; iapReady = true;
  store.register(ALL_SKUS().map(id => ({id, type: CONSUMABLE(id) ? ProductType.CONSUMABLE : ProductType.NON_CONSUMABLE, platform: Platform.GOOGLE_PLAY})));

    .productUpdated(p => { if(p.pricing && p.pricing.price) PRICES[p.id] = p.pricing.price; })
    .approved(tx => {
      if(!S) return;
      if(!S.iapDone) S.iapDone = {};
      const tid = tx.transactionId || ('t' + now());
      if(!S.iapDone[tid]){
        S.iapDone[tid] = now();

  store.error(e => { if(e && e.code !== C.ErrorCode.PAYMENT_CANCELLED) toast(tr('Store error — please try again'), 'err'); });
  store.initialize([Platform.GOOGLE_PLAY]);
}

/* =====================================================================
   12. MAIN LOOP — game ticks, away time, tutorial, start-up
   tick(): once a second — moods, carrots, visitors, timers
   frame(): every screen frame — bunnies hop, golden bunny runs
===================================================================== */
function stepWorld(dt, t, offline){
  const night = isNight(t), rate = MOOD_RATE(), gm = globalMult(t);
  const tea = 1 - CONFIG.TEA_SLOW * S.shops.tea;
  let earned = 0;
  S.buns.forEach(b => {
    const ob = outfitBonus(b);
    const slow = Math.max(0.2, tea * (b.t === 'shy' ? 0.75 : 1) * (1 - ob.mood) * (buddyMap[b.id] ? 0.85 : 1));
    b.m.food = Math.max(0, b.m.food - rate * dt * slow * (b.t === 'greedy' ? 1.5 : 1));
    b.m.fur = Math.max(0, b.m.fur - rate * dt * slow * 0.8);
    if(S.weather.k !== 'snowy') b.m.fun = Math.max(0, b.m.fun - rate * dt * slow);
    if(b.grow < CONFIG.GROW_SEC){
      b.grow += dt * (0.5 + moodAvg(b) / 100);
      if(b.grow >= CONFIG.GROW_SEC && !offline){ b.follow = null; computeBuddies(); toast('🐰 ' + esc(b.n) + ' ' + tr('is all grown up!'), 'gold'); }
    }
    earned += bunRate(b, night) * gm * dt;
    if(!offline && b.t === 'lucky' && stageOf(b) === 1 && Math.random() < dt / 3600 * (1 + ob.luck)){ S.g++; toast('🍀 ' + esc(b.n) + ' ' + tr('found a gem!') + ' +1 💎', 'gold'); }
  });
  addC(earned);
  if(night) S.doors.forEach(d => { if(d.night) d.nightSec = (d.nightSec || 0) + dt; });
  if(S.doorBag.length && S.doors.length < CONFIG.DOOR_SLOTS){ const d = S.doorBag.shift(); d.start = t; S.doors.push(d); }
  return earned;
}
function pickWeather(t){
  const se = seasonOf(t);
  const opts = ['sunny','sunny','rainy','rainy','windy'].concat(se === 'winter' || S.cur === 'snow' ? ['snowy','snowy'] : se === 'spring' ? ['rainy'] : []);
  return pick(opts);
}
let tickN = 0;
function tick(){
  const t = now(), dt = 1;
  if(tickN % 5 === 0) computeBuddies();
  stepWorld(dt, t);
  S.stats.play += dt; tickN++;
  // tickets
  while(S.tickets < CONFIG.TICKETS_MAX && t - S.tkT >= CONFIG.TICKET_MIN * 60000){ S.tickets++; S.tkT += CONFIG.TICKET_MIN * 60000; }
  if(S.tickets >= CONFIG.TICKETS_MAX) S.tkT = t;
  // weather
  if(t > S.weather.until){
    S.weather = {k: pickWeather(t), until: t + rnd(...CONFIG.WEATHER_MIN) * 60000};
    wxKey = ''; renderWeather(); toast(WEATHER[S.weather.k].e + ' ' + L(WEATHER[S.weather.k]) + ' — ' + L(WEATHER[S.weather.k].d));
    if(S.weather.k === 'rainy') S.visitorAt = Math.min(S.visitorAt, t + 60000);
  }
  // holiday event
  const ev = activeEvent(t);
  if(ev !== S.ev.id){ S.ev = {id: ev, cur: ev && S.ev.lastId === ev ? S.ev.cur : 0, own: S.ev.own || {}, lastId: ev || S.ev.lastId}; if(ev) toast(EVENTS[ev].e + ' ' + L(EVENTS[ev]) + ' ' + tr('event is on!'), 'gold'); renderMeadow(); }
  if(S.ev.id && tickN % 60 === 0) S.ev.cur += Math.max(1, Math.floor(S.buns.length / 5));
  // rain + full moon visitors
  if(S.visitor && t > S.visitor.until){ S.visitor = null; S.visitorAt = t + rnd(...CONFIG.RAIN_VISITOR_MIN) * 60000; renderVisitor(); }
  if(!S.visitor && S.tut >= 99){
    if(fullMoonNight(t) && t > S.moonAt){ S.moonAt = t + CONFIG.MOON_VISITOR_EVERY_MIN * 60000; spawnVisitor(true); }
    else if(S.weather.k === 'rainy' && t > S.visitorAt){ S.visitorAt = t + rnd(...CONFIG.RAIN_VISITOR_MIN) * 60000; spawnVisitor(false); }
  }
  // free wild visitor
  if(t > S.freeAt && S.tut >= 3){ S.freeAt = t + CONFIG.FREE_VISITOR_MIN * 60000; if(doorFree()){ addDoor('wild'); toast('🌿 ' + tr('A wild bunny is hopping over!')); } }
  // golden bunny
  if(t > S.goldenAt){ S.goldenAt = t + rnd(...CONFIG.GOLDEN_BUN_MIN) * 60000 * (S.weather.k === 'windy' ? 0.5 : 1); if(S.tut >= 99) launchGolden(); }
  // daily tasks roll over at midnight
  if(tickN % 30 === 0){ const d = S.tasks.day; ensureTasks(); if(d !== S.tasks.day && curView === 'Bunnies') renderProf(); }
  if(tickN % 10 === 0){ checkGoals(); saveNow(); }
  // screen updates
  refreshTop();
  if(curView === 'Bunnies'){
    renderDoors();
    if(tickN % 5 === 0){ renderCare(); renderSide(); renderBunnies(); renderProf(); $('nightTint').style.opacity = isNight() ? 0.45 : 0; }
  }
  if(curView === 'Games' && tickN % 5 === 0 && !$('modalBg').classList.contains('on')) renderGames();
}
let lastFrame = performance.now();
function frame(ts){
  const dt = Math.min(0.1, (ts - lastFrame) / 1000); lastFrame = ts;
  if(S && curView === 'Bunnies' && !G){ stepActors(dt); stepGolden(dt); }
  if(S) tickCarrotDisplay();
  requestAnimationFrame(frame);
}

/* ---------- away time (bunnies keep making carrots and get hungry) ---------- */
function catchUp(){
  const t = now(), away = (t - (S.lastSeen || t)) / 1000;
  if(away < 60) return;
  computeBuddies();
  const steps = Math.min(Math.floor(away / 60), 7 * 24 * 60);
  let earned = 0, sim = S.lastSeen;
  for(let i=0;i<steps;i++){ sim += 60000; earned += stepWorld(60, sim, true); }
  const rest = away - steps * 60;
  if(rest > 0 && rest < 600) earned += stepWorld(rest, t, true);
  S.tkT = Math.min(S.tkT, t);
  if(t > S.freeAt && S.tut >= 3){ S.freeAt = t + CONFIG.FREE_VISITOR_MIN * 60000; if(doorFree()) addDoor('wild', {dur: 5}); }
  S.lastSeen = t;
  if(earned >= 1){
    S.awayLast = Math.round(earned);
    const hungry = S.buns.filter(b => b.m.food < 35).length;
    queueModal(() => {
      openModal('🌅 ' + tr('Welcome back!'), '<div class="reward"><div class="big">' + profSVG(90) + '</div><p>' + tr('You were away for {t}.', {t: fmtTime(away)}) + '</p><p>' + tr('Your bunnies made') + '</p><div class="amt">+' + fmt(S.awayLast) + ' 🥕</div>' +
        (hungry ? '<p class="muted">🥕 ' + tr('{n} bunnies are hungry. Feed them to make carrots faster!', {n: hungry}) + '</p>' : '') + '</div>' +
        '<button class="btn wide gold" id="wbOk">' + tr('Collect') + '</button>');
      $('wbOk').onclick = closeModal;
    });
  }
  saveNow();
}
